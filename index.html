<script>
// Groq API 前端直连
async function callGroqAPI(question) {
  // GROQ_KEY removed - use worker proxy
  const GROQ_MODEL = 'llama-3.1-8b-instant';
  
  const payload = JSON.stringify({
    model: GROQ_MODEL,
    messages: [{ role: 'user', content: question }],
    max_tokens: 500
  });
  
  const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + GROQ_KEY
    },
    body: payload
  });
  
  if (!response.ok) {
    throw new Error('API 调用失败: ' + response.status);
  }
  
  const json = await response.json();
  return json.choices[0].message.content;
}
</script>

<script>
// 入场动画：元素依次出现
(function(){
  var delay = 0;
  function anim(cls, ms) {
    var els = document.querySelectorAll(cls);
    els.forEach(function(el){
      el.style.setProperty('--delay', delay + 'ms');
      el.classList.add('animate-in');
      delay += ms;
    });
  }
  // header → tabbar → main content → cards
  anim('.app-header, header', 0);
  anim('#tabBar, .tab-bar, .bottom-nav, nav', 60);
  anim('#tab-home, #tab-interact, #tab-drugs, #tab-cabinet, #tab-symptom, .tab-content', 120);
  anim('.drug-card, .card', 80);
  anim('.search-box, .input-group, .btn-group', 60);

  // fab 自动出现
  var fab = document.querySelector('.fab, .camera-fab, #cameraFab, [id*=fab]');
  if (fab) fab.classList.add('animate-in');
})();
</script>

.toast.out{animation:toastOut .25s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(20px) scale(.92)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px) scale(.95)}}
/* 骨架屏 */
.skeleton{border-radius:var(--r-s);background:linear-gradient(90deg,#e8e8e8 25%,#f5f5f5 50%,#e8e8e8 75%);background-size:200% auto;animation:shimmer 1.8s linear infinite}
/* 空状态 */
.empty-state{text-align:center;padding:48px 24px;color:var(--c-text-3)}
.empty-state .es-icon{font-size:46px;margin-bottom:12px;opacity:.5}
.empty-state .es-text{font-size:14px;line-height:1.6}
/* 滚动条隐藏 */
::-webkit-scrollbar{width:0;height:0}
/* 加载点 */
.loading-dots::after{content:'';animation:dots 1.2s steps(4,end) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}100%{content:''}}
/* ripple */
@keyframes ripple{to{transform:scale(2.4);opacity:0}}
/* 深色模式 */
.dark{--c-bg:#0F1115;--c-card:#1A1D24;--c-text:#ECECEC;--c-text-2:#9CA0A8;--c-text-3:#6B6F76;--c-border:#2A2E37;--c-primary-l:#0E2A1C;--sh-1:0 1px 2px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.3);--sh-2:0 4px 16px rgba(0,0,0,.4)}
.dark header,.dark .tab-bar,.dark .bottom-nav{background:rgba(20,22,28,.80)}
.dark .card{background:var(--c-card);border-color:var(--c-border)}
.dark .search-box input,.dark input[type=text],.dark input[type=search]{background:#232730;color:var(--c-text);border-color:var(--c-border)}
.dark .btn-secondary{background:var(--c-card);color:var(--c-text)}
.dark #interactNet{background:#15181F}
.dark .chat-messages{background:#15181F}
.dark .skeleton{background:linear-gradient(90deg,#232730 25%,#2A2E37 50%,#232730 75%);background-size:200% auto}
</style>

<body>
<header>
  <h1 id="title">🌿 彩云智药</h1>
  <div style="display:flex;align-items:center;gap:10px">
    <span id="version" style="font-size:10px;opacity:.7">v5</span>
    <button class="lang-switch" id="langBtn" onclick="toggleLang()">🇬🇧 EN</button>
  </div>
</header>
<div class="tab-bar">
  <button class="tab-btn active" data-tab="home" id="tabHomeBtn">首页</button>
  <button class="tab-btn" data-tab="interact" id="tabInteractBtn">相互作用</button>
  <button class="tab-btn" data-tab="chat" id="tabChatBtn">智能问药</button>
    <button id="tabReportBtn" data-tab="report" class="tab-btn">📋 辨证报告</button>
  <button class="tab-btn" data-tab="cabinet" id="tabCabinetBtn" onclick="openCabinet()">💊 药箱</a>
</div>

<!-- 首页 -->
<div id="tab-home" class="tab-content active">
  <div class="card">
    <div class="card-title" id="searchTitle">🔍 智能搜索</div>
    <div class="search-box">
      <input id="searchInput" placeholder="输入药品、症状或问题,如:布洛芬能退烧吗、头痛吃什么...">
      <button class="btn-primary" id="searchBtn">搜索</button>
    </div>
    <div id="searchResult"></div>
  </div>
  <div class="card" style="margin-top:12px">
    <div class="card-head"><span class="card-title">🩺 症状搜药</span></div>
    <div style="display:flex;gap:8px">
      <input id="symptomInput" type="text" placeholder="输入症状，如：头痛、发烧、咳嗽..." style="flex:1;padding:10px 12px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;outline:none">
      <button onclick="searchBySymptom()" style="background:#2e7d32;color:#fff;border:none;padding:0 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer">搜索</button>
    </div>
    <div id="symptomResults" style="margin-top:12px"></div>
  </div>
  <div class="card" id="manualCard">
    <div class="card-title" id="featureTitle">📋 功能入口</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <button class="btn-secondary" onclick="switchTab('chat')" id="featChat">💬 AI 问药</button>
      <button class="btn-secondary" onclick="switchTab('chat')" id="featSymptom">🩺 症状咨询</button>
      <button class="btn-secondary" onclick="switchTab('chat')" id="featContra">⚠️ 用药禁忌</button>
      <button class="btn-secondary" onclick="switchTab('interact')" id="featInteract">💊 相互作用</button>
    </div>
  </div>
  <!-- 药品说明书查询 -->
  <div class="card" id="drugManualCard">
    <div class="card-title" id="manualCardTitle">📋 药品说明书查询</div>
    <div class="search-box" style="margin-bottom:8px">
      <input id="drugManualInput" placeholder="输入药品名称，如：布洛芬、阿莫西林、二甲双胍..." style="flex:1">
      <button class="btn-primary" id="drugManualBtn">查询</button>
    </div>
    <div id="drugManualResult"></div>
  </div>
</div>

<!-- 相互作用 -->
<div id="tab-interact" class="tab-content">
  <div class="card">
    <div class="card-title" id="interactTitle">💊 药物相互作用关系网</div>
    <div id="interactDetail" style="margin-bottom:10px;font-size:13px;color:#555;background:#f8f8f8;border-radius:8px;padding:8px"></div>
    <div style="text-align:center;margin-bottom:10px">
      <input id="drugInput1" placeholder="药物A,如:布洛芬" style="padding:7px 10px;border:2px solid #e0e0e0;border-radius:8px;width:38%;font-size:13px">
      <input id="drugInput2" placeholder="药物B(可选)" style="padding:7px 10px;border:2px solid #e0e0e0;border-radius:8px;width:38%;font-size:13px;margin-left:3px">
      <button class="btn-primary" id="interactBtn" style="padding:7px 12px;margin-left:3px;font-size:13px">查询</button>

    </div>
    <div id="interactNet"><div id="netDetailCard" class="net-detail-card"></div></div>
    <div id="interactLegend" style="display:flex;gap:12px;justify-content:center;margin-top:8px;font-size:11px;color:#999">
      <span id="legendDanger">🔴 禁忌</span><span id="legendCaution">🟡 注意</span><span id="legendGreen">🟢 可联用</span><span id="legendBlue">🔵 中性</span>
    </div>
  </div>
  <!-- 联合用药审查 -->
  <div class="card union-check-section" id="unionCheckSection">
    <div class="card-title" id="unionCheckTitle">💊 联合用药审查</div>
    <div class="union-drug-inputs" id="unionDrugInputs">
      <div class="union-drug-row" id="unionRow0">
        <div class="union-autocomplete" style="flex:1">
          <input type="text" placeholder="药物1,如:布洛芬" id="unionDrug0" oninput="unionAutocomplete(this,0)" onfocus="unionAutocomplete(this,0)">
          <div class="union-autocomplete-dropdown" id="unionDropdown0"></div>
        </div>
        <button class="remove-drug" style="visibility:hidden" onclick="removeUnionDrug(0)">×</button>
      </div>
      <div class="union-drug-row" id="unionRow1">
        <div class="union-autocomplete" style="flex:1">
          <input type="text" placeholder="药物2,如:阿司匹林" id="unionDrug1" oninput="unionAutocomplete(this,1)" onfocus="unionAutocomplete(this,1)">
          <div class="union-autocomplete-dropdown" id="unionDropdown1"></div>
        </div>
        <button class="remove-drug" style="visibility:hidden" onclick="removeUnionDrug(1)">×</button>
      </div>
    </div>
    <button class="union-btn-add" id="unionBtnAdd" onclick="addUnionDrug()">+ 添加药物</button>
    <button class="union-btn-check" id="unionBtnCheck" onclick="checkUnionDrugs()">🔍 一键审查</button>
    <div id="unionResultSummary"></div>
    <div class="union-result-matrix" id="unionResultMatrix"></div>
  </div>
</div>

<!-- 智能问药 -->
<div id="tab-chat" class="tab-content">
  <div class="card">
    <div class="card-title" id="chatTitle">💬 智能问药</div>
    <div class="search-box" style="margin-bottom:8px">
      <input id="chatInput" placeholder="输入药品或用药问题,如:布洛芬能和感冒药一起吃吗..." style="flex:1">
      <button class="btn-primary" id="chatSendBtn">🔍 查询</button>
    </div>
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:10px;font-size:13px;color:#666">
      <label style="cursor:pointer;display:flex;align-items:center;gap:4px"><input type="checkbox" id="thinkToggle" style="margin:0"> <span id="thinkToggleLabel">🧠 深度思考</span></label>
      <button onclick="openDrugCamera()" id="drugCameraBtn" style="background:#fff0f0;color:#e53935;border:1px solid #ffcdd2;padding:4px 10px;border-radius:16px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:4px">
        📷 <span id="cameraBtnLabel">拍照识别药品</span>
      </button>
      <span id="aiStatus" style="margin-left:auto;font-size:12px;color:#aaa"></span>
    </div>
    <div id="ocrLoading" style="display:none;text-align:center;padding:10px;color:#666;font-size:13px;background:#f8f9fa;border-radius:8px;margin-bottom:8px">
      <span id="ocrLoadingText">📷 正在识别中...</span>
    </div>
    <div id="ocrResult" style="display:none;margin-bottom:10px">
      <div style="background:#fff;border:1px solid #ffcdd2;border-radius:10px;padding:12px">
        <div style="font-size:13px;font-weight:600;color:#e53935;margin-bottom:6px" id="ocrResultTitle">📷 识别结果</div>
        <div id="ocrResultContent"></div>
        <div id="ocrMatchedDrug" style="margin-top:8px"></div>
      </div>
    </div>
<!-- AI配置已内置，无需用户操作 -->
    <div id="chatMessages" style="min-height:200px"></div>
  </div>
</div>


<div class="status-bar" id="statusBar">准备就绪</div>

// 智能匹配函数
function matchQuestion(question, lang){
  lang = lang || currentLang || 'zh';
  var q = question.trim();
  if(!q) return null;

  // 1. 先尝试精确关键词匹配(按类型优先级)
  var typePriority = ['相互作用', '用药指南', '饮食禁忌', '孕妇用药', '儿童用药', '老年人用药', '一般建议'];
  var matchedRules = [];

  for(var i=0; i<DRUG_QA_RULES.length; i++){
    var rule = DRUG_QA_RULES[i];
    var pattern = rule.pattern;
    if(pattern && pattern.test && pattern.test(q)){
      matchedRules.push(rule);
    }
  }

  if(matchedRules.length > 0){
    // 按类型优先级排序
    matchedRules.sort(function(a, b){
      var pa = typePriority.indexOf(a.type) || 99;
      var pb = typePriority.indexOf(b.type) || 99;
      return pa - pb;
    });
    var bestMatch = matchedRules[0];
    var response = typeof bestMatch.response === 'function' ? bestMatch.response(lang, q) : bestMatch.response;
    return { type: bestMatch.type, response: response };
  }

  // 2. 如果匹配到药物相互作用模式,调用现有searchInteractions
  // (已在规则11中处理)

  // 3. 如果匹配到用药指南查询,从DRUG_GUIDE读取
  // (已在规则12中处理)

  // 4. 都没匹配到
  return null;
}

// 从规则库随机选一条相关回答(增加多样性)
function getRandomRelatedResponse(question, lang){
  lang = lang || currentLang || 'zh';
  var matchedRules = [];
  for(var i=0; i<DRUG_QA_RULES.length; i++){
    if(DRUG_QA_RULES[i].pattern.test(question)){
      matchedRules.push(DRUG_QA_RULES[i]);
    }
  }
  if(matchedRules.length > 0){
    var randomRule = matchedRules[Math.floor(Math.random() * matchedRules.length)];
    var response = typeof randomRule.response === 'function' ? randomRule.response(lang, question) : randomRule.response;
    return { type: randomRule.type, response: response };
  }
  return null;
}

function findDrugManual(q){
  var ql = q.toLowerCase();
  var found = [];
  var checked = {};
  // 1. 精确匹配 DRUG_GUIDE
  if(DRUG_GUIDE[q]){
    checked[q] = 1;
    found.push(buildManualEntry(q, DRUG_GUIDE[q]));
  }
  // 2. 模糊匹配 DRUG_GUIDE key
  for(var k in DRUG_GUIDE){ if(!checked[k] && k.indexOf(ql)>=0){ checked[k]=1; found.push(buildManualEntry(k, DRUG_GUIDE[k])); }}
  // 3. 匹配 getLocalAnswer DB
  for(var k2 in getLocalAnswer._DB||{}){ if(!checked[k2] && k2.indexOf(ql)>=0){ checked[k2]=1; found.push(buildManualFromLocal(k2)); }}
  // 4. 匹配 INTERACT_DB
  for(var k3 in INTERACT_DB){ if(!checked[k3] && k3.indexOf(ql)>=0){ checked[k3]=1; found.push(buildManualFromInteract(k3)); }}
  // 5. 英文名别名
  var aliases = {'ibuprofen':'布洛芬','paracetamol':'对乙酰氨基酚','acetaminophen':'对乙酰氨基酚','aspirin':'阿司匹林','amoxicillin':'阿莫西林','metformin':'二甲双胍','omeprazole':'奥美拉唑','loratadine':'氯雷他定','cetirizine':'西替利嗪','atorvastatin':'阿托伐他汀','simvastatin':'辛伐他汀','amlodipine':'氨氯地平','nifedipine':'硝苯地平','losartan':'氯沙坦','insulin':'胰岛素','warfarin':'华法林'};
  if(aliases[ql] && !checked[aliases[ql]]){ var ak=aliases[ql]; checked[ak]=1; if(DRUG_GUIDE[ak]) found.push(buildManualEntry(ak, DRUG_GUIDE[ak])); else if(INTERACT_DB[ak]) found.push(buildManualFromInteract(ak)); }
  return found.slice(0, 5);
}

function buildManualEntry(name, g){
  return {name:name, cat:g.cat||'', indications:g.indications||'', dosage:g.dosage||'', contraindications:g.contraindications||'', warnings:(g.warn||[]).join('; '), foodAvoid:(g.food||[]).join('; '), drugAvoid:'', notes:g.note||'', time:g.time||''};
}

function buildManualFromLocal(name){
  var d = (getLocalAnswer._DB||{})[name];
  if(!d) return {name:name};
  return {name:name, cat:d.cat||'', warnings:d.warn?d.warn.join('; '):'', foodAvoid:d.food?d.food.join('; '):'', notes:d.note||'', time:d.time||''};
}

function buildManualFromInteract(name){
  var db = INTERACT_DB[name];
  if(!db) return {name:name};
  var contra=[], caution=[];
  (db.relations||[]).forEach(function(r){
    if(r.type==='danger') contra.push(r.drug+(r.desc?'('+r.desc+')':''));
    else if(r.type==='caution') caution.push(r.drug+(r.desc?'('+r.desc+')':''));
  });
  return {name:name, cat:db.category||'', drugAvoid:'⛔禁忌:'+contra.join('、')+' | ⚠️注意:'+caution.join('、'), notes:''};
}

var _svgDrag = {active:false, drug:null, ox:0, oy:0, dxSum:0, dySum:0};

// SVG坐标转viewBox坐标
function svgPoint(svg, clientX, clientY){
  var rect = svg.getBoundingClientRect();
  var W = parseFloat(svg.getAttribute('viewBox').split(' ')[2]);
  var H = parseFloat(svg.getAttribute('viewBox').split(' ')[3]);
  return {
    x: (clientX - rect.left) * W / rect.width,
    y: (clientY - rect.top) * H / rect.height
  };
}

// 重绘整个SVG关系网
function redrawSvgGraph(center, drugs, edges){
  var svg = document.getElementById('netGraphSvg');
  if(!svg) return;
  var svgHtml = '';
  var W = parseFloat(svg.getAttribute('viewBox').split(' ')[2]);
  var H = parseFloat(svg.getAttribute('viewBox').split(' ')[3]);

  // 连线
  edges.forEach(function(e){
    var p1=_posMap[e.from], p2=_posMap[e.to];
    if(!p1||!p2) return;
    var col=TYPE_COLOR[e.type]||'#888';
    var mx=(p1.x+p2.x)/2, my=(p1.y+p2.y)/2-12;
    svgHtml+='<path d="M'+p1.x.toFixed(1)+','+p1.y.toFixed(1)+' Q'+mx.toFixed(1)+','+my.toFixed(1)+' '+p2.x.toFixed(1)+','+p2.y.toFixed(1)+'" stroke="'+col+'" stroke-width="2" fill="none" opacity="0.65" pointer-events="none"/>';
  });

  // 节点圆
  drugs.forEach(function(d){
    var p=_posMap[d];
    if(!p) return;
    var isCenter=(d===center);
    var r=isCenter?20:14;
    var bColor=nodeBorderColor(d,center,edges);
    var fillCol=isCenter?'#e85d3f':bColor;
    var isDragging = _svgDrag.active && _svgDrag.drug===d;
    svgHtml+='<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+r+'" fill="'+fillCol+'" stroke="'+(isDragging?'#ffe066':'#fff')+'" stroke-width="'+(isDragging?'3.5':'2.5')+'" data-drug="'+d+'" style="cursor:pointer;filter:'+(isDragging?'brightness(1.2)':'url(#glow)')+'"/>';
    var fs=isCenter?13:11;
    var fw=isCenter?'bold':'600';
    var textY=p.y+(isCenter?5:4);
    svgHtml+='<text x="'+p.x.toFixed(1)+'" y="'+textY.toFixed(1)+'" fill="#fff" font-size="'+fs+'" font-weight="'+fw+'" text-anchor="middle" dominant-baseline="middle" style="pointer-events:none">'+drugLabel(d)+'</text>';
  });

  svgHtml='<defs><filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>'+svgHtml;
  svg.innerHTML = svgHtml;
}

// 紧凑环形关系网绘制（可拖拽节点 + 点击弹出详情）
function drawCompactGraph(center, drugs, edges){
  var svg = document.getElementById('netGraphSvg');
  if(!svg) return;
  var W = 700;
  var H = parseInt(svg.getAttribute('viewBox').split(' ')[3]);
  var cx = W/2, cy = H/2;
  var radius = Math.min(W,H)*0.36;
  var count = drugs.length - 1;

  // 初始化环形位置
  _posMap[center] = {x:cx,y:cy};
  for(var i=0;i<count;i++){
    var d = drugs[i+1];
    var angle = (2*Math.PI*i)/Math.max(1,count) - Math.PI/2;
    _posMap[d] = {x:cx+Math.cos(angle)*radius, y:cy+Math.sin(angle)*radius};
  }

  // 初始渲染
  redrawSvgGraph(center, drugs, edges);

  // 当前点击的目标（区分点击和拖拽）
  var _clickTarget = null;

  // SVG事件：mousedown记录目标、mousemove拖拽、mouseup判断点击还是拖拽
  svg.onmousedown = function(e){
    var target = e.target;
    if(target.tagName !== 'circle') return;
    var drug = target.getAttribute('data-drug');
    if(!drug) return;
    e.preventDefault();
    _svgDrag.active = true;
    _svgDrag.drug = drug;
    _svgDrag.ox = e.clientX;
    _svgDrag.oy = e.clientY;
    _svgDrag.dxSum = 0;
    _svgDrag.dySum = 0;
    _clickTarget = target;
    redrawSvgGraph(center, drugs, edges);
  };

  svg.onmousemove = function(e){
    if(!_svgDrag.active) return;
    e.preventDefault();
    var rect = svg.getBoundingClientRect();
    var scaleX = W / rect.width;
    var scaleY = H / rect.height;
    var dx = (e.clientX - _svgDrag.ox) * scaleX;
    var dy = (e.clientY - _svgDrag.oy) * scaleY;
    _svgDrag.dxSum += Math.abs(e.clientX - _svgDrag.ox);
    _svgDrag.dySum += Math.abs(e.clientY - _svgDrag.oy);
    var d = _svgDrag.drug;
    if(!_posMap[d]) return;
    _posMap[d] = {x: _posMap[d].x + dx, y: _posMap[d].y + dy};
    _svgDrag.ox = e.clientX;
    _svgDrag.oy = e.clientY;
    redrawSvgGraph(center, drugs, edges);
  };

  svg.onmouseup = function(){
    if(!_svgDrag.active) return;
    var drug = _svgDrag.drug;
    var wasDrag = (_svgDrag.dxSum > 5 || _svgDrag.dySum > 5);
    _svgDrag.active = false;
    _svgDrag.drug = null;
    redrawSvgGraph(center, drugs, edges);
    // 点击（未拖拽）→ 弹出详情
    if(!wasDrag && drug){
      var nd = _clickTarget || document.createElement('div');
      showNodeDetail(nd, drug);
    }
    _clickTarget = null;
  };

  svg.onmouseleave = function(){
    if(_svgDrag.active){
      _svgDrag.active = false;
      _svgDrag.drug = null;
      _clickTarget = null;
      redrawSvgGraph(center, drugs, edges);
    }
  };
}

    '</div>' +
    '<button class="remove-drug" onclick="removeUnionDrug(' + _unionDrugCount + ')">×</button>';

  updateUnionRemoveButtons();

}

function removeUnionDrug(index){
  if(_unionDrugCount <= _unionMinDrugs) return;
  var row = document.getElementById('unionRow' + index);
  if(row) row.remove();
  _unionDrugCount--;
  reindexUnionDrugs();
  updateUnionRemoveButtons();
  var btnAdd = document.getElementById('unionBtnAdd');
  if(btnAdd) btnAdd.disabled = (_unionDrugCount >= _unionMaxDrugs);
}

function reindexUnionDrugs(){
  var inputs = document.querySelectorAll('#unionDrugInputs input[type="text"]');
  for(var i=0; i<inputs.length; i++){
    inputs[i].id = 'unionDrug' + i;
    var ph = T[currentLang].unionDrugPlaceholder + (i+1) + (currentLang==='zh' ? ',如:布洛芬' : ', e.g. Ibuprofen');
    inputs[i].placeholder = ph;
    var autocompleteDiv = inputs[i].parentElement;
    autocompleteDiv.querySelector('.union-autocomplete-dropdown').id = 'unionDropdown' + i;
    autocompleteDiv.parentElement.id = 'unionRow' + i;
    autocompleteDiv.parentElement.querySelector('.remove-drug').onclick = (function(idx){ return function(){ removeUnionDrug(idx); }; })(i);
    inputs[i].oninput = (function(idx){ return function(){ unionAutocomplete(this, idx); }; })(i);
    inputs[i].onfocus = (function(idx){ return function(){ unionAutocomplete(this, idx); }; })(i);
  }
}

function updateUnionRemoveButtons(){
  var buttons = document.querySelectorAll('#unionDrugInputs .remove-drug');
  buttons.forEach(function(btn, idx){
    btn.style.visibility = (idx >= _unionMinDrugs) ? 'visible' : 'hidden';
  });
}

function unionAutocomplete(input, index){
  var val = input.value.trim();
  var dropdown = document.getElementById('unionDropdown' + index);
  if(!dropdown) return;
  input.dataset.userModified = 'true';
  if(!val){
    dropdown.classList.remove('show');
    dropdown.innerHTML = '';
    return;
  }
  var matches = [];
  for(var key in DRUG_NAME_MAP){
    var keyLower = key.toLowerCase();
    var valLower = val.toLowerCase();
    var mapLower = DRUG_NAME_MAP[key].toLowerCase();
    if(keyLower.indexOf(valLower) !== -1 || mapLower.indexOf(valLower) !== -1){
      matches.push(key);
    }
  }
  if(matches.length === 0){
    dropdown.classList.remove('show');
    dropdown.innerHTML = '';
    return;
  }
  dropdown.innerHTML = '';
  matches.slice(0, 10).forEach(function(drug){
    var div = document.createElement('div');
    div.textContent = drug + ' (' + DRUG_NAME_MAP[drug] + ')';
    div.onclick = (function(drugName){ return function(){
      input.value = drugName;
      dropdown.classList.remove('show');
      dropdown.innerHTML = '';
    }; })(drug);
    dropdown.appendChild(div);
  });
  dropdown.classList.add('show');
}

if(!window._unionClickBound){
  window._unionClickBound = true;
  document.addEventListener('click', function(e){
    if(!e.target.closest('.union-autocomplete')){
      document.querySelectorAll('.union-autocomplete-dropdown').forEach(function(dd){
        dd.classList.remove('show');
      });
    }
  });
}

function checkUnionDrugs(){
  var drugs = [];
  for(var i=0; i<_unionDrugCount; i++){
    var inp = document.getElementById('unionDrug' + i);
    if(inp && inp.value.trim()){
      drugs.push(inp.value.trim());
    }
  }
  if(drugs.length < 2){
    var msg = (currentLang==='en') ? 'Please enter at least 2 drugs' : '请至少输入2种药物';
    var summaryDiv = document.getElementById('unionResultSummary');
    if(summaryDiv) summaryDiv.innerHTML = '<div class="error">' + msg + '</div>';
    var matrixDiv = document.getElementById('unionResultMatrix');
    if(matrixDiv) matrixDiv.innerHTML = '';
    return;
  }
  var results = [];
  var dangerCount = 0, cautionCount = 0, safeCount = 0, noDataCount = 0;
  for(var i=0; i<drugs.length; i++){
    for(var j=i+1; j<drugs.length; j++){
      var d1 = drugs[i], d2 = drugs[j];
      var info = null;
      var type = 'blue';
      if(INTERACT_DB[d1] && INTERACT_DB[d1][d2]){
        info = INTERACT_DB[d1][d2];
        type = info.type;
      } else if(INTERACT_DB[d2] && INTERACT_DB[d2][d1]){
        info = INTERACT_DB[d2][d1];
        type = info.type;
      }
      if(type === 'danger') dangerCount++;
      else if(type === 'caution') cautionCount++;
      else if(type === 'green') safeCount++;
      else noDataCount++;
      results.push({ drug1: d1, drug2: d2, type: type, info: info });
    }
  }
  var t = T[currentLang];
  var summaryHtml = '<div class="union-result-summary">';
  summaryHtml += '<strong>' + t.unionResultSummary + ' ' + drugs.length + ' ' + ((currentLang==='en') ? 'drugs' : '种药物') + '</strong>:';
  summaryHtml += '<span style="color:' + TYPE_COLOR['danger'] + '">' + dangerCount + t.unionDangerCount + '</span>,';
  summaryHtml += '<span style="color:' + TYPE_COLOR['caution'] + '">' + cautionCount + t.unionCautionCount + '</span>。<br>';
  summaryHtml += drugs.join('、') + ((currentLang==='en') ? ' are checked.' : t.unionChecked+' ');
  summaryHtml += '</div>';
  var summaryDiv = document.getElementById('unionResultSummary');
  if(summaryDiv) summaryDiv.innerHTML = summaryHtml;
  showUnionMatrix(drugs, results);
}

function showUnionMatrix(drugs, results){
  var t = T[currentLang];
  var matrixHtml = '<table>';
  matrixHtml += '<tr><th></th>';
  drugs.forEach(function(drug){
    matrixHtml += '<th>' + drugLabel(drug) + '</th>';
  });
  matrixHtml += '</tr>';
  for(var i=0; i<drugs.length; i++){
    matrixHtml += '<tr>';
    matrixHtml += '<th>' + drugLabel(drugs[i]) + '</th>';
    for(var j=0; j<drugs.length; j++){
      if(i === j){
        matrixHtml += '<td style="background:#f5f5f5"></td>';
      } else {
        var result = null;
        for(var r=0; r<results.length; r++){
          if((results[r].drug1 === drugs[i] && results[r].drug2 === drugs[j]) ||
             (results[r].drug1 === drugs[j] && results[r].drug2 === drugs[i])){
            result = results[r];
            break;
          }
        }
        if(result){
          var bgColor = TYPE_COLOR[result.type] || '#4488ff';
          var text = '';
          if(result.type === 'danger') text = '🔴';
          else if(result.type === 'caution') text = '🟡';
          else if(result.type === 'green') text = '🟢';
          else text = '🔵';
          var escapedDrug1 = result.drug1.replace(/'/g, "\\'");
          var escapedDrug2 = result.drug2.replace(/'/g, "\\'");
          var infoStr = 'null';
          if(result.info){
            infoStr = JSON.stringify(result.info);
            infoStr = infoStr.replace(/"/g, '\\"');
          }
          var onclick = "showUnionDetail('" + escapedDrug1 + "','" + escapedDrug2 + "','" + result.type + "','" + infoStr + "')";
          matrixHtml += '<td style="background:' + bgColor + '22;cursor:pointer" onclick="' + onclick + '">' + text + '</td>';
        } else {
          matrixHtml += '<td style="background:#f5f5f5"></td>';
        }
      }
    }
    matrixHtml += '</tr>';
  }
  matrixHtml += '</table>';
  matrixHtml += '<div style="display:flex;gap:12px;justify-content:center;margin-top:8px;font-size:11px;color:#999">';
  matrixHtml += '<span>🔴 ' + t.unionContraindicated + '</span>';
  matrixHtml += '<span>🟡 ' + t.unionCaution + '</span>';
  matrixHtml += '<span>🟢 ' + t.unionSafe + '</span>';
  matrixHtml += '<span>🔵 ' + t.unionNeutral + '</span>';
  matrixHtml += '</div>';
  var matrixDiv = document.getElementById('unionResultMatrix');
  if(matrixDiv) matrixDiv.innerHTML = matrixHtml;
}

function showUnionDetail(drug1, drug2, type, infoStr){
  var existing = document.querySelector('.union-detail-popup');
  if(existing) existing.remove();
  var t = T[currentLang];
  var popup = document.createElement('div');
  popup.className = 'union-detail-popup show';
  var title = drugLabel(drug1) + ' + ' + drugLabel(drug2);
  var typeLabel = '';
  var typeColor = TYPE_COLOR[type] || '#4488ff';
  if(type === 'danger') typeLabel = '🔴 ' + t.unionContraindicated;
  else if(type === 'caution') typeLabel = '🟡 ' + t.unionCaution;
  else if(type === 'green') typeLabel = '🟢 ' + t.unionSafe;
  else typeLabel = '🔵 ' + t.unionNeutral;
  var html = '<div class="close-btn" onclick="this.parentElement.remove()">×</div>';
  html += '<div class="dc-title">' + title + '</div>';
  html += '<div style="margin-bottom:10px"><span class="dc-badge" style="background:' + typeColor + '">' + typeLabel + '</span></div>';
  var info = null;
  try { if(infoStr && infoStr !== 'null') info = JSON.parse(infoStr); } catch(e) {}
  if(info && info.text){
    html += '<div style="font-size:13px;color:#555;line-height:1.6">' + ((currentLang==='en') ? info.en : info.text) + '</div>';
  } else {
    html += '<div style="font-size:13px;color:#999">' + t.unionNeutral + '</div>';
  }
  popup.innerHTML = html;
  document.body.appendChild(popup);
  setTimeout(function(){
    document.addEventListener('click', function handler(e){
      if(!popup.contains(e.target) && !e.target.closest('td[onclick*="showUnionDetail"]')){
        popup.remove();
        document.removeEventListener('click', handler);
      }
    });
  }, 100);
}

    return currentLang==='en' ? '【Insomnia Medication Guide】\n\n1. Benzodiazepines (Diazepam/Estazolam/Alprazolam): Addictive; shortest duration only (2-4 weeks)\n2. Non-benzodiazepines (Eszopiclone/Zolpidem): Lower addiction risk, still short-term only\n3. ⚠️ Avoid alcohol (enhances CNS depression, can be fatal)\n4. Avoid caffeine, exercise, blue light before bed\n5. Regular schedule; relax 1h before bed\n6. Insomnia >1 month → see doctor; rule out anxiety/depression\n7. ⚠️ Elderly: use with caution (fall risk, cognitive decline)' : '【失眠用药建议】\n\n1. 苯二氮䓬类(地西泮/艾司唑仑/阿普唑仑):有成瘾性,应按最短疗程使用(通常2-4周)\n2. 非苯二氮䓬类(右佐匹克隆/唑吡坦):成瘾性较低,但仍需短期使用\n3. ⚠️ 避免饮酒(加重中枢抑制,可致命)\n4. 睡前避免咖啡因、剧烈运动、蓝光照射(手机/电脑)\n5. 建立规律作息时间,睡前1小时放松(热水澡/冥想/阅读)\n6. 失眠>1个月请就医,排除焦虑/抑郁等根本原因\n7. ⚠️ 老年人慎用镇静催眠药(跌倒风险、认知功能下降)';

    }

  // Section helper
  function sec(icon, title, content, color) {
    if (!content) return '';
    if (Array.isArray(content) && content.length === 0) return '';
    var c = Array.isArray(content) ? content.join('<br>') : content;
    return '<div style="margin-bottom:12px"><div style="font-weight:700;color:' + (color||'#2e7d32') + ';font-size:14px;margin-bottom:4px;display:flex;align-items:center;gap:6px"><span>' + icon + '</span> ' + title + '</div><div style="color:#444;padding-left:20px">' + c + '</div></div>';
  }
  if (d.indications) html += sec('💊', '适应症', d.indications, '#1976d2');
  if (d.ingredients) html += sec('🧪', '成分', d.ingredients, '#7b1fa2');
  if (d.dosage) html += sec('📝', '用法用量', d.dosage, '#e65100');
  if (d.time) html += sec('⏰', '服药时间', d.time, '#00796b');
  if (d.adverse) html += sec('⚡', '不良反应', d.adverse, '#c62828');
  if (d.contraindications) html += sec('🚫', '禁忌', d.contraindications, '#d32f2f');
  if (d.notes) html += sec('⚠️', '注意事项', d.notes, '#f57c00');
  if (d.foodAvoid && d.foodAvoid.length) html += sec('🍎', '饮食禁忌', d.foodAvoid.join('、'), '#ef6c00');
  if (d.drugAvoid && d.drugAvoid.length) html += sec('💊', '药物相互作用', d.drugAvoid.join('、'), '#4527a0');
  if (d.storage) html += sec('🏠', '贮藏', d.storage, '#546e7a');
  html += '</div>';
  resultDiv.innerHTML = html;
}

function openDrugCamera() {
  var fi = document.createElement('input');
  fi.type = 'file';
  fi.accept = 'image/*';
  fi.capture = 'environment';
  fi.onchange = function(ev) {
    var file = ev.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(evt) { runDrugOCR(evt.target.result); };
    reader.readAsDataURL(file);
  };
  fi.click();
}

function runDrugOCR(imageDataUrl) {
  var loadingDiv = document.getElementById('ocrLoading');
  var resultDiv = document.getElementById('ocrResult');
  var contentDiv = document.getElementById('ocrResultContent');
  var matchedDiv = document.getElementById('ocrMatchedDrug');

  loadingDiv.style.display = 'block';
  resultDiv.style.display = 'none';
  matchedDiv.innerHTML = '';
  matchedDiv.style.display = 'none';
  document.getElementById('ocrLoadingText').textContent = '📷 正在识别药品图片，请稍候...';

  if (typeof Tesseract === 'undefined') {
    loadingDiv.style.display = 'none';
    resultDiv.style.display = 'block';
    contentDiv.innerHTML = '<p style="color:#e53935;font-size:13px">OCR库未加载，请在联网环境下使用拍照识别功能</p>';
    return;
  }

  Tesseract.recognize(imageDataUrl, 'eng+chi_sim', {
    logger: function(m) {
      if (m.status === 'recognizing text') {
        var pct = Math.round((m.progress || 0) * 100);
        document.getElementById('ocrLoadingText').textContent = '📷 识别中 ' + pct + '%...';
      }
    }
  }).then(function(res) {
    loadingDiv.style.display = 'none';
    resultDiv.style.display = 'block';
    var text = (res.data.text || '').trim();
    if (!text) {
      contentDiv.innerHTML = '<p style="color:#999;font-size:13px">未能在图片中识别到文字，请确保药品包装图片清晰，包含药品名称</p>';
      return;
    }
    contentDiv.innerHTML = '<p style="font-size:12px;color:#888;margin-bottom:6px">识别文字：</p><pre style="font-size:12px;background:#f5f5f5;border-radius:6px;padding:8px;line-height:1.6;white-space:pre-wrap;word-break:break-all;font-family:inherit">' + text + '</pre>';

    // Match drug names
    var matchedDrugs = [];
    Object.keys(DRUG_GUIDE).forEach(function(name) {
      var _ocrM = matchDrugsFromOCRText(text);
    _ocrM.forEach(function(n){ matchedDrugs.push(n); });
    Object.keys(DRUG_GUIDE).forEach(function(name) {
      if (_ocrM.indexOf(name) === -1 && text.toLowerCase().indexOf(name.toLowerCase()) !== -1) matchedDrugs.push(name);
    });
    });

    if (matchedDrugs.length > 0) {
      matchedDiv.style.display = 'block';
      var h = '<div style="margin-top:8px;padding:10px;background:#e8f5e9;border-radius:8px">';
      h += '<p style="font-size:13px;font-weight:600;color:#2e7d32;margin-bottom:8px">🔍 识别到以下药品，点击查看详情：</p>';
      matchedDrugs.slice(0, 5).forEach(function(name) {
        var d = DRUG_GUIDE[name];
        h += '<div style="margin-bottom:8px;padding:8px;background:#fff;border-radius:6px;cursor:pointer" onclick="document.getElementById(\x27drugManualInput\x27).value=\x27\x27 + name + \x27\x27;searchDrugManual();switchTab(\x27home\x27)">'
        h += '<div style="font-weight:700;color:#2e7d32">💊 ' + name + '</div>';
        if (d.cat) h += '<div style="font-size:12px;color:#888;margin-top:2px">' + d.cat + '</div>';
        if (d.warn && d.warn.length) h += '<div style="font-size:12px;color:#e53935;margin-top:4px">⚠️ ' + d.warn[0] + '</div>';
        h += '</div>';
      });
      h += '</div>';
      matchedDiv.innerHTML = h;
    } else {
      matchedDiv.style.display = 'block';
      matchedDiv.innerHTML = '<div style="margin-top:8px;padding:10px;background:#fff8e1;border-radius:8px;font-size:13px;color:#888">未在识别文字中匹配到已知药品名。您可将识别文字复制到首页"药品说明书查询"框中搜索</div>';
    }
  }).catch(function(err) {
    loadingDiv.style.display = 'none';
    resultDiv.style.display = 'block';
    contentDiv.innerHTML = '<p style="color:#e53935;font-size:13px">识别失败: ' + (err.message || '未知错误') + '，请重试</p>';
  });
}

function stripDosageForm(name) {
  return name.replace(/(缓释|控释|肠溶|分散|普通|薄膜衣|糖衣|胶囊|片|颗粒|口服液|口服溶液|注射液|粉针|粉|膏|软膏|乳膏|凝胶|糖浆|滴丸|含片|泡腾片|软胶囊|滴剂|贴剂|栓剂|气雾剂|喷雾剂|混悬液|混悬滴剂|干混悬剂|缓释胶囊|缓释片|控释片|口崩片|咀嚼片|分散片|肠溶片|肠溶胶囊|阴??道?片|阴道?软胶囊)$/g, '').trim();
}

function fuzzyMatchDrug(input) {
  if (!input || !window.DRUG_GUIDE) return null;
  input = (input || '').trim().replace(/药$/,'');
  if (!input) return null;
  var lower = input.toLowerCase();

  // 1. 精确匹配
  if (DRUG_GUIDE[input]) return input;

  // 2. 去除剂型后匹配
  var stripped = stripDosageForm(input);
  if (DRUG_GUIDE[stripped]) return stripped;
  for (var k in DRUG_GUIDE) {
    if (stripDosageForm(k) === stripped) return k;
  }

  // 3. 品牌名/商品名匹配
  if (DRUG_BRAND_ALIAS[lower]) return DRUG_BRAND_ALIAS[lower];
  if (DRUG_BRAND_ALIAS[stripped.toLowerCase()]) return DRUG_BRAND_ALIAS[stripped.toLowerCase()];
  for (var ba in DRUG_BRAND_ALIAS) {
    if (DRUG_BRAND_ALIAS[ba].toLowerCase() === lower) return DRUG_BRAND_ALIAS[ba];
    if (ba.toLowerCase().indexOf(lower) >= 0) return DRUG_BRAND_ALIAS[ba];
  }

  // 4. 包含匹配（输入包含药名 或 药名包含输入）
  for (var k2 in DRUG_GUIDE) {
    var kl = k2.toLowerCase();
    if (kl.indexOf(lower) >= 0 || lower.indexOf(kl) >= 0) return k2;
  }

  return null;
}

// 从 OCR 文本中匹配药品
function matchDrugsFromOCRText(text) {
  if (!text || !window.DRUG_GUIDE) return [];
  var matched = {};
  var lines = text.split(/[\n\r\s，,。.、；;:：]+/);
  lines.forEach(function(line) {
    line = line.trim();
    if (line.length < 2) return;
    var fm = fuzzyMatchDrug(line);
    if (fm && !matched[fm]) matched[fm] = true;
  });
  // 也做整体包含匹配
  for (var k in DRUG_GUIDE) {
    if (text.toLowerCase().indexOf(k.toLowerCase()) >= 0 && !matched[k]) matched[k] = true;
  }
  return Object.keys(matched);
}

// ===== 症状搜药 =====
function searchBySymptom() {
  var input = document.getElementById('symptomInput');
  if (!input) return;
  var query = input.value.trim();
  if (!query) { showToast('请输入症状'); return; }
  showToast('🔍 正在匹配药品...');
  var results = matchDrugsBySymptom(query);
  showSymptomResults(query, results);
}

function matchDrugsBySymptom(query) {
  if (!window.DRUG_GUIDE) return [];
  var rawKw = query.toLowerCase().split(/[\s,，、]+/).filter(function(k){return k.length >= 1;});
  var keywords = [];
  rawKw.forEach(function(k){
    k = k.replace(/药$/,'');  // 剥掉结尾的"药"字
    keywords.push(k);
    if (DRUG_SYNONYMS[k]) keywords.push(DRUG_SYNONYMS[k]);
    // 反向：输入是标准词时，也尝试别名
    for (var _sk in DRUG_SYNONYMS) { if (DRUG_SYNONYMS[_sk] === k && _sk !== k) keywords.push(_sk); }
  });
  var results = [];
  for (var name in DRUG_GUIDE) {
    var d = DRUG_GUIDE[name];
    var score = 0;
    var text = (name + ' ' + (d.indications || '') + ' ' + (d.category || '') + ' ' + (d.ingredients || '')).toLowerCase();
    keywords.forEach(function(kw) {
      if (!kw) return;
      if (text.indexOf(kw) >= 0) {
        score += kw.length * 2;
        if (name.toLowerCase().indexOf(kw) >= 0) score += 5;
      }
    });
    if (score > 0) results.push({ name: name, score: score, drug: d });
  }
  results.sort(function(a, b) { return b.score - a.score; });
  return results.slice(0, 12);
}

function showSymptomResults(query, results) {
  var container = document.getElementById('symptomResults');
  if (!container) return;
  if (results.length === 0) {
    container.innerHTML = '<div style="padding:20px;text-align:center;color:#999;">未找到匹配「' + query + '」的药品，试试更具体的症状描述</div>';
    return;
  }
  var h = '<div style="padding:10px 0;font-size:13px;color:#666;">症状「' + query + '」匹配到 ' + results.length + ' 个相关药品：</div>';
  results.forEach(function(r) {
    h += '<div onclick="showDrugDetail(\'' + r.name + '\')" style="background:#fff;padding:12px;margin-bottom:8px;border-radius:8px;cursor:pointer;border:1px solid #f0f0f0;box-shadow:0 1px 3px rgba(0,0,0,.05)">' +
      '<div style="font-weight:700;color:#2e7d32;font-size:15px;">💊 ' + r.name + '</div>' +
      '<div style="font-size:12px;color:#888;margin-top:4px;line-height:1.5;">' + (r.drug.indications || '').slice(0, 70) + '</div>' +
      '</div>';
  });
  container.innerHTML = h;
}

<!-- 大厂质感：Toast / Ripple / 深色模式 / 导航修复 -->
<script>
(function(){
  // Toast
  window.showToast = function(msg, dur){
    dur = dur || 2200;
    var wrap = document.querySelector('.toast-wrap');
    if(!wrap){ wrap = document.createElement('div'); wrap.className='toast-wrap'; document.body.appendChild(wrap); }
    var t = document.createElement('div'); t.className='toast'; t.textContent = msg;
    wrap.appendChild(t);
    setTimeout(function(){ t.classList.add('out'); setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 250); }, dur);
  };
  // 深色模式
  function applyDark(d){
    document.documentElement.classList.toggle('dark', d);
    try{ localStorage.setItem('cy_dark', d?'1':'0'); }catch(e){}
  }
  window.toggleDark = function(){
    var d = !document.documentElement.classList.contains('dark');
    applyDark(d);
    showToast(d ? '🌙 夜间模式' : '☀️ 日间模式', 1200);
  };
  try{
    var saved = localStorage.getItem('cy_dark');
    if(saved==='1') applyDark(true);
    else if(saved===null && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) applyDark(true);
  }catch(e){}
  // 头部加深色切换按钮
  var langBtn = document.getElementById('langBtn');
  if(langBtn && !document.getElementById('darkBtn')){
    var db = document.createElement('button');
    db.className='icon-btn'; db.id='darkBtn'; db.textContent='🌙'; db.onclick=toggleDark;
    langBtn.parentNode.insertBefore(db, langBtn);
  }
  // Ripple 按压反馈
  document.addEventListener('click', function(e){
    var btn = e.target.closest('.btn-primary,.btn-secondary,.union-btn-add,.union-btn-check,.tab-btn,.lang-switch,.icon-btn');
    if(!btn || btn.tagName==='A') return;
    var rect = btn.getBoundingClientRect();
    var size = Math.max(rect.width, rect.height);
    var col = btn.classList.contains('btn-primary') ? 'rgba(255,255,255,.5)' : 'rgba(0,0,0,.08)';
    var r = document.createElement('span');
    r.style.cssText = 'position:absolute;left:'+(e.clientX-rect.left-size/2)+'px;top:'+(e.clientY-rect.top-size/2)+'px;width:'+size+'px;height:'+size+'px;border-radius:50%;background:'+col+';pointer-events:none;transform:scale(0);animation:ripple .5s ease-out forwards;';
    if(getComputedStyle(btn).position==='static') btn.style.position='relative';
    btn.style.overflow='hidden';
    btn.appendChild(r);
    setTimeout(function(){ if(r.parentNode) r.parentNode.removeChild(r); }, 520);
  }, true);
  // 底部导航修复（杜绝 404）
  function syncBottom(tab){
    var map={home:'首页',interact:'相互作用',chat:'智能问药',report:'辨证报告'};
    document.querySelectorAll('.bottom-nav a').forEach(function(x){
      x.classList.toggle('active', (x.textContent||'').indexOf(map[tab]||'__')>=0);
    });
  }
  document.querySelectorAll('.bottom-nav a').forEach(function(a){
    a.addEventListener('click', function(e){
      e.preventDefault();
      var txt = (a.textContent||'').trim();
      if(txt.indexOf('首页')>=0){ switchTab('home'); }
      else if(txt.indexOf('说明书')>=0){
        switchTab('home');
        setTimeout(function(){
          var c=document.getElementById('drugManualCard');
          if(c){ c.scrollIntoView({behavior:'smooth',block:'center'}); c.style.boxShadow='0 0 0 3px var(--c-primary)'; setTimeout(function(){c.style.boxShadow='';},1500); }
        },320);
      }
      else if(txt.indexOf('药箱')>=0){ showToast('💊 药箱功能建设中，敬请期待'); }
      else if(txt.indexOf('家庭')>=0){ showToast('👨‍👩‍👧 家庭档案建设中，敬请期待'); }
      else if(txt.indexOf('提醒')>=0){ showToast('⏰ 用药提醒建设中，敬请期待'); }
      document.querySelectorAll('.bottom-nav a').forEach(function(x){x.classList.remove('active')});
      a.classList.add('active');
    });
  });
  // 顶部 tab 切换同步底部高亮
  document.querySelectorAll('.tab-btn[data-tab]').forEach(function(b){
    b.addEventListener('click', function(){ var t=b.getAttribute('data-tab'); if(t) setTimeout(function(){syncBottom(t);},50); });
  });
  syncBottom('home');
})();
</script>

<script>
// ===== 药箱 / 家庭 / 提醒 功能 =====
(function(){
  var LS_CAB='cy_cabinet', LS_MEM='cy_members', LS_REM='cy_reminders', LS_CUR='cy_current_member';
  function load(k,def){ try{var v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch(e){return def;} }
  function save(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} }
  function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function daysBetween(a,b){return Math.round((a-b)/86400000);}

  // ---- 药箱 ----
  var cabinet = load(LS_CAB, []);
  function renderCabinet(){
    var box = document.getElementById('cabinetList'); if(!box) return;
    var stats = {ok:0,warn:0,bad:0};
    var now = new Date(); now.setHours(0,0,0,0);
    var html='';
    if(cabinet.length===0){
      html='<div class="empty-state"><div class="es-icon">💊</div><div class="es-text">药箱还是空的<br>点击下方，添加你家常备药</div></div>';
    } else {
      cabinet.forEach(function(d){
        var exp = d.expiry? new Date(d.expiry): null;
        var cls='', badge='', txt='';
        if(exp){
          var diff = daysBetween(exp, now);
          if(diff<0){cls='expired';badge='bad';txt='已过期 '+Math.abs(diff)+' 天';stats.bad++;}
          else if(diff<=30){cls='expire-soon';badge='warn';txt=diff+' 天后到期';stats.warn++;}
          else {badge='ok';txt=d.expiry;stats.ok++;}
        } else {badge='ok';txt='未设有效期';stats.ok++;}
        var qty = d.qty? (' · 余 '+esc(d.qty)):'';
        var mem = d.member? (' · '+esc(d.member)):'';
        var low = (parseInt(d.qty,10)<=3 && d.qty!=='' && !isNaN(parseInt(d.qty,10)))? '<span class="di-badge warn">库存偏低</span>':'';
        html+='<div class="drug-item '+cls+'">'+
          '<div class="di-main"><div class="di-name">'+esc(d.name)+'</div>'+
          '<div class="di-meta">'+esc(d.spec||'')+qty+mem+'</div>'+
          (txt?'<span class="di-badge '+badge+'">'+esc(txt)+'</span>':'')+low+
          '</div>'+
          '<button class="di-del" onclick="deleteCabinetDrug(\''+esc(d.id)+'\')">×</button></div>';
      });
    }
    box.innerHTML=html;
    var so=document.getElementById('cabOk'),sw=document.getElementById('cabWarn'),sb=document.getElementById('cabBad');
    if(so)so.textContent=stats.ok; if(sw)sw.textContent=stats.warn; if(sb)sb.textContent=stats.bad;
  }
  window.renderCabinet=renderCabinet;
  window.deleteCabinetDrug=function(id){ cabinet=cabinet.filter(function(d){return d.id!==id;}); save(LS_CAB,cabinet); renderCabinet(); showToast('已移除'); };
  window.addCabinetDrug=function(){
    var n=document.getElementById('cabName'), sp=document.getElementById('cabSpec'),
        q=document.getElementById('cabQty'), e=document.getElementById('cabExpiry'),
        m=document.getElementById('cabMember');
    var name=(n.value||'').trim(); if(!name){showToast('请输入药品名称');return;}
    var fm = (window.fuzzyMatchDrug&&fuzzyMatchDrug(name))||name;
    cabinet.push({id:'c'+Date.now()+Math.random().toString(36).slice(2,6),name:fm,spec:sp.value.trim(),qty:q.value.trim(),expiry:e.value,member:(m.value||'')});
    save(LS_CAB,cabinet); n.value='';sp.value='';q.value='';e.value='';
    renderCabinet(); showToast('已加入药箱');
  };
  function fillDrugNames(){
    var dl=document.getElementById('drugNames'); if(!dl||dl.childElementCount) return;
    if(window.DRUG_GUIDE) Object.keys(DRUG_GUIDE).slice(0,400).forEach(function(k){var o=document.createElement('option');o.value=k;dl.appendChild(o);});
  }

  // ---- 家庭 ----
  var members = load(LS_MEM, ['我']); var current = load(LS_CUR,'我');
  function renderMembers(){
    var box=document.getElementById('memberList'); if(!box) return;
    var html='';
    if(members.length===0){ html='<div class="empty-state"><div class="es-icon">👨‍👩‍👧</div><div class="es-text">还没有家庭成员</div></div>'; }
    else { members.forEach(function(nm){ var cur=(nm===current); html+='<span class="member-chip'+(cur?' current':'')+'" onclick="setCurrentMember(\''+esc(nm)+'\')">'+esc(nm)+(cur?' ✓':'')+'<span class="mc-del" onclick="event.stopPropagation();deleteMember(\''+esc(nm)+'\')">×</span></span>'; }); }
    box.innerHTML=html;
    var sel=document.getElementById('cabMember'); if(sel){ sel.innerHTML='<option value="">（不指定）</option>'+members.map(function(nm){return '<option'+(nm===current?' selected':'')+'>'+esc(nm)+'</option>';}).join(''); }
  }
  window.renderMembers=renderMembers;
  window.setCurrentMember=function(nm){ current=nm; save(LS_CUR,current); renderMembers(); showToast('当前：'+nm); };
  window.deleteMember=function(nm){ if(members.length<=1){showToast('至少保留一位');return;} members=members.filter(function(x){return x!==nm;}); if(current===nm)current=members[0]; save(LS_MEM,members); save(LS_CUR,current); renderMembers(); };
  window.addMember=function(){ var i=document.getElementById('memberInput'); var v=(i.value||'').trim(); if(!v)return; if(members.indexOf(v)<0)members.push(v); save(LS_MEM,members); i.value=''; renderMembers(); };

  // ---- 提醒 ----
  var reminders = load(LS_REM, []);
  function renderReminders(){
    var box=document.getElementById('reminderList'); if(!box) return;
    var html='';
    if(reminders.length===0){ html='<div class="empty-state"><div class="es-icon">⏰</div><div class="es-text">还没有用药提醒<br>添加一条，按时吃药不漏服</div></div>'; }
    else { reminders.forEach(function(r){ html+='<div class="rem-item"><div class="rem-time">'+esc(r.time)+'</div><div class="rem-main"><div class="rem-text">'+esc(r.text)+'</div>'+(r.member?'<div class="rem-sub">'+esc(r.member)+'</div>':'')+'</div><button class="rem-del" onclick="deleteReminder(\''+esc(r.id)+'\')">×</button></div>'; }); }
    box.innerHTML=html;
  }
  window.renderReminders=renderReminders;
  window.deleteReminder=function(id){ reminders=reminders.filter(function(r){return r.id!==id;}); save(LS_REM,reminders); renderReminders(); showToast('已删除提醒'); };
  window.addReminder=function(){ var t=document.getElementById('remTime'),x=document.getElementById('remText'); var v=(x.value||'').trim(); if(!v){showToast('请输入提醒内容');return;} reminders.push({id:'r'+Date.now(),time:t.value||'08:00',text:v,member:current}); save(LS_REM,reminders); x.value=''; renderReminders(); showToast('提醒已添加'); };

  // ---- 导航同步 ----
  function syncBottomNav(t){
    document.querySelectorAll('.bottom-nav a').forEach(function(a){a.classList.remove('active');});
    var el=document.querySelector('.bottom-nav a[data-tab="'+t+'"]'); if(el)el.classList.add('active');
  }
  if(typeof switchTab==='function'){
    var _origSwitch = switchTab;
    switchTab = function(t){ _origSwitch(t); syncBottomNav(t); };
  }
  window.openCabinet=function(){ fillDrugNames(); switchTab('cabinet'); renderCabinet(); };
  window.openMember=function(){ switchTab('member'); renderMembers(); };
  window.openReminder=function(){ switchTab('reminder'); renderReminders(); };
  window.scrollToManual=function(){ switchTab('home'); setTimeout(function(){var m=document.getElementById('manualCard'); if(m)m.scrollIntoView({behavior:'smooth',block:'start'});},140); };

  function initFeat(){ renderMembers(); }
  if(document.readyState!=='loading'){ initFeat(); } else { document.addEventListener('DOMContentLoaded', initFeat); }
})();
</script>
</body>
</html>
