// ==================== 消息处理 ====================
function addMessage(text, isUser = false) {
  welcomeDiv.style.display = 'none';
  const msgDiv = document.createElement('div');
  msgDiv.className = 'msg ' + (isUser ? 'msg-user' : 'msg-ai');
  msgDiv.innerHTML = '<div class="bubble">' + text + '</div>';
  messagesDiv.appendChild(msgDiv);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function typeWriter(element, text, speed = 18) {
  // Parse HTML: collect plain text segments and HTML tags separately
  // Only typewriter-effect the text; insert tags as live DOM elements
  const parts = [];
  let current = '';
  let inTag = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (ch === '<') { if (current) parts.push({ t: 'text', v: current }); current = ''; inTag = true; current = '<'; }
    else if (ch === '>' && inTag) { current += '>'; parts.push({ t: 'html', v: current }); current = ''; inTag = false; }
    else { current += ch; }
  }
  if (current) parts.push({ t: inTag ? 'html' : 'text', v: current });

  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  element.appendChild(cursor);

  let partIdx = 0;
  let charIdx = 0;
  let accumulated = '';
  let timer = null;

  function typePart() {
    if (partIdx >= parts.length) {
      cursor.remove();
      return;
    }
    const part = parts[partIdx];
    if (part.t === 'html') {
      // Insert as live DOM element immediately, no animation
      cursor.insertAdjacentHTML('beforebegin', part.v);
      partIdx++;
      typePart();
    } else {
      // Type character by character
      if (charIdx < part.v.length) {
        const ch = part.v[charIdx];
        accumulated += ch;
        cursor.insertAdjacentText('beforebegin', ch);
        charIdx++;
        timer = setTimeout(typePart, speed + Math.random() * 12);
      } else {
        // Move to next part
        partIdx++;
        charIdx = 0;
        timer = setTimeout(typePart, speed * 3);
      }
    }
  }

  typePart();
}

function sendMessage() {
  const msg = userInput.value.trim();
  if (!msg) return;

  addMessage(msg, true);
  userInput.value = '';

  setTimeout(() => {
    const response = generateResponse(msg);
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    const msgDiv = document.createElement('div');
    msgDiv.className = 'msg msg-ai';
    msgDiv.appendChild(bubble);
    messagesDiv.appendChild(msgDiv);
    bubble.innerHTML = response;
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }, 300);
}

// ==================== 响应生成 ====================
function generateResponse(msg) {
  switch(currentMode) {
    case 'consult': return generateConsultationResponse(msg);
    case 'constitution': return generateConstitutionResponse(msg);
    case 'diet': return generateDietResponse(msg);
    case 'physio': return generatePhysioResponse(msg);
    case 'medguide': return generateMedGuideResponse(msg);
    case 'fdinteract': return generateFDInteractResponse(msg);
    case 'chrono': return generateChronoResponse(msg);
    case 'circadian': return generateCircadianResponse(msg);
    case 'seasonal': return generateSeasonalResponse(msg);
    default: return '请选择功能模式后输入问题';
  }
}

      res += '• 症状：' + data.西医.症状.join('、') + '\n';
      res += '• 治疗：' + data.西医.治疗.join('、') + '\n';
      res += '• 常用药物：<span class="western-drug">' + data.西医.药物.join('</span>、<span class="western-drug">') + '</span>\n';
      res += '• 注意事项：<span class="warning">' + data.西医.注意.join('</span>\n  <span class="warning">') + '</span>\n\n';
      res += '<span class="positive">【中医辨证】</span>\n';
      res += '• 辨证分型：' + data.中医.辨证 + '\n';
      res += '• 治法：' + data.中医.治法 + '\n';
      res += '• 方药：' + data.中医.方药.join('、') + '\n';
      res += '• 推荐穴位：<span class="acupoint">' + data.中医.穴位.join('</span>、<span class="acupoint">') + '</span>\n';
      return res;
    }
  }
  return '您描述的症状我已记录。请更具体地描述您的不适，例如"头痛"、"失眠"、"胃痛"等，我将为您提供详细的中西医分析。';
}

function generateCircadianResponse(msg) {
  if (msg.includes('当前时段') || msg.includes('现在')) {
    const hour = new Date().getHours();
    const timeKey = Object.keys(circadianRhythm).find(k => {
      const [start] = k.split('-').map(s => parseInt(s));
      const end = parseInt(k.split('-')[1]);
      return hour >= start && hour < end;
    }) || '08:00-10:00';
    const data = circadianRhythm[timeKey];
    let res = '<span class="section-title">🕐 当前时段 ' + timeKey + '</span>\n\n';
    res += '<span class="important">【生理特点】</span>\n' + data.生理特点 + '\n\n';
    res += '<span class="positive">【建议】</span>\n' + data.建议 + '\n';
    return res;
  }
  return '人体24小时生理节律指导健康生活。输入"当前时段"可获取实时建议。';
}

function generateSeasonalResponse(msg) {
  for (const [season, data] of Object.entries(seasonalHealth)) {

      res += '<span class="danger">【防病要点】</span>\n' + data.防病 + '\n';
      return res;

  return '四季养生指导：春季养肝、夏季养心、秋季养肺、冬季养肾。请选择季节。';
}
