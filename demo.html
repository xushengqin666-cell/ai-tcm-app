<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>岐黄智医 — AI中西医结合健康助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--pri:#2e7d6b;--pri-l:#4db8a4;--pri-d:#1b5e50;--acc:#ff8f00;--bg:#f0f7f4;--card:#fff;--txt:#2c3e3a;--txt2:#6b7c78;--sh:0 2px 12px rgba(46,125,107,.1);--r:16px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--txt);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.hd{background:linear-gradient(135deg,var(--pri-d),var(--pri));color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(21,101,192,.3);z-index:10}
.hd .logo{font-size:22px;font-weight:700;letter-spacing:1px}
.hd .logo span{font-size:13px;font-weight:400;opacity:.85;margin-left:8px}
.hd .spacer{flex:1}
.hd .gear{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;opacity:.8;transition:.2s}
.hd .gear:hover{opacity:1;transform:rotate(30deg)}
.tabs{display:flex;background:#fff;border-bottom:1px solid #e0e0e0}
.tabs button{flex:1;padding:10px;border:none;background:none;font-size:14px;font-weight:600;color:var(--txt2);cursor:pointer;border-bottom:3px solid transparent;transition:.2s}
.tabs button.active{color:var(--pri);border-bottom-color:var(--pri)}
.tabs button:hover{background:#f0f4ff}
.panel{display:none;flex:1;overflow-y:auto;padding:16px}
.panel.active{display:flex;flex-direction:column}
.chat-area{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:12px 16px;border-radius:var(--r);line-height:1.7;font-size:15px;animation:fadeUp .3s ease;word-break:break-word}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--pri),var(--pri-l));color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:#fff;border:1px solid #e8eaf6;box-shadow:var(--sh);border-bottom-left-radius:4px}
.msg.ai b{color:var(--pri)}
.msg.ai .tag{display:inline-block;background:#e3f2fd;color:var(--pri);padding:2px 8px;border-radius:8px;font-size:12px;font-weight:600;margin:2px 4px 2px 0}
.msg.ai .section{margin:10px 0;padding:10px;background:#f8f9ff;border-radius:10px}
.msg.ai .section-title{font-weight:700;color:var(--pri-d);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.msg.ai .section p{margin:4px 0 4px 28px;font-size:14px;color:#444}
.msg .disclaimer{display:block;margin-top:10px;font-size:12px;color:#999;border-top:1px dashed #e0e0e0;padding-top:8px}
.msg.loading{align-self:flex-start;background:#fff;border:1px solid #e8eaf6;box-shadow:var(--sh);padding:16px 20px}
.spinner{width:28px;height:28px;border:3px solid #e0e0e0;border-top-color:var(--pri);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.input-bar{display:flex;gap:8px;padding:12px 16px;background:#fff;border-top:1px solid #e0e0e0}
.input-bar input{flex:1;border:2px solid #e0e0e0;border-radius:24px;padding:10px 18px;font-size:15px;outline:none;transition:.2s}
.input-bar input:focus{border-color:var(--pri-l)}
.input-bar button{background:linear-gradient(135deg,var(--pri),var(--pri-l));color:#fff;border:none;border-radius:24px;padding:10px 20px;font-size:15px;font-weight:600;cursor:pointer;transition:.2s}
.input-bar button:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(21,101,192,.3)}
.model-bar{display:flex;gap:6px;padding:8px 16px;background:#fff;overflow-x:auto;border-bottom:1px solid #f0f0f0}
.model-bar button{padding:5px 12px;border-radius:20px;border:1px solid #e0e0e0;background:#fff;font-size:12px;cursor:pointer;white-space:nowrap;transition:.2s}
.model-bar button.active{background:var(--pri);color:#fff;border-color:var(--pri)}
.model-bar button:hover{border-color:var(--pri-l)}
.quiz-wrap{max-width:500px;margin:0 auto;width:100%}
.quiz-card{background:#fff;border-radius:var(--r);padding:24px;box-shadow:var(--sh);margin-bottom:16px}
.quiz-card h3{font-size:17px;margin-bottom:16px;color:var(--pri-d)}
.quiz-card .opts{display:flex;flex-direction:column;gap:10px}
.quiz-card .opt{padding:12px 16px;border:2px solid #e0e0e0;border-radius:12px;cursor:pointer;transition:.2s;font-size:15px}
.quiz-card .opt:hover{border-color:var(--pri-l);background:#f0f4ff}
.quiz-card .opt.sel{border-color:var(--pri);background:#e3f2fd;font-weight:600}
.prog-bar{height:6px;background:#e0e0e0;border-radius:3px;margin-bottom:16px;overflow:hidden}
.prog-bar .fill{height:100%;background:linear-gradient(90deg,var(--pri),var(--pri-l));border-radius:3px;transition:width .4s ease}
.result-card{background:linear-gradient(135deg,#e3f2fd,#f3e5f5);border-radius:var(--r);padding:24px;box-shadow:var(--sh)}
.result-card h2{color:var(--pri-d);margin-bottom:12px}
.result-card .rsec{margin-bottom:12px}
.result-card .rsec h4{color:var(--pri);margin-bottom:4px}
.settings-wrap{max-width:500px;margin:0 auto;width:100%}
.s-card{background:#fff;border-radius:var(--r);padding:20px;box-shadow:var(--sh);margin-bottom:12px}
.s-card h3{font-size:15px;color:var(--pri-d);margin-bottom:12px}
.s-card label{display:block;font-size:13px;color:var(--txt2);margin-bottom:4px}
.s-card input{width:100%;border:2px solid #e0e0e0;border-radius:10px;padding:8px 12px;font-size:14px;outline:none;margin-bottom:12px;transition:.2s}
.s-card input:focus{border-color:var(--pri-l)}
.s-card .hint{font-size:12px;color:#999;margin-top:-8px;margin-bottom:12px}
.s-card button{background:var(--pri);color:#fff;border:none;border-radius:10px;padding:8px 20px;font-size:14px;cursor:pointer;transition:.2s}
.s-card button:hover{background:var(--pri-d)}
.quick-btns{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;background:#fff;border-top:1px solid #f0f0f0}
.quick-btns button{padding:6px 14px;border:1px solid #e0e0e0;border-radius:20px;background:#fff;font-size:13px;cursor:pointer;transition:.2s;color:var(--txt)}
.quick-btns button:hover{border-color:var(--pri-l);background:#e3f2fd;color:var(--pri)}

@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.tw-cursor{display:inline-block;width:2px;height:1em;background:#2e7d6b;margin-left:2px;animation:blink 1s infinite;vertical-align:text-bottom}
@media(prefers-color-scheme:dark){:root{--pri:#4db8a4;--pri-l:#6dd5c0;--pri-d:#2e7d6b;--acc:#ffb300;--bg:#1a1a2e;--card:#16213e;--txt:#e0e0e0;--txt2:#a0a0a0;--sh:0 2px 12px rgba(0,0,0,.3);--r:16px}.tabs{background:#16213e;border-bottom-color:#333}.tabs button{color:#a0a0a0}.tabs button:hover{background:#1a1a2e}.msg.ai{background:#16213e;border-color:#333;color:#e0e0e0}.msg.ai b{color:#4db8a4}.msg.ai .tag{background:#1a3a3a;color:#4db8a4}.msg.ai .section{background:#1a2a3a}.msg.ai .section-title{color:#6dd5c0}.msg.ai .section p{color:#ccc}.msg .disclaimer{color:#666;border-top-color:#333}.msg.loading{background:#16213e;border-color:#333}.spinner{border-color:#333;border-top-color:#4db8a4}.input-bar{background:#16213e;border-top-color:#333}.input-bar input{background:#1a1a2e;border-color:#333;color:#e0e0e0}.model-bar{background:#16213e;border-bottom-color:#333}.model-bar button{background:#16213e;border-color:#444;color:#ccc}.model-bar button.active{background:#2e7d6b;color:#fff}.quiz-card{background:#16213e;color:#e0e0e0}.quiz-card .opt{border-color:#444;color:#ccc}.quiz-card .opt:hover{background:#1a2a3a;border-color:#4db8a4}.s-card{background:#16213e;color:#e0e0e0}.s-card input{background:#1a1a2e;border-color:#444;color:#e0e0e0}.quick-btns{background:#16213e;border-top-color:#333}.quick-btns button{background:#16213e;border-color:#444;color:#ccc}.quick-btns button:hover{background:#1a3a3a;color:#4db8a4;border-color:#4db8a4}.result-card{background:linear-gradient(135deg,#1a2a3a,#2a1a3a)}}
</style>

</head>
<body>
<div class="hd" role="banner">
  <div class="logo">🏥 岐黄智医<span>AI中西医结合健康助手</span></div>
  <div class="spacer"></div>
  <button class="gear" onclick="clearChat()" title="清空对话" style="font-size:18px">🗑️</button>
  <button class="gear" onclick="showPanel('settings')">⚙️</button>
</div>
<div class="tabs" role="tablist">
  <button id="t-chat" class="active" role="tab" aria-selected="true" onclick="showPanel('chat')">💬 智能问诊</button>
  <button id="t-quiz" role="tab" aria-selected="false" onclick="showPanel('quiz')">🔄 体质辨识</button>
  <button id="t-settings" role="tab" aria-selected="false" onclick="showPanel('settings')">⚙️ 设置</button>
</div>
<div class="model-bar" id="modelBar"></div>

<!-- Chat Panel -->
<div class="panel active" id="p-chat">
  <div class="chat-area" id="chatArea" role="log" aria-live="polite"></div>
  <div class="quick-btns" id="quickBtns">
    <button onclick="quickAsk('头痛')">头痛</button><button onclick="quickAsk('胃痛')">胃痛</button><button onclick="quickAsk('失眠')">失眠</button><button onclick="quickAsk('咳嗽')">咳嗽</button><button onclick="quickAsk('感冒')">感冒</button><button onclick="quickAsk('便秘')">便秘</button><button onclick="quickAsk('痛经')">痛经</button><button onclick="quickAsk('腹泻')">腹泻</button><button onclick="quickAsk('腰痛')">腰痛</button><button onclick="quickAsk('肩颈痛')">肩颈痛</button><button onclick="quickAsk('胸闷')">胸闷</button><button onclick="quickAsk('过敏')">过敏</button><button onclick="quickAsk('皮疹')">皮疹</button><button onclick="quickAsk('咽痛')">咽痛</button><button onclick="quickAsk('耳鸣')">耳鸣</button><button onclick="quickAsk('脱发')">脱发</button><button onclick="quickAsk('肥胖')">肥胖</button><button onclick="quickAsk('焦虑')">焦虑</button><button onclick="quickAsk('高血压')">高血压</button><button onclick="quickAsk('糖尿病')">糖尿病</button>
  </div>
  <div class="input-bar" role="form">
    <input type="text" id="inp" placeholder="描述您的症状...（如：头痛、胃痛、失眠）">
    <button onclick="send()">发送</button>
  </div>
</div>

<!-- Quiz Panel -->
<div class="panel" id="p-quiz">
  <div class="quiz-wrap" id="quizWrap"></div>
</div>

<!-- Settings Panel -->
<div class="panel" id="p-settings">
  <div class="settings-wrap">
    <div class="s-card">
      <h3>🔑 API Key 配置</h3>
      <label for="groqKey">Groq API Key（免费推荐）</label>
      <input type="password" id="groqKey" placeholder="gsk_..." autocomplete="off">
      <div class="hint">申请地址：<a href="https://console.groq.com/keys" target="_blank" style="color:var(--pri)">https://console.groq.com/keys</a></div>
      <label for="dsKey">DeepSeek API Key</label>
      <input type="password" id="dsKey" placeholder="sk-..." autocomplete="off">
      <div class="hint">申请地址：<a href="https://platform.deepseek.com/api_keys" target="_blank" style="color:var(--pri)">https://platform.deepseek.com/api_keys</a></div>
      <button onclick="saveKeys()">💾 保存设置</button>
    </div>
    <div class="s-card">
      <h3>ℹ️ 使用说明</h3>
      <p style="font-size:14px;line-height:1.8;color:#5f6368">
        <b>推荐配置：</b>申请免费 <a href="https://console.groq.com/keys" target="_blank" style="color:var(--pri)">Groq API Key</a>，响应快、无需付费。<br>
        <b>无需配置：</b>本机运行 OpenClaw 时自动连接本地AI。<br>
        <b>问诊流程：</b>输入症状 → AI辨证问诊 → 个性化食疗+用药方案。<br>
        <b>体质辨识：</b>18道题测出您的中医体质类型。
      </p>
    </div>
    <div class="s-card">
      <h3>🗄️ 知识库管理</h3>
      <div style="font-size:13px;color:var(--txt2);margin-bottom:10px">
        当前状态: <span id="kbStatus" style="font-weight:600">加载中...</span><br>
        上次更新: <span id="kbUpdateTime">--</span>
      </div>
      <button onclick="forceUpdateKB()" style="background:var(--pri);color:#fff;border:none;padding:10px 24px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600">🔄 强制更新知识库</button>
      <div class="hint" style="margin-top:8px">知识库自动从远程加载并缓存到本地，每30分钟检查更新。</div>
    </div>
  </div>
</div>

<script>

var KB=[{kw:["胃息肉","胃底腺息肉","增生性息肉","胃腺瘤","癌前病变"],t:"胃息肉",c:"<span class='tag'>西医</span>胃黏膜隆起性病变。增生性(最常见,良性)>腺瘤性(癌前,需切除)>胃底腺息肉(PPI相关)。>2cm腺瘤性建议内镜下切除。。<br><span class='tag'>中医</span>积聚、脾胃虚弱。",d:"定期胃镜随访<br>腺瘤性息肉必须切除<br>香砂六君子健脾理气"},{kw:["肠道息肉","结肠息肉","腺瘤性息肉","绒毛状腺瘤","锯齿状腺瘤"],t:"结直肠息肉",c:"<span class='tag'>西医</span>结直肠黏膜隆起。腺瘤性(管状/绒毛状/混合)→癌变风险。绒毛状>管状。>1cm、高级别异型增生需切除。。<br><span class='tag'>中医</span>肠蕈、脾虚湿瘀。",d:"结肠镜筛查(50岁起/高危40岁起)<br>腺瘤切除后3-5年复查<br>健脾化瘀方"},{kw:["急性阑尾炎","转移性右下腹痛","麦氏点压痛","阑尾穿孔","反跳痛"],t:"急性阑尾炎",c:"<span class='tag'>西医</span>阑尾腔阻塞→细菌感染。典型：脐周痛→转移至右下腹(McBurney点压痛)。WBC↑+CRP↑。穿孔→弥漫性腹膜炎。。<br><span class='tag'>中医</span>肠痈，瘀热互结。",d:"手术切除(金标准)<br>穿孔需腹腔引流+抗生素<br>大黄牡丹汤泻热破瘀"},{kw:["腹股沟疝","疝气","阴囊肿胀","可复性包块","嵌顿疝"],t:"腹股沟疝",c:"<span class='tag'>西医</span>腹腔脏器经腹股沟管/直疝三角突出。斜疝(进入阴囊)>直疝。可复性→难复性→嵌顿→绞窄。。<br><span class='tag'>中医</span>疝气、气虚下陷。",d:"手术修补(无张力疝修补术)<br>避免重体力劳动和慢性咳嗽<br>补中益气汤升提中气"},{kw:["肛裂","排便疼痛","便血","肛门裂口","便秘出血"],t:"肛裂",c:"<span class='tag'>西医</span>肛管皮肤全层裂开。排便时刀割样痛+便血(鲜红)。后正中位最常见。慢性→前哨痔+肛乳头肥大三联征。。<br><span class='tag'>中医</span>钩肠痔、血热肠燥。",d:"高纤维饮食软化大便<br>温水坐浴<br>凉血地黄汤+润肠丸"},{kw:["肺纤维化","间质性肺病","ILD","蜂窝肺","干咳气短"],t:"肺纤维化/间质性肺病",c:"<span class='tag'>西医</span>肺间质炎症→纤维化→限制性通气障碍。IPF最常见(特发性)。干咳+进行性呼吸困难+Velcro啰音+杵状指。HRCT蜂窝肺。。<br><span class='tag'>中医</span>肺痿、肺痹，气虚血瘀。",d:"避免粉尘/吸烟<br>尼达尼布/吡非尼酮延缓进展<br>百合固金汤+活血化瘀"},{kw:["支气管扩张","咯血","咳脓痰","反复肺部感染","柱状扩张"],t:"支气管扩张症",c:"<span class='tag'>西医</span>支气管不可逆扩张。慢性咳嗽+大量脓痰+反复咯血+反复肺炎。柱状/囊状/曲张型。HRCT确诊。。<br><span class='tag'>中医</span>咯血、肺痈，痰热壅肺。",d:"体位引流+祛痰<br>咯血时患侧卧位<br>苇茎汤+桔梗汤清热排脓"},{kw:["过敏性肺炎","农民肺","鸽子肺","外源性过敏性肺泡炎","HP"],t:"过敏性肺炎",c:"<span class='tag'>西医</span>反复吸入有机粉尘致免疫性肺泡炎。急性(发热+咳嗽+呼吸困难4-8h后)/慢性(纤维化)。农民肺/饲鸽者肺。。<br><span class='tag'>中医</span>喘证、痰热郁肺。",d:"脱离致敏原(最关键)<br>激素用于急性期<br>清热化痰方"},{kw:["二尖瓣脱垂","喀喇音","二尖瓣反流","瓣膜病","心杂音"],t:"二尖瓣脱垂",c:"<span class='tag'>西医</span>二尖瓣叶向左房脱垂。收缩中期喀喇音+收缩晚期杂音。多数无症状。重度反流需手术。。<br><span class='tag'>中医</span>心悸、气阴两虚。",d:"多数不需治疗<br>重度反流：瓣膜修复/置换<br>生脉散益气养阴"},{kw:["主动脉瓣狭窄","AS","心绞痛晕厥","心衰三联","瓣膜钙化"],t:"主动脉瓣狭窄",c:"<span class='tag'>西医</span>主动脉瓣口面积缩小→左室后负荷↑。心绞痛+晕厥+心衰=经典三联征。一旦出现症状预后差(2-5年)。。<br><span class='tag'>中医</span>胸痹、心脉瘀阻。",d:"一旦有症状需手术(TAVR/SAVR)<br>避免剧烈运动<br>血府逐瘀汤活血通脉"},{kw:["感染性心内膜炎","IE","发热心脏杂音","血培养阳性","赘生物"],t:"感染性心内膜炎",c:"<span class='tag'>西医</span>微生物感染心内膜+赘生物形成。发热+新发杂音+栓塞+血培养阳性。Duke诊断标准。基础心瓣膜病/IVDU高危。。<br><span class='tag'>中医</span>温病、热毒犯心。",d:"长疗程静脉抗生素(4-6周)<br>血培养指导用药<br>清营汤凉血解毒"},{kw:["下肢动脉硬化闭塞","间歇性跛行","ASO","足背动脉消失","静息痛"],t:"下肢动脉硬化闭塞症",c:"<span class='tag'>西医</span>下肢动脉粥样硬化致管腔狭窄/闭塞。间歇性跛行→静息痛→溃疡/坏疽。ABI<0.9确诊。。<br><span class='tag'>中医</span>脱疽、寒凝血瘀。",d:"戒烟(最重要)<br>抗血小板+他汀<br>当归四逆汤+阳和汤温阳通脉"},{kw:["面瘫","面神经炎","贝尔麻痹","口角歪斜","闭眼不全"],t:"特发性面神经麻痹(面瘫)",c:"<span class='tag'>西医</span>面神经管内面神经非特异性炎症。急性起病+患侧额纹消失+闭眼不全+口角歪斜+味觉障碍。多数2-3月恢复。。<br><span class='tag'>中医</span>面瘫、风邪中络。",d:"72h内激素+抗病毒<br>保护角膜(眼罩/眼膏)<br>牵正散祛风通络+针灸"},{kw:["三叉神经痛","面部剧痛","触发点","扳机点","卡马西平有效"],t:"三叉神经痛",c:"<span class='tag'>西医</span>三叉神经分布区反复发作性剧痛(电击/刀割/针刺)。触发点(洗脸/刷牙/说话诱发)。卡马西平有效。血管压迫最常见。。<br><span class='tag'>中医</span>面痛、风痰阻络。",d:"卡马西平(首选药物)<br>微血管减压术(外科)<br>川芎茶调散祛风止痛"},{kw:["坐骨神经痛","腰腿痛","腰椎间盘突出","腿麻","直腿抬高试验"],t:"坐骨神经痛",c:"<span class='tag'>西医</span>沿坐骨神经通路放射性疼痛。腰L4-S3根受压。腰椎间盘突出最常见。直腿抬高试验(+)。。<br><span class='tag'>中医</span>腰腿痛、寒湿痹/瘀血腰痛。",d:"急性卧床休息<br>营养神经+消炎止痛<br>独活寄生汤祛寒湿"},{kw:["重症肌无力危象","肌无力危象","呼吸衰竭","胆碱能危象","新斯的明"],t:"重症肌无力危象",c:"<span class='tag'>西医</span>MG患者呼吸肌无力→通气不足。肌无力危象(抗胆碱酯酶不足)vs胆碱能危象(过量)。需鉴别处理。。<br><span class='tag'>中医</span>痿证加重、脾肾两虚。",d:"呼吸支持(首要)<br>肌无力危象：增加溴吡斯的明<br>胆碱能危象：减少/停药+阿托品<br>补中益气汤"},{kw:["亨廷顿病","舞蹈症"," Huntington","遗传性舞蹈病","认知下降"],t:"亨廷顿病",c:"<span class='tag'>西医</span>常染色体显性遗传(CAG三核苷酸重复)。舞蹈样不自主运动+认知下降+精神症状。平均发病35-50岁。。<br><span class='tag'>中医</span>颤证、肝风内动。",d:"遗传咨询<br>丁苯那嗪控制舞蹈症<br>天麻钩藤饮平肝熄风"},{kw:["多系统萎缩","MSA","帕金森叠加","小脑性共济失调","自主神经障碍"],t:"多系统萎缩",c:"<span class='tag'>西医</span>α-突触核蛋白沉积。MSA-P(帕金森型)/MSA-C(小脑型)。自主神经障碍(直立性低血压/尿失禁)突出。进展快。。<br><span class='tag'>中医</span>颤证/痿证、肝肾亏虚。",d:"对症治疗(氟氢可的松升压等)<br>康复训练<br>大补阴丸滋阴熄风"},{kw:["嗜铬细胞瘤","阵发性高血压","心悸出汗头痛","儿茶酚胺","肾上腺肿瘤"],t:"嗜铬细胞瘤",c:"<span class='tag'>西医</span>肾上腺髓质/嗜铬组织肿瘤→阵发/持续高血压+心悸+出汗+头痛(4H)。24h尿儿茶酚胺/VMA确诊。10%恶性。。<br><span class='tag'>中医</span>眩晕、肝阳上亢。",d:"术前必须α受体阻滞剂扩容<br>禁忌未用α阻滞剂先用β阻滞剂<br>镇肝熄风汤"},{kw:["原发性醛固酮增多症","Conn综合征","低钾高血压","醛固酮","肾上腺腺瘤"],t:"原发性醛固酮增多症",c:"<span class='tag'>西医</span>肾上腺自主分泌过多醛固酮→高血压+低钾+代谢性碱中毒。腺瘤(手术)/增生(药物)。占高血压3-5%。。<br><span class='tag'>中医</span>眩晕、肝阳偏亢兼阴虚。",d:"螺内酯(首选药物)<br>腺瘤：腹腔镜肾上腺切除<br>知柏地黄丸滋阴降火"},{kw:["多发性内分泌腺瘤","MEN","MEN1","MEN2","Sipple综合征"],t:"多发性内分泌腺瘤病",c:"<span class='tag'>西医</span>常染色体显性遗传。MEN1：甲状旁腺+胰腺+垂体。MEN2：甲状腺髓样癌+嗜铬细胞瘤+甲旁亢。RET基因。。<br><span class='tag'>中医</span>虚劳、先天禀赋不足。",d:"基因检测+家系筛查<br>MEN2：预防性甲状腺切除<br>滋补肝肾方调理"},{kw:["肥胖症","BMI>30","代谢综合征","内脏脂肪","减重"],t:"肥胖症",c:"<span class='tag'>西医</span>BMI≥30(国际)/≥28(中国)。内脏脂肪→胰岛素抵抗+炎症因子→心血管/代谢/关节/呼吸多系统损害。。<br><span class='tag'>中医</span>痰湿内蕴、脾虚失运。",d:"减重5-10%获益显著<br>饮食+运动为基础<br>防己黄芪汤+二陈汤化痰湿"},{kw:["过敏性紫癜","IgA血管炎","皮肤紫癜","腹痛关节痛","Henoch-Schönlein"],t:"过敏性紫癜(IgA血管炎)",c:"<span class='tag'>西医</span>IgA免疫复合物沉积于小血管。皮肤紫癜(下肢为主)+腹痛+关节痛+肾损害。儿童多见。。<br><span class='tag'>中医</span>血证、葡萄疫，血热妄行。",d:"去除过敏原<br>激素用于腹/关节/肾受累<br>犀角地黄汤凉血止血"},{kw:["特发性血小板减少性紫癜","ITP","血小板减少","出血倾向","糖皮质激素"],t:"免疫性血小板减少症",c:"<span class='tag'>西医</span>自身抗体致血小板破坏过多。皮肤出血点/瘀斑+黏膜出血。PLT<30×10⁹/L出血风险大。。<br><span class='tag'>中医</span>血证、气不摄血。",d:"PLT<30或出血：激素/IVIG<br>复发/难治：TPO受体激动剂/脾切<br>归脾汤益气摄血"},{kw:["血栓性血小板减少性紫癜","TTP","五联征","微血管病性溶血","ADAMTS13缺乏"],t:"血栓性血小板减少性紫癜",c:"<span class='tag'>西医</span>ADAMTS13缺乏→超大vWF多聚体→微血栓。五联征：发热+血小板减少+微血管病性溶血+神经症状+肾损害。血浆置换救命。。<br><span class='tag'>中医</span>温毒发斑、气血两燔。",d:"血浆置换(紧急!最关键)<br>卡普单抗<br>清瘟败毒饮"},{kw:["带状疱疹","蛇缠腰","缠腰龙","水痘带状疱疹","神经痛"],t:"带状疱疹",c:"<span class='tag'>西医</span>VZV潜伏于后根神经节再激活。沿神经分布的簇集水疱+剧烈神经痛。老年/免疫低下易发。后遗神经痛可持续数月-年。。<br><span class='tag'>中医</span>蛇串疮、肝胆湿热/脾虚湿蕴。",d:"72h内抗病毒(阿昔洛韦/伐昔洛韦)<br>营养神经(VB1+VB12)<br>龙胆泻肝汤清肝胆湿热"},{kw:["荨麻疹","风团","风疹块","过敏起包","瘙痒红斑"],t:"荨麻疹",c:"<span class='tag'>西医</span>皮肤小血管扩张→一过性风团(24h内消退不留痕)。急性(<6周)vs慢性。感染/食物/药物/物理因素诱发。。<br><span class='tag'>中医</span>瘾疹、风邪袭表。",d:"寻找并去除诱因<br>二代抗组胺药(首选)<br>消风散疏风止痒"},{kw:["湿疹","渗出性皮炎","反复发作","对称分布","瘙痒剧烈"],t:"湿疹(特应性皮炎)",c:"<span class='tag'>西医</span>慢性复发性瘙痒性炎症性皮肤病。急性(渗出)/亚急性/慢性(苔藓样变)。特应性体质(过敏三部曲)。。<br><span class='tag'>中医</span>湿疮、风湿热蕴。",d:"保湿为基础(大量润肤剂)<br>避免搔抓和热水烫洗<br>除湿胃苓汤+消风散"},{kw:["银屑病关节炎","PsA","牛皮癣关节炎","关节肿痛","指甲改变"],t:"银屑病关节炎",c:"<span class='tag'>西医</span>银屑病+炎性关节病。非对称性寡关节炎>脊柱炎>残毁型。指甲顶针样改变。HLA-B27相关。。<br><span class='tag'>中医</span>白疕/痹证、血虚风燥兼瘀。",d:"NSAIDs→DMARDs→生物制剂<br>皮肤+关节双管齐下<br>活血祛风方"},{kw:["天疱疮","大疱性","皮肤水疱","尼氏征阳性","自身免疫性"],t:"天疱疮",c:"<span class='tag'>西医</span>自身抗体攻击桥粒芯糖蛋白→表皮内水疱。松弛性大疱+尼氏征(+)+口腔糜烂。寻常型最常见最重。。<br><span class='tag'>中医</span>天疱疮、火毒炽盛/脾虚湿蕴。",d:"激素+免疫抑制剂(必须)<br>防感染(最大死因)<br>清脾除湿饮"},{kw:["白癜风","白斑","色素脱失","自身免疫","白驳风"],t:"白癜风",c:"<span class='tag'>西医</span>黑素细胞被破坏→皮肤白斑。自身免疫/氧化应激/神经化学因子。节段型(单侧)/非节段型(双侧)。。<br><span class='tag'>中医</span>白驳风、肝肾不足/气血失和。",d:"窄波UVB/准分子激光<br>他克莫司外用<br>逍遥散+二至丸调和气血"},{kw:["多囊卵巢综合征","PCOS","月经稀发","多毛痤疮","卵巢多囊样改变"],t:"多囊卵巢综合征(生殖型)",c:"<span class='tag'>西医</span>月经稀发/闭经+高雄激素(多毛/痤疮)+卵巢多囊样改变。Rotterdam标准3项中≥2项。胰岛素抵抗核心。。<br><span class='tag'>中医</span>月经后期/闭经，肾虚痰湿。",d:"生活方式干预(减重5-10%)<br>调经：达英-35/二甲双胍<br>苍附导痰汤化痰调经"},{kw:["卵巢早衰","POF","POI","40岁前闭经","FSH>40"],t:"早发性卵巢功能不全",c:"<span class='tag'>西医</span>40岁前卵巢功能衰退。月经紊乱→闭经+FSH>25+雌激素低。不孕+骨质疏松+心血管风险。。<br><span class='tag'>中医</span>经水早竭、肾精亏虚。",d:"激素替代治疗(HRT)<br>生育力保存(早期)<br>归肾丸+二仙汤补肾填精"},{kw:["宫颈上皮内瘤变","CIN","宫颈癌前病变","HPV感染","宫颈糜烂"],t:"宫颈上皮内瘤变",c:"<span class='tag'>西医</span>HPV持续感染致宫颈上皮异型增生。CIN1(低级别,60%自然消退)/CIN2-3(高级别,需治疗)。TCT+HPV筛查。。<br><span class='tag'>中医</span>带下病、湿热蕴毒。",d:"CIN1：随访观察<br>CIN2-3：LEEP/冷刀锥切<br>HPV疫苗预防<br>易黄汤清热解毒"},{kw:["绒毛膜癌","绒癌","妊娠滋养细胞肿瘤","HCG持续升高","肺转移"],t:"绒毛膜癌",c:"<span class='tag'>西医</span>妊娠滋养细胞恶性增殖。葡萄胎后/流产后/足月产后。HCG异常升高+阴道流血+肺/脑转移。化疗高度敏感。。<br><span class='tag'>中医</span>鬼胎恶化、瘀毒蕴结。",d:"化疗为主(治愈率>90%)<br>随访HCG至正常后定期监测<br>生化汤化瘀"},{kw:["川崎病","皮肤黏膜淋巴结综合征","冠状动脉扩张","草莓舌","手足硬肿"],t:"川崎病",c:"<span class='tag'>西医</span>5岁以下儿童急性血管炎。发热5天以上+四项主征(手足硬肿/多形皮疹/球结膜充血/口唇草莓舌/颈淋巴结肿大)。冠脉瘤最危险。。<br><span class='tag'>中医</span>温毒发疹、气营两燔。",d:"IVIG+阿司匹林(发病10天内)<br>超声监测冠状动脉<br>清营汤凉血解毒"},{kw:["幼年特发性关节炎","JIA","儿童关节肿痛","全身型JIA","驰张热皮疹"],t:"幼年特发性关节炎",c:"<span class='tag'>西医</span>16岁以下不明原因关节炎症≥6周。全身型(Still病：驰张热+皮疹+关节痛)>多关节型>少关节型。。<br><span class='tag'>中医</span>痹证、湿热浸淫/肝肾不足。",d:"NSAIDs→MTX→生物制剂<br>物理治疗保关节功能<br>四妙散清热利湿"},{kw:["新生儿黄疸","高胆红素血症","溶血性黄疸","核黄疸","蓝光治疗"],t:"新生儿黄疸",c:"<span class='tag'>西医</span>胆红素代谢不成熟→皮肤黄染。生理性(2-3天出,7-10天消)vs病理性(24h内出/进展快/消退延迟)。ABO溶血/G6PD缺乏。。<br><span class='tag'>中医</span>胎黄、湿热蕴蒸/寒湿阻滞。",d:"蓝光照射(最常用)<br>病理性需查明原因<br>茵陈蒿汤退黄"},{kw:["股骨头坏死","ONFH","髋关节痛","激素性坏死","酒精性坏死","Ficat分期"],t:"股骨头坏死",c:"<span class='tag'>西医</span>股骨头血供中断→骨坏死→塌陷。激素+酒精两大主因。髋痛(腹股沟区)+跛行。MRI早期诊断金标准。。<br><span class='tag'>中医</span>骨蚀、肾虚血瘀。",d:"早期：减少负重+药物<br>中期：髓芯减压/带血管骨瓣移植<br>晚期：全髋置换<br>补肾活血方"},{kw:["半月板损伤","膝关节交锁","弹响膝","下蹲痛","MRI确诊"],t:"半月板损伤",c:"<span class='tag'>西医</span>膝关节扭转力致半月板撕裂。关节交锁+弹响+疼痛+肿胀。内侧>外侧。MRI确诊。。<br><span class='tag'>中医</span>膝痹、瘀血阻络。",d:"急性期休息+冰敷<br>桶柄样撕裂/交锁：关节镜修补<br>活血止痛方"},{kw:["腰椎管狭窄","间歇性跛行","腰痛腿麻","后仰加重","弯腰缓解"],t:"腰椎管狭窄症",c:"<span class='tag'>西医</span>腰椎管变窄致神经受压。间歇性跛行(走一段腿麻痛，蹲下缓解)。后仰加重+弯腰缓解(购物车征)。。<br><span class='tag'>中医</span>腰腿痛、肾虚血瘀。",d:"保守：硬膜外封闭+理疗<br>严重：椎管减压术<br>独活寄生汤+补肾壮筋汤"},{kw:["颈椎病","颈肩痛","手麻","头晕","交感型颈椎病"],t:"颈椎病(交感型)",c:"<span class='tag'>西医</span>颈椎退变刺激交感神经。头晕+心悸+恶心+出汗+视力模糊。症状多样易误诊。。<br><span class='tag'>中医</span>眩晕、肝风内动兼瘀。",d:"避免长时间低头<br>颈托+理疗<br>天麻钩藤饮+葛根汤解肌"},{kw:["肩袖损伤","肩痛无力","上举困难","夜间痛","肩峰下撞击"],t:"肩袖损伤",c:"<span class='tag'>西医</span>肩袖肌腱撕裂/退变。上举/外展疼痛+无力+夜间痛。Neer撞击试验(+)。MRI确诊。。<br><span class='tag'>中医</span>肩痹、筋脉损伤。",d:"部分撕裂：保守(休息+理疗)<br>全层撕裂：关节镜修补<br>舒筋活血方"},{kw:["网球肘","肱骨外上髁炎","肘外侧痛","握物无力","Mills试验"],t:"肱骨外上髁炎(网球肘)",c:"<span class='tag'>西医</span>前臂伸肌总腱起点退变/微撕裂。肘外侧痛+握物无力。Mills试验(+)。反复用力伸腕者。。<br><span class='tag'>中医</span>肘劳、筋脉劳损。",d:"休息+冰敷+前臂支具<br>体外冲击波治疗<br>芍药甘草汤缓急止痛"},{kw:["社交恐惧症","社恐","害怕社交","脸红出汗","回避社交"],t:"社交焦虑障碍",c:"<span class='tag'>西医</span>对社交/表演情境显著恐惧+回避。怕被审视/评价→脸红+出汗+颤抖。影响工作/学习/社交。。<br><span class='tag'>中医</span>郁证、心胆气虚。",d:"认知行为治疗(C 中医</span>气阴两虚、津不上承。",d:"口干：人工唾液+针灸<br>张口训练<br>沙参麦冬汤益气养阴"},{kw:["晕动症","晕车","晕船","晕机","前庭功能"],t:"晕动症",c:"<span class='tag'>西医</span>前庭-视觉-本体感觉信息冲突。恶心+呕吐+面色苍白+出冷汗。适应-脱敏可改善。。<br><span class='tag'>中医</span>眩晕、痰浊中阻。",d:"乘车前30min口服茶苯海明<br>前庭康复训练<br>生姜止呕+藿香正气散"},{kw:["热射病","重症中暑","高热无汗","意识障碍","横纹肌溶解"],t:"热射病",c:"<span class='tag'>西医</span>重症中暑最严重类型。核心体温>40℃+中枢神经异常(昏迷/抽搐)+无汗。横纹肌溶解+DIC+MODS。死亡率50%+。。<br><span class='tag'>中医</span>暑温、气阴两脱。",d:"快速降温(黄金30min，冰浴/蒸发)<br>ICU支持<br>清暑益气汤(预防)"},{kw:["高原反应","急性高山病","高原肺水肿","高原脑水肿","海拔>2500m"],t:"高原病",c:"<span class='tag'>西医</span>急进高海拔(>2500m)致低氧。急性高山病(头痛+恶心+乏力)→高原肺水肿(咳嗽+粉红泡沫痰)→高原脑水肿(共济失调+昏迷)。。<br><span class='tag'>中医</span>高山反应、气虚血瘀。",d:"缓慢上升(每天<600m)<br>乙酰唑胺预防<br>红景天/党参益气"}]; // Will be loaded from remote/local

// ===== Remote KB Loading System =====
var KB_VERSION_KEY='qhy_kb_version';
var KB_DATA_KEY='qhy_kb_data';
var KB_TIME_KEY='qhy_kb_time';
var KB_URL='https://xushengqin666-cell.github.io/ai-tcm-app/kb.json';
var KB_CHECK_INTERVAL=30*60*1000; // Check every 30min

function loadKB(){
  // 1. Try localStorage cache first
  var cached=localStorage.getItem(KB_DATA_KEY);
  if(cached){
    try{
      KB=JSON.parse(cached);
      showKBStatus('本地缓存 ('+KB.length+'条)',true);
    }catch(e){localStorage.removeItem(KB_DATA_KEY);}
  }
  
  // 2. Fetch remote KB (always try to update)
  fetchRemoteKB();
  
  // 3. Schedule periodic checks
  setInterval(fetchRemoteKB,KB_CHECK_INTERVAL);
}

function fetchRemoteKB(){
  var v=localStorage.getItem(KB_VERSION_KEY)||'0';
  fetch(KB_URL+'?v='+Date.now(),{cache:'no-store'})
    .then(function(r){
      if(!r.ok)throw new Error('HTTP '+r.status);
      return r.json();
    })
    .then(function(data){
      if(!Array.isArray(data)||data.length===0)return;
      var newV=String(data.length)+'_'+data.slice(0,3).map(function(e){return e.t}).join('');
      if(newV!==v||!localStorage.getItem(KB_DATA_KEY)){
        KB=data;
        try{
          localStorage.setItem(KB_DATA_KEY,JSON.stringify(data));
          localStorage.setItem(KB_VERSION_KEY,newV);
          localStorage.setItem(KB_TIME_KEY,new Date().toISOString());
        }catch(e){/* localStorage full */}
        showKBStatus('已更新 ('+KB.length+'条)',true);
      }else{
        showKBStatus('最新 ('+KB.length+'条)',true);
      }
    })
    .catch(function(e){
      if(KB.length===0){
        showKBStatus('离线模式 (无数据)',false);
      }else{
        showKBStatus('离线缓存 ('+KB.length+'条)',true);
      }
    });
}

function showKBStatus(text,ok){
  var tEl=document.getElementById('kbUpdateTime');
  if(tEl){var lt=localStorage.getItem(KB_TIME_KEY);tEl.textContent=lt?new Date(lt).toLocaleString():'--';}
  var el=document.getElementById('kbStatus');
  if(el){el.textContent=text;el.style.color=ok?'#4db8a4':'#ff8f00';}
}

function forceUpdateKB(){
  localStorage.removeItem(KB_VERSION_KEY);
  showKBStatus('更新中...',false);
  fetchRemoteKB();
}

// ========== KB Search ==========
function searchKB(q){
  q=q.toLowerCase().trim();
  var best=null,bestScore=0;
  for(var i=0;i<KB.length;i++){
    var e=KB[i],score=0;
    // Title match (highest weight)
    var tl=e.t.toLowerCase();
    if(tl===q)score+=50;
    else if(tl.includes(q))score+=20;
    else if(q.includes(tl))score+=15;
    // Content match
    var cl=e.c.toLowerCase();
    if(cl.includes(q))score+=3;
    // Keyword match
    if(e.kw){for(var j=0;j<e.kw.length;j++){
      var kw=e.kw[j].toLowerCase();
      if(kw===q)score+=30;
      else if(q.includes(kw))score+=10;
      else if(kw.includes(q))score+=5;
      else{for(var k=0;k<Math.min(q.length,3);k++){if(kw.includes(q.substring(0,k+1)))score+=1;}}
    }}
    if(score>bestScore){bestScore=score;best=e;}
  }
  return bestScore>=5?best:null;
}


function findSimilar(q){
  q=q.toLowerCase().trim();
  var results=[];
  for(var i=0;i<KB.length;i++){
    var e=KB[i],score=0,tl=e.t.toLowerCase();
    // Fuzzy title match
    if(tl.includes(q)||q.includes(tl))score+=10;
    // Shared characters
    for(var j=0;j<q.length;j++){if(tl.includes(q[j]))score+=1;}
    // Keyword partial match
    if(e.kw){for(var k=0;k<e.kw.length;k++){var kw=e.kw[k].toLowerCase();if(kw.includes(q)||q.includes(kw))score+=5;}}
    if(score>=3)results.push({t:e.t,s:score});
  }
  results.sort(function(a,b){return b.s-a.s;});
  return results.slice(0,5).map(function(r){return r.t;});
}

// ========== Typewriter Effect ==========
function formatMD(text){
  return text.replace(/\*\*(.*?)\*\*/g,'<b>$1</b>')
    .replace(/^### (.+)$/gm,'<h4 style="margin:8px 0 4px;color:var(--pri)">$1</h4>')
    .replace(/^## (.+)$/gm,'<h3 style="margin:10px 0 4px;color:var(--pri-d)">$1</h3>')
    .replace(/^# (.+)$/gm,'<h2 style="margin:10px 0 4px;color:var(--pri-d)">$1</h2>')
    .replace(/^[-*] /gm,'• ')
    .replace(/\n/g,'<br>');
}
function typewriter(msgDiv, fullText, prefixHTML){
  return new Promise(function(resolve){
    msgDiv.innerHTML = prefixHTML + '<span id="tw-text"></span><span id="tw-cursor" class="tw-cursor"></span>';
    var i = 0;
    var speed = 22;
    var textEl = document.getElementById('tw-text');
    function tick(){
      if(i < fullText.length){
        if(textEl){
          // Plain text append during typing, format at end
          textEl.textContent = fullText.substring(0, i+1);
          i++;
          chatArea.scrollTop = 99999;
          setTimeout(tick, speed);
        } else {
          msgDiv.innerHTML = prefixHTML + '<span>' + formatMD(fullText) + '</span>';
          resolve();
        }
      } else {
        // Done - final formatted render
        var cursor = document.getElementById('tw-cursor');
        if(cursor) cursor.remove();
        var te = document.getElementById('tw-text');
        if(te) te.innerHTML = formatMD(fullText);
        resolve();
      }
    }
    tick();
  });
}

// Shared AI fetch helper
async function _fetchAI(sysPrompt, userMsg){
  var cfg=MODELS[curModel];
  var key=cfg.keyField?localStorage.getItem(cfg.keyField):null;
  if(!key)key=document.getElementById(cfg.keyField).value||null;
  var headers={'Content-Type':'application/json'};
  if(key)headers['Authorization']='Bearer '+key;
  var body=JSON.stringify({model:cfg.model,messages:[{role:'system',content:sysPrompt},{role:'user',content:userMsg}],stream:true});
  var resp=await fetch(cfg.base,{method:'POST',headers:headers,body:body});
  if(!resp.ok){
    try{await resp.text();}catch(e){}
    if(resp.status===401)throw new Error('API Key无效，请检查设置');
    if(resp.status===402)throw new Error('API余额不足');
    if(resp.status===429)throw new Error('请求过于频繁，请稍后重试');
    throw new Error('HTTP '+resp.status);
  }
  var reader=resp.body.getReader(),decoder=new TextDecoder(),full='',thinking='';
  while(true){
    var result=await reader.read();
    if(result.done)break;
    var chunk=decoder.decode(result.value,{stream:true});
    var lines=chunk.split('\n');
    for(var i=0;i<lines.length;i++){
      var line=lines[i];
      if(!line.startsWith('data: '))continue;
      var data=line.slice(6).trim();
      if(data==='[DONE]')continue;
      try{var json=JSON.parse(data);var delta=json.choices&&json.choices[0]&&json.choices[0].delta;if(!delta)continue;if(cfg.think&&delta.reasoning_content){thinking+=delta.reasoning_content;continue;}if(delta.content)full+=delta.content;}catch(e){}
    }
  }
  return {full:full,thinking:thinking,cfg:cfg};
}

  if(qi>=QS.length){showResult();return;}
  var pct=Math.round(qi/QS.length*100);
  wrap.innerHTML='<div class="prog-bar"><div class="fill" style="width:'+pct+'%"></div></div><div class="quiz-card"><h3>第 '+(qi+1)+' / '+QS.length+' 题</h3><p style="font-size:16px;margin-bottom:16px">'+QS[qi]+'</p><div class="opts"><div class="opt" onclick="ans(1)">是</div><div class="opt" onclick="ans(0.5)">有时</div><div class="opt" onclick="ans(0)">否</div></div></div>';
}

function ans(v){
  quizAns.push(v);
  renderQ();
}

function showResult(){
  var scores=CST.map(function(){return 0;});
  var map=[[0],[1],[2],[3],[4],[5],[6],[7],[8,0],[0],[2],[3],[4],[5],[6],[7],[8],[8]];
  for(var i=0;i<quizAns.length;i++){
    var idx=map[i];
    for(var j=0;j<idx.length;j++){
      if(idx[j]<9)scores[idx[j]]+=quizAns[i];
    }
  }
  var maxI=0;for(var i=1;i<9;i++){if(scores[i]>scores[maxI])maxI=i;}
  var c=CST[maxI],info=CI[c];
  document.getElementById('quizWrap').innerHTML='<div class="result-card"><h2>🎯 您的体质：'+c+'质</h2><div class="rsec"><h4>常见表现</h4><p>'+info.s+'</p></div><div class="rsec"><h4>体质特征</h4><p>'+info.t+'</p></div><div class="rsec"><h4>调理建议</h4><p>'+info.l+'</p></div><div class="rsec"><h4>推荐饮食</h4><p>'+info.d+'</p></div><button onclick="quizStarted=false;quizAns=[];startQuiz()" style="margin-top:16px;background:var(--pri);color:#fff;border:none;border-radius:12px;padding:10px 24px;font-size:14px;cursor:pointer">🔄 重新测试</button></div>';
}

// ========== Settings ==========
function loadKeys(){
  document.getElementById('groqKey').value=localStorage.getItem('groqKey')||'';
  document.getElementById('dsKey').value=localStorage.getItem('dsKey')||'';
}
function saveKeys(){
  localStorage.setItem('groqKey',document.getElementById('groqKey').value);
  localStorage.setItem('dsKey',document.getElementById('dsKey').value);
  addMsg('ai','✅ 设置已保存');
  showPanel('chat');
}


// ===== Init =====
document.addEventListener('DOMContentLoaded', function(){
  loadKB();
  // Show cached KB update time
  var lt=localStorage.getItem('qhy_kb_time');
  var tEl=document.getElementById('kbUpdateTime');
  if(tEl&&lt) tEl.textContent=new Date(lt).toLocaleString();
});
</script>
