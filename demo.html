<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0052d9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI健康助手">
<link rel="manifest" href="manifest.json">
<title>AI中西医健康助手</title>
<style>
/* ===== 基础重置 ===== */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --primary:#0052d9;--primary-dark:#003bb3;--primary-light:#4d8bd9;
  --success:#52c41a;--warning:#faad14;--danger:#ff4d4f;--info:#00d2ff;
  --bg:#f0f2f5;--card:#fff;--text:#1a1a1a;--text2:#555;--text3:#999;
  --shadow:0 2px 16px rgba(0,0,0,0.08);--shadow-sm:0 1px 4px rgba(0,0,0,0.06);
  --font:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);
  font-size:17px;line-height:1.6;overflow:hidden;-webkit-font-smoothing:antialiased}

/* ===== 布局 ===== */
.app-wrap{display:flex;flex-direction:column;height:100vh;max-width:480px;margin:0 auto;background:var(--bg)}

/* ===== 顶部 ===== */
.top-bar{background:linear-gradient(135deg,#0052d9 0%,#0041b3 100%);
  color:#fff;padding:env(safe-area-inset-top,14px) 14px 0;position:sticky;top:0;z-index:200;
  box-shadow:0 3px 16px rgba(0,82,217,0.35)}
.top-inner{padding:12px 0 0}
.top-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.app-brand{display:flex;align-items:center;gap:10px}
.app-icon{width:46px;height:46px;background:rgba(255,255,255,0.18);border-radius:13px;
  display:flex;align-items:center;justify-content:center;font-size:24px;backdrop-filter:blur(4px)}
.app-name{font-size:20px;font-weight:700;letter-spacing:0.3px}
.app-desc{font-size:12px;opacity:0.75}
.top-actions{display:flex;gap:8px}
.top-btn{background:rgba(255,255,255,0.15);border:none;border-radius:10px;
  width:40px;height:40px;display:flex;align-items:center;justify-content:center;
  font-size:18px;cursor:pointer;color:#fff;transition:background 0.2s}
.top-btn:hover{background:rgba(255,255,255,0.28)}

/* ===== 模式切换 ===== */
.mode-scroll{overflow-x:auto;scrollbar-width:none;padding:0 10px 10px;
  display:flex;gap:6px;background:linear-gradient(135deg,#0052d9 0%,#0041b3 100%);padding-top:2px}
.mode-scroll::-webkit-scrollbar{display:none}
.mode-btn{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1.5px solid rgba(255,255,255,0.35);
  background:transparent;color:rgba(255,255,255,0.82);font-size:15px;font-weight:500;
  cursor:pointer;transition:all 0.2s;font-family:var(--font);white-space:nowrap}
.mode-btn.active{background:#fff;color:#0052d9;border-color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,0.15)}

/* ===== 快速输入 ===== */
.quick-bar{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;
  background:rgba(255,255,255,0.06);border-radius:0 0 16px 16px}
.quick-chip{padding:5px 12px;border-radius:14px;border:1px solid rgba(255,255,255,0.28);
  background:transparent;color:#fff;font-size:13px;cursor:pointer;transition:all 0.18s;
  font-family:var(--font);white-space:nowrap}
.quick-chip:hover,.quick-chip:active{background:rgba(255,255,255,0.22)}

/* ===== 对话区 ===== */
.chat{flex:1;overflow-y:auto;padding:14px 10px 130px;
  scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.chat::-webkit-scrollbar{width:3px}
.chat::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.12);border-radius:2px}

/* ===== 消息 ===== */
.msg{display:flex;gap:9px;margin-bottom:14px;animation:msgIn 0.28s ease}
.msg.user{flex-direction:row-reverse}
.msg-avatar{width:36px;height:36px;border-radius:11px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:16px}
.msg.user .msg-avatar{background:linear-gradient(135deg,#0052d9,#003bb3);color:#fff}
.msg.ai .msg-avatar{background:#fff;border:1.5px solid #e5e7eb;color:#0052d9}
.msg-body{max-width:80%}
.msg-content{padding:11px 15px;border-radius:14px;font-size:18px;line-height:1.7;
  box-shadow:var(--shadow);word-break:break-word}
.msg.user .msg-content{background:linear-gradient(135deg,#0052d9,#0041b3);color:#fff;
  border-radius:14px 3px 14px 14px}
.msg.ai .msg-content{background:#fff;color:var(--text);border-radius:3px 14px 14px 14px}
.msg-time{font-size:11px;color:var(--text3);margin-top:4px;padding:0 3px}

/* ===== 医学卡片 ===== */
.emergency-box{background:#fffbea;border:1.5px solid #ffe58f;border-radius:12px;padding:12px;margin-top:10px}
.emergency-box h5{color:#d48806;font-size:16px;font-weight:600;margin-bottom:5px}
.emergency-box p{color:#7c4600;font-size:17px}
.med-section{background:#f0f5ff;border:1.5px solid #dce8ff;border-radius:12px;padding:12px;margin-top:10px}
.med-section h4{color:#0052d9;font-size:16px;font-weight:600;margin-bottom:8px}
.med-section ul{list-style:none;padding:0;margin:0}
.med-section li{padding:4px 0;font-size:17px;color:#333;border-bottom:1px solid rgba(0,0,0,0.05);display:flex;align-items:flex-start;gap:6px}
.med-section li:last-child{border:none}
.med-section li::before{content:'•';color:#0052d9;font-weight:700;flex-shrink:0}
.drug-warn{background:#fff5f5;border:1.5px solid #ffd4d4;border-radius:12px;padding:12px;margin-top:10px}
.drug-warn h5{color:#e83e3e;font-size:16px;font-weight:600;margin-bottom:5px}
.drug-warn p{color:#c00;font-size:17px}
.diet-box{background:#f6ffed;border:1.5px solid #b7eb8f;border-radius:12px;padding:12px;margin-top:10px}
.diet-box h4{color:#389e0d;font-size:16px;font-weight:600;margin-bottom:6px}
.herb-box{background:#fef7ff;border:1.5px solid #efdbff;border-radius:12px;padding:12px;margin-top:10px}
.herb-box h4{color:#722ed1;font-size:16px;font-weight:600;margin-bottom:6px}
.synergy-box{background:#fff7e6;border:1.5px solid #ffd591;border-radius:12px;padding:12px;margin-top:10px}
.synergy-box h4{color:#d46b08;font-size:16px;font-weight:600;margin-bottom:6px}
.drug-warn + p,.herb-box + p,.diet-box + p,.med-section + p{padding:8px 0 0}
.memory-badge{display:inline-block;background:linear-gradient(90deg,#667eea,#764ba2);
  color:#fff;padding:3px 10px;border-radius:12px;font-size:13px}

/* ===== 底部输入 ===== */
.input-area{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;
  background:#fff;border-top:1px solid rgba(0,0,0,0.08);
  padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));z-index:100}
.input-inner{display:flex;gap:8px;align-items:flex-end}
.chat-input{flex:1;min-height:48px;max-height:120px;border:1.5px solid #e5e7eb;
  border-radius:24px;padding:8px 18px;outline:none;font-size:18px;line-height:1.5;
  resize:none;font-family:var(--font);background:#f8f9fa;transition:border-color 0.2s,background 0.2s}
.chat-input:focus{border-color:#0052d9;background:#fff;box-shadow:0 0 0 3px rgba(0,82,217,0.08)}
.send-btn{width:48px;height:48px;border-radius:50%;border:none;
  background:linear-gradient(135deg,#0052d9,#003bb3);color:#fff;font-size:20px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
  transition:transform 0.15s;box-shadow:0 3px 10px rgba(0,82,217,0.3)}
.send-btn:hover{transform:scale(1.07)}
.send-btn:active{transform:scale(0.93)}

/* ===== 打字动画 ===== */
.typing-row{display:flex;gap:9px;margin-bottom:14px;align-items:flex-start}
.typing-dots{display:flex;gap:4px;padding:14px 18px;background:#fff;border-radius:3px 14px 14px 14px;box-shadow:var(--shadow)}
.typing-dots span{width:8px;height:8px;background:#0052d9;border-radius:50%;animation:dotBounce 1.4s infinite;opacity:0.5}
.typing-dots span:nth-child(2){animation-delay:.2s}
.typing-dots span:nth-child(3){animation-delay:.4s}
@keyframes dotBounce{0%,80%,100%{transform:scale(0.7);opacity:0.4}40%{transform:scale(1);opacity:1}}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ===== Toast ===== */
#toast{position:fixed;top:calc(env(safe-area-inset-top,14px) + 10px);left:50%;
  transform:translateX(-50%) translateY(-20px);
  background:rgba(24,24,24,0.88);color:#fff;padding:10px 24px;border-radius:24px;
  font-size:15px;z-index:9999;white-space:nowrap;opacity:0;
  transition:opacity 0.3s,transform 0.3s;pointer-events:none;backdrop-filter:blur(8px)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{background:#52c41a}
#toast.err{background:#ff4d4f}
#toast.info{background:#0052d9}

/* ===== 模态框 ===== */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:500;
  display:none;align-items:center;justify-content:center;padding:20px;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal-bg.open{display:flex}
.modal-card{background:#fff;border-radius:20px;width:100%;max-width:440px;
  max-height:88vh;overflow-y:auto;padding:24px;animation:modalIn 0.3s ease}
@keyframes modalIn{from{opacity:0;transform:scale(0.92) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}

/* ===== 反馈模态 ===== */
.fb-title{font-size:21px;font-weight:700;color:#1a1a1a;margin-bottom:4px}
.fb-sub{font-size:14px;color:#888;margin-bottom:18px}
.fb-stars{text-align:center;font-size:44px;margin:14px 0;cursor:pointer;letter-spacing:6px}
.fb-star{color:#ddd;transition:all 0.15s;display:inline-block}
.fb-star.active{color:#ffc107;transform:scale(1.18)}
.fb-star:hover{transform:scale(1.1)}
.fb-text{width:100%;height:115px;padding:14px;border-radius:12px;
  border:1.5px solid #e5e7eb;font-size:17px;resize:none;outline:none;
  font-family:var(--font);line-height:1.6;color:var(--text);background:#f8f9fa;
  transition:border-color 0.2s;margin-top:12px}
.fb-text:focus{border-color:#0052d9;background:#fff}
.fb-submit{width:100%;padding:14px;background:linear-gradient(135deg,#0052d9,#003bb3);
  border:none;border-radius:12px;color:#fff;font-size:18px;font-weight:600;
  cursor:pointer;font-family:var(--font);margin-top:12px;
  transition:transform 0.15s;box-shadow:0 4px 14px rgba(0,82,217,0.3)}
.fb-submit:active{transform:scale(0.97)}
.fb-cancel{width:100%;padding:12px;background:#f5f7fa;border:1.5px solid #e5e7eb;
  border-radius:12px;color:#555;font-size:16px;cursor:pointer;font-family:var(--font);margin-top:8px}

/* ===== 管理面板 ===== */
.admin-title{font-size:21px;font-weight:700;color:#1a1a1a;margin-bottom:16px}
.admin-stat{background:linear-gradient(135deg,#0052d9,#003bb3);border-radius:14px;
  padding:20px;text-align:center;color:#fff;margin-bottom:16px}
.admin-stat h3{font-size:42px;margin:0 0 4px}
.admin-stat p{font-size:13px;opacity:0.8;margin:0}
.admin-act{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.adm-btn{padding:14px;border-radius:12px;border:none;color:#fff;font-size:15px;
  font-weight:600;cursor:pointer;font-family:var(--font);text-align:center;
  transition:transform 0.15s}
.adm-btn:active{transform:scale(0.96)}
.adm-btn.grn{background:linear-gradient(135deg,#52c41a,#389e0d)}
.adm-btn.red{background:linear-gradient(135deg,#ff4d4f,#d4380d)}
.adm-btn.orn{background:linear-gradient(135deg,#fa8c16,#d46b08)}
.adm-btn.blu{background:linear-gradient(135deg,#0052d9,#003bb3)}
.fb-card{border-radius:12px;padding:14px;margin-bottom:10px;
  border-left:4px solid var(--primary);background:#f9fafb}
.fb-card .sc{font-size:18px;margin-bottom:5px}
.fb-card .txt{font-size:16px;color:#333;margin-bottom:5px;line-height:1.5;word-break:break-word}
.fb-card .tm{font-size:12px;color:#999}
.fb-empty{text-align:center;padding:30px;color:#bbb;font-size:15px}
.token-box{padding:14px;background:#f5f7fa;border-radius:12px;margin-bottom:14px}
.token-box .lbl{font-size:13px;color:#888;margin-bottom:8px}
.token-box input{width:100%;padding:10px 12px;border-radius:8px;border:1.5px solid #e5e7eb;
  font-size:15px;outline:none;font-family:var(--font);margin-bottom:6px}
.token-box .hint{font-size:12px;color:#999;margin-bottom:10px}
.token-box button{padding:8px 18px;background:#0052d9;border:none;border-radius:8px;
  color:#fff;font-size:14px;cursor:pointer;font-family:var(--font)}

/* ===== PWA ===== */
.pwa-bar{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,#0052d9,#003bb3);color:#fff;
  padding:10px 16px;border-radius:24px;font-size:14px;z-index:300;
  display:none;align-items:center;gap:10px;white-space:nowrap;
  box-shadow:0 4px 20px rgba(0,82,217,0.45);max-width:calc(100vw - 40px)}
.pwa-bar.show{display:flex}
.pwa-bar button{background:rgba(255,255,255,0.22);border:1px solid rgba(255,255,255,0.4);
  border-radius:12px;padding:5px 14px;color:#fff;font-size:13px;cursor:pointer}
</style>
</head>
<body>
<div class="app-wrap" id="app">

  <!-- 顶部 -->
  <div class="top-bar">
    <div class="top-inner">
      <div class="top-row">
        <div class="app-brand">
          <div class="app-icon">🏥</div>
          <div>
            <div class="app-name">AI健康助手</div>
            <div class="app-desc">中西医结合 · 智能问诊</div>
          </div>
        </div>
        <div class="top-actions">
          <button class="top-btn" onclick="openFB()" title="意见反馈">💬</button>
          <button class="top-btn" onclick="openAdmin()" title="管理">⚙️</button>
        </div>
      </div>
      <div class="mode-scroll">
        <button class="mode-btn active" data-m="consultation">🏥 咨询</button>
        <button class="mode-btn" data-m="tcm">中医</button>
        <button class="mode-btn" data-m="diet">饮食</button>
        <button class="mode-btn" data-m="knowledge">知识</button>
      </div>
      <div class="quick-bar" id="quickBar"></div>
    </div>
  </div>

  <!-- 对话区 -->
  <div class="chat" id="chat">
    <div class="msg ai">
      <div class="msg-avatar">🏥</div>
      <div class="msg-body">
        <div class="msg-content">
          <b>您好！我是AI中西医健康助手</b><br><br>
          请描述您的症状或健康问题，我会为您提供：<br>
          · 初步健康分析<br>· 中西医结合建议<br>· 饮食调理方案<br>· 药物注意事项<br>
          <span style="color:#e83e3e;font-size:15px"><br>⚠️ 如有紧急症状，请立即就医！</span>
        </div>
        <div class="msg-time">AI健康助手 · 刚刚</div>
      </div>
    </div>
  </div>

  <!-- 输入区 -->
  <div class="input-area">
    <div class="input-inner">
      <textarea class="chat-input" id="userInput" rows="1"
        placeholder="请描述您的症状或问题..."></textarea>
      <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
  </div>

</div>

<!-- PWA安装条 -->
<div class="pwa-bar" id="pwaBar">
  📱 立即安装到手机桌面
  <button onclick="installPWA()">安装</button>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- 反馈模态 -->
<div class="modal-bg" id="fbModal">
  <div class="modal-card">
    <div class="fb-title">📝 意见反馈</div>
    <div class="fb-sub">您的反馈会让App变得更好</div>
    <div class="fb-stars" id="fbStars">
      <span class="fb-star" data-v="1">★</span>
      <span class="fb-star" data-v="2">★</span>
      <span class="fb-star" data-v="3">★</span>
      <span class="fb-star" data-v="4">★</span>
      <span class="fb-star" data-v="5">★</span>
    </div>
    <textarea class="fb-text" id="fbText" placeholder="请写下您的建议或问题...（必填）"></textarea>
    <button class="fb-submit" onclick="submitFB()">提交反馈</button>
    <button class="fb-cancel" onclick="closeFB()">取消</button>
  </div>
</div>

<!-- 管理面板 -->
<div class="modal-bg" id="adminModal">
  <div class="modal-card">
    <div class="admin-title">⚙️ 管理面板</div>
    <div class="admin-stat">
      <h3 id="totalFB">0</h3>
      <p>条反馈记录</p>
    </div>
    <div class="admin-act">
      <button class="adm-btn grn" onclick="exportCSV()">📥 导出CSV</button>
      <button class="adm-btn red" onclick="pushAllWechat()">📱 推微信</button>
      <button class="adm-btn orn" onclick="autoLearn()" style="grid-column:1">🧠 自主学习</button>
      <button class="adm-btn blu" onclick="saveKBUpdate()" style="grid-column:2">💾 更新库</button>
    </div>
    <div class="token-box">
      <div class="lbl">Pushplus Token（微信推送用）：</div>
      <input id="ppToken" type="text" placeholder="请输入Pushplus token">
      <div class="hint">申请地址：pushplus.plus（微信扫码绑定后获取，完全免费）</div>
      <button onclick="savePPToken()">保存Token</button>
    </div>
    <div id="fbList" class="fb-empty">暂无反馈记录</div>
    <button class="fb-cancel" style="margin-top:14px" onclick="closeAdmin()">关闭</button>
  </div>
</div>

<script>
// ========== 全局 ==========
var currentMode = 'consultation';
var chatHistory = [];
var userConditions = [];
var isTyping = false;
var fbRating = 0;
var deferredPrompt = null;

// ========== PWA ==========
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault(); deferredPrompt = e;
  setTimeout(function(){ document.getElementById('pwaBar').classList.add('show'); }, 4000);
});
async function installPWA(){
  if(!deferredPrompt){ showToast('请用Chrome/Safari打开，从菜单选"添加到主屏幕"','info'); return; }
  deferredPrompt.prompt();
  var r = await deferredPrompt.userChoice;
  if(r.outcome==='accepted') showToast('安装成功！','ok');
  deferredPrompt = null;
  document.getElementById('pwaBar').classList.remove('show');
}

// ========== Toast ==========
function showToast(msg,type){
  var t=document.getElementById('toast');
  t.textContent=msg; t.className='show '+(type||'');
  setTimeout(function(){t.className=''},2800);
}

// ========== 知识库 ==========
var medicalKnowledge = {"感冒": {"cat": "常见病", "title": "普通感冒/流感", "content": "普通感冒多由病毒引起。症状：鼻塞、流涕、咽痛、轻度发热。<br><b>处理：</b>多休息、补充水分、必要时服用解热镇痛药（对乙酰氨基酚或布洛芬）。<br>若发热>38.5℃持续3天以上，或出现胸闷、呼吸困难，请立即就医。<br><br><b>西医治疗：</b>对乙酰氨基酚（退热）、伪麻黄碱（通鼻）。抗生素对病毒无效，勿滥用。<br><b>中医辅助：</b>金银花、连翘、薄荷——疏风清热。", "emergency": "高热不退（>39℃持续不降）、呼吸困难、意识模糊、剧烈头痛", "diet": "宜：清淡易消化（粥、汤面、蒸蛋）；富含维C水果（橙子、猕猴桃）；温开水。<br>忌：辛辣油腻、生冷食物、浓茶咖啡。", "drugs": "解热镇痛：对乙酰氨基酚、布洛芬<br>通鼻：伪麻黄碱<br>注意：抗生素对病毒无效，勿滥用。抗生素滥用会导致耐药和肠道菌群紊乱。", "synergy": "布洛芬+阿司匹林：增加胃肠道出血风险，不推荐联用。<br>多种复方感冒药不要叠加服用（可能含相同成分，导致过量）。", "food": "布洛芬避免与酒精同服（增加胃损伤风险）。服用感冒药期间避免驾驶和高空作业。", "herbs": "金银花、连翘、薄荷、荆芥——疏风清热"}, "发热": {"cat": "常见病", "title": "发热/发烧", "content": "发热是机体对感染的正常免疫反应，体温>37.3℃为发热。<br><b>处理原则：</b>38.5℃以下：物理降温（温水擦浴、贴退热贴）；38.5℃以上：服用退热药；多饮水。<br>退热是为了缓解不适，不是要把体温降到正常。<br>发热本身不需要抗生素，除非确认细菌感染。", "emergency": "体温>39.5℃持续不降、抽搐、皮疹、意识不清、颈部僵硬", "diet": "宜：流质/半流质（粥、汤、果蔬汁）；清淡少油。<br>忌：高蛋白高脂肪（加重代谢负担）、辛辣刺激、生冷。", "drugs": "退热：对乙酰氨基酚（更安全）、布洛芬（抗炎效果更好）<br>儿童：禁用阿司匹林（瑞氏综合征风险），用对乙酰氨基酚或布洛芬。", "synergy": "多种退热药同时服用可能造成肝损伤，不要叠加。<br>对乙酰氨基酚+酒精：显著增加肝毒性。", "food": "发热期间多喝水（1500-2000ml/天）。避免高糖饮料（增加代谢负担）。可喝淡盐水补充电解质。", "herbs": "柴胡、黄芩、生石膏（高热时）——清热泻火。儿童慎用生石膏。"}, "咳嗽": {"cat": "常见病", "title": "咳嗽", "content": "咳嗽是呼吸道清除异物和分泌物的保护性反射。<br><b>干咳：</b>右美沙芬（中枢镇咳）<br><b>有痰咳嗽：</b>氨溴索、乙酰半胱氨酸（稀释痰液，促排出）<br>咳嗽是身体的保护机制，不要盲目镇咳。若咳嗽>3周、咳血、胸痛，请立即就医。", "emergency": "咳血、呼吸困难、胸痛、咳嗽伴随高热", "diet": "宜：梨、百合、蜂蜜（1岁以上）、白萝卜、银耳；温热流质。<br>忌：甜腻、油炸、寒凉（冰品）、鱼腥发物。甜食会加重痰液生成。", "drugs": "干咳：右美沙芬（孕妇禁用）<br>有痰：氨溴索（餐后服）、乙酰半胱氨酸<br>注意：咳嗽>2周需就医排查病因。", "synergy": "中枢镇咳药（右美沙芬）+抗组胺药：可能引起呼吸抑制，慎用。<br>祛痰药+镇咳药：通常先祛痰再镇咳，顺序很重要。", "food": "蜂蜜（1岁以上儿童）有轻度止咳作用（循证医学证实）。温热蜂蜜水可缓解夜间咳嗽。", "herbs": "川贝、枇杷叶、杏仁（去皮尖）、桔梗——润肺止咳化痰。"}, "高血压": {"cat": "慢病", "title": "高血压", "content": "血压持续≥140/90 mmHg为高血压，是心脑血管疾病的重要危险因素。<br><b>治疗：</b>低盐饮食（<5g/天）、规律运动、体重管理、药物治疗。<br>常用降压药：CCB类（氨氯地平）、ARB类（缬沙坦）、ACEI类（贝那普利）。<br>目标：一般<130/80 mmHg（遵医嘱个体化设定）。", "emergency": "血压>180/120伴头痛、胸痛、视力模糊——高血压危象，立即就医！", "diet": "宜：DASH饮食（蔬果、全谷、低脂奶）、黑木耳、芹菜、山楂（含钾量高的食物）。<br>忌：腌制品、腊肉、酱菜（高钠）；浓茶、咖啡因（过量）。", "drugs": "CCB类：氨氯地平（常用，晨起服）<br>ARB类：缬沙坦（保护肾脏）<br>ACEI类：贝那普利（干咳副作用）<br>禁忌：擅自停药会导致血压反跳，危及生命。", "synergy": "地平类+β受体阻滞剂：可加重心衰。<br>普利类+沙坦类：不推荐联用（高钾血症风险）。<br>地平类+葡萄柚汁：增加血药浓度，服用硝苯地平者禁饮西柚汁。", "food": "西柚汁显著增加地平类药物血药浓度，服用硝苯地平、氨氯地平者禁饮西柚汁。", "herbs": "钩藤、天麻、罗布麻、决明子——平肝潜阳降压。中药降压不能替代正规降压药。"}, "糖尿病": {"cat": "慢病", "title": "糖尿病", "content": "诊断标准：空腹血糖≥7.0 mmol/L 或 餐后2h血糖≥11.1 mmol/L。<br><b>治疗（五驾马车）：</b>饮食控制、运动、药物治疗（二甲双胍/胰岛素等）、血糖监测、健康教育。<br>目标：空腹4.4-7.0 mmol/L，餐后<10 mmol/L，HbA1c<7%。<br>糖尿病本身不可怕，可怕的是并发症——心、脑、肾、眼、足。", "emergency": "低血糖（<3.9 mmol/L）伴昏迷或不能进食、酮症酸中毒（呼气有烂苹果味）", "diet": "宜：低GI食物（燕麦、糙米、荞麦、全麦）、绿叶蔬菜、优质蛋白。<br>忌：精制糖、白米白面、含糖饮料、粥类（升糖极快）。<br>水果在两餐之间吃，每天不超过200g。", "drugs": "二甲双胍：一线用药，随餐服用，减少肝糖输出。<br>胰岛素：需冷藏，遵医嘱调整剂量，餐前注射。<br>注意：勿自行停药！低血糖风险危及生命。", "synergy": "二甲双胍+大量酒精：增加乳酸酸中毒风险。<br>胰岛素+β受体阻滞剂：可能掩盖低血糖的早期症状（心悸、出汗）。<br>磺脲类+酒精：引起双硫仑样反应。", "food": "糖尿病患者慎用\"无糖食品\"——可能含大量碳水化合物，反而升高血糖。学会看食品营养标签。", "herbs": "天花粉、葛根、黄芪、山药——益气养阴、健脾生津。中药不能替代降糖药。"}, "胃炎": {"cat": "常见病", "title": "胃炎/胃部不适", "content": "胃黏膜炎症。症状：上腹痛、胀气、反酸、恶心、嗳气。<br><b>治疗：</b>抑酸药（奥美拉唑）、胃黏膜保护剂（铝碳酸镁）、促动力药（多潘立酮）。<br>建议：规律饮食、细嚼慢咽、避免刺激性食物、根治幽门螺杆菌。", "emergency": "呕血（红色或黑色咖啡渣样物质）、柏油样黑便、剧烈腹痛（急腹症）", "diet": "宜：清淡易消化（粥、馒头、软烂面）、蒸蛋、白面包。<br>忌：辛辣、生冷、油腻、过甜、过酸、咖啡、浓茶、酒精、吸烟。<br>规律进餐，每餐七八分饱，不要暴饮暴食。", "drugs": "抑酸：奥美拉唑（晨起空腹或餐前）、雷贝拉唑<br>护胃：铝碳酸镁（餐后嚼服）、瑞巴派特<br>促动力：多潘立酮（吗丁啉，餐前15-30分钟）", "synergy": "奥美拉唑+氯吡格雷：降低氯吡格雷疗效，增加心血管事件风险——优先换用泮托拉唑。<br>铝碳酸镁+其他口服药：减少其他药物吸收，间隔2小时服用。", "food": "酸奶可在胃黏膜形成保护层。温热牛奶（不加糖）可暂时缓解胃痛，但长期大量喝牛奶反而刺激胃酸分泌。", "herbs": "白芨、海螵蛸、砂仁、陈皮——和胃止痛、制酸。"}, "头痛": {"cat": "常见病", "title": "头痛", "content": "头痛原因众多：紧张性头痛、血管性头痛、偏头痛、鼻窦性头痛、继发性头痛。<br><b>处理：</b>休息、放松、止痛药。若头痛突然剧烈、伴发热/呕吐/视物模糊/偏瘫，请立即就医（排除脑卒中）。<br>偏头痛：常见于女性，有先兆（闪光、暗点），畏光畏声。", "emergency": "突然剧烈头痛（雷击样）、伴意识变化、颈项强直、视物模糊、偏瘫——立即就医！", "diet": "宜：规律进食（避免低血糖导致头痛）、坚果、深海鱼（Omega-3）。<br>忌：酒精（尤其红酒，是偏头痛常见诱因）、腌制肉（亚硝酸盐）、过量咖啡因。", "drugs": "止痛：布洛芬（抗炎型头痛首选）、对乙酰氨基酚（紧张性头痛）<br>偏头痛：曲普坦类（舒马曲普坦、佐米曲普坦）——发作早期服用<br>注意：每月止痛药使用>10天可致\"药物过度使用性头痛\"，形成恶性循环。", "synergy": "止痛药+酒精：显著增加胃肠道和肝脏损伤风险。<br>曲普坦类+麦角类药物：血管痉挛风险，禁止联用。", "food": "脱水是头痛最常见诱因之一，确保每日饮水1500-2000ml。咖啡因戒断也会引起头痛。", "herbs": "川芎、白芷、天麻、菊花——祛风通络止痛。"}, "失眠": {"cat": "常见病", "title": "失眠", "content": "入睡困难、睡眠浅、易醒、早醒，影响白天功能（疲劳、注意力下降）。<br><b>治疗：</b>睡眠卫生（规律作息、睡前1小时避免屏幕）、认知行为治疗（CBT-I，循证金标准）、药物（短期使用）。<br>长期失眠（>3个月）请就医，可能需要专业睡眠医学评估。", "emergency": "", "diet": "宜：温牛奶、酸枣仁粥（睡前2小时）、香蕉（含镁和色氨酸）、燕麦；清淡饮食。<br>忌：咖啡、浓茶（下午2点后禁饮）、酒精（虽促入睡但严重破坏睡眠结构，下半夜易醒）。", "drugs": "苯二氮卓类：艾司唑仑（仅短期，<2周）<br>非苯二氮卓类：佐匹克隆、右佐匹克隆（成瘾性较低）<br>褪黑素：倒时差者、老年失眠者<br>注意：安眠药有成瘾性，遵医嘱使用，逐步停药。", "synergy": "安眠药+酒精：严重呼吸抑制，风险极高，可致死！<br>安眠药+阿片类镇痛药（羟考酮等）：呼吸抑制风险叠加。", "food": "色氨酸食物（牛奶、火鸡、坚果）可促进褪黑素和5-羟色胺合成，有助于入睡。", "herbs": "酸枣仁、柏子仁、远志、合欢皮——养心安神促睡眠。酸枣仁是中医治疗失眠首选药。"}, "痛风": {"cat": "慢病", "title": "痛风", "content": "尿酸代谢紊乱，尿酸盐结晶沉积关节。典型表现：急性单关节炎（常见大脚趾，红肿热痛）。<br><b>治疗：</b>急性期：秋水仙碱（24小时内首选）或NSAIDs；缓解期：降尿酸药（非布司他、别嘌醇）——需长期规律服用，不能只在发作时吃。<br>目标：血尿酸<360μmol/L（含痛风石者<300μmol/L）。", "emergency": "痛风发作伴随高热（>39℃）、关节严重红肿（疑似化脓性关节炎）", "diet": "宜：低嘌呤饮食（低至中量嘌呤食物是安全的）、大量饮水（>2L/天）、樱桃（轻度降尿酸）。<br>忌：动物内脏、海鲜（尤其贝类、甲壳类）、浓肉汤、啤酒和白酒、含果糖饮料（果糖增加尿酸生成）。", "drugs": "急性期：秋水仙碱（首剂1mg，后每2小时0.5mg，直到症状缓解或出现腹泻，最大剂量6mg/24h）<br>NSAIDs：布洛芬（常规剂量）<br>降尿酸：非布司他（40-80mg/天）、别嘌醇（100-300mg/天，肾功能不全者减量）<br>注意：降尿酸药在初期会引发痛风发作，不要停药，可同时预防性服用秋水仙碱。", "synergy": "别嘌醇+巯唑嘌呤：显著增强骨髓抑制，禁忌联用！<br>非布司他+茶碱：茶碱血药浓度升高。", "food": "每日饮水>2L促进尿酸排泄。樱桃（每天10-12颗）有轻度降尿酸和抗炎作用，可作为辅助。", "herbs": "土茯苓、萆薢、薏苡仁、威灵仙——祛湿通络止痛。"}, "体质辨识": {"cat": "中医", "title": "中医九种体质辨识", "content": "<b>平和质</b>：精力充沛，睡眠安，食欲好，适应力强——保持健康生活方式。<br><br><b>气虚质</b>：气短乏力、易感冒、动则汗出——宜补气（人参、黄芪、党参），适度运动（太极拳），充足睡眠，避免过度劳累。<br><br><b>阳虚质</b>：畏寒怕冷、手足冰凉、腰膝酸冷——宜温阳（羊肉、桂圆、肉桂），多晒太阳（后背督脉），睡前泡脚（艾叶+生姜）。<br><br><b>阴虚质</b>：口干咽燥、手足心热、盗汗、便秘——宜滋阴（百合、银耳、麦冬、沙参），避免辛辣，保持睡眠，练习静坐冥想。<br><br><b>痰湿质</b>：体胖痰多、腹部肥满、舌苔厚腻——宜化痰祛湿（陈皮、薏米、冬瓜），增加运动（每天快走30分钟），控制饮食，规律作息。<br><br><b>湿热质</b>：面油腻、口苦、容易长痘、急躁易怒——宜清热利湿（苦瓜、绿豆、荷叶），增加运动出汗，避免熬夜和辛辣。<br><br><b>血瘀质</b>：面色晦暗、舌质紫暗、容易出现瘀斑——宜活血化瘀（三七、丹参、山楂），适度运动（太极拳、八段锦），保暖避寒。<br><br><b>气郁质</b>：情绪抑郁、焦虑不安、胁胀、咽部异物感——宜疏肝解郁（玫瑰花茶、佛手），保持心情舒畅，社交活动，练习深呼吸。<br><br><b>特禀质</b>：容易过敏（鼻炎、荨麻疹、哮喘）——查明过敏原并避免接触，适度运动增强体质，严重者需就医脱敏治疗。", "emergency": "", "diet": "根据体质类型选择食物。气虚宜补，痰湿宜祛，湿热宜清，阴虚宜滋，阳虚宜温。", "drugs": "", "synergy": "", "food": "", "herbs": "九种体质各有对应调理方案，具体用药请咨询中医师进行个性化辨证论治。"}, "高血脂": {"cat": "慢病", "title": "高脂血症", "content": "血脂异常：总胆固醇>5.2或LDL>3.4或TG>1.7 mmol/L。<br><b>治疗：</b>他汀类药物（阿托伐他汀、瑞舒伐他汀）是首选降脂药，可稳定动脉斑块。<br>生活方式：低脂饮食、运动、减重（5-10%体重可显著改善血脂）、戒烟限酒。", "emergency": "", "diet": "宜：燕麦（β-葡聚糖降胆固醇）、深海鱼（Omega-3降甘油三酯）、坚果（每天一小把）、橄榄油、绿茶。<br>忌：动物内脏、肥肉、奶油制品、油炸食品、蛋黄（每周<3个）。", "drugs": "他汀类：阿托伐他汀（晚间服效果更佳）、瑞舒伐他汀<br>贝特类：非诺贝特（高甘油三酯首选）<br>注意：他汀不与西柚同服（增加横纹肌溶解风险）。定期复查血脂和肝功能。", "synergy": "他汀+贝特（吉非贝齐）：显著增加肌病/横纹肌溶解风险——若需联用，优选非诺贝特而非吉非贝齐。<br>他汀+红霉素/克拉霉素：增加他汀血药浓度，增加肌病风险。", "food": "植物甾醇（存在于植物油、坚果中）可竞争性抑制肠道胆固醇吸收，辅助降脂。咖啡（每天1-2杯无糖咖啡）对血脂影响轻微，勿加奶油。", "herbs": "山楂、荷叶、决明子、绞股蓝——活血降脂。中药降脂不能替代他汀类药物。"}, "颈椎病": {"cat": "常见病", "title": "颈椎病", "content": "颈椎退行性病变，多因长期低头玩手机/电脑、不良姿势导致。<br>症状：颈部僵硬疼痛、头晕（椎动脉受压）、手臂麻木、肩背酸痛。<br><b>治疗：</b>物理治疗（牵引、理疗、针灸）、姿势矫正（每小时活动5分钟）、药物治疗（NSAIDs、肌肉松弛剂）。<br>严重神经压迫或脊髓受压需手术。", "emergency": "四肢麻木突然加重、大小便失禁（脊髓型颈椎病，需紧急手术）", "diet": "宜：含钙食物（牛奶、豆制品、芝麻）、富含胶原蛋白（骨汤）。<br>忌：长期低头。咖啡因摄入过多会加重钙流失。", "drugs": "止痛：布洛芬、塞来昔布（选择性COX-2抑制剂，胃肠道更安全）<br>肌肉松弛：乙哌立松<br>营养神经：甲钴胺（甲钴胺是活性维B12，优于普通B12）", "synergy": "", "food": "氨基葡萄糖和硫酸软骨素是软骨合成的原料，对早期颈椎病（软骨退变）可能有帮助，证据级别中等。", "herbs": "葛根（治疗颈椎病要药）、鸡血藤、川芎、桑枝——舒筋活络。"}, "骨质疏松": {"cat": "慢病", "title": "骨质疏松症", "content": "骨密度降低，骨脆性增加，常见于绝经后女性和老年人（65岁以上）。<br><b>治疗：</b>钙剂+维生素D（基础）、抗骨质疏松药（双膦酸盐类）。<br><b>预防：</b>负重运动（走路、跳舞）、充足日照（每天15-30分钟，露出手臂）、防跌倒（浴室扶手）。<br>女性绝经后建议做骨密度检测。", "emergency": "跌倒后剧烈疼痛，疑似骨折", "diet": "宜：高钙食物（牛奶1000-1200mg/天是金标准、豆制品、芝麻、虾皮、深绿色蔬菜）、维生素D（蛋黄、鱼肝油、晒太阳）。<br>忌：过多咖啡因（>3杯咖啡/天）、高钠（加速钙流失）、碳酸饮料。", "drugs": "钙剂：碳酸钙（随餐服，胃酸帮助吸收）或柠檬酸钙（空腹可服，更适合胃酸少的老年人）<br>骨吸收抑制剂：阿仑膦酸钠（晨起空腹服，直立30分钟后才能进食）<br>注意：钙和铁剂应分开服用（间隔2小时以上，否则竞争吸收）。", "synergy": "钙剂+维生素D：是所有抗骨质疏松治疗的基础，必须联用。<br>膦酸盐+钙剂：膦酸盐应空腹服，钙剂应于其他时间服，避免降低吸收。<br>雌激素+钙剂：更年期女性补充雌激素可有效预防骨质疏松，但需评估心血管和乳腺癌风险。", "food": "咖啡和可乐（含磷酸）会减少钙吸收。最佳饮料是白开水、淡茶、低脂牛奶。摄入足够蛋白质（0.8-1g/kg体重/天）有助于维持骨基质。", "herbs": "骨碎补、续断、杜仲、龟板——补肾强骨。中医认为\"肾主骨\"，骨质疏松多属肾虚。"}, "脂肪肝": {"cat": "常见病", "title": "脂肪肝", "content": "肝细胞脂肪沉积>5%，分酒精性（AFLD）和非酒精性（NAFLD/MASLD）。<br><b>治疗：</b>减重（减重5-10%可逆转脂肪肝，是最有效的方法）、戒酒（酒精性）、控制血糖血脂。<br>若转氨酶（ALT/AST）持续升高、肝脏纤维化需进一步评估。", "emergency": "肝区剧痛、黄疸（眼睛和皮肤发黄）", "diet": "宜：地中海饮食（橄榄油、深色蔬菜、全谷、鱼）、绿茶（儿茶素护肝）。<br>忌：酒精、果糖饮料、高糖高脂食品（蛋糕、奶茶）、油炸食品。", "drugs": "二甲双胍（合并糖尿病时，改善代谢）<br>维生素E（400IU/天，对NASH有一定效果，不适用于糖尿病患者）<br>注意：护肝药（易善复等）只能辅助，不可替代生活方式干预。", "synergy": "", "food": "咖啡（每天2-3杯无糖咖啡）可降低肝酶水平、减缓纤维化进展——这是循证医学证实的护肝饮食。", "herbs": "丹参、山楂、葛根、五味子——保肝降脂。"}, "亚健康": {"cat": "中医", "title": "亚健康状态", "content": "介于健康与疾病之间的灰色状态。表现：疲劳乏力、失眠、情绪低落、注意力不集中、各种躯体不适，但检查无器质性病变。<br><b>中医认为：</b>气血不足、肝郁气滞、脾虚湿困是常见原因。<br><b>调理：</b>规律作息、适度运动（每周3次，每次30分钟微微出汗）、情绪管理、必要时就医辨证调理。", "emergency": "", "diet": "宜：均衡营养、彩色蔬果（每天5种颜色以上）、优质蛋白（鸡蛋、牛奶、鱼、豆制品）、五谷杂粮。<br>忌：熬夜（23点后睡伤肝）、久坐不动（每小时站起来活动5分钟）、长期焦虑（可尝试冥想或太极拳）。", "drugs": "无特异性药物，针对症状治疗（失眠用安眠药，焦虑用抗焦虑药）——均需医生处方。请勿自行购买安定等镇静药。", "synergy": "", "food": "枸杞菊花茶养肝明目；山药健脾益气；黑芝麻补肾乌发——适合亚健康人群日常调理。", "herbs": "黄芪、党参、枸杞、菊花——益气养阴、清肝明目，适合亚健康气虚人群日常泡水。"}};

// ========== 打字效果 ==========
function typeWriter(el,fullHtml,callback){
  var i=0,buf='',inTag=false;
  el.innerHTML='<span></span>';
  var cs=document.createElement('span');cs.className='tc';el.appendChild(cs);
  function tick(){
    if(i<fullHtml.length){
      var c=fullHtml[i];
      if(c==='<'){inTag=true;buf+=c;}
      else if(c==='>'){inTag=false;buf+=c;el.innerHTML=fullHtml.substring(0,i+1)+'<span class="tc"></span>';}
      else if(!inTag){buf+=c;}
      i++;setTimeout(tick,14);
    }else{
      el.innerHTML=fullHtml;
      if(callback)callback();
    }
    document.getElementById('chat').scrollTop=document.getElementById('chat').scrollHeight;
  }
  tick();
}

function addMsg(role,html,time){
  var chat=document.getElementById('chat');

  chat.appendChild(div);

  return div.querySelector('.msg-content');
}

function sendMessage(){
  var input=document.getElementById('userInput');
  var message=input.value.trim();
  if(!message||isTyping)return;
  input.value='';
  chatHistory.push({role:'user',content:message});
  addMsg('user',message);
  showTyping();
  isTyping=true;
  setTimeout(function(){
    hideTyping();
    var response=generateResponse(message);
    var msgObj=addMsg('ai','');
    chatHistory.push({role:'ai',content:response});
    typeWriter(msgObj,response,function(){isTyping=false;});
  },600+Math.random()*600);
}

function generateResponse(msg){
  var orig=msg;
  msg=msg.toLowerCase();

  // === 紧急症状 ===
  var emKW=['高热','呼吸困难','胸痛','剧烈头痛','意识模糊','抽搐','呕血','便血','大出血','昏迷'];
  for(var i=0;i<emKW.length;i++){
    if(orig.indexOf(emKW[i])!==-1){
      return '<div class="emergency-box"><h5>🚨 紧急提醒：检测到"'+emKW[i]+'"</h5><p>这可能是危及生命的症状！请立即：</p><ul><li><strong>拨打120急救</strong></li><li>保持冷静，不要自行驾车</li><li>记录症状出现时间</li><li>不要自行服药</li></ul></div><div class="med-section"><h4>⚠️ 重要提示</h4><p>以上症状需要紧急医疗处理，任何延迟都可能造成严重后果。本系统不能替代急诊医疗服务，请立即就医！</p></div>';
    }
  }

  if(currentMode==='consultation')return genConsultation(orig,msg);
  if(currentMode==='tcm')return genTCM(orig,msg);
  if(currentMode==='diet')return genDiet(orig,msg);
  if(currentMode==='knowledge')return genKnowledge(orig,msg);
  return '请选择一个模式后描述您的症状。';
}

function findCondition(msg,orig){
  var keys=Object.keys(medicalKnowledge);
  for(var i=0;i<keys.length;i++){
    if(msg.indexOf(keys[i])!==-1||orig.indexOf(keys[i])!==-1)return{key:keys[i],data:medicalKnowledge[keys[i]]};
  }
  // 症状关键词
  var kwKeys=Object.keys(symptomKeywords);
  for(var i=0;i<kwKeys.length;i++){
    if(msg.indexOf(kwKeys[i])!==-1){
      var mapped=symptomKeywords[kwKeys[i]];
      if(mapped&&medicalKnowledge[mapped])return{key:mapped,data:medicalKnowledge[mapped]};
    }
  }
  return null;
}

// ========== 反馈系统 ==========
document.querySelectorAll('.fb-star').forEach(function(s){
  s.addEventListener('click',function(){
    fbRating=+this.dataset.v;
    document.querySelectorAll('.fb-star').forEach(function(st,i){
      st.classList.toggle('active',i<fbRating);
    });
  });
  s.addEventListener('mouseenter',function(){
    var r=+this.dataset.v;
    document.querySelectorAll('.fb-star').forEach(function(st,i){
      st.style.color=i<r?'#ffc107':'#ddd';
    });
  });
  s.addEventListener('mouseleave',function(){
    document.querySelectorAll('.fb-star').forEach(function(st,i){
      st.style.color=i<fbRating?'#ffc107':'#ddd';
    });
  });
});

function openFB(){document.getElementById('fbModal').classList.add('open');}
function closeFB(){document.getElementById('fbModal').classList.remove('open')}
function openAdmin(){
  document.getElementById('adminModal').classList.add('open');
  updateFBStats();
  loadFBList();
  document.getElementById('ppToken').value=localStorage.getItem('pp_token')||'';
}
function closeAdmin(){document.getElementById('adminModal').classList.remove('open')}

function savePPToken(){
  var t=document.getElementById('ppToken').value.trim();
  localStorage.setItem('pp_token',t);
  showToast('Pushplus Token已保存','ok');
}

function updateFBStats(){
  var list=JSON.parse(localStorage.getItem('tcm_feedbacks')||'[]');
  document.getElementById('totalFB').textContent=list.length;
}

function loadFBList(){
  var list=JSON.parse(localStorage.getItem('tcm_feedbacks')||'[]');
  var el=document.getElementById('fbList');
  if(list.length===0){el.className='fb-empty';el.textContent='暂无反馈记录';return;}
  el.className='';
  el.innerHTML=list.slice().reverse().slice(0,15).map(function(f){
    var sc='<span style="color:'+(f.rating>=4?'#52c41a':f.rating>=3?'#fa8c16':'#ff4d4f')+'">'+"★".repeat(f.rating||0)+'☆'.repeat(5-(f.rating||0))+'</span>';
    return '<div class="fb-card"><div class="sc">'+sc+'</div><div class="txt">'+(f.text||'无文字').replace(/</g,'&lt;').replace(/
/g,'<br>')+'</div><div class="tm">'+f.time+' · '+f.mode+'</div></div>';
  }).join('');
}

function submitFB(){
  var text=document.getElementById('fbText').value.trim();
  if(!text){showToast('请填写反馈内容','err');return;}
  var entry={rating:fbRating||0,text:text,time:new Date().toLocaleString('zh-CN'),mode:currentMode};
  var fbList=JSON.parse(localStorage.getItem('tcm_feedbacks')||'[]');
  fbList.push(entry);
  localStorage.setItem('tcm_feedbacks',JSON.stringify(fbList));
  pushToWechat(entry);
  closeFB();
  showToast('感谢反馈！已记录并推送','ok');
  document.getElementById('fbText').value='';
  fbRating=0;
  document.querySelectorAll('.fb-star').forEach(function(s){s.classList.remove('active');s.style.color='#ddd'});
  updateFBStats();
}

function pushToWechat(entry){
  var token=localStorage.getItem('pp_token')||'';
  if(!token){showToast('请先在管理面板配置Pushplus Token','info');return;}
  var content='★ AI健康助手用户反馈 ★\n\n⏰：'+entry.time+'\n⭐：'+(entry.rating||0)+'星\n📋：'+entry.mode+'\n📝：'+entry.text;
  fetch('https://www.pushplus.plus/send?token='+token+'&title=AI健康助手反馈&content='+encodeURIComponent(content)+'&type=txt',{mode:'no-cors'})
    .then(function(){showToast('微信推送成功','ok')})
    .catch(function(){showToast('微信推送失败','err')});
}

function exportCSV(){
  var list=JSON.parse(localStorage.getItem('tcm_feedbacks')||'[]');
  if(list.length===0){showToast('暂无反馈可导出','err');return;}
  var csv='\uFEFF评分,时间,模式,内容\n';
  list.forEach(function(f){
    csv+=(f.rating||0)+'星,"'+f.time+'","'+f.mode+'","'+(f.text||'').replace(/"/g,'""')+'"\n';
  });
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='feedback_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
  showToast('CSV已下载','ok');
}

function pushAllWechat(){
  var list=JSON.parse(localStorage.getItem('tcm_feedbacks')||'[]');
  if(list.length===0){showToast('暂无反馈','err');return;}
  var token=localStorage.getItem('pp_token')||'';
  if(!token){showToast('请先配置Pushplus Token','info');return;}
  var body='AI健康助手反馈汇总（共'+list.length+'条）\n\n';
  list.slice(-10).forEach(function(f,i){
    body+=(i+1)+'. '+f.time+' '+("★").repeat(f.rating||0)+'\n'+f.text+'\n\n';
  });
  fetch('https://www.pushplus.plus/send?token='+token+'&title=AI健康助手反馈汇总&content='+encodeURIComponent(body)+'&type=txt',{mode:'no-cors'})
    .then(function(){showToast('汇总已推送微信','ok')})
    .catch(function(){showToast('推送失败','err')});
}

// ========== 自主学习 ==========
function autoLearn(){
  var list=JSON.parse(localStorage.getItem('tcm_feedbacks')||'[]');
  if(list.length===0){showToast('暂无反馈可分析','err');return;}
  var existingKeys=Object.keys(medicalKnowledge);
  var newItems=[];
  var suggestions=[];

  // 简单关键词匹配 -> 知识库条目
  var mapping={
    '眼睛干':{key:'眼疲劳',title:'眼疲劳',content:'眼疲劳由长时间用眼、熬夜等引起。\n建议：每20分钟远眺20秒、做眼保健操、必要时使用人工泪液。\n饮食：富含叶黄素（菠菜、玉米）、蓝莓、动物肝脏。'},
    '腰疼':{key:'腰痛',title:'腰痛/腰肌劳损',content:'腰痛常见原因：腰肌劳损、腰椎间盘突出、骨质疏松。<br>急性期：卧床休息、热敷；慢性期：适度运动（游泳、瑜伽）、核心肌群训练。'},
    '腿疼':{key:'关节痛',title:'关节痛',content:'关节痛常见原因：骨关节炎、痛风、滑膜炎。<br>建议：休息、适度热敷、避免加重动作。'},
    '胃酸':{key:'胃炎',title:'胃酸过多',content:'胃酸过多：反酸、烧心、胃部灼热感。<br>治疗：奥美拉唑（晨起空腹服）、铝碳酸镁（餐后嚼服）。'},
    '皮疹':{key:'特禀',title:'皮肤过敏/皮疹',content:'皮肤过敏：常见原因有食物过敏、接触性过敏、药物过敏。<br>处理：避免搔抓、冷敷、口服抗组胺药（氯雷他定）。'},
    '湿疹':{key:'湿热',title:'湿疹',content:'湿疹：慢性过敏性皮肤病，表现为红斑、瘙痒、水疱、渗出。<br>中医属"湿热浸淫"，宜清热利湿。'},
    '过敏':{key:'特禀',title:'过敏体质',content:'过敏体质（特禀质）：容易对花粉、尘螨、食物、药物等过敏。<br>处理：查明过敏原并严格避免；严重者需就医进行脱敏治疗。'},
  };

  list.forEach(function(f){
    var txt=f.text;
    Object.keys(mapping).forEach(function(kw){
      if(txt.indexOf(kw)!==-1&&!existingKeys.some(function(ek){return txt.indexOf(ek)!==-1})){
        if(!newItems.some(function(n){return n.key===mapping[kw].key})){
          newItems.push(mapping[kw]);
          suggestions.push('新增知识：'+mapping[kw].title);
        }
      }
    });
  });

  if(newItems.length===0){
    showToast('暂无新的自主学习内容','info');
  } else {
    var stored=JSON.parse(localStorage.getItem('tcm_learned')||'[]');
    newItems.forEach(function(n){
      if(!stored.some(function(s){return s.key===n.key}))stored.push(n);
    });
    localStorage.setItem('tcm_learned',JSON.stringify(stored));
    showToast('已分析'+suggestions.length+'条新知识，已保存','ok');
  }
}

function saveKBUpdate(){
  var learned=JSON.parse(localStorage.getItem('tcm_learned')||'[]');
  if(learned.length===0){showToast('暂无新知识可更新','info');return;}
  learned.forEach(function(item){
    if(!medicalKnowledge[item.key]){
      medicalKnowledge[item.key]={
        cat:'用户反馈新增',title:item.title,content:item.content,
        emergency:'',diet:'',drugs:'',synergy:'',food:'',herbs:''
      };
    }
  });
  localStorage.setItem('tcm_kb_snapshot',JSON.stringify(learned));
  showToast('知识库已更新'+learned.length+'条','ok');
}
