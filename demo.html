body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f5;min-height:100vh}

.q-page{min-height:100vh;background:linear-gradient(135deg,#667eea,#764ba2);padding:20px;display:none}

.pfill{background:white;height:100%;border-radius:10px;transition:width .3s}
.ptext{color:white;font-size:12px;text-align:center;display:block;margin:8px 0 16px}
.qcard{background:white;border-radius:20px;padding:30px 24px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.tag{background:linear-gradient(135deg,#667eea,#764ba2);color:white;padding:6px 16px;border-radius:20px;font-size:12px;display:inline-block;margin-bottom:16px}
.qtext{font-size:18px;font-weight:600;color:#1a1a2e;display:block;margin-bottom:24px;line-height:1.6}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{background:#f8f9fa;border:2px solid transparent;border-radius:12px;padding:16px 20px;transition:all .2s;cursor:pointer}
.opt:hover{background:#f0f4ff}
.opt.on{background:linear-gradient(135deg,#667eea,#764ba2);border-color:white}

.olabel{font-size:15px;color:#333}
.nav{display:flex;gap:12px;margin-top:30px}
.btn{flex:1;padding:16px;border-radius:12px;font-size:16px;font-weight:600;border:none;cursor:pointer}
.btn-prev{background:rgba(255,255,255,.2);color:white}
.btn-next{background:white;color:#667eea}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tip{color:rgba(255,255,255,.7);font-size:12px;text-align:center;display:block;margin-top:20px}
.rpage{min-height:100vh;background:#f8f9fa;padding-bottom:40px;display:none}
.rheader{background:linear-gradient(135deg,#667eea,#764ba2);padding:40px 20px 30px;text-align:center}
.rtitle{color:white;font-size:22px;font-weight:700}
.rdate{color:rgba(255,255,255,.8);font-size:13px;display:block;margin-top:8px}
.rcard{background:white;margin:-20px 16px 16px;border-radius:20px;padding:30px 24px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.08)}
.badge{background:linear-gradient(135deg,#667eea,#764ba2);display:inline-block;padding:12px 32px;border-radius:30px;margin-bottom:16px}
.btext{color:white;font-size:24px;font-weight:700}
.score{color:#667eea;font-size:16px;font-weight:600;display:block;margin-bottom:12px}
.desc{color:#666;font-size:14px;line-height:1.6}
.section{background:white;margin:0 16px 16px;border-radius:16px;padding:24px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.shead{display:flex;align-items:center;margin-bottom:16px}
.sicon{font-size:22px;margin-right:10px}
.stitle{font-size:17px;font-weight:700;color:#1a1a2e}
.scontent{font-size:14px;color:#555;line-height:1.8}
.syms{display:flex;flex-wrap:wrap;gap:10px}
.sym{background:#f0f4ff;color:#667eea;padding:8px 16px;border-radius:20px;font-size:13px}
.ablock{margin-bottom:20px}
.ablock:last-child{margin-bottom:0}
.atitle{font-size:15px;font-weight:600;color:#1a1a2e;display:block;margin-bottom:12px}
.ftags{display:flex;flex-wrap:wrap;gap:8px}
.ftag{padding:8px 14px;border-radius:8px;font-size:13px}
.ftag.good{background:#e8f5e9;color:#2e7d32}
.ftag.bad{background:#ffebee;color:#c62828}
.llist{display:flex;flex-direction:column;gap:10px}
.litem{display:flex;align-items:flex-start}
.ldot{color:#667eea;margin-right:8px;font-weight:bold}
.ltext{font-size:14px;color:#555;flex:1}
.alist{display:flex;flex-direction:column;gap:12px}
.aitem{background:#f8f9fa;padding:14px;border-radius:10px}
.aname{font-size:15px;font-weight:600;color:#667eea;display:block;margin-bottom:4px}
.adesc{font-size:13px;color:#666}
.disc{background:#fff8e1;margin:0 16px 20px;border-radius:12px;padding:16px;border-left:4px solid #ffc107}
.dtitle{font-size:14px;font-weight:600;color:#f57c00;display:block;margin-bottom:8px}
.dtext{font-size:12px;color:#666;line-height:1.6}
.actions{display:flex;flex-direction:column;gap:12px;padding:0 16px}
.abtn{padding:16px;border-radius:12px;font-size:16px;font-weight:600;border:none;cursor:pointer}
.abtn.share{background:#e8f5e9;color:#2e7d32}
.abtn.plan{background:linear-gradient(135deg,#667eea,#764ba2);color:white}
.abtn.home{background:white;color:#667eea;border:2px solid #667eea}

let ci=0,ans={};
function startQ(){document.getElementById('home').style.display='none';document.getElementById('qpage').style.display='block';renderQ();}
function renderQ(){const q=qs[ci];const pct=((ci+1)/qs.length*100).toFixed(2);document.getElementById('pfill').style.width=pct+'%';document.getElementById('ptext').textContent=(ci+1)+' / '+qs.length;let html='<span class="tag">'+q.cat+'</span><span class="qtext">'+q.text+'</span><div class="opts">';q.opts.forEach(o=>{const on=ans[q.id]===o.v?' on':'';html+='<div class="opt'+on+'" onclick="sel('+o.v+')"><span class="olabel">'+o.l+'</span></div>';});html+='</div>';document.getElementById('qcard').innerHTML=html;document.getElementById('prevBtn').disabled=ci===0;document.getElementById('nextBtn').disabled=!ans[q.id];document.getElementById('nextBtn').textContent=ci===qs.length-1?'查看报告':'下一题';}
function sel(v){ans[qs[ci].id]=v;renderQ();setTimeout(()=>{if(ci<qs.length-1)nextQ();},300);}
function nextQ(){if(ci===qs.length-1)submit();else{ci++;renderQ();}}
function prevQ(){if(ci>0){ci--;renderQ();}}
function submit(){const scores={};const cnts={};qs.forEach(q=>{if(ans[q.id]){scores[q.cat]=(scores[q.cat]||0)+ans[q.id];cnts[q.cat]=(cnts[q.cat]||0)+1;}});const res={};for(let c in scores)res[c]=Math.round((scores[c]/cnts[c]-1)/4*100);let max=0,primary='平和质';for(let t in res)if(t!=='平和质'&&res[t]>max){max=res[t];primary=t;}if(res['平和质']>=60&&res['平和质']>=max)primary='平和质';showReport(primary,res[primary],res);}
function showReport(type,score,all){document.getElementById('qpage').style.display='none';document.getElementById('rpage').style.display='block';const d=tdata[type];document.getElementById('rdate').textContent=new Date().toLocaleString();document.getElementById('btext').textContent=type;document.getElementById('score').textContent='得分: '+score+'分';document.getElementById('desc').textContent=d.desc;document.getElementById('syms').innerHTML=d.syms.map(s=>'<span class="sym">'+s+'</span>').join('');document.getElementById('tcm').textContent=d.tcm;document.getElementById('western').textContent=d.western;document.getElementById('diet').innerHTML=d.diet.map(f=>'<span class="ftag good">'+f+'</span>').join('');document.getElementById('avoid').innerHTML=d.avoid.map(f=>'<span class="ftag bad">'+f+'</span>').join('');document.getElementById('life').innerHTML=d.life.map(l=>'<div class="litem"><span class="ldot">•</span><span class="ltext">'+l+'</span></div>').join('');document.getElementById('acu').innerHTML=d.acu.map(a=>{const p=a.split('：');return'<div class="aitem"><span class="aname">'+p[0]+'</span><span class="adesc">'+(p[1]||'')+'</span></div>';}).join('');}
function goHome(){document.getElementById('rpage').style.display='none';document.getElementById('home').style.display='flex';ci=0;ans={};}
