<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI中西医健康助手 — 昆明医科大学专业知识库</title>
<meta name="description" content="基于昆明医科大学专业知识库的AI健康咨询助手，涵盖72种常见病、中医体质辨识与科学饮食方案">
<meta name="theme-color" content="#1a472a">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* ===== CSS RESET & VARIABLES ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#faf8f5;--surface:#ffffff;--primary:#1a472a;--primary-light:#2d6a4f;
  --primary-dark:#0d2818;--accent:#c9a84c;--accent-light:#f0e6c8;
  --text:#2c2c2c;--text-secondary:#6b7280;--text-light:#9ca3af;
  --border:#e8e4de;--shadow:0 2px 12px rgba(0,0,0,.06);
  --shadow-lg:0 8px 32px rgba(0,0,0,.10);--radius:16px;--radius-sm:10px;
  --radius-xs:6px;--transition:all .25s cubic-bezier(.4,0,.2,1);
  --chat-bg:#f0ede8;--user-bubble:#1a472a;--ai-bubble:#ffffff;
  --danger:#dc2626;--success:#16a34a;--warning:#f59e0b;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;overflow:hidden;height:100dvh}

/* ===== APP SHELL ===== */
.app{display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto;position:relative;background:var(--bg)}
@media(min-width:481px){.app{border-left:1px solid var(--border);border-right:1px solid var(--border);box-shadow:var(--shadow-lg)}}

/* ===== HEADER ===== */
.header{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-light) 60%,#3a7d5c 100%);color:#fff;padding:16px 20px;flex-shrink:0;position:relative;overflow:hidden}
.header::before{content:"";position:absolute;top:-40%;right:-20%;width:200px;height:200px;background:radial-gradient(circle,rgba(201,168,76,.15) 0%,transparent 70%);border-radius:50%}
.header-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:10px}
.brand-icon{width:40px;height:40px;background:rgba(255,255,255,.15);backdrop-filter:blur(10px);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px}
.brand-text h1{font-size:17px;font-weight:700;letter-spacing:.3px}
.brand-text p{font-size:11px;opacity:.75;margin-top:1px;letter-spacing:.2px}
.header-actions{display:flex;gap:6px}
.header-btn{width:36px;height:36px;border:none;background:rgba(255,255,255,.12);backdrop-filter:blur(8px);border-radius:10px;color:#fff;font-size:16px;cursor:pointer;transition:var(--transition);display:flex;align-items:center;justify-content:center}
.header-btn:hover{background:rgba(255,255,255,.22)}
.header-btn:active{transform:scale(.92)}

/* ===== MODE TABS ===== */
.modes{display:flex;gap:6px;padding:12px 16px 8px;flex-shrink:0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.modes::-webkit-scrollbar{display:none}
.mode-btn{flex-shrink:0;padding:10px 16px;border:1.5px solid var(--border);background:var(--surface);border-radius:var(--radius-sm);cursor:pointer;transition:var(--transition);text-align:center;min-width:80px}
.mode-btn .mode-label{font-size:13px;font-weight:600;color:var(--text)}
.mode-btn .mode-desc{display:block;font-size:10px;color:var(--text-light);margin-top:2px}
.mode-btn.active{border-color:var(--primary);background:linear-gradient(135deg,rgba(26,71,42,.06),rgba(45,106,79,.04));color:var(--primary)}
.mode-btn.active .mode-label{color:var(--primary)}
.mode-btn:hover{border-color:var(--primary-light)}
.mode-btn:active{transform:scale(.96)}

/* ===== CHIPS BAR ===== */
.chips-bar{display:flex;gap:6px;padding:4px 16px 10px;flex-shrink:0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;animation:fadeInUp .3s ease}
.chips-bar::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:6px 14px;border:1px solid var(--border);background:var(--surface);border-radius:20px;font-size:12px;color:var(--text-secondary);cursor:pointer;transition:var(--transition);white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--primary);background:var(--accent-light)}
.chip:active{transform:scale(.94)}

/* ===== CHAT AREA ===== */
.chat-area{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.chat-area::-webkit-scrollbar{width:4px}
.chat-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* Messages */
.msg{display:flex;gap:10px;margin-bottom:16px;animation:fadeInUp .35s ease}
.msg.user{flex-direction:row-reverse}
.msg-avatar{width:34px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.msg.ai .msg-avatar{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff}
.msg.user .msg-avatar{background:linear-gradient(135deg,var(--accent),#d4b65c);color:#fff}
.msg-bubble{max-width:78%;padding:12px 16px;border-radius:var(--radius);font-size:14px;line-height:1.7;word-break:break-word}
.msg.ai .msg-bubble{background:var(--surface);border:1px solid var(--border);border-top-left-radius:4px;box-shadow:var(--shadow)}
.msg.user .msg-bubble{background:var(--user-bubble);color:#fff;border-top-right-radius:4px}

/* KB Card inside AI message */
.kb-card{margin-top:10px;background:linear-gradient(135deg,#f7f5f0,#faf8f5);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden}
.kb-card-header{padding:10px 14px;background:linear-gradient(135deg,rgba(26,71,42,.08),rgba(45,106,79,.05));border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.kb-card-header .cat-icon{font-size:18px}
.kb-card-header .cat-name{font-size:11px;color:var(--text-light);background:var(--surface);padding:2px 8px;border-radius:10px;border:1px solid var(--border)}
.kb-card-header .title{font-size:13px;font-weight:700;color:var(--primary);flex:1}
.kb-card-body{padding:12px 14px}
.kb-section{margin-bottom:10px}
.kb-section:last-child{margin-bottom:0}
.kb-section-title{font-size:11px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;display:flex;align-items:center;gap:5px}
.kb-section-title::after{content:"";flex:1;height:1px;background:var(--border)}
.kb-section-content{font-size:12.5px;color:var(--text);line-height:1.7}
.kb-section-content strong{color:var(--primary-dark)}
.kb-tag{display:inline-block;padding:2px 8px;margin:2px;background:var(--accent-light);color:var(--primary-dark);border-radius:10px;font-size:11px;font-weight:500}
.kb-emergency{background:rgba(220,38,38,.06);border:1px solid rgba(220,38,38,.15);border-radius:var(--radius-xs);padding:8px 12px;font-size:12px;color:var(--danger);display:flex;align-items:flex-start;gap:6px}
.kb-emergency::before{content:"⚠️";flex-shrink:0}

/* TCM Card */
.tcm-card{margin-top:10px;background:linear-gradient(135deg,#f7f5f0,#faf8f5);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden}
.tcm-card .kb-card-header{background:linear-gradient(135deg,rgba(34,139,34,.08),rgba(46,160,67,.05))}
.tcm-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;background:linear-gradient(135deg,rgba(34,139,34,.1),rgba(46,160,67,.06));color:#1a5c2a;font-size:11px;font-weight:600;border-radius:12px;margin-bottom:8px}

/* Typing indicator */
.typing{display:flex;gap:4px;padding:8px 0}
.typing span{width:7px;height:7px;background:var(--primary-light);border-radius:50%;animation:typing 1.4s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes typing{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}

/* ===== INPUT BAR ===== */
.input-bar{padding:10px 16px 20px;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0}
.input-row{display:flex;gap:8px;align-items:flex-end}
.input-wrap{flex:1;background:var(--bg);border:1.5px solid var(--border);border-radius:24px;padding:10px 16px;transition:var(--transition);display:flex;align-items:center}
.input-wrap:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,71,42,.1)}
.input-wrap textarea{width:100%;border:none;background:none;font-family:var(--font);font-size:14px;line-height:1.5;resize:none;max-height:100px;outline:none;color:var(--text)}
.send-btn{width:44px;height:44px;border:none;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;border-radius:50%;font-size:18px;cursor:pointer;transition:var(--transition);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.send-btn:hover{transform:scale(1.05);box-shadow:0 4px 16px rgba(26,71,42,.3)}
.send-btn:active{transform:scale(.92)}
.send-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
.disclaimer{text-align:center;font-size:10px;color:var(--text-light);margin-top:6px}

/* ===== MODAL OVERLAY ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);z-index:100;display:none;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;width:100%;max-width:480px;max-height:85dvh;overflow-y:auto;padding:24px 20px 40px;animation:slideUp .35s cubic-bezier(.4,0,.2,1)}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:4px;margin:0 auto 20px}
.modal h2{font-size:18px;font-weight:700;color:var(--primary);margin-bottom:16px;text-align:center}
.modal-close{position:absolute;top:16px;right:16px;width:32px;height:32px;border:none;background:var(--bg);border-radius:50%;font-size:16px;cursor:pointer;color:var(--text-secondary);display:flex;align-items:center;justify-content:center}

/* Feedback */
.stars{display:flex;gap:8px;justify-content:center;margin:16px 0}
.star{font-size:32px;cursor:pointer;transition:var(--transition);opacity:.3}
.star.active{opacity:1;transform:scale(1.1)}
.star:hover{transform:scale(1.2)}
.feedback-text{width:100%;min-height:80px;border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:12px;font-family:var(--font);font-size:14px;resize:vertical;outline:none;transition:var(--transition)}
.feedback-text:focus{border-color:var(--primary)}
.submit-btn{width:100%;padding:14px;border:none;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;font-size:15px;font-weight:600;border-radius:var(--radius-sm);cursor:pointer;transition:var(--transition);margin-top:12px}
.submit-btn:hover{opacity:.9;transform:translateY(-1px)}
.submit-btn:active{transform:scale(.98)}

/* Admin */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;text-align:center}
.stat-num{font-size:28px;font-weight:800;color:var(--primary)}
.stat-label{font-size:11px;color:var(--text-light);margin-top:4px}
.admin-row{margin-bottom:12px}
.admin-row label{display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:4px}
.admin-row input{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;outline:none;transition:var(--transition)}
.admin-row input:focus{border-color:var(--primary)}
.admin-btn{width:100%;padding:12px;border:1.5px solid var(--border);background:var(--surface);border-radius:var(--radius-sm);font-size:14px;font-weight:500;cursor:pointer;transition:var(--transition);margin-bottom:8px}
.admin-btn:hover{border-color:var(--primary);color:var(--primary)}
.admin-btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.admin-btn.primary:hover{opacity:.9}

/* Toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:var(--surface);border:1px solid var(--border);padding:12px 24px;border-radius:24px;font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);z-index:200;transition:transform .4s cubic-bezier(.4,0,.2,1);white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{border-color:var(--success);color:var(--success)}
.toast.error{border-color:var(--danger);color:var(--danger)}

/* ===== ANIMATIONS ===== */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* ===== RESPONSIVE ===== */
@media(max-width:360px){
  .mode-btn{min-width:68px;padding:8px 12px}
  .mode-btn .mode-desc{display:none}
  .brand-text h1{font-size:15px}
  .brand-text p{display:none}
}

/* Safe area */
@supports(padding:max(0px)){
  .input-bar{padding-bottom:max(10px,env(safe-area-inset-bottom) + 6px)}
  .header{padding-top:max(16px,env(safe-area-inset-top) + 8px)}
}
</style>
</head>
<body>

<div class="app">
  <!-- HEADER -->
  <div class="header">
    <div class="header-top">
      <div class="brand">
        <div class="brand-icon">🌿</div>
        <div class="brand-text">
          <h1>AI中西医健康助手</h1>
          <p>昆明医科大学 · 专业知识库</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="header-btn" onclick="openFeedback()" title="反馈">💬</button>
        <button class="header-btn" onclick="openAdmin()" title="管理">⚙️</button>
      </div>
    </div>
  </div>

  <!-- MODE TABS -->
  <div class="modes">
    <button class="mode-btn" data-mode="consult" onclick="switchMode('consult')">💬 咨询<span class="mode-desc">专业中西医健康咨询</span></button>
<button class="mode-btn" data-mode="tcm" onclick="switchMode('tcm')">🌿 中医<span class="mode-desc">中医体质辨识与调理</span></button>
<button class="mode-btn" data-mode="diet" onclick="switchMode('diet')">🥗 饮食<span class="mode-desc">疾病饮食方案推荐</span></button>
<button class="mode-btn" data-mode="knowledge" onclick="switchMode('knowledge')">📚 知识<span class="mode-desc">常见病知识科普</span></button>

  </div>

  <!-- CHIPS -->
  <div class="chips-bar" id="chipsBar"></div>

  <!-- CHAT -->
  <div class="chat-area" id="chatArea"></div>

  <!-- INPUT -->
  <div class="input-bar">
    <div class="input-row">
      <div class="input-wrap">
        <textarea id="userInput" rows="1" placeholder="输入症状或问题..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      </div>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
    <div class="disclaimer">⚠️ 仅供参考，不能替代医生诊断 · 紧急情况请拨打120</div>
  </div>
</div>

<!-- FEEDBACK MODAL -->
<div class="modal-overlay" id="feedbackModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2>💬 意见反馈</h2>
    <p style="text-align:center;color:var(--text-secondary);font-size:13px;margin-bottom:12px">您的反馈帮助我们变得更好</p>
    <div class="stars" id="starsContainer">
      <span class="star" data-v="1" onclick="setRating(1)">⭐</span>
      <span class="star" data-v="2" onclick="setRating(2)">⭐</span>
      <span class="star" data-v="3" onclick="setRating(3)">⭐</span>
      <span class="star" data-v="4" onclick="setRating(4)">⭐</span>
      <span class="star" data-v="5" onclick="setRating(5)">⭐</span>
    </div>
    <textarea class="feedback-text" id="feedbackText" placeholder="请输入您的建议或遇到的问题..."></textarea>
    <button class="submit-btn" onclick="submitFeedback()">提交反馈</button>
  </div>
</div>

<!-- ADMIN MODAL -->
<div class="modal-overlay" id="adminModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2>⚙️ 管理面板</h2>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-num" id="statCount">0</div><div class="stat-label">反馈数量</div></div>
      <div class="stat-card"><div class="stat-num" id="statAvg">0</div><div class="stat-label">平均评分</div></div>
    </div>
    <div class="admin-row">
      <label>Pushplus Token（微信推送）</label>
      <input type="text" id="pushplusToken" placeholder="从 pushplus.plus 获取">
    </div>
    <button class="admin-btn primary" onclick="saveAdmin()">💾 保存设置</button>
    <button class="admin-btn" onclick="exportCSV()">📊 导出反馈CSV</button>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ===== KNOWLEDGE BASE =====
var KB_DATA = {"KB":{"感冒":{"cat":"呼吸系统","title":"普通感冒/上呼吸道感染","content":"普通感冒多由病毒引起。症状：鼻塞、流涕、咽痛、咳嗽、轻度发热。处理：多休息、补充水分、对症用药。若发热>38.5℃持续3天以上，或出现胸闷、呼吸困难，请立即就医。","emergency":"高热不退（>39℃）、呼吸困难、意识模糊、剧烈头痛","diet":"宜：清淡易消化（粥、汤面、蒸蛋）；富含维C水果（橙子、猕猴桃）；温开水。忌：辛辣油腻、生冷食物、浓茶咖啡。","drugs":"解热镇痛：对乙酰氨基酚、布洛芬。通鼻：伪麻黄碱。注意：抗生素对病毒无效，勿滥用。","synergy":"布洛芬+阿司匹林：增加胃肠道出血风险。多种复方感冒药不要叠加服用。","food":"布洛芬避免与酒精同服。服用感冒药期间避免驾驶。","herbs":"金银花、连翘、薄荷、荆芥——疏风清热。"},"发热":{"cat":"呼吸系统","title":"发热/发烧","content":"发热是机体对感染的正常免疫反应。体温>37.3℃为发热。处理原则：38.5℃以下物理降温；38.5℃以上服用退热药；多饮水。退热是为了缓解不适，不是要把体温降到正常。","emergency":"体温>39.5℃持续不降、抽搐、皮疹、意识不清、颈部僵硬","diet":"宜：流质/半流质（粥、汤、果蔬汁）；清淡少油。忌：高蛋白高脂肪、辛辣刺激、生冷。","drugs":"退热：对乙酰氨基酚（更安全）、布洛芬（抗炎效果好）。儿童：禁用阿司匹林（瑞氏综合征风险）。","synergy":"多种退热药同时服用可能造成肝损伤，不要叠加。对乙酰氨基酚+酒精显著增加肝毒性。","food":"发热期间多喝水（1500-2000ml/天）。可喝淡盐水补充电解质。","herbs":"柴胡、黄芩、生石膏（高热时）——清热泻火。"},"咳嗽":{"cat":"呼吸系统","title":"咳嗽","content":"咳嗽是呼吸道清除异物和分泌物的保护性反射。干咳：右美沙芬。有痰咳嗽：氨溴索、乙酰半胱氨酸。若咳嗽>3周、咳血、胸痛，请立即就医。","emergency":"咳血、呼吸困难、胸痛、咳嗽伴随高热","diet":"宜：梨、百合、蜂蜜（1岁以上）、白萝卜、银耳。忌：甜腻、油炸、寒凉、鱼腥发物。","drugs":"干咳：右美沙芬（孕妇禁用）。有痰：氨溴索、乙酰半胱氨酸。","synergy":"中枢镇咳药+抗组胺药：可能引起呼吸抑制。","food":"蜂蜜（1岁以上）有轻度止咳作用（循证证实）。","herbs":"川贝、枇杷叶、杏仁、桔梗——润肺止咳化痰。"},"支气管炎":{"cat":"呼吸系统","title":"急性支气管炎","content":"支气管黏膜的急性炎症，常继发于上呼吸道感染。多为病毒引起。症状：持续咳嗽、咳痰（白痰→黄脓痰）、发热。治疗：对症为主，抗生素仅细菌感染时使用。","emergency":"高热（>39℃）、咳黄脓痰、呼吸困难、胸痛","diet":"宜：清淡饮食；富含维生素A、C的食物；温开水。忌：辛辣刺激、油腻食物、生冷饮食；戒烟。","drugs":"咳嗽：痰多时用祛痰药（氨溴索）。发热：用对乙酰氨基酚或布洛芬。细菌感染时使用抗生素。","herbs":"风寒袭肺：三拗汤合止嗽散。风热犯肺：桑菊饮加减。"},"肺炎":{"cat":"呼吸系统","title":"肺炎","content":"肺实质的炎症，由细菌、病毒、支原体等引起。常见病原体：肺炎链球菌。症状：发热、咳嗽、咳黄脓痰或铁锈色痰、胸痛、呼吸困难。需正规抗生素治疗，疗程5-7天。","emergency":"高热伴呼吸困难、胸痛、意识改变、口唇发绀——立即就医！","diet":"宜：高热量、高蛋白、易消化；富含维生素C；充足水分。忌：油腻、辛辣刺激、生冷、酒精。","drugs":"抗生素：阿莫西林/克拉维酸，或大环内酯类（阿奇霉素）。对症：退热、祛痰、氧疗（重症）。","herbs":"痰热壅肺：鱼腥草、黄芩、瓜蒌皮。正气虚弱：西洋参、黄芪。"},"过敏性鼻炎":{"cat":"呼吸系统","title":"过敏性鼻炎","content":"鼻黏膜的过敏性炎症，与IgE介导的变态反应有关。常见过敏原：花粉、尘螨、动物皮屑。症状：阵发性打喷嚏、清水样鼻涕、鼻塞、鼻痒、眼痒。治疗：避免过敏原+药物。","emergency":"出现哮喘症状或过敏性休克（罕见）","diet":"宜：均衡饮食；富含维生素C、E的食物。忌：已知过敏的食物；辛辣刺激；酒精。","drugs":"一线：鼻用糖皮质激素（布地奈德、氟替卡松）。口服抗组胺药（氯雷他定、西替利嗪）。白三烯受体拮抗剂（孟鲁司特）。","herbs":"肺脾两虚：玉屏风散加减。肾虚：右归丸加减。"},"高血压":{"cat":"心血管系统","title":"原发性高血压","content":"血压持续≥140/90 mmHg为高血压。治疗：低盐饮食（<5g/天）、规律运动、药物治疗。常用降压药：CCB类（氨氯地平）、ARB类（缬沙坦）。目标：一般<130/80 mmHg。","emergency":"血压>180/120伴头痛、胸痛、视力模糊——高血压危象，立即就医！","diet":"宜：DASH饮食（蔬果、全谷、低脂奶）、黑木耳、芹菜、山楂。忌：腌制品、腊肉、酱菜（高钠）；浓茶。","drugs":"CCB类：氨氯地平（晨起服）。ARB类：缬沙坦（保护肾脏）。禁忌：擅自停药会导致血压反跳，危及生命。","synergy":"地平类+β受体阻滞剂：可加重心衰。地平类+葡萄柚汁：增加血药浓度。","food":"西柚汁显著增加地平类药物血药浓度，服用者禁饮。","herbs":"钩藤、天麻、罗布麻、决明子——平肝潜阳降压。"},"冠心病":{"cat":"心血管系统","title":"冠状动脉粥样硬化性心脏病","content":"冠状动脉粥样硬化导致心肌缺血缺氧。类型：稳定型心绞痛、不稳定型心绞痛、急性心肌梗死。治疗：药物、介入（支架）、搭桥手术。","emergency":"剧烈胸痛持续>20分钟，伴出汗、恶心、呼吸困难、濒死感——急性心梗！立即拨打120！","diet":"宜：深海鱼、燕麦、豆制品、蔬菜水果、全谷物、坚果。忌：动物内脏、肥肉、蛋黄（每周<3个）、奶油、糕点。","drugs":"抗血小板：阿司匹林（长期）、氯吡格雷。降脂：他汀类（阿托伐他汀）。抗心肌缺血：硝酸甘油（舌下含服）、美托洛尔。","synergy":"阿司匹林+华法林：增加出血风险。他汀+贝特（吉非贝齐）：增加肌病风险。","food":"戒烟（最重要）。适度运动（每周≥150分钟）。","herbs":"丹参、三七、银杏叶——活血化瘀通络。"},"脑卒中":{"cat":"心血管系统","title":"脑卒中/中风","content":"分为缺血性（脑梗死，85%）和出血性（15%）。BE FAST识别：B平衡、E眼睛、F面部、A手臂、S语言、T时间。缺血性可在4.5小时内溶栓或取栓。","emergency":"突然出现的面部下垂、手臂无力、说话不清——立即拨打120！","diet":"控制钠摄入。增加蔬果、全谷物。限制饱和脂肪。补充叶酸。","drugs":"缺血性卒中二级预防：抗血小板（阿司匹林/氯吡格雷）、降脂（他汀）、降压、控制血糖。","synergy":"阿司匹林+华法林/新型口服抗凝药：增加出血风险。","food":"戒烟限酒。控制体重。适度运动。","herbs":"补阳还五汤（黄芪、当归、川芎、赤芍）——益气活血通络。"},"心律失常":{"cat":"心血管系统","title":"心律失常","content":"心脏传导系统异常导致心跳过快、过慢或不规则。常见类型：房颤、室上性心动过速、室性早搏、房室传导阻滞。症状：心悸、胸闷、头晕、晕厥。","emergency":"意识丧失、持续胸痛、血压显著下降——立即就医！","diet":"宜：均衡饮食；避免咖啡因、酒精。忌：刺激性食物；过量饮酒。","drugs":"抗心律失常药：胺碘酮、美托洛尔、美西律等（需医生处方）。房颤：抗凝（华法林/新型口服抗凝药）+节律控制/心率控制。","synergy":"胺碘酮与多种药物相互作用，务必告知医生所有用药。","food":"避免咖啡因（咖啡、浓茶）。戒烟限酒。","herbs":"炙甘草汤——益气滋阴，通阳复脉。"},"心力衰竭":{"cat":"心血管系统","title":"慢性心力衰竭","content":"心脏泵血功能减退，不能满足机体需求。表现：呼吸困难（活动后加重→休息也有）、水肿（下肢→全身）、乏力、心悸。NYHA分级：I-IV级。","emergency":"急性加重：呼吸困难加重、不能平卧、咳粉红色泡沫痰——急性左心衰！","diet":"限钠（<2g/天）：减轻水钠潴留。限液体（<1.5-2L/天）。高蛋白饮食。","drugs":"金三角：ACEI/ARB（改善预后）+β受体阻滞剂（改善预后）+醛固酮受体拮抗剂（减轻水肿）。利尿剂：呋塞米。","synergy":"利尿剂+ACEI：注意肾功能。NSAIDs加重水钠潴留，避免使用。","food":"避免腌制食品。少食多餐。监测体重（每日体重增加>1kg提示水钠潴留）。","herbs":"生脉散（人参、麦冬、五味子）——益气生津。"},"糖尿病":{"cat":"内分泌系统","title":"糖尿病","content":"诊断标准：空腹血糖≥7.0 mmol/L或餐后2h血糖≥11.1 mmol/L。治疗五驾马车：饮食控制、运动、药物治疗、血糖监测、健康教育。目标：空腹4.4-7.0 mmol/L，餐后<10 mmol/L，HbA1c<7%。","emergency":"低血糖（<3.9 mmol/L）伴昏迷或不能进食、酮症酸中毒（呼气有烂苹果味）","diet":"宜：低GI食物（燕麦、糙米、荞麦、全麦）、绿叶蔬菜、优质蛋白。忌：精制糖、白米白面、含糖饮料、粥类。水果每天不超过200g，两餐之间吃。","drugs":"二甲双胍：一线用药，随餐服用。胰岛素：需冷藏，遵医嘱调整剂量。GLP-1受体激动剂（司美格鲁肽）：减重效果好。","synergy":"二甲双胍+大量酒精：增加乳酸酸中毒风险。胰岛素+β受体阻滞剂：可能掩盖低血糖症状。","food":"慎用无糖食品——可能含大量碳水化合物。学会看食品营养标签。","herbs":"天花粉、葛根、黄芪、山药——益气养阴、健脾生津。"},"高血脂":{"cat":"内分泌系统","title":"高脂血症","content":"血脂异常：总胆固醇>5.2或LDL>3.4或TG>1.7 mmol/L。治疗：他汀类药物（首选）是核心，可稳定动脉斑块。生活方式：低脂饮食、运动、减重、戒烟限酒。","emergency":"","diet":"宜：燕麦（β-葡聚糖降胆固醇）、深海鱼（Omega-3降甘油三酯）、坚果、橄榄油。忌：动物内脏、肥肉、奶油制品、油炸食品、蛋黄。","drugs":"他汀类：阿托伐他汀（晚间服）、瑞舒伐他汀。贝特类：非诺贝特（高甘油三酯首选）。他汀不与西柚同服。","synergy":"他汀+贝特（吉非贝齐）：显著增加肌病风险——若需联用，优选非诺贝特。","food":"植物甾醇可辅助降脂。咖啡每天1-2杯无糖即可。","herbs":"山楂、荷叶、决明子、绞股蓝——活血降脂。"},"甲状腺功能亢进":{"cat":"内分泌系统","title":"甲状腺功能亢进症","content":"甲状腺激素分泌过多。常见原因：Graves病。症状：怕热、多汗、心悸、手抖、体重下降、眼球突出、烦躁易怒。需检查甲功五项、甲状腺抗体、甲状腺超声。","emergency":"甲亢危象：高热（>40℃）、严重心悸、意识障碍、呕吐腹泻——急诊！","diet":"高热量、高蛋白、高维生素饮食。限制碘摄入（海带、紫菜、海鲜）。忌：咖啡因、辛辣刺激。","drugs":"抗甲状腺药物（ATD）：甲巯咪唑、丙硫氧嘧啶（备孕/哺乳首选）。β受体阻滞剂：美托洛尔（控制心悸）。","synergy":"抗甲状腺药+华法林：增强抗凝作用。","food":"避免富碘食物。保证休息，避免情绪波动。","herbs":"甲亢阴虚火旺：天花粉、麦冬、生地——滋阴清热。"},"甲状腺功能减退":{"cat":"内分泌系统","title":"甲状腺功能减退症","content":"甲状腺激素分泌不足。症状：怕冷、乏力、体重增加、记忆力减退、皮肤干燥、便秘、心率减慢。需长期甲状腺激素替代治疗。","emergency":"黏液性水肿昏迷：严重嗜睡、体温降低、意识障碍——急诊！","diet":"适量碘摄入（加碘盐）。避免致甲状腺肿食物（卷心菜、萝卜）。高蛋白、高维生素饮食。","drugs":"左甲状腺素钠（L-T4）：空腹服用（早餐前30分钟），避免与钙、铁同服。起始剂量小，逐渐加量。","synergy":"左甲状腺素+钙剂/铁剂：减少吸收，间隔4小时以上服用。","food":"定期复查甲功，根据结果调整药量。","herbs":"脾肾阳虚：右归丸加减。"},"痛风":{"cat":"内分泌系统","title":"痛风","content":"尿酸代谢紊乱，尿酸盐结晶沉积关节。典型：急性单关节炎（常见大脚趾，红肿热痛）。治疗：急性期秋水仙碱/NSAIDs；缓解期降尿酸药（非布司他、别嘌醇）——需长期规律服用。","emergency":"痛风发作伴随高热（>39℃）、关节严重红肿","diet":"宜：低嘌呤饮食、大量饮水（>2L/天）、樱桃。忌：动物内脏、海鲜（尤其贝类）、浓肉汤、啤酒白酒、含果糖饮料。","drugs":"急性期：秋水仙碱（24h内首选）或布洛芬。降尿酸：非布司他、别嘌醇（长期）。注意：降尿酸药初期会诱发痛风发作。","synergy":"别嘌醇+巯唑嘌呤：显著增强骨髓抑制，禁忌！","food":"每日饮水>2L。樱桃有轻度降尿酸作用。","herbs":"土茯苓、萆薢、薏苡仁、威灵仙——祛湿通络止痛。"},"骨质疏松":{"cat":"内分泌系统","title":"骨质疏松症","content":"骨密度降低，骨脆性增加，常见于绝经后女性和老年人。治疗：钙剂+维生素D（基础）、抗骨质疏松药（双膦酸盐类）。预防：负重运动、充足日照（每天15-30分钟）、防跌倒。","emergency":"跌倒后剧烈疼痛，疑似骨折","diet":"宜：高钙食物（牛奶1000-1200mg/天是金标准、豆制品、芝麻、虾皮、深绿色蔬菜）。忌：过多咖啡因（>3杯/天）、高钠（加速钙流失）。","drugs":"钙剂：碳酸钙（随餐服）或柠檬酸钙（空腹可服）。骨吸收抑制剂：阿仑膦酸钠（晨起空腹服，直立30分钟）。","synergy":"钙剂+维生素D：是所有抗骨质疏松治疗的基础，必须联用。","food":"咖啡和可乐减少钙吸收。最佳饮料：白开水、淡茶、低脂牛奶。","herbs":"骨碎补、续断、杜仲、龟板——补肾强骨。"},"肥胖":{"cat":"内分泌系统","title":"肥胖症","content":"体质指数（BMI）≥28为肥胖。危害：糖尿病、高血压、冠心病、脑卒中、睡眠呼吸暂停、癌症风险增加。治疗：饮食控制、运动、药物治疗（奥利司他、司美格鲁肽）、代谢手术。","emergency":"肥胖相关急症：睡眠呼吸暂停综合征、急性心衰","diet":"每日热量赤字500-750kcal。蛋白质摄入1.2-1.6g/kg体重。限制精制碳水、高脂肪食物。","drugs":"奥利司他：抑制脂肪吸收，随餐服用。GLP-1受体激动剂（司美格鲁肽）：降糖+减重。","synergy":"减肥药+酒精：可能增加副作用。","food":"记录饮食日记。细嚼慢咽（每口>20次）。","herbs":"山楂、荷叶、决明子、泽泻——利水消脂。"},"胃炎":{"cat":"消化系统","title":"胃炎/胃部不适","content":"胃黏膜炎症。症状：上腹痛、胀气、反酸、恶心、嗳气。治疗：抑酸药（奥美拉唑）、胃黏膜保护剂（铝碳酸镁）、促动力药（多潘立酮）。建议：规律饮食、细嚼慢咽、避免刺激性食物。","emergency":"呕血（红色或咖啡渣样）、柏油样黑便、剧烈腹痛","diet":"宜：清淡易消化（粥、馒头、软烂面）、蒸蛋。忌：辛辣、生冷、油腻、过甜、过酸、咖啡、酒精。规律进餐，每餐七八分饱。","drugs":"抑酸：奥美拉唑（晨起空腹）、雷贝拉唑。护胃：铝碳酸镁（餐后嚼服）。促动力：多潘立酮（餐前15-30分钟）。","synergy":"奥美拉唑+氯吡格雷：降低氯吡格雷疗效——优先换用泮托拉唑。","food":"酸奶可在胃黏膜形成保护层。温热牛奶可暂时缓解胃痛。","herbs":"白芨、海螵蛸、砂仁、陈皮——和胃止痛、制酸。"},"急性胃肠炎":{"cat":"消化系统","title":"急性胃肠炎","content":"胃肠道黏膜的急性炎症，多由病毒（诺如病毒、轮状病毒）或细菌（大肠杆菌、沙门菌）引起。症状：腹痛、腹泻、呕吐、发热。","emergency":"严重脱水（眼窝凹陷、皮肤弹性差）、高热不退、血便","diet":"宜：清淡流质（粥汤、面汤）、补液盐（防止脱水）。忌：油腻、生冷、辛辣、奶制品（加重腹泻）。","drugs":"补液盐：补充水分和电解质。止泻：蒙脱石散。调节肠道菌群：益生菌（双歧杆菌、乳酸杆菌）。细菌感染时使用抗生素。","synergy":"抗生素+益生菌：需间隔2小时以上服用。","food":"少量多餐。从流质→半流质→正常饮食逐步过渡。","herbs":"藿香正气散（藿香、紫苏、白芷）——外感风寒，内伤湿滞。"},"便秘":{"cat":"消化系统","title":"便秘","content":"排便次数减少（每周<3次）、粪便干结、排便困难。分为功能性便秘和器质性便秘。治疗：增加膳食纤维（25-35g/天）、适量饮水（1.5-2L/天）、运动、养成排便习惯。","emergency":"急性便秘伴腹痛、呕吐——警惕肠梗阻！","diet":"宜：膳食纤维（粗粮、蔬菜、水果）、足量饮水。忌：精制食品、辛辣刺激。","drugs":"容积性泻药：麦麸、欧车前。渗透性泻药：乳果糖、聚乙二醇。刺激性泻药：比沙可啶（短期用）。","synergy":"刺激性泻药长期使用会导致依赖。","food":"养成定时排便习惯。增加运动。","herbs":"麻子仁丸——润肠通便。"},"腹泻":{"cat":"消化系统","title":"腹泻","content":"排便次数增多（>3次/天）、粪便稀薄、水分增加。分为急性和慢性。急性多为感染，慢性需排除器质性疾病。","emergency":"严重脱水、血便、持续高热","diet":"宜：清淡流质、补液盐。忌：油腻、生冷、高纤维、奶制品。","drugs":"补液：补液盐。止泻：蒙脱石散。调节肠道：益生菌。抗感染：氟哌酸（细菌性）。","synergy":"感染性腹泻禁用止泻药（妨碍毒素排出）。","food":"BRAT饮食：香蕉、米饭、苹果酱、吐司。","herbs":"参苓白术散——健脾渗湿止泻。"},"脂肪肝":{"cat":"消化系统","title":"脂肪肝","content":"肝细胞脂肪沉积>5%，分酒精性（AFLD）和非酒精性（NAFLD/MASLD）。治疗：减重5-10%可逆转脂肪肝（最有效）、戒酒、控制血糖血脂。","emergency":"肝区剧痛、黄疸（眼睛和皮肤发黄）","diet":"宜：地中海饮食（橄榄油、深色蔬菜、全谷、鱼）、绿茶。忌：酒精、果糖饮料、高糖高脂食品、油炸食品。","drugs":"二甲双胍（合并糖尿病时）。维生素E（400IU/天，对NASH有一定效果，不适用于糖尿病患者）。护肝药（易善复等）只能辅助。","food":"咖啡（每天2-3杯无糖）可降低肝酶——循证证实的护肝饮食。","herbs":"丹参、山楂、葛根、五味子——保肝降脂。"},"肝炎":{"cat":"消化系统","title":"肝炎","content":"肝脏炎症，常见原因：病毒性（甲、乙、丙、丁、戊肝）、酒精性、非酒精性、药物性。症状：乏力、食欲不振、恶心、右上腹不适、黄疸。","emergency":"急性重型肝炎：极度乏力、严重黄疸、意识障碍——急诊！","diet":"宜：高蛋白（肝修复）、易消化、维生素丰富。忌：酒精、高脂肪、辛辣刺激。","drugs":"病毒性肝炎：抗病毒药（乙肝核苷类似物、丙肝直接抗病毒药）。护肝药：甘草酸制剂、水飞蓟宾。","synergy":"抗病毒药需足疗程，不要自行停药。","food":"绝对戒酒。定期复查肝功能、病毒载量。","herbs":"茵陈、栀子、柴胡、五味子——清热利湿、疏肝解毒。"},"胆囊炎":{"cat":"消化系统","title":"胆囊炎","content":"胆囊的炎症，常与胆结石有关。分为急性和慢性。急性：右上腹剧痛（墨菲征阳性）、发热、恶心呕吐。慢性：右上腹隐痛、饱胀感。","emergency":"急性化脓性胆囊炎、胆囊穿孔——急诊手术！","diet":"宜：低脂饮食、清淡易消化。忌：高脂肪饮食（油炸、肥肉、蛋黄）、辛辣刺激。","drugs":"抗生素：头孢类+甲硝唑。解痉：山莨菪碱。利胆：熊去氧胆酸。","synergy":"熊去氧胆酸需长期服用，定期复查。","food":"少量多餐。避免暴饮暴食。","herbs":"金钱草、茵陈、郁金——利胆排石。"},"痔疮":{"cat":"消化系统","title":"痔疮","content":"肛门直肠静脉曲张。分为内痔、外痔、混合痔。症状：便血、肛门疼痛、脱出、瘙痒。治疗：保守治疗（坐浴、软化大便、局部用药）、手术。","emergency":"大量便血导致贫血、痔核嵌顿坏死","diet":"宜：膳食纤维（25-35g/天）、足量饮水。忌：辛辣刺激、久坐久蹲。","drugs":"口服：地榆槐角丸、迈之灵。外用：马应龙痔疮膏、栓剂。","synergy":"便秘加重痔疮，形成恶性循环。","food":"养成排便好习惯（每天固定时间，不超过5分钟）。温水坐浴。","herbs":"地榆、槐花、赤小豆——凉血止血、消肿止痛。"},"口腔溃疡":{"cat":"五官科","title":"复发性口腔溃疡","content":"口腔黏膜反复发作的溃疡。病因复杂：免疫因素、维生素缺乏、机械刺激。","emergency":"溃疡超过2周不愈或数量增多","diet":"宜：富含维生素B、C的食物。忌：辛辣、过烫、酸性食物。","drugs":"局部：口腔溃疡散、西瓜霜。全身：维生素B2、维生素C。反复发作排查系统性疾病。","synergy":"保持口腔清洁。","food":"避免咬伤。","herbs":"导赤散（心脾积热）、玉女煎（阴虚火旺）。"},"头痛":{"cat":"神经系统","title":"头痛","content":"原因众多：紧张性、血管性、偏头痛、鼻窦性、继发性头痛。处理：休息、放松、止痛药。若头痛突然剧烈伴发热/呕吐/视物模糊/偏瘫，请立即就医。","emergency":"突然剧烈头痛（雷击样）、伴意识变化、颈项强直、视物模糊、偏瘫——立即就医！","diet":"宜：规律进食（避免低血糖）、坚果、深海鱼。忌：酒精（偏头痛常见诱因）、腌制肉。","drugs":"止痛：布洛芬（首选）、对乙酰氨基酚。偏头痛：曲普坦类（发作早期服）。注意：每月止痛药>10天可致药物过度使用性头痛。","synergy":"止痛药+酒精：显著增加胃肠道和肝脏损伤。","food":"脱水是头痛最常见诱因，确保每日饮水1500-2000ml。","herbs":"川芎、白芷、天麻、菊花——祛风通络止痛。"},"失眠":{"cat":"神经系统","title":"失眠","content":"入睡困难、睡眠浅、易醒、早醒，影响白天功能。治疗：睡眠卫生（规律作息、睡前1小时避免屏幕）、认知行为治疗（CBT-I，循证金标准）、药物（短期）。","emergency":"","diet":"宜：温牛奶、酸枣仁粥（睡前2小时）、香蕉。忌：咖啡、浓茶（下午2点后禁饮）、酒精（破坏睡眠结构）。","drugs":"非苯二氮卓类：佐匹克隆、右佐匹克隆（成瘾性较低）。褪黑素：倒时差者、老年失眠者。安眠药有成瘾性，遵医嘱使用。","synergy":"安眠药+酒精：严重呼吸抑制，可致死！","food":"色氨酸食物（牛奶、火鸡、坚果）促进褪黑素合成。","herbs":"酸枣仁、柏子仁、远志、合欢皮——养心安神促睡眠。"},"抑郁症":{"cat":"神经系统","title":"抑郁症","content":"以持续的情绪低落、兴趣减退为核心症状，常伴有睡眠障碍、食欲改变、注意力下降、自责自罪。需专业诊断和治疗。","emergency":"有自杀念头或行为——立即就医或拨打心理危机干预热线！","diet":"宜：富含Omega-3（深海鱼）、叶酸（绿叶蔬菜）、维生素D的食物。忌：酒精（加重抑郁）、咖啡因过量。","drugs":"SSRI类（首选）：舍曲林、帕罗西汀、艾司西酞普兰。SNRI类：文拉法辛、米那普仑。需足疗程（至少6-12个月）。","synergy":"抗抑郁药+酒精：增加镇静作用。","food":"规律饮食。适度运动（对抑郁有治疗作用）。","herbs":"柴胡疏肝散、逍遥散——疏肝解郁。"},"焦虑症":{"cat":"神经系统","title":"焦虑症","content":"以过度的担忧、紧张、恐惧为特征，常伴有心悸、出汗、颤抖、胸闷、呼吸困难等躯体症状。分为广泛性焦虑和惊恐障碍。","emergency":"惊恐发作（强烈恐惧感伴严重躯体症状）——需排除心脏疾病","diet":"宜：富含B族维生素的食物、镁（坚果、深绿叶菜）。忌：咖啡因、酒精。","drugs":"SSRI类：帕罗西汀、舍曲林。短效苯二氮卓类：阿普唑仑（短期使用，成瘾性）。","synergy":"苯二氮卓类+酒精：呼吸抑制风险。","food":"规律作息。深呼吸练习。瑜伽、冥想。","herbs":"天王补心丹——滋阴养血、补心安神。"},"眩晕":{"cat":"神经系统","title":"眩晕","content":"感觉自身或周围环境旋转/晃动感。常见原因：耳石症（良性阵发性位置性眩晕）、前庭神经炎、梅尼埃病、颈椎病、脑血管病。","emergency":"眩晕伴剧烈头痛、视力障碍、肢体无力——警惕脑卒中！","diet":"宜：清淡饮食、富含维生素。忌：辛辣刺激、浓茶咖啡。","drugs":"耳石症：手法复位（首选）。前庭神经炎：激素、前庭抑制剂（苯海拉明）。梅尼埃病：利尿剂、前庭抑制剂。","synergy":"前庭抑制剂长期使用延缓前庭功能代偿。","food":"发作时卧床休息，避免头部快速运动。","herbs":"天麻钩藤饮——平肝潜阳、熄风止眩。"},"颈椎病":{"cat":"神经系统","title":"颈椎病","content":"颈椎退行性病变，多因长期低头导致。症状：颈部僵硬疼痛、头晕（椎动脉受压）、手臂麻木、肩背酸痛。严重神经压迫需手术。","emergency":"四肢麻木突然加重、大小便失禁（脊髓型颈椎病，需急诊手术）","diet":"宜：含钙食物（牛奶、豆制品、芝麻）、富含胶原蛋白的食物。忌：长期低头、咖啡因摄入过多。","drugs":"止痛：布洛芬、塞来昔布。肌肉松弛：乙哌立松。营养神经：甲钴胺（活性维B12）。","food":"氨基葡萄糖和硫酸软骨素对早期软骨退变可能有帮助。","herbs":"葛根（颈椎病要药）、鸡血藤、川芎、桑枝——舒筋活络。"},"腰椎间盘突出":{"cat":"神经系统","title":"腰椎间盘突出症","content":"椎间盘纤维环破裂，髓核突出压迫神经根。症状：腰痛伴下肢放射痛（坐骨神经痛）、麻木、肌力下降。","emergency":"出现马尾综合征（大小便失禁、鞍区麻木）——急诊手术！","diet":"宜：富含钙、蛋白质的食物。忌：辛辣刺激。","drugs":"止痛：NSAIDs（布洛芬、塞来考昔）。神经根水肿：甘露醇+地塞米松。营养神经：甲钴胺。","synergy":"保守治疗无效或出现肌力下降需考虑手术。","food":"睡硬板床。避免久坐久站。","herbs":"独活寄生汤——祛风湿、止痹痛、益肝肾。"},"面瘫":{"cat":"神经系统","title":"面神经麻痹（面瘫）","content":"面神经受损导致面部肌肉瘫痪。分为中枢性（脑血管病引起）和周围性（Bell麻痹最常见）。表现：额纹消失、眼睑闭合不全、口角歪斜。","emergency":"突然出现面瘫伴其他神经系统症状——警惕脑卒中！","diet":"宜：清淡易消化、高维生素饮食。忌：辛辣刺激。","drugs":"急性期：糖皮质激素（强的松，早期使用可减轻水肿）、维生素B1、B12。眼睑闭合不全：眼药水、人工泪液。","synergy":"早期（72小时内）使用激素效果最好。","food":"保持面部保暖。进行面部肌肉康复训练。","herbs":"牵正散（白附子、僵蚕、全蝎）——祛风化痰、通络止痉。"},"类风湿关节炎":{"cat":"风湿免疫系统","title":"类风湿关节炎","content":"自身免疫性关节炎症，表现为对称性多关节肿胀疼痛、晨僵（>1小时）。可导致关节畸形和功能丧失。","emergency":"出现发热、胸闷、呼吸困难——警惕间质性肺炎！","diet":"宜：富含Omega-3（深海鱼）、抗氧化物质（水果蔬菜）。忌：烟酒。","drugs":"DMARDs（改变病情抗风湿药）：甲氨蝶呤（首选）、来氟米特、羟氯喹。生物制剂：TNF-α抑制剂。","synergy":"甲氨蝶呤+叶酸：减少副作用。","food":"适度运动保持关节功能。","herbs":"独活、桑寄生、秦艽——祛风湿、止痹痛。"},"骨关节炎":{"cat":"风湿免疫系统","title":"骨关节炎","content":"关节软骨退变，常见于膝、髋、手关节。症状：关节疼痛（活动后加重）、僵硬（<30分钟）、肿胀、骨擦感。","emergency":"急性关节红肿热痛伴发热——警惕感染性关节炎！","diet":"宜：富含胶原蛋白、钙的食物。忌：肥胖（增加关节负担）。","drugs":"止痛：NSAIDs（外用+口服）、对乙酰氨基酚。关节腔注射：玻璃酸钠、糖皮质激素。","synergy":"氨基葡萄糖和硫酸软骨素：证据不一，可尝试。","food":"控制体重。适度运动（游泳、骑车）。","herbs":"骨碎补、续断、威灵仙——补肾强骨、祛风通络。"},"系统性红斑狼疮":{"cat":"风湿免疫系统","title":"系统性红斑狼疮","content":"系统性自身免疫病，多见于年轻女性。表现：面部蝶形红斑、关节痛、口腔溃疡、光敏感、乏力。可累及肾、心、肺、脑。","emergency":"出现抽搐、意识障碍、胸闷尿少——累及重要脏器！","diet":"宜：均衡饮食、富含维生素D。忌：光敏食物（芹菜、香菜）、辛辣刺激。","drugs":"基础治疗：羟氯喹。免疫抑制：糖皮质激素、硫唑嘌呤、霉酚酸酯。生物制剂：贝利木单抗。","synergy":"羟氯喹需定期眼科检查（视网膜病变）。","food":"避免日晒。戒烟。","herbs":"六味地黄丸、知柏地黄丸——滋阴清热。"},"干燥综合征":{"cat":"风湿免疫系统","title":"干燥综合征","content":"外分泌腺受累的自身免疫病。表现：口干眼干、牙齿片状脱落、关节痛。可伴其他自身免疫病。","emergency":"出现乏力、低热、淋巴结肿大——警惕淋巴瘤！","diet":"宜：滋阴润燥。忌：辛辣刺激、烟酒。","drugs":"对症：人工泪液、唾液替代品。免疫调节：羟氯喹。累及脏器：糖皮质激素+免疫抑制剂。","food":"保持口腔湿润。避免服用引起口干的药物。","herbs":"沙参、麦冬、玉竹——养阴润燥。"},"荨麻疹":{"cat":"皮肤科","title":"荨麻疹","content":"皮肤血管反应性增高，表现为风团（红斑+水肿）、瘙痒。分为急性和慢性（>6周）。","emergency":"出现喉头水肿、呼吸困难——过敏性休克！","diet":"宜：清淡饮食。忌：已知过敏食物、辛辣刺激、海鲜。","drugs":"抗组胺药：氯雷他定、西替利嗪。急性严重：糖皮质激素。慢性：奥马珠单抗。","synergy":"避免抓挠。","food":"记录饮食日记找诱因。","herbs":"消风散——疏风清热、凉血止痒。"},"湿疹":{"cat":"皮肤科","title":"湿疹/特应性皮炎","content":"慢性炎症性皮肤病。表现：瘙痒、皮疹（红斑、丘疹、水疱）、皮肤干燥。","emergency":"继发感染（红肿热痛、脓性分泌物）","diet":"宜：清淡、富含维生素。忌：辛辣刺激、海鲜、牛羊肉。","drugs":"外用：糖皮质激素（根据部位选择强度）、钙调磷酸酶抑制剂（他克莫司）。口服：抗组胺药。系统：免疫抑制剂、生物制剂。","synergy":"激素长期使用导致皮肤萎缩。","food":"保持皮肤湿润。避免热水烫洗。","herbs":"龙胆草、黄芩（湿热）；生地、当归（血虚风燥）。"},"银屑病":{"cat":"风湿免疫系统","title":"银屑病","content":"慢性炎症性皮肤病，典型表现：鳞屑性红斑、薄膜现象、点状出血。分为寻常型、关节型、脓疱型、红皮病型。","emergency":"关节剧烈疼痛、红皮病型、脓疱型——需住院治疗！","diet":"宜：富含维生素A、E的食物。忌：辛辣刺激、酒精、海鲜。","drugs":"外用：糖皮质激素、维生素D3衍生物。系统治疗：甲氨蝶呤、环孢素。生物制剂：TNF-α抑制剂、IL-17抑制剂。","synergy":"感染可诱发或加重银屑病。","food":"保持皮肤湿润。避免外伤。","herbs":"血热型：犀角地黄汤加减。血瘀型：桃红四物汤加减。"},"带状疱疹":{"cat":"风湿免疫系统","title":"带状疱疹","content":"水痘-带状疱疹病毒再激活，表现为沿单侧神经分布的成簇水疱伴疼痛。常见于肋间神经、三叉神经。","emergency":"出现在面部（眼、鼻）——可能影响视力！","diet":"宜：清淡易消化、高蛋白。忌：辛辣刺激、发性食物（牛羊肉、海鲜）。","drugs":"抗病毒：阿昔洛韦、伐昔洛韦（早期使用，72小时内最佳）。止痛：加巴喷丁、普瑞巴林。外用：阿昔洛韦软膏。","synergy":"早期抗病毒可减少后遗神经痛。","food":"保持皮疹清洁干燥。","herbs":"龙胆泻肝汤——清肝泻火、利湿解毒。"},"慢性肾病":{"cat":"泌尿系统","title":"慢性肾脏病","content":"肾脏结构/功能异常>3个月。分为1-5期。常见原因：糖尿病、高血压、慢性肾小球肾炎。","emergency":"尿量显著减少或无尿、严重水肿、意识障碍——尿毒症！","diet":"优质低蛋白饮食（0.6-0.8g/kg/天）。限钠（<2g/天）。限钾、磷（晚期）。","drugs":"控制原发病：降压（ACEI/ARB首选，保护肾脏）、降糖。并发症：利尿剂、纠酸、补钙、骨病治疗。","synergy":"ACEI/ARB+钾盐：可能导致高钾血症。","food":"定期监测肾功能和电解质。避免肾毒性药物（NSAIDs、造影剂）。","herbs":"大黄、丹参、积雪草——通腑泄浊、活血化瘀。"},"尿路感染":{"cat":"泌尿系统","title":"尿路感染","content":"细菌侵入泌尿系统引起的炎症。分为上尿路感染（肾盂肾炎）和下尿路感染（膀胱炎、尿道炎）。症状：尿频、尿急、尿痛、发热。","emergency":"高热伴腰痛——肾盂肾炎，需抗生素治疗！","diet":"宜：清淡饮食、足量饮水（>1500ml/天）。忌：辛辣刺激、酒精。","drugs":"下尿路感染：磷霉素、呋喃妥因、头孢类（3-7天）。上尿路感染：喹诺酮类、头孢类（10-14天）。","synergy":"多喝水、按时排尿是预防关键。","food":"注意个人卫生。","herbs":"八正散（车前子、瞿麦、萹蓄）——清热利湿、通淋止痛。"},"前列腺增生":{"cat":"泌尿系统","title":"良性前列腺增生","content":"老年男性常见，表现为尿频（尤其夜尿增多）、尿急、尿等待、尿流变细、尿不尽感。","emergency":"突然完全不能排尿（尿潴留）——需导尿！","diet":"宜：富含锌、维生素E的食物。忌：辛辣刺激、咖啡因、酒精。","drugs":"α受体阻滞剂：坦索罗辛（快速改善症状）。5α还原酶抑制剂：非那雄胺（缩小前列腺体积，需长期服用）。","synergy":"α受体阻滞剂+5α还原酶抑制剂：联合治疗效果更好。","food":"定期复查PSA排除前列腺癌。","herbs":"前列康（黄芪、丹参、桃仁）——益气活血、化瘀通络。"},"肾结石":{"cat":"泌尿系统","title":"泌尿系结石","content":"泌尿系统形成的坚硬物质。表现为突然出现的剧烈腰痛（肾绞痛）、血尿、尿频尿急。","emergency":"结石伴发热——警惕脓肾！","diet":"根据结石成分调整。普遍：多喝水（>2000ml/天）、均衡饮食。","drugs":"止痛：NSAIDs、阿片类。排石：α受体阻滞剂（坦索罗辛）、利尿剂（噻嗪类）。","synergy":"体外冲击波碎石、输尿管镜取石——根据结石大小位置选择。","food":"根据结石成分分析结果调整饮食。","herbs":"金钱草、海金沙、鸡内金——利尿排石。"},"贫血":{"cat":"血液系统","title":"贫血","content":"血红蛋白或红细胞减少。常见原因：缺铁性（最常见）、巨幼细胞性、慢性病性、溶血性。症状：乏力、头晕、心悸、面色苍白。","emergency":"血红蛋白<60g/L或急性大出血——输血治疗！","diet":"根据类型调整。缺铁性：富含铁的食物（红肉、动物肝脏、血制品）。","drugs":"缺铁性：口服铁剂（硫酸亚铁、琥珀酸亚铁）+维生素C。巨幼细胞性：叶酸、维生素B12。","synergy":"铁剂与茶、咖啡、钙剂同服影响吸收。","food":"口服铁剂时避免喝茶。","herbs":"当归、熟地、黄芪——补气养血。"},"肺癌":{"cat":"肿瘤","title":"肺癌","content":"我国发病率和死亡率最高的恶性肿瘤。分为小细胞肺癌和非小细胞肺癌。危险因素：吸烟（最重要）、空气污染、职业暴露。","emergency":"出现咯血、胸痛加重、呼吸困难——可能晚期！","diet":"宜：高蛋白、高热量、易消化。忌：辛辣刺激、腌制食品。","drugs":"手术：早期首选。化疗：铂类为基础。靶向治疗：针对EGFR、ALK等突变。免疫治疗：PD-1/PD-L1抑制剂。","synergy":"基因检测指导靶向治疗选择。","food":"戒烟（最重要）。定期体检（低剂量CT）。","herbs":"扶正固本：参芪扶正注射液、贞芪扶正颗粒。"},"胃癌":{"cat":"肿瘤","title":"胃癌","content":"常见消化道恶性肿瘤。危险因素：幽门螺杆菌感染、腌制食品、烟熏食品、遗传。早期无症状或非特异性消化不良。","emergency":"出现呕血、黑便、体重明显下降——警惕晚期！","diet":"宜：新鲜蔬果、少盐少腌渍。忌：腌制、烟熏、高盐、辛辣。","drugs":"手术：根治关键。化疗：氟尿嘧啶类+铂类。靶向：曲妥珠单抗（HER2阳性）。免疫治疗：PD-1抑制剂。","synergy":"根除幽门螺杆菌可降低胃癌风险。","food":"根治幽门螺杆菌。定期胃镜检查（高危人群）。","herbs":"健脾益气：四君子汤加减。"},"结直肠癌":{"cat":"肿瘤","title":"结直肠癌","content":"常见消化道恶性肿瘤。危险因素：高脂肪低纤维饮食、肥胖、吸烟、家族史。表现：大便习惯改变、便血、腹痛、贫血。","emergency":"急性肠梗阻、穿孔——急诊手术！","diet":"宜：高纤维、低脂肪饮食。忌：红肉、加工肉制品、高脂肪饮食。","drugs":"手术：根治关键。化疗：CAPOX、FOLFOX方案。靶向：贝伐单抗、西妥昔单抗。免疫治疗：PD-1（dMMR/MSI-H）。","synergy":"结肠镜筛查早期发现癌前病变（腺瘤）。","food":"定期筛查（结肠镜）。","herbs":"槐花、地榆、赤芍——凉血止血、化瘀解毒。"},"乳腺癌":{"cat":"肿瘤","title":"乳腺癌","content":"女性最常见恶性肿瘤。危险因素：遗传（BRCA1/2突变）、雌激素暴露、生育因素。表现：无痛肿块、乳头溢液、皮肤橘皮样改变。","emergency":"出现骨痛、咳嗽——警惕转移！","diet":"宜：富含蔬菜水果、全谷物。忌：高脂肪饮食、酒精。","drugs":"手术：保乳或全切。化疗：蒽环类+紫杉类。内分泌治疗：他莫昔芬、芳香酶抑制剂。靶向：曲妥珠单抗（HER2+）。","synergy":"定期乳腺超声/钼靶筛查。","food":"母乳喂养可降低风险。","herbs":"疏肝理气：逍遥散加减。"},"甲状腺癌":{"cat":"肿瘤","title":"甲状腺癌","content":"内分泌系统最常见恶性肿瘤，预后较好。病理类型：乳头状癌（最常见）、滤泡癌、髓样癌、未分化癌。","emergency":"出现声音嘶哑、呼吸困难——警惕气管侵犯！","diet":"宜：均衡饮食。忌：辛辣刺激。","drugs":"手术：甲状腺全切/次全切。碘131治疗：分化型甲状腺癌。TSH抑制治疗：左甲状腺素。","synergy":"定期复查甲状腺球蛋白。","food":"甲状腺全切后需补钙和维生素D。","herbs":"夏枯草、浙贝母——化痰散结。"},"月经不调":{"cat":"妇产科","title":"月经不调","content":"月经周期、经期、经量异常。常见原因：内分泌失调（多囊卵巢综合征、甲状腺功能异常）、子宫病变、情绪压力。","emergency":"月经量过多导致贫血或停经后出血——警惕子宫内膜癌！","diet":"宜：富含铁、蛋白质的食物。忌：生冷、辛辣刺激。","drugs":"调经：雌孕激素周期治疗。排卵障碍：克罗米芬、来曲唑。多囊卵巢综合征：二甲双胍、达英-35。","synergy":"长期月经不调需排查多囊卵巢综合征、甲状腺疾病。","food":"记录月经周期。","herbs":"四物汤、乌鸡白凤丸——补血调经。"},"痛经":{"cat":"妇产科","title":"痛经","content":"月经期下腹部疼痛。分为原发性（无器质性病变）和继发性（子宫内膜异位症、子宫腺肌病等）。","emergency":"疼痛加重或与以往不同——排查器质性疾病！","diet":"宜：温热、易消化食物。忌：生冷、辛辣、咖啡因。","drugs":"止痛：NSAIDs（布洛芬、月经前预防性服用）。避孕药：抑制排卵。原发性痛经效果良好。","synergy":"热敷可缓解疼痛。","food":"适度运动。保持温暖。","herbs":"益母草、当归、川芎——活血化瘀、调经止痛。"},"更年期综合征":{"cat":"妇产科","title":"更年期综合征","content":"女性绝经前后因雌激素水平下降出现的一系列症状。表现：潮热出汗、情绪波动、失眠、骨关节痛、阴道干涩。","emergency":"出现异常子宫出血——排查子宫内膜病变！","diet":"宜：富含钙、维生素D的食物。忌：辛辣刺激、咖啡因、酒精。","drugs":"激素替代治疗（MHT）：窗口期（60岁前或绝经10年内）使用利大于弊。需个体化方案。","synergy":"MHT需定期复查评估利弊。","food":"补充钙剂（1200mg/天）和维生素D（800-1000IU/天）。","herbs":"更年安、六味地黄丸——滋阴补肾、宁心安神。"},"乳腺增生":{"cat":"妇产科","title":"乳腺增生症","content":"乳腺组织增生和退行性改变，与雌激素水平波动有关。表现：乳房胀痛、肿块（随月经周期变化）。","emergency":"出现固定肿块或乳头溢血——排查乳腺癌！","diet":"宜：富含维生素E、纤维的食物。忌：辛辣刺激、咖啡因、高脂肪饮食。","drugs":"止痛：逍遥丸、乳癖消。调节内分泌：他莫昔芬（重度）。","synergy":"定期乳腺超声/钼靶复查。","food":"保持心情舒畅。","herbs":"橘核、橘叶、夏枯草——疏肝散结。"},"阴道炎":{"cat":"妇产科","title":"阴道炎","content":"阴道黏膜炎症。类型：细菌性（最常见）、念珠菌性（霉菌性）、滴虫性。表现：瘙痒、异味、分泌物异常。","emergency":"反复发作或伴随全身症状","diet":"宜：清淡饮食、富含益生菌的食物。忌：辛辣刺激、甜食。","drugs":"细菌性：甲硝唑。念珠菌性：克霉唑、氟康唑。滴虫性：甲硝唑（夫妻同治）。","synergy":"长期使用抗生素破坏阴道菌群。","food":"保持外阴清洁干燥。避免过度清洗。","herbs":"苦参、黄柏、蛇床子——清热燥湿、杀虫止痒。"},"小儿发热":{"cat":"儿科","title":"儿童发热","content":"儿童常见症状。体温>38℃为发热。常见原因：感染（病毒为主）。处理：38.5℃以下物理降温，38.5℃以上用退热药。","emergency":"3个月以下婴儿发热、持续高热不退、出现抽搐、皮疹——立即就医！","diet":"宜：清淡流质、补充水分。忌：辛辣、油腻。","drugs":"对乙酰氨基酚（首选，3个月以上）、布洛芬（6个月以上）。禁用：阿司匹林（瑞氏综合征）、尼美舒利（儿童禁用）。","synergy":"退热药不要叠加使用。","food":"少量多次喂水。","herbs":"小儿推拿：清天河水、退六腑。"},"小儿腹泻":{"cat":"儿科","title":"儿童腹泻","content":"大便次数增多、性状改变。常见原因：病毒性（轮状病毒）、细菌性。治疗：补液（关键）、调节肠道菌群、对症治疗。","emergency":"出现脱水表现（眼窝凹陷、皮肤弹性差、尿少）、血便、高热","diet":"宜：补液盐、米汤、稀粥。忌：油腻、生冷、果汁（含糖高）。","drugs":"补液盐III：补充水分和电解质。蒙脱石散：保护肠黏膜。益生菌：布拉氏酵母菌、双歧杆菌。","synergy":"不建议使用强力止泻药（妨碍毒素排出）。","food":"继续母乳喂养。配方奶喂养可暂时换无乳糖奶粉。","herbs":"推拿：摩腹、揉脐。"},"手足口病":{"cat":"儿科","title":"手足口病","content":"肠道病毒引起的急性传染病。5岁以下儿童多见。表现：手、足、口腔疱疹，伴发热。","emergency":"出现高热不退、嗜睡、呕吐、肌阵挛——警惕重症手足口病！","diet":"宜：清淡、易消化、温凉流质。忌：辛辣、咸酸、刺激性食物。","drugs":"对症治疗：无特效抗病毒药。退热：布洛芬/对乙酰氨基酚。口腔疼痛：开喉剑喷雾。","synergy":"隔离至疱疹消退（通常1周）。","food":"保持口腔清洁。","herbs":"金银花、连翘、板蓝根——清热解毒。"},"水痘":{"cat":"儿科","title":"水痘","content":"水痘-带状疱疹病毒引起。表现：发热、瘙痒性皮疹（红斑→丘疹→水疱→结痂）。传染性强。","emergency":"出现高热、头痛、呕吐——警惕脑炎！","diet":"宜：清淡、易消化饮食。忌：辛辣、发性食物（鱼虾羊肉）。","drugs":"抗病毒：阿昔洛韦（早期使用）。对症：退热、止痒。","synergy":"隔离至全部结痂（通常1周）。","food":"剪指甲避免抓破。","herbs":"银翘散——疏风清热、解毒透疹。"},"近视":{"cat":"五官科","title":"近视","content":"眼球过度生长导致远处物体成像在视网膜前。分为轴性近视和屈光性近视。高度近视（>600度）增加眼底病变风险。","emergency":"出现飞蚊症、闪光感、视野缺损——警惕视网膜脱离！","diet":"宜：富含维生素A、C、E，叶黄素的食物（胡萝卜、蓝莓、绿叶蔬菜）。","drugs":"框架眼镜：最安全。角膜塑形镜（OK镜）：控制近视进展。滴眼液：低浓度阿托品（0.01%）。","synergy":"每天户外活动>2小时可预防近视。","food":"保持正确读写姿势（33cm以上）。","herbs":"杞菊地黄丸——滋肾养肝、明目。"},"干眼症":{"cat":"五官科","title":"干眼症","content":"泪液分泌减少或蒸发过快导致眼表不适。症状：眼干、眼红、异物感、视疲劳。","emergency":"出现严重眼痛、视力下降","diet":"宜：富含Omega-3（深海鱼）、维生素A的食物。忌：长时间使用电子产品。","drugs":"人工泪液：玻璃酸钠滴眼液（首选）。抗炎：环孢素滴眼液。","synergy":"眨眼练习、热敷可缓解。","food":"避免长时间佩戴隐形眼镜。","herbs":"菊花、枸杞、决明子——清肝明目。"},"中耳炎":{"cat":"五官科","title":"中耳炎","content":"中耳腔炎症。分为分泌性中耳炎（积液）和化脓性中耳炎。常见表现：耳痛、听力下降、耳鸣。","emergency":"出现高热、头痛、呕吐——警惕脑膜炎！","diet":"宜：清淡饮食。忌：辛辣刺激。","drugs":"抗生素：阿莫西林/头孢类。减充血剂：麻黄碱滴鼻。","synergy":"擤鼻涕时不要两侧同时擤。","food":"避免水进入耳朵。","herbs":"龙胆草、柴胡、黄芩——清肝泻火。"},"鼻炎":{"cat":"五官科","title":"鼻炎","content":"鼻黏膜炎症。分为过敏性鼻炎（见相关词条）和非过敏性鼻炎。症状：鼻塞、流涕、打喷嚏、鼻痒。","emergency":"出现嗅觉丧失、头痛、鼻出血","diet":"宜：清淡饮食。忌：辛辣刺激、已知过敏原。","drugs":"鼻用糖皮质激素：布地奈德、氟替卡松。抗组胺药：氯雷他定、西替利嗪。生理盐水冲洗。","synergy":"避免接触过敏原和刺激物。","food":"保持室内清洁。","herbs":"苍耳子、辛夷、白芷——宣肺通窍。"},"咽炎":{"cat":"五官科","title":"咽炎","content":"咽部黏膜炎症。分为急性和慢性。症状：咽痛、咽干、异物感、咳嗽。","emergency":"出现高热、呼吸困难——警惕急性会厌炎！","diet":"宜：清淡、温凉饮食。忌：辛辣刺激、过烫食物、烟酒。","drugs":"含片：西地碘、胖大海含片。咽部喷雾：开喉剑。细菌感染时使用抗生素。","synergy":"多喝水、保持口腔清洁。","food":"避免过度用嗓。","herbs":"金银花、胖大海、麦冬——清热利咽。"},"痤疮":{"cat":"皮肤科","title":"痤疮/青春痘","content":"毛囊皮脂腺慢性炎症。与激素水平、皮脂分泌过多、毛囊角化、痤疮丙酸杆菌感染有关。","emergency":"出现囊肿、结节","diet":"宜：清淡饮食、富含维生素A的食物。忌：辛辣刺激、高糖高脂饮食（加重皮脂分泌）。","drugs":"外用：维A酸类（阿达帕林）、过氧化苯甲酰、抗生素（克林霉素）。口服：抗生素（多西环素）、异维A酸（重度）。","synergy":"维A酸+抗生素：协同作用。","food":"不要用手挤压。保持面部清洁。","herbs":"枇杷叶、桑白皮、黄芩——清肺泻火。"},"亚健康":{"cat":"中医","title":"亚健康状态","content":"介于健康与疾病之间的灰色状态。表现：疲劳乏力、失眠、情绪低落、注意力不集中、各种躯体不适，但检查无器质性病变。","emergency":"","diet":"宜：均衡营养、彩色蔬果（每天5种颜色以上）、优质蛋白、五谷杂粮。忌：熬夜（23点后睡）、久坐不动。","drugs":"无特异性药物，针对症状治疗——均需医生处方。","synergy":"","food":"枸杞菊花茶养肝明目；山药健脾益气。","herbs":"黄芪、党参、枸杞、菊花——益气养阴、清肝明目。"},"体质辨识":{"cat":"中医","title":"中医九种体质辨识","content":"平和质：精力充沛，睡眠安，食欲好。<br>气虚质：气短乏力、易感冒——宜补气（人参、黄芪）。<br>阳虚质：畏寒怕冷、手足冰凉——宜温阳（羊肉、桂圆）。<br>阴虚质：口干咽燥、手足心热——宜滋阴（银耳、百合）。<br>痰湿质：体胖痰多、腹部肥满——宜化痰祛湿（陈皮、薏米）。<br>湿热质：面油腻、口苦、长痘——宜清热利湿（苦瓜、绿豆）。<br>血瘀质：面色晦暗、疼痛固定——宜活血化瘀（三七、丹参）。<br>气郁质：情绪抑郁、焦虑胁胀——宜疏肝解郁（玫瑰花茶）。<br>特禀质：容易过敏——查明并避免过敏原。","emergency":"","diet":"根据体质类型选择食物。气虚宜补，痰湿宜祛，湿热宜清，阴虚宜滋，阳虚宜温。","drugs":"","synergy":"","food":"","herbs":"九种体质各有对应调理方案，具体用药请咨询中医师。"},"术后调理":{"cat":"中医","title":"手术后中医调理","content":"手术后身体虚弱，中医调理促进恢复。原则：扶正固本、活血化瘀。","emergency":"","diet":"宜：易消化、高蛋白、高维生素。忌：生冷、油腻、辛辣。","drugs":"","synergy":"","food":"根据手术类型调整。","herbs":"四君子汤（气虚）+桃红四物汤（血瘀）——益气活血。"},"肿瘤康复":{"cat":"中医","title":"肿瘤康复期调理","content":"手术/放化疗后中医调理，减轻副作用，提高生活质量。","emergency":"","diet":"宜：富含营养、易消化。忌：辛辣刺激、腌制食品。","drugs":"","synergy":"","food":"定期复查。","herbs":"扶正固本：黄芪、党参、灵芝——增强免疫。"}},"DIET":{"湿气":{"f":"薏米（炒）、赤小豆、茯苓、冬瓜、荷叶、陈皮、山药","a":"甜食、油腻、生冷、酒类、浓茶","r":"早餐：薏米红豆粥\n午餐：冬瓜排骨汤+清炒芹菜+米饭\n晚餐：清蒸鱼+凉拌苦瓜\n茶饮：玉米须茶"},"失眠":{"f":"酸枣仁、百合、莲子、小米、核桃、牛奶（温热睡前1小时）","a":"咖啡、浓茶（下午2点后禁饮）、酒精、辛辣","r":"早餐：小米粥+核桃包+牛奶\n晚餐：酸枣仁粥+馒头\n睡前：温热牛奶200ml"},"养胃":{"f":"山药、小米、南瓜、莲子、芡实、红枣、蒸蛋、软面条","a":"辛辣、生冷、油腻、过甜、过酸、咖啡、酒精","r":"早餐：小米粥+馒头+蒸蛋\n午餐：山药排骨汤+清炒南瓜+米饭\n晚餐：清蒸鱼+软面条"},"高血压":{"f":"芹菜、燕麦、香蕉、黑木耳、荞麦、深海鱼、绿叶蔬菜","a":"腌制品、高盐零食、加工食品、浓茶","r":"早餐：燕麦粥+全麦面包+香蕉\n午餐：芹菜炒肉+番茄蛋汤+米饭\ var WELCOME = {"consult": "👋 您好！我是AI中西医健康助手，由昆明医科大学专业医学知识库驱动。\n\n我可以为您提供常见病的专业解答，包括症状分析、用药建议、注意事项等。\n\n⚠️ **重要声明**：本助手仅供健康参考，不能替代专业医生诊断。如有紧急情况请拨打120。", "tcm": "🌿 中医体质辨识模式\n\n中医将人体体质分为九种类型，不同体质对应不同的养生方案。\n\n您可以告诉我您的症状，我来帮您初步辨识体质类型，并提供针对性的调理建议。", "diet": "🥗 疾病饮食方案模式\n\n科学饮食是疾病康复的重要环节。\n\n请告诉我您关注的具体疾病或健康问题，我将为您提供专业的饮食建议。", "knowledge": "📚 健康知识科普模式\n\n这里汇集了72种常见病的专业医学知识。\n\n您可以输入疾病名称或症状关键词，我将为您提供详细的疾病百科信息。"};
var CAT_ICONS = {"呼吸系统": "🫁", "心血管系统": "❤️", "消化系统": "🫄", "内分泌系统": "🧬", "神经系统": "🧠", "泌尿系统": "🫘", "骨科/风湿": "🦴", "皮肤科": "🧴", "五官科": "👁️", "妇产科": "👶", "精神心理": "🧘", "血液系统": "🩸", "肿瘤": "🔬", "其他": "📋", "中医体质": "🌿", "亚健康": "💤", "营养科": "🥗", "儿科": "🧒"};

// ===== INIT =====
(function init(){
  var mode = localStorage.getItem('mode') || 'consult';
  switchMode(mode);
  loadAdmin();
  showWelcome();
})();

// ===== MODE SWITCHING =====
function switchMode(mode){
  currentMode = mode;
  localStorage.setItem('mode', mode);
  document.querySelectorAll('.mode-btn').forEach(function(btn){
    btn.classList.toggle('active', btn.dataset.mode === mode);
  });
  // Update chips
  var bar = document.getElementById('chipsBar');
  bar.innerHTML = '';
  (CHIPS_DATA[mode] || []).forEach(function(kw){
    var btn = document.createElement('button');
    btn.className = 'chip';
    btn.textContent = kw;
    btn.onclick = function(){ sendQuick(kw); };
    bar.appendChild(btn);
  });
  // Show welcome if chat is empty
  var chat = document.getElementById('chatArea');
  if (chat.children.length === 0) showWelcome();
}

function showWelcome(){
  var chat = document.getElementById('chatArea');
  chat.innerHTML = '';
  addAIMessage(WELCOME[currentMode] || WELCOME.consult);
}

// ===== CHAT =====
function addAIMessage(text, cardHtml){
  var chat = document.getElementById('chatArea');
  var div = document.createElement('div');
  div.className = 'msg ai';
  var bubble = '<div class="msg-avatar">🌿</div><div class="msg-bubble">' + formatText(text) + (cardHtml || '') + '</div>';
  div.innerHTML = bubble;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function addUserMessage(text){
  var chat = document.getElementById('chatArea');
  var div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = '<div class="msg-avatar">👤</div><div class="msg-bubble">' + escHtml(text) + '</div>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function showTyping(){
  isTyping = true;
  var chat = document.getElementById('chatArea');
  var div = document.createElement('div');
  div.className = 'msg ai';
  div.id = 'typingMsg';
  div.innerHTML = '<div class="msg-avatar">🌿</div><div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function hideTyping(){
  isTyping = false;
  var el = document.getElementById('typingMsg');
  if (el) el.remove();
}

function escHtml(s){
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function formatText(text){
  if (!text) return '';
  return escHtml(text).replace(/\n/g, '<br>').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

// ===== SEND MESSAGE =====
function sendMessage(){
  var input = document.getElementById('userInput');
  var text = input.value.trim();
  if (!text || isTyping) return;
  input.value = '';
  autoResize(input);
  addUserMessage(text);
  processQuery(text);
}

function sendQuick(kw){
  if (isTyping) return;
  addUserMessage(kw);
  processQuery(kw);
}

function handleKey(e){
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
}

function autoResize(el){
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

// ===== QUERY PROCESSING =====
function processQuery(query){
  showTyping();
  setTimeout(function(){
    hideTyping();
    var result = searchKB(query);
    addAIMessage(result.text, result.cardHtml);
  }, 600 + Math.random() * 600);
}

function searchKB(query){
  var q = query.toLowerCase();
  
  // TCM mode
  if (currentMode === 'tcm') return searchTCM(q, query);
  
  // Diet mode
  if (currentMode === 'diet') return searchDiet(q, query);
  
  // Consult & Knowledge mode - search KB
  var kb = KB_DATA.KB || {};
  var keywords = KB_DATA.symptomKeywords || {};
  
  // Direct match first
  var directMatch = findDirectMatch(q, kb);
  if (directMatch) return buildKBResponse(directMatch.name, directMatch.data);
  
  // Keyword search
  var matches = findKeywordMatches(q, kb, keywords);
  if (matches.length > 0) return buildKBResponse(matches[0].name, matches[0].data);
  
  // Fuzzy match
  var fuzzy = findFuzzyMatch(q, kb);
  if (fuzzy) return buildKBResponse(fuzzy.name, fuzzy.data);
  
  return { text: '抱歉，我暂时没有找到与"' + query + '"相关的专业知识。

您可以尝试：
1. 输入具体疾病名称（如"高血压""糖尿病"）
2. 输入主要症状（如"头痛""胸闷"）
3. 点击上方的快捷标签

目前知识库涵盖72种常见病，如有紧急情况请及时就医。', cardHtml: '' };
}

function findDirectMatch(q, kb){
  for (var name in kb) {
    if (q === name.toLowerCase() || q.indexOf(name.toLowerCase()) >= 0 || name.toLowerCase().indexOf(q) >= 0) {
      return { name: name, data: kb[name] };
    }
  }
  return null;
}

function findKeywordMatches(q, kb, keywords){
  var scores = [];
  for (var name in kb) {
    var entry = kb[name];
    var score = 0;
    // Match in name
    if (q.indexOf(name.toLowerCase()) >= 0 || name.toLowerCase().indexOf(q) >= 0) score += 10;
    // Match in keywords
    var kws = keywords[name] || [];
    for (var i = 0; i < kws.length; i++) {
      if (q.indexOf(kws[i].toLowerCase()) >= 0 || kws[i].toLowerCase().indexOf(q) >= 0) score += 3;
    }
    // Match in title
    if (entry.title && entry.title.toLowerCase().indexOf(q) >= 0) score += 5;
    // Match in content
    if (entry.content && entry.content.toLowerCase().indexOf(q) >= 0) score += 2;
    if (score > 0) scores.push({ name: name, data: entry, score: score });
  }
  scores.sort(function(a,b){ return b.score - a.score; });
  return scores.slice(0, 3);
}

function findFuzzyMatch(q, kb){
  var best = null, bestScore = 0;
  for (var name in kb) {
    var s = similarity(q, name.toLowerCase());
    if (s > bestScore && s > 0.4) { bestScore = s; best = { name: name, data: kb[name] }; }
  }
  return best;
}

function similarity(a, b){
  if (a === b) return 1;
  if (!a || !b) return 0;
  var longer = a.length > b.length ? a : b;
  var shorter = a.length > b.length ? b : a;
  var hits = 0;
  for (var i = 0; i < shorter.length; i++) {
    if (longer.indexOf(shorter[i]) >= 0) hits++;
  }
  return (hits * 2) / (a.length + b.length);
}

function buildKBResponse(name, data){
  var icon = CAT_ICONS[data.cat] || '📋';
  var card = '<div class="kb-card">';
  card += '<div class="kb-card-header">';
  card += '<span class="cat-icon">' + icon + '</span>';
  card += '<span class="cat-name">' + (data.cat || '未分类') + '</span>';
  card += '<span class="title">' + escHtml(data.title || name) + '</span>';
  card += '</div><div class="kb-card-body">';
  
  if (data.content) card += kbSection('📋 疾病概述', data.content);
  if (data.drugs) card += kbSection('💊 用药建议', data.drugs);
  if (data.diet) card += kbSection('🍽️ 饮食建议', data.diet);
  if (data.herbs) card += kbSection('🌿 中医方案', data.herbs);
  if (data.synergy) card += kbSection('⚠️ 药物相互作用', data.synergy);
  if (data.food) card += kbSection('🍎 食物注意', data.food);
  if (data.emergency) card += '<div class="kb-emergency">' + escHtml(data.emergency) + '</div>';
  
  card += '</div></div>';
  
  return { text: '为您找到了以下专业信息：', cardHtml: card };
}

function kbSection(title, content){
  return '<div class="kb-section"><div class="kb-section-title">' + title + '</div><div class="kb-section-content">' + formatText(content) + '</div></div>';
}

// ===== TCM SEARCH =====
function searchTCM(q, query){
  var tcm = KB_DATA.TCM || {};
  // Check for direct体质 match
  for (var name in tcm) {
    var entry = tcm[name];
    if (q.indexOf(name.toLowerCase()) >= 0 || query.indexOf(name) >= 0) return buildTCMResponse(name, entry);
    // Check features
    if (entry.features && entry.features.toLowerCase().indexOf(q) >= 0) return buildTCMResponse(name, entry);
  }
  // Check symptoms in all tcm
  for (var name in tcm) {
    var entry = tcm[name];
    var f = (entry.features || '') + ' ' + (entry.advice || '');
    if (f.indexOf(q) >= 0) return buildTCMResponse(name, entry);
  }
  return { text: '抱歉，未能匹配到具体的中医体质类型。

中医九种体质包括：平和质、气虚质、阳虚质、阴虚质、痰湿质、湿热质、血瘀质、气郁质、特禀质。

您可以描述自己的症状特征，我来帮您初步辨识。', cardHtml: '' };
}

function buildTCMResponse(name, data){
  var card = '<div class="tcm-card">';
  card += '<div class="kb-card-header">';
  card += '<span class="cat-icon">🌿</span>';
  card += '<span class="cat-name">中医体质</span>';
  card += '<span class="title">' + escHtml(data.title || name) + '</span>';
  card += '</div><div class="kb-card-body">';
  if (data.features) card += kbSection('🔍 体质特征', data.features);
  if (data.advice) card += kbSection('💡 调理建议', data.advice);
  if (data.food) card += kbSection('🥗 推荐食物', data.food);
  if (data.avoid) card += kbSection('🚫 忌食', data.avoid);
  if (data.herbs) card += kbSection('🌿 调理方药', data.herbs);
  if (data.exercise) card += kbSection('🏃 运动建议', data.exercise);
  card += '</div></div>';
  return { text: '根据您的描述，初步分析如下：', cardHtml: card };
}

// ===== DIET SEARCH =====
function searchDiet(q, query){
  var diet = KB_DATA.DIET || {};
  // Direct match
  for (var name in diet) {
    var entry = diet[name];
    if (q.indexOf(name.toLowerCase()) >= 0 || query.indexOf(name) >= 0) return buildDietResponse(name, entry);
  }
  // Search in KB entries that match and have diet info
  var kb = KB_DATA.KB || {};
  var keywords = KB_DATA.symptomKeywords || {};
  for (var name in kb) {
    var entry = kb[name];
    if (q.indexOf(name.toLowerCase()) >= 0 || name.toLowerCase().indexOf(q) >= 0) {
      if (entry.diet) {
        var card = buildKBResponse(name, entry);
        return { text: '以下是关于"' + name + '"的饮食建议：', cardHtml: card.cardHtml };
      }
    }
  }
  // Keyword match
  for (var name in kb) {
    var entry = kb[name];
    var kws = keywords[name] || [];
    for (var i = 0; i < kws.length; i++) {
      if (q.indexOf(kws[i].toLowerCase()) >= 0 && entry.diet) {
        var card = buildKBResponse(name, entry);
        return { text: '以下是关于"' + name + '"的饮食建议：', cardHtml: card.cardHtml };
      }
    }
  }
  return { text: '抱歉，暂时没有找到"' + query + '"的专项饮食方案。

当前涵盖的饮食方案包括：高血压、糖尿病、痛风、胃病、减肥、贫血、老人、儿童等多种方案。

您也可以在"咨询"模式下查看具体疾病的饮食建议。', cardHtml: '' };
}

function buildDietResponse(name, data){
  var card = '<div class="kb-card">';
  card += '<div class="kb-card-header">';
  card += '<span class="cat-icon">🥗</span>';
  card += '<span class="cat-name">营养科</span>';
  card += '<span class="title">' + escHtml(data.title || name) + '</span>';
  card += '</div><div class="kb-card-body">';
  if (data.principle) card += kbSection('📋 饮食原则', data.principle);
  if (data.recommend) card += kbSection('✅ 推荐食物', data.recommend);
  if (data.avoid) card += kbSection('❌ 限制食物', data.avoid);
  if (data.sample) card += kbSection('📝 一日食谱示例', data.sample);
  if (data.notes) card += kbSection('📌 注意事项', data.notes);
  card += '</div></div>';
  return { text: '为您推荐以下饮食方案：', cardHtml: card };
}

// ===== FEEDBACK =====
function openFeedback(){ document.getElementById('feedbackModal').classList.add('show'); }
function closeFeedback(){ document.getElementById('feedbackModal').classList.remove('show'); }
function setRating(v){
  feedbackRating = v;
  document.querySelectorAll('#starsContainer .star').forEach(function(s){
    s.classList.toggle('active', parseInt(s.dataset.v) <= v);
  });
}

function submitFeedback(){
  var text = document.getElementById('feedbackText').value.trim();
  if (feedbackRating === 0){ showToast('请先选择评分 ⭐', 'error'); return; }
  var fb = { rating: feedbackRating, text: text, time: new Date().toISOString(), mode: currentMode };
  var list = JSON.parse(localStorage.getItem('feedbacks') || '[]');
  list.push(fb);
  localStorage.setItem('feedbacks', JSON.stringify(list));
  // Try pushplus
  var token = localStorage.getItem('pushplusToken');
  if (token) sendPushplus(token, fb);
  feedbackRating = 0;
  document.getElementById('feedbackText').value = '';
  document.querySelectorAll('#starsContainer .star').forEach(function(s){ s.classList.remove('active'); });
  closeFeedback();
  showToast('感谢您的反馈！🎉', 'success');
}

function sendPushplus(token, fb){
  var title = '健康助手反馈 ⭐' + fb.rating;
  var content = '评分：' + fb.rating + '/5\n模式：' + fb.mode + '\n时间：' + fb.time + '\n内容：' + (fb.text || '无');
  var url = 'https://www.pushplus.plus/send?token=' + token + '&title=' + encodeURIComponent(title) + '&content=' + encodeURIComponent(content) + '&template=txt';
  try { new Image().src = url; } catch(e){}
}

// ===== ADMIN =====
function openAdmin(){
  document.getElementById('adminModal').classList.add('show');
  var list = JSON.parse(localStorage.getItem('feedbacks') || '[]');
  document.getElementById('statCount').textContent = list.length;
  if (list.length > 0) {
    var sum = list.reduce(function(a,b){ return a + b.rating; }, 0);
    document.getElementById('statAvg').textContent = (sum / list.length).toFixed(1);
  } else {
    document.getElementById('statAvg').textContent = '0';
  }
}
function closeAdmin(){ document.getElementById('adminModal').classList.remove('show'); }
function saveAdmin(){
  var token = document.getElementById('pushplusToken').value.trim();
  localStorage.setItem('pushplusToken', token);
  showToast('设置已保存 ✓', 'success');
}
function exportCSV(){
  var list = JSON.parse(localStorage.getItem('feedbacks') || '[]');
  if (list.length === 0){ showToast('暂无反馈数据', 'error'); return; }
  var csv = '\uFEFF评分,内容,时间,模式\n';
  list.forEach(function(f){ csv += f.rating + ',"' + (f.text||'').replace(/"/g,'""') + '",' + f.time + ',' + f.mode + '\n'; });
  var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'feedback_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click(); URL.revokeObjectURL(url);
  showToast('CSV已导出 📊', 'success');
}

// ===== TOAST =====
function showToast(msg, type){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  setTimeout(function(){ t.className = 'toast'; }, 2500);
}

// ===== MODAL CLOSE ON OVERLAY CLICK =====
document.querySelectorAll('.modal-overlay').forEach(function(overlay){
  overlay.addEventListener('click', function(e){
    if (e.target === overlay) overlay.classList.remove('show');
  });
});
