<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f5f2ed;color:#333;min-height:100vh}

<script>
// ========== 知识库 ==========
var KB={
"感冒":{t:"普通感冒 / 上呼吸道感染",c:"由病毒引起的上呼吸道感染。常见症状：鼻塞、流涕、咽痛、咳嗽、低热（<38℃）、全身乏力。多数情况下可自愈，病程约5-7天。",d:"【宜】多喝温水（每日2000ml+）、清淡饮食、新鲜蔬果、热粥、鸡汤。<br>【忌】辛辣油腻、生冷食物、烟酒、过度劳累。",m:"感冒灵颗粒、板蓝根颗粒、对乙酰氨基酚（退烧>38.5℃时服用）。注意休息，多饮水。"},
"发烧":{t:"发热",c:"体温超过37.3℃即为发热。低热（37.3-38℃）可物理降温；中高热（>38.5℃）需用退烧药。持续发热超过3天或伴严重症状需立即就医。",d:"【宜】大量补水、流质/半流质饮食、电解质水、清淡易消化。<br>【忌】油腻辛辣、高蛋白难消化食物。",m:"布洛芬（间隔≥6h）、对乙酰氨���酚��间隔≥4h）。儿童勿用阿司匹林。"},
"头痛":{t:"头痛",c:"原因多样：紧张性头痛（最常见，与压力/姿势有关）、偏头痛（搏动性痛+恶心畏光）、感冒相关头痛、高血压头痛等。长期反复发作需就医检查。",d:"【宜】规律作息、充足睡眠、适量运动、少看屏幕。<br>【忌】过量咖啡因、熬夜、长时间固定姿势。",m:"轻度：休息+按摩太阳穴；中度：布洛芬/对乙酰氨基酚；偏头痛特异性药需医生处方。"},
"失眠":{t:"失眠 / 睡眠障碍",c:"表现为入睡困难（>30min）、早醒、睡眠浅、总睡眠<6h。常见原因：焦虑/压力、作息不规律、睡前使用电子设备、咖啡因摄入过晚。",d:"【宜】睡前1h远离手机/电脑、固定就寝时间、睡前温牛奶/核桃、卧室保持黑暗安静（18-22℃）。<br>【忌】下午4点后咖啡/浓茶、睡前剧烈运动、床上玩手机。",m:"短期：褪黑素（保健品）；长期/严重：需就医，可能涉及CBT-I认知行为治疗或药物干预。"},
"胃痛":{t:"胃痛 / 胃部不适",c:"可能病因：急性/慢性胃炎、胃溃疡、功能性消化不良、胃食管反流。典型症状：上腹隐痛或灼烧感、胀气、反酸、恶心。与饮食不规律、刺激性食物密切相关。",d:"【宜】少食多餐（每日5-6次）、温热软食、小米粥、山药、南瓜。<br>【忌】生冷冰饮、辛辣刺激、酒精、浓茶咖啡、空腹服止痛药（伤胃黏膜）。",m:"抑酸：奥美拉唑（饭前30min）；护胃：铝碳酸镁；促动力：多潘立酮。持续>2周需胃镜检查。"},
"腹泻":{t:"腹泻 / 拉肚子",c:"排便次数增多（>3次/日）且粪便稀薄/水样。常见原因：急性胃肠炎（诺如病毒/细菌感染）、食物不耐受/过敏、腹部受凉。重点预防脱水！",d:"【宜】口服补液盐（ORS）、白米粥加少许盐、烤面包片、香蕉、苹果泥。<br>【忌】乳制品（乳糖不耐受加重腹泻）、高纤维蔬菜、油腻辛辣、冷饮。",m:"止泻：蒙脱石散（空腹服）；补液：口服补液盐III；益生菌：双歧杆菌三联活菌。便血/高热>39℃需急诊。"},
"咳嗽":{t:"咳嗽",c:"呼吸道常见症状。干咳（无痰）：早期感冒、过敏、气道刺激。湿咳（有痰）：支气管炎、肺炎、鼻后滴漏。持续>2周需就医排除其他疾病。",d:"【宜】蜂蜜温水（研究证实有效）、蒸汽吸入、多喝温水、梨汤。<br>【忌】甜食生痰、冷空气直接刺激、吸烟环境。",m:"干咳：右美沙芬；有痰：氨溴索/乙酰半胱氨酸化痰。抗生素仅细菌感染时有效。"},
"便秘":{t:"便秘",c:"排便频率减少（<3次/周）、粪便干硬、排便困难。常见原因：膳食纤维不足、饮水少、缺乏运动、久坐、忽视便意。",d:"【宜】大量饮水（每日2L+）、高纤维食物（燕麦、红薯、芹菜、火龙果）、规律如厕习惯（晨起后）。<br>【忌】久坐不动、过度依赖泻药、精细加工食品。",m:"轻度：乳果糖/聚乙二醇（安全可长期用）；临时：开塞露。顽固性便秘需结肠镜检查。"},
"脚疼":{t:"足部疼痛",c:"可能原因：（1）足底筋膜炎—晨起第一步刺痛；（2）跟腱炎—跟腱处疼痛肿胀；（3）痛风—大脚趾红肿剧痛（多夜间发作）；（4）鞋子不合脚。",d:"【宜】休息+冰敷（急性期）、换穿舒适鞋、足底筋膜拉伸、控制体重。<br>【忌】长时间站立/行走、穿高跟鞋/硬底鞋、强行运动忍痛。",m:"止痛：布洛芬/外用扶他林；足底筋膜炎：足弓支撑垫+拉伸；痛风：秋水仙碱（需确诊后用药）。"},
"腰痛":{t:"腰部疼痛",c:"常见原因：腰肌劳损（久坐/姿势不良）、��椎��盘突出（坐骨神经痛放射至腿）、腰扭伤、肾结石（绞痛+血尿）。持续>2周需影像学检查。",d:"【宜】卧床休息（硬板床）、温和拉伸、核心肌群锻炼、避免弯腰搬重物。<br>【忌】久坐不动、床垫过软、突然扭转腰部、负重弯腰。",m:"肌肉劳损：热敷+布洛芬+理疗；椎间盘突出：需骨科评估，严重者手术。"},
"过敏":{t:"过敏性反应",c:"免疫系统对无害物质（过敏原）的过度反应。常见类型：过敏性鼻炎（打喷嚏+流涕+鼻痒）、皮肤过敏（荨麻疹/湿疹）、食物过敏、哮喘。",d:"【宜】记录过敏日记找出诱因、保持室内清洁除螨、戴口罩防花粉/粉尘。<br>【忌】已知过敏原接触。",m:"抗组胺药：氯雷他定/西替利嗪；鼻炎：鼻喷激素（糠酸莫米松）；严重过敏：立即注射肾上腺素+急诊。"},
"痛经":{t:"痛经 / 月经不适",c:"原发性痛经：子宫前列腺素分泌过多导致子宫收缩，下腹坠痛+腰酸，常在月经第1-2天最重。继发性痛经：子宫内膜异位症，需妇科检查。",d:"【宜】热敷下腹部、姜茶/红糖水、温和瑜伽、规律作息。<br>【忌】生冷寒凉食物、剧烈运动、压力过大。",m:"NSAIDs：布洛芬/萘普生（月经开始前1-2天提前服用效果最佳）；严重者：短效避孕药（需医嘱）。"},
"高血压":{t:"高血压",c:"血压持续≥140/90mmHg。多数无症状（\"沉默杀手\"），长期不控可致心梗、脑卒中、肾衰竭。生活方式干预是基础。",d:"【宜】DASH饮食（低钠高钾）、每日<5g盐、有氧运动150min/周、限酒、减重。<br>【忌】高盐腌制食品、肥胖、吸烟、精神高度紧张、擅自停药。",m:"一线药：氨氯地平/硝苯地平（CCB）、厄贝沙坦/缬沙坦（ARB）、氢氯噻嗪（利尿剂）。需终身服药！"},
"糖尿病":{t:"糖尿病",c:"血糖代谢紊乱。典型\"三多一少\"：多饮、多食、多尿、体重下降。2型占90%+，与遗传+生活方式相关。并发症累及眼/肾/神经/心血管。",d:"【宜】定时定量进餐、低GI主食（糙米/燕麦代替精米面）、高纤维蔬菜、血糖监测。<br>【忌】含糖饮料/甜点、暴饮暴食、完全不吃主食（酮症风险）。",m:"二甲双胍（一线首选）；胰岛素（1型必须/2型后期）；GLP-1受体激动剂。定期查糖化血红蛋白。"},
"焦虑":{t:"焦虑 / 焦虑症",c:"过度担忧、紧张不安、心悸出汗、失眠、注意力难以集中。生理性焦虑（正常反应）vs 病理性焦虑（持续>6月、影响生活）。",d:"【宜】规律运动、正念冥想、深呼吸练习、保证睡眠、限制咖啡因。<br>【忌】酒精自我 medicate、回避引起焦虑的场景、信息过载刷手机。",m:"轻度：CBT认知行为治疗（首选）；中度以上：SSRIs（舍曲林/氟西汀），起效需2-4周。"},
"牙痛":{t:"牙痛",c:"常见原因：龋齿（蛀牙深入牙髓→剧痛）、牙周炎（牙龈出血+松动）、智齿冠周炎、牙本质敏感。",d:"【宜】温水漱口、盐水漱口（杀菌）、避免患侧咀嚼、冷敷面部。<br>【忌】甜食/过冷过热食物、用患牙咬硬物、自行服抗生素替代看牙。",m:"临时止痛：布洛芬+甲硝唑；根本解决：看牙医补牙/根管/拔智齿。牙痛不会自愈！"},
"中暑":{t:"中暑 / 热射病",c:"高温环境下体温调节失衡。先兆：头晕、口渴、多汗、乏力。重症（热射病）：体温>40℃、无汗、意识模糊——危及生命！",d:"【宜】立即移至阴凉通风处、解开衣扣、补充淡盐水、冷敷颈部腋下。<br>【忌】继续暴露在高温环境、大量饮用纯水（水中毒）、酒精饮料。",m:"轻症：休息+补液即可。重症：立即拨打急救+物理降温，死亡率极高！"}
};

// ========== 搜索函数 ==========
function search(q){
q=q.toLowerCase().replace(/[^\u4e00-\u9fa5a-z0-9]/g,'');
if(q.length<2)return null;
var best=null,bestScore=0;
for(var k in KB){
var item=KB[k],s=0;
var keys=(k+' '+item.t+' '+item.c).toLowerCase();
if(keys.indexOf(q)>=0)s+=10;
for(var i=0;i<=Math.min(q.length-2,3);i++){
var sub=q.substring(i,i+2);
if(keys.indexOf(sub)>=0)s+=3;}
if(s>bestScore){bestScore=s;best=item;}
}
return bestScore>=3?best:null;
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function addMsg(cls,html){var d=document.createElement('div');d.className='msg '+cls;d.innerHTML=html;document.getElementById('chat').appendChild(d);document.getElementById('chat').scrollTop=99999;}

function send(){
var inp=document.getElementById('inp'),q=inp.value.trim();
if(!q)return;
addMsg('user-msg',esc(q));
inp.value='';
var ld=document.createElement('div');ld.className='msg ai-msg loading';ld.textContent='正在查询...';document.getElementById('chat').appendChild(ld);
document.getElementById('chat').scrollTop=99999;
setTimeout(function(){
var r=search(q);
if(r){
document.getElementById('chat').removeChild(ld);
addMsg('ai-msg','<div class="title">'+r.t+'</div><div class="section">'+r.c+'</div><div class="section"><strong>饮食建议：</strong>'+r.d+'</div><div class="section"><strong>常用药物：</strong>'+r.m+'</div><span class="disclaimer">⚠️ 仅供参考，如有不适请就医</span>');
}else{
// 本地KB无匹配，尝试调用OpenClaw本地API
callOpenClawAPI(q,ld);
}
},300);
}

function callOpenClawAPI(q,ld){
var OPENCLAW_URL='http://127.0.0.1:28789/v1/chat/completions';
var systemPrompt='你是岐黄智医，一个AI中西医结合健康助手。回答要：1)简洁易懂 2)结合中西医视角 3)给出饮食和生活建议 4)提醒严重情况需就医。';
var body=JSON.stringify({model:'gpt-3.5-turbo',messages:[{role:'system',content:systemPrompt},{role:'user',content:q}],stream:true});
fetch(OPENCLAW_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:body})
.then(function(resp){
if(!resp.ok)throw new Error('API error:'+resp.status);
document.getElementById('chat').removeChild(ld);
var msgDiv=document.createElement('div');msgDiv.className='msg ai-msg';document.getElementById('chat').appendChild(msgDiv);
var reader=resp.body.getReader();
var decoder=new TextDecoder();
var fullText='';
function read(){reader.read().then(function(result){
if(result.done){msgDiv.innerHTML=fullText+'<span class="disclaimer">⚠️ 仅供参考，如有不适请就医</span>';return;}
var chunk=decoder.decode(result.value,{stream:true});
var lines=chunk.split('\n');
lines.forEach(function(line){
if(line.startsWith('data: ')){
var data=line.slice(6);
if(data==='[DONE]')return;
try{var json=JSON.parse(data);if(json.choices&&json.choices[0].delta&&json.choices[0].delta.content){fullText+=json.choices[0].delta.content;msgDiv.innerHTML=fullText;}}catch(e){}
}
});
read();
});}
read();
})
.catch(function(e){
document.getElementById('chat').removeChild(ld);
// OpenClaw API失败，尝试Groq
var groqKey=localStorage.getItem('groq_api_key');
if(groqKey){
callGroqAPI(q,groqKey);
}else{
addMsg('ai-msg','抱歉，知识库暂未收录此问题。<br><br><b>想要 AI 智能回答？</b><br>请在设置中配置 API Key，或确保 OpenClaw 正在运行。<br><br><a href="https://console.groq.com/keys" target="_blank">获取免费 API Key</a>');
}
});
}

function callGroqAPI(q,key){
var GROQ_URL='https://api.groq.com/openai/v1/chat/completions';
var systemPrompt='你是岐黄智医，一个AI中西医结合健康助手。回答要：1)简洁易懂 2)结合中西医视角 3)给出饮食和生活建议 4)提醒严重情况需就医。';
var body=JSON.stringify({model:'llama-3.1-8b-instant',messages:[{role:'system',content:systemPrompt},{role:'user',content:q}],stream:true});
fetch(GROQ_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:body})
.then(function(resp){
if(!resp.ok)throw new Error('Groq error:'+resp.status);
var msgDiv=document.createElement('div');msgDiv.className='msg ai-msg';document.getElementById('chat').appendChild(msgDiv);
var reader=resp.body.getReader();
var decoder=new TextDecoder();
var fullText='';
function read(){reader.read().then(function(result){
if(result.done){msgDiv.innerHTML=fullText+'<span class="disclaimer">⚠️ 仅供参考，如有不适请就医</span>';return;}
var chunk=decoder.decode(result.value,{stream:true});
var lines=chunk.split('\n');
lines.forEach(function(line){
if(line.startsWith('data: ')){
var data=line.slice(6);
if(data==='[DONE]')return;
try{var json=JSON.parse(data);if(json.choices&&json.choices[0].delta&&json.choices[0].delta.content){fullText+=json.choices[0].delta.content;msgDiv.innerHTML=fullText;}}catch(e){}
}
});
read();
});}
read();
})
.catch(function(e){
addMsg('ai-msg','API 调用失败：'+e.message+'<br><br>请检查 API Key 是否正确，或稍后重试。');
});
}

function startQuiz(){
if(quizStarted)return;
quizStarted=true;quizAnswers=[];
showQuestion();
}

function showQuestion(){
var i=quizAnswers.length;
if(i>=quizData.length){
showResult();return;
}
var q=quizData[i];
document.getElementById('progress').style.width=((i/quizData.length)*100)+'%';
document.getElementById('question').textContent=(i+1)+'. '+q.q;
var opts=document.getElementById('options');opts.innerHTML='';
var allOpts=[];
if(q.y)allOpts=q.y;
if(q.n)allOpts=allOpts.concat(q.n);
allOpts.forEach(function(opt){
var btn=document.createElement('div');
btn.className='quiz-option';
btn.textContent=opt;
btn.onclick=function(){selectOption(opt);};
opts.appendChild(btn);
});
}

function selectOption(opt){
quizAnswers.push(opt);
showQuestion();
}

function showResult(){
document.getElementById('quiz-area').style.display='none';
document.getElementById('result').className='quiz-result active';
var scores={};
constitutions.forEach(function(c){scores[c]=0;});
// 简化计分
quizAnswers.forEach(function(a,i){
if(quizData[i].y&&quizData[i].y.indexOf(a)>=0){
constitutions.forEach(function(c){scores[c]++;});
}else if(quizData[i].n&&quizData[i].n.indexOf(a)>=0){
constitutions.forEach(function(c){scores[c]+=0.5;});
}
});
// 平和优先
if(quizAnswers.filter(function(a){return a==="是";}).length<=3&&
   quizAnswers.filter(function(a){return a==="否";}).length>=10){
scores["平和"]+=10;
}
// 找最高分
var maxScore=0,result="平和";
for(var c in scores){
if(scores[c]>maxScore){maxScore=scores[c];result=c;}
}
var info=constitutionInfo[result];
document.getElementById('result-type').textContent=result+"质";
document.getElementById('result-symptoms').textContent=info.s;
document.getElementById('result-tcm').textContent=info.t;
document.getElementById('result-life').textContent=info.l;
document.getElementById('result-diet').textContent=info.d;
}

function resetQuiz(){
quizStarted=false;quizAnswers=[];
document.getElementById('quiz-area').style.display='block';
document.getElementById('result').className='quiz-result';
showQuestion();
}

function loadKeys(){
document.getElementById('api-key').value=localStorage.getItem('groq_api_key')||'';
document.getElementById('deepseek-key').value=localStorage.getItem('deepseek_api_key')||'';
}

function saveKeys(){
var k1=document.getElementById('api-key').value.trim();
var k2=document.getElementById('deepseek-key').value.trim();
if(k1)localStorage.setItem('groq_api_key',k1);
if(k2)localStorage.setItem('deepseek_api_key',k2);
alert('已保存！配置 API Key 后，AI 可以回答任何健康问题。');
}
