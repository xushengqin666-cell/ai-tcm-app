<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--pri:#2e7d6b;--pri-l:#4db8a4;--pri-d:#1b5e50;--acc:#ff8f00;--bg:#f0f7f4;--card:#fff;--txt:#2c3e3a;--txt2:#6b7c78;--sh:0 2px 12px rgba(46,125,107,.1);--r:16px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--txt);height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.hd{background:linear-gradient(135deg,var(--pri-d),var(--pri));color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(21,101,192,.3);z-index:10}
.hd .logo{font-size:22px;font-weight:700;letter-spacing:1px}
.hd .logo span{font-size:13px;font-weight:400;opacity:.85;margin-left:8px}
.hd .spacer{flex:1}
.hd .gear{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;opacity:.8;transition:.2s}
.hd .gear:hover{opacity:1;transform:rotate(30deg)}
.tabs{display:flex;background:#fff;border-bottom:1px solid #e0e0e0}
.tabs button{flex:1;padding:10px;border:none;background:none;font-size:14px;font-weight:600;color:var(--txt2);cursor:pointer;border-bottom:3px solid transparent;transition:.2s}
.tabs button.active{color:var(--pri);border-bottom-color:var(--pri)}
.tabs button:hover{background:#f0f4ff}
.panel{display:none;flex:1;overflow-y:auto;padding:16px}

.msg{max-width:85%;padding:12px 16px;border-radius:var(--r);line-height:1.7;font-size:15px;animation:fadeUp .3s ease;word-break:break-word}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--pri),var(--pri-l));color:#fff;border-bottom-right-radius:4px}

.msg.ai b{color:var(--pri)}
.msg.ai .tag{display:inline-block;background:#e3f2fd;color:var(--pri);padding:2px 8px;border-radius:8px;font-size:12px;font-weight:600;margin:2px 4px 2px 0}
.msg.ai .section{margin:10px 0;padding:10px;background:#f8f9ff;border-radius:10px}
.msg.ai .section-title{font-weight:700;color:var(--pri-d);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.msg.ai .section p{margin:4px 0 4px 28px;font-size:14px;color:#444}
.msg .disclaimer{display:block;margin-top:10px;font-size:12px;color:#999;border-top:1px dashed #e0e0e0;padding-top:8px}
.msg.loading{align-self:flex-start;background:#fff;border:1px solid #e8eaf6;box-shadow:var(--sh);padding:16px 20px}
.spinner{width:28px;height:28px;border:3px solid #e0e0e0;border-top-color:var(--pri);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.input-bar{display:flex;gap:8px;padding:12px 16px;background:#fff;border-top:1px solid #e0e0e0;position:sticky;bottom:0;z-index:5}
.input-bar input{flex:1;border:2px solid #e0e0e0;border-radius:24px;padding:10px 18px;font-size:15px;outline:none;transition:.2s}
.input-bar input:focus{border-color:var(--pri-l)}
.input-bar button{background:linear-gradient(135deg,var(--pri),var(--pri-l));color:#fff;border:none;border-radius:24px;padding:10px 20px;font-size:15px;font-weight:600;cursor:pointer;transition:.2s}
.input-bar button:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(21,101,192,.3)}
.model-bar{display:flex;gap:6px;padding:8px 16px;background:#fff;overflow-x:auto;border-bottom:1px solid #f0f0f0}
.model-bar button{padding:5px 12px;border-radius:20px;border:1px solid #e0e0e0;background:#fff;font-size:12px;cursor:pointer;white-space:nowrap;transition:.2s}

.quiz-wrap{max-width:500px;margin:0 auto;width:100%}

.result-card{background:linear-gradient(135deg,#e3f2fd,#f3e5f5);border-radius:var(--r);padding:24px;box-shadow:var(--sh)}

.s-card{background:#fff;border-radius:var(--r);padding:20px;box-shadow:var(--sh);margin-bottom:12px}

.s-card input:focus{border-color:var(--pri-l)}
.s-card .hint{font-size:12px;color:#999;margin-top:-8px;margin-bottom:12px}
.s-card button{background:var(--pri);color:#fff;border:none;border-radius:10px;padding:8px 20px;font-size:14px;cursor:pointer;transition:.2s}
.s-card button:hover{background:var(--pri-d)}
.quick-btns{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;background:#fff;border-top:1px solid #f0f0f0}
.quick-btns button{padding:6px 14px;border:1px solid #e0e0e0;border-radius:20px;background:#fff;font-size:13px;cursor:pointer;transition:.2s;color:var(--txt)}
.quick-btns button:hover{border-color:var(--pri-l);background:#e3f2fd;color:var(--pri)}

@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.tw-cursor{display:inline-block;width:2px;height:1em;background:#2e7d6b;margin-left:2px;animation:blink 1s infinite;vertical-align:text-bottom}
@media(prefers-color-scheme:dark){:root{--pri:#4db8a4;--pri-l:#6dd5c0;--pri-d:#2e7d6b;--acc:#ffb300;--bg:#1a1a2e;--card:#16213e;--txt:#e0e0e0;--txt2:#a0a0a0;--sh:0 2px 12px rgba(0,0,0,.3);--r:16px}.tabs{background:#16213e;border-bottom-color:#333}.tabs button{color:#a0a0a0}.tabs button:hover{background:#1a1a2e}.msg.ai{background:#16213e;border-color:#333;color:#e0e0e0}.msg.ai b{color:#4db8a4}.msg.ai .tag{background:#1a3a3a;color:#4db8a4}.msg.ai .section{background:#1a2a3a}.msg.ai .section-title{color:#6dd5c0}.msg.ai .section p{color:#ccc}.msg .disclaimer{color:#666;border-top-color:#333}.msg.loading{background:#16213e;border-color:#333}.spinner{border-color:#333;border-top-color:#4db8a4}.input-bar{background:#16213e;border-top-color:#333}.input-bar input{background:#1a1a2e;border-color:#333;color:#e0e0e0}.model-bar{background:#16213e;border-bottom-color:#333}.model-bar button{background:#16213e;border-color:#444;color:#ccc}.model-bar button.active{background:#2e7d6b;color:#fff}.quiz-card{background:#16213e;color:#e0e0e0}.quiz-card .opt{border-color:#444;color:#ccc}.quiz-card .opt:hover{background:#1a2a3a;border-color:#4db8a4}.s-card{background:#16213e;color:#e0e0e0}.s-card input{background:#1a1a2e;border-color:#444;color:#e0e0e0}.quick-btns{background:#16213e;border-top-color:#333}.quick-btns button{background:#16213e;border-color:#444;color:#ccc}.quick-btns button:hover{background:#1a3a3a;color:#4db8a4;border-color:#4db8a4}.result-card{background:linear-gradient(135deg,#1a2a3a,#2a1a3a)}}
</style>

</head>

<script>
// ========== Expanded Knowledge Base (50+ entries) ==========
var KB=[{t:"加载中",c:"正在加载知识库...",kw:["加载"]}]; // Loaded from remote]; // Will be loaded from remote/local

// ===== Remote KB Loading System =====
var KB_VERSION_KEY='qhy_kb_version';
var KB_DATA_KEY='qhy_kb_data';
var KB_TIME_KEY='qhy_kb_time';
var KB_URL='https://xushengqin666-cell.github.io/ai-tcm-app/kb.json';
var KB_CHECK_INTERVAL=30*60*1000; // Check every 30min

function loadKB(){
  // 1. Try localStorage cache first
  var cached=localStorage.getItem(KB_DATA_KEY);
  if(cached){
    try{
      KB=JSON.parse(cached);
      showKBStatus('本地缓存 ('+KB.length+'条)',true);
    }catch(e){localStorage.removeItem(KB_DATA_KEY);}
  }
  
  // 2. Fetch remote KB (always try to update)
  fetchRemoteKB();
  
  // 3. Schedule periodic checks
  setInterval(fetchRemoteKB,KB_CHECK_INTERVAL);
}

function fetchRemoteKB(){
  var v=localStorage.getItem(KB_VERSION_KEY)||'0';
  fetch(KB_URL+'?v='+Date.now(),{cache:'no-store'})
    .then(function(r){
      if(!r.ok)throw new Error('HTTP '+r.status);
      return r.json();
    })
    .then(function(data){
      if(!Array.isArray(data)||data.length===0)return;
      var newV=String(data.length)+'_'+data.slice(0,3).map(function(e){return e.t}).join('');
      if(newV!==v||!localStorage.getItem(KB_DATA_KEY)){
        KB=data;
        try{
          localStorage.setItem(KB_DATA_KEY,JSON.stringify(data));
          localStorage.setItem(KB_VERSION_KEY,newV);
          localStorage.setItem(KB_TIME_KEY,new Date().toISOString());
        }catch(e){/* localStorage full */}
        showKBStatus('已更新 ('+KB.length+'条)',true);_searchIdx=null;
      }else{
        showKBStatus('最新 ('+KB.length+'条)',true);
      }
    })
    .catch(function(e){
      if(KB.length===0){
        showKBStatus('离线模式 (无数据)',false);
      }else{
        showKBStatus('离线缓存 ('+KB.length+'条)',true);_searchIdx=null;
      }
    });
}

function showKBStatus(text,ok){
  var tEl=document.getElementById('kbUpdateTime');
  if(tEl){var lt=localStorage.getItem(KB_TIME_KEY);tEl.textContent=lt?new Date(lt).toLocaleString():'--';}
  var el=document.getElementById('kbStatus');
  if(el){el.textContent=text;el.style.color=ok?'#4db8a4':'#ff8f00';}
}

function forceUpdateKB(){
  localStorage.removeItem(KB_VERSION_KEY);
  showKBStatus('更新中...',false);
  fetchRemoteKB();
}

// ========== Models ==========
var MODELS={
groq_llama:{name:'LLaMA 3.1',icon:'🦙',base:'https://api.groq.com/openai/v1/chat/completions',keyField:'groqKey',model:'llama-3.1-8b-instant',think:false},
groq_mixtral:{name:'Mixtral',icon:'🔮',base:'https://api.groq.com/openai/v1/chat/completions',keyField:'groqKey',model:'mixtral-8x7b-32768',think:false},
ds_r1:{name:'DeepSeek-R1',icon:'🧠',base:'https://api.deepseek.com/chat/completions',keyField:'dsKey',model:'deepseek-reasoner',think:true},
ds_v3:{name:'DeepSeek-V3',icon:'⚡',base:'https://api.deepseek.com/chat/completions',keyField:'dsKey',model:'deepseek-chat',think:false},
local:{name:'本地AI',icon:'🏠',base:'http://127.0.0.1:28789/v1/chat/completions',keyField:null,model:'gpt-3.5-turbo',think:false}
};
var curModel=localStorage.getItem('curModel')||'local';

function renderModelBar(){
  var bar=document.getElementById('modelBar');
  bar.innerHTML='';
  for(var k in MODELS){
    var m=MODELS[k];
    var b=document.createElement('button');
    b.textContent=m.icon+' '+m.name;
    b.className=k===curModel?'active':'';
    b.onclick=(function(kk){return function(){curModel=kk;localStorage.setItem('curModel',kk);renderModelBar();}})(k);
    bar.appendChild(b);
  }
}
renderModelBar();

// ========== KB Search ==========
var _searchIdx=null; // inverted index for fast lookup
function buildSearchIdx(){
  _searchIdx={};
  for(var i=0;i<KB.length;i++){
    var e=KB[i];if(!e||!e.kw)continue;
    var terms=[e.t.toLowerCase()].concat(e.kw.map(function(k){return k.toLowerCase();}));
    for(var j=0;j<terms.length;j++){
      var t=terms[j];
      if(!_searchIdx[t])_searchIdx[t]=[];
      if(_searchIdx[t].indexOf(i)<0)_searchIdx[t].push(i);
    }
  }
}
function searchKB(q){
  q=q.toLowerCase().trim();
  if(!_searchIdx)buildSearchIdx();
  var scores={};
  // Index lookup for exact/partial matches
  var keys=Object.keys(_searchIdx);
  for(var k=0;k<keys.length;k++){
    var term=keys[k];
    var w=0;
    if(term===q)w=50;
    else if(term.includes(q))w=10;
    else if(q.includes(term))w=15;
    else{for(var p=1;p<=Math.min(q.length,3);p++){if(term.includes(q.substring(0,p))){w=Math.max(w,1);break;}}}
    if(w>0){
      var idxs=_searchIdx[term];
      for(var j=0;j<idxs.length;j++)scores[idxs[j]]=(scores[idxs[j]]||0)+w;
    }
  }
  // Content match (only for top candidates to save time)
  var best=null,bestScore=0;
  for(var idx in scores){
    var s=scores[idx];
    if(KB[idx].c&&KB[idx].c.toLowerCase().includes(q))s+=3;
    if(s>bestScore){bestScore=s;best=KB[idx];}
  }
  return bestScore>=5?best:null;
}


function findSimilar(q){
  q=q.toLowerCase().trim();
  if(!_searchIdx)buildSearchIdx();
  var scores={};
  var keys=Object.keys(_searchIdx);
  for(var k=0;k<keys.length;k++){
    var term=keys[k],w=0;
    if(term.includes(q)||q.includes(term))w+=10;
    else{for(var p=0;p<q.length;p++){if(term.includes(q[p]))w+=1;}}
    if(w>0){var idxs=_searchIdx[term];for(var j=0;j<idxs.length;j++)scores[idxs[j]]=(scores[idxs[j]]||0)+w;}
  }
  var results=[];
  for(var idx in scores)results.push({t:KB[idx].t,s:scores[idx]});
  results.sort(function(a,b){return b.s-a.s;});
  return results.slice(0,5).map(function(r){return r.t;});
}
// ========== Consultation State Machine ==========
// state: 'init' | 'asking_history' | 'ready'
var consultState='init';
var consultKB=null; // matched KB entry
var consultHistory={}; // drugAllergy, chronicDisease, currentMeds

var HISTORY_QUESTIONS=[
  {field:'drugAllergy',q:'请问您有没有药物过敏史？具体对哪些药物过敏？（如青霉素、磺胺类、阿司匹林等，没有请说"无"）'},
  {field:'chronicDisease',q:'请问您有没有慢性疾病史？如高血压、糖尿病、心脏病、肝肾疾病、哮喘等，没有请说"无"。'},
  {field:'currentMeds',q:'请问您目前有没有在服用其他药物或保健品？请告诉我药名，没有请说"无"。'}
];

var historyIdx=0;

function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

function quickAsk(symptom){
  document.getElementById('inp').value=symptom;
  send();
}

// ========== Chat ==========
var chatArea=document.getElementById('chatArea');

function addMsg(cls,html){
  var d=document.createElement('div');
  d.className='msg '+cls;
  d.innerHTML=html;
  chatArea.appendChild(d);
  chatArea.scrollTop=99999;
  return d;
}

function showWelcome(){
  chatArea.innerHTML='';

async function send(){
  var inp=document.getElementById('inp'),q=inp.value.trim();
  if(!q)return;
  addMsg('user',esc(q));
  inp.value='';

  // Route based on consultation state
  if(consultState==='asking_history'){
    // User is answering history questions
    handleHistoryReply(q);
    return;
  }

  // Normal flow: search KB first
  var kb=searchKB(q);
  if(kb){
    consultKB=kb;
    consultState='asking_history';
    historyIdx=0;
    consultHistory={};
    var intro='<b>📋 初步判断：'+esc(kb.t)+'</b><br><br>'+kb.c+'<br><br><b>🩺 为了给您更精准的建议，请回答几个问题：</b><br>';
    intro+='<div class="section"><div class="section-title">💊 '+esc(HISTORY_QUESTIONS[0].q)+'</div></div>';
    addMsg('ai',intro+'<div style="margin-top:8px"><button onclick="skipHistory()" style="background:var(--pri);color:#fff;border:none;border-radius:8px;padding:6px 16px;font-size:13px;cursor:pointer">⏩ 跳过，直接给建议</button></div><span class="disclaimer">⚠️ AI辅助诊疗仅供参考，不能替代医生诊断</span>');
    return;
  }

  // No KB match - find similar entries
  var suggestions=findSimilar(q);
  var ld=document.createElement('div');
  ld.className='msg loading';
  ld.innerHTML='<div class="spinner"></div>';
  chatArea.appendChild(ld);
  chatArea.scrollTop=99999;

  try{
    await callAI(q);
    chatArea.removeChild(ld);
  }catch(e){
    chatArea.removeChild(ld);
    var errMsg='😅 暂时无法连接AI服务<br><br>📋 知识库暂未收录「'+esc(q)+'」';
    if(suggestions.length>0){
      errMsg+='<br><br>🤔 您是不是想问：<br>';
      suggestions.forEach(function(s){errMsg+='<span class="tag" style="cursor:pointer;margin:2px" onclick="quickAsk(\''+esc(s)+'\')">'+esc(s)+'</span>';});
    }
    errMsg+='<br><br>💡 建议：<br>1. <b>换个说法</b>（如"头痛"而非"太阳穴不舒服"）<br>2. 配置免费 <a href="https://console.groq.com/keys" target="_blank" style="color:var(--pri)">Groq API Key</a><br>3. 在电脑运行OpenClaw可免费用本地AI';
    addMsg('ai',errMsg);
  }
}


function handleHistoryReply(reply){
  var field=HISTORY_QUESTIONS[historyIdx].field;
  consultHistory[field]=reply;
  historyIdx++;
  if(historyIdx<HISTORY_QUESTIONS.length){
    var next='<div class="section"><div class="section-title">💊 '+esc(HISTORY_QUESTIONS[historyIdx].q)+'</div></div>';
    addMsg('ai',next);
  } else {
    // All history collected — generate full response
    generateAdvice();
  }
}


function skipHistory(){
  consultHistory={drugAllergy:'未提供',chronicDisease:'未提供',currentMeds:'未提供'};

  generateAdvice();
}

// ========== Typewriter Effect ==========
function formatMD(text){
  return text.replace(/\*\*(.*?)\*\*/g,'<b>$1</b>')
    .replace(/^### (.+)$/gm,'<h4 style="margin:8px 0 4px;color:var(--pri)">$1</h4>')
    .replace(/^## (.+)$/gm,'<h3 style="margin:10px 0 4px;color:var(--pri-d)">$1</h3>')
    .replace(/^# (.+)$/gm,'<h2 style="margin:10px 0 4px;color:var(--pri-d)">$1</h2>')
    .replace(/^[-*] /gm,'• ')
    .replace(/\n/g,'<br>');
}
function typewriter(msgDiv, fullText, prefixHTML){
  return new Promise(function(resolve){
    msgDiv.innerHTML = prefixHTML + '<span id="tw-text"></span><span id="tw-cursor" class="tw-cursor"></span>';
    var i = 0;
    var speed = 22;
    var textEl = document.getElementById('tw-text');
    function tick(){
      if(i < fullText.length){
        if(textEl){
          // Plain text append during typing, format at end
          textEl.textContent = fullText.substring(0, i+1);
          i++;
          chatArea.scrollTop = 99999;
          setTimeout(tick, speed);
        } else {
          msgDiv.innerHTML = prefixHTML + '<span>' + formatMD(fullText) + '</span>';
          resolve();
        }
      } else {
        // Done - final formatted render
        var cursor = document.getElementById('tw-cursor');
        if(cursor) cursor.remove();
        var te = document.getElementById('tw-text');
        if(te) te.innerHTML = formatMD(fullText);
        resolve();
      }
    }
    tick();
  });
}

// Shared AI fetch helper
async function _fetchAI(sysPrompt, userMsg){
  var cfg=MODELS[curModel];
  var key=cfg.keyField?localStorage.getItem(cfg.keyField):null;
  if(!key)key=document.getElementById(cfg.keyField).value||null;
  var headers={'Content-Type':'application/json'};
  if(key)headers['Authorization']='Bearer '+key;
  var body=JSON.stringify({model:cfg.model,messages:[{role:'system',content:sysPrompt},{role:'user',content:userMsg}],stream:true});
  var resp=await Promise.race([fetch(cfg.base,{method:'POST',headers:headers,body:body}),new Promise(function(_,rej){setTimeout(function(){rej(new Error('请求超时(15s)'));},15000);})]);
  if(!resp.ok){
    try{await resp.text();}catch(e){}
    if(resp.status===401)throw new Error('API Key无效，请检查设置');
    if(resp.status===402)throw new Error('API余额不足');
    if(resp.status===429)throw new Error('请求过于频繁，请稍后重试');
    throw new Error('HTTP '+resp.status);
  }
  var reader=resp.body.getReader(),decoder=new TextDecoder(),full='',thinking='';
  while(true){
    var result=await reader.read();
    if(result.done)break;
    var chunk=decoder.decode(result.value,{stream:true});
    var lines=chunk.split('\n');
    for(var i=0;i<lines.length;i++){
      var line=lines[i];
      if(!line.startsWith('data: '))continue;
      var data=line.slice(6).trim();
      if(data==='[DONE]')continue;
      try{var json=JSON.parse(data);var delta=json.choices&&json.choices[0]&&json.choices[0].delta;if(!delta)continue;if(cfg.think&&delta.reasoning_content){thinking+=delta.reasoning_content;continue;}if(delta.content)full+=delta.content;}catch(e){}
    }
  }
  return {full:full,thinking:thinking,cfg:cfg};
}

// Chat AI call (for direct Q&A)
async function callAI(q){
  var msgDiv=addMsg('ai','');
  var dotInterval=null;
  var cfg=MODELS[curModel];
  if(cfg.think){
    msgDiv.innerHTML='<div id="ti" style="color:#999;font-size:13px;padding:8px">🧠 思考中</div>';
    var dc=0;
    dotInterval=setInterval(function(){dc=(dc+1)%4;var d='';for(var i=0;i<dc;i++)d+='.';var t=document.getElementById('ti');if(t)t.textContent='🧠 思考中'+d;},500);
  }
  var r=await _fetchAI('你是岐黄智医，一个专业的AI中西医结合健康助手。回答要求：1)简洁易懂 2)结合中西医双重视角 3)给出饮食和生活建议 4)提醒严重情况需就医 5)不要过度诊断',q);
  if(dotInterval)clearInterval(dotInterval);
  var ti=document.getElementById('ti');if(ti)ti.remove();
  var html='';
  if(r.thinking)html='<details style="margin-bottom:8px"><summary style="cursor:pointer;color:#999;font-size:13px">🧠 思考过程</summary><div style="padding:8px;background:#f5f5f5;border-radius:8px;font-size:13px;color:#666;margin-top:4px">'+esc(r.thinking)+'</div></details>';
  await typewriter(msgDiv, r.full, html);
  var disc=document.createElement('span');disc.className='disclaimer';disc.textContent='⚠️ AI生成内容仅供参考，如有不适请及时就医';msgDiv.appendChild(disc);
}

// Structured AI call (for consultation advice)
async function callAI_Once(prompt, msgDiv){
  var dotInterval=null;
  var cfg=MODELS[curModel];
  if(msgDiv){
    if(cfg.think){
      msgDiv.innerHTML='<div id="ti2" style="color:#999;font-size:13px;padding:8px">🧠 正在辨证分析中</div>';
      var dc=0;
      dotInterval=setInterval(function(){dc=(dc+1)%4;var d='';for(var j=0;j<dc;j++)d+='.';var t=document.getElementById('ti2');if(t)t.textContent='🧠 正在辨证分析中'+d;},500);
    }else{
      msgDiv.innerHTML='<div style="color:#999;font-size:13px;padding:8px">⏳ 正在生成个性化方案...</div>';
    }
  }
  var r=await _fetchAI('你是岐黄智医，中西医结合健康助手。回答时分两大部分：【食疗方案】和【用药建议】，简洁分点，600字以内。',prompt);
  if(dotInterval)clearInterval(dotInterval);
  var ti2=document.getElementById('ti2');if(ti2)ti2.remove();
  var html='';
  if(r.thinking)html='<details style="margin-bottom:8px"><summary style="cursor:pointer;color:#999;font-size:13px">🧠 辨证思考过程</summary><div style="padding:8px;background:#f5f5f5;border-radius:8px;font-size:13px;color:#666;margin-top:4px">'+esc(r.thinking)+'</div></details>';
  // Format: convert markdown bold + newlines AFTER typewriter finishes (via post-process)
  if(msgDiv){
    await typewriter(msgDiv, r.full, html);

    return null;
  }
  return html+r.full.replace(/\*\*(.*?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
}

function startQuiz(){
  quizStarted=true;quizAns=[];
  renderQ();
}

function renderQ(){
  var wrap=document.getElementById('quizWrap');
  var qi=quizAns.length;
  if(qi>=QS.length){showResult();return;}
  var pct=Math.round(qi/QS.length*100);
  wrap.innerHTML='<div class="prog-bar"><div class="fill" style="width:'+pct+'%"></div></div><div class="quiz-card"><h3>第 '+(qi+1)+' / '+QS.length+' 题</h3><p style="font-size:16px;margin-bottom:16px">'+QS[qi]+'</p><div class="opts"><div class="opt" onclick="ans(1)">是</div><div class="opt" onclick="ans(0.5)">有时</div><div class="opt" onclick="ans(0)">否</div></div></div>';
}

function ans(v){
  quizAns.push(v);
  renderQ();
}

function showResult(){
  var scores=CST.map(function(){return 0;});
  var map=[[0],[1],[2],[3],[4],[5],[6],[7],[8,0],[0],[2],[3],[4],[5],[6],[7],[8],[8]];
  for(var i=0;i<quizAns.length;i++){
    var idx=map[i];
    for(var j=0;j<idx.length;j++){
      if(idx[j]<9)scores[idx[j]]+=quizAns[i];
    }
  }
  var maxI=0;for(var i=1;i<9;i++){if(scores[i]>scores[maxI])maxI=i;}
  var c=CST[maxI],info=CI[c];
  document.getElementById('quizWrap').innerHTML='<div class="result-card"><h2>🎯 您的体质：'+c+'质</h2><div class="rsec"><h4>常见表现</h4><p>'+info.s+'</p></div><div class="rsec"><h4>体质特征</h4><p>'+info.t+'</p></div><div class="rsec"><h4>调理建议</h4><p>'+info.l+'</p></div><div class="rsec"><h4>推荐饮食</h4><p>'+info.d+'</p></div><button onclick="quizStarted=false;quizAns=[];startQuiz()" style="margin-top:16px;background:var(--pri);color:#fff;border:none;border-radius:12px;padding:10px 24px;font-size:14px;cursor:pointer">🔄 重新测试</button></div>';
}
