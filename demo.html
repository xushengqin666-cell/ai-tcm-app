            chatHistory.push({ role: 'user', content: message });
            input.value = '';
            showTyping();
            setTimeout(() => {
                hideTyping();
                const response = generateResponse(message);
                addMessage(response, false);
                chatHistory.push({ role: 'ai', content: message });
            }, 800 + Math.random() * 700);
        }

        function generateResponse(message) {
            const msg = message.toLowerCase();
            if (currentMode === 'consultation') return generateConsultationResponse(msg, message);
            else if (currentMode === 'tcm') return generateTCMResponse(msg, message);
            else if (currentMode === 'diet') return generateDietResponse(msg, message);
            else if (currentMode === 'knowledge') return generateKnowledgeResponse(msg, message);
        }

        // ===== 生成追问按钮 =====
        function getFollowUpHTML(conditionKey) {
            const related = relatedConditions[conditionKey];
            if (!related || related.length === 0) return '';
            const btns = related.map(r => `<button class="follow-btn" onclick="sendQuickInput('${r}怎么办')">${r}</button>`).join('');
            return `<div class="follow-up"><span style="color:rgba(255,255,255,0.5);font-size:12px;">相关：</span>${btns}</div>`;
        }

        function generateConsultationResponse(msg, originalMsg) {
            // 先检查紧急症状
            const emergency = checkEmergency(originalMsg);
            if (emergency) {
                return `
                    <div class="emergency-box">
                        <h4>🚨 紧急提醒：检测到"${emergency}"</h4>
                        <p style="font-size:16px;margin:10px 0;">这可能是危及生命的紧急情况！请立即：</p>
                        <ul style="font-size:15px;">
                            <li><strong>拨打120急救电话</strong></li>
                            <li>保持冷静，不要自行驾车</li>
                            <li>如有人陪伴，请告知其您的症状</li>
                            <li>不要随意服药或进食</li>
                        </ul>
                    </div>
                    <div class="warning-box"><h4>⚠️ 重要提示</h4><p>紧急情况请优先就医！以下分析仅供参考，不能替代急诊处理。</p></div>
                    <p style="color:rgba(255,255,255,0.6);margin-top:10px;">如情况稳定后需要进一步了解，请告诉我具体症状。</p>
                `;
            }

            const result = findCondition(msg, originalMsg);
            if (result) {
                lastTopic = result.key;
                const found = result.data;
                return `
                    <p>根据您描述的"${originalMsg}"，我为您进行以下分析：</p>
                    <div class="medical-section">
                        <h4>🩺 西医分析</h4>
                        <p><strong>可能原因：</strong>${found.西医.possibleCauses.join('、')}</p>
                        <p><strong>建议检查：</strong>${found.西医.tests.join('、')}</p>
                        <div class="warning-box"><h4>⚠️ 警示提醒</h4><p>${found.西医.warnings.join('；')}</p></div>
                        <p><strong>一般处理：</strong>${found.西医.treatment.join('、')}</p>
                    </div>
                    <div class="medical-section tcm-diagnosis">
                        <h4>🌿 中医辨证</h4>
                        <p><strong>中医证型：</strong>${found.中医.pattern}</p>
                        <p><strong>中医分析：</strong>${found.中医.tcmAnalysis}</p>
                        <p><strong>中药调理：</strong></p>
                        <ul>${Object.entries(found.中医.herbs).map(([type, formula]) => `<li><strong>${type}：</strong>${formula}</li>`).join('')}</ul>
                    </div>
                    <div class="medical-section"><h4>💉 穴位调理</h4><p>推荐艾灸/按摩穴位：${found.中医.acupuncture.join('、')}</p></div>
                    <div class="medical-section"><h4>🍎 生活方式建议</h4><ul>${found.中医.lifestyle.map(item => `<li>${item}</li>`).join('')}</ul></div>
                    <p style="margin-top:15px;color:rgba(255,255,255,0.6)">以上建议仅供参考，具体用药请咨询专业医师。</p>
                    ${getFollowUpHTML(result.key)}
                `;
            }
            return `
                <p>感谢您的咨询！为了给您更准确的健康建议，请您详细描述：</p>
                <div class="medical-section">
                    <h4>📝 请补充以下信息</h4>
                    <ul>
                        <li>症状持续多长时间了？</li>
                        <li>具体是哪个部位不舒服？</li>
                        <li>有什么诱因吗（如劳累、情绪、饮食）？</li>
                        <li>伴随其他症状吗（如发热、呕吐、头晕等）？</li>
                        <li>之前有过类似情况吗？</li>
                    </ul>
                </div>
                <div class="medical-section">
                    <h4>💡 我可以帮您分析的健康问题</h4>
                    <p>呼吸系统：感冒、咳嗽、咽喉痛、鼻炎、哮喘、肺炎</p>
                    <p>心血管：胸闷、心悸、高血压、低血压</p>
                    <p>消化系统：肠胃不适、便秘、腹泻、消化不良、肝病、胆囊</p>
                    <p>骨骼肌肉：颈椎病、腰椎病、肩周炎、关节痛、扭伤、腱鞘炎、痛风</p>
                    <p>神经系统：头痛、头晕、失眠、焦虑、抑郁、面瘫、手脚麻木</p>
                    <p>皮肤：湿疹、荨麻疹、痤疮、脱发</p>
                    <p>内分泌：糖尿病、甲状腺、贫血、疲劳</p>
                    <p>泌尿：尿路感染、肾结石</p>
                    <p>妇科：痛经、月经不调</p>
                    <p>五官：眼疲劳、耳鸣、口腔溃疡</p>
                </div>
                <p style="margin-top:15px;color:rgba(255,255,255,0.6)">请描述您的具体症状，我会为您详细分析。</p>
            `;
        }

        function generateTCMResponse(msg, originalMsg) {
            for (const type in constitutionDetails) {
                if (msg.includes(type) || originalMsg.includes(type)) {
                    const detail = constitutionDetails[type];
                    return `
                        <p>您询问的是<strong>${type}质</strong>，以下是详细调理方案：</p>
                        <div class="medical-section">
                            <h4>🔍 体质特征</h4>
                            <ul>${detail.symptoms.map(s => `<li>${s}</li>`).join('')}</ul>
                            <p><strong>舌象：</strong>${detail.tongue}</p>
                            <p><strong>脉象：</strong>${detail.pulse}</p>
                        </div>
                        <div class="medical-section"><h4>🍎 饮食建议</h4><p><strong>宜食：</strong>${detail.diet.join('、')}</p><p><strong>忌食：</strong>${detail.avoid.join('、')}</p></div>
                        <div class="medical-section tcm-diagnosis"><h4>💉 穴位调理</h4><p>推荐艾灸/按摩：${detail.acupoints.join('、')}</p></div>
                        <div class="medical-section"><h4>🏃 生活方式</h4><ul>${detail.lifestyle.map(s => `<li>${s}</li>`).join('')}</ul></div>
                    `;
                }
            }
            return `
                <p>好的，我来帮您进行中医体质辨识！</p>
                <p>请根据您过去一年的真实感受，回答以下问题（1=完全不符合，2=不太符合，3=一般，4=比较符合，5=完全符合）：</p>
                <div class="medical-section">
                    <h4>📋 体质辨识问卷</h4>
                    <p>共18道题，涵盖9种体质类型。请依次回答：</p>
                    ${tcmQuestions.slice(0, 5).map((q, i) => `<p><strong>${i+1}. ${q.question}</strong></p><p style="color:rgba(255,255,255,0.6)">请回复数字1-5</p>`).join('')}
                </div>
                <p style="color:rgba(255,255,255,0.6)">回复"跳过"可直接查看九种体质概述</p>
            `;
        }

        function generateDietResponse(msg, originalMsg) {
            // 先查别名
            let matchedKey = null;
            for (const alias in dietAliases) {
                if (msg.includes(alias) || originalMsg.includes(alias)) {
                    matchedKey = dietAliases[alias];
                    break;
                }
            }
            // 再查直接匹配
            if (!matchedKey) {
                for (const key in dietPlans) {
                    if (msg.includes(key) || originalMsg.includes(key)) {
                        matchedKey = key;
                        break;
                    }
                }
            }

            if (matchedKey && dietPlans[matchedKey]) {
                const plan = dietPlans[matchedKey];
                return `
                    <p>针对"${originalMsg}"，为您定制饮食方案：</p>
                    <div class="medical-section">
                        <h4>🍳 推荐食谱</h4>
                        <p><strong>早餐：</strong>${plan.breakfast}</p>
                        <p><strong>午餐：</strong>${plan.lunch}</p>
                        <p><strong>晚餐：</strong>${plan.dinner}</p>
                    </div>
                    <div class="medical-section"><h4>✅ 宜食</h4><p>${plan.foods.join('、')}</p></div>
                    <div class="medical-section"><h4>❌ 忌食</h4><p>${plan.avoid.join('、')}</p></div>
                    <div class="warning-box"><h4>⚠️ 温馨提示</h4><p>饮食调理是辅助手段，如有高血压、糖尿病等慢性病，请遵医嘱用药，定期监测相关指标。</p></div>
                `;
            }
            return `
                <p>请告诉我您想调理哪方面的健康问题？</p>
                <div class="medical-section">
                    <h4>🍎 可选择的主题</h4>
                    <ul>
                        <li>湿气重如何饮食</li><li>失眠如何饮食调理</li><li>养胃食谱推荐</li>
                        <li>降血压饮食建议</li><li>减肥食谱</li><li>补气血吃什么</li>
                        <li>痛风饮食</li><li>糖尿病饮食</li><li>护肝饮食</li>
                        <li>健骨补钙食谱</li><li>护眼饮食</li><li>祛痘饮食</li>
                    </ul>
                </div>
            `;
        }

        function generateKnowledgeResponse(msg, originalMsg) {
            // 先查别名
            let matchedKey = null;
            for (const alias in knowledgeAliases) {
                if (msg.includes(alias) || originalMsg.includes(alias)) {
                    matchedKey = knowledgeAliases[alias];
                    break;
                }
            }
            // 再查直接匹配
            if (!matchedKey) {
                for (const key in knowledgeBase) {
                    if (msg.includes(key) || originalMsg.includes(key)) {
                        matchedKey = key;
                        break;
                    }
                }
            }

            if (matchedKey && knowledgeBase[matchedKey]) {
                return `<p>${knowledgeBase[matchedKey].content}</p>`;
            }
            return `
                <p>请告诉我您想了解哪方面的健康知识？</p>
                <div class="medical-section">
                    <h4>📚 可选择的主题</h4>
                    <ul>
                        <li>什么是亚健康</li><li>如何提高免疫力</li><li>体检主要看什么</li>
                        <li>中医养生原则</li><li>四季养生指南</li><li>中医食疗常识</li>
                        <li>经络穴位保健</li><li>中药煎服常识</li><li>情志养生方法</li>
                        <li>运动养生建议</li><li>睡眠卫生知识</li><li>女性健康指南</li>
                    </ul>
                </div>
            `;
        }

        updateQuickInputs();
        document.getElementById('userInput').focus();
    </script>
</body>
</html>
