<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>岐黄智医 — AI中西医结合健康助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--pri:#2e7d6b;--pri-l:#4db8a4;--pri-d:#1b5e50;--acc:#ff8f00;--bg:#f0f7f4;--card:#fff;--txt:#2c3e3a;--txt2:#6b7c78;--sh:0 2px 12px rgba(46,125,107,.1);--r:16px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--txt);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.hd{background:linear-gradient(135deg,var(--pri-d),var(--pri));color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(21,101,192,.3);z-index:10}
.hd .logo{font-size:22px;font-weight:700;letter-spacing:1px}
.hd .logo span{font-size:13px;font-weight:400;opacity:.85;margin-left:8px}
.hd .spacer{flex:1}
.hd .gear{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;opacity:.8;transition:.2s}
.hd .gear:hover{opacity:1;transform:rotate(30deg)}
.tabs{display:flex;background:#fff;border-bottom:1px solid #e0e0e0}
.tabs button{flex:1;padding:10px;border:none;background:none;font-size:14px;font-weight:600;color:var(--txt2);cursor:pointer;border-bottom:3px solid transparent;transition:.2s}
.tabs button.active{color:var(--pri);border-bottom-color:var(--pri)}
.tabs button:hover{background:#f0f4ff}
.panel{display:none;flex:1;overflow-y:auto;padding:16px}
.panel.active{display:flex;flex-direction:column}
.chat-area{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:12px 16px;border-radius:var(--r);line-height:1.7;font-size:15px;animation:fadeUp .3s ease;word-break:break-word}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--pri),var(--pri-l));color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:#fff;border:1px solid #e8eaf6;box-shadow:var(--sh);border-bottom-left-radius:4px}
.msg.ai b{color:var(--pri)}
.msg.ai .tag{display:inline-block;background:#e3f2fd;color:var(--pri);padding:2px 8px;border-radius:8px;font-size:12px;font-weight:600;margin:2px 4px 2px 0}
.msg.ai .section{margin:10px 0;padding:10px;background:#f8f9ff;border-radius:10px}
.msg.ai .section-title{font-weight:700;color:var(--pri-d);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.msg.ai .section p{margin:4px 0 4px 28px;font-size:14px;color:#444}
.msg .disclaimer{display:block;margin-top:10px;font-size:12px;color:#999;border-top:1px dashed #e0e0e0;padding-top:8px}
.msg.loading{align-self:flex-start;background:#fff;border:1px solid #e8eaf6;box-shadow:var(--sh);padding:16px 20px}
.spinner{width:28px;height:28px;border:3px solid #e0e0e0;border-top-color:var(--pri);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.input-bar{display:flex;gap:8px;padding:12px 16px;background:#fff;border-top:1px solid #e0e0e0}
.input-bar input{flex:1;border:2px solid #e0e0e0;border-radius:24px;padding:10px 18px;font-size:15px;outline:none;transition:.2s}
.input-bar input:focus{border-color:var(--pri-l)}
.input-bar button{background:linear-gradient(135deg,var(--pri),var(--pri-l));color:#fff;border:none;border-radius:24px;padding:10px 20px;font-size:15px;font-weight:600;cursor:pointer;transition:.2s}
.input-bar button:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(21,101,192,.3)}
.model-bar{display:flex;gap:6px;padding:8px 16px;background:#fff;overflow-x:auto;border-bottom:1px solid #f0f0f0}
.model-bar button{padding:5px 12px;border-radius:20px;border:1px solid #e0e0e0;background:#fff;font-size:12px;cursor:pointer;white-space:nowrap;transition:.2s}
.model-bar button.active{background:var(--pri);color:#fff;border-color:var(--pri)}
.model-bar button:hover{border-color:var(--pri-l)}
.quiz-wrap{max-width:500px;margin:0 auto;width:100%}
.quiz-card{background:#fff;border-radius:var(--r);padding:24px;box-shadow:var(--sh);margin-bottom:16px}
.quiz-card h3{font-size:17px;margin-bottom:16px;color:var(--pri-d)}
.quiz-card .opts{display:flex;flex-direction:column;gap:10px}
.quiz-card .opt{padding:12px 16px;border:2px solid #e0e0e0;border-radius:12px;cursor:pointer;transition:.2s;font-size:15px}
.quiz-card .opt:hover{border-color:var(--pri-l);background:#f0f4ff}
.quiz-card .opt.sel{border-color:var(--pri);background:#e3f2fd;font-weight:600}
.prog-bar{height:6px;background:#e0e0e0;border-radius:3px;margin-bottom:16px;overflow:hidden}
.prog-bar .fill{height:100%;background:linear-gradient(90deg,var(--pri),var(--pri-l));border-radius:3px;transition:width .4s ease}
.result-card{background:linear-gradient(135deg,#e3f2fd,#f3e5f5);border-radius:var(--r);padding:24px;box-shadow:var(--sh)}
.result-card h2{color:var(--pri-d);margin-bottom:12px}
.result-card .rsec{margin-bottom:12px}
.result-card .rsec h4{color:var(--pri);margin-bottom:4px}
.settings-wrap{max-width:500px;margin:0 auto;width:100%}
.s-card{background:#fff;border-radius:var(--r);padding:20px;box-shadow:var(--sh);margin-bottom:12px}
.s-card h3{font-size:15px;color:var(--pri-d);margin-bottom:12px}
.s-card label{display:block;font-size:13px;color:var(--txt2);margin-bottom:4px}
.s-card input{width:100%;border:2px solid #e0e0e0;border-radius:10px;padding:8px 12px;font-size:14px;outline:none;margin-bottom:12px;transition:.2s}
.s-card input:focus{border-color:var(--pri-l)}
.s-card .hint{font-size:12px;color:#999;margin-top:-8px;margin-bottom:12px}
.s-card button{background:var(--pri);color:#fff;border:none;border-radius:10px;padding:8px 20px;font-size:14px;cursor:pointer;transition:.2s}
.s-card button:hover{background:var(--pri-d)}
.quick-btns{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;background:#fff;border-top:1px solid #f0f0f0}
.quick-btns button{padding:6px 14px;border:1px solid #e0e0e0;border-radius:20px;background:#fff;font-size:13px;cursor:pointer;transition:.2s;color:var(--txt)}
.quick-btns button:hover{border-color:var(--pri-l);background:#e3f2fd;color:var(--pri)}

@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.tw-cursor{display:inline-block;width:2px;height:1em;background:#2e7d6b;margin-left:2px;animation:blink 1s infinite;vertical-align:text-bottom}
</style>
<script>window.addEventListener('error',function(e){var c=document.getElementById('chatArea');if(c)c.innerHTML+='<div class="msg ai" style="background:#fff3f3"><b>! </b>'+e.message+'</div>';});window.addEventListener('unhandledrejection',function(e){var c=document.getElementById('chatArea');if(c)c.innerHTML+='<div class="msg ai" style="background:#fff3f3"><b>! async:</b>'+e.reason+'</div>';});</script></head>
<body>
<div class="hd">
  <div class="logo">🏥 岐黄智医<span>AI中西医结合健康助手</span></div>
  <div class="spacer"></div>
  <button class="gear" onclick="showPanel('settings')">⚙️</button>
</div>
<div class="tabs">
  <button id="t-chat" class="active" onclick="showPanel('chat')">💬 智能问诊</button>
  <button id="t-quiz" onclick="showPanel('quiz')">🔄 体质辨识</button>
  <button id="t-settings" onclick="showPanel('settings')">⚙️ 设置</button>
</div>
<div class="model-bar" id="modelBar"></div>

<!-- Chat Panel -->
<div class="panel active" id="p-chat">
  <div class="chat-area" id="chatArea"></div>
  <div class="quick-btns" id="quickBtns">
    <button onclick="quickAsk('头痛')">头痛</button>
    <button onclick="quickAsk('胃痛')">胃痛</button>
    <button onclick="quickAsk('失眠')">失眠</button>
    <button onclick="quickAsk('咳嗽')">咳嗽</button>
    <button onclick="quickAsk('感冒')">感冒</button>
    <button onclick="quickAsk('便秘')">便秘</button>
    <button onclick="quickAsk('痛经')">痛经</button>
    <button onclick="quickAsk('高血压')">高血压</button>
    <button onclick="quickAsk('糖尿病')">糖尿病</button>
    <button onclick="quickAsk('痛风')">痛风</button>
  </div>
  <div class="input-bar">
    <input id="inp" placeholder="描述您的症状或健康问题…" onkeypress="if(event.key==='Enter')send()">
    <button onclick="send()">发送</button>
  </div>
</div>

<!-- Quiz Panel -->
<div class="panel" id="p-quiz">
  <div class="quiz-wrap" id="quizWrap"></div>
</div>

<!-- Settings Panel -->
<div class="panel" id="p-settings">
  <div class="settings-wrap">
    <div class="s-card">
      <h3>🔑 API Key 配置</h3>
      <label>Groq API Key（免费，速度快）</label>
      <input id="groqKey" type="password" placeholder="gsk_…">
      <div class="hint">申请：<a href="https://console.groq.com/keys" target="_blank">console.groq.com</a>（完全免费，无需信用卡）</div>
      <label>DeepSeek API Key</label>
      <input id="dsKey" type="password" placeholder="sk-…">
      <div class="hint">申请：<a href="https://platform.deepseek.com/api_keys" target="_blank">platform.deepseek.com</a></div>
      <button onclick="saveKeys()">💾 保存</button>
    </div>
    <div class="s-card">
      <h3>ℹ️ 使用说明</h3>
      <p style="font-size:14px;line-height:1.8;color:#5f6368">
        <b>推荐配置：</b>申请免费 <a href="https://console.groq.com/keys" target="_blank" style="color:var(--pri)">Groq API Key</a>，响应快、无需付费。<br>
        <b>无需配置：</b>本机运行 OpenClaw 时自动连接本地AI。<br>
        <b>问诊流程：</b>输入症状 → AI辨证问诊 → 个性化食疗+用药方案。<br>
        <b>体质辨识：</b>18道题测出您的中医体质类型。
      </p>
    </div>
  </div>
</div>

<script>
// ========== Expanded Knowledge Base (50+ entries) ==========
var KB=[
{kw:["感冒","风寒","风热","流鼻涕","打喷嚏","鼻塞","伤风","着凉","受凉"],t:"感冒",c:"<span class='tag'>西医</span>上呼吸道病毒（鼻病毒/冠状病毒）感染，传染性强。<br><span class='tag'>中医</span>外感六淫：风寒（恶寒重、发热轻、无汗、舌淡苔白）和风热（发热重、恶寒轻、咽喉肿痛、舌红苔黄）。",d:"风寒：生姜红糖水、葱白粥、紫苏茶<br>风热：菊花茶、薄荷水、梨汁、绿豆汤<br>多喝温水，清淡饮食",m:"布洛芬或对乙酰氨基酚（退热止痛）<br>风寒：感冒清热颗粒、正柴胡饮<br>风热：银翘解毒片、板蓝根冲剂、连花清瘟"},
{kw:["发烧","发热","体温高","高烧","低烧","体温升高"],t:"发烧",c:"<span class='tag'>西医</span>体温调节中枢上移，常见于感染（病毒/细菌）、炎症。<br><span class='tag'>中医</span>正邪交争。外感发热（风寒/风热/暑湿）和内伤发热（阴虚/气虚/血瘀）。",d:"多饮温水、稀粥、绿豆汤<br>西瓜汁（清热）<br>忌辛辣油腻<br>补充电解质",m:"体温>38.5℃：布洛芬、对乙酰氨基酚<br>细菌感染（验血确认）：抗生素<br>中医：柴胡注射液、小柴胡汤（少阳）、白虎汤（高热）"},
{kw:["头痛","头疼","偏头痛","头胀","头晕","太阳穴疼"],t:"头痛",c:"<span class='tag'>西医</span>紧张性头痛（最多见，压痛+束带感）、偏头痛（单侧搏动样，伴恶心畏光）。<br><span class='tag'>中医</span>分外感（风寒/风热）和内伤（肝阳上亢、血虚、瘀血、肾虚）。",d:"天麻炖鱼头、菊花茶、芹菜粥<br>避免巧克力、红酒、奶酪、味精<br>规律作息",m:"布洛芬、对乙酰氨基酚（紧张性）<br>偏头痛：曲普坦类（处方）<br>中医：川芎茶调散（风袭）、天麻钩藤饮（肝阳）、正天丸"},
{kw:["失眠","睡不着","入睡困难","多梦","早醒","睡眠不好","睡不好"],t:"失眠",c:"<span class='tag'>西医</span>入睡困难、睡眠维持障碍或早醒，每周≥3次，持续≥1个月为慢性失眠。<br><span class='tag'>中医</span>不寐，心神失养或邪扰心神。常见：心脾两虚（多梦易醒）、肝火扰心（急躁易怒）、心肾不交（心烦耳鸣）。",d:"酸枣仁粥、百合莲子汤、桂圆红枣茶、温牛奶<br>睡前1小时避免手机电脑<br>忌咖啡、浓茶、酒精",m:"短期：褪黑素（调节生物钟）<br>焦虑：艾司唑仑（遵医嘱，≤2周）<br>中医：酸枣仁汤（心肝血虚）、天王补心丹（心肾阴虚）、归脾丸（心脾两虚）、龙胆泻肝汤（肝火）"},
{kw:["胃痛","胃疼","胃胀","反酸","烧心","胃炎","胃溃疡","胃不适","肚子疼"],t:"胃痛",c:"<span class='tag'>西医</span>急慢性胃炎（Hp感染、NSAIDs）、胃溃疡（周期性餐后痛）、功能性消化不良。<br><span class='tag'>中医</span>胃脘痛，分寒凝（喜温喜按）、食积（胀满嗳腐）、肝气犯胃（胁痛随情绪）、脾胃虚寒（隐痛喜温）、湿热中阻（烧心口苦）。",d:"小米粥、山药粥、南瓜、面条<br>少量多餐（每顿七分饱）<br>忌生冷、辛辣、浓茶、咖啡、酒精",m:"反酸：奥美拉唑、铝碳酸镁（保护胃黏膜）<br>杀菌：四联疗法（PPI+铋剂+两种抗生素，遵医嘱）<br>中医：香砂六君子汤（脾胃虚弱）、黄芪建中汤（虚寒）、三九胃泰（湿热）"},
{kw:["腹泻","拉肚子","拉稀","大便稀","水样便","急性胃肠炎","肠胃炎"],t:"腹泻",c:"<span class='tag'>西医</span>急性（<2周）：感染性（病毒60%如诺如/轮状，细菌如沙门氏菌）或非感染性；慢性（>4周）需排查IBS、IBD。<br><span class='tag'>中医</span>泄泻，分寒湿（大便清稀）、湿热（臭秽肛门灼热）、食积（臭如败卵）、脾虚（餐后即泻）、肾虚（五更泄）。",d:"米粥、面汤、苹果煮水（收敛）、蒸山药<br>补充口服补液盐（防脱水）<br>忌油腻、生冷、乳制品、高纤维",m:"蒙脱石散（物理止泻，急性首选）<br>口服补液盐III<br>细菌性（血便+发热）：诺氟沙星（遵医嘱）<br>中医：藿香正气水（寒湿）、葛根芩连汤（湿热）、参苓白术散（脾虚）"},
{kw:["便秘","大便干","排便困难","几天没拉","排便费劲","大便困难"],t:"便秘",c:"<span class='tag'>西医</span>排便频率<3次/周或排便困难，分慢传输型（结肠动力弱）、排便障碍型（盆底肌失调）、混合型。<br><span class='tag'>中医</span>分热秘（面红口干）、气秘（腹胀嗳气）、虚秘（气虚无力）、冷秘（手足冷、腰酸）。",d:"燕麦、红薯、玉米、芹菜、菠菜、火龙果、猕猴桃、蜂蜜水<br>晨起空腹喝温开水<br>每天饮水≥1.5L",m:"乳果糖（渗透性，安全，适合老人孕妇）<br>聚乙二醇（渗透性）<br>开塞露（临时，急症）<br>中医：麻子仁丸（热秘）、黄芪汤（气虚）、济川煎（冷秘）"},
{kw:["咳嗽","干咳","痰多","久咳","咳痰","咳嗽有痰","嗓子痒"],t:"咳嗽",c:"<span class='tag'>西医</span>急性<3周（感冒后最常见）、亚急性3-8周（感染后）、慢性>8周（哮喘/胃食管反流/鼻后滴漏/慢支）。<br><span class='tag'>中医</span>分外感（风寒—痰白稀、风热—痰黄稠、燥咳—干咳无痰）和内伤（痰湿—痰多白黏、肝火—胸胁胀痛、阴虚—干咳少痰）。",d:"风寒：生姜陈皮水、烤橘子<br>风热：梨汁、枇杷、川贝冰糖雪梨<br>燥咳：蜂蜜梨水、银耳百合汤<br>多喝温水，忌甜腻",m:"干咳：右美沙芬<br>有痰：氨溴索、乙酰半胱氨酸（化痰）<br>气喘：孟鲁司特（过敏性咳嗽）<br>中医：止嗽散（初咳）、二陈汤（痰湿）、桑菊饮（风热）、川贝枇杷膏（热咳）"},
{kw:["过敏","荨麻疹","皮疹","瘙痒","皮肤痒","过敏体质","湿疹","皮肤过敏"],t:"过敏",c:"<span class='tag'>西医</span>免疫系统过度反应。常见：过敏性鼻炎（IgE介导）、荨麻疹（风团瘙痒）、湿疹（红斑渗出）。<br><span class='tag'>中医</span>风瘙痒、血风疮。禀赋不耐，风邪客表；或血虚生风、脾胃湿热。",d:"清淡饮食，忌海鲜、牛羊肉、辛辣发物<br>薏米赤小豆汤（清热利湿）<br>避免已知过敏原<br>穿纯棉衣物",m:"氯雷他定、西替利嗪（抗组胺，起效快）<br>炉甘石洗剂（止痒，外用）<br>严重（喉头水肿/呼吸困难）：肾上腺素笔（处方）<br>中医：消风散（风热）、防风通圣丸（湿热）、当归饮子（血虚）"},
{kw:["颈椎","脖子痛","颈肩痛","落枕","颈痛","颈部不适","肩颈酸痛"],t:"颈椎不适",c:"<span class='tag'>西医</span>颈型颈椎病最常见（颈部肌肉劳损），神经根型（手臂麻痛），椎动脉型（头晕）。<br><span class='tag'>中医</span>项痹，经络不通、气血瘀滞、风寒湿侵袭。",d:"鸡蛋、牛奶、豆制品补充钙和蛋白质<br>低头工作每30分钟活动颈部<br>热敷（热水袋）",m:"布洛芬、外用双氯芬酸凝胶<br>甲钴胺（营养神经）<br>中医：桂枝加葛根汤（风寒）、针灸推拿（经络不通）、颈复康颗粒"},
{kw:["腰痛","腰酸","腰椎","肾虚","腰肌劳损","腰疼","腰部不适"],t:"腰痛",c:"<span class='tag'>西医</span>腰肌劳损（最常见，压痛点）、腰椎间盘突出（伴腿麻）、强直性脊柱炎（晨僵）。<br><span class='tag'>中医</span>腰为肾之府。肾虚腰痛（酸软无力）、寒湿（冷痛重着）、湿热（胀痛）、瘀血（刺痛固定）。",d:"黑豆核桃粥、杜仲炖猪腰、枸杞桑葚茶<br>睡硬板床<br>避免久坐久站<br>注意腰部保暖",m:"布洛芬、外用膏药（氟比洛芬凝胶贴膏）<br>严重：盐酸乙哌立松（肌肉松弛）<br>中医：独活寄生汤（寒湿肾虚）、右归丸（肾阳虚）、六味地黄丸（肾阴虚）"},
{kw:["痛经","经痛","经期腹痛","月经痛","姨妈痛","来例假疼"],t:"痛经",c:"<span class='tag'>西医</span>原发性（无器质病变，前列腺素↑所致）和继发性（子宫内膜异位、腺肌症、盆腔炎）。<br><span class='tag'>中医</span>经行腹痛。寒凝血瘀（冷痛经血暗有块）、气滞血瘀（胀痛）、气血虚弱（隐痛经量少）。",d:"红糖姜茶、桂圆红枣汤、黑木耳、榴莲<br>经期前1周开始喝玫瑰花茶<br>热敷小腹<br>适度运动（瑜伽）",m:"布洛芬或萘普生（前列腺素抑制剂，经期前开始吃效果更好）<br>短效避孕药（遵医嘱，调经）<br>中医：少腹逐瘀汤（寒凝血瘀）、益母草颗粒（血瘀）、艾附暖宫丸（虚寒）"},
{kw:["焦虑","心慌","心悸","紧张","烦躁","焦虑症","心脏心慌"],t:"焦虑心悸",c:"<span class='tag'>西医</span>焦虑障碍（广泛性/惊恐发作），症状：心慌、胸闷、呼吸困难、手抖、出汗、濒死感。<br><span class='tag'>中医</span>郁证、心悸。心虚胆怯（易惊多虑）、心血不足（失眠健忘）、阴虚火旺（心烦盗汗）、痰火扰心（胸闷苔黄腻）。",d:"莲子百合粥、甘麦大枣汤、玫瑰花茶<br>深呼吸（4-7-8呼吸法）<br>规律运动（快走/瑜伽）<br>减少咖啡因摄入",m:"轻症：β受体阻滞剂（如普萘洛尔，短期间歇用）<br>明确诊断：SSRIs（舍曲林/帕罗西汀，处方，需数周起效）<br>中医：甘麦大枣汤（脏躁）、安神定志丸（心胆气虚）、天王补心丹（阴虚）"},
{kw:["高血压","血压高","高压高","低压高","头晕目眩"],t:"高血压",c:"<span class='tag'>西医</span>安静状态下≥140/90mmHg（诊室）或≥135/85mmHg（家庭）。分为原发性（95%，多因素）和继发性（肾、内分泌）。<br><span class='tag'>中医</span>眩晕、头痛。肝阳上亢（面红急躁）、痰湿内阻（体肥胸闷）、阴虚阳亢（腰酸耳鸣）、瘀血阻窍（刺痛固定）。",d:"<span class='tag'>关键</span>低盐饮食（<5g/天）<br>芹菜、山楂、洋葱、黑木耳泡茶<br>补充钾（香蕉、紫菜）<br>控制体重<br>戒烟限酒",m:"<span class='tag'>遵医嘱长期用药</span>，不可自行停药！<br>常用：氨氯地平（钙通道阻滞剂）、培哚普利（ACEI）、厄贝沙坦（ARB）<br>中医：天麻钩藤饮（肝阳上亢）、半夏白术天麻汤（痰湿）、杞菊地黄丸（阴虚）"},
{kw:["糖尿病","血糖高","血糖高","多饮多尿","口干多尿","消渴"],t:"糖尿病",c:"<span class='tag'>西医</span>空腹血糖≥7.0或糖化血红蛋白≥6.5%。1型（胰岛素缺乏，急骤）、2型（胰岛素抵抗，缓慢）。<br><span class='tag'>中医</span>消渴。上消（肺热—口渴多饮）、中消（胃热—多食善饥）、下消（肾虚—多尿尿甜）。",d:"<span class='tag'>关键</span>控制总热量<br>苦瓜、秋葵、山药、燕麦、荞麦<br>少食多餐，定时定量<br>避免精制糖和甜饮料<br>优选低GI食物",m:"<span class='tag'>遵医嘱用药</span>，不可自行停药！<br>2型：二甲双胍（首选）、阿卡波糖、GLP-1受体激动剂<br>1型：胰岛素（必须）<br>中医：消渴方（肺胃热盛）、六味地黄丸（肾阴虚）、金匮肾气丸（阴阳两虚）"},
{kw:["痛风","尿酸高","关节痛红肿","脚踝肿","大脚趾肿"],t:"痛风",c:"<span class='tag'>西医</span>尿酸结晶沉积关节，急性发作（红肿热痛，常首发于第一跖趾关节）。<br><span class='tag'>中医</span>痹证（热痹/浊瘀痹）。湿热痰瘀互结，脾肾失调为本。",d:"<span class='tag'>关键</span>低嘌呤饮食<br>忌：海鲜、动物内脏、浓汤、啤酒<br>宜：牛奶、鸡蛋、蔬菜、樱桃（降尿酸）<br>每天饮水>2L（促进尿酸排泄）",m:"急性发作：秋水仙碱（尽早，越早越好）+NSAIDs（如布洛芬）<br>缓解期：非布司他或苯溴马隆（降尿酸，需长期）<br><span class='tag'>禁止</span>发作期使用别嘌醇（非布司他）<br>中医：四妙丸（湿热）、当归拈痛汤（浊瘀）"},
{kw:["湿疹","皮肤痒","渗出","皮肤红","过敏性皮炎"],t:"湿疹",c:"<span class='tag'>西医</span>皮肤炎症，分急性（红斑水疱渗出）、亚急性（红肿减轻）、慢性（苔藓化）。<br><span class='tag'>中医</span>湿疮。风湿热邪浸淫（急性）、脾虚湿蕴（亚急性）、血虚风燥（慢性）。",d:"清淡饮食，忌辛辣、海鲜、牛羊肉<br>薏米绿豆汤、冬瓜汤（清热利湿）<br>避免搔抓<br>穿宽松纯棉衣物",m:"外用：丁酸氢化可的松（弱效激素急性期）、他克莫司（慢性，无激素）<br>保湿：凡士林或尿素霜（修复皮肤屏障）<br>渗出：硼酸溶液湿敷<br>中医：龙胆泻肝汤（湿热蕴肤）、除湿止痒软膏、当归饮子（血虚风燥）"},
{kw:["痤疮","青春痘","长痘","粉刺","暗疮","痘痘","脸上长痘"],t:"痤疮",c:"<span class='tag'>西医</span>毛囊皮脂腺慢性炎症。雄激素↑→皮脂↑→毛孔堵塞→痤疮丙酸杆菌繁殖→炎症。<br><span class='tag'>中医</span>粉刺。肺经风热（丘疹色红）、肠胃湿热（脓疱红肿）、痰湿瘀结（结节囊肿）。",d:"清淡饮食，忌甜食、奶制品、油炸、辛辣<br>多食蔬菜水果<br>规律作息（23点前睡）<br>每天喝足够水",m:"外用：阿达帕林（维A酸类，晚间）、过氧苯甲酰（抗菌）<br>炎症明显：克林霉素凝胶<br>重度（结节囊肿）：口服异维A酸（处方，副作用大）<br>中医：枇杷清肺饮（肺热）、黄连解毒汤（湿热）、清热暗疮片"},
{kw:["脚疼","脚痛","足底痛","足跟痛","脚底疼","足底筋膜炎","脚后跟疼","走路脚疼"],t:"足底筋膜炎",c:"<span class='tag'>西医</span>足底筋膜反复牵拉损伤，常见于久站、跑步、扁平足、高弓足。<br><span class='tag'>中医</span>痹证。肝肾不足、筋脉失养，或寒湿侵袭、瘀血阻络。",d:"休息（急性期减少走路）<br>冰敷（每天3次，每次15分钟）<br>穿软底鞋或足弓支撑垫<br>拉伸小腿三头肌和足底筋膜（每天2次）<br>控制体重",m:"外用：双氯芬酸二乙胺乳胶剂（扶他林）<br>夜间：足底牵伸夹板<br>顽固：局部注射糖皮质激素（封闭）<br>冲击波治疗<br>中医：独活寄生汤（肝肾亏虚）、针灸、艾叶红花泡脚"},
{kw:["肩周炎","肩膀疼","肩痛","肩关节痛","五十肩","冻结肩","抬不起胳膊"],t:"肩周炎",c:"<span class='tag'>西医</span>肩关节囊及周围组织慢性炎症，好发40-60岁，分冻结期（疼痛）、僵硬期（活动受限）、解冻期。<br><span class='tag'>中医</span>漏肩风。风寒湿邪侵袭肩部经络，气血瘀滞。",d:"保暖（尤其夜间）<br>爬墙练习（每天递增）<br>钟摆运动（画圈）<br>避免提重物<br>热敷（每次15-20分钟）",m:"急性期：布洛芬<br>外用：氟比洛芬凝胶贴膏<br>封闭注射（局麻药+糖皮质激素）<br>中医：桂枝加葛根汤（风寒）、针灸、拔罐、推拿"},
{kw:["脱发","掉发","秃顶","头发稀疏","斑秃","秃发"],t:"脱发",c:"<span class='tag'>西医</span>雄激素性脱发（最多见，男性M型/女性弥漫性）、斑秃（免疫性斑片状）、休止期脱发（应激/营养）。<br><span class='tag'>中医</span>发秃。肾精亏虚（腰酸耳鸣）、血虚风燥（头皮屑多）、湿热上蒸（头油多）、肝郁气滞。",d:"补充蛋白质（鸡蛋、豆制品）、铁、锌<br>黑芝麻、核桃、黑豆、何首乌<br>规律作息，减轻压力<br>避免频繁烫染、紧扎头发",m:"米诺地尔（男女通用，外用，3-6个月见效，需持续）<br>男性：非那雄胺（1mg，处方，抑制DHT）<br>斑秃：局部糖皮质激素注射<br>中医：七宝美髯丹（肾精不足）、养血生发胶囊、神应养真丹"},
{kw:["哮喘","喘息","呼吸困难","胸闷气短","哮鸣音","支气管哮喘"],t:"哮喘",c:"<span class='tag'>西医</span>气道慢性炎症+可逆性气流受限。过敏原、感染、冷空气、运动均可诱发。<br><span class='tag'>中医</span>哮证。宿痰内伏（脾虚生痰），遇诱因触发。外寒内饮（冷哮）、热哮（痰黄稠）、虚哮（气短懒言）。",d:"避免过敏原（尘螨、花粉、宠物皮屑）<br>忌生冷、辛辣、海鲜<br>适度运动（游泳/太极）<br>保持室内清洁通风<br>接种流感疫苗",m:"急性发作：沙丁胺醇吸入剂（随身携带，1-2喷，15分钟可重复）<br>控制：ICS（布地奈德）/LABA（信必可）<br>白三烯受体拮抗剂：孟鲁司特<br>中医：小青龙汤（冷哮）、定喘汤（热哮）、苏子降气汤（虚哮）"},
{kw:["流感","流行性感冒","高烧全身酸痛","浑身无力","甲流","乙流","病毒性感冒"],t:"流感",c:"<span class='tag'>西医</span>流感病毒（甲/乙/丙型），传染性强，全身症状重（高热+肌肉酸痛+乏力）。<br><span class='tag'>中医</span>时行感冒。疫毒之邪侵袭肺卫，传染性强，症状重。",d:"隔离休息，多饮水<br>清淡易消化（粥、面条、蛋羹）<br>补充维生素C（鲜榨橙汁）<br>密切观察体温",m:"奥司他韦（达菲，48h内服用效果最佳，疗程5天）<br>布洛芬（退热止痛）<br>对症：止咳药、淡盐水<br>中医：连花清瘟、金花清感颗粒（风热袭肺）"},
{kw:["鼻炎","过敏性鼻炎","鼻塞打喷嚏","鼻子痒","流清涕","鼻后滴漏"],t:"过敏性鼻炎",c:"<span class='tag'>西医</span>IgE介导的I型变态反应，症状：鼻痒+连续喷嚏+清水涕+鼻塞+眼痒。<br><span class='tag'>中医</span>鼻鼽。肺气虚寒（清涕、怕冷）、脾气虚弱（纳差腹胀）、肾阳不足（畏寒腰酸）。",d:"戴口罩（花粉季/雾霾天）<br>生理盐水鼻腔冲洗（每天1-2次）<br>保持室内清洁通风，湿度40-60%<br>避免已知过敏原",m:"一线：鼻用糖皮质激素（糠酸莫米松/布地奈德，起效慢但最有效）<br>抗组胺：氯雷他定、西替利嗪（口服）+氮卓斯汀（鼻喷）<br>减充血剂（麻黄碱，不宜超过7天）<br>中医：玉屏风散（肺气虚）、苍耳子散（通鼻窍）、补中益气丸（脾气虚）"},
{kw:["咽炎","嗓子疼","喉咙痛","咽痛","咽喉炎","扁桃体发炎","喉咙干"],t:"咽炎",c:"<span class='tag'>西医</span>急性咽炎（病毒/细菌，咽痛+发热）、慢性咽炎（长期刺激，异物感+干痒）。<br><span class='tag'>中医</span>喉痹。风热犯肺（咽痛红肿）、肺肾阴虚（咽干微红）、脾虚痰湿（咽中有痰）。",d:"多喝温水<br>淡盐水漱口（消炎）<br>梨汁、蜂蜜柠檬水、罗汉果茶<br>避免辛辣、烟酒<br>保持口腔清洁",m:"细菌性（化脓+发热）：阿莫西林或头孢（遵医嘱）<br>病毒性：对症（多喝水+止痛）<br>慢性：华素片、银黄含片<br>中医：银翘解毒片（风热）、玄麦甘桔颗粒（阴虚）、蓝芩口服液"},
{kw:["口腔溃疡","嘴破","口疮","舌头烂","口腔溃烂"],t:"口腔溃疡",c:"<span class='tag'>西医</span>复发性阿弗他溃疡（最常见，单个或多个，7-14天自愈）、白塞病（多系统）。<br><span class='tag'>中医</span>口疮。心脾积热（红肿疼痛）、阴虚火旺（隐隐作痛反复）、气血两虚（疮面淡红）。",d:"多食新鲜蔬果（补充维生素B、C）<br>避免辛辣、烫食、坚硬食物<br>蜂蜜涂抹（促进愈合）<br>绿茶漱口（收敛）",m:"局部：口腔溃疡贴、曲安奈德口腔软膏<br>疼痛：利多卡因凝胶（餐前）<br>复合维生素B+维生素C<br>反复发作：排查白塞病/克隆恩病<br>中医：西瓜霜、冰硼散、黄连上清片（实火）"},
{kw:["痔疮","便血","肛裂","肛门疼","痔疮犯了"],t:"痔疮",c:"<span class='tag'>西医</span>肛垫下移或静脉曲张。分内痔（便血）、外痔（疼痛肿块）、混合痔。<br><span class='tag'>中医</span>痔疮。风伤肠络（便血鲜红）、湿热下注（肿胀疼痛）、脾虚气陷（脱出）。",d:"多喝水（软化大便）<br>高纤维饮食（燕麦、芹菜、菠菜）<br>避免久坐久蹲<br>便后温水坐浴<br>提肛运动（每天3组，每组30次）",m:"止血：云南白药胶囊、马应龙痔疮膏<br>疼痛肿胀：马应龙麝香痔疮膏、普济痔疮栓<br>严重：手术治疗<br>中医：槐角丸（风伤肠络）、补中益气丸（气虚下陷）"},
{kw:["脂肪肝","肝脂肪","转氨酶高"],t:"脂肪肝",c:"<span class='tag'>西医</span>肝细胞脂肪变性，分酒精性（长期饮酒）和非酒精性（代谢综合征相关）。<br><span class='tag'>中医</span>肝痞。痰湿内蕴、瘀血阻络、脾虚失运。",d:"<span class='tag'>关键</span>减重（BMI下降5-7%即可改善）<br>控制饮食，低脂低糖<br>燕麦、玉米、山楂、乌龙茶<br>戒酒（酒精性必须）<br>适度有氧运动",m:"护肝：多烯磷脂酰胆碱、水飞蓟素<br>降脂：他汀类（胆固醇高时）<br>二甲双胍（合并糖尿病）<br>中医：护肝片、强肝胶囊、山楂精降脂片"},
{kw:["胆囊炎","胆结石","右上腹痛","胆区痛"],t:"胆囊炎/胆结石",c:"<span class='tag'>西医</span>胆囊结石梗阻+感染。典型：右上腹绞痛+向右肩放射，伴恶心呕吐发热。<br><span class='tag'>中医</span>胁痛/胆胀。肝郁气滞（胀痛）、肝胆湿热（绞痛发热）、肝阴不足（隐痛）。",d:"急性发作期禁食油腻<br>平时低脂饮食（<40g/天）<br>少食多餐<br>避免暴饮暴食<br>乌梅、金桔理气",m:"急性发作：禁食+输液+抗生素（头孢）<br>解痉：654-2<br>止痛：间苯三酚<br>结石>1cm或反复发作：手术（腹腔镜胆囊切除）<br>中医：消炎利胆片、胆石通"},
{kw:["肝炎","乙肝","甲肝","丙肝","肝功能异常"],t:"肝炎",c:"<span class='tag'>西医</span>肝细胞炎症损伤。病毒性（甲/乙/丙/丁/戊型）、酒精性、药物性、自身免疫性。<br><span class='tag'>中医</span>胁痛、黄疸。湿热蕴结（急性）、肝郁脾虚（慢性）、肝肾阴虚（久病）。",d:"高蛋白（鸡蛋、鱼、豆制品）<br>适量碳水化合物<br>新鲜蔬菜水果<br>戒酒<br>卧床休息（急性期）",m:"乙肝：恩替卡韦/替诺福韦（长期，处方，不能停）<br>丙肝：直接抗病毒药（DAA，90%+治愈率）<br>护肝降酶：甘草酸制剂、水飞蓟素<br>中医：护肝片、逍遥丸（肝郁）、一贯煎（阴虚）"},
{kw:["冠心病","心绞痛","胸闷胸痛","心脏疼","心肌缺血"],t:"冠心病",c:"<span class='tag'>西医</span>冠状动脉粥样硬化→管腔狭窄→心肌供血不足。稳定型心绞痛（活动后发作）和急性冠脉综合征（危险）。<br><span class='tag'>中医</span>胸痹、心悸。气滞血瘀（刺痛固定）、痰浊闭阻（胸闷苔腻）、寒凝心脉（绞痛畏寒）、气阴两虚（隐痛乏力）。",d:"<span class='tag'>关键</span>低盐低脂低糖饮食<br>地中海饮食（橄榄油、鱼类、坚果）<br>戒烟（最重要之一）<br>适度有氧运动（步行）<br>避免饱餐和寒冷刺激",m:"<span class='tag'>硝酸甘油（急救，心绞痛发作时舌下含服1片）</span><br>抗血小板：阿司匹林（每天75-100mg）<br>调脂：他汀类（LDL-C<1.8mmol/L）<br>降压：ACEI/ARB、β受体阻滞剂<br>中医：复方丹参滴丸、麝香保心丸、速效救心丸"},
{kw:["心律失常","心悸","心跳快","心跳慢","心律不齐","早搏"],t:"心律失常",c:"<span class='tag'>西医</span>心脏电传导异常。室性早搏（最常见）、房颤（脑卒中风险）、心动过速/过缓。<br><span class='tag'>中医</span>心悸。心胆虚怯（易惊）、心血不足（失眠多梦）、阴虚火旺（心烦盗汗）、水气凌心（心悸浮肿）。",d:"避免咖啡、浓茶、能量饮料<br>莲子百合粥（养心安神）<br>规律作息<br>避免情绪激动<br>戒烟酒",m:"早搏：β受体阻滞剂（无器质性病变可观察）<br>房颤：抗凝（华法林/新型口服抗凝药）节律控制+心率控制<br>心动过速：β受体阻滞剂<br>心动过缓：起搏器（严重）<br>中医：稳心颗粒、参松养心胶囊"},
{kw:["骨质疏松","骨头脆","腰背痛","骨折","缺钙"],t:"骨质疏松",c:"<span class='tag'>西医</span>骨量↓+骨微结构破坏→脆性骨折风险↑。绝经后女性和老年人最常见。<br><span class='tag'>中医</span>骨痿。肾精不足（腰膝酸软）、脾胃虚弱（乏力纳差）、瘀血阻络。",d:"高钙饮食：牛奶、豆制品、绿叶菜、芝麻<br>维生素D：深海鱼、蛋黄、晒太阳（每天15分钟）<br>负重运动（快走、太极）<br>防跌倒（卫生间扶手）",m:"钙剂：碳酸钙D3（每天600-1200mg元素钙）<br>抗骨吸收：阿仑膦酸钠（每周1次，早晨空腹）<br>促骨形成：特立帕肽（严重，处方）<br>中医：骨疏康、仙灵骨葆、左归丸（肾阴虚）、右归丸（肾阳虚）"},
{kw:["类风湿","关节肿胀","关节变形","晨僵","风湿性关节炎"],t:"类风湿关节炎",c:"<span class='tag'>西医</span>自身免疫性滑膜炎，侵蚀性关节破坏。对称性小关节（腕/掌指/近端指间）肿痛+晨僵>1小时。<br><span class='tag'>中医</span>尪痹。风寒湿痹（关节冷痛）、湿热痹阻（红肿热痛）、痰瘀互结（关节变形）、肝肾亏虚（功能障碍）。",d:"高蛋白饮食<br>避免生冷<br>适度关节活动（防止畸形）<br>热敷（缓解僵硬）<br>晒太阳补充维生素D",m:"DMARDs（改善病情抗风湿药，越早用越好）：甲氨蝶呤（首选，处方）<br> NSAIDs：布洛芬（止痛）<br>生物制剂：TNF-α抑制剂（严重，处方）<br>中医：独活寄生汤（风寒湿）、四妙丸（湿热）、针灸"},
{kw:["前列腺炎","前列腺","尿频尿急","排尿困难","男性下尿路"],t:"前列腺炎",c:"<span class='tag'>西医</span>前列腺炎（50岁以下男性最常见泌尿疾病）。分急性细菌性、慢性细菌性、慢性盆腔疼痛综合征（最常见）。<br><span class='tag'>中医</span>精浊/淋证。湿热下注（尿频尿急）、气滞血瘀（会阴刺痛）、肾虚（腰膝酸软）。",d:"多喝水（冲刷尿道）<br>避免久坐（每1小时起身活动）<br>不吃辛辣刺激<br>规律性生活<br>南瓜籽（富含锌）",m:"急性：抗生素（左氧氟沙星，遵医嘱）<br>慢性：α受体阻滞剂（坦索罗辛）+植物药（前列康）<br>疼痛：布洛芬<br>中医：前列舒通胶囊、三金片、知柏地黄丸（肾阴虚）"},
{kw:["膀胱炎","尿道炎","尿路感染","尿频尿急尿痛","小便疼"],t:"尿路感染",c:"<span class='tag'>西医</span>细菌（80%大肠杆菌）上行感染膀胱（膀胱炎）或肾盂（肾盂肾炎）。<br><span class='tag'>中医</span>淋证。湿热下注（尿频尿急尿痛）、阴虚火旺（反复发作）、脾虚气陷（劳累诱发）。",d:"多喝水（每天>2L，冲洗尿路）<br>蔓越莓汁（预防复发）<br>避免憋尿<br>便后从前向后擦<br>忌辛辣",m:"经验性抗生素：磷霉素（单次3g）或左氧氟沙星（3天）<br>三金片（辅助）<br>反复发作：需做尿培养+药敏<br>中医：热淋清颗粒、三金片、知柏地黄丸（反复发作）"},
{kw:["贫血","脸色苍白","血红蛋白低","头晕乏力","缺铁"],t:"贫血",c:"<span class='tag'>西医</span>血红蛋白↓，最常见缺铁性贫血（育龄女性）。症状：乏力、头晕、面色苍白、心悸。<br><span class='tag'>中医</span>血虚。脾气虚弱（纳差倦怠）、心肝血虚（失眠心悸）、肾精不足（腰酸耳鸣）。",d:"补铁食物：动物肝脏（猪肝）、红肉（牛肉）、血制品、菠菜、红枣、桂圆<br>补维生素C（促进铁吸收）<br>避免浓茶咖啡（抑制铁吸收）",m:"缺铁性：琥珀酸亚铁/多糖铁复合物（饭后，+维生素C）<br>叶酸/B12缺乏：补充叶酸或甲钴胺<br>地中海贫血：避免铁剂（需基因检测确诊）<br>中医：复方阿胶浆、当归补血汤、八珍颗粒"},
{kw:["甲亢","甲状腺功能亢进","手抖","心慌消瘦","怕热多汗"],t:"甲亢",c:"<span class='tag'>西医</span>甲状腺激素↑。Graves病（最常见，自身免疫）。症状：怕热多汗、心慌手抖、消瘦、多食、突眼、甲状腺肿大。<br><span class='tag'>中医</span>瘿病。气郁痰凝（甲状腺肿）、阴虚火旺（怕热盗汗）、气阴两虚（消瘦乏力）。",d:"高热量高蛋白饮食（补偿消耗）<br>限碘饮食（不吃海带紫菜）<br>避免咖啡因（加重心悸）<br>补充钙和维生素D",m:"<span class='tag'>处方用药，需在内分泌科医生指导下</span><br>甲巯咪唑（抑制甲状腺激素合成，疗程1.5-2年）<br>丙硫氧嘧啶（妊娠首选）<br>β受体阻滞剂（控制心悸）<br>放射性碘131或手术（难治性）"},
{kw:["甲减","甲状腺功能减退","怕冷","倦怠","浮肿"],t:"甲减",c:"<span class='tag'>西医</span>甲状腺激素↓。桥本甲状腺炎最常见（原发性甲减）。症状：怕冷乏力、嗜睡、便秘、体重↑、浮肿、表情淡漠。<br><span class='tag'>中医</span>瘿劳。脾肾阳虚（畏寒浮肿）、心肾阳虚（心悸胸闷）。",d:"均衡饮食<br>适量碘（加碘盐，海带紫菜适量）<br>高纤维（改善便秘）<br>控制热量（避免体重↑）",m:"<span class='tag'>左甲状腺素（优甲乐），空腹服用，与铁钙间隔4小时</span><br>需终身服药，定期复查TSH调整剂量<br>中医：金匮肾气丸（肾阳虚）、右归丸"},
{kw:["胃食管反流","烧心","反酸","喉咙酸","GERD"],t:"胃食管反流病",c:"<span class='tag'>西医</span>胃酸反流食管。典型：烧心、反酸；不典型：慢性咳嗽、咽炎、牙侵蚀。<br><span class='tag'>中医</span>反酸、嘈杂。肝胃郁热（反酸口苦）、中虚气逆（反胃嗳气）、痰气交阻（咽部异物感）。",d:"少量多餐（晚餐不过饱）<br>抬高床头10-15cm<br>避免甜食、油腻、巧克力、咖啡、薄荷<br>餐后散步（30分钟）<br>减重",m:"抑酸：奥美拉唑/艾司奥美拉唑（每天1次，8周）<br>促动力：莫沙必利<br>黏膜保护：铝碳酸镁<br>难治：PPI+促动力药<br>中医：气滞胃痛颗粒、左金丸、乌贝散"},
{kw:["肠易激","IBS","腹胀腹痛","拉肚子便秘交替","肠功能紊乱"],t:"肠易激综合征",c:"<span class='tag'>西医</span>功能性肠道疾病，腹痛伴排便习惯改变（腹泻型/便秘型/混合型）。<br><span class='tag'>中医</span>腹痛/泄泻。肝郁脾虚（情绪相关）、脾虚湿盛（腹泻）、肠道燥结（便秘）。",d:"腹泻型：低FODMAP饮食（减少产气食物）<br>便秘型：高纤维饮食+足够饮水<br>规律饮食<br>避免生冷辛辣<br>记录食物日记找诱因",m:"腹泻型：洛哌丁胺（对症）、匹维溴铵（解痉）<br>便秘型：乳果糖、聚乙二醇<br>肠功能调节：益生菌（双歧杆菌）<br>抗焦虑：匹维溴铵+抗抑郁药（难治性）<br>中医：痛泻要方（肝郁脾虚）、参苓白术散（脾虚）"},
{kw:["慢性支气管炎","慢支","长期咳嗽","咳痰喘","老慢支"],t:"慢性支气管炎",c:"<span class='tag'>西医</span>连续2年每年咳嗽咳痰≥3个月。吸烟是最主要病因。<br><span class='tag'>中医</span>咳嗽/喘证。痰湿蕴肺（咳嗽痰多白稀）、肺肾气虚（气短喘息动则甚）。",d:"戒烟（最重要）<br>清淡饮食<br>适度有氧运动（步行/太极）<br>避免寒冷刺激<br>梨、百合、银耳润肺",m:"急性发作：抗生素（合并感染）+平喘（氨茶碱）<br>长期：ICS/LABA（氟替美维吸入剂）<br>化痰：氨溴索<br>中医：二陈汤（痰湿）、补肺汤（气虚）"},
{kw:["白内障","视力模糊","眼睛看不清","晶状体混浊"],t:"白内障",c:"<span class='tag'>西医</span>晶状体混浊，年龄相关性最常见（>60岁）。视物模糊、眩光、夜视力↓。<br><span class='tag'>中医</span>圆翳内障。肝肾阴虚（目涩模糊）、脾胃气虚（食少倦怠）。",d:"多食深绿色蔬菜（叶黄素）、胡萝卜、蓝莓<br>补充维生素C、E<br>避免强光直射（戴太阳镜）<br>控制血糖血压",m:"<span class='tag'>手术是唯一治愈方式</span>（超声乳化+人工晶体植入，早期即可手术，无需等'成熟'）<br>早期可暂观察<br>中医：明目地黄丸、石斛夜光丸（延缓发展）"},
{kw:["耳鸣","耳朵响","听力下降","耳聋"],t:"耳鸣",c:"<span class='tag'>西医</span>外界无声源但主观听到声音。分主观性（常见）和客观性（罕见，血管性）。<br><span class='tag'>中医</span>耳鸣。肾精亏虚（蝉鸣、腰酸）、肝火上扰（轰鸣、急躁）、脾胃虚弱（声低、倦怠）。",d:"耳鸣保健操（鸣天鼓）<br>避免噪音<br>少熬夜<br>喝菊花茶、枸杞茶<br>补充锌",m:"明确病因治疗最重要<br>掩蔽治疗（助听器/白噪音）<br>血管性（搏动性）：需影像学排除血管瘤<br>中医：耳聋左慈丸（肾虚）、龙胆泻肝丸（肝火）、针灸"},
{kw:["静脉曲张","腿胀","腿沉","下肢静脉","蚯蚓腿"],t:"下肢静脉曲张",c:"<span class='tag'>西医</span>下肢浅静脉瓣膜功能不全，血液淤积。表现为腿上蚯蚓状突起，伴胀痛、沉重感。<br><span class='tag'>中医</span>筋瘤。气虚血瘀（久站久立加重）、寒湿凝滞（怕冷）。",d:"避免久站久坐（每1小时活动5-10分钟）<br>抬高患肢（休息时）<br>穿弹力袜（渐进式）<br>快走运动（促进静脉回流）<br>控制体重",m:"保守：医用弹力袜（压力梯度）<br>严重：硬化剂注射、射频/激光消融、手术剥脱<br>抗凝：阿司匹林（血栓高危）<br>中医：迈之灵片、血府逐瘀汤"},
{kw:["湿疹痒","阴囊湿疹","股癣","皮肤瘙痒","老年皮肤瘙痒"],t:"皮肤瘙痒",c:"<span class='tag'>西医</span>皮肤瘙痒症（无原发皮损），老年人常见（老年性瘙痒），或继发于糖尿病/肝病/肾功能不全。<br><span class='tag'>中医</span>风瘙痒。血虚风燥（老年人、干燥）、湿热下注（局部）、风寒束表（遇冷加重）。",d:"老年人：减少洗澡频次（每周1-2次）<br>不用过热的水（<40℃）<br>穿纯棉宽松衣物<br>涂抹润肤霜（干燥后立即涂）<br>避免搔抓",m:"止痒：炉甘石洗剂<br>严重：短期弱效激素（丁酸氢化可的松）<br>口服：左西替利嗪（睡前）<br>排查系统性疾病（血糖/肝肾功能）<br>中医：润燥止痒胶囊、当归饮子（血虚风燥）"},
{kw:["神经衰弱","记忆力下降","用脑过度","脑疲劳","头昏沉"],t:"神经衰弱",c:"<span class='tag'>西医</span>大脑皮质兴奋-抑制功能失调，与长期精神紧张压力相关。<br><span class='tag'>中医</span>健忘/失眠。心脾两虚（多梦健忘）、心肾不交（心烦失眠）、痰浊内阻（头重昏沉）。",d:"核桃（补脑）、鸡蛋、鱼（磷脂）<br>蓝莓（抗氧化）<br>规律作息，23点前睡<br>有氧运动（每周3次）<br>减少屏幕时间",m:"调节作息是根本<br>复合维生素B<br>失眠：安神类<br>焦虑明显：抗焦虑药（遵医嘱）<br>中医：归脾丸（心脾两虚）、天王补心丹（心肾不交）、益智仁茶"},
{kw:["男性不育","少精","弱精","备孕失败","怀不上"],t:"男性不育",c:"<span class='tag'>西医</span>夫妻正常性生活1年未孕，原因：少弱精症（最常见）、性功能障碍、精索静脉曲张、感染。<br><span class='tag'>中医</span>无子。肾精亏虚（腰酸耳鸣）、脾虚气陷（倦怠纳差）、气滞血瘀（睾丸胀痛）。",d:"富含锌食物（生蚝、牛肉、南瓜子）<br>番茄红素（番茄、西瓜）<br>避免泡温泉/热水澡（杀精）<br>戒烟酒<br>规律作息<br>适度运动",m:"需检查精液常规+性激素<br>少弱精：左卡尼汀、左氧氟沙星（感染时）<br>精索静脉曲张：手术<br>体外受精（IVF）：严重少弱精<br>中医：五子衍宗丸（肾精不足）、生精胶囊"}
,
{kw:["胃炎","胃胀","胃黏膜","反酸","嗳气","胃灼烧"],t:"胃炎",c:"<span class='tag'>西医</span>胃黏膜炎症，分急性和慢性，常由幽门螺杆菌感染、药物（阿司匹林/布洛芬）、酒精引起。<br><span class='tag'>中医</span>胃痛/胃脘痛，分型：寒邪客胃、饮食停滞、肝气犯胃、脾胃虚寒。",d:"温和饮食，小米粥、山药粥、南瓜<br>忌辛辣、油腻、咖啡、酒精<br>少食多餐，吃饭细嚼慢咽",m:"西药：奥美拉唑（质子泵抑制剂）、铝碳酸镁（胃黏膜保护）<br>中药：香砂养胃丸、保和丸、气滞胃痛颗粒"},
{kw:["腹胀","消化不良","积食","肚子胀","胃肠胀气"],t:"消化不良",c:"<span class='tag'>西医</span>胃排空延迟，消化酶分泌不足，或由胃肠动力障碍引起。<br><span class='tag'>中医</span>积滞/脾虚，分：食积胃肠、脾虚气滞、寒湿困脾。",d:"山楂麦芽茶、鸡内金粉、陈皮普洱<br>饭后散步15分钟<br>避免豆类、洋葱、碳酸饮料",m:"多酶片、健胃消食片<br>西药：多潘立酮（促胃动力）、复方消化酶"},
{kw:["心律失常","心悸","心跳不齐","早搏","房颤","心跳快"],t:"心律失常",c:"<span class='tag'>西医</span>心脏电传导系统异常，包括早搏、房颤、室上速等，可能无症状或心悸、头晕。<br><span class='tag'>中医</span>心悸/怔忡，分型：心虚胆怯、心血不足、阴虚火旺、心阳不振。",d:"忌咖啡、浓茶、酒精<br>多吃含镁食物：坚果、深绿色蔬菜、香蕉<br>规律作息，避免熬夜",m:"西药：美托洛尔（β受体阻滞剂）、胺碘酮（遵医嘱）<br>中药：稳心颗粒、参松养心胶囊<br>⚠️ 严重心律失常需心内科就诊"},
{kw:["高血脂","血脂高","胆固醇高","甘油三酯","血稠"],t:"高血脂",c:"<span class='tag'>西医</span>总胆固醇/低密度脂蛋白（LDL）升高，甘油三酯升高。长期可致动脉粥样硬化。<br><span class='tag'>中医</span>痰浊/血瘀，分型：痰湿内阻、气滞血瘀、肝肾阴虚。",d:"燕麦、深海鱼（三文鱼/鲭鱼）、坚果<br>严格限制：动物内脏、肥肉、反式脂肪<br>黑木耳、山楂、洋葱有助降脂",m:"西药：阿托伐他汀/瑞舒伐他汀（他汀类）<br>中药：血脂康胶囊、荷丹片<br>⚠️ 需定期查肝功能"},
{kw:["支气管炎","咳嗽痰多","慢性支气管炎","咳喘","气喘"],t:"支气管炎",c:"<span class='tag'>西医</span>支气管黏膜炎症，急性多由病毒感染，慢性与吸烟/空气污染相关，表现为咳嗽、咳痰。<br><span class='tag'>中医</span>咳嗽/喘证，分型：风寒束肺、风热犯肺、痰热壅肺、肺脾气虚。",d:"雪梨川贝炖冰糖、白萝卜蜂蜜水<br>百合银耳汤润肺<br>忌辛辣、冷饮、烟酒",m:"急性：右美沙芬（止咳）、氨溴索（化痰）<br>慢性：布地奈德吸入剂（遵医嘱）<br>中药：急支糖浆、鲜竹沥口服液"},
{kw:["扁桃体炎","喉咙肿痛","扁桃体发炎","咽喉红肿","吞咽困难"],t:"扁桃体炎",c:"<span class='tag'>西医</span>扁桃体感染，多数为病毒（自限），少数为A族链球菌（需抗生素）。<br><span class='tag'>中医</span>乳蛾/喉痹，分型：风热外侵、肺胃热盛、阴虚火旺。",d:"温盐水漱口（每2-3小时）<br>蜂蜜柠檬水、金银花露<br>忌辛辣刺激、过硬食物",m:"病毒：对乙酰氨基酚退热止痛，自愈<br>细菌（链球菌）：阿莫西林（需医生处方）<br>中药：蒲地蓝消炎口服液、一清胶囊"},
{kw:["牙痛","牙齿痛","蛀牙","牙髓炎","牙龈肿痛"],t:"牙痛",c:"<span class='tag'>西医</span>龋齿、牙髓炎、牙周炎、智齿冠周炎是常见原因。疼痛程度从敏感至剧烈。<br><span class='tag'>中医</span>牙痛，分型：风火牙痛、胃火牙痛、肾虚牙痛。",d:"淡盐水漱口<br>丁香精油棉球咬在痛处（临时止痛）<br>忌冷热刺激、甜食",m:"布洛芬/对乙酰氨基酚止痛（临时）<br>甲硝唑（牙周炎，需处方）<br>⚠️ 必须看牙医，药物只救急"},
{kw:["小儿发烧","宝宝发烧","儿童发热","小孩退烧"],t:"小儿发烧",c:"<span class='tag'>西医</span>儿童体温调节中枢未成熟，发热是免疫反应。38.5°C以下物理降温为主。<br><span class='tag'>中医</span>小儿发热，分型：外感发热、食积发热、阴虚发热。",d:"38.5°C以下：温水擦浴（颈/腋/腹股沟）<br>多饮温水，保持室内通风<br>米汤、稀粥补充能量",m:"38.5°C以上：布洛芬混悬液（美林）或对乙酰氨基酚（泰诺林）<br>⚠️ 按体重给药，间隔6小时，忌阿司匹林（Reye综合征）"},
{kw:["月经不调","经期不准","月经推迟","月经提前","经量异常"],t:"月经不调",c:"<span class='tag'>西医</span>下丘脑-垂体-卵巢轴调控异常，或子宫肌瘤/多囊等器质病变。<br><span class='tag'>中医</span>月经不调，分型：气滞血瘀、寒凝血瘀、肝郁气滞、气血两虚、肾气虚。",d:"经期忌生冷、寒凉食物<br>红糖姜茶（寒凝血瘀型）<br>玫瑰月季茶（气滞血瘀型）<br>黑豆核桃补肾（肾气虚型）",m:"西药：短效避孕药（调经）、黄体酮（催经，需医生指导）<br>中药：乌鸡白凤丸、逍遥丸、益母草颗粒"},
{kw:["乳腺增生","乳腺结节","乳房胀痛","乳腺肿块"],t:"乳腺增生",c:"<span class='tag'>西医</span>乳腺组织增生及退行性变，与内分泌紊乱（雌激素/孕激素比例失调）相关，多为良性。<br><span class='tag'>中医</span>乳癖，分型：肝郁气滞、痰瘀互结、冲任失调。",d:"忌高脂饮食、蜂王浆、雪蛤（含动物雌激素）<br>多吃十字花科蔬菜（西兰花/卷心菜）<br>保持情绪舒畅，避免熬夜",m:"无症状不需治疗，定期复查乳腺超声<br>疼痛明显：乳癖消片、逍遥丸<br>⚠️ 发现肿块必须乳腺专科就诊"},
{kw:["抑郁","抑郁症","情绪低落","兴趣丧失","快感缺失"],t:"抑郁",c:"<span class='tag'>西医</span>神经递质失衡（5-羟色胺/多巴胺/去甲肾上腺素），遗传因素、生活事件、慢性压力可诱发。<br><span class='tag'>中医</span>郁证，分型：肝气郁结、气郁化火、心神失养、心脾两虚。",d:"多晒太阳（促进血清素分泌）<br>有氧运动：快走/慢跑30分钟/天<br>Omega-3脂肪酸（深海鱼）、香蕉、黑巧克力<br>保持社交联系",m:"西药：SSRI类（舍曲林/氟西汀等，需精神科处方）<br>中药：逍遥丸、甘麦大枣汤<br>⚠️ 中重度抑郁必须专业治疗，本文仅供参考"},
{kw:["焦虑","焦虑症","紧张","坐立不安","惊恐发作"],t:"焦虑",c:"<span class='tag'>西医</span>过度激活的「战斗或逃跑」反应，与杏仁核过度活跃、前额叶调控不足相关。<br><span class='tag'>中医</span>郁证/惊悸，分型：肝郁化火、痰热内扰、心脾两虚、阴虚火旺。",d:"深呼吸训练（4秒吸-7秒屏-8秒呼）<br>减少咖啡因摄入<br>镁补充剂（甘氨酸镁，睡前）、洋甘菊茶",m:"西药：SSRIs、苯二氮卓类（短期使用，易依赖）<br>中药：安神补脑液、天王补心丹<br>认知行为疗法（CBT）是一线治疗"},
{kw:["腰肌劳损","腰酸","腰部酸痛","腰肌无力","久坐腰痛"],t:"腰肌劳损",c:"<span class='tag'>西医</span>腰部肌肉、筋膜慢性损伤，与久坐、姿势不良、核心肌群薄弱相关。<br><span class='tag'>中医</span>腰痛，分型：寒湿腰痛、湿热腰痛、瘀血腰痛、肾虚腰痛。",d:"避免久坐（每45分钟起身活动）<br>小燕飞、平板支撑强化核心<br>热敷腰部，避免受凉",m:"布洛芬/双氯芬酸（外用凝胶更安全）<br>中药：腰痛宁胶囊、壮腰健肾丸<br>理疗：牵引、推拿（正规医疗机构）"},
{kw:["颈椎病","颈肩痛","颈椎间盘突出","颈肩僵硬","落枕"],t:"颈椎病",c:"<span class='tag'>西医</span>颈椎间盘退变、骨质增生压迫神经根/脊髓，长期低头是主因。<br><span class='tag'>中医</span>项痹/颈肩痛，分型：风寒湿阻、气滞血瘀、肝肾亏虚。",d:"抬头看天花板（每次10秒，每天多次）<br>颈椎操：缓慢左右转头、低头仰头<br>枕头高度适中（一拳高），避免高枕",m:"甲钴胺（营养神经）、布洛芬（止痛）<br>外用：氟比洛芬凝胶贴膏<br>⚠️ 手臂麻木/行走不稳需立即就诊"},
{kw:["脂肪肝","脂肪肝逆转","肝酶高","转氨酶高"],t:"脂肪肝",c:"<span class='tag'>西医</span>肝细胞内脂肪堆积超过5%，分酒精性和非酒精性（与肥胖/胰岛素抵抗相关）。<br><span class='tag'>中医</span>肝癖/积证，分型：痰湿内阻、湿热蕴结、肝郁气滞、瘀血阻络。",d:"减重5-10%可逆转脂肪肝！<br>地中海饮食：橄榄油、深海鱼、全谷物、蔬菜<br>忌酒精、高糖饮料、油炸食品",m:"无特效药，改善生活方式是根本<br>维生素E（非糖尿病患者）、吡格列酮（需医生评估）<br>中药：水飞蓟素、壳脂胶囊"},
{kw:["胆结石","胆绞痛","胆囊结石","右上腹痛"],t:"胆结石",c:"<span class='tag'>西医</span>胆固醇或胆色素在胆囊内形成结石，油腻饮食后诱发胆绞痛（右上腹剧痛）。<br><span class='tag'>中医</span>胆胀/胁痛，分型：肝胆湿热、肝郁气滞、肝阴不足。",d:"低脂肪饮食，避免油炸、蛋黄、动物内脏<br>规律三餐（不吃早餐易形成结石）<br>橄榄油（适量）可能有助于胆囊收缩",m:"无症状不需治疗，定期观察<br>疼痛发作：山莨菪碱（解痉）、布洛芬<br>⚠️ 反复胆绞痛/发热/黄疸需手术切除胆囊"},
{kw:["肾结石","肾绞痛","尿路结石","腰绞痛","血尿"],t:"肾结石",c:"<span class='tag'>西医</span>尿液中钙/草酸/尿酸浓度过高形成结晶，常见草酸钙结石。表现为剧烈腰痛（肾绞痛）或血尿。<br><span class='tag'>中医</span>石淋/砂淋，分型：湿热蕴结、气滞血瘀、肾气亏虚。",d:"每天饮水2000-3000ml（关键！）<br>柠檬水（柠檬酸盐抑制结石形成）<br>草酸钙结石：少吃菠菜、坚果、浓茶",m:"镇痛：布洛芬、双氯芬酸<br>排石：坦索罗辛（扩张输尿管，需处方）<br>⚠️ 结石>6mm通常需体外碎石或手术"},
{kw:["慢性肾炎","蛋白尿","血尿","肾功能","肌酐高"],t:"慢性肾炎",c:"<span class='tag'>西医</span>肾小球免疫性炎症，表现为蛋白尿、血尿、高血压，长期可致肾功能衰竭。<br><span class='tag'>中医</span>水肿/虚劳，分型：肺肾气虚、脾肾阳虚、肝肾阴虚、气阴两虚。",d:"低盐饮食（<3g/天）<br>优质低蛋白饮食（0.6-0.8g/kg/天）<br>忌海鲜、动物内脏、高嘌呤食物",m:"ACEI/ARB类降压药（减少蛋白尿）<br>激素/免疫抑制剂（需肾内科医生指导）<br>中药：黄葵胶囊、尿毒清颗粒<br>⚠️ 必须肾内科规范治疗"},
{kw:["偏头痛","偏侧头痛","血管性头痛","搏动性头痛"],t:"偏头痛",c:"<span class='tag'>西医</span>神经血管性头痛，与三叉神经血管系统激活、皮质扩散性抑制相关。多有家族史，女性多见。<br><span class='tag'>中医</span>头风/偏头痛，分型：风寒入络、肝阳上亢、瘀血阻络、气血亏虚。",d:"识别并避免诱因：红酒、巧克力、奶酪、强光、睡眠不足<br>镁补充剂（甘氨酸镁400mg/天）<br>辅酶Q10、维生素B2（核黄素）有预防作用",m:"急性发作：布洛芬（足量，发作早期）、曲普坦类（需处方）<br>预防：普萘洛尔、托吡酯（需神经科医生评估）<br>中药：正天丸、通天口服液"},
{kw:["面瘫","面神经炎","吊线风","口眼歪斜","面部麻木"],t:"面瘫（面神经炎）",c:"<span class='tag'>西医</span>面神经非特异性炎症，导致患侧面部肌肉瘫痪，表现为额纹消失、眼睑闭合不全、口角歪斜。<br><span class='tag'>中医</span>面瘫/口眼歪斜，分型：风寒阻络、风热袭络、气虚血瘀。",d:"急性期（1-2周内）糖皮质激素（泼尼松，需医生处方）可减轻神经水肿<br>热敷患侧面部<br>眼部戴眼罩或人工泪液保护角膜（防暴露性角膜炎）",m:"西药：泼尼松+阿昔洛韦（若怀疑病毒感染）<br>中药：牵正散加减<br>针灸：发病1周后开始，地仓、颊车、合谷等穴位<br>⚠️ 发病72小时内就诊效果最佳"},
{kw:["银屑病","牛皮癣","银屑病关节炎","皮肤红斑鳞屑"],t:"银屑病（牛皮癣）",c:"<span class='tag'>西医</span>免疫介导的慢性复发性炎症性皮肤病，表皮增生过快（角质形成细胞增殖），表现为红色斑块+银白色鳞屑。<br><span class='tag'>中医</span>白疕，分型：血热内蕴、血虚风燥、气血瘀滞、湿毒蕴结。",d:"保湿！每天涂润肤霜2-3次（关键）<br>忌辛辣、酒精、红肉<br>温泉浴/死海浴盐有帮助<br>减轻压力（压力是常见诱因）",m:"外用药：糖皮质激素（短期）、维生素D3类似物（卡泊三醇）<br>光疗：窄谱UVB<br>中重度：生物制剂（需皮肤科医生评估）<br>中药：消银片、复方青黛丸"},
{kw:["荨麻疹","风疹","风团","皮肤过敏","瘙痒红肿"],t:"荨麻疹",c:"<span class='tag'>西医</span>皮肤黏膜小血管扩张及渗透性增加引起的局限性水肿，表现为风团（来去如风，24小时内可消退但反复）。<br><span class='tag'>中医</span>瘾疹，分型：风寒束表、风热犯表、胃肠湿热、气血亏虚。",d:"识别并避免过敏原：海鲜、坚果、某些药物<br>冷敷瘙痒部位（勿热水烫洗）<br>穿宽松棉质衣物",m:"第二代抗组胺药：西替利嗪、氯雷他定（每天1次，嗜睡副作用小）<br>严重时：短期口服糖皮质激素（需医生处方）<br>中药：消风止痒颗粒"},
{kw:["干眼症","眼睛干涩","眼疲劳","泪液不足","眼睛酸痛"],t:"干眼症",c:"<span class='tag'>西医</span>泪液分泌不足或蒸发过强，导致眼表干燥、异物感。长期看屏幕是主因。<br><span class='tag'>中医</span>白涩症/神水将枯，分型：肺阴不足、肝肾阴虚、脾胃湿热。",d:"20-20-20法则：每20分钟看20英尺外（6米）20秒<br>人工泪液（无防腐剂）每天4-6次<br>增加Omega-3摄入（深海鱼/亚麻籽）<br>室内使用加湿器",m:"人工泪液：玻璃酸钠滴眼液<br>严重：环孢素滴眼液（需处方）<br>中药：石斛夜光丸、杞菊地黄丸"},
{kw:["结膜炎","红眼病","眼睛发红","眼部感染","眼屎多"],t:"结膜炎",c:"<span class='tag'>西医</span>结膜炎症，分病毒性（水样分泌物、高度传染）、细菌性（黄脓分泌物）、过敏性（眼痒明显）。<br><span class='tag'>中医</span>天行赤眼/暴风客热，分型：风热外袭、热毒壅盛、肺胃热盛。",d:"病毒性和细菌性：温毛巾敷眼，勤洗双手<br>过敏性：冷敷，避免揉眼<br>忌戴隐形眼镜直至痊愈",m:"病毒性：自愈，人工泪液缓解不适<br>细菌性：左氧氟沙星滴眼液<br>过敏性：奥洛他定滴眼液<br>⚠️ 症状加重/影响视力需就诊"},
{kw:["甲状腺功能异常","甲亢","甲减","甲状腺结节","tsh异常"],t:"甲状腺疾病",c:"<span class='tag'>西医</span>甲状腺功能亢进（Graves病多见）、甲状腺功能减退（桥本甲状腺炎多见）、甲状腺结节（多数为良性）。<br><span class='tag'>中医</span>瘿病，分型：气滞痰凝、肝火旺盛、心肝阴虚、脾肾阳虚。",d:"甲亢：高热量、高蛋白饮食（消耗大），忌碘盐、海带、紫菜<br>甲减：适量碘摄入，多吃含硒食物（巴西坚果/鱼类）<br>甲状腺结节：忌高碘，定期复查超声",m:"甲亢：甲巯咪唑/丙硫氧嘧啶（需内分泌科处方，监测肝功能/白细胞）<br>甲减：左甲状腺素（优甲乐），终身服药<br>⚠️ 甲状腺疾病需定期复查甲状腺功能"},
{kw:["勃起功能障碍","ed","阳痿","性功能下降","早泄"],t:"勃起功能障碍（ED）",c:"<span class='tag'>西医</span>阴茎血流不足（动脉性）或静脉漏（静脉性），常与高血压/糖尿病/高血脂/吸烟相关。心理因素也是重要原因。<br><span class='tag'>中医</span>阳痿/阴痿，分型：命门火衰、心脾受损、肝郁气滞、湿热下注。",d:"有氧运动改善血管功能（快走/慢跑）<br>地中海饮食：西瓜（含瓜氨酸）、坚果、红酒（适量）<br>减轻压力，保证睡眠",m:"西药：西地那非（万艾可）/他达拉非（希爱力）（需医生评估心血管风险）<br>中药：金匮肾气丸、五子衍宗丸<br>⚠️ 勿从非正规渠道购药"},
{kw:["少精","弱精","精子质量","男性不育","精液异常"],t:"少弱精子症",c:"<span class='tag'>西医</span>精子浓度<1500万/ml（少精），前向运动精子<32%（弱精）。常见原因：精索静脉曲张、激素异常、感染等。<br><span class='tag'>中医</span>精少/不育，分型：肾精亏虚、肾阳不足、气血两虚、湿热下注。",d:"忌桑拿/热水浴（高温杀精）<br>补充锌（牡蛎/牛肉）、硒（巴西坚果）、辅酶Q10<br>戒烟，限酒，避免久坐",m:"精索静脉曲张：手术治疗<br>激素异常：克罗米芬（需生殖科医生指导）<br>中药：五子衍宗丸、生精片<br>⚠️ 建议生殖医学科就诊"},
  {t:"疲劳乏力",c:"【西医】常见于贫血、甲减、慢性感染、肿瘤早期。【中医】气虚或气血两虚，建议查血常规、甲功。",k:["乳腺增生","乳房胀痛","乳腺结节"]},
  {t:"头晕",c:"【西医】颈椎病、美尼尔病、贫血、低血糖、高血压、脑供血不足。【中医】肝阳上亢或气血不足。",k:["头晕"]},
  {t:"腹胀",c:"【西医】消化不良、胃肠功能紊乱、肝病。【中医】脾胃气滞或湿阻中焦。",k:["腹胀"]},
  {t:"手脚麻木",c:"【西医】糖尿病周围神经病变、颈椎病、腰椎病、脑血管病。【中医】气血不畅，痹阻经络。",k:["手脚麻木"]},
  {t:"夜汗盗汗",c:"【西医】结核病、更年期、甲亢、感染。【中医】阴虚内热或气虚不固。",k:["夜汗盗汗"]},
  {t:"胸闷",c:"【西医】冠心病、焦虑症、肺部疾病。【中医】气滞血瘀或胸阳不振。",k:["胸闷"]},
  {t:"浮肿",c:"【西医】心源性/肾源性/肝源性水肿、甲减。【中医】脾虚水停或肾虚水泛。",k:["浮肿"]},
  {t:"喉咙痛",c:"【西医】急性咽炎/扁桃体炎、反流性咽喉炎。【中医】风热或风寒袭肺。",k:["喉咙痛"]},
  {t:"声音嘶哑",c:"【西医】急性喉炎、声带小结、声带麻痹。【中医】肺肾阴虚或风寒束肺。",k:["声音嘶哑"]},
  {t:"流鼻血",c:"【西医】鼻黏膜干燥、高血压、血液病。【中医】肺热或肝火上炎。",k:["流鼻血"]},
  {t:"中耳炎",c:"【西医】急性化脓性中耳炎、分泌性中耳炎。【中医】肝胆湿热。",k:["中耳炎","耳朵流脓","耳朵疼","耳痛","耳道流脓"]},
  {t:"更年期综合征",c:"【西医】雌激素下降，潮热+情绪波动。【中医】肾阴阳两虚，肝气不舒。",k:["围绝经期","更年期","更年期综合征"]},
  {t:"乳腺增生",c:"【西医】乳腺囊性增生病，激素相关。【中医】肝气郁结、痰瘀互结。",k:["乳房胀痛","乳腺增生","乳腺结节"]},
  {t:"子宫肌瘤",c:"【西医】良性肿瘤，激素依赖性。【中医】气滞血瘀。",k:["子宫肌瘤","子宫肿物","月经量多"]},
  {t:"卵巢囊肿",c:"【西医】功能性囊肿、巧克力囊肿、畸胎瘤。【中医】痰湿凝聚。",k:["卵巢囊肿"]},
  {t:"盆腔炎",c:"【西医】上行感染，急性/慢性。【中医】湿热下注。",k:["盆腔炎"]},
  {t:"阴道炎",c:"【西医】念珠菌性、细菌性、滴虫性。【中医】湿热下注。",k:["阴道炎"]},
  {t:"备孕调理",c:"【西医】孕前检查、叶酸补充。【中医】补肾填精，调理气血。",k:["备孕调理"]},
  {t:"产后恢复",c:"【西医】子宫复旧、盆底肌评估。【中医】补气养血、活血化瘀。",k:["产后恢复"]},
  {t:"早泄",c:"【西医】心理性/器质性。【中医】肾气不固或阴虚火旺。",k:["早泄","射精过快"]},
  {t:"前列腺增生",c:"【西医】BPH，良性增生，常见于中老年。【中医】肾虚血瘀。",k:["前列腺增生","BPH","尿频夜尿多"]},
  {t:"腰椎间盘突出",c:"【西医】髓核突出压迫神经根。【中医】肾虚+风寒湿邪+血瘀。",k:["腰椎间盘突出","腰突","腰腿痛","坐骨神经痛"]},
  {t:"坐骨神经痛",c:"【西医】腰椎间盘突出、梨状肌综合征。【中医】寒湿阻滞或瘀血阻络。",k:["坐骨神经痛"]},
  {t:"膝关节疼痛",c:"【西医】骨关节炎、半月板损伤、韧带损伤。【中医】肝肾亏虚+风寒湿痹。",k:["膝关节疼痛"]},

  {t:"地中海贫血",c:"【西医】地贫，珠蛋白合成障碍。【中医】血虚，肾精不足。",k:["地贫","气血不足","海洋性贫血","珠蛋白","缺铁性贫血","面色苍白"]},,

  {t:"下肢静脉曲张",c:"【西医】VV，浅静脉迂曲。【中医】筋瘤，气滞血瘀。",k:["静脉曲张","腿上青筋"]},,
  {t:"血栓闭塞性脉管炎",c:"【西医】TAO，吸烟相关，肢体缺血。【中医】脱疽，寒湿痹阻。",k:["脉管炎","Buerger病","TAO"]},{kw:["库欣","皮质醇增多","满月脸","向心性肥胖","皮质醇高"],t:"库欣综合征",c:"<span class='tag'>西医</span>皮质醇长期过多。满月脸、向心性肥胖、紫纹、高血压、血糖升高。垂体腺瘤（70%）或肾上腺肿瘤。<br><span class='tag'>中医</span>肝郁脾虚湿困、肾阴不足。",d:"低盐低糖高蛋白饮食<br>避免甘草制品<br>山药薏米粥健脾"},{kw:["艾迪森","肾上腺功能减退","皮肤发黑","低血压","乏力嗜盐"],t:"肾上腺皮质功能减退（艾迪森病）",c:"<span class='tag'>西医</span>肾上腺皮质激素分泌不足。皮肤黏膜色素沉着、低血压、乏力、低钠高钾、嗜盐。<br><span class='tag'>中医</span>命门火衰、脾肾阳虚。",d:"适当增加盐摄入<br>规律服药（激素替代）<br>参附汤温阳"},{kw:["甲状旁腺","高钙","低钙","骨质疏松反复","肾结石反复"],t:"甲状旁腺功能亢进",c:"<span class='tag'>西医</span>甲状旁腺激素过多致高钙血症。骨痛、肾结石、消化性溃疡、精神症状。原发性多见腺瘤。<br><span class='tag'>中医</span>肾精亏虚、痰瘀互结。",d:"低钙饮食（避免大量乳制品）<br>多饮水防肾结石<br>枸杞杜仲煲汤补肾"},{kw:["多囊卵巢","多毛","月经稀发","肥胖不孕","PCOS"],t:"多囊卵巢综合征（代谢型）",c:"<span class='tag'>西医</span>胰岛素抵抗+高雄激素。肥胖型多见，黑棘皮征，血脂异常，远期糖尿病/心血管风险高。<br><span class='tag'>中医</span>痰湿内蕴、脾虚湿盛。",d:"低GI饮食、减重5-10%可改善排卵<br>山楂荷叶茶<br>苍附导痰汤化湿"},{kw:["垂体瘤","泌乳素高","闭经泌乳","肢端肥大","巨人症"],t:"垂体瘤",c:"<span class='tag'>西医</span>功能性垂体腺瘤：泌乳素瘤（闭经泌乳）、生长激素瘤（肢端肥大）、ACTH瘤（库欣）。无功能性以压迫症状为主（头痛、视野缺损）。<br><span class='tag'>中医</span>痰瘀阻窍、肝郁化火。",d:"定期MRI随访<br>溴隐亭随餐服用减胃刺激<br>天麻钩藤饮平肝"},{kw:["一氧化碳中毒","煤气中毒","CO中毒","头晕恶心","意识模糊"],t:"一氧化碳中毒",c:"<span class='tag'>西医</span>CO与血红蛋白结合力是O₂的200倍。头痛头晕→恶心呕吐→意识障碍→昏迷。冬季煤炉/燃气热水器常见。<br><span class='tag'>中医</span>邪毒闭窍。",d:"立即开窗通风、移至新鲜空气处<br>高压氧治疗<br>恢复期忌剧烈运动"},{kw:["有机磷中毒","农药中毒","瞳孔缩小","流涎","肌颤"],t:"有机磷农药中毒",c:"<span class='tag'>西医</span>胆碱酯酶抑制。毒蕈碱样（瞳孔缩小、流涎、出汗、腹痛腹泻）+烟碱样（肌颤、无力）+中枢（意识障碍）。<br><span class='tag'>中医</span>毒邪犯肺、蒙蔽心窍。",d:"立即脱离现场、脱去污染衣物<br>阿托品+氯磷定<br>禁止催吐（意识不清时）"},{kw:["食物中毒","急性胃肠炎","集体发病","呕吐腹泻","恶心腹痛"],t:"食物中毒",c:"<span class='tag'>西医</span>细菌毒素（沙门菌、金葡菌、大肠杆菌）或化学污染。集体发病、急性呕吐腹泻、发热。<br><span class='tag'>中医</span>饮食不洁、秽浊犯胃。",d:"补液防脱水（ORS）<br>保留呕吐物/食物样本送检<br>藿香正气水化湿和胃"},{kw:["酒精中毒","醉酒","急性酒精","断片","酒精戒断"],t:"急性酒精中毒",c:"<span class='tag'>西医</span>血乙醇>50mg/dL出现兴奋期，>150mg/dL共济失调，>300mg/dL昏迷呼吸抑制。戒断可致震颤谵妄。<br><span class='tag'>中医</span>酒毒内蕴、痰热扰心。",d:"侧卧防误吸<br>浓茶醒酒（轻症）<br>葛花解酒汤"},{kw:["溺水","窒息","缺氧","心肺复苏","海水淡水"],t:"溺水",c:"<span class='tag'>西医</span>淡水溺水→低钠溶血；海水溺水→高钠肺水肿。核心是缺氧。立即CPR，不考虑体位排水。<br><span class='tag'>中医</span>水浊闭肺、阳气暴脱。",d:"立即呼叫急救、持续CPR<br>不要倒挂控水（无效且有害）<br>恢复后注意肺并发症"},{kw:["中暑","热射病","热衰竭","高温","体温过高"],t:"中暑",c:"<span class='tag'>西医</span>先兆（口渴乏力）→轻症（体温>38℃、面色潮红）→重症（热射病>40℃、无汗、意识障碍，死亡率50%+）。<br><span class='tag'>中医</span>暑邪伤津、气阴两脱。",d:"移至阴凉通风处<br>物理降温（冰敷颈部/腋下/腹股沟）<br>生脉饮益气养阴"},{kw:["创伤后应激","PTSD","闪回","噩梦","警觉增高"],t:"创伤后应激障碍（PTSD）",c:"<span class='tag'>西医</span>经历/目睹重大创伤后持续>1月：侵入性回忆（闪回/噩梦）、回避、负性认知情绪、高警觉。首选EMDR或延长暴露治疗。<br><span class='tag'>中医</span>惊恐伤肾、心胆气虚。",d:"规律运动（有氧减轻警觉）<br>睡前避免创伤相关刺激<br>甘麦大枣汤养心安神"},{kw:["躁郁症","双相","躁狂发作","情绪高涨","精力旺盛"],t:"双相情感障碍",c:"<span class='tag'>西医</span>躁狂发作（情绪高涨/易激惹+精力旺盛+睡眠需要减少+夸大）与抑郁发作交替。I型有躁狂，II型有轻躁狂。锂盐一线。<br><span class='tag'>中医</span>癫狂交替、痰火扰心与心脾两虚交替。",d:"严格规律作息（睡眠节律关键）<br>避免酒精和咖啡因<br>心境日记追踪情绪波动"},{kw:["惊恐发作","恐慌症","突然害怕","心悸窒息感","濒死感"],t:"惊恐障碍",c:"<span class='tag'>西医</span>反复突发强烈恐惧伴躯体症状：心悸、胸闷、窒息感、濒死感、手脚麻木。10分钟达高峰。常被误诊为心脏病。<br><span class='tag'>中医</span>心胆气虚、肝郁气滞。",d:"腹式呼吸训练（4-7-8呼吸法）<br>认知：这是焦虑不是心脏病<br>柴胡加龙骨牡蛎汤镇惊"},{kw:["厌食症","神经性厌食","进食障碍","极度消瘦","害怕胖"],t:"神经性厌食",c:"<span class='tag'>西医</span>限制饮食能量摄入致显著低体重，强烈恐惧体重增加，体像障碍。并发症：心律失常、骨质疏松、闭经、电解质紊乱。<br><span class='tag'>中医</span>脾胃虚弱、气血两亏。",d:"循序渐进增加热量<br>专业心理治疗（CBT-E）<br>山药粥、小米粥养胃"},{kw:["暴食症","暴饮暴食","催吐","进食障碍","情绪性进食"],t:"暴食症",c:"<span class='tag'>西医</span>反复发作性暴食（短时间内大量进食+失控感）。暴食后可能催吐/泻药代偿（贪食症）或无代偿（暴食障碍）。常伴抑郁焦虑。<br><span class='tag'>中医</span>肝郁化火、胃热炽盛。",d:"规律三餐减少饥饿诱发暴食<br>正念饮食练习<br>丹栀逍遥散疏肝清热"},{kw:["ADHD","注意缺陷","多动症","注意力不集中","冲动"],t:"成人ADHD",c:"<span class='tag'>西医</span>注意力缺陷多动障碍成人延续率约60%。表现：注意力涣散、拖延、时间管理差、冲动消费/驾驶。常被误诊为焦虑抑郁。<br><span class='tag'>中医</span>心肾不交、髓海不足。",d:"番茄钟工作法25+5分钟<br>药物+行为治疗结合最有效<br>远志菖蒲开窍宁神"},{kw:["小儿肺炎","儿童肺炎","咳嗽发烧","呼吸急促","肺部啰音"],t:"小儿肺炎",c:"<span class='tag'>西医</span>婴幼儿常见重症感染。发热、咳嗽、气促、发绀、肺部啰音。细菌（肺炎链球菌）病毒（RSV）支原体。<br><span class='tag'>中医</span>风热闭肺、痰热壅肺。",d:"及时就医、遵医嘱用抗生素/抗病毒<br>少量多次喂水<br>拍背助排痰"},{kw:["佝偻病","维生素D缺乏","O型腿","鸡胸","方颅"],t:"维生素D缺乏性佝偻病",c:"<span class='tag'>西医</span>维生素D不足致钙磷代谢异常。早期易惊多汗→激期骨骼改变（方颅、鸡胸、O/X型腿）→恢复期。<br><span class='tag'>中医</span>五迟五软、脾肾两虚。",d:"维生素D 400-800IU/日预防<br>适当户外日照<br>龙骨牡蛎粥补钙"},{kw:["手足口病","HFMD","口腔疱疹","手足皮疹","儿童传染"],t:"手足口病",c:"<span class='tag'>西医</span>柯萨奇病毒A16/肠道病毒71型。口腔疱疹+手足皮疹+发热。EV71型可致脑炎。托幼机构高发。<br><span class='tag'>中医</span>湿热疫毒、邪犯肺脾。",d:"隔离至症状消失后1周<br>清淡流质饮食（口腔痛）<br>金银花连翘清热解毒"},{kw:["百日咳","痉挛性咳嗽","鸡鸣样回声","长时间咳嗽","儿童疫苗"],t:"百日咳",c:"<span class='tag'>西医</span>百日咳鲍特菌。卡他期（类感冒）→痉咳期（阵发性痉挛咳嗽+鸡鸣样吸气声，持续2-6周）→恢复期。婴儿可窒息。<br><span class='tag'>中医</span>顿咳、疫毒犯肺。",d:"及时接种疫苗（DTaP）<br>红霉素早期治疗有效<br>百合固金汤润肺止咳"},{kw:["鼻咽癌","回缩性涕血","颈部淋巴结","EB病毒","南方高发"],t:"鼻咽癌",c:"<span class='tag'>西医</span>EB病毒相关，中国南方高发。回缩性涕血、单侧耳鸣/听力下降、颈上深淋巴结肿大。放疗为主。<br><span class='tag'>中医</span>痰瘀互结、热毒蕴肺。",d:"放疗期间养阴清热（沙参麦冬汤）<br>口腔护理防放射性龋齿<br>避免咸鱼等腌制食品"},{kw:["甲状腺癌","甲状腺结节","乳头状癌","髓样癌"],t:"甲状腺癌",c:"<span class='tag'>西医</span>乳头状癌（80%+，预后好）、滤泡状癌、髓样癌、未分化癌。无痛性甲状腺结节、声嘶、颈淋巴结。<br><span class='tag'>中医</span>气滞痰凝、瘀毒互结。",d:"术后优甲乐替代+TSH抑制<br>定期复查甲状腺球蛋白<br>海藻昆布散结（术前）"},{kw:["膀胱癌","血尿","无痛性血尿","尿路上皮癌"],t:"膀胱癌",c:"<span class='tag'>西医</span>尿路上皮癌为主。无痛性肉眼血尿为最常见首发症状。吸烟是首位危险因素。表浅癌经尿道切除+膀胱灌注。<br><span class='tag'>中医</span>湿热下注、瘀毒蕴结。",d:"戒烟（最重要）<br>多饮水稀释尿液<br>白花蛇舌草清热解毒"},{kw:["渐冻症","ALS","肌萎缩侧索硬化","肌肉无力","运动神经元"],t:"肌萎缩侧索硬化（渐冻症）",c:"<span class='tag'>西医</span>上下运动神经元同时受累。进行性肌无力萎缩+肌束颤动+腱反射亢进+病理征。感觉正常。3-5年进展。<br><span class='tag'>中医</span>痿证、脾肾两虚、肝风内动。",d:"力如太延缓进展<br>呼吸支持（BiPAP）<br>黄芪益气、杜仲补肾"},{kw:["重症肌无力","眼睑下垂","肌无力波动","晨轻暮重","胸腺瘤"],t:"重症肌无力",c:"<span class='tag'>西医</span>神经肌肉接头自身免疫病（抗AChR抗体）。晨轻暮重、活动后加重休息缓解。眼肌型（上睑下垂/复视）→全身型。胸腺瘤相关。<br><span class='tag'>中医</span>脾虚气陷、气血两虚。",d:"规律服药（溴吡斯的明）<br>避免过劳和感染（可诱发危象）<br>补中益气汤升提中气"},{kw:["多发性硬化","MS","脱髓鞘","视力下降","肢体麻木"],t:"多发性硬化",c:"<span class='tag'>西医</span>中枢神经系统脱髓鞘自身免疫病。青年女性多见。复发-缓解型最常见。视力下降、肢体麻木无力、共济失调、排尿障碍。<br><span class='tag'>中医</span>肝肾阴虚、瘀阻脉络。",d:"维生素D补充（可能减少复发）<br>避免高温（Uhthoff现象）<br>熟地枸杞滋补肝肾"},{kw:["血友病","出血不止","关节出血","凝血因子","遗传性出血"],t:"血友病",c:"<span class='tag'>西医</span>X连锁隐性遗传。凝血因子Ⅷ（A型）或Ⅸ（B型）缺乏。关节腔反复出血→血友病关节病。轻微外伤后出血不止。<br><span class='tag'>中医</span>血热妄行、脾不统血。",d:"预防性凝血因子替代<br>避免剧烈运动和外伤<br>花生衣煎水止血辅助"},{kw:["地中海贫血","地贫","珠蛋白生成障碍","贫血遗传","小细胞低色素"],t:"地中海贫血（重型）",c:"<span class='tag'>西医</span>珠蛋白基因缺失/突变。α-地贫重型（Hb Bart胎儿水肿）β-地贫重型（依赖输血）。小细胞低色素贫血。两广海南高发。<br><span class='tag'>中医</span>先天禀赋不足、肾精亏虚。",d:"定期输血+去铁治疗<br>产前筛查和基因诊断<br>当归补血汤辅助"},{kw:["胃溃疡","消化性溃疡","胃痛餐后","黑便","Hp溃疡"],t:"消化性溃疡（胃溃疡）",c:"<span class='tag'>西医</span>胃黏膜防御与侵袭失衡。Hp感染（70%+）和NSAIDs为主因。餐后0.5-1h痛（胃溃疡）/空腹痛（十二指肠溃疡）。并发症：出血、穿孔、幽门梗阻。。<br><span class='tag'>中医</span>胃脘痛，肝胃不和（情志诱发）、脾胃虚寒（隐痛喜按）、瘀血阻络（刺痛固定）。",d:"规律三餐、细嚼慢咽<br>避免NSAIDs（布洛芬等）<br> Hp四联根除<br>黄芪建中汤温中"},{kw:["十二指肠溃疡","空腹痛","夜间胃痛","饥饿痛","球部溃疡"],t:"消化性溃疡（十二指肠溃疡）",c:"<span class='tag'>西医</span>十二指肠球部多见。空腹痛、夜间痛，进食可缓解。Hp感染率>90%。易复发。。<br><span class='tag'>中医</span>饥痛属虚，肝胃郁热多见。",d:"少量多餐缓解夜间痛<br> Hp根除预防复发<br>左金丸清肝和胃"},{kw:["肠系膜缺血","肠缺血","饭后腹痛","肠绞痛","血管狭窄"],t:"肠系膜缺血",c:"<span class='tag'>西医</span>急性：房颤栓子脱落→剧烈腹痛与体征不符。慢性：餐后腹痛+恐惧进食+消瘦（肠绞痛）。。<br><span class='tag'>中医</span>瘀血阻络、气滞血瘀。",d:"少量多餐低脂饮食<br>活血化瘀：丹参饮<br>急性需急诊手术"},{kw:["伪膜性肠炎","艰难梭菌","抗生素后腹泻","CDI","水样泻"],t:"伪膜性肠炎（艰难梭菌感染）",c:"<span class='tag'>西医</span>广谱抗生素后艰难梭菌过度繁殖。水样泻+发热+腹痛+白细胞升高。粪毒素检测确诊。。<br><span class='tag'>中医</span>湿热蕴结、脾虚湿盛。",d:"停用诱发抗生素<br>甲硝唑/万古霉素口服<br>山药薏米健脾渗湿"},{kw:["乳糜泻","麸质过敏","麸质不耐受","麦胶蛋白","小肠绒毛萎缩"],t:"乳糜泻",c:"<span class='tag'>西医</span>麸质蛋白致小肠绒毛萎缩→吸收不良。腹泻/脂肪泻/贫血/骨质疏松。HLA-DQ2/DQ8基因。。<br><span class='tag'>中医</span>脾虚湿盛、气血两亏。",d:"严格无麸质饮食（禁小麦/大麦/黑麦）<br>大米/玉米/薯类替代<br>参苓白术散健脾"},{kw:["肺脓肿","咳脓痰","高热咳嗽","厌氧菌肺炎","空洞性病变"],t:"肺脓肿",c:"<span class='tag'>西医</span>厌氧菌为主。高热+咳大量脓臭痰。吸入性（醉酒/意识障碍）>血源性>继发性。影像见空洞液平。。<br><span class='tag'>中医</span>肺痈，热毒壅肺、化腐成脓。",d:"体位引流促排痰<br>高蛋白高维生素饮食<br>苇茎汤+桔梗汤排脓"},{kw:["胸腔积液","胸水","液气胸","呼吸困难","胸痛"],t:"胸腔积液",c:"<span class='tag'>西医</span>渗出液（结核/肿瘤/肺炎）vs漏出液（心衰/肾病/肝硬化）。呼吸困难+患侧呼吸音减低。。<br><span class='tag'>中医</span>悬饮，饮停胸胁。",d:"低盐饮食（漏出液）<br>葶苈大枣泻肺汤泻饮<br>病因治疗为主"},{kw:["气胸","肺大疱破裂","突发胸痛","呼吸困难瘦高","自发性气胸"],t:"自发性气胸",c:"<span class='tag'>西医</span>瘦高青年（原发性）或COPD（继发性）。突发胸痛+呼吸困难。患侧呼吸音消失、叩诊鼓音。。<br><span class='tag'>中医</span>胸中气滞、肺失肃降。",d:"绝对卧床休息<br>少量可自行吸收<br>反复发作考虑胸膜固定术"},{kw:["结节病","肉芽肿","肺门淋巴结","ACE升高","葡萄膜炎"],t:"结节病",c:"<span class='tag'>西医</span>多系统非干酪性肉芽肿。肺门淋巴结肿大+结节性红斑+葡萄膜炎。ACE升高。多数自限。。<br><span class='tag'>中医</span>痰瘀互结、气滞血瘀。",d:"多数不需治疗可自愈<br>激素用于进展期<br>夏枯草散结"},{kw:["主动脉夹层","撕裂样胸痛","背部痛","高血压急症","马凡综合征"],t:"主动脉夹层",c:"<span class='tag'>西医</span>内膜撕裂→血液进入中膜形成假腔。突发撕裂样胸背痛+血压差异>20mmHg。Stanford A型需紧急手术。。<br><span class='tag'>中医</span>气血逆乱、瘀阻脉道。",d:"绝对卧床、控制血压和心率<br>紧急手术（A型）<br>活血通络：血府逐瘀汤"},{kw:["心包炎","胸痛前倾缓解","心包摩擦音","ST段抬高","心包积液"],t:"急性心包炎",c:"<span class='tag'>西医</span>胸痛+前倾坐位缓解+心包摩擦音。病毒性最常见。ECG弥漫ST抬高+PR压低。。<br><span class='tag'>中医</span>胸痹，饮停心包。",d:"休息+NSAIDs止痛<br>警惕心包填塞（Beck三联征）<br>葶苈大枣泻肺汤"},{kw:["心肌炎","病毒性心肌炎","感冒后心悸","心脏扩大","CKMB升高"],t:"病毒性心肌炎",c:"<span class='tag'>西医</span>柯萨奇B组病毒常见。感冒后1-3周出现心悸/胸闷/乏力。重者心衰/心律失常/猝死。。<br><span class='tag'>中医</span>温毒犯心、气阴两虚。",d:"严格休息3-6月<br>避免剧烈运动<br>生脉散益气养阴"},{kw:["肺动脉高压","PAH","右心肥厚","劳力性呼吸困难","晕厥"],t:"肺动脉高压",c:"<span class='tag'>西医</span>mPAP≥25mmHg。进行性劳力性呼吸困难+晕厥+右心衰。特发性/结缔组织病相关/先心相关。。<br><span class='tag'>中医</span>肺胀，气虚血瘀。",d:"低盐饮食、避免高海拔<br>靶向药物（波生坦等）<br>丹参活血化瘀"},{kw:["雷诺现象","手指发白发紫","冷刺激变色","小血管痉挛","结缔组织病"],t:"雷诺现象",c:"<span class='tag'>西医</span>寒冷/情绪诱发指端颜色三相变化（白→紫→红）。原发性（雷诺病）vs继发性（SLE/硬皮病相关）。。<br><span class='tag'>中医</span>阳虚寒凝、血行不畅。",d:"保暖防寒（核心）<br>戒烟<br>当归四逆汤温经散寒"},{kw:["脑梗死","脑梗","缺血性卒中","偏瘫","失语","溶栓"],t:"急性脑梗死",c:"<span class='tag'>西医</span>缺血性卒中最常见（80%）。动脉粥样硬化+血栓/心源性栓塞。偏瘫+失语+偏身感觉障碍。4.5h内rtPA溶栓。。<br><span class='tag'>中医</span>中风，中经络（风痰瘀阻）/中脏腑（闭证/脱证）。",d:"FAST识别：面臂言语时间<br>4.5h内溶栓是关键<br>补阳还五汤恢复期益气活血"},{kw:["脑出血","脑溢血","出血性卒中","高血压脑出血","意识障碍"],t:"脑出血",c:"<span class='tag'>西医</span>高血压最常见原因。基底节区最常见。突发头痛+呕吐+意识障碍+偏瘫。CT即确诊。。<br><span class='tag'>中医</span>中风，肝阳暴亢、气血上逆。",d:"控制血压（最重要预防）<br>手术清除血肿（适应证时）<br>镇肝熄风汤平肝潜阳"},{kw:["蛛网膜下腔出血","SAH","雷击样头痛","脑膜刺激征","动脉瘤破裂"],t:"蛛网膜下腔出血",c:"<span class='tag'>西医</span>动脉瘤破裂最常见。突发雷击样头痛（一生最剧烈）+脑膜刺激征+意识障碍。CT见蛛网膜下腔高密度。。<br><span class='tag'>中医</span>血瘀脑窍、肝风内动。", ",d:"低GI饮食、忌奶制品<br>异维A酸（重度首选）<br>枇杷清肺饮清肺胃热"},{kw:["脱发","斑秃","鬼剃头","雄激素脱发","脂溢性脱发"],t:"斑秃",c:"<span class='tag'>西医</span>自身免疫攻击毛囊。圆形/椭圆形脱发区。全秃/普秃。多可自愈，但反复发作需治疗。。<br><span class='tag'>中医</span>油风、血虚风盛。",d:"避免精神紧张<br>局部激素注射<br>七宝美髯丹养血生发"},{kw:["雄激素脱发","AGA","发际线后退","地中海","遗传脱发","M型脱发"],t:"雄激素性脱发",c:"<span class='tag'>西医</span>遗传+雄激素。男性：M型→头顶。女性：弥漫性头顶稀疏。毛囊5α-还原酶→DHT萎缩。。<br><span class='tag'>中医</span>肝肾不足、精血亏虚。",d:"非那雄胺+米诺地尔（黄金组合）<br>早期治疗优于晚期<br>二至丸滋补肝肾"},{kw:["冻疮","手脚冻伤","红肿痒痛","冬季皮肤","末梢循环差"],t:"冻疮",c:"<span class='tag'>西医</span>寒冷致末梢血管痉挛→淤血性炎症。手足耳好发。红肿+瘙痒+温水后加重。。<br><span class='tag'>中医</span>寒凝血瘀、阳气不达。",d:"保暖+锻炼改善循环<br>当归四逆汤温经散寒<br>切忌火烤/热水烫"},{kw:["子宫脱垂","阴道壁膨出","下坠感","盆底松弛","产后脱垂"],t:"子宫脱垂",c:"<span class='tag'>西医</span>盆底支持组织薄弱。I-III度。下腹坠胀+阴道肿物脱出+排尿困难。多产/产后重体力劳动。。<br><span class='tag'>中医</span>阴挺、气虚下陷。",d:"盆底肌训练（Kegel）<br>子宫托（不愿手术者）<br>补中益气汤升提中气"},{kw:["葡萄胎","绒毛膜癌","侵蚀性葡萄胎","HCG极高","妊娠滋养细胞"],t:"葡萄胎",c:"<span class='tag'>西医</span>妊娠滋养细胞异常增生。完全性（无胚胎）vs部分性。停经后阴道流血+HCG异常升高+子宫大于孕周。。<br><span class='tag'>中医</span>鬼胎、瘀血内阻。",d:"清宫术后定期随访HCG<br>避孕1年<br>生化汤化瘀"},{kw:["先兆子痫","子痫","妊娠高血压","蛋白尿","水肿"],t:"子痫前期/子痫",c:"<span class='tag'>西医</span>妊娠20周后高血压+蛋白尿。重度：头痛/视物模糊/上腹痛。子痫=抽搐。胎盘早剥/HELLP风险。。<br><span class='tag'>中医</span>子痫，脾虚肝旺/阴虚肝旺。",d:"左侧卧位休息<br>硫酸镁防抽搐<br>适时终止妊娠（根本治疗）"},{kw:["产后抑郁","产后情绪低落","哭泣","育婴焦虑","产后6周"],t:"产后抑郁症",c:"<span class='tag'>西医</span>产后6周内发病。情绪低落+哭泣+对婴儿冷漠+自责+严重时杀婴/自杀念头。激素剧变+心理社会因素。。<br><span class='tag'>中医</span>脏躁、心脾两虚。",d:"家庭支持（最重要）<br>心理治疗（CBT）<br>甘麦大枣汤养心安神"},{kw:["子宫内膜异位症","巧克力囊肿","痛经进行性加重","性交痛","不孕"],t:"子宫内膜异位症（深部浸润型）",c:"<span class='tag'>西医</span>子宫内膜组织出现在子宫肌层以外。进行性痛经+性交痛+不孕。卵巢巧克力囊肿。腹腔镜确诊。。<br><span class='tag'>中医</span>痛经、瘀血阻滞胞宫。",d:"桂枝茯苓丸化瘀消癥<br>GnRH-a（假绝经疗法）<br>热敷下腹缓解疼痛"},{kw:["包皮龟头炎","包皮红肿","龟头痒","包皮垢","念珠菌龟头"],t:"包皮龟头炎",c:"<span class='tag'>西医</span>包皮/龟头炎症。感染性（念珠菌/细菌/滴虫）vs非感染性（接触性/固定药疹）。包皮过长者易发。。<br><span class='tag'>中医</span>阴头疮、湿热下注。",d:"保持清洁干燥<br>翻洗包皮<br>龙胆泻肝汤清下焦湿热"},{kw:["精囊炎","血精","射精带血","下腹隐痛","前列腺炎相关"],t:"精囊炎",c:"<span class='tag'>西医</span>精囊炎症。血精为特征性表现。多与前列腺炎并存。细菌感染/结核/肿瘤需鉴别。。<br><span class='tag'>中医</span>血精、阴虚火旺。",d:"避免频繁手淫/性交<br>抗生素治疗<br>知柏地黄丸滋阴降火"},{kw:["视网膜脱离","闪光感","飞蚊症增多","视野缺损","高度近视"],t:"视网膜脱离",c:"<span class='tag'>西医</span>视网膜神经上皮层与色素上皮分离。闪光感+飞蚊突然增多+视野黑幕。高度近视/外伤/白内障术后高危。。<br><span class='tag'>中医</span>暴盲、气虚血瘀。",d:"急诊手术（巩膜扣带/玻璃体切割）<br>术前卧床避免剧烈运动<br>益气聪明汤"},{kw:["黄斑变性","AMD","老年黄斑","视力下降","视物变形"],t:"老年性黄斑变性",c:"<span class='tag'>西医</span>50岁以上中心视力下降主因。干性（萎缩性，缓慢）vs湿性（渗出性，急骤，CNV出血）。。<br><span class='tag'>中医</span>视瞻昏渺、肝肾不足。",d:"AREDS2配方（叶黄素+玉米黄质）<br>湿性：抗VEGF眼内注射<br>杞菊地黄丸滋补肝肾"},{kw:["结膜炎","红眼病","眼红","分泌物","传染性结膜炎"],t:"急性结膜炎",c:"<span class='tag'>西医</span>细菌（脓性分泌物）/病毒（水样分泌物）/过敏性（痒）。接触传染。。<br><span class='tag'>中医</span>天行赤眼、风热犯目。",d:"勤洗手、不揉眼<br>冷敷缓解<br>银翘散疏风清热"},{kw:["角膜炎","眼痛","畏光流泪","角膜浸润","视力下降"],t:"角膜炎",c:"<span class='tag'>西医</span>感染性（细菌/病毒/真菌）>非感染性。眼痛+畏光+流泪+视力下降。病毒性（单纯疱疹）易复发。。<br><span class='tag'>中医</span>聚星障、风热/肝火犯目。",d:"不自行用激素眼药水<br>抗感染治疗<br>石决明散清肝明目"},{kw:["美尼尔病","梅尼埃","眩晕反复","耳鸣","听力波动"],t:"梅尼埃病",c:"<span class='tag'>西医</span>膜迷路积水。反复发作性眩晕（20min-12h）+波动性听力下降+耳鸣+耳闷。低频感音神经性聋。。<br><span class='tag'>中医</span>眩晕、痰浊中阻/肝阳上亢。",d:"低盐饮食（<1.5g/日）<br>倍他司汀改善微循环<br>半夏白术天麻汤化痰熄风"},{kw:["声带息肉","声音嘶哑","用嗓过度","声带小结","教师歌手"],t:"声带息肉/小结",c:"<span class='tag'>西医</span>用嗓不当致声带边缘息肉样变。持续性声音嘶哑。教师/歌手高发。小结双侧对称，息肉多单侧。。<br><span class='tag'>中医</span>喉喑、肺肾阴虚。",d:"声休（最重要）<br>纠正发声方法<br>麦味地黄丸滋阴润嗓"},{kw:["颞下颌关节紊乱","TMJ","张口弹响","咬合痛","下巴痛"],t:"颞下颌关节紊乱综合征",c:"<span class='tag'>西医</span>咀嚼肌/关节盘/关节病变。张口弹响+疼痛+张口受限。夜磨牙/紧咬牙/精神紧张相关。。<br><span class='tag'>中医</span>颊车风、风寒湿痹。",d:"软食、避免大张口<br>热敷+按摩咀嚼肌<br>针灸下关/颊车穴"},{kw:["代谢综合征","三高","腹型肥胖","胰岛素抵抗","中心性肥胖"],t:"代谢综合征",c:"<span class='tag'>西医</span>腹型肥胖+血脂异常+高血压+高血糖。核心是胰岛素抵抗。心血管事件风险2-3倍。。<br><span class='tag'>中医</span>痰湿内蕴、脾虚失运。",d:"减重5-10%获益最大<br>地中海饮食模式<br>二陈汤+平胃散化痰湿"},{kw:["营养不良","蛋白质缺乏","消瘦","肌肉萎缩","微量元素缺乏"],t:"蛋白质-能量营养不良",c:"<span class='tag'>西医</span>摄入不足/吸收障碍/消耗过多。体重下降+肌肉萎缩+水肿（低蛋白）+免疫力低下。。<br><span class='tag'>中医</span>虚劳、脾胃虚弱。",d:"循序渐进增加热量<br>优质蛋白优先<br>参苓白术散健脾助运"},{kw:["登革热","断骨热","蚊虫传播","高热皮疹","血小板下降"],t:"登革热",c:"<span class='tag'>西医</span>登革病毒经伊蚊传播。高热+头痛+肌肉骨关节剧痛+皮疹+出血倾向。二次感染重症风险高。。<br><span class='tag'>中医</span>暑温、湿热疫毒。",d:"防蚊灭蚊<br>补液防休克<br>清营汤凉血解毒"},{kw:["疟疾","寒战高热","间日疟","恶性疟","按蚊传播"],t:"疟疾",c:"<span class='tag'>西医</span>疟原虫经按蚊传播。周期性寒战-高热-大汗发作。恶性疟可致脑型疟（昏迷）。。<br><span class='tag'>中医</span>疟证、正邪交争。",d:"青蒿素及其衍生物（中国贡献）<br>小柴胡汤和解少阳<br>防蚊措施"},{kw:["伤寒","持续高热","玫瑰疹","相对缓脉","肥达反应"],t:"伤寒",c:"<span class='tag'>西医</span>伤寒沙门菌。持续高热1-2周+表情淡漠+相对缓脉+玫瑰疹+脾大。血培养确诊。。<br><span class='tag'>中医</span>湿温、湿热蕴结。",d:"饮食：无渣半流（防肠穿孔）<br>氟喹诺酮/三代头孢<br>三仁汤清利湿热"},{kw:["破伤风","牙关紧闭","苦笑面容","角弓反张","伤口感染"],t:"破伤风",c:"<span class='tag'>西医</span>破伤风梭菌外毒素。牙关紧闭+苦笑面容+角弓反张+光声刺激诱发痉挛。伤口污染史。。<br><span class='tag'>中医</span>金创痉、风毒入络。",d:"伤口清创+破伤风抗毒素<br>避免光声刺激<br>玉真散熄风解痉"},{kw:["狂犬病","恐水","被咬后","致死率100%","动物咬伤"],t:"狂犬病",c:"<span class='tag'>西医</span>狂犬病毒侵犯中枢神经系统。恐水+怕风+吞咽困难+流涎+痉挛。一旦发病致死率近100%。。<br><span class='tag'>中医</span>疯犬咬伤、风毒内攻。",d:"被咬后立即冲洗伤口15min<br>尽快注射狂犬疫苗+免疫球蛋白<br>预防是唯一有效手段"},{kw:["肺结核","TB","午后低热","盗汗","消瘦咳嗽"],t:"肺结核（复治/耐药）",c:"<span class='tag'>西医</span>复治：初治失败/复发。MDR-TB（耐异烟肼+利福平）治疗周期18-24月。XDR-TB更棘手。。<br><span class='tag'>中医</span>肺痨、阴虚火旺。",d:"全程督导化疗（DOTS）<br>月华丸滋阴润肺<br>隔离防传播"},{kw:["ebola","埃博拉","出血热","高死亡率","非洲疫情"],t:"埃博拉出血热",c:"<span class='tag'>西医</span>丝状病毒。突发高热+剧烈腹泻呕吐+出血（黏膜/内脏）。病死率25-90%。接触传播。。<br><span class='tag'>中医</span>疫毒内陷、气血两燔。",d:"严格隔离防护<br>补液支持治疗<br>清瘟败毒饮"},{kw:["铅中毒","铅暴露","腹痛贫血","发育迟缓","铅线"],t:"铅中毒",c:"<span class='tag'>西医</span>铅暴露致多系统损害。腹痛+贫血+周围神经病+肾损害。儿童更敏感→智力下降。血铅>100μg/L。。<br><span class='tag'>中医</span>铅毒伤脾、气虚血瘀。",d:"脱离铅暴露源<br>驱铅治疗（依地酸钙钠）<br>绿豆甘草汤解毒"},{kw:["酒精依赖","酒精成瘾","酗酒","长期饮酒","戒断症状"],t:"酒精使用障碍",c:"<span class='tag'>西医</span>长期大量饮酒→耐受+渴求+失控。戒断：震颤→幻觉→癫痫→震颤谵妄。Wernicke脑病（维生素B1缺乏）。。<br><span class='tag'>中医</span>酒癖、痰热扰心。",d:"维生素B1补充（防Wernicke）<br>苯二氮卓替代递减<br>葛花解酲汤解酒毒"},{kw:["矽肺","硅肺","尘肺","石粉肺","呼吸困难"],t:"矽肺",c:"<span class='tag'>西医</span>长期吸入游离SiO₂粉尘。最常见职业病。进行性呼吸困难+咳嗽+胸痛。影像：上肺区小结节影。。<br><span class='tag'>中医</span>肺痿、痰瘀互结。",d:"脱离粉尘环境<br>肺灌洗（早期）<br>百合固金汤养肺"},{kw:["噪声性耳聋","职业性耳聋","噪音损伤","高频听力下降","工厂工人"],t:"噪声性听力损失",c:"<span class='tag'>西医</span>长期噪声暴露致感音神经性聋。4000Hz切迹→高频下降→语频受累。不可逆。。<br><span class='tag'>中医</span>暴聋、肾精亏虚。",d:"佩戴防噪耳塞/耳罩<br>早期脱离噪声环境可部分恢复<br>耳聋左慈丸滋肾通窍"},{kw:["马凡综合征","蜘蛛指","主动脉扩张","晶状体脱位","结缔组织病"],t:"马凡综合征",c:"<span class='tag'>西医</span>FBN1基因突变致原纤维蛋白缺陷。四肢细长+蜘蛛指+晶状体脱位+主动脉根部扩张/夹层。。<br><span class='tag'>中医</span>先天禀赋不足、肝肾亏虚。",d:"定期心脏超声监测主动脉<br>β受体阻滞剂延缓扩张<br>避免剧烈运动"},{kw:["肝豆状核变性","Wilson病","铜代谢","K-F环","肝硬化和震颤"],t:"肝豆状核变性（Wilson病）",c:"<span class='tag'>西医</span>ATP7B基因突变→铜排出障碍→铜沉积于肝/脑/角膜。K-F环+肝硬化+锥体外系症状。。<br><span class='tag'>中医</span>肝风内动、痰瘀互结。",d:"青霉胺/曲恩汀驱铜<br>低铜饮食（忌贝壳类/坚果/巧克力）<br>肝豆汤促排铜"},{kw:["法布雷病","Fabry","α-半乳糖苷酶","肢端疼痛","少汗"],t:"法布雷病",c:"<span class='tag'>西医</span>X连锁溶酶体贮积症。α-半乳糖苷酶A缺乏→Gb3沉积。肢端灼痛+少汗+角膜浑浊+心肾受累。。<br><span class='tag'>中医</span>痹证、瘀血阻络。",d:"酶替代治疗（阿加糖酶）<br>镇痛管理<br>活血通络方"},{kw:["遗传性血管性水肿","HAE","反复肿胀","无荨麻疹","C1酯酶抑制物缺乏"],t:"遗传性血管性水肿",c:"<span class='tag'>西医</span>C1-INH缺乏致缓激肽增多。反复皮肤/黏膜水肿（不痒无荨麻疹）。喉头水肿可窒息致命。。<br><span class='tag'>中医</span>水肿、气虚不固。",d:"急性：C1-INH浓缩物/艾替班特<br>预防：达那唑<br>防创伤/手术诱发"},{kw:["小儿腹泻","秋季腹泻","轮状病毒","蛋花汤样便","脱水"],t:"小儿腹泻病",c:"<span class='tag'>西医</span>6月-2岁高发。病毒（轮状/诺如）>细菌。蛋花汤样/水样便。脱水是最主要危险。。<br><span class='tag'>中医</span>泄泻、脾虚湿盛。",d:"ORS补液防脱水（最重要）<br>继续喂养不停母乳<br>参苓白术散健脾止泻"},{kw:["小儿惊厥","热性惊厥","高热抽搐","翻白眼","牙关紧闭"],t:"热性惊厥",c:"<span class='tag'>西医</span>6月-5岁发热时惊厥。单纯型（全面性<15min24h内1次）预后好。复杂型需排除颅内感染。。<br><span class='tag'>中医</span>急惊风、热极生风。",d:"侧卧防误吸<br>不要塞东西入口<br>安定/地西泮止惊<br>羚角钩藤汤清热熄风"},{kw:["小儿先天性心脏病","先心","室缺","房缺","法洛四联症"],t:"先天性心脏病",c:"<span class='tag'>西医</span>出生时即存在的心脏结构异常。室缺最常见。法洛四联症：青紫型（蹲踞现象）。产前超声可筛查。。<br><span class='tag'>中医</span>胎怯、先天不足。",d:"产前超声筛查<br>小型室缺可自愈<br>手术时机由专科评估"},{kw:["小儿肾病综合征","大量蛋白尿","全身水肿","低蛋白","激素敏感"],t:"小儿肾病综合征",c:"<span class='tag'>西医</span>大量蛋白尿（>50mg/kg/d）+低蛋白血症+全身水肿+高脂血症。90%激素敏感（微小病变型）。。<br><span class='tag'>中医</span>水肿、脾肾两虚。",d:"激素治疗（足量足程）<br>低盐限水（水肿期）<br>防感染（免疫力低下）"},{kw:["老年性痴呆","阿尔茨海默","AD","记忆力下降","认知障碍"],t:"阿尔茨海默病",c:"<span class='tag'>西医</span>最常见痴呆病因（60-70%）。近期记忆下降→定向障碍→生活不能自理。β淀粉样蛋白+Tau蛋白。。<br><span class='tag'>中医</span>呆病、髓海不足/痰浊蒙窍。",d:"早期：胆碱酯酶抑制剂<br>认知训练+社交活动<br>还少丹补肾填精"},{kw:["血管性痴呆","VD","卒中后痴呆","阶梯式恶化","执行功能障碍"],t:"血管性痴呆",c:"<span class='tag'>西医</span>脑血管病致认知下降。卒中后/小血管病。阶梯式恶化（与AD的渐进不同）。执行功能受损突出。。<br><span class='tag'>中医</span>中风呆病、痰瘀阻窍。",d:"控制血管危险因素（血压/血糖/血脂）<br>抗血小板<br>通窍活血汤化瘀开窍"},{kw:["老年跌倒","骨质疏松跌倒","髋部骨折","平衡障碍","肌少症"],t:"老年跌倒综合征",c:"<span class='tag'>西医</span>65岁以上1/3每年跌倒。肌少症+平衡障碍+视力下降+药物（降压/镇静）+环境因素。髋部骨折1年死亡率20-30%。。<br><span class='tag'>中医</span>痿证、肝肾亏虚。",d:"改善家居环境（灯光/扶手/防滑）<br>平衡训练+肌力锻炼<br>二至丸+虎潜丸滋补肝肾"},{kw:["慢性疲劳综合征","CFS","ME","极度疲劳","运动后加重","脑雾"],t:"慢性疲劳综合征",c:"<span class='tag'>西医</span>持续6月以上无法解释的严重疲劳，运动后加重（PEM）。伴睡眠障碍/认知障碍（脑雾）/肌肉关节痛/咽痛。。<br><span class='tag'>中医</span>虚劳、气阴两虚。",d:" pacing策略（能量管理）<br>渐进性运动<br>生脉散益气养阴"},{kw:["纤维肌痛","全身疼痛","压痛点","睡眠差","疲劳"],t:"纤维肌痛综合征",c:"<span class='tag'>西医</span>慢性广泛性肌肉疼痛+9对（18个）压痛点中≥11个+疲劳+睡眠障碍+晨僵。常伴焦虑抑郁。。<br><span class='tag'>中医</span>痹证、肝郁脾虚。",d:"有氧运动（最有效）<br>认知行为治疗<br>柴胡疏肝散+芍药甘草汤"},{kw:["肠易激","IBS-C","便秘型肠易激","IBS-D","腹泻型肠易激"],t:"肠易激综合征（便秘型）",c:"<span class='tag'>西医</span>IBS-C：便秘为主+腹胀+排便不尽感。内脏高敏感+肠动力异常+脑-肠轴失调。罗马IV标准。。<br><span class='tag'>中医</span>便秘、气滞/阴虚肠燥。",d:"增加可溶性纤维（不是粗纤维）<br>渗透性泻药（乳果糖）<br>麻子仁丸润肠通便"},{kw:["多汗症","自汗盗汗","手脚多汗","头汗","腋汗"],t:"多汗症",c:"<span class='tag'>西医</span>局部或全身出汗过多。原发性（交感神经过度兴奋）：手掌/足底/腋下。继发性：甲亢/更年期/感染。。<br><span class='tag'>中医</span>自汗（气虚）、盗汗（阴虚）。",d:"止汗剂（氯化铝）<br>交感神经切断术（重症）<br>牡蛎散敛汗"},{kw:["痛风","尿酸高","关节红肿热痛","第一跖趾","啤酒海鲜"],t:"痛风（慢性期管理）",c:"<span class='tag'>西医</span>反复发作→痛风石+关节畸形+肾损害。降尿酸是核心：别嘌醇/非布司他/苯溴马隆。目标<360μmol/L。。<br><span class='tag'>中医</span>痛风石：痰瘀互结。",d:"严格低嘌呤饮食<br>每日饮水>2L促尿酸排泄<br>土茯苓萆薢分清泄浊"}];

// ========== KB Search ==========
function searchKB(q){
  q=q.toLowerCase();
  var best=null,bestScore=0;
  for(var i=0;i<KB.length;i++){
    var score=0;
    for(var j=0;j<KB[i].kw.length;j++){
      if(q.includes(KB[i].kw[j].toLowerCase()))score+=10;
      else if(KB[i].kw[j].toLowerCase().includes(q))score+=5;
      for(var k=0;k<Math.min(q.length,3);k++){
        if(KB[i].kw[j].toLowerCase().includes(q.substring(0,k+1)))score+=1;
      }
    }
    if(score>bestScore){bestScore=score;best=KB[i];}
  }
  return bestScore>=5?best:null;
}

// ========== Typewriter Effect ==========
function typewriter(msgDiv, fullText, prefixHTML){
  return new Promise(function(resolve){
    msgDiv.innerHTML = prefixHTML + '<span id="tw-cursor" class="tw-cursor"></span>';
    var i = 0;
    var speed = 35;
    function tick(){
      if(i < fullText.length){
        // Insert character before the cursor
        var cursor = document.getElementById('tw-cursor');
        if(cursor){
          cursor.insertAdjacentText('beforebegin', fullText[i]);
          i++;
          chatArea.scrollTop = 99999;
          setTimeout(tick, speed);
        } else {
          // Cursor gone (shouldn't happen), just set directly
          msgDiv.innerHTML = prefixHTML + '<span>' + esc(fullText) + '</span>';
          resolve();
        }
      } else {
        // Done - remove cursor, set final HTML with proper escaping
        msgDiv.innerHTML = prefixHTML + '<span>' + esc(fullText) + '</span>';
        resolve();
      }
    }
    tick();
  });
}

// ========== AI Call ==========
async function callAI(q){
  var cfg=MODELS[curModel];
  var key=cfg.keyField?localStorage.getItem(cfg.keyField):null;
  if(!key)key=document.getElementById(cfg.keyField).value||null;
  var sys='你是岐黄智医，一个专业的AI中西医结合健康助手。回答要求：1)简洁易懂 2)结合中西医双重视角 3)给出饮食和生活建议 4)提醒严重情况需就医 5)不要过度诊断';

  var headers={'Content-Type':'application/json'};
  if(key)headers['Authorization']='Bearer '+key;

  var body=JSON.stringify({model:cfg.model,messages:[{role:'system',content:sys},{role:'user',content:q}],stream:true});

  var resp=await fetch(cfg.base,{method:'POST',headers:headers,body:body});
  if(!resp.ok){
    var errTxt='';
    try{errTxt=await resp.text();}catch(e){}
    if(resp.status===401)throw new Error('API Key无效，请检查设置');
    if(resp.status===402)throw new Error('API余额不足');
    if(resp.status===429)throw new Error('请求过于频繁，请稍后重试');
    throw new Error('HTTP '+resp.status);
  }

  var msgDiv=addMsg('ai','');
  var reader=resp.body.getReader();
  var decoder=new TextDecoder();
  var full='',thinking='';
  var dotInterval=null;

  // Show "thinking" indicator for DeepSeek-R1
  if(cfg.think){
    msgDiv.innerHTML='<div id="ti" style="color:#999;font-size:13px;padding:8px">🧠 思考中</div>';
    var dc=0;
    dotInterval=setInterval(function(){
      dc=(dc+1)%4;
      var d='';for(var i=0;i<dc;i++)d+='.';
      var t=document.getElementById('ti');
      if(t)t.textContent='🧠 思考中'+d;
    },500);
  }

  while(true){
    var result=await reader.read();
    if(result.done)break;
    var chunk=decoder.decode(result.value,{stream:true});
    var lines=chunk.split('\n');
    for(var i=0;i<lines.length;i++){
      var line=lines[i];
      if(!line.startsWith('data: '))continue;
      var data=line.slice(6).trim();
      if(data==='[DONE]')continue;
      try{
        var json=JSON.parse(data);
        var delta=json.choices&&json.choices[0]&&json.choices[0].delta;
        if(!delta)continue;
        if(cfg.think&&delta.reasoning_content){
          thinking+=delta.reasoning_content;
          continue;
        }
        if(delta.content)full+=delta.content;
      }catch(e){}
    }
  }

  // Clear thinking indicator
  if(dotInterval)clearInterval(dotInterval);
  var ti=document.getElementById('ti');
  if(ti)ti.remove();

  // Build display HTML (thinking process)
  var html='';
  if(thinking){
    html='<details style="margin-bottom:8px"><summary style="cursor:pointer;color:#999;font-size:13px">🧠 思考过程</summary><div style="padding:8px;background:#f5f5f5;border-radius:8px;font-size:13px;color:#666;margin-top:4px">'+esc(thinking)+'</div></details>';
  }

  // Typewriter effect - display characters one by one
  await typewriter(msgDiv, full, html);
  
  msgDiv.innerHTML+='<span class="disclaimer">⚠️ AI生成内容仅供参考，如有不适请及时就医</span>';
}

    if(resp.status===401)throw new Error('API Key无效，请检查设置');
    if(resp.status===402)throw new Error('API余额不足');
    if(resp.status===429)throw new Error('请求过于频繁，请稍后重试');
    throw new Error('HTTP '+resp.status);
  }

  var reader=resp.body.getReader();
  var decoder=new TextDecoder();
  var full='',thinking='';

  while(true){
    var result=await reader.read();
    if(result.done)break;
    var chunk=decoder.decode(result.value,{stream:true});
    var lines=chunk.split('\n');
    for(var i=0;i<lines.length;i++){
      var line=lines[i];
      if(!line.startsWith('data: '))continue;
      var data=line.slice(6).trim();
      if(data==='[DONE]')continue;
      try{
        var json=JSON.parse(data);
        var delta=json.choices&&json.choices[0]&&json.choices[0].delta;
        if(!delta)continue;
        if(cfg.think&&delta.reasoning_content){thinking+=delta.reasoning_content;continue;}
        if(delta.content)full+=delta.content;
      }catch(e){}
    }
  }

  // Clear thinking indicator
  if(window._ti2int){clearInterval(window._ti2int);window._ti2int=null;}
  var ti2=document.getElementById('ti2');if(ti2)ti2.remove();

  // Build HTML
  var html='';
  if(thinking){
    html='<details style="margin-bottom:8px"><summary style="cursor:pointer;color:#999;font-size:13px">🧠 辨证思考过程</summary><div style="padding:8px;background:#f5f5f5;border-radius:8px;font-size:13px;color:#666;margin-top:4px">'+esc(thinking)+'</div></details>';
  }
  
  // Format content
  full=full.replace(/\n/g,'<br>').replace(/\*\*(.*?)\*\*/g,'<b>$1</b>');

  // Typewriter effect
  if(msgDiv){
    await typewriter(msgDiv, full, html);
    return null; // already rendered in msgDiv
  }
  return html+full; // fallback: return as string
}
