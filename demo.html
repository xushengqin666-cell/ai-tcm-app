<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>岐黄智医 · AI中西医健康助手</title>
<meta name="description" content="智能中医健康咨询 · 中西医结合 · 科学养生">
<meta name="theme-color" content="#0f3d2e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f2ed;
  --surface:#ffffff;
  --surface-2:#f9f7f3;
  --primary:#0f3d2e;
  --primary-mid:#1a5c3a;
  --primary-light:#2d7a4f;
  --accent:#c4943a;
  --accent-light:#f5ead4;
  --text:#1a1a1a;
  --text-2:#5a5a5a;
  --text-3:#9a9a9a;
  --border:#e5ddd0;
  --shadow:0 4px 24px rgba(15,61,46,.1);
  --shadow-lg:0 12px 48px rgba(15,61,46,.16);
}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Noto Sans SC','DM Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  flex-direction:column;
  height:100vh;
  max-width:800px;
  margin:0 auto;
  box-shadow:0 0 60px rgba(0,0,0,.06);
}

/* ===== HEADER ===== */
.header{
  background:linear-gradient(135deg,#0f3d2e 0%,#1a6b45 60%,#2a8a5e 100%);
  color:#fff;
  padding:18px 24px 16px;
  position:relative;
  overflow:hidden;
  flex-shrink:0;
}
.header::before{
  content:'';
  position:absolute;
  top:-40px;right:-40px;
  width:180px;height:180px;
  background:rgba(255,255,255,.06);
  border-radius:50%;
}
.header::after{
  content:'';
  position:absolute;
  bottom:-60px;right:60px;
  width:120px;height:120px;
  background:rgba(255,255,255,.04);
  border-radius:50%;
}
.header-title{
  font-family:'Noto Serif SC',serif;
  font-size:20px;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:10px;
  position:relative;
  z-index:1;
}
.header-title .icon{
  font-size:22px;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.2));
}
.header-sub{
  font-size:12px;
  opacity:.75;
  margin-top:3px;
  position:relative;
  z-index:1;
}

/* ===== MODE TABS ===== */
.mode-tabs{
  display:flex;
  gap:8px;
  padding:10px 16px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.mode-tab{
  flex:1;
  padding:7px 12px;
  border:1.5px solid var(--border);
  border-radius:20px;
  background:var(--surface);
  color:var(--text-2);
  font-size:13px;
  font-weight:500;
  cursor:pointer;
  transition:all .2s;
  text-align:center;
  font-family:inherit;
}
.mode-tab:hover{border-color:var(--primary-light);color:var(--primary)}
.mode-tab.active{
  background:var(--primary);
  border-color:var(--primary);
  color:#fff;
  box-shadow:0 2px 8px rgba(15,61,46,.25);
}

/* ===== CHAT ===== */
.chat-area{
  flex:1;
  overflow-y:auto;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:12px;
  scroll-behavior:smooth;
}
.chat-area::-webkit-scrollbar{width:4px}
.chat-area::-webkit-scrollbar-track{background:transparent}
.chat-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.welcome-card{
  background:var(--surface);
  border-radius:16px;
  padding:28px 24px;
  text-align:center;
  box-shadow:var(--shadow);
  margin-bottom:4px;
}
.welcome-card .wc-icon{
  font-size:40px;
  margin-bottom:12px;
  display:block;
}
.welcome-card h2{
  font-family:'Noto Serif SC',serif;
  font-size:18px;
  color:var(--primary);
  margin-bottom:8px;
}
.welcome-card p{
  font-size:13px;
  color:var(--text-2);
  line-height:1.7;
}
.welcome-card .suggestions{
  margin-top:14px;
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  justify-content:center;
}
.welcome-card .sug-btn{
  background:var(--accent-light);
  color:var(--accent);
  border:none;
  border-radius:12px;
  padding:5px 12px;
  font-size:12px;
  cursor:pointer;
  font-family:inherit;
  transition:all .2s;
}
.welcome-card .sug-btn:hover{
  background:var(--accent);
  color:#fff;
}

/* ===== MESSAGE ===== */
.msg{max-width:85%}
.msg.user{margin-left:auto}
.msg-row{display:flex;gap:10px;align-items:flex-end}
.msg.user .msg-row{flex-direction:row-reverse}
.msg-avatar{
  width:30px;height:30px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;
  flex-shrink:0;
  font-weight:700;
}
.msg.user .msg-avatar{background:var(--primary);color:#fff}
.msg.ai .msg-avatar{background:var(--accent);color:#fff}
.msg-bubble{
  max-width:100%;
  padding:12px 16px;
  border-radius:18px;
  font-size:14px;
  line-height:1.7;
  word-break:break-word;
}
.msg.user .msg-bubble{
  background:var(--primary);
  color:#fff;
  border-bottom-right-radius:4px;
}
.msg.ai .msg-bubble{
  background:var(--surface);
  color:var(--text);
  border-bottom-left-radius:4px;
  box-shadow:var(--shadow);
}
.msg.ai .msg-bubble p{margin:0 0 6px}
.msg.ai .msg-bubble p:last-child{margin:0}
.msg.ai .msg-bubble strong{color:var(--primary-mid)}
.msg.ai .msg-bubble em{color:var(--accent);font-style:normal;font-weight:500}
.msg.ai .msg-bubble code{
  background:#f0ebe3;
  padding:2px 6px;
  border-radius:4px;
  font-size:.88em;
}

/* KB Card */
.kb-results{
  margin-top:8px;
  border-radius:12px;
  overflow:hidden;
  border:1px solid var(--border);
}
.kb-card{
  background:var(--surface-2);
  border-radius:12px;
  margin-top:8px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(15,61,46,.06);
}
.kb-card-hdr{
  padding:10px 14px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}
.kb-card-cat{
  background:var(--primary);
  color:#fff;
  font-size:10px;
  padding:2px 7px;
  border-radius:10px;
  font-weight:600;
}
.kb-card-title{
  font-size:13px;
  font-weight:600;
  color:var(--text);
  font-family:'Noto Serif SC',serif;
}
.kb-card-body{padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.kb-section{}
.kb-sec-title{
  font-size:11px;
  font-weight:600;
  color:var(--text-3);
  text-transform:uppercase;
  letter-spacing:.5px;
  margin-bottom:3px;
}
.kb-sec-body{font-size:13px;line-height:1.7;color:var(--text-2)}
.kb-emergency{
  background:#fef2f2;
  border:1px solid #fecaca;
  border-radius:8px;
  padding:8px 12px;
  font-size:12px;
  color:#dc2626;
  font-weight:500;
}
.kb-results .kb-card:first-child{margin-top:0}

/* ===== TYPING ===== */
.typing-row{
  display:flex;gap:10px;align-items:flex-end;
  animation:fadeIn .3s ease;
}
.typing-dot{
  width:7px;height:7px;
  background:var(--text-3);
  border-radius:50%;
  animation:typingBounce 1.2s infinite;
}
.typing-dot:nth-child(2){animation-delay:.2s}
.typing-dot:nth-child(3){animation-delay:.4s}
.typing-bubble{
  background:var(--surface);
  border-radius:18px;
  border-bottom-left-radius:4px;
  padding:14px 18px;
  box-shadow:var(--shadow);
  display:flex;gap:5px;align-items:center;
}
@keyframes typingBounce{
  0%,60%,100%{transform:translateY(0);opacity:.4}
  30%{transform:translateY(-6px);opacity:1}
}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ===== INPUT ===== */
.input-area{
  padding:10px 16px 12px;
  background:var(--surface);
  border-top:1px solid var(--border);
  flex-shrink:0;
}
.input-row{
  display:flex;
  gap:10px;
  align-items:flex-end;
}
#userInput{
  flex:1;
  border:1.5px solid var(--border);
  border-radius:24px;
  padding:10px 16px;
  font-size:14px;
  font-family:inherit;
  resize:none;
  outline:none;
  min-height:44px;
  max-height:120px;
  overflow-y:auto;
  transition:border-color .2s;
  line-height:1.5;
  background:#faf8f5;
}
#userInput:focus{border-color:var(--primary-light);background:#fff}
.send-btn{
  width:44px;height:44px;
  background:var(--primary);
  border:none;border-radius:50%;
  color:#fff;
  font-size:18px;
  cursor:pointer;
  flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;
  box-shadow:0 2px 8px rgba(15,61,46,.3);
}
.send-btn:hover{background:var(--primary-mid);transform:scale(1.05)}
.send-btn:active{transform:scale(.95)}
.send-btn:disabled{background:var(--text-3);box-shadow:none;cursor:default;transform:none}
.chips-bar{
  display:flex;flex-wrap:wrap;gap:6px;
  padding-top:8px;
  min-height:0;
  transition:max-height .3s,padding .3s,opacity .3s;
  overflow:hidden;
  max-height:60px;
}
.chips-bar.collapsed{max-height:0;padding-top:0;opacity:0}

/* ===== KB SEARCH ===== */
.kb-search-row{
  display:flex;gap:8px;padding:8px 16px 4px;
  background:var(--surface-2);
  border-top:1px solid var(--border);
  flex-shrink:0;
}
#kbSearchInput{
  flex:1;
  border:1.5px solid var(--border);
  border-radius:16px;
  padding:6px 12px;
  font-size:12px;
  font-family:inherit;
  outline:none;
  background:#fff;
}
#kbSearchInput:focus{border-color:var(--accent)}
#kbSearchInput::placeholder{color:var(--text-3)}

/* ===== TOAST ===== */
.toast{
  position:fixed;
  bottom:80px;
  left:50%;transform:translateX(-50%) translateY(20px);
  background:#333;
  color:#fff;
  padding:8px 18px;
  border-radius:20px;
  font-size:13px;
  opacity:0;
  transition:all .3s;
  pointer-events:none;
  z-index:9999;
  white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== STREAMING CURSOR ===== */
.stream-cursor {
  display: inline-block;
  color: var(--primary);
  font-weight: bold;
  animation: cursorBlink 0.8s step-end infinite;
  margin-left: 1px;
}
@keyframes cursorBlink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}
.ai-text p { margin: 0 0 6px; }
.ai-text p:last-child { margin: 0; }
</style>
</head>

cat": "呼吸系统", "title": "过敏性鼻炎", "content": "鼻黏膜的过敏性炎症，与IgE介导的变态反应有关。常见过敏原：花粉、尘螨、动物皮屑。症状：阵发性打喷嚏、清水样鼻涕、鼻塞、鼻痒、眼痒。治疗：避免过敏原+药物。", "emergency": "出现哮喘症状或过敏性休克（罕见）", "diet": "宜：均衡饮食；富含维生素C、E的食物。忌：已知过敏的食物；辛辣刺激；酒精。", "drugs": "一线：鼻用糖皮质激素（布地奈德、氟替卡松）。口服抗组胺药（氯雷他定、西替利嗪）。白三烯受体拮抗剂（孟鲁司特）。", "herbs": "肺脾两虚：玉屏风散加减。肾虚：右归丸加减。", "keywords": "过敏性鼻炎"}, "高血压": {"cat": "心血管系统", "title": "原发性高血压", "content": "血压持续>=140/90mmHg。大多数原发性高血压无明确单一病因，与遗传、肥胖、高盐饮食、缺乏运动、压力等相关。早期多无症状或仅有轻微头晕头痛。长期未控制可导致心衰、脑卒中、肾功能损害。治疗以生活方式干预为基础，必要时药物治疗。", "emergency": "血压>=180/120mmHg（高血压急症）、剧烈头痛伴呕吐、胸痛、呼吸困难、视力突然模糊、意识障碍/言语不清——立即急诊！", "diet": "宜：DASH饮食（多蔬果、全谷物、低脂奶、少盐少油）；富钾食物（香蕉、菠菜、土豆）。忌：高盐（每日<5g）、高脂、酒精、加工食品。", "drugs": "一线用药：ACEI/ARB（如氨氯地平、缬沙坦）；钙通道阻滞剂；利尿剂。注意：不可擅自停药！需长期规律服用监测血压。", "synergy": "ACEI+保钾利尿剂：高钾风险。多种降压药叠加：低血压风险。布洛芬等NSAID可削弱降压药效果。", "food": "限钠补钾补钙；超重者减重5-10%可显著降压；规律有氧运动（快走、游泳）每周150分钟。", "herbs": "菊花、决明子、玉米须、葛根——平肝潜阳。钩藤、夏枯草——清肝泻火。", "keywords": "头晕 血压高 原发性高血压 头昏 高血压 高压 高压高"}, "冠心病": {"cat": "心血管系统", "title": "冠状动脉粥样硬化性心脏病", "content": "冠状动脉粥样硬化导致心肌缺血缺氧。类型：稳定型心绞痛、不稳定型心绞痛、急性心肌梗死。治疗：药物、介入（支架）、搭桥手术。", "emergency": "剧烈胸痛持续>20分钟，伴出汗、恶心、呼吸困难、濒死感——急性心梗！立即拨打120！", "diet": "宜：深海鱼、燕麦、豆制品、蔬菜水果、全谷物、坚果。忌：动物内脏、肥肉、蛋黄（每周<3个）、奶油、糕点。", "drugs": "抗血小板：阿司匹林（长期）、氯吡格雷。降脂：他汀类（阿托伐他汀）。抗心肌缺血：硝酸甘油（舌下含服）、美托洛尔。", "synergy": "阿司匹林+华法林：增加出血风险。他汀+贝特（吉非贝齐）：增加肌病风险。", "food": "戒烟（最重要）。适度运动（每周≥150分钟）。", "herbs": "丹参、三七、银杏叶——活血化瘀通络。", "keywords": "心梗 冠状动脉粥样硬化性心脏病 心肌梗死 冠心病 心绞痛"}, "脑卒中": {"cat": "心血管系统", "title": "脑卒中/中风", "content": "分为缺血性（脑梗死，85%）和出血性（15%）。BE FAST识别：B平衡、E眼睛、F面部、A手臂、S语言、T时间。缺血性可在4.5小时内溶栓或取栓。", "emergency": "突然出现的面部下垂、手臂无力、说话不清——立即拨打120！", "diet": "控制钠摄入。增加蔬果、全谷物。限制饱和脂肪。补充叶酸。", "drugs": "缺血性卒中二级预防：抗血小板（阿司匹林/氯吡格雷）、降脂（他汀）、降压、控制血糖。", "synergy": "阿司匹林+华法林/新型口服抗凝药：增加出血风险。", "food": "戒烟限酒。控制体重。适度运动。", "herbs": "补阳还五汤（黄芪、当归、川芎、赤芍）——益气活血通络。", "keywords": "脑卒中 中风 脑卒中/中风 脑梗"}, "心律失常": {"cat": "心血管系统", "title": "心律失常", "content": "心脏传导系统异常导致心跳过快、过慢或不规则。常见类型：房颤、室上性心动过速、室性早搏、房室传导阻滞。症状：心悸、胸闷、头晕、晕厥。", "emergency": "意识丧失、持续胸痛、血压显著下降——立即就医！", "diet": "宜：均 。保证休息，避免情绪波动。", "herbs": "甲亢阴虚火旺：天花粉、麦冬、生地——滋阴清热。", "keywords": "甲状腺功能亢进症 甲亢 甲状腺功能亢进"}, "甲状腺功能减退": {"cat": "内分泌系统", "title": "甲状腺功能减退症", "content": "甲状腺激素分泌不足。症状：怕冷、乏力、体重增加、记忆力减退、皮肤干燥、便秘、心率减慢。需长期甲状腺激素替代治疗。", "emergency": "黏液性水肿昏迷：严重嗜睡、体温降低、意识障碍——急诊！", "diet": "适量碘摄入（加碘盐）。避免致甲状腺肿食物（卷心菜、萝卜）。高蛋白、高维生素饮食。", "drugs": "左甲状腺素钠（L-T4）：空腹服用（早餐前30分钟），避免与钙、铁同服。起始剂量小，逐渐加量。", "synergy": "左甲状腺素+钙剂/铁剂：减少吸收，间隔4小时以上服用。", "food": "定期复查甲功，根据结果调整药量。", "herbs": "脾肾阳虚：右归丸加减。", "keywords": "甲状腺功能减退 甲状腺功能减退症 甲减"}, "痛风": {"cat": "代谢性疾病", "title": "痛风/高尿酸血症", "content": "尿酸盐结晶沉积在关节引起的炎症性疾病。典型表现：突发单关节剧痛（常为大脚趾根部），红肿热痛，夜间发作。男性多见。诱因：高嘌呤饮食、饮酒、劳累、受凉。长期高尿酸可致痛风石、尿酸性肾病。", "emergency": "多关节同时发作、发热伴关节痛、肾脏绞痛（尿酸结石）——需就医评估是否需要降尿酸治疗。", "diet": "宜：低嘌呤（蔬菜、蛋奶、谷类）、充足饮水（>2000ml/天）、低脂奶、樱桃。忌：内脏、海鲜、浓肉汤、啤酒、果糖饮料。", "drugs": "急性期：秋水仙碱、NSAID（吲哚美辛）、糖皮质激素。缓解期降尿酸：别嘌醇、非布司他、苯溴马隆。注意：急性期不可开始降尿酸治疗！", "synergy": "秋水仙碱+他汀类：肌肉毒性风险。阿司匹林小剂量可升高尿酸。利尿剂（氢氯噻嗪）升高尿酸。", "food": "啤酒最危险（含嘌呤+抑制尿酸排泄）；剧烈运动后和脱水易诱发；控制体重但不宜快速减重（分解产生酮体抑制排泄）。", "herbs": "土茯苓、萆薢、威灵仙——利湿泄浊。薏苡仁、车前子——利水渗湿。", "keywords": "关节红肿 尿酸高 痛风/高尿酸血症 高尿酸 脚趾疼 痛风 尿酸"}, "骨质疏松": {"cat": "骨科/内分泌", "title": "骨质疏松症", "content": "骨量减少、骨微结构破坏导致骨脆性增加的全身性骨骼疾病。早期无症状，往往骨折后才被发现。绝经后妇女和老年男性高发。髋部骨折一年内死亡率可达20-30%。诊断标准基于DXA骨密度测定的T值（T<=-2.5为骨质疏松）。", "emergency": "脆性骨折（轻微外力即骨折）——髋部/脊柱/腕部最常见；背部剧烈疼痛伴身高变短（可能椎体压缩性骨折）。", "diet": "宜：富钙食物（奶制品、深绿蔬菜、豆腐）；维D（晒太阳/补充剂）；适量蛋白；深色蔬果（钾镁有益骨骼）。忌：过量咖啡因（增加钙流失）；过量钠（尿钙排出增加）；过量维生素A（反效果）；酒精（抑制成骨）；吸烟（双倍骨折风险）。", "drugs": "基础补充：钙剂（1000-1200mg/天）+ 维D（800-1000IU/天）。抗骨吸收：双膦酸盐（阿仑膦酸钠——一线）；地舒单抗（皮下注射）；选择性雌激素受体调节剂（雷洛昔芬——女性）。促骨形成：特立帕肽（严重病例）。", "synergy": "双膦酸盐+NSAID：均伤胃，联用胃肠道风险叠加。钙剂+某些抗生素（四环素/喹诺酮）：形成络合物降低吸收。", "food": "负重运动（走路、慢跑、跳舞）比单纯补钙更重要——力学刺激促骨合成；防晒同时也防了维D合成需平衡；跌倒预防（家居防滑、视力检查、停用致晕药物）同等重要。", "herbs": "淫羊藿、杜仲、续断——补肾壮骨。骨碎补——补肾活血。熟地、山茱萸——填精益髓。", "keywords": "身高变矮 骨质疏松 腰背痛 骨质疏松症 容易骨折 骨密度低"}, "肥胖": {"cat": "内分泌系统", "title": "肥胖症", "content": "体质指数（BMI）≥28为肥胖。危害：糖尿病、高血压、冠心病、脑卒中、睡眠呼吸暂停、癌症风险增加。治疗：饮食控制、运动、药物治疗（奥利司他、司美格鲁肽）、代谢手术。", "emergency": "肥胖相关急症：睡眠呼吸暂停综合征、急性心衰", "diet": "每日热量赤字500-750kcal。蛋 : "拉肚子 腹泻"}, "脂肪肝": {"cat": "消化系统", "title": "脂肪肝", "content": "肝细胞脂肪沉积>5%，分酒精性（AFLD）和非酒精性（NAFLD/MASLD）。治疗：减重5-10%可逆转脂肪肝（最有效）、戒酒、控制血糖血脂。", "emergency": "肝区剧痛、黄疸（眼睛和皮肤发黄）", "diet": "宜：地中海饮食（橄榄油、深色蔬菜、全谷、鱼）、绿茶。忌：酒精、果糖饮料、高糖高脂食品、油炸食品。", "drugs": "二甲双胍（合并糖尿病时）。维生素E（400IU/天，对NASH有一定效果，不适用于糖尿病患者）。护肝药（易善复等）只能辅助。", "food": "咖啡（每天2-3杯无糖）可降低肝酶——循证证实的护肝饮食。", "herbs": "丹参、山楂、葛根、五味子——保肝降脂。", "keywords": "肝脂肪 脂肪肝"}, "肝炎": {"cat": "消化系统", "title": "肝炎", "content": "肝脏炎症，常见原因：病毒性（甲、乙、丙、丁、戊肝）、酒精性、非酒精性、药物性。症状：乏力、食欲不振、恶心、右上腹不适、黄疸。", "emergency": "急性重型肝炎：极度乏力、严重黄疸、意识障碍——急诊！", "diet": "宜：高蛋白（肝修复）、易消化、维生素丰富。忌：酒精、高脂肪、辛辣刺激。", "drugs": "病毒性肝炎：抗病毒药（乙肝核苷类似物、丙肝直接抗病毒药）。护肝药：甘草酸制剂、水飞蓟宾。", "synergy": "抗病毒药需足疗程，不要自行停药。", "food": "绝对戒酒。定期复查肝功能、病毒载量。", "herbs": "茵陈、栀子、柴胡、五味子——清热利湿、疏肝解毒。", "keywords": "丙肝 肝炎 乙肝"}, "胆囊炎": {"cat": "消化系统", "title": "胆囊炎", "content": "胆囊的炎症，常与胆结石有关。分为急性和慢性。急性：右上腹剧痛（墨菲征阳性）、发热、恶心呕吐。慢性：右上腹隐痛、饱胀感。", "emergency": "急性化脓性胆囊炎、胆囊穿孔——急诊手术！", "diet": "宜：低脂饮食、清淡易消化。忌：高脂肪饮食（油炸、肥肉、蛋黄）、辛辣刺激。", "drugs": "抗生素：头孢类+甲硝唑。解痉：山莨菪碱。利胆：熊去氧胆酸。", "synergy": "熊去氧胆酸需长期服用，定期复查。", "food": "少量多餐。避免暴饮暴食。", "herbs": "金钱草、茵陈、郁金——利胆排石。", "keywords": "胆囊炎"}, "痔疮": {"cat": "消化系统", "title": "痔疮", "content": "肛门直肠静脉曲张。分为内痔、外痔、混合痔。症状：便血、肛门疼痛、脱出、瘙痒。治疗：保守治疗（坐浴、软化大便、局部用药）、手术。", "emergency": "大量便血导致贫血、痔核嵌顿坏死", "diet": "宜：膳食纤维（25-35g/天）、足量饮水。忌：辛辣刺激、久坐久蹲。", "drugs": "口服：地榆槐角丸、迈之灵。外用：马应龙痔疮膏、栓剂。", "synergy": "便秘加重痔疮，形成恶性循环。", "food": "养成排便好习惯（每天固定时间，不超过5分钟）。温水坐浴。", "herbs": "地榆、槐花、赤小豆——凉血止血、消肿止痛。", "keywords": "肛裂 痔疮"}, "口腔溃疡": {"cat": "五官科", "title": "复发性口腔溃疡", "content": "口腔黏膜反复发作的溃疡。病因复杂：免疫因素、维生素缺乏、机械刺激。", "emergency": "溃疡超过2周不愈或数量增多", "diet": "宜：富含维生素B、C的食物。忌：辛辣、过烫、酸性食物。", "drugs": "局部：口腔溃疡散、西瓜霜。全身：维生素B2、维生素C。反复发作排查系统性疾病。", "synergy": "保持口腔清洁。", "food": "避免咬伤。", "herbs": "导赤散（心脾积热）、玉女煎（阴虚火旺）。", "keywords": "溃疡 口腔溃疡 复发性口腔溃疡"}, "头痛": {"cat": "神经系统", "title": "头痛", "content": "原因众多：紧张性、血管性、偏头痛、鼻窦性、继发性头痛。处理：休息、放松、止痛药。若头痛突然剧烈伴发热/呕吐/视物模糊/偏瘫，请立即就医。", "emergency": "突然剧烈头痛（雷击样）、伴意识变化、颈项强直、视物模糊、偏瘫——立即就医！", "diet": "宜：规律进食（避免低血糖 ywords": "手术后中医调理 术后调理"}, "肿瘤康复": {"cat": "中医", "title": "肿瘤康复期调理", "content": "手术/放化疗后中医调理，减轻副作用，提高生活质量。", "emergency": "", "diet": "宜：富含营养、易消化。忌：辛辣刺激、腌制食品。", "drugs": "", "synergy": "", "food": "定期复查。", "herbs": "扶正固本：黄芪、党参、灵芝——增强免疫。", "keywords": "肿瘤康复期调理 肿瘤康复"}, "诺如病毒感染": {"cat": "消化系统", "title": "诺如病毒性胃肠炎(病毒性腹泻)", "content": "诺如病毒是全球范围内引起非细菌性急性胃肠炎暴发的最主要病原体，俗称'冬季呕吐病'。传播极强，极少量病毒颗粒即可感染。潜伏期12-48小时。典型症状：突起剧烈呕吐（儿童更突出）、水样腹泻、腹痛、低热、全身肌肉酸痛、乏力。病程自限性，通常2-3天自愈。重点风险：脱水——尤其是婴幼儿和老人。处理：补液是核心——口服补液盐(ORS)少量多次饮用；暂缓进食固体食物，呕吐停止后从清淡流质开始（米汤、稀释苹果汁）；避免使用抗生素（无效且可能延长排毒期）；避免使用止泻药洛哌丁胺（会延缓病毒排出）。家庭护理：充分休息、勤洗手、对呕吐物/排泄物用含氯消毒剂消毒。", "emergency": "严重脱水（无尿超过8小时、哭无泪、囟门凹陷婴儿）、持续呕吐超过24小时无法进食、便血、高热>39℃、精神状态改变", "diet": "宜：米汤、BRAT饮食（香蕉、米饭、苹果酱、吐司）、白粥、面条、蒸蛋\n忌：乳制品、高纤维食物、油腻、辛辣、咖啡因、含糖果汁", "keywords": "诺如病毒 冬季呕吐病 秋季腹泻 病毒性腹泻 诺如病毒性胃肠炎(病毒性腹泻) 轮状病毒 诺如病毒感染"}, "肠易激综合征": {"cat": "消化系统", "title": "肠易激综合征(IBS)", "content": "肠易激综合征是一种功能性肠道疾病，表现为反复腹痛/腹部不适伴排便习惯改变，但无器质性病变。多见于20-40岁女性。主要类型：腹泻型（IBS-D）、便秘型（IBS-C）、混合型（IBS-M）。腹泻型症状：腹痛/不适在排便后缓解、排便频率增加、大便稀软或水样、急迫感（憋不住）、黏液便。常伴随腹胀、胀气、恶心、疲劳、焦虑/抑郁。处理：识别并避免个人触发食物（常见诱因：乳制品、FODMAPs食物如洋葱大蒜、高脂食物、辛辣、咖啡因、酒精）；规律进餐；管理压力；适量有氧运动。药物需医生处方：解痉剂、止泻药、益生菌。", "emergency": "便血、不明原因体重下降>5%、夜间腹泻醒起、50岁以上新发症状、贫血、发热", "diet": "宜：白米饭、白面包、香蕉、煮熟的胡萝卜、南瓜、土豆、去皮鸡肉/鱼、鸡蛋、燕麦片\n忌：乳制品（乳糖不耐受者）、洋葱、大蒜、花椰菜、豆类、人工甜味剂、油炸物、辣椒、咖啡、酒精", "keywords": "肚子疼想上厕所 肠易激综合征(IBS) 一紧张就拉肚子 肠易激综合征 IBS 肠胃敏感 肠易激"}, "糖尿病饮食": {"cat": "内分泌系统", "title": "糖尿病饮食管理", "content": "糖尿病饮食管理的核心是控制血糖波动、维持理想体重、预防并发症。三大原则：①控制碳水化合物总量和质量（优先选择低GI食物）；②均衡营养（蛋白质、健康脂肪、膳食纤维）；③定时定量进餐。主食建议：全谷物替代精制碳水（糙米、燕麦、荞麦、全麦面包），每餐主食约拳头大小。蛋白质：鱼、禽肉、豆制品、蛋类，每日手掌大小。蔬菜：大量非淀粉类蔬菜（绿叶菜、西兰花、黄瓜、西红柿），每日至少500g。水果：选择低糖水果（草莓、蓝莓、柚子、苹果），两餐之间少量食用。避免：含糖饮料、精制糖、甜点、高GI水果（西瓜、葡萄、荔枝）、油炸食品、加工肉类。进餐顺序：先吃蔬菜→再吃蛋白质→最后吃主食，有助于平稳餐后血糖。", "emergency": "低血糖（心慌、手抖、出冷汗、头晕）— 立即补充15-20g快糖（糖果/果汁/蜂蜜水）；高血糖危象（血糖>16.7mmol/L伴恶心呕吐、腹痛、呼吸深快）— 立即就医", "diet": "宜：全谷物（燕麦、糙米、荞麦、全麦面包）、大量绿叶蔬菜、豆类、鱼类、去皮禽肉、蛋类、坚果（每日一小把）、低糖水果（草莓、蓝莓、柚子）\n忌：含糖饮料（可乐、奶茶、果汁饮料）、精制糖（白糖、红糖、蜂蜜）、甜点（蛋糕、饼干、冰淇淋）、高GI主食（白粥、白米饭、白面包）、油炸食品、加工肉类、高糖水果", "keywords": "糖尿病饮食 血糖高怎么吃 糖尿病饮食管理 糖尿病吃什么 控糖饮食 低GI食物 糖友饮食 糖尿病人饮食 糖尿病食谱"}, "哮喘": {"cat": "呼吸系统", "title": "支气管哮喘", "content": "哮喘是一种慢性气道炎症性疾病，特征为气道高反应性和可逆性气流受限。病因：遗传过敏体质+环境触发因素（尘螨、花粉、宠物皮屑、烟草烟雾、冷空气、运动、某些药物）。典型症状：反复发作性喘息（呼气时高调哨鸣音）、胸闷、咳嗽（夜间/清晨干咳）、气短。发作可在数分钟至数小时内自行或经治疗后缓解，严重发作（哮喘持续状态）可致死。诊断：肺功能检查（支气管舒张试验/激发试验）、呼出气一氧化氮(FeNO)。治疗：缓解药物（速效β2受体激动剂如沙丁胺醇）急救吸入；控制药物（吸入性糖皮质激素如布地奈德）长期使用。预防：避免已知过敏原、戒烟、每年接种流感疫苗和肺炎疫苗。", "emergency": "哮喘持续状态（吸入急救药物后症状不缓解甚至加重、说话断续、大汗淋漓、端坐呼吸、口唇/指甲发绀）、意识模糊、沉默胸", "diet": "宜：富含维生素C的水果、深海鱼（omega-3）、生姜、蜂蜜水\n忌：已知过敏食物、过冷过烫、辛辣刺激、亚硫酸盐（葡萄酒、干果、腌制食品）", "keywords": "胸闷气短 支气管哮喘 喘不上气 气管哮喘 夜里咳嗽 气喘 过敏性哮喘 哮喘 喘息"}, "流感": {"cat": "呼吸系统", "title": "流行性感冒", "content": "流感是由流感病毒（甲型/乙型）引起的急性呼吸道传染病，与普通感冒完全不同——来得更快更猛，并发症更危险。典型症状：突发高热（39-40℃）、剧烈头痛、全身肌肉关节酸痛、极度疲乏、干咳、咽痛、鼻塞流涕。与普通感冒的区别：感冒渐进发病、低热或不发热、以局部症状为主；流感骤然发病、高热、全身症状重、可致肺炎等严重并发症。高危人群：65岁以上老人、5岁以下儿童、孕妇、慢性病患者、肥胖者。治疗：发病48小时内口服奥司他韦可缩短病程降低重症风险；对症退热；充分休息补水。预防：每年接种流感疫苗（最有效）、戴口罩、勤洗手、室内通风。", "emergency": "呼吸困难（静息呼吸>30次/分）、胸痛、意识模糊、持续高热>3天、唇甲发绀", "diet": "宜：温热流质（稀粥、面条汤、蛋花汤）、富含维生素C的水果、蜂蜜柠檬温水\n忌：油腻、辛辣、过甜过咸、酒精、咖啡因", "keywords": "乙流 甲流 浑身酸痛 高烧不退 得了流感 流行性感冒 流感"}, "肩周炎": {"cat": "骨科", "title": "肩关节周围炎(五十肩/冻结肩)", "content": "肩周炎是肩关节囊及周围组织的慢性炎症，俗称'五十肩'。特征：肩关节疼痛+主动/被动活动均受限。病程分期：①冻结期（2-9个月）：肩部阵发性疼痛，夜间尤甚；②僵硬期（4-12个月）：疼痛减轻但关节僵硬明显——抬不起胳膊、梳不了头、扣不上背后内衣扣；③缓解期（5-26个月）：逐渐自愈。危险因素：50岁左右、糖尿病、甲状腺疾病、肩部制动过久。治疗：功能锻炼是核心（爬墙练习、钟摆运动、毛巾拉伸，坚持3-6个月）；止痛（NSAIDs）；物理治疗；封闭注射（一年不超过3次）。关键是坚持锻炼——越动越好，'痛也要动'。", "emergency": "肩部外伤后突然完全无法抬起（排除骨折/肩袖撕裂）、伴有发热红肿", "diet": "宜：胶原蛋白食物（猪蹄、鸡爪、鱼皮）、钙、维生素D、抗炎食物（深海鱼omega-3）", "keywords": "肩关节周围炎(五十肩/冻结肩) 肩膀疼 梳不了头 抬不起胳膊 冻结肩 五十肩 肩周炎 肩膀僵硬"}, "足底筋膜炎": {"cat": "骨科", "title": "足底筋膜炎", "content": "足底筋膜炎是足跟痛的最常见原因。典型症状：晨起第一步足跟剧痛（下床踩地时刺痛，行走几步后稍缓解，久坐站起后再痛——'起始痛'）；足跟内侧前方压痛最明显；长时间站立或行走后加重。危险因素：扁平足/高弓足、肥胖、长期站立工作、突然增加运动量、穿着不当。治疗：休息+更换鞋子（足弓支撑良好/后跟cushioned的运动鞋）、冰敷、小腿/足底筋膜拉伸（关键！每次30秒，每日多次）、足底滚网球/冷冻水瓶按摩、矫形鞋垫、NSAIDs止痛。", "emergency": "足跟部红肿热痛（排除骨折/感染）、双侧对称性足跟痛（需排除强直性脊柱炎）", "diet": "宜：控制体重（减重直接减少足跟负荷）、抗炎食物（omega-3）、钙和维生素D", "keywords": "早晨起来脚跟疼 足底筋膜炎 足跟痛 脚跟痛 脚后跟疼 脚底疼"}, "脱发": {"cat": "皮肤科", "title": "脱发(斑秃/雄激素性脱发)", "content": "脱发主要类型：(1)雄激素性脱发(AGA)：最常见，男性表现为前额发际线后移(M型)+头顶稀疏；女性表现为头顶弥散性稀疏。(2)斑秃(AA)：自身免疫性，头皮圆形秃发斑，'鬼剃头'。(3)休止期脱发：产后/重大疾病/手术后2-3个月大量脱发，通常可逆。(4)牵拉性脱发：长期扎马尾导致。AGA治疗：男性——非那雄胺（口服）+米诺地尔（外用）；女性——米诺地尔±螺内酯。日常护理：温和洗发、避免高温造型工具、均衡营养（蛋白质/铁/锌/B族维生素）、管理压力、充足睡眠。", "emergency": "突然大面积脱发（全秃/普秃）、脱发区皮肤红肿破溃渗液、伴有其他自身免疫症状", "diet": "宜：优质蛋白质（鸡蛋、瘦肉、鱼类）、铁（红肉、菠菜、动物肝脏）、锌（牡蛎、牛肉、南瓜籽）、B族维生素、生物素、维生素C\n忌：极端低热量节食减肥、过量维生素A、高糖高脂饮食", "keywords": "斑秃 秃顶 生发 鬼剃头 头发稀疏 产后脱发 发际线后移 脱发 脱发(斑秃/雄激素性脱发) 掉头发"}, "新冠感染": {"cat": "感染科", "title": "新型冠状病毒感染", "content": "COVID-19由SARS-CoV-2病毒引起。当前主流变异株（Omicron亚型）致病力较原始株明显减弱。常见症状：发热、咽痛（'刀片嗓'）、干咳、乏力、肌肉酸痛、头痛、鼻塞流涕、味觉/嗅觉减退、腹泻（部分人）。大多数人在5-7天内自愈。高危人群：未全程接种疫苗的老年人、未接种疫苗+有基础疾病者。预警信号：血氧饱和度≤93%、呼吸困难、持续高热>3天、胸痛、意识模糊、唇面发紫。治疗：轻症居家——对症退热、充分休息补水、含片缓解咽痛、监测血氧。抗病毒药物（Paxlovid）适用于高危人群早期使用。预防：接种疫苗加强针、室内通风、密集场所佩戴口罩。", "emergency": "血氧≤93%、呼吸困难（静息呼吸>30次/分）、胸痛压迫感、意识模糊、唇面发紫、持续高热>3天", "diet": "宜：高蛋白易消化（鸡蛋羹、清蒸鱼、瘦肉粥、豆腐脑）、富含维生素C、电解质水\n忌：油腻煎炸、辛辣刺激、过冷过烫、酒精、加工食品", "keywords": "二阳 新型冠状病毒感染 COVID 阳了 新冠感染 刀片嗓 新冠"}, "甲状腺结节": {"cat": "内分泌系统", "title": "甲状腺结节", "content": "甲状腺内局限性肿块，超声检出率高达20-70%。绝大多数（>95%）为良性，仅约5%为恶性。发现途径多为体检超声偶然发现。TI-RADS分类用于评估恶性风险（1-5类，越高越危险）。", "emergency": "结节短期内迅速增大、声音嘶哑/吞咽困难/呼吸困难（压迫症状）、颈部淋巴结肿大——需尽快就医排除恶性。", "diet": "宜：适量碘摄入（既不足也不过量）；均衡饮食；硒元素（巴西坚果、海鲜）。忌：碘过量（大量海带紫菜——尤其桥本氏甲状腺炎）；致甲状腺肿物质（十字花科生食大量摄入）。", "drugs": "良性结节无需药物治疗。甲功异常时：甲减用左甲状腺素（优甲乐）；甲亢用甲巯咪唑/丙硫氧嘧啶。注意：良性结节不要盲目吃药消散。", "synergy": "左甲状腺素+钙剂/铁剂/抗酸药：间隔4小时以上服用（相互影响吸收）。含碘造影剂影响甲功检测结果。", "food": "大多数甲状腺结节不需要忌碘，除非合并甲亢或桥本；十字花科蔬菜（西兰花、卷心菜）煮熟后食用安全；定期复查超声（6-12个月一次）。", "herbs": "夏枯草、浙贝母、牡蛎——软坚散结。柴胡、郁金——疏肝理气（情志相关）。", "keywords": "脖子肿 甲状腺 甲状腺结节 甲亢 甲减"}, "偏头痛": {"cat": "神经内科", "title": "偏头痛", "content": "常见的原发性头痛疾病，女性多见（男女比约1:3）。典型表现为单侧搏动性中重度头痛，持续4-72小时，日常活动加重，常伴恶心/呕吐/畏光/畏声。可有先兆（视觉闪光/暗点/麻木——约25%患者）。机制涉及三叉神经血管系统激活、CGRP释放、皮质扩散性抑制。", "emergency": "突然发生的最剧烈头痛（thunderclap headache——警惕蛛网膜下腔出血）；头痛伴发热颈项强直（脑膜炎）；头痛伴神经系统定位体征（卒中）；头痛模式发生显著变化——立即急诊/神经内科。", "diet": "宜：规律进餐（低血糖可诱发）；镁元素（绿叶菜、坚果、黑巧克力——预防性补充证据较好）；规律作息。忌：已知个体trigger食物（常见：红酒、陈年奶酪、巧克力、含亚硝酸盐食品/腊肉/热狗）；咖啡因（过量或突然戒断均可触发）；MSG（味精——部分敏感者）；脱水/漏餐。", "drugs": "急性期：非特异性止痛（布洛芬/对乙酰氨基酚——轻度发作）；曲普坦类（舒马曲普坦——特异性，中重度首选）；麦角胺（老药，副作用多）。预防性（每月>=4次发作）：β受体阻滞剂（普萘洛尔）；抗癫痫药（托吡酯/丙戊酸钠）；CGRP单克隆抗体（依瑞奈尤单抗——新型靶向药效果好）；阿米替林（三环类）。", "synergy": "曲普坦类+SSRI/SNRI：5-HT综合征风险。麦角胺+大环内酯类抗生素：麦角中毒风险。多种止痛药每周>2次：药物过度使用性头痛（MOH）！", "food": "头痛日记是最有用的诊断工具（记录时间/持续时间/trigger/药物效果/月径周期关联）；规律睡眠（周末也不要大幅改变作息）；有氧运动预防但发作期休息；放松训练/CBT也有循证支持。", "herbs": "川芎、白芷、细辛——祛风止痛（川芎茶调散）。天麻、钩藤——平肝熄风。全蝎、蜈蚣——搜风通络（顽固性）。", "keywords": "头痛 恶心想吐 偏头痛 血管性头痛 头疼 半边头疼"}}, "DIET": {"湿气": {"f": "薏米（炒）、赤小豆、茯苓、冬瓜、荷叶、陈皮、山药", "a": "甜食、油腻、生冷、酒类、浓茶", "r": "早餐：薏米红豆粥\n午餐：冬瓜排骨汤+清炒芹菜+米饭\n晚餐：清蒸鱼+凉拌苦瓜\n茶饮：玉米须茶", "title": "湿气", "rec": "薏米（炒）、赤小豆、茯苓、冬瓜、荷叶、陈皮、山药", "avoid": "甜食、油腻、生冷、酒类、浓茶", "tips": "早餐：薏米红豆粥\n午餐：冬瓜排骨汤+清炒芹菜+米饭\n晚餐：清蒸鱼+凉拌苦瓜\n茶饮：玉米须茶", "keywords": "湿气"}, "失眠": {"f": "酸枣仁、百合、莲子、小米、核桃、牛奶（温热睡前1小时）", "a": "咖啡、浓茶（下午2点后禁饮）、酒精、辛辣", "r": "早餐：小米粥+核桃包+牛奶\n晚餐：酸枣仁粥+馒头\n睡前：温热牛奶200ml", "title": "失眠", "rec": "酸枣仁、百合、莲子、小米、核桃、牛奶（温热睡前1小时）", "avoid": "咖啡、浓茶（下午2点后禁饮）、酒精、辛辣", "tips": "早餐：小米粥+核桃包+牛奶\n晚餐：酸枣仁粥+馒头\n睡前：温热牛奶200ml", "keywords": "失眠 睡眠不好 多梦 睡眠差 睡不着 早醒 入睡困难"}, "养胃": {"f": "山药、小米、南瓜、莲子、芡实、红枣、蒸蛋、软面条", "a": "辛辣、生冷、油腻、过甜、过酸、咖啡、酒精", "r": "早餐：小米粥+馒头+蒸蛋\n午餐：山药排骨汤+清炒南瓜+米饭\n晚餐：清蒸鱼+软面条", "title": "养胃", "rec": "山药、小米、南瓜、莲子、芡实、红枣、蒸蛋、软面条", "avoid": "辛辣、生冷、油腻、过甜、过酸、咖啡、酒精", "tips": "早餐：小米粥+馒头+蒸蛋\n午餐：山药排骨汤+清炒南瓜+米饭\n晚餐：清蒸鱼+软面条", "keywords": "养胃"}, "高血压": {"f": "芹菜、燕麦、香蕉、黑木耳、荞麦、深海鱼、绿叶蔬菜", "a": "腌制品、高盐零食、加工食品、浓茶", "r": "早餐：燕麦粥+全麦面包+香蕉\n午餐：芹菜炒肉+番茄蛋汤+米饭\n晚餐：清蒸鸡胸+凉拌木耳+荞麦面", "title": "高血压", "rec": "芹菜、燕麦、香蕉、黑木耳、荞麦、深海鱼、绿叶蔬菜", "avoid": "腌制品、高盐零食、加工食品、浓茶", "tips": "早餐：燕麦粥+全麦面包+香蕉\n午餐：芹菜炒肉+番茄蛋汤+米饭\n晚餐：清蒸鸡胸+凉拌木耳+荞麦面", "keywords": "血压高 高血压 高压 高压高"}, "减肥": {"f": "鸡胸肉、西兰花、糙米、燕麦、黄瓜、番茄、鱼、豆腐", "a": "油炸食品、甜饮料、零食、酒精、白米白面", "r": "早餐：全麦吐司+水煮蛋+脱脂牛奶\n午餐：鸡胸肉沙拉+糙米饭\n晚餐：清蒸鱼+蔬菜汤+杂粮粥", "title": "减肥", "rec": "鸡胸肉、西兰花、糙米、燕麦、黄瓜、番茄、鱼、豆腐", "avoid": "油炸食品、甜饮料、零食、酒精、白米白面", "tips": "早餐：全麦吐司+水煮蛋+脱脂牛奶\n午餐：鸡胸肉沙拉+糙米饭\n晚餐：清蒸鱼+蔬菜汤+杂粮粥", "keywords": "减肥"}, "补气血": {"f": "红枣、桂圆、当归、乌鸡、菠菜、牛肉、枸杞、黑木耳", "a": "生冷、浓   chips.forEach(function(kw){
    var btn = document.createElement('button');
    btn.className = 'mode-tab';
    btn.style.flex = 'none';
    btn.style.padding = '4px 12px';
    btn.style.fontSize = '12px';
    btn.textContent = kw;
    btn.onclick = function(){ document.getElementById('userInput').value = kw; sendMessage(); };
    bar.appendChild(btn);
  });
}

function sendMessage() {
  var inp = document.getElementById('userInput');
  var query = inp.value.trim();
  if (!query || isTyping) return;
  addUserMessage(query);
  inp.value = '';
  inp.style.height = 'auto';
  processQuery(query);
}

function addUserMessage(text) {
  var chat = document.getElementById('chatArea');
  var w = document.getElementById('welcomeArea');
  if (w) w.style.display = 'none';
  var div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = '<div class="msg-row"><div class="msg-avatar">&#128104;</div><div class="msg-bubble">' + escapeHtml(text) + '</div></div>';
  chat.appendChild(div);
  scrollToBottom();
}

function addAIMessage(text, cardHtml) {
  var chat = document.getElementById('chatArea');
  var div = document.createElement('div');
  div.className = 'msg ai';
  div.innerHTML = '<div class="msg-row"><div class="msg-avatar">&#9765;</div><div class="msg-bubble"><div class="ai-text">' + text + '</div>' + (cardHtml || '') + '</div></div>';
  chat.appendChild(div);
  scrollToBottom();
  return div;
}

function createStreamingBubble() {
  var chat = document.getElementById('chatArea');
  var w = document.getElementById('welcomeArea');
  if (w) w.style.display = 'none';
  var div = document.createElement('div');
  div.className = 'msg ai';
  div.innerHTML = '<div class="msg-row"><div class="msg-avatar">&#9765;</div><div class="msg-bubble"><div class="ai-text"><span class="stream-cursor">&#9646;</span></div></div></div>';
  chat.appendChild(div);
  scrollToBottom();
  streamingEl = div.querySelector('.ai-text');
  streamFullText = '';
  return div;
}

function appendStreamChar(text) {
  if (!streamingEl) return;
  streamFullText += text;
  if (!streamBuf) streamBuf = '';
  streamBuf += text;
  var shouldFlush = streamBuf.length >= 8 || /[。！？，、；：.!?,;:\n]/.test(streamBuf);
  if (shouldFlush) {
    streamingEl.innerHTML = formatText(streamFullText) + '<span class="stream-cursor">&#9646;</span>';
    scrollToBottom();
    streamBuf = '';
  } else if (!streamTimer) {
    streamTimer = setTimeout(function(){
      if (streamingEl && streamFullText) {
        streamingEl.innerHTML = formatText(streamFullText) + '<span class="stream-cursor">&#9646;</span>';
        scrollToBottom();
      }
      streamBuf = '';
      streamTimer = null;
    }, 120);
  }
}

function finishStream() {
  if (streamTimer) { clearTimeout(streamTimer); streamTimer = null; }
  streamBuf = '';
  if (!streamingEl) return;
  streamingEl.innerHTML = formatText(streamFullText);
  scrollToBottom();
  var el = streamingEl;
  streamingEl = null;
  return el;
}

function showTyping() {
  var chat = document.getElementById('chatArea');
  var div = document.createElement('div');
  div.id = 'typingEl';
  div.className = 'msg ai';
  div.innerHTML = '<div class="typing-row"><div class="msg-avatar">&#9765;</div><div class="typing-bubble"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>';
  chat.appendChild(div);
  scrollToBottom();
}
function hideTyping() {
  var t = document.getElementById('typingEl');
  if (t) t.remove();
}

function processQuery(query) {
  if (currentMode === 'ai') {
    isTyping = true;
    createStreamingBubble();
    fetch(API_BASE, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question: query, history: chatHistory})
    })
    .then(function(r){
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(function(sseText){
      var content = '';
      var lines = sseText.split('\n');
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (line.indexOf('data: ') === 0) {
          var data = line.substring(6);
          if (data === '[DONE]') continue;
          try { var json = JSON.parse(data); if (json.content) content += json.content; } catch(e) {}
        }
      }
      streamFullText = content;
      isTyping = false;
      finishStream();
      chatHistory.push({role: 'assistant', content: content});
    })
.catch(function(){
      isTyping = false;
      if (streamingEl) streamingEl.remove();
      var result = searchKB(query);
      addAIMessage(formatText(result.text) + '<br><br><span style="font-size:12px;color:#9a9a9a">&#9888; AI服务暂时不可用，以上为本地知识库结果</span>', result.cardHtml);
    });
  } else {
    isTyping = true;
    showTyping();
    setTimeout(function(){
      isTyping = false;
      hideTyping();
      var result = searchKB(query);
      addAIMessage(formatText(result.text), result.cardHtml);
    }, 400 + Math.random() * 400);
  }
}

function formatText(text) {
  if (!text) return '';
  text = escapeHtml(text);
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
  text = text.replace(/`(.+?)`/g, '<code>$1</code>');
  text = text.replace(/\n\n/g, '</p><p style="margin:6px 0">');
  text = text.replace(/\n/g, '<br>');
  return '<p style="margin:0">' + text + '</p>';
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function scrollToBottom() {
  var chat = document.getElementById('chatArea');
  setTimeout(function(){ chat.scrollTop = chat.scrollHeight; }, 50);
}

function clearChat() {
  var chat = document.getElementById('chatArea');
  chat.innerHTML = '';
  chat.innerHTML = '<div class="welcome-card" id="welcomeArea"><span class="wc-icon">&#9765;</span><h2>您好，我是岐黄智医</h2><p>告诉我您哪里不舒服，我会先了解您的症状，再给出专业的中西医结合治疗方案</p><div class="suggestions"><button class="sug-btn" onclick="document.getElementById(\'userInput\').value=\'最近总是失眠怎么办？\';sendMessage()">失眠怎么办</button><button class="sug-btn" onclick="document.getElementById(\'userInput\').value=\'胃痛吃什么好？\';sendMessage()">胃痛</button><button class="sug-btn" onclick="document.getElementById(\'userInput\').value=\'如何提高免疫力？\';sendMessage()">提高免疫力</button><button class="sug-btn" onclick="document.getElementById(\'userInput\').value=\'湿气重怎么调理？\';sendMessage()">湿气调理</button></div></div>';
  showToast('对话已清空');
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show';
  setTimeout(function(){ t.className = 'toast'; }, 2500);
}

// ===== SEARCH KB =====
function searchKB(query) {
  var ql = query.toLowerCase();
  // Use symptomKeywords to map synonyms to canonical names
  var symMap = KB_DATA.symptomKeywords || {};
  var mappedQuery = symMap[ql] || ql;
  var ql2 = mappedQuery.toLowerCase();
  var searchTerms = [ql, ql2].filter(function(v,i,a){return a.indexOf(v)===i;});
  var words = [];
  searchTerms.forEach(function(q){ words = words.concat(q.split(/\s+/)); });
  var scored = [];
  var keys = ['title','symptoms','diet','drugs','herbs','desc','rec','avoid','tips','keywords','content'];
  var _kbSrc = KB_DATA.KB || {};
  if (currentMode === 'tcm') _kbSrc = KB_DATA.TCM || {};
  if (currentMode === 'diet') _kbSrc = KB_DATA.DIET || {};
  var allItems = Array.isArray(_kbSrc) ? _kbSrc : Object.values(_kbSrc);
  if (!allItems.length) return {text: '未找到相关知识库条目，请尝试其他关键词或切换到"AI对话"模式咨询在线AI。', cardHtml: ''};

  allItems.forEach(function(item) {
    var score = 0;
    searchTerms.forEach(function(qi) {
      keys.forEach(function(k) {
        var v = (item[k] || '').toLowerCase();
        if (v.indexOf(qi) !== -1) score += (qi === ql && qi.length >= 2 ? 5 : (k === 'title' ? 3 : 1));
      });
    });
    if (score > 0) scored.push({item: item, score: score});
  });

  scored.sort(function(a, b){ return b.score - a.score; });
  var top = scored.slice(0, 3);

  if (top.length === 0) {
    return {text: '未找到相关知识库条目，请尝试其他关键词或切换到"AI对话"模式咨询在线AI。', cardHtml: ''};
  }

  var text = top.map(function(r){
    var item = r.item;
    if (currentMode === 'tcm') {
      var body = (item.desc ? '<div class="kb-sec-body">'+item.desc+'</div>' : '') +
                 (item.symptoms ? '<div class="kb-sec-title">典型症状</div><div class="kb-sec-body">'+item.symptoms+'</div>' : '') +
                 (item.diet ? '<div class="kb-sec-title">饮食调养</div><div class="kb-sec-body">'+item.diet+'</div>' : '');
      return '<div class="kb-card"><div class="kb-card-hdr"><span class="kb-card-cat">中医体质</span><span class="kb-card-title">'+escapeHtml(item.title||'')+'</span></div><div class="kb-card-body">'+body+'</div></div>';
    } else if (currentMode === 'diet') {
      var body = (item.rec ? '<div class="kb-sec-title" style="color:#16a34a">推荐食物</div><div class="kb-sec-body" style="color:#16a34a">'+item.rec+'</div>' : '') +
                 (item.avoid ? '<div class="kb-sec-title" style="color:#dc2626">避免食物</div><div class="kb-sec-body" style="color:#dc2626">'+item.avoid+'</div>' : '') +
                 (item.tips ? '<div class="kb-sec-title">饮食贴士</div><div class="kb-sec-body">'+item.tips+'</div>' : '');
      return '<div class="kb-card"><div class="kb-card-hdr"><span class="kb-card-cat">饮食方案</span><span class="kb-card-title">'+escapeHtml(item.title||'')+'</span></div><div class="kb-card-body">'+body+'</div></div>';
    } else {
      var body = (item.diet ? '<div class="kb-sec-title">饮食建议</div><div class="kb-sec-body">'+item.diet+'</div>' : '') +
                 (item.drugs ? '<div class="kb-sec-title">用药参考</div><div class="kb-sec-body">'+item.drugs+'</div>' : '') +
                 (item.herbs ? '<div class="kb-sec-title">中药参考</div><div class="kb-sec-body">'+item.herbs+'</div>' : '') +
                 (item.emergency ? '<div class="kb-emergency">&#9888; '+item.emergency+'</div>' : '');
      return '<div class="kb-card"><div class="kb-card-hdr"><span class="kb-card-cat">'+(item.cat||'常见问题')+'</span><span class="kb-card-title">'+escapeHtml(item.title||'')+'</span></div><div class="kb-card-body">'+body+'</div></div>';
    }
  }).join('');

  return {
    text: '找到 ' + top.length + ' 条相关知识：',
    cardHtml: '<div class="kb-results">' + text + '</div>'
  };
}

// KB Search list

function searchKBList(query) {
  if (!query || query.length < 1) {
    document.getElementById('kbSearchInput').style.outline = '';

  div.className = 'msg ai';

}
