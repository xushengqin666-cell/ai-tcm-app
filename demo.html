<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI中西医健康助手</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --primary: #10b981;
  --primary-dark: #059669;
  --secondary: #f59e0b;
  --bg-start: #ecfdf5;
  --bg-end: #d1fae5;
  --surface: rgba(255,255,255,0.95);
  --surface-glass: rgba(255,255,255,0.7);
  --text: #1f2937;
  --text-light: #6b7280;
  --border: rgba(16,185,129,0.2);
  --shadow: 0 8px 32px rgba(16,185,129,0.15);
}
html { font-size: 20px; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
  color: var(--text);
  line-height: 1.6;
  height: 100vh;
  overflow: hidden;
}
.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-width: 500px;
  margin: 0 auto;
  padding: 12px;
  gap: 12px;
}
.header {
  background: var(--surface-glass);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 20px;
  padding: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
}
.header-left h1 {
  font-size: 26px;
  font-weight: 800;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.header-left p { font-size: 14px; color: var(--text-light); margin-top: 4px; }
.modes {
  display: flex;
  gap: 8px;
  padding: 4px;
  background: var(--surface-glass);
  backdrop-filter: blur(20px);
  border-radius: 16px;
  border: 1px solid var(--border);
}
.mode-btn {
  flex: 1;
  padding: 14px 8px;
  border: none;
  background: transparent;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 600;
  color: var(--text-light);
  cursor: pointer;
  transition: all 0.3s;
}
.mode-btn.active {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white;
  box-shadow: 0 4px 12px rgba(16,185,129,0.3);
}
.chips-bar {
  display: flex;
  gap: 10px;
  padding: 4px;
  overflow-x: auto;
  scrollbar-width: none;
}
.chips-bar::-webkit-scrollbar { display: none; }
.chip {
  padding: 12px 20px;
  border: 2px solid var(--border);
  background: var(--surface);
  border-radius: 25px;
  font-size: 17px;
  font-weight: 500;
  color: var(--text);
  cursor: pointer;
  white-space: nowrap;
}
.chip:active {
  transform: scale(0.95);
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white;
  border-color: transparent;
}
.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 8px 4px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.msg {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  animation: fadeIn 0.3s ease-out;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.msg.user { flex-direction: row-reverse; }
.msg-avatar {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
.msg.ai .msg-avatar {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white;
}
.msg.user .msg-avatar {
  background: linear-gradient(135deg, var(--secondary), #d97706);
  color: white;
}
.msg-bubble {
  max-width: 85%;
  padding: 16px 20px;
  border-radius: 20px;
  font-size: 18px;
  line-height: 1.7;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
}
.msg.ai .msg-bubble {
  background: var(--surface);
  border: 1px solid var(--border);
  border-top-left-radius: 4px;
}
.msg.user .msg-bubble {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white;
  border-top-right-radius: 4px;
}
.input-bar {
  background: var(--surface);
  backdrop-filter: blur(20px);
  border-radius: 24px;
  padding: 12px;
  border: 2px solid var(--border);
  box-shadow: var(--shadow);
}
.input-row {
  display: flex;
  gap: 12px;
  align-items: flex-end;
}
.input-wrap {
  flex: 1;
  background: var(--bg-start);
  border-radius: 20px;
  padding: 14px 18px;
}
.input-wrap textarea {
  width: 100%;
  border: none;
  background: none;
  font-size: 20px;
  line-height: 1.5;
  resize: none;
  max-height: 100px;
  outline: none;
  font-family: inherit;
  color: var(--text);
}
.input-wrap textarea::placeholder { color: var(--text-light); }
.send-btn {
  width: 60px;
  height: 60px;
  border: none;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white;
  border-radius: 20px;
  font-size: 28px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 16px rgba(16,185,129,0.4);
  transition: transform 0.2s, box-shadow 0.2s;
  flex-shrink: 0;
}
.send-btn:active { transform: scale(0.9); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
.kb-card {
  margin-top: 16px;
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 4px 16px rgba(0,0,0,0.05);
}
.kb-card-header {
  padding: 16px 20px;
  background: linear-gradient(135deg, rgba(16,185,129,0.1), rgba(5,150,105,0.05));
  font-weight: 700;
  color: var(--primary-dark);
  font-size: 18px;
  border-bottom: 1px solid var(--border);
}
.kb-card-body {
  padding: 16px 20px;
  font-size: 16px;
  line-height: 1.8;
}
.kb-section { margin-bottom: 12px; }
.kb-section:last-child { margin-bottom: 0; }
.kb-section-title {
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 6px;
  font-size: 15px;
}
.kb-section-content { color: var(--text); }
.typing {
  display: flex;
  gap: 6px;
  padding: 8px 0;
}
.typing span {
  width: 10px;
  height: 10px;
  background: var(--primary);
  border-radius: 50%;
  animation: bounce 1.4s ease-in-out infinite;
}
.typing span:nth-child(1) { animation-delay: 0s; }
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); }
  30% { transform: translateY(-12px); }
}
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="header-left">
      <h1>🌿 AI中西医助手</h1>
      <p>昆明医科大学 · 专业健康咨询</p>
    </div>
  </div>

  <div class="modes" id="modesBar">
    <button class="mode-btn active" data-mode="consult">💬 咨询</button>
    <button class="mode-btn" data-mode="tcm">🌿 中医</button>
    <button class="mode-btn" data-mode="diet">🥗 饮食</button>
  </div>

  <div class="chips-bar" id="chipsBar"></div>

  <div class="chat-area" id="chatArea"></div>

  <div class="input-bar">
    <div class="input-row">
      <div class="input-wrap">
        <textarea id="userInput" rows="1" placeholder="输入症状或问题..."></textarea>
      </div>
      <button class="send-btn" id="sendBtn">➤</button>
    </div>
  </div>
</div>

<script>
// ===== KNOWLEDGE BASE =====
var KB_DATA = {"KB":{"感冒":{"cat":"呼吸系统","title":"普通感冒/上呼吸道感染","content":"普通感冒多由病毒引起。症状：鼻塞、流涕、咽痛、咳嗽、轻度发热。处理：多休息、补充水分、对症用药。若发热>38.5℃持续3天以上，或出现胸闷、呼吸困难，请立即就医。","symptoms":"鼻塞、流涕、咽痛、咳嗽、打喷嚏、轻度发热、头痛、肌肉酸痛","medicine":"对症治疗：解热镇痛药（对乙酰氨基酚、布洛芬）、抗组胺药（氯苯那敏）、止咳药（右美沙芬）、祛痰药（氨溴索）","advice":"多休息，保证充足睡眠；多喝温水，保持室内空气流通；饮食清淡，避免辛辣刺激；注意保暖，避免受凉","notes":"一般7-10天自愈。若症状加重或持续不缓解，请及时就医。"},"发热":{"cat":"其他","title":"发热","content":"体温升高超过正常范围。处理：物理降温、补充水分、必要时使用退热药。","symptoms":"体温升高、畏寒、出汗、头痛、乏力、食欲减退","medicine":"退热药：对乙酰氨基酚、布洛芬、阿司匹林","advice":"多喝水，补充电解质；物理降温（温水擦浴）；穿着宽松透气的衣物；保持室内通风","notes":"若体温>39℃或持续发热>3天，请立即就医。"},"咳嗽":{"cat":"呼吸系统","title":"咳嗽","content":"呼吸系统疾病的常见症状。处理：明确病因，对症治疗。","symptoms":"干咳或咳痰、胸闷、气促","medicine":"止咳药：右美沙芬、喷托维林；祛痰药：氨溴索、溴己新","advice":"多喝温水，避免刺激性气体；保持室内湿度适宜；避免吸烟和二手烟","notes":"若咳嗽持续>2周或伴血痰，请立即就医。"},"头痛":{"cat":"神经系统","title":"头痛","content":"多种原因引起的头部疼痛。处理：明确病因，对症治疗。","symptoms":"头部疼痛、恶心、呕吐、畏光、畏声","medicine":"止痛药：对乙酰氨基酚、布洛芬、阿司匹林","advice":"保持规律作息，避免熬夜；减少压力，放松心情；避免过度用眼","notes":"若头痛剧烈或突然发作，请立即就医。"},"高血压":{"cat":"心血管系统","title":"高血压","content":"血压持续升高的慢性疾病。需要长期管理和药物治疗。","symptoms":"头痛、头晕、耳鸣、心悸、胸闷、乏力","medicine":"降压药：ACEI（卡托普利、依那普利）、ARB（氯沙坦、缬沙坦）、CCB（氨氯地平、硝苯地平）、利尿剂（氢氯噻嗪）","advice":"低盐低脂饮食；适量运动；控制体重；戒烟限酒；保持心情舒畅","notes":"需长期规律服药，不可擅自停药。定期监测血压。"},"糖尿病":{"cat":"内分泌系统","title":"糖尿病","content":"血糖代谢异常的慢性疾病。需要终身管理和药物治疗。","symptoms":"多饮、多尿、多食、体重下降、乏力、视物模糊","medicine":"口服降糖药：二甲双胍、格列美脲、阿卡波糖；胰岛素注射","advice":"控制饮食，定时定量；适量运动；控制体重；定期监测血糖","notes":"需终身管理，定期复查血糖、糖化血红蛋白、眼底、肾功能。"}}};

// ===== STATE =====
var currentMode = 'consult';
var isTyping = false;

var CHIPS_DATA = {
  consult: ['感冒', '发热', '咳嗽', '头痛', '高血压', '糖尿病'],
  tcm: ['阴虚', '阳虚', '气虚'],
  diet: ['高血压饮食', '糖尿病饮食']
};

// ===== INIT =====
window.onerror = function(msg, url, line) {
  alert('JS错误: ' + msg + ' 行: ' + line);
  return false;
};

document.addEventListener('DOMContentLoaded', function() {
  console.log('DOM loaded');
  init();
});

function init() {
  console.log('init() called');
  console.log('KB_DATA:', KB_DATA ? 'loaded' : 'NOT loaded');
  
  var savedMode = localStorage.getItem('tcm_mode') || 'consult';
  switchMode(savedMode);
  
  document.getElementById('sendBtn').onclick = sendMessage;
  document.getElementById('userInput').onkeydown = handleKey;
  
  var modeBtns = document.querySelectorAll('.mode-btn');
  for (var i = 0; i < modeBtns.length; i++) {
    modeBtns[i].onclick = function() {
      switchMode(this.getAttribute('data-mode'));
    };
  }
  
  console.log('init complete');
}

function switchMode(mode) {
  console.log('switchMode:', mode);
  currentMode = mode;
  localStorage.setItem('tcm_mode', mode);
  
  var modeBtns = document.querySelectorAll('.mode-btn');
  for (var i = 0; i < modeBtns.length; i++) {
    if (modeBtns[i].getAttribute('data-mode') === mode) {
      modeBtns[i].className = 'mode-btn active';
    } else {
      modeBtns[i].className = 'mode-btn';
    }
  }
  
  var bar = document.getElementById('chipsBar');
  bar.innerHTML = '';
  var chips = CHIPS_DATA[mode] || [];
  for (var i = 0; i < chips.length; i++) {
    var btn = document.createElement('button');
    btn.className = 'chip';
    btn.textContent = chips[i];
    btn.onclick = (function(kw) {
      return function() { sendQuick(kw); };
    })(chips[i]);
    bar.appendChild(btn);
  }
  
  document.getElementById('chatArea').innerHTML = '';
  addAIMessage('您好！我是AI中西医健康助手。请输入您的症状或问题。');
}

function sendMessage() {
  console.log('sendMessage called');
  var input = document.getElementById('userInput');
  var text = (input.value || '').trim();
  
  console.log('text:', text);
  
  if (!text) {
    console.log('empty text, return');
    return;
  }
  if (isTyping) {
    console.log('isTyping, return');
    return;
  }
  
  input.value = '';
  addUserMessage(text);
  processQuery(text);
}

function sendQuick(kw) {
  console.log('sendQuick:', kw);
  if (isTyping) return;
  addUserMessage(kw);
  processQuery(kw);
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function addUserMessage(text) {
  var chat = document.getElementById('chatArea');
  var div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = '<div class="msg-avatar">👤</div><div class="msg-bubble">' + escapeHtml(text) + '</div>';
  chat.appendChild(div);
  scrollChat();
}

function addAIMessage(text, cardHtml) {
  var chat = document.getElementById('chatArea');
  var div = document.createElement('div');
  div.className = 'msg ai';
  var html = '<div class="msg-avatar">🌿</div><div class="msg-bubble">';
  if (text) html += escapeHtml(text);
  if (cardHtml) html += cardHtml;
  html += '</div>';
  div.innerHTML = html;
  chat.appendChild(div);
  scrollChat();
}

function scrollChat() {
  var chat = document.getElementById('chatArea');
  chat.scrollTop = chat.scrollHeight;
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function showTyping() {
  isTyping = true;
  document.getElementById('sendBtn').disabled = true;
  var chat = document.getElementById('chatArea');
  var div = document.createElement('div');
  div.className = 'msg ai';
  div.id = 'typingMsg';
  div.innerHTML = '<div class="msg-avatar">🌿</div><div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
  chat.appendChild(div);
  scrollChat();
}

function hideTyping() {
  isTyping = false;
  document.getElementById('sendBtn').disabled = false;
  var el = document.getElementById('typingMsg');
  if (el) el.remove();
}

function processQuery(query) {
  console.log('processQuery:', query);
  showTyping();
  var self = this;
  setTimeout(function() {
    hideTyping();
    var result = searchKB(query);
    console.log('result:', result);
    addAIMessage(result.text, result.cardHtml);
  }, 500);
}

function searchKB(query) {
  var q = (query || '').toLowerCase();
  var kb = KB_DATA.KB || {};
  
  console.log('searchKB, q:', q);
  console.log('kb keys:', Object.keys(kb));
  
  for (var name in kb) {
    if (q.indexOf(name.toLowerCase()) >= 0 || name.toLowerCase().indexOf(q) >= 0) {
      console.log('found:', name);
      return buildKBResponse(name, kb[name]);
    }
  }
  
  return { text: '抱歉，我暂时没有找到相关信息。请尝试输入具体的症状或疾病名称，如"感冒"、"高血压"等。', cardHtml: '' };
}

function buildKBResponse(name, data) {
  var html = '<div class="kb-card"><div class="kb-card-header">📋 ' + name + '</div><div class="kb-card-body">';
  if (data.symptoms) html += '<div class="kb-section"><div class="kb-section-title">常见症状</div><div class="kb-section-content">' + data.symptoms + '</div></div>';
  if (data.medicine) html += '<div class="kb-section"><div class="kb-section-title">常用药物</div><div class="kb-section-content">' + data.medicine + '</div></div>';
  if (data.advice) html += '<div class="kb-section"><div class="kb-section-title">生活建议</div><div class="kb-section-content">' + data.advice + '</div></div>';
  if (data.notes) html += '<div class="kb-section"><div class="kb-section-title">注意事项</div><div class="kb-section-content">' + data.notes + '</div></div>';
  html += '</div></div>';
  return { text: '', cardHtml: html };
}
</script>
</body>
</html>
