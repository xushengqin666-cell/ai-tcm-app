<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>岐黄智医 — AI中西医结合健康助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--pri:#1565c0;--pri-l:#42a5f5;--pri-d:#0d47a1;--acc:#ff6f00;--bg:#f5f7fa;--card:#fff;--txt:#1a1a2e;--txt2:#5f6368;--sh:0 2px 12px rgba(0,0,0,.08);--r:16px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--txt);height:100vh;display:flex;flex-direction:column;overflow:hidden}
/* Header */
.hd{background:linear-gradient(135deg,var(--pri-d),var(--pri),var(--pri-l));color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(21,101,192,.3);z-index:10}
.hd .logo{font-size:22px;font-weight:700;letter-spacing:1px}
.hd .logo span{font-size:13px;font-weight:400;opacity:.85;margin-left:8px}
.hd .spacer{flex:1}
.hd .gear{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;opacity:.8;transition:.2s}
.hd .gear:hover{opacity:1;transform:rotate(30deg)}
/* Tabs */
.tabs{display:flex;background:#fff;border-bottom:1px solid #e0e0e0}
.tabs button{flex:1;padding:10px;border:none;background:none;font-size:14px;font-weight:600;color:var(--txt2);cursor:pointer;border-bottom:3px solid transparent;transition:.2s}
.tabs button.active{color:var(--pri);border-bottom-color:var(--pri)}
.tabs button:hover{background:#f0f4ff}
/* Panels */
.panel{display:none;flex:1;overflow-y:auto;padding:16px}
.panel.active{display:flex;flex-direction:column}
/* Chat */
.chat-area{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:12px 16px;border-radius:var(--r);line-height:1.6;font-size:15px;animation:fadeUp .3s ease;word-break:break-word}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--pri),var(--pri-l));color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:#fff;border:1px solid #e8eaf6;box-shadow:var(--sh);border-bottom-left-radius:4px}
.msg.ai b{color:var(--pri)}
.msg.ai .tag{display:inline-block;background:#e3f2fd;color:var(--pri);padding:2px 8px;border-radius:8px;font-size:12px;font-weight:600;margin:2px 4px 2px 0}
.msg .disclaimer{display:block;margin-top:10px;font-size:12px;color:#999;border-top:1px dashed #e0e0e0;padding-top:8px}
.msg.loading{align-self:flex-start;background:#fff;border:1px solid #e8eaf6;box-shadow:var(--sh);padding:16px 20px}
.spinner{width:28px;height:28px;border:3px solid #e0e0e0;border-top-color:var(--pri);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
/* Input bar */
.input-bar{display:flex;gap:8px;padding:12px 16px;background:#fff;border-top:1px solid #e0e0e0}
.input-bar input{flex:1;border:2px solid #e0e0e0;border-radius:24px;padding:10px 18px;font-size:15px;outline:none;transition:.2s}
.input-bar input:focus{border-color:var(--pri-l)}
.input-bar button{background:linear-gradient(135deg,var(--pri),var(--pri-l));color:#fff;border:none;border-radius:24px;padding:10px 20px;font-size:15px;font-weight:600;cursor:pointer;transition:.2s}
.input-bar button:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(21,101,192,.3)}
.input-bar button:active{transform:translateY(0)}
/* Model bar */
.model-bar{display:flex;gap:6px;padding:8px 16px;background:#fff;overflow-x:auto;border-bottom:1px solid #f0f0f0}
.model-bar button{padding:5px 12px;border-radius:20px;border:1px solid #e0e0e0;background:#fff;font-size:12px;cursor:pointer;white-space:nowrap;transition:.2s}
.model-bar button.active{background:var(--pri);color:#fff;border-color:var(--pri)}
.model-bar button:hover{border-color:var(--pri-l)}
/* Quiz */
.quiz-wrap{max-width:500px;margin:0 auto;width:100%}
.quiz-card{background:#fff;border-radius:var(--r);padding:24px;box-shadow:var(--sh);margin-bottom:16px}
.quiz-card h3{font-size:17px;margin-bottom:16px;color:var(--pri-d)}
.quiz-card .opts{display:flex;flex-direction:column;gap:10px}
.quiz-card .opt{padding:12px 16px;border:2px solid #e0e0e0;border-radius:12px;cursor:pointer;transition:.2s;font-size:15px}
.quiz-card .opt:hover{border-color:var(--pri-l);background:#f0f4ff}
.quiz-card .opt.sel{border-color:var(--pri);background:#e3f2fd;font-weight:600}
.prog-bar{height:6px;background:#e0e0e0;border-radius:3px;margin-bottom:16px;overflow:hidden}
.prog-bar .fill{height:100%;background:linear-gradient(90deg,var(--pri),var(--pri-l));border-radius:3px;transition:width .4s ease}
.result-card{background:linear-gradient(135deg,#e3f2fd,#f3e5f5);border-radius:var(--r);padding:24px;box-shadow:var(--sh)}
.result-card h2{color:var(--pri-d);margin-bottom:12px}
.result-card .rsec{margin-bottom:12px}
.result-card .rsec h4{color:var(--pri);margin-bottom:4px}
/* Settings */
.settings-wrap{max-width:500px;margin:0 auto;width:100%}
.s-card{background:#fff;border-radius:var(--r);padding:20px;box-shadow:var(--sh);margin-bottom:12px}
.s-card h3{font-size:15px;color:var(--pri-d);margin-bottom:12px}
.s-card label{display:block;font-size:13px;color:var(--txt2);margin-bottom:4px}
.s-card input{width:100%;border:2px solid #e0e0e0;border-radius:10px;padding:8px 12px;font-size:14px;outline:none;margin-bottom:12px;transition:.2s}
.s-card input:focus{border-color:var(--pri-l)}
.s-card .hint{font-size:12px;color:#999;margin-top:-8px;margin-bottom:12px}
.s-card button{background:var(--pri);color:#fff;border:none;border-radius:10px;padding:8px 20px;font-size:14px;cursor:pointer;transition:.2s}
.s-card button:hover{background:var(--pri-d)}
/* Welcome */
.welcome{text-align:center;padding:40px 20px}
.welcome h2{color:var(--pri-d);font-size:22px;margin-bottom:8px}
.welcome p{color:var(--txt2);font-size:14px;line-height:1.8}
.welcome .feats{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:20px}
.welcome .feat{background:#fff;border-radius:12px;padding:14px 18px;box-shadow:var(--sh);font-size:14px;text-align:center;min-width:120px}
.welcome .feat .icon{font-size:28px;margin-bottom:6px}
</style>
</head>
<body>
<div class="hd">
  <div class="logo">🏥 岐黄智医<span>AI中西医结合健康助手</span></div>
  <div class="spacer"></div>
  <button class="gear" onclick="showPanel('settings')">⚙️</button>
</div>
<div class="tabs">
  <button id="t-chat" class="active" onclick="showPanel('chat')">💬 智能问诊</button>
  <button id="t-quiz" onclick="showPanel('quiz')">🔄 体质辨识</button>
  <button id="t-settings" onclick="showPanel('settings')">⚙️ 设置</button>
</div>
<div class="model-bar" id="modelBar"></div>

<!-- Chat Panel -->
<div class="panel active" id="p-chat">
  <div class="chat-area" id="chatArea"></div>
  <div class="input-bar">
    <input id="inp" placeholder="描述您的症状或健康问题…" onkeypress="if(event.key==='Enter')send()">
    <button onclick="send()">发送</button>
  </div>
</div>

<!-- Quiz Panel -->
<div class="panel" id="p-quiz">
  <div class="quiz-wrap" id="quizWrap"></div>
</div>

<!-- Settings Panel -->
<div class="panel" id="p-settings">
  <div class="settings-wrap">
    <div class="s-card">
      <h3>🔑 API Key 配置</h3>
      <label>Groq API Key（免费）</label>
      <input id="groqKey" type="password" placeholder="gsk_…">
      <div class="hint">申请：<a href="https://console.groq.com/keys" target="_blank">console.groq.com</a></div>
      <label>DeepSeek API Key</label>
      <input id="dsKey" type="password" placeholder="sk-…">
      <div class="hint">申请：<a href="https://platform.deepseek.com/api_keys" target="_blank">platform.deepseek.com</a></div>
      <button onclick="saveKeys()">💾 保存</button>
    </div>
    <div class="s-card">
      <h3>ℹ️ 使用说明</h3>
      <p style="font-size:14px;line-height:1.8;color:#5f6368">
        <b>无需配置即可使用：</b>本机运行 OpenClaw 时自动连接本地AI。<br>
        <b>配置 API Key：</b>可在不同设备使用 Groq/DeepSeek AI。<br>
        <b>本地知识库：</b>覆盖18种常见病症，无需联网。<br>
        <b>体质辨识：</b>18道题测出您的中医体质类型。
      </p>
    </div>
  </div>
</div>

<script>
// ========== Knowledge Base ==========
var KB=[
{kw:["感冒","风寒","风热","流鼻涕","打喷嚏","鼻塞","伤风"],t:"感冒",c:"<span class='tag'>西医</span>上呼吸道病毒感染，分普通感冒和流感。<br><span class='tag'>中医</span>外感六淫，分风寒（恶寒重、发热轻、无汗）和风热（发热重、恶寒轻、有汗）。",d:"风寒：生姜红糖水、葱白粥<br>风热：银翘片、菊花茶、薄荷水",m:"风寒：感冒清热颗粒、正柴胡饮<br>风热：银翘解毒片、板蓝根"},
{kw:["发烧","发热","体温高","高烧","低烧"],t:"发烧",c:"<span class='tag'>西医</span>体温调节中枢异常，常见于感染、炎症。<br><span class='tag'>中医</span>正邪交争的表现，分外感发热和内伤发热。",d:"多饮温水、稀粥、绿豆汤<br>忌辛辣油腻",m:"布洛芬（>38.5℃）、对乙酰氨基酚<br>中医：小柴胡汤、白虎汤"},
{kw:["头痛","头疼","偏头痛","头胀","头晕"],t:"头痛",c:"<span class='tag'>西医</span>紧张性头痛最常见，其次偏头痛、丛集性头痛。<br><span class='tag'>中医</span>分外感头痛（风寒/风热/风湿）和内伤头痛（肝阳/血虚/瘀血）。",d:"天麻炖鸡、菊花茶<br>避免巧克力、红酒、奶酪",m:"布洛芬、对乙酰氨基酚<br>中医：川芎茶调散、天麻钩藤饮"},
{kw:["失眠","睡不着","入睡困难","多梦","早醒"],t:"失眠",c:"<span class='tag'>西医</span>入睡困难、睡眠质量差，与压力、焦虑、生活习惯有关。<br><span class='tag'>中医</span>心神失养或邪扰心神，常见心脾两虚、肝火扰心、心肾不交。",d:"酸枣仁粥、百合莲子汤、温牛奶<br>睡前忌咖啡茶酒",m:"褪黑素（短期）、艾司唑仑（处方）<br>中医：酸枣仁汤、天王补心丹、归脾丸"},
{kw:["胃痛","胃疼","胃胀","反酸","烧心","胃炎"],t:"胃痛",c:"<span class='tag'>西医</span>急慢性胃炎、胃溃疡、功能性消化不良。<br><span class='tag'>中医</span>胃气郁滞或胃络瘀阻，分寒凝、食积、肝气犯胃、脾胃虚寒。",d:"小米粥、山药粥、少量多餐<br>忌生冷辛辣烟酒浓茶",m:"奥美拉唑、铝碳酸镁<br>中医：香砂六君子汤、黄芪建中汤"},
{kw:["腹泻","拉肚子","拉稀","大便稀","水样便","急性胃肠炎"],t:"腹泻",c:"<span class='tag'>西医</span>急性多由感染（病毒/细菌）引起，慢性需排查肠易激、炎症性肠病。<br><span class='tag'>中医</span>分寒湿、湿热、食积、脾虚、肾阳虚。",d:"米粥、面汤、苹果煮水<br>忌油腻生冷乳制品<br>注意补水补盐",m:"蒙脱石散、口服补液盐<br>中医：藿香正气水（寒湿）、葛根芩连汤（湿热）"},
{kw:["便秘","大便干","排便困难","几天没拉"],t:"便秘",c:"<span class='tag'>西医</span>排便频率减少（<3次/周）或排便困难，分功能性和器质性。<br><span class='tag'>中医</span>分热秘、气秘、虚秘、冷秘。",d:"多食膳食纤维（燕麦、红薯、绿叶菜）<br>晨起空腹温开水<br>蜂蜜水、火龙果",m:"乳果糖、聚乙二醇<br>中医：麻子仁丸（热秘）、黄芪汤（气虚）"},
{kw:["咳嗽","咳","干咳","痰多","久咳"],t:"咳嗽",c:"<span class='tag'>西医</span>呼吸道防御反射，分急性（<3周）、亚急性、慢性（>8周）。<br><span class='tag'>中医</span>分外感（风寒/风热/燥咳）和内伤（痰湿/肝火/阴虚）。",d:"风寒：生姜红糖水<br>风热：梨汁、枇杷<br>燥咳：蜂蜜梨水、银耳汤",m:"右美沙芬（干咳）、氨溴索（化痰）<br>中医：止嗽散、二陈汤"},
{kw:["过敏","荨麻疹","皮疹","瘙痒","过敏体质"],t:"过敏",c:"<span class='tag'>西医</span>免疫系统过度反应，常见过敏性鼻炎、荨麻疹、湿疹。<br><span class='tag'>中医</span>禀赋不耐，风邪客于肌表，或血虚生风。",d:"避免过敏原<br>清淡饮食，忌海鲜发物<br>薏米赤小豆汤",m:"氯雷他定、西替利嗪<br>中医：消风散、防风通圣丸"},
{kw:["颈椎","脖子痛","颈肩","落枕","颈痛"],t:"颈椎不适",c:"<span class='tag'>西医</span>颈型颈椎病最常见，长期低头、姿势不良所致。<br><span class='tag'>中医</span>经络不通、气血瘀滞，属痹证范畴。",d:"补充钙质和维生素D<br>适度颈部运动",m:"布洛芬外用、贴膏<br>中医：桂枝加葛根汤、针灸推拿"},
{kw:["腰痛","腰酸","腰椎","肾虚","腰肌劳损"],t:"腰痛",c:"<span class='tag'>西医</span>腰肌劳损、腰椎间盘突出最常见。<br><span class='tag'>中医</span>腰为肾之府，分肾虚、瘀血、寒湿、湿热腰痛。",d:"黑豆核桃粥、杜仲炖猪腰<br>注意腰部保暖",m:"布洛芬、外用贴膏<br>中医：独活寄生汤、右归丸"},
{kw:["月经","痛经","经痛","姨妈痛","经期"],t:"痛经",c:"<span class='tag'>西医</span>原发性（无器质性病变）和继发性（子宫内膜异位等）。<br><span class='tag'>中医</span>不通则痛，分寒凝血瘀、气滞血瘀、气血两虚。",d:"红糖姜茶、桂圆红枣汤<br>经期忌冷饮寒凉",m:"布洛芬、萘普生<br>中医：少腹逐瘀汤、益母草膏"},
{kw:["失眠多梦","心悸","心慌","焦虑","紧张","烦躁"],t:"心悸焦虑",c:"<span class='tag'>西医</span>心律失常、焦虑障碍、自主神经功能紊乱。<br><span class='tag'>中医</span>心神不宁，分心虚胆怯、心血不足、阴虚火旺。",d:"莲子百合粥、玫瑰花茶<br>规律作息，适度运动",m:"中医：甘麦大枣汤、安神定志丸<br>西医：必要时β受体阻滞剂"},
{kw:["高血压","血压高","头晕目眩"],t:"高血压",c:"<span class='tag'>西医</span>血压持续≥140/90mmHg，需长期管理。<br><span class='tag'>中医</span>属眩晕、头痛范畴，分肝阳上亢、痰湿内阻、阴虚阳亢。",d:"低盐低脂饮食<br>芹菜汁、山楂茶<br>控制体重",m:"遵医嘱用降压药<br>中医：天麻钩藤饮、半夏白术天麻汤"},
{kw:["糖尿病","血糖高","多饮多尿","消渴"],t:"糖尿病",c:"<span class='tag'>西医</span>胰岛素分泌或作用缺陷，分1型和2型。<br><span class='tag'>中医</span>消渴症，分上消（肺热）、中消（胃热）、下消（肾虚）。",d:"控制总热量<br>苦瓜、山药、燕麦<br>少食多餐",m:"遵医嘱用降糖药/胰岛素<br>中医：消渴方、六味地黄丸"},
{kw:["痛风","尿酸高","关节痛","红肿热痛"],t:"痛风",c:"<span class='tag'>西医</span>尿酸结晶沉积关节，急性发作红肿热痛。<br><span class='tag'>中医</span>湿热痹证，痰瘀互结。",d:"低嘌呤饮食<br>忌海鲜啤酒内脏<br>多饮水（>2L/天）",m:"秋水仙碱（急性）、非布司他<br>中医：四妙丸、当归拈痛汤"},
{kw:["湿疹","皮肤痒","皮炎","渗出"],t:"湿疹",c:"<span class='tag'>西医</span>皮肤炎症反应，分急性亚急性慢性。<br><span class='tag'>中医</span>风湿热邪浸淫肌肤，或血虚风燥。",d:"清淡饮食，忌辛辣发物<br>薏米绿豆汤",m:"外用糖皮质激素、保湿<br>中医：龙胆泻肝汤（湿热）、当归饮子（血虚）"},
{kw:["痤疮","青春痘","长痘","粉刺","暗疮"],t:"痤疮",c:"<span class='tag'>西医</span>毛囊皮脂腺慢性炎症，与雄激素、皮脂、痤疮丙酸杆菌相关。<br><span class='tag'>中医</span>肺胃蕴热或湿热蕴结。",d:"清淡饮食，忌甜食奶制品<br>多食蔬果<br>规律作息",m:"外用阿达帕林、过氧苯甲酰<br>中医：枇杷清肺饮、黄连解毒汤"}

function renderModelBar(){

    var m=MODELS[k];
    var b=document.createElement('button');
    b.textContent=m.icon+' '+m.name;
    b.className=k===curModel?'active':'';
    b.onclick=(function(kk){return function(){curModel=kk;localStorage.setItem('curModel',kk);renderModelBar();}})(k);
    bar.appendChild(b);
  }
}
renderModelBar();

// ========== KB Search ==========
function searchKB(q){
  q=q.toLowerCase();
  var best=null,bestScore=0;
  for(var i=0;i<KB.length;i++){
    var score=0;
    for(var j=0;j<KB[i].kw.length;j++){
      if(q.includes(KB[i].kw[j].toLowerCase()))score++;
    }
    if(score>bestScore){bestScore=score;best=KB[i];}
  }
  return bestScore>0?best:null;
}

// ========== Chat ==========
var chatArea=document.getElementById('chatArea');

function addMsg(cls,html){
  var d=document.createElement('div');
  d.className='msg '+cls;
  d.innerHTML=html;
  chatArea.appendChild(d);

}

showWelcome();

async function send(){
  var inp=document.getElementById('inp'),q=inp.value.trim();
  if(!q)return;
  addMsg('user',esc(q));
  inp.value='';

  // 1. Try local KB
  var kb=searchKB(q);
  if(kb){
    addMsg('ai','<b>📋 '+esc(kb.t)+'</b><br><br>'+kb.c+'<br><br><b>🍎 饮食建议：</b><br>'+kb.d+'<br><br><b>💊 常用药物：</b><br>'+kb.m+'<span class="disclaimer">⚠️ 仅供参考，如有不适请及时就医</span>');
    return;
  }

  // 2. Try AI
  var ld=document.createElement('div');
  ld.className='msg loading';
  ld.innerHTML='<div class="spinner"></div>';
  chatArea.appendChild(ld);
  chatArea.scrollTop=99999;

  try{
    await callAI(q);
    chatArea.removeChild(ld);
  }catch(e){
    chatArea.removeChild(ld);
    addMsg('ai','❌ AI请求失败：'+esc(e.message)+'<br><br>💡 建议：<br>1. 本机运行 OpenClaw 可免费使用本地AI<br>2. 在⚙️设置中配置免费 <a href="https://console.groq.com/keys" target="_blank" style="color:var(--pri)">Groq API Key</a>');
  }
}

function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

async function callAI(q){
  var cfg=MODELS[curModel];
  var key=cfg.keyField?document.getElementById(cfg.keyField).value||localStorage.getItem(cfg.keyField):null;
  var sys='你是岐黄智医，一个专业的AI中西医结合健康助手。回答要求：1)简洁易懂 2)结合中西医双重视角 3)给出饮食和生活建议 4)提醒严重情况需就医 5)不要过度诊断';

  var headers={'Content-Type':'application/json'};
  if(key)headers['Authorization']='Bearer '+key;

  var body=JSON.stringify({model:cfg.model,messages:[{role:'system',content:sys},{role:'user',content:q}],stream:true});

  var resp=await fetch(cfg.base,{method:'POST',headers:headers,body:body});
  if(!resp.ok){
    var errTxt='';
    try{errTxt=await resp.text();}catch(e){}
    if(resp.status===401)throw new Error('API Key无效，请检查设置');
    if(resp.status===402)throw new Error('API余额不足，请充值或更换Key');
    if(resp.status===429)throw new Error('请求过于频繁，请稍后重试');
    throw new Error('HTTP '+resp.status+' '+(errTxt||''));
  }

  var msgDiv=addMsg('ai','');
  var reader=resp.body.getReader();
  var decoder=new TextDecoder();
  var full='';
  var thinking='';

  while(true){
    var result=await reader.read();
    if(result.done)break;
    var chunk=decoder.decode(result.value,{stream:true});
    var lines=chunk.split('\n');
    for(var i=0;i<lines.length;i++){
      var line=lines[i];
      if(!line.startsWith('data: '))continue;
      var data=line.slice(6).trim();
      if(data==='[DONE]')continue;
      try{
        var json=JSON.parse(data);
        var delta=json.choices&&json.choices[0]&&json.choices[0].delta;
        if(!delta)continue;
        // DeepSeek-R1 thinking
        if(cfg.think&&delta.reasoning_content){
          thinking+=delta.reasoning_content;
        }
        if(delta.content){
          full+=delta.content;
          var display='';
          if(thinking)display='<details style="margin-bottom:8px"><summary style="cursor:pointer;color:#999;font-size:13px">🧠 思考过程</summary><div style="padding:8px;background:#f5f5f5;border-radius:8px;font-size:13px;color:#666;margin-top:4px">'+esc(thinking)+'</div></details>';
          display+=full;
          msgDiv.innerHTML=display;
          chatArea.scrollTop=99999;
        }
      }catch(e){}
    }
  }
  if(!full&&thinking){
    msgDiv.innerHTML='<details><summary style="cursor:pointer;color:#999;font-size:13px">🧠 思考过程</summary><div style="padding:8px;background:#f5f5f5;border-radius:8px;font-size:13px;color:#666">'+esc(thinking)+'</div></details><br>模型完成了思考但未输出结论，请再次提问。';
  }
  msgDiv.innerHTML+='<span class="disclaimer">⚠️ AI生成内容仅供参考，如有不适请及时就医</span>';
}

// ========== Panel Switch ==========
function showPanel(p){
  ['chat','quiz','settings'].forEach(function(x){
    document.getElementById('p-'+x).className='panel'+(x===p?' active':'');

  if(p==='settings')loadKeys();
}

function startQuiz(){
  quizStarted=true;quizAns=[];
  renderQ();
}

function renderQ(){
  var wrap=document.getElementById('quizWrap');
  var qi=quizAns.length;
  if(qi>=QS.length){showResult();return;}
  var pct=Math.round(qi/QS.length*100);
  wrap.innerHTML='<div class="prog-bar"><div class="fill" style="width:'+pct+'%"></div></div><div class="quiz-card"><h3>第 '+(qi+1)+' / '+QS.length+' 题</h3><p style="font-size:16px;margin-bottom:16px">'+QS[qi]+'</p><div class="opts"><div class="opt" onclick="ans(1)">是</div><div class="opt" onclick="ans(0.5)">有时</div><div class="opt" onclick="ans(0)">否</div></div></div>';
}

function ans(v){
  quizAns.push(v);
  renderQ();
}

function showResult(){
  var scores=CST.map(function(){return 0;});
  // Map answers to constitution scores (simplified)
  var map=[[0],[1],[2],[3],[4],[5],[6],[7],[8,0],[0],[2],[3],[4],[5],[6],[7],[8],[8]];
  for(var i=0;i<quizAns.length;i++){
    var idx=map[i];
    for(var j=0;j<idx.length;j++){
      if(idx[j]<9)scores[idx[j]]+=quizAns[i];
    }
  }
  var maxI=0;for(var i=1;i<9;i++){if(scores[i]>scores[maxI])maxI=i;}
  var c=CST[maxI],info=CI[c];
  document.getElementById('quizWrap').innerHTML='<div class="result-card"><h2>🎯 您的体质：'+c+'质</h2><div class="rsec"><h4>常见表现</h4><p>'+info.s+'</p></div><div class="rsec"><h4>体质特征</h4><p>'+info.t+'</p></div><div class="rsec"><h4>调理建议</h4><p>'+info.l+'</p></div><div class="rsec"><h4>推荐饮食</h4><p>'+info.d+'</p></div><button onclick="quizStarted=false;quizAns=[];startQuiz()" style="margin-top:16px;background:var(--pri);color:#fff;border:none;border-radius:12px;padding:10px 24px;font-size:14px;cursor:pointer">🔄 重新测试</button></div>';
}
