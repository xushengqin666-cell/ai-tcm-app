<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0052d9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>AI中西医健康助手</title>
<style>
/* 极简重置 - 最大化兼容性 */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f0f2f5;color:#1a1a1a;font-size:17px;line-height:1.6;overflow:hidden;touch-action:manipulation;-webkit-text-size-adjust:100%}

/* 全屏容器 */
.app{width:100%;max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:#f0f2f5;position:relative}

/* 顶部标题栏 */
.header{background:linear-gradient(135deg,#0052d9,#0041b3);color:#fff;padding:14px 14px 8px;flex-shrink:0}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.header-brand{display:flex;align-items:center;gap:10px}
.header-icon{width:44px;height:44px;background:rgba(255,255,255,0.18);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px}
.header-title{font-size:19px;font-weight:700}
.header-sub{font-size:12px;opacity:0.75}
.header-btns{display:flex;gap:8px}
.header-btn{background:rgba(255,255,255,0.15);border:none;border-radius:10px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;color:#fff}

/* 模式标签 */
.modes{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.modes::-webkit-scrollbar{display:none}
.mode{font-size:15px;font-weight:500;padding:6px 14px;border-radius:20px;border:1.5px solid rgba(255,255,255,0.35);background:transparent;color:rgba(255,255,255,0.82);cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:inherit}
.mode.on{background:#fff;color:#0052d9;border-color:#fff;font-weight:600}

/* 快速按钮 */
.quick{padding:8px 10px;background:rgba(255,255,255,0.06)}
.quick-btn{font-size:13px;padding:5px 12px;border-radius:14px;border:1px solid rgba(255,255,255,0.28);background:transparent;color:#fff;cursor:pointer;white-space:nowrap;font-family:inherit}

/* 对话区 */
.chat{flex:1;overflow-y:auto;padding:14px 10px 130px;-webkit-overflow-scrolling:touch}
.chat::-webkit-scrollbar{width:3px}
.chat::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.12);border-radius:2px}

/* 消息 */
.msg{display:flex;gap:9px;margin-bottom:14px;animation:msgIn 0.3s ease}
.msg.me{flex-direction:row-reverse}
.msg-ava{width:36px;height:36px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px}
.msg.me .msg-ava{background:linear-gradient(135deg,#0052d9,#0041b3);color:#fff}
.msg.ai .msg-ava{background:#fff;border:1px solid #e5e7eb;color:#0052d9}
.msg-body{max-width:80%}
.msg-c{padding:11px 15px;border-radius:14px;font-size:18px;line-height:1.7;word-break:break-word}
.msg.me .msg-c{background:linear-gradient(135deg,#0052d9,#0041b3);color:#fff;border-radius:14px 3px 14px 14px}
.msg.ai .msg-c{background:#fff;color:#1a1a1a;border-radius:3px 14px 14px 14px;box-shadow:0 1px 8px rgba(0,0,0,0.06)}
.msg-t{font-size:11px;color:#999;margin-top:4px;padding:0 3px}

/* 医学卡片 */
.emg{background:#fffbea;border:1.5px solid #ffe58f;border-radius:12px;padding:12px;margin-top:10px}
.emg h5{color:#d48806;font-size:16px;font-weight:700;margin-bottom:5px}
.emg p{color:#7c4600;font-size:17px}
.sec{background:#f0f5ff;border:1.5px solid #dce8ff;border-radius:12px;padding:12px;margin-top:10px}
.sec h4{color:#0052d9;font-size:16px;font-weight:700;margin-bottom:8px}
.sec ul{list-style:none;padding:0;margin:0}
.sec li{padding:4px 0;font-size:17px;color:#333;border-bottom:1px solid rgba(0,0,0,0.05)}
.sec li:last-child{border:none}
.sec li::before{content:'•';color:#0052d9;font-weight:700;margin-right:6px}
.eat{background:#f6ffed;border:1.5px solid #b7eb8f;border-radius:12px;padding:12px;margin-top:10px}
.eat h4{color:#389e0d;font-size:16px;font-weight:700;margin-bottom:6px}
.herb{background:#fef7ff;border:1.5px solid #efdbff;border-radius:12px;padding:12px;margin-top:10px}
.herb h4{color:#722ed1;font-size:16px;font-weight:700;margin-bottom:6px}
.drug{background:#fff7e6;border:1.5px solid #ffd591;border-radius:12px;padding:12px;margin-top:10px}
.drug h4{color:#d46b08;font-size:16px;font-weight:700;margin-bottom:6px}
.mem{background:linear-gradient(90deg,#667eea,#764ba2);color:#fff;padding:3px 10px;border-radius:12px;font-size:13px}

/* 底部输入 */
.input{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:#fff;border-top:1px solid rgba(0,0,0,0.08);padding:8px 12px 12px;z-index:100}
.input-inner{display:flex;gap:8px;align-items:flex-end}
.txt{flex:1;min-height:46px;max-height:120px;border:1.5px solid #e5e7eb;border-radius:23px;padding:8px 18px;outline:none;font-size:18px;line-height:1.5;resize:none;font-family:inherit;background:#f8f9fa;transition:border-color .2s}
.txt:focus{border-color:#0052d9;background:#fff}
.send{width:46px;height:46px;border-radius:50%;border:none;background:linear-gradient(135deg,#0052d9,#0041b3);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;box-shadow:0 3px 10px rgba(0,82,217,0.3)}

/* 打字动画 */
.typing{display:flex;gap:9px;margin-bottom:14px}
.typing-dots{display:flex;gap:4px;padding:14px 18px;background:#fff;border-radius:3px 14px 14px 14px;box-shadow:0 1px 8px rgba(0,0,0,0.06)}
.typing-dots span{width:8px;height:8px;background:#0052d9;border-radius:50%;animation:db 1.4s infinite;opacity:.5}
.typing-dots span:nth-child(2){animation-delay:.2s}
.typing-dots span:nth-child(3){animation-delay:.4s}
@keyframes db{0%,80%,100%{transform:scale(.7);opacity:.4}40%{transform:scale(1);opacity:1}}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* Toast */
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-20px);background:rgba(24,24,24,.88);color:#fff;padding:10px 24px;border-radius:24px;font-size:15px;z-index:9999;white-space:nowrap;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{background:#52c41a}
#toast.err{background:#ff4d4f}

/* 模态 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;display:none;align-items:center;justify-content:center;padding:20px;-webkit-backdrop-filter:blur(6px)}
.modal.on{display:flex}
.modal-card{background:#fff;border-radius:20px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto;padding:24px;animation:mc .3s ease}
@keyframes mc{from{opacity:0;transform:scale(.92) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}

/* 反馈 */
.fb-t{font-size:21px;font-weight:700;margin-bottom:4px}
.fb-s{font-size:14px;color:#888;margin-bottom:16px}
.fb-stars{text-align:center;font-size:44px;margin:14px 0;cursor:pointer;letter-spacing:6px}
.fb-star{color:#ddd;display:inline-block;transition:all .15s}
.fb-star.on{color:#ffc107;transform:scale(1.18)}
.fb-ta{width:100%;height:110px;padding:14px;border-radius:12px;border:1.5px solid #e5e7eb;font-size:17px;resize:none;outline:none;font-family:inherit;line-height:1.6;background:#f8f9fa;margin-top:12px}
.fb-ta:focus{border-color:#0052d9;background:#fff}
.fb-sub{width:100%;padding:14px;background:linear-gradient(135deg,#0052d9,#0041b3);border:none;border-radius:12px;color:#fff;font-size:18px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:12px;box-shadow:0 4px 14px rgba(0,82,217,.3)}
.fb-can{width:100%;padding:12px;background:#f5f7fa;border:1.5px solid #e5e7eb;border-radius:12px;color:#555;font-size:16px;cursor:pointer;font-family:inherit;margin-top:8px}

/* 管理 */
.adm-t{font-size:21px;font-weight:700;margin-bottom:16px}
.adm-st{background:linear-gradient(135deg,#0052d9,#0041b3);border-radius:14px;padding:20px;text-align:center;color:#fff;margin-bottom:16px}
.adm-st h3{font-size:42px;margin:0 0 4px}
.adm-st p{font-size:13px;opacity:.8;margin:0}
.adm-g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.adm-a{padding:14px;border-radius:12px;border:none;color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;text-align:center}
.adm-a:active{transform:scale(.96)}
.adm-a.grn{background:linear-gradient(135deg,#52c41a,#389e0d)}
.adm-a.red{background:linear-gradient(135deg,#ff4d4f,#d4380d)}
.adm-a.orn{background:linear-gradient(135deg,#fa8c16,#d46b08)}
.adm-a.blu{background:linear-gradient(135deg,#0052d9,#0041b3)}
.tok-box{padding:14px;background:#f5f7fa;border-radius:12px;margin-bottom:14px}
.tok-box .lbl{font-size:13px;color:#888;margin-bottom:8px}
.tok-box input{width:100%;padding:10px 12px;border-radius:8px;border:1.5px solid #e5e7eb;font-size:15px;outline:none;font-family:inherit;margin-bottom:6px}
.tok-box .hint{font-size:12px;color:#999;margin-bottom:10px}
.tok-box button{padding:8px 18px;background:#0052d9;border:none;border-radius:8px;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.fc{border-radius:12px;padding:14px;margin-bottom:10px;border-left:4px solid #0052d9;background:#f9fafb}
.fc .sc{font-size:18px;margin-bottom:5px}
.fc .tx{font-size:16px;color:#333;margin-bottom:5px;line-height:1.5;word-break:break-word}
.fc .tm{font-size:12px;color:#999}
.femp{text-align:center;padding:30px;color:#bbb;font-size:15px}

/* PWA条 */
.pwa-bar{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#0052d9,#0041b3);color:#fff;padding:10px 16px;border-radius:24px;font-size:14px;z-index:300;display:none;align-items:center;gap:10px;box-shadow:0 4px 20px rgba(0,82,217,.45)}
.pwa-bar.on{display:flex}
.pwa-bar button{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4);border-radius:12px;padding:5px 14px;color:#fff;font-size:13px;cursor:pointer}
</style>
</head>
<body>
<div class="app">

  <!-- 顶部 -->
  <div class="header">
    <div class="header-top">
      <div class="header-brand">
        <div class="header-icon">🏥</div>
        <div>
          <div class="header-title">AI健康助手</div>
          <div class="header-sub">中西医结合 · 智能问诊</div>
        </div>
      </div>
      <div class="header-btns">
        <button class="header-btn" onclick="openFB()">💬</button>
        <button class="header-btn" onclick="openAdmin()">⚙️</button>
      </div>
    </div>
    <div class="modes">
      <button class="mode on" data-m="c">🏥 咨询</button>
      <button class="mode" data-m="t">中医</button>
      <button class="mode" data-m="d">饮食</button>
      <button class="mode" data-m="k">知识</button>
    </div>
    <div class="quick" id="quickBar"></div>
  </div>

  <!-- 对话 -->
  <div class="chat" id="chat">
    <div class="msg ai">
      <div class="msg-ava">🏥</div>
      <div class="msg-body">
        <div class="msg-c"><b>您好！我是AI中西医健康助手</b><br><br>请描述您的症状或健康问题，我会为您提供：<br>· 初步健康分析<br>· 中西医结合建议<br>· 饮食调理方案<br>· 药物注意事项<br><br><span style="color:#e83e3e">⚠️ 如有紧急症状，请立即就医！</span></div>
        <div class="msg-t">AI · 刚刚</div>
      </div>
    </div>
  </div>

  <!-- 输入 -->
  <div class="input">
    <div class="input-inner">
      <textarea class="txt" id="userInput" rows="1" placeholder="请描述您的症状或问题..."></textarea>
      <button class="send" onclick="sendMsg()">➤</button>
    </div>
  </div>

</div>

<!-- PWA -->
<div class="pwa-bar" id="pwaBar">📱 立即安装到手机桌面 <button onclick="doPWA()">安装</button></div>

<!-- Toast -->
<div id="toast"></div>

<!-- 反馈 -->
<div class="modal" id="fbModal">
  <div class="modal-card">
    <div class="fb-t">📝 意见反馈</div>
    <div class="fb-s">您的反馈会让App变得更好</div>
    <div class="fb-stars" id="fbStars">
      <span class="fb-star" data-v="1">★</span>
      <span class="fb-star" data-v="2">★</span>
      <span class="fb-star" data-v="3">★</span>
      <span class="fb-star" data-v="4">★</span>
      <span class="fb-star" data-v="5">★</span>
    </div>
    <textarea class="fb-ta" id="fbText" placeholder="请写下您的建议或问题...（必填）"></textarea>
    <button class="fb-sub" onclick="doSubmitFB()">提交反馈</button>
    <button class="fb-can" onclick="closeFB()">取消</button>
  </div>
</div>

<!-- 管理 -->
<div class="modal" id="adminModal">
  <div class="modal-card">
    <div class="adm-t">⚙️ 管理面板</div>
    <div class="adm-st"><h3 id="totalFB">0</h3><p>条反馈记录</p></div>
    <div class="adm-g">
      <button class="adm-a grn" onclick="doExport()">📥 导出CSV</button>
      <button class="adm-a red" onclick="doPushAll()">📱 推微信</button>
      <button class="adm-a orn" onclick="doAutoLearn()" style="grid-column:1">🧠 自主学习</button>
      <button class="adm-a blu" onclick="doSaveKB()" style="grid-column:2">💾 更新库</button>
    </div>
    <div class="tok-box">
      <div class="lbl">Pushplus Token（微信推送）：</div>
      <input id="ppToken" type="text" placeholder="请输入Pushplus token">
      <div class="hint">申请：pushplus.plus（微信扫码绑定，完全免费）</div>
      <button onclick="doSaveToken()">保存Token</button>
    </div>
    <div id="fbList" class="femp">暂无反馈记录</div>
    <button class="fb-can" style="margin-top:14px" onclick="closeAdmin()">关闭</button>
  </div>
</div>

<script>
// 全局
var curMode='c';
var hist=[];
var userCond=[];
var typing=false;
var fbRating=0;
var deferredPrompt=null;

// PWA
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e;setTimeout(function(){document.getElementById('pwaBar').classList.add('on')},4000)});
async function doPWA(){if(!deferredPrompt){showT('请用Chrome打开，从菜单选"添加到主屏幕"','err');return}deferredPrompt.prompt();var r=await deferredPrompt.userChoice;if(r.outcome==='accepted')showT('安装成功！','ok');deferredPrompt=null;document.getElementById('pwaBar').classList.remove('on')}

// Toast
function showT(msg,type){var t=document.getElementById('toast');t.textContent=msg;t.className='show '+(type||'');setTimeout(function(){t.className=''},2800)}

// 打字效果
function tw(el,html,cb){
  var i=0,buf='',inTag=false;
  el.innerHTML='<span></span>';
  var cs=document.createElement('span');cs.className='tc';el.appendChild(cs);
  function tick(){
    if(i<html.length){
      var c=html[i];
      if(c==='<'){inTag=true;buf+=c}
      else if(c==='>'){inTag=false;buf+=c;el.innerHTML=html.substring(0,i+1)+'<span class="tc"></span>'}
      else if(!inTag){buf+=c}
      i++;setTimeout(tick,14)
    }else{el.innerHTML=html;if(cb)cb()}
    document.getElementById('chat').scrollTop=document.getElementById('chat').scrollHeight
  }
  tick()
}

  if(!msg||typing)return;
  input.value='';
  hist.push({role:'user',content:msg});
  addMsg('me',msg);
  showTyping();
  typing=true;
  setTimeout(function(){
    hideTyping();
    var resp=genResp(msg);
    var el=addMsg('ai','');
    hist.push({role:'ai',content:resp});
    tw(el,resp,function(){typing=false});
  },500+Math.random()*500)
}

// 反馈星级
document.querySelectorAll('.fb-star').forEach(function(s){
  s.addEventListener('click',function(){
    fbRating=+this.dataset.v;
    document.querySelectorAll('.fb-star').forEach(function(st,i){st.classList.toggle('on',i<fbRating)});
  });
  s.addEventListener('mouseenter',function(){var r=+this.dataset.v;document.querySelectorAll('.fb-star').forEach(function(st,i){st.style.color=i<r?'#ffc107':'#ddd'})});

// 反馈面板
function openFB(){document.getElementById('fbModal').classList.add('on')}
function closeFB(){document.getElementById('fbModal').classList.remove('on')}
function openAdmin(){
  document.getElementById('adminModal').classList.add('on');
  updStats();loadFB();
  document.getElementById('ppToken').value=localStorage.getItem('pp_token')||'';
}
function closeAdmin(){document.getElementById('adminModal').classList.remove('on')}

function doSaveToken(){localStorage.setItem('pp_token',document.getElementById('ppToken').value.trim());showT('Token已保存','ok')}

function updStats(){document.getElementById('totalFB').textContent=JSON.parse(localStorage.getItem('tcm_fb')||'[]').length}

function loadFB(){
  var list=JSON.parse(localStorage.getItem('tcm_fb')||'[]');
  var el=document.getElementById('fbList');
  if(list.length===0){el.className='femp';el.textContent='暂无反馈记录';return}
  el.className='';
  el.innerHTML=list.slice().reverse().slice(0,15).map(function(f){
    var sc='<span style="color:'+(f.rating>=4?'#52c41a':f.rating>=3?'#fa8c16':'#ff4d4f')+'">'+"★".repeat(f.rating||0)+'☆'.repeat(5-(f.rating||0))+'</span>';
    return'<div class="fc"><div class="sc">'+sc+'</div><div class="tx">'+(f.text||'').replace(/</g,'&lt;').replace(/\n/g,'<br>')+'</div><div class="tm">'+f.time+' · '+f.mode+'</div></div>';
  }).join('')
}

function doSubmitFB(){
  var text=document.getElementById('fbText').value.trim();
  if(!text){showT('请填写反馈内容','err');return}
  var entry={rating:fbRating||0,text:text,time:new Date().toLocaleString('zh-CN'),mode:curMode};
  var fbList=JSON.parse(localStorage.getItem('tcm_fb')||'[]');
  fbList.push(entry);localStorage.setItem('tcm_fb',JSON.stringify(fbList));
  pushWX(entry);
  closeFB();showT('感谢反馈！已推送至微信','ok');
  document.getElementById('fbText').value='';fbRating=0;
  document.querySelectorAll('.fb-star').forEach(function(s){s.classList.remove('on');s.style.color='#ddd'});
  updStats();
}

function pushWX(entry){
  var token=localStorage.getItem('pp_token')||'';
  if(!token){showT('请先在管理面板配置Pushplus Token','err');return}
  var content='★ AI健康助手反馈 ★\n\n⏰：'+entry.time+'\n⭐：'+(entry.rating||0)+'星\n📋：'+entry.mode+'\n📝：'+entry.text;
  fetch('https://www.pushplus.plus/send?token='+token+'&title=AI健康助手反馈&content='+encodeURIComponent(content)+'&type=txt',{mode:'no-cors'})
    .then(function(){showT('微信推送成功','ok')})
    .catch(function(){showT('微信推送失败','err')});
}

function doExport(){
  var list=JSON.parse(localStorage.getItem('tcm_fb')||'[]');
  if(list.length===0){showT('暂无反馈可导出','err');return}
  var csv='\uFEFF评分,时间,模式,内容\n';
  list.forEach(function(f){csv+=(f.rating||0)+'星,"'+f.time+'","'+f.mode+'","'+(f.text||'').replace(/"/g,'""')+'"\n'});
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='feedback_'+new Date().toISOString().slice(0,10)+'.csv';a.click();showT('CSV已下载','ok');
}

function doPushAll(){
  var list=JSON.parse(localStorage.getItem('tcm_fb')||'[]');
  if(list.length===0){showT('暂无反馈','err');return}
  var token=localStorage.getItem('pp_token')||'';
  if(!token){showT('请先配置Pushplus Token','err');return}
  var body='AI健康助手反馈汇总（共'+list.length+'条）\n\n';
  list.slice(-10).forEach(function(f,i){body+=(i+1)+'. '+f.time+' '+("★").repeat(f.rating||0)+'\n'+f.text+'\n\n'});
  fetch('https://www.pushplus.plus/send?token='+token+'&title=反馈汇总&content='+encodeURIComponent(body)+'&type=txt',{mode:'no-cors'})
    .then(function(){showT('汇总已推送微信','ok')})
    .catch(function(){showT('推送失败','err')});
}

// 自主学习
function autoLearn(){
  var list=JSON.parse(localStorage.getItem('tcm_fb')||'[]');
  if(list.length===0){showT('暂无反馈可分析','err');return}
  var newItems=[];
  var kw={'眼睛干':'眼疲劳','腰疼':'腰痛','胃酸':'胃炎','皮疹':'过敏','湿疹':'湿疹','过敏':'特禀质','腿疼':'关节痛'};
  Object.keys(kw).forEach(function(k){
    if(list.some(function(f){return f.text.indexOf(k)!==-1})&&!Object.keys(KB).some(function(bk){return kw[k].indexOf(bk)!==-1})){
      if(!newItems.some(function(n){return n.key===kw[k]})){
        newItems.push({key:kw[k],t:kw[k],c:'由用户反馈新增的相关知识。'})
      }
    }
  });
  if(newItems.length===0){showT('暂无新的自主学习内容','info');return}
  var stored=JSON.parse(localStorage.getItem('tcm_new')||'[]');
  newItems.forEach(function(n){if(!stored.some(function(s){return s.key===n.key}))stored.push(n)});
  localStorage.setItem('tcm_new',JSON.stringify(stored));
  showT('已分析'+newItems.length+'条新知识，已保存','ok');
}

function doAutoLearn(){autoLearn()}

function doSaveKB(){
  var learned=JSON.parse(localStorage.getItem('tcm_new')||'[]');
  if(learned.length===0){showT('暂无新知识可更新','info');return}
  learned.forEach(function(item){if(!KB[item.key])KB[item.key]={t:item.t,c:item.c,e:'',d:'',dr:'',s:'',f:'',h:''}});
  localStorage.setItem('tcm_kb',JSON.stringify(learned));
  showT('知识库已更新'+learned.length+'条','ok');
}
