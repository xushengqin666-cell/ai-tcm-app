function findDrugManual(q){
  var ql = q.toLowerCase();
  var found = [];
  var checked = {};
  // 1. 精确匹配 DRUG_GUIDE
  if(DRUG_GUIDE[q]){
    checked[q] = 1;
    found.push(buildManualEntry(q, DRUG_GUIDE[q]));
  }
  // 2. 模糊匹配 DRUG_GUIDE key
  for(var k in DRUG_GUIDE){ if(!checked[k] && k.indexOf(ql)>=0){ checked[k]=1; found.push(buildManualEntry(k, DRUG_GUIDE[k])); }}
  // 3. 匹配 getLocalAnswer DB
  for(var k2 in getLocalAnswer._DB||{}){ if(!checked[k2] && k2.indexOf(ql)>=0){ checked[k2]=1; found.push(buildManualFromLocal(k2)); }}
  // 4. 匹配 INTERACT_DB
  for(var k3 in INTERACT_DB){ if(!checked[k3] && k3.indexOf(ql)>=0){ checked[k3]=1; found.push(buildManualFromInteract(k3)); }}
  // 5. 英文名别名
  var aliases = {'ibuprofen':'布洛芬','paracetamol':'对乙酰氨基酚','acetaminophen':'对乙酰氨基酚','aspirin':'阿司匹林','amoxicillin':'阿莫西林','metformin':'二甲双胍','omeprazole':'奥美拉唑','loratadine':'氯雷他定','cetirizine':'西替利嗪','atorvastatin':'阿托伐他汀','simvastatin':'辛伐他汀','amlodipine':'氨氯地平','nifedipine':'硝苯地平','losartan':'氯沙坦','insulin':'胰岛素','warfarin':'华法林'};
  if(aliases[ql] && !checked[aliases[ql]]){ var ak=aliases[ql]; checked[ak]=1; if(DRUG_GUIDE[ak]) found.push(buildManualEntry(ak, DRUG_GUIDE[ak])); else if(INTERACT_DB[ak]) found.push(buildManualFromInteract(ak)); }
  return found.slice(0, 5);
}

function buildManualEntry(name, g){
  return {name:name, cat:g.cat||'', indications:g.indications||'', dosage:g.dosage||'', contraindications:g.contraindications||'', warnings:(g.warn||[]).join('; '), foodAvoid:(g.food||[]).join('; '), drugAvoid:'', notes:g.note||'', time:g.time||''};
}

function buildManualFromLocal(name){
  var d = (getLocalAnswer._DB||{})[name];
  if(!d) return {name:name};
  return {name:name, cat:d.cat||'', warnings:d.warn?d.warn.join('; '):'', foodAvoid:d.food?d.food.join('; '):'', notes:d.note||'', time:d.time||''};
}

function buildManualFromInteract(name){
  var db = INTERACT_DB[name];
  if(!db) return {name:name};
  var contra=[], caution=[];
  (db.relations||[]).forEach(function(r){
    if(r.type==='danger') contra.push(r.drug+(r.desc?'('+r.desc+')':''));
    else if(r.type==='caution') caution.push(r.drug+(r.desc?'('+r.desc+')':''));
  });
  return {name:name, cat:db.category||'', drugAvoid:'⛔禁忌:'+contra.join('、')+' | ⚠️注意:'+caution.join('、'), notes:''};
}

    if(d.error)throw new Error((d.error&&d.error.message)||'SF API error');
    var msg=(d.choices&&d.choices[0])?d.choices[0].message:{};
    var raw=msg.content||'',result={};
    if(msg.reasoning_content){result.thinking=msg.reasoning_content;result.answer=raw;}
    else{var tm2=raw.match(/[\s\S]*?<think>([\s\S]*?)<\/think>/);if(tm2){result.thinking=tm2[1].trim();result.answer=raw.replace(/[\s\S]*?<think>[\s\S]*?<\/think>/,'').trim();}else{result.answer=raw;}}
    return result;
  });
}

async function sendChat() {

      } catch (_e2) {

      document.getElementById(loadingId).querySelector('.bubble').textContent = finalAnswer;

function nodeBorderColor(drug, centerDrug, edges){
  if(drug===centerDrug) return '#fff';
  var maxType='blue';
  edges.forEach(function(e){
    if(e.from===drug||e.to===drug){
      if(e.type==='danger') maxType='danger';
      else if(e.type==='caution'&&maxType!=='danger') maxType='caution';
      else if(e.type==='green'&&maxType!=='danger'&&maxType!=='caution') maxType='green';
    }
  });
  return TYPE_COLOR[maxType];
}

var _svgDrag = {active:false, drug:null, ox:0, oy:0, dxSum:0, dySum:0};

// SVG坐标转viewBox坐标
function svgPoint(svg, clientX, clientY){
  var rect = svg.getBoundingClientRect();
  var W = parseFloat(svg.getAttribute('viewBox').split(' ')[2]);
  var H = parseFloat(svg.getAttribute('viewBox').split(' ')[3]);
  return {
    x: (clientX - rect.left) * W / rect.width,
    y: (clientY - rect.top) * H / rect.height
  };
}

// 重绘整个SVG关系网
function redrawSvgGraph(center, drugs, edges){
  var svg = document.getElementById('netGraphSvg');
  if(!svg) return;
  var svgHtml = '';
  var W = parseFloat(svg.getAttribute('viewBox').split(' ')[2]);
  var H = parseFloat(svg.getAttribute('viewBox').split(' ')[3]);

  // 连线
  edges.forEach(function(e){
    var p1=_posMap[e.from], p2=_posMap[e.to];
    if(!p1||!p2) return;
    var col=TYPE_COLOR[e.type]||'#888';
    var mx=(p1.x+p2.x)/2, my=(p1.y+p2.y)/2-12;
    svgHtml+='<path d="M'+p1.x.toFixed(1)+','+p1.y.toFixed(1)+' Q'+mx.toFixed(1)+','+my.toFixed(1)+' '+p2.x.toFixed(1)+','+p2.y.toFixed(1)+'" stroke="'+col+'" stroke-width="2" fill="none" opacity="0.65" pointer-events="none"/>';
  });

  // 节点圆
  drugs.forEach(function(d){
    var p=_posMap[d];
    if(!p) return;
    var isCenter=(d===center);
    var r=isCenter?20:14;
    var bColor=nodeBorderColor(d,center,edges);
    var fillCol=isCenter?'#07C160':bColor;
    var isDragging = _svgDrag.active && _svgDrag.drug===d;
    svgHtml+='<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+r+'" fill="'+fillCol+'" stroke="'+(isDragging?'#ffe066':'#fff')+'" stroke-width="'+(isDragging?'3.5':'2.5')+'" data-drug="'+d+'" style="cursor:pointer;filter:'+(isDragging?'brightness(1.2)':'url(#glow)')+'"/>';
    var fs=isCenter?13:11;
    var fw=isCenter?'bold':'600';
    var textY=p.y+(isCenter?5:4);
    svgHtml+='<text x="'+p.x.toFixed(1)+'" y="'+textY.toFixed(1)+'" fill="#fff" font-size="'+fs+'" font-weight="'+fw+'" text-anchor="middle" dominant-baseline="middle" style="pointer-events:none">'+drugLabel(d)+'</text>';
  });

  svgHtml='<defs><filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>'+svgHtml;
  svg.innerHTML = svgHtml;
}

// 紧凑环形关系网绘制（可拖拽节点 + 点击弹出详情）
function drawCompactGraph(center, drugs, edges){
  var svg = document.getElementById('netGraphSvg');
  if(!svg) return;
  var W = 700;
  var H = parseInt(svg.getAttribute('viewBox').split(' ')[3]);
  var cx = W/2, cy = H/2;
  var radius = Math.min(W,H)*0.36;
  var count = drugs.length - 1;

  // 初始化环形位置
  _posMap[center] = {x:cx,y:cy};
  for(var i=0;i<count;i++){
    var d = drugs[i+1];
    var angle = (2*Math.PI*i)/Math.max(1,count) - Math.PI/2;
    _posMap[d] = {x:cx+Math.cos(angle)*radius, y:cy+Math.sin(angle)*radius};
  }

  // 初始渲染
  redrawSvgGraph(center, drugs, edges);

  // 当前点击的目标（区分点击和拖拽）
  var _clickTarget = null;

  // SVG事件：mousedown记录目标、mousemove拖拽、mouseup判断点击还是拖拽
  svg.onmousedown = function(e){
    var target = e.target;
    if(target.tagName !== 'circle') return;
    var drug = target.getAttribute('data-drug');
    if(!drug) return;
    e.preventDefault();
    _svgDrag.active = true;
    _svgDrag.drug = drug;
    _svgDrag.ox = e.clientX;
    _svgDrag.oy = e.clientY;
    _svgDrag.dxSum = 0;
    _svgDrag.dySum = 0;
    _clickTarget = target;
    redrawSvgGraph(center, drugs, edges);
  };

  svg.onmousemove = function(e){
    if(!_svgDrag.active) return;
    e.preventDefault();
    var rect = svg.getBoundingClientRect();
    var scaleX = W / rect.width;
    var scaleY = H / rect.height;
    var dx = (e.clientX - _svgDrag.ox) * scaleX;
    var dy = (e.clientY - _svgDrag.oy) * scaleY;
    _svgDrag.dxSum += Math.abs(e.clientX - _svgDrag.ox);
    _svgDrag.dySum += Math.abs(e.clientY - _svgDrag.oy);
    var d = _svgDrag.drug;
    if(!_posMap[d]) return;
    _posMap[d] = {x: _posMap[d].x + dx, y: _posMap[d].y + dy};
    _svgDrag.ox = e.clientX;
    _svgDrag.oy = e.clientY;
    redrawSvgGraph(center, drugs, edges);
  };

  svg.onmouseup = function(){
    if(!_svgDrag.active) return;
    var drug = _svgDrag.drug;
    var wasDrag = (_svgDrag.dxSum > 5 || _svgDrag.dySum > 5);
    _svgDrag.active = false;
    _svgDrag.drug = null;
    redrawSvgGraph(center, drugs, edges);
    // 点击（未拖拽）→ 弹出详情
    if(!wasDrag && drug){
      var nd = _clickTarget || document.createElement('div');
      showNodeDetail(nd, drug);
    }
    _clickTarget = null;
  };

  svg.onmouseleave = function(){
    if(_svgDrag.active){
      _svgDrag.active = false;
      _svgDrag.drug = null;
      _clickTarget = null;
      redrawSvgGraph(center, drugs, edges);
    }
  };
}

function drugLabel(name){ return currentLang==='en'?(DRUG_NAME_MAP[name]||name):name; }

var _unionDrugCount = 2;
var _unionMaxDrugs = 10;
var _unionMinDrugs = 2;

function addUnionDrug(){
  if(_unionDrugCount >= _unionMaxDrugs) return;
  var container = document.getElementById('unionDrugInputs');
  if(!container) return;
  var row = document.createElement('div');
  row.className = 'union-drug-row';
  row.id = 'unionRow' + _unionDrugCount;
  var ph = T[currentLang].unionDrugPlaceholder + (_unionDrugCount+1) + (currentLang==='zh' ? ',如:布洛芬' : ', e.g. Ibuprofen');
  row.innerHTML = '<div class="union-autocomplete" style="flex:1">' +
    '<input type="text" placeholder="' + ph + '" id="unionDrug' + _unionDrugCount + '" oninput="unionAutocomplete(this,' + _unionDrugCount + ')" onfocus="unionAutocomplete(this,' + _unionDrugCount + ')">' +
    '<div class="union-autocomplete-dropdown" id="unionDropdown' + _unionDrugCount + '"></div>' +
    '</div>' +
    '<button class="remove-drug" onclick="removeUnionDrug(\' + _unionDrugCount + \')">×</button>';
  container.appendChild(row);
  _unionDrugCount++;
  updateUnionRemoveButtons();
  var btnAdd = document.getElementById('unionBtnAdd');
  if(btnAdd) btnAdd.disabled = (_unionDrugCount >= _unionMaxDrugs);
}

function removeUnionDrug(index){
  if(_unionDrugCount <= _unionMinDrugs) return;
  var row = document.getElementById('unionRow' + index);
  if(row) row.remove();
  _unionDrugCount--;
  reindexUnionDrugs();
  updateUnionRemoveButtons();
  var btnAdd = document.getElementById('unionBtnAdd');
  if(btnAdd) btnAdd.disabled = (_unionDrugCount >= _unionMaxDrugs);
}

function reindexUnionDrugs(){
  var inputs = document.querySelectorAll('#unionDrugInputs input[type="text"]');
  for(var i=0; i<inputs.length; i++){
    inputs[i].id = 'unionDrug' + i;
    var ph = T[currentLang].unionDrugPlaceholder + (i+1) + (currentLang==='zh' ? ',如:布洛芬' : ', e.g. Ibuprofen');
    inputs[i].placeholder = ph;
    var autocompleteDiv = inputs[i].parentElement;
    autocompleteDiv.querySelector('.union-autocomplete-dropdown').id = 'unionDropdown' + i;
    autocompleteDiv.parentElement.id = 'unionRow' + i;
    autocompleteDiv.parentElement.querySelector('.remove-drug').onclick = (function(idx){ return function(){ removeUnionDrug(idx); }; })(i);
    inputs[i].oninput = (function(idx){ return function(){ unionAutocomplete(this, idx); }; })(i);
    inputs[i].onfocus = (function(idx){ return function(){ unionAutocomplete(this, idx); }; })(i);
  }
}

function updateUnionRemoveButtons(){
  var buttons = document.querySelectorAll('#unionDrugInputs .remove-drug');
  buttons.forEach(function(btn, idx){
    btn.style.visibility = (idx >= _unionMinDrugs) ? 'visible' : 'hidden';
  });
}

function unionAutocomplete(input, index){
  var val = input.value.trim();
  var dropdown = document.getElementById('unionDropdown' + index);
  if(!dropdown) return;
  input.dataset.userModified = 'true';
  if(!val){
    dropdown.classList.remove('show');
    dropdown.innerHTML = '';
    return;
  }
  var matches = [];
  for(var key in DRUG_NAME_MAP){
    var keyLower = key.toLowerCase();
    var valLower = val.toLowerCase();
    var mapLower = DRUG_NAME_MAP[key].toLowerCase();
    if(keyLower.indexOf(valLower) !== -1 || mapLower.indexOf(valLower) !== -1){
      matches.push(key);
    }
  }
  if(matches.length === 0){
    dropdown.classList.remove('show');
    dropdown.innerHTML = '';
    return;
  }
  dropdown.innerHTML = '';
  matches.slice(0, 10).forEach(function(drug){
    var div = document.createElement('div');
    div.textContent = drug + ' (' + DRUG_NAME_MAP[drug] + ')';
    div.onclick = (function(drugName){ return function(){
      input.value = drugName;
      dropdown.classList.remove('show');
      dropdown.innerHTML = '';
    }; })(drug);
    dropdown.appendChild(div);
  });
  dropdown.classList.add('show');
}

if(!window._unionClickBound){
  window._unionClickBound = true;
  document.addEventListener('click', function(e){
    if(!e.target.closest('.union-autocomplete')){
      document.querySelectorAll('.union-autocomplete-dropdown').forEach(function(dd){
        dd.classList.remove('show');
      });
    }
  });
}

function checkUnionDrugs(){
  var drugs = [];
  for(var i=0; i<_unionDrugCount; i++){
    var inp = document.getElementById('unionDrug' + i);
    if(inp && inp.value.trim()){
      drugs.push(inp.value.trim());
    }
  }
  if(drugs.length < 2){
    var msg = (currentLang==='en') ? 'Please enter at least 2 drugs' : '请至少输入2种药物';
    var summaryDiv = document.getElementById('unionResultSummary');
    if(summaryDiv) summaryDiv.innerHTML = '<div class="error">' + msg + '</div>';
    var matrixDiv = document.getElementById('unionResultMatrix');
    if(matrixDiv) matrixDiv.innerHTML = '';
    return;
  }
  var results = [];
  var dangerCount = 0, cautionCount = 0, safeCount = 0, noDataCount = 0;
  for(var i=0; i<drugs.length; i++){
    for(var j=i+1; j<drugs.length; j++){
      var d1 = drugs[i], d2 = drugs[j];
      var info = null;
      var type = 'blue';
      if(INTERACT_DB[d1] && INTERACT_DB[d1][d2]){
        info = INTERACT_DB[d1][d2];
        type = info.type;
      } else if(INTERACT_DB[d2] && INTERACT_DB[d2][d1]){
        info = INTERACT_DB[d2][d1];
        type = info.type;
      }
      if(type === 'danger') dangerCount++;
      else if(type === 'caution') cautionCount++;
      else if(type === 'green') safeCount++;
      else noDataCount++;
      results.push({ drug1: d1, drug2: d2, type: type, info: info });
    }
  }
  var t = T[currentLang];
  var summaryHtml = '<div class="union-result-summary">';
  summaryHtml += '<strong>' + t.unionResultSummary + ' ' + drugs.length + ' ' + ((currentLang==='en') ? 'drugs' : '种药物') + '</strong>:';
  summaryHtml += '<span style="color:' + TYPE_COLOR['danger'] + '">' + dangerCount + t.unionDangerCount + '</span>,';
  summaryHtml += '<span style="color:' + TYPE_COLOR['caution'] + '">' + cautionCount + t.unionCautionCount + '</span>。<br>';
  summaryHtml += drugs.join('、') + ((currentLang==='en') ? ' are checked.' : t.unionChecked+' ');
  summaryHtml += '</div>';
  var summaryDiv = document.getElementById('unionResultSummary');
  if(summaryDiv) summaryDiv.innerHTML = summaryHtml;
  showUnionMatrix(drugs, results);
}

function showUnionMatrix(drugs, results){
  var t = T[currentLang];
  var matrixHtml = '<table>';
  matrixHtml += '<tr><th></th>';
  drugs.forEach(function(drug){
    matrixHtml += '<th>' + drugLabel(drug) + '</th>';
  });
  matrixHtml += '</tr>';
  for(var i=0; i<drugs.length; i++){
    matrixHtml += '<tr>';
    matrixHtml += '<th>' + drugLabel(drugs[i]) + '</th>';
    for(var j=0; j<drugs.length; j++){
      if(i === j){
        matrixHtml += '<td style="background:#f5f5f5"></td>';
      } else {
        var result = null;
        for(var r=0; r<results.length; r++){
          if((results[r].drug1 === drugs[i] && results[r].drug2 === drugs[j]) ||
             (results[r].drug1 === drugs[j] && results[r].drug2 === drugs[i])){
            result = results[r];
            break;
          }
        }
        if(result){
          var bgColor = TYPE_COLOR[result.type] || '#0d9488';
          var text = '';
          if(result.type === 'danger') text = '🔴';
          else if(result.type === 'caution') text = '🟡';
          else if(result.type === 'green') text = '🟢';
          else text = '🔵';
          var escapedDrug1 = result.drug1.replace(/'/g, "\\'");
          var escapedDrug2 = result.drug2.replace(/'/g, "\\'");
          var infoStr = 'null';
          if(result.info){
            infoStr = JSON.stringify(result.info);
            infoStr = infoStr.replace(/"/g, '\\"');
          }
          var onclick = "showUnionDetail('" + escapedDrug1 + "','" + escapedDrug2 + "','" + result.type + "','" + infoStr + "')";
          matrixHtml += '<td style="background:' + bgColor + '22;cursor:pointer" onclick="\' + onclick + \'">' + text + '</td>';

function showUnionDetail(drug1, drug2, type, infoStr){
  var existing = document.querySelector('.union-detail-popup');
  if(existing) existing.remove();
  var t = T[currentLang];
  var popup = document.createElement('div');
  popup.className = 'union-detail-popup show';
  var title = drugLabel(drug1) + ' + ' + drugLabel(drug2);
  var typeLabel = '';
  var typeColor = TYPE_COLOR[type] || '#0d9488';
  if(type === 'danger') typeLabel = '🔴 ' + t.unionContraindicated;
  else if(type === 'caution') typeLabel = '🟡 ' + t.unionCaution;
  else if(type === 'green') typeLabel = '🟢 ' + t.unionSafe;
  else typeLabel = '🔵 ' + t.unionNeutral;
  var html = '<div class="close-btn" onclick="this.parentElement.remove()">×</div>';
  html += '<div class="dc-title">' + title + '</div>';
  html += '<div style="margin-bottom:10px"><span class="dc-badge" style="background:' + typeColor + '">' + typeLabel + '</span></div>';
  var info = null;
  try { if(infoStr && infoStr !== 'null') info = JSON.parse(infoStr); } catch(e) {}
  if(info && info.text){
    html += '<div style="font-size:13px;color:#555;line-height:1.6">' + ((currentLang==='en') ? info.en : info.text) + '</div>';
  } else {
    html += '<div style="font-size:13px;color:#999">' + t.unionNeutral + '</div>';
  }
  popup.innerHTML = html;
  document.body.appendChild(popup);
  setTimeout(function(){
    document.addEventListener('click', function handler(e){
      if(!popup.contains(e.target) && !e.target.closest('td[onclick*="showUnionDetail"]')){

        document.removeEventListener('click', handler);
      }
    });
  }, 100);
}

function preprocessImage(dataUrl, maxW, cb) {
  var img = new Image();
  img.onload = function() {
    try {
      var w = img.width, h = img.height;
      var scale = Math.min(1, maxW / w);
      var cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
      var canvas = document.createElement('canvas');
      canvas.width = cw; canvas.height = ch;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, cw, ch);
      var id = ctx.getImageData(0, 0, cw, ch), dd = id.data;
      for (var i = 0; i < dd.length; i += 4) {
        var g = dd[i]*0.299 + dd[i+1]*0.587 + dd[i+2]*0.114;
        var c = (g - 128) * 1.4 + 128;
        if (c < 0) c = 0; else if (c > 255) c = 255;
        dd[i] = dd[i+1] = dd[i+2] = c;
      }
      ctx.putImageData(id, 0, 0);
      cb(canvas.toDataURL('image/jpeg', 0.92));
    } catch (e) { cb(dataUrl); }
  };
  img.onerror = function() { cb(dataUrl); };
  img.src = dataUrl;
}

function callCloudOCR(dataUrl, timeoutMs) {
  return new Promise(function(resolve, reject) {
    var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var to = setTimeout(function(){ if (ctrl) ctrl.abort(); else reject(new Error('timeout')); }, timeoutMs || 12000);
    fetch(OCR_WORKER, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: dataUrl }),
      signal: ctrl ? ctrl.signal : undefined
    }).then(function(r) {
      clearTimeout(to);
      if (!r.ok) return r.text().then(function(t){ throw new Error('OCR服务返回 ' + r.status); });
      return r.json();
    }).then(function(d) {
      if (d && d.error) throw new Error(d.error);
      resolve((d && d.text) ? d.text : '');
    }).catch(function(e) { clearTimeout(to); reject(e); });
  });
}

function stripDosageForm(name) {
  return name.replace(/(缓释|控释|肠溶|分散|普通|薄膜衣|糖衣|胶囊|片|颗粒|口服液|口服溶液|注射液|粉针|粉|膏|软膏|乳膏|凝胶|糖浆|滴丸|含片|泡腾片|软胶囊|滴剂|贴剂|栓剂|气雾剂|喷雾剂|混悬液|混悬滴剂|干混悬剂|缓释胶囊|缓释片|控释片|口崩片|咀嚼片|分散片|肠溶片|肠溶胶囊|阴??道?片|阴道?软胶囊)$/g, '').trim();
}

function fuzzyMatchDrug(input) {
  if (!input || !window.DRUG_GUIDE) return null;
  input = (input || '').trim().replace(/药$/,'');
  if (!input) return null;
  var lower = input.toLowerCase();

  // 1. 精确匹配
  if (DRUG_GUIDE[input]) return input;

  // 2. 去除剂型后匹配
  var stripped = stripDosageForm(input);
  if (DRUG_GUIDE[stripped]) return stripped;
  for (var k in DRUG_GUIDE) {
    if (stripDosageForm(k) === stripped) return k;
  }

  // 3. 品牌名/商品名匹配
  if (DRUG_BRAND_ALIAS[lower]) return DRUG_BRAND_ALIAS[lower];
  if (DRUG_BRAND_ALIAS[stripped.toLowerCase()]) return DRUG_BRAND_ALIAS[stripped.toLowerCase()];
  for (var ba in DRUG_BRAND_ALIAS) {
    if (DRUG_BRAND_ALIAS[ba].toLowerCase() === lower) return DRUG_BRAND_ALIAS[ba];
    if (ba.toLowerCase().indexOf(lower) >= 0) return DRUG_BRAND_ALIAS[ba];
  }

  // 4. 包含匹配（输入包含药名 或 药名包含输入）
  for (var k2 in DRUG_GUIDE) {
    var kl = k2.toLowerCase();
    if (kl.indexOf(lower) >= 0 || lower.indexOf(kl) >= 0) return k2;
  }

  return null;
}

// 从 OCR 文本中匹配药品
function matchDrugsFromOCRText(text) {
  if (!text || !window.DRUG_GUIDE) return [];
  var matched = {};
  // 清洗：保留中文/英文/数字连续段，过滤单字符噪声
  var cleaned = text.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, " ");
  var tokens = cleaned.split(/\s+/).filter(function(t){ return t.length >= 2; });
  // 1) 整词模糊匹配
  tokens.forEach(function(tok){
    var fm = fuzzyMatchDrug(tok);
    if (fm && !matched[fm]) matched[fm] = true;
  });
  // 2) 滑窗：取每 token 的前 2-3 字（中文），部分匹配药名
  tokens.forEach(function(tok){
    var cnTok = tok.match(/[\u4e00-\u9fa5]+/g);
    if (!cnTok) return;
    cnTok.forEach(function(cw){
      for (var len = Math.min(cw.length, 3); len >= 2; len--){
        for (var start = 0; start + len <= cw.length; start++){
          var sub = cw.substr(start, len);
          var fm2 = fuzzyMatchDrug(sub);
          if (fm2 && !matched[fm2]) matched[fm2] = true;
        }
      }
    });
  });
  // 3) 整体包含匹配（兜底）
  for (var k in DRUG_GUIDE) {
    if (text.toLowerCase().indexOf(k.toLowerCase()) >= 0 && !matched[k]) matched[k] = true;
  }
  return Object.keys(matched);
}

    if (name.toLowerCase().indexOf(q.toLowerCase()) >= 0) score += 6;

    if (score > 0) results.push({ name: name, score: score, drug: drg });
  }

  results.sort(function(a, b) { return b.score - a.score; });
  return results.slice(0, 12);
}

window.smartRemind = {
  // 分析用药规律，智能推荐提醒时间
  analyzePattern: function(drugName){
    try{
      var cabinet = JSON.parse(localStorage.getItem('cy_cabinet') || '[]');
      var reminders = JSON.parse(localStorage.getItem('cy_reminders') || '[]');
      var drug = cabinet.find(function(d){ return d.name === drugName; });
      if(!drug) return null;

      // 基于药品类型推荐时间
      var recommendations = [];
      var type = (drug.category || '').toLowerCase();

      if(type.indexOf('降压') >= 0 || type.indexOf('高血压') >= 0){
        recommendations.push({time:'07:00',label:'晨起降压药（长效控制）'});
        recommendations.push({time:'19:00',label:'晚间降压药（平稳过夜）'});
      }else if(type.indexOf('降糖') >= 0 || type.indexOf('糖尿病') >= 0){
        recommendations.push({time:'07:30',label:'早餐前降糖药'});
        recommendations.push({time:'11:30',label:'午餐前降糖药'});
        recommendations.push({time:'18:30',label:'晚餐前降糖药'});
      }else if(type.indexOf('安眠') >= 0 || type.indexOf('睡眠') >= 0){
        recommendations.push({time:'22:00',label:'睡前安眠药（入睡困难）'});
      }else{
        // 默认饭后半小时
        recommendations.push({time:'08:00',label:'早餐后'});
        recommendations.push({time:'12:00',label:'午餐后'});
        recommendations.push({time:'18:30',label:'晚餐后'});
      }

      return recommendations;
    }catch(e){ console.error(e); return null; }
  },

  // 检测药物冲突
  checkConflict: function(newDrug){
    try{
      var cabinet = JSON.parse(localStorage.getItem('cy_cabinet') || '[]');
      var warnings = [];
      var interactions = {
        '阿司匹林': ['布洛芬', '华法林'],
        '华法林': ['阿司匹林', '布洛芬', '维生素K'],
        '布洛芬': ['阿司匹林', '华法林'],
        '甲氨蝶呤': ['布洛芬', '阿司匹林']
      };

      cabinet.forEach(function(d){
        var conflictList = interactions[d.name] || [];
        if(conflictList.indexOf(newDrug) >= 0){
          warnings.push(d.name + ' 与 ' + newDrug + ' 可能存在相互作用');
        }
      });

      return warnings;
    }catch(e){ console.error(e); return []; }
  },

  // 漏服提醒策略
  missedDoseStrategy: function(drugName, missedTime){
    try{
      var cabinet = JSON.parse(localStorage.getItem('cy_cabinet') || '[]');
      var drug = cabinet.find(function(d){ return d.name === drugName; });
      if(!drug) return null;

      var now = new Date();
      var missed = new Date(missedTime);
      var hoursSince = (now - missed) / (1000 * 60 * 60);

      // 距离下次用药时间
      var nextDose = hoursSince < 12 ? '今日正常服用下次剂量' : '跳过本次，按计划服用下次';

      return {
        drug: drugName,
        missedAt: missedTime,
        hoursSince: Math.round(hoursSince),
        advice: hoursSince < 2 ? '立即补服' : hoursSince < 6 ? '尽快补服' : nextDose,
        warning: hoursSince > 12 ? '距离下次用药时间较近，建议跳过' : null
      };
    }catch(e){ console.error(e); return null; }
  }
};

}, true);

<script>

<script>
// 原生分享与手势（v2.2）
(function(){
  // 原生分享
  window.share = {
    canShare: function(){
      return 'share' in navigator;
    },
    drugInfo: function(drugName, indications, usage){
      if(!this.canShare()){
        window.showToast && window.showToast('浏览器不支持分享', 1500);
        return Promise.reject('not supported');
      }
      return navigator.share({
        title: drugName + ' - 彩云智药',
        text: indications || '',
        url: window.location.href
      }).then(function(){
        window.showToast && window.showToast('分享成功', 1500);
      }).catch(function(e){
        if(e.name !== 'AbortError') console.error(e);
      });
    },
    reminder: function(drugName, time){
      if(!this.canShare()) return Promise.reject('not supported');
      return navigator.share({
        title: '用药提醒',
        text: drugName + ' - ' + time,
        url: window.location.href
      });
    }
  };

  // 手势滑动（Tab 切换）
  var touchStartX = 0;
  var touchEndX = 0;
  var minSwipe = 50; // 最小滑动距离

  document.addEventListener('touchstart', function(e){
    touchStartX = e.changedTouches[0].screenX;
  }, {passive: true});

  document.addEventListener('touchend', function(e){
    touchEndX = e.changedTouches[0].screenX;
    handleSwipe();
  }, {passive: true});

  function handleSwipe(){
    var diff = touchEndX - touchStartX;
    if(Math.abs(diff) < minSwipe) return;

    var tabs = ['home','cabinet','member','reminder','profile','chat'];
    var currentTab = document.querySelector('[data-tab].active');
    if(!currentTab) return;

    var currentIdx = tabs.indexOf(currentTab.getAttribute('data-tab'));
    if(currentIdx < 0) return;

    var newIdx;
    if(diff > 0 && currentIdx > 0) newIdx = currentIdx - 1; // 右滑
    else if(diff < 0 && currentIdx < tabs.length - 1) newIdx = currentIdx + 1; // 左滑
    else return;

    window.switchTab(tabs[newIdx]);
    window.haptic && window.haptic.light();
  }
})();
<\/script>



<script>
// 图片预览/缩放（v2.2）
(function(){
  window.imageViewer = {
    show: function(src, alt){
      var overlay = document.createElement('div');
      overlay.id = 'imageViewerOverlay';
      overlay.style.cssText = 'position:fixed;inset:0;z-index:99990;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;cursor:zoom-out;';

      var img = document.createElement('img');
      img.src = src;
      img.alt = alt || '';
      img.style.cssText = 'max-width:90%;max-height:90%;object-fit:contain;transform-origin:center;transition:transform .2s ease;';
      img.draggable = false;

      var scale = 1;
      var rotate = 0;

      // 双击放大
      img.addEventListener('dblclick', function(e){
        e.stopPropagation();
        scale = scale === 1 ? 2 : 1;
        updateTransform();
      });

      // 滚轮缩放
      overlay.addEventListener('wheel', function(e){
        e.preventDefault();
        var delta = e.deltaY > 0 ? -0.1 : 0.1;
        scale = Math.max(0.5, Math.min(4, scale + delta));
        updateTransform();
      });

      // 关闭
      overlay.addEventListener('click', function(){
        document.body.removeChild(overlay);
      });

      function updateTransform(){
        img.style.transform = 'scale(' + scale + ') rotate(' + rotate + 'deg)';
      }

      overlay.appendChild(img);
      document.body.appendChild(overlay);
    },

    // 从文件选择预览
    previewFile: function(file){
      if(!file.type.startsWith('image/')){
        window.showToast && window.showToast('请选择图片文件', 2000);
        return;
      }
      var reader = new FileReader();
      reader.onload = function(e){
        window.imageViewer.show(e.target.result, file.name);
      };
      reader.readAsDataURL(file);
    }
  };

  // 自动绑定图片点击预览
  document.addEventListener('click', function(e){
    var img = e.target.closest('img[data-preview]');
    if(img && img.src) window.imageViewer.show(img.src, img.alt);
  });
})();

<script>
// 懒加载/虚拟滚动（v2.2）
(function(){
  // 图片懒加载
  window.lazyLoad = {
    init: function(){
      if('IntersectionObserver' in window){
        var observer = new IntersectionObserver(function(entries){
          entries.forEach(function(entry){
            if(entry.isIntersecting){
              var img = entry.target;
              if(img.dataset.src){
                img.src = img.dataset.src;
                img.removeAttribute('data-src');
                observer.unobserve(img);
              }
            }
          });
        }, {rootMargin: '50px'});

        document.querySelectorAll('img[data-src]').forEach(function(img){
          observer.observe(img);
        });
      }else{
        // 降级：直接加载所有图片
        document.querySelectorAll('img[data-src]').forEach(function(img){
          img.src = img.dataset.src;
          img.removeAttribute('data-src');
        });
      }
    },

    // 动态添加懒加载图片
    observe: function(img){
      if('IntersectionObserver' in window && img.dataset.src){
        var observer = new IntersectionObserver(function(entries){
          entries.forEach(function(entry){
            if(entry.isIntersecting){
              entry.target.src = entry.target.dataset.src;
              entry.target.removeAttribute('data-src');
              observer.unobserve(entry.target);
            }
          });
        }, {rootMargin: '50px'});
        observer.observe(img);
      }else if(img.dataset.src){
        img.src = img.dataset.src;
        img.removeAttribute('data-src');
      }
    }
  };

  // 虚拟滚动（长列表优化）
  window.virtualScroll = {
    create: function(container, items, renderItem, options){
      options = options || {};
      var itemHeight = options.itemHeight || 80;
      var visibleCount = Math.ceil(container.clientHeight / itemHeight) + 2;
      var totalHeight = items.length * itemHeight;

      var scrollable = document.createElement('div');
      scrollable.style.height = totalHeight + 'px';
      scrollable.style.position = 'relative';

      var viewport = document.createElement('div');
      viewport.style.position = 'absolute';
      viewport.style.top = '0';
      viewport.style.left = '0';
      viewport.style.right = '0';

      scrollable.appendChild(viewport);
      container.appendChild(scrollable);

      function render(){
        var scrollTop = container.scrollTop;
        var startIdx = Math.floor(scrollTop / itemHeight);
        var endIdx = Math.min(startIdx + visibleCount, items.length);

        viewport.style.transform = 'translateY(' + (startIdx * itemHeight) + 'px)';
        viewport.innerHTML = '';

        for(var i = startIdx; i < endIdx; i++){
          var el = renderItem(items[i], i);
          el.style.height = itemHeight + 'px';
          viewport.appendChild(el);
        }
      }

      container.addEventListener('scroll', render);
      render();

      return {render: render, update: function(newItems){ items = newItems; render(); }};
    }
  };

  // 初始化
  window.lazyLoad.init();
})();
<\/script>

<script>

(function(){

        }, 400);
      } else {
        el.style.height = '0px';
        setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 200);
      }
    }
  }, {passive:true});

  // ---- 滑动删除（MutationObserver 自动挂载） ----
  function attachSwipe(item, id, delFn){
    if(item.__swipe) return;
    item.__swipe = true;
    var startX = 0, startY2 = 0, sw = false, opened = false;
    item.addEventListener('touchstart', function(e){
      startX = e.touches[0].clientX; startY2 = e.touches[0].clientY; sw = false;
    }, {passive:true});
    item.addEventListener('touchmove', function(e){
      var dx = e.touches[0].clientX - startX;
      var dy = e.touches[0].clientY - startY2;
      if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 20){ sw = true; }
    }, {passive:true});
    item.addEventListener('touchend', function(e){
      var dx = (e.changedTouches ? e.changedTouches[0].clientX : 0) - startX;
      if(sw && dx < -50 && !opened){
        opened = true;
        item.style.transition = 'transform .2s ease';
        item.style.transform = 'translateX(-72px)';
        if(!item.querySelector('.swipe-del')){
          var btn = document.createElement('button');
          btn.className = 'swipe-del';
          btn.textContent = '删除';
          btn.style.cssText = 'position:absolute;top:0;right:0;height:100%;width:72px;background:#FA5151;color:#fff;border:none;font-size:14px;';
          btn.onclick = function(ev){ ev.stopPropagation(); delFn(id); opened = false; };
          item.style.position = 'relative';
          item.appendChild(btn);
        }
      } else if(sw && dx > 50 && opened){
        opened = false;
        item.style.transform = 'translateX(0)';
      }
    }, {passive:true});
  }
  function getIdFromOnclick(el){
    // [药品详情页] 药箱卡片已改为 data 属性，优先读取
    var _d = el.getAttribute('data-cab-id') || el.getAttribute('data-rem-id') || el.getAttribute('data-id');
    if(_d) return _d;
    var oc = el.getAttribute('onclick') || '';
    var m = oc.match(/'([^']+)'\)/);
    return m ? m[1] : '';
  }
  function observeList(containerId, selector, delFn){
    var box = document.getElementById(containerId);
    if(!box) return;
    var obs = new MutationObserver(function(muts){
      muts.forEach(function(m){
        m.addedNodes.forEach(function(n){
          if(n.nodeType === 1 && n.matches && n.matches(selector)){
            var id = getIdFromOnclick(n);
            attachSwipe(n, id, delFn);
          }
        });
      });
    });
    obs.observe(box, {childList:true, subtree:true});
    // 初始已有项
    box.querySelectorAll(selector).forEach(function(n){
      attachSwipe(n, getIdFromOnclick(n), delFn);
    });
  }
  window.initSwipeDelete = function(){
    observeList('cabinetList', '.drug-item', function(id){ window.deleteCabinetDrug && window.deleteCabinetDrug(id); });
    observeList('reminderList', '.rem-item', function(id){ window.deleteReminder && window.deleteReminder(id); });
  };
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', window.initSwipeDelete);
  else window.initSwipeDelete();
})();

 * 入口：window.showDrugDetail(drugName [, {cabId:'cab_xxx'}])
 * 触发：任意元素加 data-drug-detail="药名" 即可（全局事件委托，无引号转义问题）
 * 数据：window.__CY_DRUG_FULL（486 条完整版快照） > DRUG_GUIDE（当前绑定，可能是 37 条简化版，含 cat）
 * ================================================================= */
(function(){
  'use strict';

  var MID = 'drugDetailModal';
  var _curName = null;
  var _curCabId = null;

  function $(id){ return document.getElementById(id); }

  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function closestSel(el, sel){
    while(el && el.nodeType === 1){
      var ok = false;
      try{ ok = el.matches ? el.matches(sel) : (el.msMatchesSelector ? el.msMatchesSelector(sel) : false); }catch(e){ ok = false; }
      if(ok) return el;
      el = el.parentElement || el.parentNode;
    }
    return null;
  }

  function lang(){
    try{
      if(typeof window.currentLang === 'string' && window.currentLang) return window.currentLang;
      return localStorage.getItem('lang') || 'zh';
    }catch(e){ return 'zh'; }
  }

  /* 走现有 i18n 对象 T；缺 key 时回落到内置中英文 */
  function tt(key, zh, en){
    try{
      var L = lang();
      if(window.T && window.T[L] && window.T[L][key]) return window.T[L][key];
      return (L === 'en') ? en : zh;
    }catch(e){ return zh; }
  }

  function isArr(v){ return Object.prototype.toString.call(v) === '[object Array]'; }

  /* 字段容错：null / undefined / 空数组 / 空串 统一变成 '' */
  function val(v){
    if(v == null) return '';
    if(isArr(v)){
      return v.filter(function(x){ return x != null && String(x).trim() !== ''; })
              .map(function(x){ return String(x).trim(); }).join('、');
    }
    if(typeof v === 'object'){
      try{ return JSON.stringify(v); }catch(e){ return ''; }
    }
    return String(v).trim();
  }

  function guides(){
    var full = null, cur = null;
    try{ full = window.__CY_DRUG_FULL || null; }catch(e){}
    try{ cur  = window.DRUG_GUIDE || null; }catch(e){}
    return { full: full || {}, cur: cur || {} };
  }

  var EN_ALIAS = {
    'ibuprofen':'布洛芬','paracetamol':'对乙酰氨基酚','acetaminophen':'对乙酰氨基酚','aspirin':'阿司匹林',
    'amoxicillin':'阿莫西林','metformin':'二甲双胍','omeprazole':'奥美拉唑','loratadine':'氯雷他定',
    'cetirizine':'西替利嗪','atorvastatin':'阿托伐他汀','simvastatin':'辛伐他汀','amlodipine':'氨氯地平',
    'nifedipine':'硝苯地平','losartan':'氯沙坦','insulin':'胰岛素','warfarin':'华法林'
  };

  /* 药名归一化：精确 -> 英文别名 -> fuzzyMatchDrug -> 去剂型 -> 包含匹配 */
  function resolveName(input){
    var name = String(input == null ? '' : input).trim();
    if(!name) return null;
    var g = guides();
    if(g.full[name] || g.cur[name]) return name;

    var lower = name.toLowerCase();
    if(EN_ALIAS[lower] && (g.full[EN_ALIAS[lower]] || g.cur[EN_ALIAS[lower]])) return EN_ALIAS[lower];

    try{

        var f = window.fuzzyMatchDrug(name);
        if(f && (g.full[f] || g.cur[f])) return f;
      }
    }catch(e){}

    try{
      if(typeof window.stripDosageForm === 'function'){
        var s = window.stripDosageForm(name);
        if(s && (g.full[s] || g.cur[s])) return s;
      }
    }catch(e){}

    var keys = Object.keys(g.full);
    if(!keys.length) keys = Object.keys(g.cur);
    for(var i = 0; i < keys.length; i++){
      var k = keys[i];
      if(k && (name.indexOf(k) >= 0 || k.indexOf(name) >= 0)) return k;
    }
    return null;
  }

  /* 合并完整版 + 简化版（简化版只贡献 cat 等完整版没有的字段） */
  function getData(name){
    var g = guides();
    var simple = g.cur[name] || null;
    var full   = g.full[name] || null;
    if(!simple && !full) return null;
    var out = {}, k;
    if(simple){ for(k in simple){ if(Object.prototype.hasOwnProperty.call(simple, k)) out[k] = simple[k]; } }
    if(full){ for(k in full){ if(Object.prototype.hasOwnProperty.call(full, k) && val(full[k]) !== '') out[k] = full[k]; } }
    return out;
  }

  function cabEntry(name, cabId){
    var list = [];
    try{ list = JSON.parse(localStorage.getItem('cy_cabinet') || '[]') || []; }catch(e){ list = []; }
    var i;
    if(cabId){ for(i = 0; i < list.length; i++){ if(list[i] && list[i].id === cabId) return list[i]; } }
    for(i = 0; i < list.length; i++){ if(list[i] && list[i].name === name) return list[i]; }
    return null;
  }

  function memberNameOf(entry){
    if(!entry) return '';
    if(entry.memberName) return entry.memberName;
    if(!entry.memberId || entry.memberId === 'self') return (lang() === 'en' ? 'Me' : '我');
    try{
      var ms = JSON.parse(localStorage.getItem('cy_members') || '[]') || [];
      for(var i = 0; i < ms.length; i++){ if(ms[i] && ms[i].id === entry.memberId) return ms[i].name || ''; }
    }catch(e){}
    return '';
  }

  /* 相互作用条数摘要（双向去重） */
  function interactSummary(name){
    var db = null;
    try{ db = window.INTERACT_DB || null; }catch(e){}
    if(!db) return null;
    var seen = {}, total = 0, danger = 0, caution = 0, k, ty;
    if(db[name]){
      for(k in db[name]){
        if(seen[k]) continue;
        seen[k] = 1; total++;
        ty = (db[name][k] || {}).type;
        if(ty === 'danger') danger++; else if(ty === 'caution') caution++;
      }
    }
    for(var d in db){
      if(d === name || seen[d]) continue;
      if(db[d] && db[d][name]){
        seen[d] = 1; total++;
        ty = (db[d][name] || {}).type;
        if(ty === 'danger') danger++; else if(ty === 'caution') caution++;
      }
    }
    if(!total) return null;
    return { total: total, danger: danger, caution: caution };
  }

  var FIELDS = [
    { k:'indications',        ico:'🎯', key:'ddIndications',  zh:'适应症',   en:'Indications' },
    { k:'ingredients',        ico:'🧪', key:'ddIngredients',  zh:'成分',     en:'Ingredients' },
    { k:'dosage',             ico:'💊', key:'ddDosage',       zh:'用法用量', en:'Dosage & Administration' },
    { k:'time',               ico:'⏰', key:'ddTime',         zh:'服药时间', en:'When to Take' },
    { k:'food',               ico:'🍽️', key:'ddFood',         zh:'食物禁忌', en:'Food Restrictions' },
    { k:'adverse',            ico:'😖', key:'ddAdverse',      zh:'不良反应', en:'Adverse Reactions' },
    { k:'contraindications',  ico:'🚫', key:'ddContra',       zh:'禁忌症',   en:'Contraindications' },
    { k:'note',               ico:'📝', key:'ddNote',         zh:'注意事项', en:'Precautions' },
    { k:'storage',            ico:'📦', key:'ddStorage',      zh:'贮藏',     en:'Storage' }
  ];

  function buildBody(name, d, cab){
    var h = '';
    var EMPTY = tt('ddEmpty', '暂无数据', 'No data');

    if(!d){
      h += '<div class="dd-sec"><div class="dd-sec-c dd-muted">'
         + esc(tt('ddNotFound', '未找到该药品的详细资料', 'No detailed information found for this drug'))
         + '</div></div>';
    }

    /* 安全警示 */
    if(d && d.warn){
      var ws = isArr(d.warn) ? d.warn : [d.warn];
      var wl = '';
      ws.forEach(function(w){ var t = val(w); if(t) wl += '<li>' + esc(t) + '</li>'; });
      if(wl){
        h += '<div class="dd-warn"><div class="dd-warn-t">⚠️ '
           + esc(tt('ddWarn', '安全警示', 'Safety Warnings'))
           + '</div><ul>' + wl + '</ul></div>';
      }
    }

    /* 我的药箱信息 */
    if(cab){
      var kv = '';
      kv += '<div><b>' + esc(tt('ddSpec','规格','Spec')) + '：</b>' + esc(val(cab.spec) || '—') + '</div>';
      kv += '<div><b>' + esc(tt('ddQty','余量','Remaining')) + '：</b>' + esc(val(cab.qty) || '—') + '</div>';
      var expTxt = val(cab.expiry) || '—';
      if(cab.expiry){
        try{
          var left = Math.ceil((new Date(cab.expiry) - new Date()) / 86400000);
          expTxt += (lang() === 'en')
            ? (left < 0 ? ' (expired ' + Math.abs(left) + 'd)' : ' (' + left + 'd left)')
            : (left < 0 ? '（已过期 ' + Math.abs(left) + ' 天）' : '（剩余 ' + left + ' 天）');
        }catch(e){}
      }
      kv += '<div><b>' + esc(tt('ddExpiry','有效期','Expiry')) + '：</b>' + esc(expTxt) + '</div>';
      var mn = memberNameOf(cab);
      if(mn) kv += '<div><b>' + esc(tt('ddOwner','归属','Owner')) + '：</b>' + esc(mn) + '</div>';
      h += '<div class="dd-cab"><div class="dd-cab-t">🧰 '
         + esc(tt('ddCabinet','我的药箱信息','My Cabinet'))
         + '</div><div class="dd-kv">' + kv + '</div></div>';
    }

    /* 相互作用摘要 */
    var isum = interactSummary(name);
    if(isum){
      var tags = '<span class="dd-tag">🔗 ' + isum.total + ' ' + esc(tt('ddInteractTotal','条相互作用','interactions')) + '</span>';
      if(isum.danger)  tags += '<span class="dd-tag dd-tag-danger">⛔ ' + esc(tt('ddInteractDanger','禁忌','Contraindicated')) + ' ' + isum.danger + '</span>';
      if(isum.caution) tags += '<span class="dd-tag dd-tag-caution">⚠️ ' + esc(tt('ddInteractCaution','注意','Caution')) + ' ' + isum.caution + '</span>';
      h += '<div class="dd-tags">' + tags + '</div>';
    }

    /* 正文字段（缺失显示「暂无数据」） */
    FIELDS.forEach(function(f){
      var v = d ? val(d[f.k]) : '';
      h += '<div class="dd-sec"><div class="dd-sec-t">' + f.ico + ' ' + esc(tt(f.key, f.zh, f.en)) + '</div>'
         + '<div class="dd-sec-c' + (v ? '' : ' dd-muted') + '">' + esc(v || EMPTY) + '</div></div>';
    });

    h += '<div class="dd-tip">' + esc(tt('ddDisclaimer',
          '以上信息仅供参考，具体用药请遵医嘱或咨询药师。',
          'For reference only. Please follow your doctor or pharmacist advice.')) + '</div>';
    return h;
  }

  function syncFavBtn(){
    var txt = $('drugDetailFavTxt'), btn = $('drugDetailFavBtn');
    if(!txt || !btn) return;
    var faved = false;
    try{ faved = (typeof window.isFavorite === 'function') ? !!window.isFavorite(_curName) : false; }catch(e){}
    txt.textContent = faved ? tt('ddFaved','已收藏','Favorited') : tt('ddFav','收藏','Favorite');
    btn.firstChild.nodeValue = faved ? '★ ' : '☆ ';
  }

  function openModal(){
    var m = $(MID);
    if(!m) return;
    m.classList.add('dd-open');
    m.setAttribute('aria-hidden', 'false');
    try{ document.body.style.overflow = 'hidden'; }catch(e){}
    var body = $('drugDetailBody');
    if(body) body.scrollTop = 0;
  }

  function closeDrugDetail(){
    var m = $(MID);
    if(!m) return;
    m.classList.remove('dd-open');
    m.setAttribute('aria-hidden', 'true');
    try{ document.body.style.overflow = ''; }catch(e){}
    _curName = null;
    _curCabId = null;
  }

  /* ============ 主入口 ============ */
  function showDrugDetail(drugName, opts){
    opts = opts || {};
    var m = $(MID);
    if(!m){ try{ if(window.showToast) window.showToast('详情组件未加载'); }catch(e){} return; }

    var input = String(drugName == null ? '' : drugName).trim();
    if(!input){ try{ if(window.showToast) window.showToast(tt('ddNotFound','未找到该药品的详细资料','No drug info')); }catch(e){} return; }

    var name = resolveName(input) || input;
    var d = getData(name);
    var cab = cabEntry(name, opts.cabId || null);

    _curName = name;
    _curCabId = (cab && cab.id) ? cab.id : (opts.cabId || null);

    var titleEl = $('drugDetailName'), catEl = $('drugDetailCat'), bodyEl = $('drugDetailBody');
    var shown = name;
    try{ if(lang() === 'en' && typeof window.drugLabel === 'function') shown = window.drugLabel(name) || name; }catch(e){}
    if(titleEl) titleEl.textContent = '💊 ' + shown;
    if(catEl){
      var cat = d ? val(d.cat || d.category) : '';
      catEl.textContent = cat ? (tt('ddCat','分类','Category') + '：' + cat) : tt('ddTitle','药品详情','Drug Details');
    }
    if(bodyEl) bodyEl.innerHTML = buildBody(name, d, cab);

    var netBtn = $('drugDetailNetBtn');
    if(netBtn){
      var hasNet = false;
      try{ hasNet = !!(window.INTERACT_DB && window.INTERACT_DB[name]); }catch(e){}
      netBtn.style.display = hasNet ? '' : 'none';
    }

    var t1 = $('drugDetailNetTxt');   if(t1) t1.textContent = tt('ddGoInteract','查相互作用','Interactions');
    var t2 = $('drugDetailRemindTxt'); if(t2) t2.textContent = tt('ddRemind','设提醒','Remind');
    syncFavBtn();
    openModal();
    try{ if(window.cyTrack) window.cyTrack('drugDetail'); }catch(e){}
  }

  /* ============ 收藏区渲染 ============ */
  function renderFavorites(){
    var box = $('favoritesList');
    if(!box) return;
    var ti = $('favoritesTitle');
    if(ti) ti.textContent = '⭐ ' + tt('ddFavTitle','我的收藏','My Favorites');
    var list = [];
    try{
      list = (typeof window.getFavorites === 'function')
        ? (window.getFavorites() || [])
        : (JSON.parse(localStorage.getItem('cy_favorites') || '[]') || []);
    }catch(e){ list = []; }
    if(!list.length){
      box.innerHTML = '<div style="font-size:12.5px;color:#aaa;line-height:1.6">'
        + esc(tt('ddFavEmpty','还没有收藏任何药品，在药品详情里点「收藏」试试','No favorites yet.')) + '</div>';
      return;
    }
    var h = '';
    list.forEach(function(n){
      var s = val(n);
      if(!s) return;
      h += '<span class="dd-fav-chip" data-drug-detail="' + esc(s) + '">⭐ ' + esc(s) + '</span>';
    });
    box.innerHTML = h;
  }

  /* ============ 全局事件委托 ============ */
  document.addEventListener('click', function(e){
    var t = e.target;
    if(!t || t.nodeType !== 1) return;

    /* 药箱删除按钮（优先，避免误开详情） */
    var del = closestSel(t, '[data-cab-del]');
    if(del){
      e.preventDefault();
      e.stopPropagation();
      var did = del.getAttribute('data-cab-del');
      try{ if(typeof window.deleteCabinetDrug === 'function') window.deleteCabinetDrug(did); }catch(err){}
      return;
    }

    /* 遮罩 / 关闭按钮 */
    var closer = closestSel(t, '[data-dd-close]');
    if(closer && closestSel(closer, '#' + MID)){ closeDrugDetail(); return; }

    /* 打开详情 */
    var el = closestSel(t, '[data-drug-detail]');
    if(!el) return;
    if(closestSel(el, '#' + MID)) return;
    var nm = el.getAttribute('data-drug-detail');
    if(!nm) return;
    e.preventDefault();
    var cabHost = closestSel(el, '[data-cab-id]');
    showDrugDetail(nm, cabHost ? { cabId: cabHost.getAttribute('data-cab-id') } : {});
  }, false);

  document.addEventListener('keydown', function(e){
    if((e.key === 'Escape' || e.keyCode === 27)){
      var m = $(MID);
      if(m && m.classList.contains('dd-open')) closeDrugDetail();
    }
  }, false);

  /* ============ 底部按钮 ============ */
  function bindFooter(){
    var fav = $('drugDetailFavBtn');
    if(fav && !fav.__ddBound){
      fav.__ddBound = 1;
      fav.addEventListener('click', function(){
        if(!_curName) return;
        try{ if(typeof window.toggleFavorite === 'function') window.toggleFavorite(_curName); }catch(e){}
        syncFavBtn();
        renderFavorites();
      });
    }
    var net = $('drugDetailNetBtn');
    if(net && !net.__ddBound){
      net.__ddBound = 1;
      net.addEventListener('click', function(){
        var n = _curName;
        closeDrugDetail();
        if(!n) return;
        try{
          if(typeof window.switchTab === 'function') window.switchTab('interact');
          var i1 = document.getElementById('drugInput1');
          var i2 = document.getElementById('drugInput2');
          if(i1) i1.value = n;
          if(i2) i2.value = '';
          if(typeof window.showInteract === 'function') window.showInteract();
          else if(typeof window.showNetwork === 'function') window.showNetwork(n);
        }catch(e){}
      });
    }
    var rem = $('drugDetailRemindBtn');
    if(rem && !rem.__ddBound){
      rem.__ddBound = 1;
      rem.addEventListener('click', function(){
        var n = _curName;
        closeDrugDetail();
        if(!n) return;
        try{
          if(typeof window.setReminderForDrug === 'function'){ window.setReminderForDrug(n); return; }
          if(typeof window.openReminderModal === 'function'){
            window.openReminderModal();
            var di = document.getElementById('reminderDrugInput');
            if(di) di.value = n;
          }
        }catch(e){}
      });
    }
  }

  function init(){
    bindFooter();
    renderFavorites();
  }

  window.showDrugDetail  = showDrugDetail;
  window.closeDrugDetail = closeDrugDetail;
  window.renderFavorites = renderFavorites;
  window.__ddResolveDrugName = resolveName;

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
<\/script>

<script>
// ===== 拍照识别（药品识别）模块 v1.1 =====
// 注入规范：独立 <script> 块，插在 
</body> 前。不替换任何既有函数。
(function () {
  var CY = window.CY || (window.CY = {});
  CY.recognize = {
    busy: false,
    lastResult: null
  };

  // 注入 UI（功能网格加"拍照识别"入口 + 识别面板）
  function injectUI() {
    if (document.getElementById('scanEntry')) return;
    // 功能网格最后一个按钮后追加"拍照识别"入口
    var grid = document.querySelector('#manualCard [style*="grid-template-columns"]');
    if (grid) {
      var btn = document.createElement('button');
      btn.className = 'btn-secondary';
      btn.id = 'scanEntry';
      btn.setAttribute('aria-label', '拍照识别');
      btn.onclick = function () { openScanPanel(); };
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;vertical-align:middle"><path d="M4 7h3l2-2h6l2 2h3v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span id="featScan">拍照识别</span>';
      grid.appendChild(btn);
    }
    // 识别结果面板（隐藏，插到 manualCard 之后）
    var panel = document.createElement('div');
    panel.id = 'scanPanel';
    panel.style.cssText = 'display:none;margin-top:12px;padding:14px;border:1px solid var(--c-border,#e5e7eb);border-radius:12px;background:#fff';
    panel.innerHTML =
      '<div style="display:flex;align-items:center;justify-content:space-between">' +
      '<span style="font-weight:600;font-size:15px">📷 拍照识别药品</span>' +
      '<button id="scanClose" style="border:none;background:none;font-size:18px;cursor:pointer;color:#888" aria-label="关闭">×</button></div>' +
      '<div style="display:flex;gap:8px;margin-top:10px">' +
      '<input type="file" id="scanFileInput" accept="image/*" capture="environment" style="display:none">' +
      '<input type="file" id="scanAlbumInput" accept="image/*" style="display:none">' +
      '<button id="scanCameraBtn" class="btn-primary" style="flex:1">📷 拍照</button>' +
      '<button id="scanAlbumBtn" class="btn-secondary" style="flex:1">🖼️ 相册</button>' +
      '</div>' +
      '<div id="scanPreviewWrap" style="display:none;margin-top:10px;text-align:center">' +
      '<img id="scanPreview" style="max-width:100%;max-height:240px;border-radius:8px">' +
      '<div style="margin-top:8px;display:flex;gap:8px">' +
      '<button id="scanRecognizeBtn" class="btn-primary" style="flex:1">🔍 识别</button>' +
      '<button id="scanResetBtn" class="btn-secondary" style="flex:1">重新选择</button>' +
      '</div><div id="scanProgress" style="margin-top:8px;font-size:13px;color:#888;display:none"></div>' +
      '</div>' +
      '<div id="scanResult" style="margin-top:10px"></div>' +
      '<div id="scanManual" style="display:none;margin-top:10px">' +
      '<input id="scanManualInput" placeholder="识别不准确？手动输入药名" style="width:100%;padding:9px 12px;border:1.5px solid var(--c-border,#e5e7eb);border-radius:8px;font-size:14px;outline:none;box-sizing:border-box">' +
      '<button id="scanManualBtn" class="btn-secondary" style="width:100%;margin-top:6px">手动搜索</button>' +
      '</div>';
    var card = document.getElementById('manualCard');
    if (card && card.parentNode) card.parentNode.insertBefore(panel, card.nextSibling);
    bindEvents();
  }

  function bindEvents() {
    var cam = document.getElementById('scanCameraBtn');
    var alb = document.getElementById('scanAlbumBtn');
    var close = document.getElementById('scanClose');
    var file = document.getElementById('scanFileInput');
    var album = document.getElementById('scanAlbumInput');
    var rec = document.getElementById('scanRecognizeBtn');
    var reset = document.getElementById('scanResetBtn');
    var mBtn = document.getElementById('scanManualBtn');
    var mInput = document.getElementById('scanManualInput');
    if (cam) cam.onclick = function () { file.click(); };
    if (alb) alb.onclick = function () { album.click(); };
    if (close) close.onclick = function () { document.getElementById('scanPanel').style.display = 'none'; };
    if (file) file.onchange = function (e) { handleFile(e, 'camera'); };
    if (album) album.onchange = function (e) { handleFile(e, 'album'); };
    if (rec) rec.onclick = function () { runOCR(); };
    if (reset) reset.onclick = function () { resetPanel(); };
    if (mBtn) mBtn.onclick = function () { manualSearch(); };
    if (mInput) mInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') manualSearch(); });
  }

  function openScanPanel() {
    injectUI();
    var p = document.getElementById('scanPanel');
    if (p) p.style.display = 'block';
    setTimeout(function () { var r = document.getElementById('scanPanel'); if (r) r.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 60);
  }
  window.openScanPanel = openScanPanel;

  function handleFile(e, source) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var url = URL.createObjectURL(f);
    var img = document.getElementById('scanPreview');
    img.src = url;
    document.getElementById('scanPreviewWrap').style.display = 'block';
    document.getElementById('scanResult').innerHTML = '';
    document.getElementById('scanManual').style.display = 'none';
    window.__scanFile = f;
    e.target.value = '';
  }

  function resetPanel() {
    document.getElementById('scanPreviewWrap').style.display = 'none';
    document.getElementById('scanPreview').src = '';
    document.getElementById('scanResult').innerHTML = '';
    document.getElementById('scanManual').style.display = 'none';
    document.getElementById('scanProgress').style.display = 'none';
    window.__scanFile = null;
    CY.recognize.busy = false;
  }

  function showProgress(t) {
    var p = document.getElementById('scanProgress');
    if (p) { p.textContent = t; p.style.display = 'block'; }
  }

  // 中文 OCR：优先用 tesseract.js（已加载），失败则提示
  function runOCR() {
    if (CY.recognize.busy) return;
    var f = window.__scanFile;
    if (!f) { showResult('<div style="color:#FA5151;font-size:13px">请先选择图片</div>'); return; }
    CY.recognize.busy = true;
    showProgress('正在识别文字…（首次加载约需 10-30 秒）');
    if (typeof Tesseract === 'undefined') {
      showProgress('OCR 引擎加载失败');
      CY.recognize.busy = false;
      document.getElementById('scanManual').style.display = 'block';
      return;
    }
    try {
      Tesseract.recognize(f, 'chi_sim+eng', {
        logger: function (m) {
          if (m && m.status === 'recognizing text') {
            var pct = m.progress ? Math.round(m.progress * 100) : 0;
            showProgress('识别中… ' + pct + '%');
          }
        }
      }).then(function (res) {
        CY.recognize.busy = false;
        var text = (res && res.data && res.data.text) ? res.data.text : '';
        if (!text.trim()) {
          showProgress('');
          showResult('<div style="color:#FA5151;font-size:13px">未识别到文字，请换一张更清晰的照片，或手动输入</div>');
          document.getElementById('scanManual').style.display = 'block';
          return;
        }
        showProgress('');
        matchFromText(text);
      }).catch(function (err) {
        CY.recognize.busy = false;
        showProgress('');
        showResult('<div style="color:#FA5151;font-size:13px">识别出错：' + escHtml(String(err && err.message ? err.message : err)) + '</div>');
        document.getElementById('scanManual').style.display = 'block';
      });
    } catch (err) {
      CY.recognize.busy = false;
      showProgress('');
      showResult('<div style="color:#FA5151;font-size:13px">识别异常：' + escHtml(String(err && err.message ? err.message : err)) + '</div>');
      document.getElementById('scanManual').style.display = 'block';
    }
  }

  // 从 OCR 文本提取药名并匹配
  function matchFromText(text) {
    var lines = text.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean);
    var candidates = [];
    var drugKeys = window.DRUG_GUIDE ? Object.keys(window.DRUG_GUIDE) : [];
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      if (/^\d|^[A-Z]{2,}|说明书|适应症|用法|用量|禁忌|贮藏|生产|批准文号|国药准字|规格|每片|每粒|mg|g\b|ml|盒|瓶|片|粒|袋/.test(line) && !drugKeys.some(function (k) { return line.indexOf(k) !== -1; })) continue;
      candidates.push(line);
    }
    var matched = [];
    var seen = {};
    function addMatch(name) {
      if (!name || seen[name]) return;
      seen[name] = 1;
      matched.push(name);
    }
    candidates.forEach(function (line) {
      var m = fuzzyMatchDrug(line);
      if (m) { addMatch(m); return; }
      for (var j = 0; j < drugKeys.length; j++) {
        var k = drugKeys[j];
        if (line.length >= 2 && line.indexOf(k) !== -1) { addMatch(k); break; }
      }
    });
    if (matched.length === 0) {
      for (var j2 = 0; j2 < drugKeys.length; j2++) {
        var k2 = drugKeys[j2];
        if (k2.length >= 2 && text.indexOf(k2) !== -1) { addMatch(k2); if (matched.length >= 5) break; }
      }
    }
    var manual = document.getElementById('scanManual');
    if (matched.length === 0) {
      showResult('<div style="color:#FA5151;font-size:13px">未匹配到药品库中的药物，请手动输入</div>');
      if (manual) manual.style.display = 'block';
      return;
    }
    if (manual) manual.style.display = 'block';
    renderMatchResults(matched.slice(0, 5));
  }

  function renderMatchResults(names) {
    var box = document.getElementById('scanResult');
    var html = '<div style="font-size:13px;color:#666;margin-bottom:8px">识别到 ' + names.length + ' 个候选药品：</div>';
    names.forEach(function (name) {
      var d = window.DRUG_GUIDE ? window.DRUG_GUIDE[name] : null;
      var ind = (d && d.indications) ? d.indications.join('、') : '';
      html += '<div style="display:flex;align-items:center;justify-content:space-between;padding:10px;border:1px solid var(--c-border,#e5e7eb);border-radius:10px;margin-bottom:8px;background:#fafafa">' +
        '<div style="flex:1;min-width:0" onclick="showDrugDetail(\'' + name.replace(/'/g, "\\'") + '\')">' +
        '<div style="font-weight:600;font-size:14px">' + escHtml(name) + '</div>' +
        '<div style="font-size:12px;color:#888;margin-top:2px">适应症：' + escHtml(ind || '—') + '</div></div>' +
        '<button onclick="event.stopPropagation();addScanToCabinet(\'' + name.replace(/'/g, "\\'") + '\')" style="margin-left:8px;background:#07C160;color:#fff;border:none;padding:7px 12px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap">＋药箱</button></div>';
    });
    box.innerHTML = html;
  }

  // 识别结果一键加入药箱（复用 cy_cabinet 存储结构）
  function addScanToCabinet(name) {
    if (!name) return;
    try {
      var drugs = JSON.parse(localStorage.getItem('cy_cabinet') || '[]');
      if (drugs.some(function (x) { return x.name === name; })) {
        if (typeof showToast === 'function') showToast('「' + name + '」已在药箱中');
        return;
      }
      var members = JSON.parse(localStorage.getItem('cy_members') || '[{"id":"self","name":"我"}]');
      var memberName = (members[0] || { name: '我' }).name;
      drugs.push({
        id: 'cab_' + Date.now(),
        name: name,
        spec: '',
        qty: '',
        expiry: '',
        memberId: (members[0] || { id: 'self' }).id,
        memberName: memberName,
        added: new Date().toISOString(),
        source: 'scan'
      });
      localStorage.setItem('cy_cabinet', JSON.stringify(drugs));
      if (typeof cabinet !== 'undefined') cabinet = drugs;
      if (typeof updateCabinetStats === 'function') updateCabinetStats();
      if (typeof renderCabinet === 'function') renderCabinet();
      if (typeof showToast === 'function') showToast('已将「' + name + '」加入药箱');
    } catch (e) {
      if (typeof showToast === 'function') showToast('加入失败：' + escHtml(String(e.message || e)));
    }
  }
  window.addScanToCabinet = addScanToCabinet;

  function manualSearch() {
    var input = document.getElementById('scanManualInput');
    var v = input ? input.value.trim() : '';
    if (!v) { showResult('<div style="color:#FA5151;font-size:13px">请输入药名</div>'); return; }
    var m = fuzzyMatchDrug(v);
    if (m) {
      renderMatchResults([m]);
    } else {
      showResult('<div style="color:#FA5151;font-size:13px">未找到「' + escHtml(v) + '」，试试更精确的药名（如：布洛芬、阿莫西林）</div>');
    }
  }

  function showResult(html) {
    var box = document.getElementById('scanResult');
    if (box) box.innerHTML = html;
  }

  function escHtml(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function init() {
    injectUI();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

<script>
// ===== 健康追踪（慢病管理）模块 v1.1 (i18n) =====
(function () {
  var CY = window.CY || (window.CY = {});
  CY.health = { lastFilter: 'all' };
  function L(k, d) { return (window.T && T[currentLang] && T[currentLang][k]) || d; }

  var TH = {
    bp: {
      sys: [{ max: 90, level: 'low', label: '偏低' }, { max: 120, level: 'normal', label: '理想' }, { max: 140, level: 'high', label: '正常高值' }, { max: 180, level: 'high2', label: '高血压' }, { max: 9999, level: 'danger', label: '高血压危象' }],
      dia: [{ max: 60, level: 'low', label: '偏低' }, { max: 80, level: 'normal', label: '理想' }, { max: 90, level: 'high', label: '正常高值' }, { max: 120, level: 'danger', label: '高血压危象' }, { max: 9999, level: 'danger', label: '高血压危象' }]
    },
    glu: [
      { max: 3.9, level: 'low', label: '低血糖' },
      { max: 6.1, level: 'normal', label: '正常' },
      { max: 7.0, level: 'high', label: '空腹受损' },
      { max: 11.1, level: 'high2', label: '糖尿病' },
      { max: 9999, level: 'danger', label: '高血糖' }
    ]
  };

  function classify(type, sys, dia, value) {
    if (type === 'bp') {
      var sr = TH.bp.sys.find(function (r) { return sys <= r.max; });
      var dr = TH.bp.dia.find(function (r) { return dia <= r.max; });
      var order = ['low', 'normal', 'high', 'high2', 'danger'];
      var sIdx = order.indexOf(sr.level), dIdx = order.indexOf(dr.level);
      var main = sIdx > dIdx ? sr : dr;
      return { level: main.level, label: sr.label + ' / ' + dr.label };
    } else {
      var r = TH.glu.find(function (x) { return value <= x.max; });
      return { level: r.level, label: r.label };
    }
  }

  function levelColor(level) {
    return ({ low: '#FF9F0A', normal: '#07C160', high: '#FF9F0A', high2: '#FA5151', danger: '#b91c1c' })[level] || '#888';

    panel.style.cssText = 'display:none;margin-top:12px;padding:14px;border:1px solid var(--c-border,#e5e7eb);border-radius:12px;background:#fff';
    panel.innerHTML =
      '<div style="display:flex;align-items:center;justify-content:space-between">' +
      '<span class="health-title" style="font-weight:600;font-size:15px">' + L('healthPanelTitle', '💗 健康追踪') + '</span>' +
      '<button id="healthClose" style="border:none;background:none;font-size:18px;cursor:pointer;color:#888" aria-label="×">×</button></div>' +
      '<p class="health-hint" style="font-size:12px;color:#888;margin:6px 0 10px">' + L('healthHint', '记录血压 / 血糖，追踪趋势，异常时提醒。仅供个人参考。') + '</p>' +
      '<div style="display:flex;gap:6px;margin-bottom:10px">' +
      '<button id="healthTabBp" class="btn-primary" style="flex:1;padding:8px 0">' + L('healthTabBp', '血压') + '</button>' +
      '<button id="healthTabGlu" class="btn-secondary" style="flex:1;padding:8px 0">' + L('healthTabGlu', '血糖') + '</button>' +
      '</div>' +
      '<div id="healthFormWrap"></div>' +
      '<div id="healthChartWrap" style="margin-top:14px"></div>' +
      '<div id="healthList" style="margin-top:14px"></div>';
    var card = document.getElementById('manualCard');

    bindEvents();
    CY.health.lastFilter = 'bp';
    renderForm();
    renderChart();
    renderList();
  }

  function bindEvents() {
    var close = document.getElementById('healthClose');
    var tb = document.getElementById('healthTabBp');
    var tg = document.getElementById('healthTabGlu');
    if (close) close.onclick = function () { document.getElementById('healthPanel').style.display = 'none'; };
    if (tb) tb.onclick = function () { switchType('bp'); };
    if (tg) tg.onclick = function () { switchType('glu'); };
  }

  function switchType(t) {
    CY.health.lastFilter = t;
    var tb = document.getElementById('healthTabBp');
    var tg = document.getElementById('healthTabGlu');
    if (tb && tg) {
      if (t === 'bp') { tb.className = 'btn-primary'; tg.className = 'btn-secondary'; }
      else { tb.className = 'btn-secondary'; tg.className = 'btn-primary'; }
    }
    renderForm();
    renderChart();
    renderList();
  }

  function memberOptionsHtml() {
    try {
      var ms = JSON.parse(localStorage.getItem('cy_members') || '[{"id":"self","name":"我"}]');
      var sel = localStorage.getItem('cy_current_member') || (ms[0] && ms[0].id) || 'self';
      return ms.map(function (m) { return '<option value="' + escAttr(m.id) + '"' + (m.id === sel ? ' selected' : '') + '>' + escHtml(m.name) + '</option>'; }).join('');
    } catch (e) { return '<option value="self">我</option>'; }
  }

  function renderForm() {
    var wrap = document.getElementById('healthFormWrap');
    if (!wrap) return;
    if (CY.health.lastFilter === 'bp') {
      wrap.innerHTML =
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">' +
        '<input id="hSys" type="number" inputmode="numeric" placeholder="' + L('healthSysPh', '收缩压(高压)') + '" style="padding:9px 12px;border:1.5px solid var(--c-border,#e5e7eb);border-radius:8px;font-size:14px;outline:none">' +
        '<input id="hDia" type="number" inputmode="numeric" placeholder="' + L('healthDiaPh', '舒张压(低压)') + '" style="padding:9px 12px;border:1.5px solid var(--c-border,#e5e7eb);border-radius:8px;font-size:14px;outline:none">' +
        '</div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">' +
        '<input id="hHr" type="number" inputmode="numeric" placeholder="' + L('healthHrPh', '心率(可选)') + '" style="padding:9px 12px;border:1.5px solid var(--c-border,#e5e7eb);border-radius:8px;font-size:14px;outline:none">' +
        '<select id="hMember" style="padding:9px 12px;border:1.5px solid var(--c-border,#e5e7eb);border-radius:8px;font-size:14px;outline:none;background:#fff">' + memberOptionsHtml() + '</select>' +
        '</div>' +
        '<button id="hSaveBtn" class="btn-primary" style="width:100%;margin-top:10px">' + L('healthSaveBtn', '保存记录') + '</button>';
    } else {
      wrap.innerHTML =
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">' +
        '<input id="hGlu" type="number" step="0.1" inputmode="decimal" placeholder="' + L('healthGluPh', '血糖(mmol/L)') + '" style="padding:9px 12px;border:1.5px solid var(--c-border,#e5e7eb);border-radius:8px;font-size:14px;outline:none">' +
        '<select id="hMember" style="padding:9px 12px;border:1.5px solid var(--c-border,#e5e7eb);border-radius:8px;font-size:14px;outline:none;background:#fff">' + memberOptionsHtml() + '</select>' +
        '</div>' +
        '<div style="display:flex;gap:6px;margin-top:8px">' +
        '<label style="flex:1;display:flex;align-items:center;gap:4px;font-size:13px"><input type="radio" name="hGluType" value="fasting" checked> ' + L('healthGluFasting', '空腹') + '</label>' +
        '<label style="flex:1;display:flex;align-items:center;gap:4px;font-size:13px"><input type="radio" name="hGluType" value="post"> ' + L('healthGluPost', '餐后') + '</label>' +
        '<label style="flex:1;display:flex;align-items:center;gap:4px;font-size:13px"><input type="radio" name="hGluType" value="random"> ' + L('healthGluRandom', '随机') + '</label>' +
        '</div>' +
        '<button id="hSaveBtn" class="btn-primary" style="width:100%;margin-top:10px">' + L('healthSaveBtn', '保存记录') + '</button>';
    }
    var sv = document.getElementById('hSaveBtn');
    if (sv) sv.onclick = function () { saveRecord(); };
  }

  function saveRecord() {
    var records = readAll();
    var rec = { id: 'h_' + Date.now(), type: CY.health.lastFilter, date: new Date().toISOString() };
    rec.memberId = (document.getElementById('hMember') && document.getElementById('hMember').value) || 'self';
    if (rec.type === 'bp') {
      var s = parseInt(document.getElementById('hSys').value, 10);
      var d = parseInt(document.getElementById('hDia').value, 10);
      if (!s || !d) { toast(L('healthNeedBp', '请填写收缩压和舒张压')); return; }
      rec.sys = s; rec.dia = d;
      var hr = document.getElementById('hHr').value;
      if (hr) rec.hr = parseInt(hr, 10);
    } else {
      var v = parseFloat(document.getElementById('hGlu').value);
      if (!v) { toast(L('healthNeedGlu', '请填写血糖值')); return; }
      rec.value = v;
      var checked = document.querySelector('input[name="hGluType"]:checked');
      rec.subtype = checked ? checked.value : 'random';
    }
    records.unshift(rec);
    localStorage.setItem('cy_health', JSON.stringify(records));
    renderForm();
    renderChart();
    renderList();
    toast(L('healthSaved', '已保存'));
  }

  function readAll() {
    try { return JSON.parse(localStorage.getItem('cy_health') || '[]'); } catch (e) { return []; }
  }

  function filteredRecords() {
    return readAll().filter(function (r) { return r.type === CY.health.lastFilter; }).slice(0, 30);
  }

  function renderChart() {
    var wrap = document.getElementById('healthChartWrap');
    if (!wrap) return;
    var recs = filteredRecords().slice().reverse();
    if (recs.length < 1) { wrap.innerHTML = ''; return; }
    var w = 320, h = 120, padL = 32, padR = 16, padT = 10, padB = 20;
    var pts = [];
    if (CY.health.lastFilter === 'bp') {
      var yMin = 50, yMax = 180;
      var allVals = [];
      recs.forEach(function (r) { allVals.push(r.sys); allVals.push(r.dia); });
      yMin = Math.min.apply(null, allVals.concat([yMin])) - 5;
      yMax = Math.max.apply(null, allVals.concat([yMax])) + 5;
      var ys = function (v) { return padT + (h - padT - padB) * (1 - (v - yMin) / (yMax - yMin)); };
      var xs = function (i) { return padL + (w - padL - padR) * (recs.length === 1 ? 0.5 : i / (recs.length - 1)); };
      var sysPath = '', diaPath = '';
      recs.forEach(function (r, i) {
        var x = xs(i), sy = ys(r.sys), dy = ys(r.dia);
        sysPath += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + sy.toFixed(1) + ' ';
        diaPath += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + dy.toFixed(1) + ' ';
        pts.push({ x: x, y: sy, color: levelColor(classify('bp', r.sys, r.dia).level) });
        pts.push({ x: x, y: dy, color: '#0d9488' });
      });
      wrap.innerHTML =
        '<div class="health-trend-label" style="font-size:12px;color:#888;margin-bottom:4px">' + L('healthTrendLabel', '趋势（最近 X 次，红色=收缩压，青色=舒张压）').replace('X', recs.length) + '</div>' +
        '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:auto;background:#fafafa;border-radius:8px">' +
        '<line x1="' + padL + '" y1="' + padT + '" x2="' + padL + '" y2="' + (h - padB) + '" stroke="#e5e7eb"/>' +
        '<line x1="' + padL + '" y1="' + (h - padB) + '" x2="' + (w - padR) + '" y2="' + (h - padB) + '" stroke="#e5e7eb"/>' +
        '<line x1="' + padL + '" y1="' + ys(140) + '" x2="' + (w - padR) + '" y2="' + ys(140) + '" stroke="#FA5151" stroke-dasharray="2,2" opacity="0.4"/>' +
        '<text x="' + (padL - 4) + '" y="' + (ys(140) + 3) + '" text-anchor="end" font-size="9" fill="#FA5151">140</text>' +
        '<path d="' + sysPath + '" fill="none" stroke="#FA5151" stroke-width="1.5"/>' +
        '<path d="' + diaPath + '" fill="none" stroke="#0d9488" stroke-width="1.5"/>' +
        pts.map(function (p) { return '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="2.5" fill="' + p.color + '"/>'; }).join('') +
        '</svg>';
    } else {
      var gyMin = 3, gyMax = 12;
      var gVals = recs.map(function (r) { return r.value; });
      gyMin = Math.min.apply(null, gVals.concat([gyMin])) - 0.5;
      gyMax = Math.max.apply(null, gVals.concat([gyMax])) + 0.5;
      var ysf = function (v) { return padT + (h - padT - padB) * (1 - (v - gyMin) / (gyMax - gyMin)); };
      var xsf = function (i) { return padL + (w - padL - padR) * (recs.length === 1 ? 0.5 : i / (recs.length - 1)); };
      var path = '';
      recs.forEach(function (r, i) {
        var x = xsf(i), y = ysf(r.value);
        path += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1) + ' ';
        pts.push({ x: x, y: y, color: levelColor(classify('glu', 0, 0, r.value).level) });
      });
      wrap.innerHTML =
        '<div class="health-trend-label" style="font-size:12px;color:#888;margin-bottom:4px">' + L('healthTrendLabel', '趋势（最近 X 次）').replace('X', recs.length) + '</div>' +
        '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:auto;background:#fafafa;border-radius:8px">' +
        '<line x1="' + padL + '" y1="' + padT + '" x2="' + padL + '" y2="' + (h - padB) + '" stroke="#e5e7eb"/>' +
        '<line x1="' + padL + '" y1="' + (h - padB) + '" x2="' + (w - padR) + '" y2="' + (h - padB) + '" stroke="#e5e7eb"/>' +
        '<line x1="' + padL + '" y1="' + ysf(7) + '" x2="' + (w - padR) + '" y2="' + ysf(7) + '" stroke="#FF9F0A" stroke-dasharray="2,2" opacity="0.4"/>' +
        '<text x="' + (padL - 4) + '" y="' + (ysf(7) + 3) + '" text-anchor="end" font-size="9" fill="#FF9F0A">7</text>' +
        '<line x1="' + padL + '" y1="' + ysf(3.9) + '" x2="' + (w - padR) + '" y2="' + ysf(3.9) + '" stroke="#FF9F0A" stroke-dasharray="2,2" opacity="0.4"/>' +
        '<text x="' + (padL - 4) + '" y="' + (ysf(3.9) + 3) + '" text-anchor="end" font-size="9" fill="#FF9F0A">3.9</text>' +
        '<path d="' + path + '" fill="none" stroke="#07C160" stroke-width="1.5"/>' +
        pts.map(function (p) { return '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="2.8" fill="' + p.color + '"/>'; }).join('') +
        '</svg>';
    }
  }

  function renderList() {
    var wrap = document.getElementById('healthList');
    if (!wrap) return;
    var recs = filteredRecords();
    if (recs.length === 0) {
      wrap.innerHTML = '<div style="text-align:center;padding:18px;color:#999;font-size:13px">' + L('healthEmpty', '还没有记录，点击上方表单添加第一条吧') + '</div>';
      return;
    }
    var html = '<div class="health-recent-label" style="font-size:12px;color:#888;margin-bottom:6px">' + L('healthRecentLabel', '最近记录') + '</div>';
    recs.forEach(function (r) {
      var dt = new Date(r.date);
      var dateStr = (dt.getMonth() + 1) + '/' + dt.getDate() + ' ' + dt.getHours().toString().padStart(2, '0') + ':' + dt.getMinutes().toString().padStart(2, '0');
      var main, badge, member = '';
      try {
        var ms = JSON.parse(localStorage.getItem('cy_members') || '[]');
        var m = ms.find(function (x) { return x.id === r.memberId; });
        if (m) member = '<span style="background:#f0fdf4;color:#15803d;padding:2px 6px;border-radius:4px;font-size:11px;margin-left:4px">' + escHtml(m.name) + '</span>';
      } catch (e) {}
      if (r.type === 'bp') {
        var cls = classify('bp', r.sys, r.dia);
