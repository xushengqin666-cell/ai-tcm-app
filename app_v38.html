<script>
// ===== 不良反应自查 (ADR) 模块 v1.0 =====
(function () {
  var CY = window.CY || (window.CY = {});
  function L(k, d) { return (window.T && T[currentLang] && T[currentLang][k]) || d; }

  function tokenize(text) {
    return (text || '').split(/[\s,，、;；]+/).map(function (x) { return x.trim(); }).filter(function (x) { return x.length > 0; });
  }

  function drugKeys() {
    try { return Object.keys(window.DRUG_GUIDE || {}); } catch (e) { return []; }
  }

  function matchDrugNames(input) {
    var names = tokenize(input);
    var all = drugKeys();
    var hits = [];
    names.forEach(function (n) {
      // 精确或包含匹配
      var exact = all.find(function (k) { return k === n; });
      if (exact) { if (hits.indexOf(exact) < 0) hits.push(exact); return; }
      var inc = all.find(function (k) { return k.indexOf(n) >= 0 || n.indexOf(k) >= 0; });
      if (inc) { if (hits.indexOf(inc) < 0) hits.push(inc); }
    });
    return hits;
  }

  function splitSymptomsInText(adverseText, symptoms) {
    var found = [];
    symptoms.forEach(function (sym) {
      if (sym.length >= 2 && adverseText.indexOf(sym) >= 0) found.push(sym);
    });
    return found;
  }

  function check() {
    var drugInput = document.getElementById('adrDrugs');
    var symInput = document.getElementById('adrSymptom');
    var result = document.getElementById('adrResult');

    var drugs = matchDrugNames(drugInput.value);
    var symptoms = tokenize(symInput.value);

        // 取命中症状附近片段
        var snippet = '';
        try {
          var pos = adv.indexOf(hits[0]);
          snippet = adv.slice(Math.max(0, pos - 0), pos + 60);

        rows.push({ drug: drug, hits: hits, adv: adv, snippet: snippet });

        '<button class="btn-secondary" style="margin-top:8px;font-size:12px;padding:6px 12px" onclick="openManualForDrug(\'' + escAttr(r.drug) + '\')">' + L('adrViewFull', '查看完整说明书') + '</button>' +

      '<p class="adr-hint" style="font-size:12px;color:#888;margin:6px 0 10px">' + L('adrHint', '输入正在服用的药物与出现的不适，智能比对药品说明书不良反应。仅供参考，不替代医生诊断。') + '</p>' +
      '<label style="font-size:13px;font-weight:500;display:block;margin-bottom:4px">' + L('adrDrugsLabel', '正在服用的药物（逗号分隔）') + '</label>' +
      '<input id="adrDrugs" type="text" placeholder="' + L('adrDrugsPh', '如：布洛芬, 阿莫西林, 阿托伐他汀') + '" style="width:100%;padding:9px 12px;border:1.5px solid var(--c-border,#e5e7eb);border-radius:8px;font-size:14px;outline:none;box-sizing:border-box;margin-bottom:10px">' +

    var card = document.getElementById('manualCard');

    var close = document.getElementById('adrClose');
    if (close) close.onclick = function () { panel.style.display = 'none'; };
  }

  function openAdrPanel() {
    injectUI();
    var p = document.getElementById('adrPanel');
    if (p) p.style.display = 'block';
    setTimeout(function () { var r = document.getElementById('adrPanel'); if (r) r.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 60);

<script>
// ===== 慢病测量提醒 (health reminder) v1.0 =====
(function () {
  function L(k, d) { return (window.T && T[currentLang] && T[currentLang][k]) || d; }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  function loadReminders() { try { return JSON.parse(localStorage.getItem('cy_health_reminders') || '[]') || []; } catch (e) { return []; } }
  function saveReminders(a) { localStorage.setItem('cy_health_reminders', JSON.stringify(a)); }
  function loadFired() { try { return JSON.parse(localStorage.getItem('cy_health_remind_fired') || '{}') || {}; } catch (e) { return {}; } }
  function saveFired(o) { localStorage.setItem('cy_health_remind_fired', JSON.stringify(o)); }
  function getMembers() {
    try {
      var m = JSON.parse(localStorage.getItem('cy_members') || '[]');
      if (Array.isArray(m)) return m.length ? m : [{ id: 'self', name: '我' }];
      if (m && Array.isArray(m.members)) return m.members.length ? m.members : [{ id: 'self', name: '我' }];
    } catch (e) {}
    return [{ id: 'self', name: '我' }];
  }
  function memberName(id) { var m = getMembers().find(function (x) { return (x.id || x.name) === id; }); return m ? (m.name || m.id) : id; }
  function hasType(arr, t) { return arr.some(function (x) { return x.type === t; }); }
  function todayStr() { var d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  function nowHHMM() { var d = new Date(); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }

  function renderRemindUI(panel) {
    if (!panel) return;
    var old = panel.querySelector('#healthRemindWrap');
    if (old) old.remove();
    var wrap = document.createElement('div');
    wrap.id = 'healthRemindWrap';
    wrap.style.cssText = 'margin-top:14px;padding:12px;border:1px dashed #bbf7d0;border-radius:10px;background:#f0fdf4';
    var r = loadReminders();
    var members = getMembers();
    var html = '<div style="font-weight:600;font-size:14px;margin-bottom:8px">⏰ ' + L('healthRemindTitle', '测量提醒') + '</div>';
    html += '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px">';
    html += '<input id="hrTime" type="time" value="' + (r[0] ? r[0].time : '08:00') + '" style="padding:6px 8px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:13px">';
    html += '<label style="font-size:13px"><input id="hrBp" type="checkbox" ' + (hasType(r, 'bp') ? 'checked' : '') + '> 血压</label>';
    html += '<label style="font-size:13px"><input id="hrGlu" type="checkbox" ' + (hasType(r, 'glucose') ? 'checked' : '') + '> 血糖</label>';
    html += '<select id="hrMember" style="padding:6px 8px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:13px">';
    members.forEach(function (m) { html += '<option value="' + esc(m.id || m.name) + '">' + esc(m.name || m.id) + '</option>'; });
    html += '</select></div>';
    html += '<button id="hrSave" class="btn-primary" style="font-size:13px;padding:6px 14px" onclick="healthRemindSave()">' + L('healthRemindSave', '保存提醒') + '</button> ';
    html += '<button id="hrPerm" class="btn-secondary" style="font-size:13px;padding:6px 14px" onclick="healthRequestPerm()">' + L('healthRemindPerm', '开启通知') + '</button>';
    if (r.length) {
      html += '<div style="margin-top:10px">';
      r.forEach(function (x) {
        var who = (x.member && x.member !== 'self') ? (' · ' + esc(memberName(x.member))) : '';
        html += '<div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:6px 0;border-top:1px solid #e5e7eb"><span>' + x.time + ' · ' + (x.type === 'bp' ? '血压' : '血糖') + who + '</span><button onclick="healthRemindDel(\'' + x.id + '\')" style="border:none;background:#fff0f0;color:#FA5151;padding:3px 8px;border-radius:6px;font-size:12px;cursor:pointer">删除</button></div>';
      });
      html += '</div>';
    }
    wrap.innerHTML = html;
    panel.appendChild(wrap);
  }

  window.healthRemindSave = function () {
    var panel = document.getElementById('healthPanel');
    var timeEl = document.getElementById('hrTime');
    var time = (timeEl && timeEl.value) || '08:00';
    var memberEl = document.getElementById('hrMember');
    var member = (memberEl && memberEl.value) || 'self';
    var types = [];
    if (document.getElementById('hrBp') && document.getElementById('hrBp').checked) types.push('bp');
    if (document.getElementById('hrGlu') && document.getElementById('hrGlu').checked) types.push('glucose');
    if (!types.length) { if (window.showToast) window.showToast('请选择血压或血糖', 1800); return; }
    var arr = loadReminders().filter(function (x) { return !(x.time === time && x.member === member && types.indexOf(x.type) >= 0); });
    types.forEach(function (t) { arr.push({ id: 'hr_' + Date.now() + '_' + t, time: time, type: t, member: member }); });
    saveReminders(arr);
    renderRemindUI(panel);
    if (window.notify && window.notify.requestPermission) window.notify.requestPermission();
    if (window.showToast) window.showToast('已保存测量提醒', 1600);
  };
  window.healthRemindDel = function (id) {
    saveReminders(loadReminders().filter(function (x) { return x.id !== id; }));
    renderRemindUI(document.getElementById('healthPanel'));
  };
  window.healthRequestPerm = function () {
    if (window.notify && window.notify.requestPermission) window.notify.requestPermission();
  };

  function fire(x) {
    var label = (x.type === 'bp' ? '血压' : '血糖');
    var who = (x.member && x.member !== 'self') ? (memberName(x.member) + '的') : '';
    var body = '该测' + (who || '') + label + '了';
    if (window.notify && window.notify.send) window.notify.send('彩云智药 · 测量提醒', body);
    if (window.showToast) window.showToast('⏰ ' + body, 3000);
  }

  function check() {
    var r = loadReminders();
    if (!r.length) return;
    var today = todayStr();
    var fired = loadFired();
    if (fired.date !== today) { fired = { date: today, ids: [] }; saveFired(fired); }
    var now = nowHHMM();
    r.forEach(function (x) {
      if (x.time === now && fired.ids.indexOf(x.id) < 0) {
        try { fire(x); } catch (e) {}
        fired.ids.push(x.id);
      }
    });
    saveFired(fired);
  }

  // 挂到 openHealthPanel
  var _ohp = window.openHealthPanel;
  window.openHealthPanel = function () {
    if (_ohp) try { _ohp(); } catch (e) {}
    setTimeout(function () { renderRemindUI(document.getElementById('healthPanel')); }, 80);
  };

  setInterval(check, 60000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
  if (typeof window !== 'undefined') window.addEventListener('load', function () { setTimeout(check, 1500); });
})();
<\/script>








<script>
// ===== IndexedDB 存储层 (idb-store) v1.1 =====
(function () {
  var DB_NAME = 'cy_store';
  var DB_VER = 1;
  var STORE = 'kvs';
  var db = null;

  function openDB() {
    if (db) return Promise.resolve(db);
    return new Promise(function (resolve, reject) {
      var req = indexedDB.open(DB_NAME, DB_VER);
      req.onupgradeneeded = function (e) {
        var d = e.target.result;
        if (!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE);
      };
      req.onsuccess = function (e) { db = e.target.result; resolve(db); };
      req.onerror = function () { reject(req.error); };
    });
  }

  function idbGet(key) {
    return openDB().then(function (d) {
      return new Promise(function (resolve, reject) {
        var tx = d.transaction(STORE, 'readonly');
        var s2 = tx.objectStore(STORE);
        var r = s2.get(key);
        r.onsuccess = function () { resolve(r.result || null); };
        r.onerror = function () { reject(r.error); };
      });
    });
  }

  function idbSet(key, val) {
    return openDB().then(function (d) {
      return new Promise(function (resolve, reject) {
        var tx = d.transaction(STORE, 'readwrite');
        var s2 = tx.objectStore(STORE);
        var r = s2.put(val, key);
        r.onsuccess = function () { resolve(r.result); };
        r.onerror = function () { reject(r.error); };
      });
    });
  }

  function lsGet(key) {
    try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { return null; }
  }
  function lsSet(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); return true; } catch (e) { return false; }
  }
  function lsDel(key) { try { localStorage.removeItem(key); } catch (e) {} }

  // 公开 API：兼容 localStorage 接口的异步 getItem/setItem/removeItem
  window.CYStore = {
    getItem: function (key) {
      return idbGet(key).catch(function () { return null; }).then(function (v) {
        if (v !== null) return v;
        return lsGet(key);
      });
    },
    setItem: function (key, val) {
      lsSet(key, val);
      idbSet(key, val).catch(function () {});
      return true;
    },
    removeItem: function (key) {
      lsDel(key);
      openDB().then(function (d) {

(function () {
  var DB_NAME = 'cy_store';
  var DB_VER = 1;
  var STORE = 'kvs';
  var db = null;

  function openDB() {
    if (db) return Promise.resolve(db);
    return new Promise(function (resolve, reject) {
      var req = indexedDB.open(DB_NAME, DB_VER);
      req.onupgradeneeded = function (e) {
        var d = e.target.result;
        if (!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE);
      };
      req.onsuccess = function (e) { db = e.target.result; resolve(db); };
      req.onerror = function () { reject(req.error); };
    });
  }

  function idbGet(key) {
    return openDB().then(function (d) {
      return new Promise(function (resolve, reject) {
        var tx = d.transaction(STORE, 'readonly');
        var s2 = tx.objectStore(STORE);
        var r = s2.get(key);
        r.onsuccess = function () { resolve(r.result || null); };
        r.onerror = function () { reject(r.error); };
      });
    });
  }

  function idbSet(key, val) {
    return openDB().then(function (d) {
      return new Promise(function (resolve, reject) {
        var tx = d.transaction(STORE, 'readwrite');
        var s2 = tx.objectStore(STORE);
        var r = s2.put(val, key);
        r.onsuccess = function () { resolve(r.result); };
        r.onerror = function () { reject(r.error); };
      });
    });
  }

  function lsGet(key) {
    try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { return null; }
  }
  function lsSet(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); return true; } catch (e) { return false; }
  }

      lsSet(key, val);
      idbSet(key, val).catch(function () {});
      return true;
    },
    removeItem: function (key) {
      lsDel(key);
      openDB().then(function (d) {
        try { var tx = d.transaction(STORE, 'readwrite'); tx.objectStore(STORE)['delete'](key); } catch (e) {}

      return true;

      return idbSet(key, val);

      var promises = [];
      LS_KEYS_TO_MIGRATE.forEach(function (key) {

            migrated.push(key);
            if (onProgress) onProgress(key, migrated.length, LS_KEYS_TO_MIGRATE.length);
          }).catch(function () {})
        );
      });
      return Promise.all(promises).then(function () {
        lsSet('cy_idb_migrated', migrated);
        return { migrated: migrated.length, total: LS_KEYS_TO_MIGRATE.length };
      });

// Category shelf life defaults (days) for drugs without DRUG_GUIDE entry
var SHELF_LIFE = {
  '解热镇痛': 730, '抗生素': 730, '消化系统': 730,
  '降压': 730, '降糖': 730, '调脂': 730,
  '维生素': 1095, '矿物质': 1095, '中成药': 730,
  '平喘': 730, '抗过敏': 730, '眼科': 365,
  'default': 730
};

function getShelfLife(name) {
  // Try DRUG_GUIDE first
  var entry = (typeof DRUG_GUIDE !== 'undefined' && DRUG_GUIDE[name]) ? DRUG_GUIDE[name] : null;
  if (entry && entry.storage) {
    var s = entry.storage;
    var m = s.match(/(\d+)个月/); if (m) return parseInt(m[1]) * 30;
    m = s.match(/(\d+)年/); if (m) return parseInt(m[1]) * 365;
    m = s.match(/(\d+)天/); if (m) return parseInt(m[1]);
    if (s.indexOf('常温') >= 0 || s.indexOf('室温') >= 0) return 730;
  }
  // Guess from name
  var lower = name.toLowerCase();
  if (lower.indexOf('滴眼') >= 0 || lower.indexOf('眼药水') >= 0) return 30;
  if (lower.indexOf('维生素') >= 0 || lower.indexOf('钙片') >= 0) return 1095;
  if (lower.indexOf('口服液') >= 0 || lower.indexOf('糖浆') >= 0) return 180;
  if (lower.indexOf('冲剂') >= 0 || lower.indexOf('颗粒') >= 0) return 365;
  return 730;
}

function getCategory(name) {
  if (typeof DRUG_GUIDE !== 'undefined' && DRUG_GUIDE[name] && DRUG_GUIDE[name].category) {
    return DRUG_GUIDE[name].category;
  }
  return '其他';
}

function getCategoryColor(cat) {
  var colors = {
    '解热镇痛抗炎': '#ff6b6b', '抗生素': '#4dabf7',
    '消化系统': '#69db7c', '降压药': '#ffd43b',

    '外用': '#868e96', '其他': '#868e96'
  };
  var c = cat.split('/')[0];

}

function getExpiryInfo(expiry, name) {
  if (!expiry) return null;
  var expDate = new Date(expiry);
  if (isNaN(expDate.getTime())) return null;
  var now = new Date();
  var daysLeft = Math.floor((expDate - now) / 86400000);
  if (daysLeft < 0) return { status: 'expired', days: daysLeft, text: '已过期' + Math.abs(daysLeft) + '天' };
  if (daysLeft <= 30) return { status: 'danger', days: daysLeft, text: '剩余' + daysLeft + '天' };
  if (daysLeft <= 90) return { status: 'warning', days: daysLeft, text: '剩余' + daysLeft + '天' };
  return { status: 'ok', days: daysLeft, text: '剩余' + daysLeft + '天' };
}

      if (nameEl) nameEl.style.display = 'inline';

        nameEl.parentNode.insertBefore(catBadge, nameEl.nextSibling);

    catBadge.textContent = cat.split('/')[0];
  });
}

function applyCabFilter(cat) {
  var list = document.getElementById('cabinetList');

  var items = list.querySelectorAll ? list.querySelectorAll('.cabinet-item') : list.children;
  items.forEach(function(item) {

    item.style.display = show ? '' : 'none';

  // Update stat
  var visible = list.querySelectorAll ? Array.from(list.querySelectorAll('.cabinet-item')).filter(function(i){return i.style.display !== 'none'}) : [];
  var statEl = document.getElementById('cabStatTotal');

// Override switchTab to enhance cabinet when tab opens
var _origSwitchTab = window.switchTab;
window.switchTab = function(tab) {

function injectFilterUI() {

<script>
// === [v2.7.9] 药箱：过期高亮+过期药品Tab排序+交互检测 ===
(function(){
var _origSwitchTab = window.switchTab;
window.switchTab = function(tab) {
  var r = (_origSwitchTab ? _origSwitchTab.apply(this, arguments) : undefined);
  if (tab === 'cabinet') {
    var _enhance = function() {
      var list = document.getElementById('cabinetList');
      if (!list) return;
      // Inject expiry warning banner
      if (!document.getElementById('cabinetExpiryBanner')) {
        var cab = document.getElementById('tab-cabinet');
        if (!cab) return;
        var hdr = cab.querySelector('[id="cabStatTotal"]');
        if (hdr) {
          var banner = document.createElement('div');
          banner.id = 'cabinetExpiryBanner';
          banner.style.cssText = 'display:none;margin:0 16px 12px;padding:10px 14px;background:#fff2f0;border-radius:10px;border:1.5px solid #ffccc7;';
          hdr.parentNode.insertBefore(banner, hdr.nextSibling);
        }
      }
      // Color code & sort cabinet items
      var items = list.querySelectorAll ? list.querySelectorAll('[style*="border-radius:16px"][style*="padding:14px"]') : [];
      var expiredItems = [], warningItems = [], okItems = [];
      items.forEach(function(item) {
        var nameEl = item.querySelector('[style*="font-weight:600"]') || item.querySelector('div > div');
        if (!nameEl) { okItems.push(item); return; }
        var text = item.textContent || '';
        // Find expiry text
        var expMatch = text.match(/(?:有效期至|过期|剩余|Expiry)[:s]*(d{4}[-/]d{2}[-/]d{2})/);
        if (!expMatch) { okItems.push(item); return; }
        var expDate = new Date(expMatch[1]);
        if (isNaN(expDate.getTime())) { okItems.push(item); return; }
        var daysLeft = Math.floor((expDate - new Date()) / 86400000);
        if (daysLeft < 0) {
          expiredItems.push({ el: item, days: daysLeft });
          item.style.borderLeft = '4px solid #ff4d4f';
          item.style.background = '#fff2f0';
        } else if (daysLeft <= 30) {
          warningItems.push({ el: item, days: daysLeft });
          item.style.borderLeft = '4px solid #faad14';
          item.style.background = '#fffbe6';
        } else if (daysLeft <= 90) {
          item.style.borderLeft = '4px solid #52c41a';
          item.style.background = '';
        } else {
          item.style.borderLeft = '';
          item.style.background = '';
        }
      });
      // Update expiry banner
      var banner = document.getElementById('cabinetExpiryBanner');
      if (banner) {
        if (expiredItems.length > 0) {
          banner.style.display = '';
          banner.innerHTML = '<div style="display:flex;align-items:center;gap:8px;"><span style="font-size:18px;">⚠️</span><div><div style="font-weight:600;color:#cf1322;font-size:13px;">' + expiredItems.length + ' 个药品已过期</div><div style="font-size:11px;color:#8c8c8c;margin-top:2px;">请尽快清理，避免误服</div></div></div>';
        } else {
          banner.style.display = 'none';
        }
      }
      // Sort: expired first, then warning, then ok
      if (items.length > 0) {
        var sorted = [].concat(expiredItems).concat(warningItems).concat(okItems);
        sorted.forEach(function(info) { list.appendChild(info.el); });
      }
    };
    setTimeout(_enhance, 100);
  }
  return r;
};

// Show interaction warning when adding drug to cabinet
var _origAddCab = window.addCabinetDrug;
if (_origAddCab) {
  window.addCabinetDrug = function() {
    var nameEl = document.getElementById('cabName');
    if (nameEl) {
      var name = nameEl.value.trim();
      if (name && typeof DRUG_GUIDE !== 'undefined' && DRUG_GUIDE[name]) {
        var entry = DRUG_GUIDE[name];
        var warns = [];
        if (entry.drugAvoid) warns.push('⚠️ ' + entry.drugAvoid);
        if (entry.contraindications && entry.contraindications.length > 5) warns.push('⚠️ ' + entry.contraindications.slice(0, 80));
        if (warns.length > 0 && !document.getElementById('cabDrugWarn')) {
          var warnDiv = document.createElement('div');
          warnDiv.id = 'cabDrugWarn';
          warnDiv.style.cssText = 'margin-top:8px;padding:8px 10px;background:#fffbe6;border-radius:8px;border:1px solid #ffe58f;font-size:12px;color:#ad6800;line-height:1.6;';
          warnDiv.textContent = warns.join(' | ');
          if (nameEl.parentNode) nameEl.parentNode.appendChild(warnDiv);
        }
      }
    }
    return _origAddCab.apply(this, arguments);
  };
}
})();
