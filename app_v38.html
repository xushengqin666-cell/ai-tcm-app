// ===== 本地账号系统 =====
const AUTH_VERSION = 'v1';

function getUsers() {
  try { return JSON.parse(localStorage.getItem('cy_users_v2') || '{}'); } catch { return {}; }
}
function saveUsers(users) {
  localStorage.setItem('cy_users_v2', JSON.stringify(users));
}
function hashPwd(pwd) {
  let hash = 0;
  for (let i = 0; i < pwd.length; i++) {
    hash = ((hash << 5) - hash) + pwd.charCodeAt(i) + 2024;
    hash = hash & hash;
  }
  return hash.toString(16);
}
function localRegister(phone, name, password) {
  const users = getUsers();
  if (users[phone]) return { error: '该手机号已注册' };
  users[phone] = {
    name: name, pwdHash: hashPwd(password), createdAt: Date.now(),
    data: { cabinet: [], members: [{id:'self',name:'我'}], reminders: [] }
  };
  saveUsers(users);
  return { success: true };
}
function localLogin(phone, password) {
  const users = getUsers();
  const user = users[phone];
  if (!user) return { error: '账号不存在' };
  if (user.pwdHash !== hashPwd(password)) return { error: '密码错误' };
  localStorage.setItem('cy_cabinet', JSON.stringify(user.data.cabinet || []));
  localStorage.setItem('cy_members', JSON.stringify(user.data.members || [{id:'self',name:'我'}]));
  localStorage.setItem('cy_reminders', JSON.stringify(user.data.reminders || []));
  localStorage.setItem('cy_current_user', phone);
  return { success: true, name: user.name };
}
function syncCurrentUserData() {
  const phone = localStorage.getItem('cy_current_user');
  if (!phone) return;
  const users = getUsers();
  if (!users[phone]) return;
  users[phone].data = {
    cabinet: JSON.parse(localStorage.getItem('cy_cabinet') || '[]'),
    members: JSON.parse(localStorage.getItem('cy_members') || '[{"id":"self","name":"我"}]'),
    reminders: JSON.parse(localStorage.getItem('cy_reminders') || '[]')
  };
  users[phone].updatedAt = Date.now();
  saveUsers(users);
}
function localLogout() {
  syncCurrentUserData();
  localStorage.removeItem('cy_current_user');
  localStorage.removeItem('cy_cabinet');
  localStorage.removeItem('cy_members');
  localStorage.removeItem('cy_reminders');
}
function getCurrentUser() {
  const phone = localStorage.getItem('cy_current_user');
  if (!phone) return null;
  const users = getUsers();
  return users[phone] ? { phone, name: users[phone].name } : null;
}
let saveTimer;
const origSetItem = localStorage.setItem;
localStorage.setItem = function(k, v) {
  origSetItem.call(this, k, v);
  if (k === 'cy_cabinet' || k === 'cy_members' || k === 'cy_reminders') {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(syncCurrentUserData, 1000);
  }
};
window.addEventListener('beforeunload', syncCurrentUserData);

// Groq API 前端直连
async function callGroqAPI(question) {
  // GROQ_KEY removed - use worker proxy
  const GROQ_MODEL = 'llama-3.1-8b-instant';
  
  const payload = JSON.stringify({
    model: GROQ_MODEL,
    messages: [{ role: 'user', content: question }],
    max_tokens: 500
  });
  
  const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + GROQ_KEY
    },
    body: payload
  });
  
  if (!response.ok) {
    throw new Error('API 调用失败: ' + response.status);
  }
  
  const json = await response.json();
  return json.choices[0].message.content;
}

(function(){
  var delay = 0;
  function anim(cls, ms) {
    var els = document.querySelectorAll(cls);
    els.forEach(function(el){
      el.style.setProperty('--delay', delay + 'ms');
      el.classList.add('animate-in');
      delay += ms;
    });
  }
  // header → tabbar → main content → cards

  line-height:1.5;
  padding-bottom:calc(var(--nav-h) + 24px + var(--safe-b));
  transition:background .3s,color .3s;
}
/* 头部毛玻璃 */
header{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;
  background:rgba(255,255,255,.72);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid rgba(0,0,0,.06);
  color:var(--c-text);
  padding:calc(10px + var(--safe-t)) 16px 10px;
}
header h1{font-size:19px;font-weight:700;letter-spacing:.2px}
header>div{display:flex;align-items:center;gap:10px}
.lang-switch{
  background:rgba(0,0,0,.04);
  border:1px solid rgba(0,0,0,.06);
  color:var(--c-text);border-radius:20px;padding:5px 12px;font-weight:600;
  transition:background .2s,transform .12s;
}
.lang-switch:active{transform:scale(.94);background:rgba(0,0,0,.08)}
.icon-btn{
  background:rgba(0,0,0,.04);border:1px solid rgba(0,0,0,.06);
  color:var(--c-text);border-radius:50%;width:34px;height:34px;
  display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;
  transition:background .2s,transform .12s;
}
.icon-btn:active{transform:scale(.9);background:rgba(0,0,0,.08)}
/* Tab栏毛玻璃 + 滑动指示器 */
.tab-bar{
  position:sticky;top:calc(52px + var(--safe-t));z-index:90;
  display:flex;background:rgba(255,255,255,.72);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid rgba(0,0,0,.06);
  padding:0 4px;
}
.tab-btn{
  color:var(--c-text-3);font-weight:500;font-size:14px;
  position:relative;border-bottom:none;padding:13px 4px;
  transition:color .25s;
}
.tab-btn.active{color:var(--c-primary);font-weight:700}
.tab-btn.active::after{
  content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:22px;height:3px;border-radius:2px;background:var(--c-primary);
  animation:tabInd .3s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes tabInd{from{width:0;opacity:0}to{width:22px;opacity:1}}
/* Tab内容切换过渡 */
.tab-content{animation:tabFade .28s ease both}
@keyframes tabFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
/* 卡片 */
.card{
  border-radius:var(--r-l);box-shadow:var(--sh-1);
  border:1px solid var(--c-border);padding:16px;
  transition:transform .15s,box-shadow .2s;
}
.card-title{font-size:16px;font-weight:700;color:var(--c-text);letter-spacing:.2px;margin-bottom:12px}
.card-title::before{content:'';display:inline-block;width:3px;height:14px;background:var(--c-primary);border-radius:2px;margin-right:8px;vertical-align:-2px}
/* 按钮 */
.btn-primary{
  background:var(--c-primary);border-radius:var(--r-m);box-shadow:var(--sh-primary);
  font-weight:600;transition:transform .12s,box-shadow .2s,background .2s;
}
.btn-primary:active{transform:scale(.95);background:var(--c-primary-d);box-shadow:0 1px 4px rgba(7,193,96,.22)}
.btn-primary:disabled{background:#A8DCC0;box-shadow:none}
.btn-secondary{
  border:1.5px solid var(--c-border);color:var(--c-text);
  border-radius:var(--r-m);background:#fff;font-weight:600;
  transition:transform .12s,background .2s,border-color .2s;
}
.btn-secondary:active{transform:scale(.96);background:var(--c-bg);border-color:#dcdcdc}
/* 输入框 iOS风 */
.search-box input,.union-drug-row input,input[type=text],input[type=search]{
  border:1.5px solid var(--c-border);border-radius:var(--r-m);
  background:#fff;font-size:15px;color:var(--c-text);
  transition:border-color .2s,box-shadow .2s;
}
.search-box input:focus,.union-drug-row input:focus,input:focus{
  border-color:var(--c-primary);box-shadow:0 0 0 3px rgba(7,193,96,.12);outline:none;
}
/* 底部导航毛玻璃 */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  height:calc(var(--nav-h) + var(--safe-b));
  display:flex;align-items:center;background:rgba(255,255,255,.82);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid rgba(0,0,0,.06);padding-bottom:var(--safe-b);z-index:100;
}
.bottom-nav a{
  flex:1;text-align:center;padding:8px 0;font-size:11px;font-weight:500;
  color:var(--c-text-3);text-decoration:none;transition:color .2s,transform .12s;
}
.bottom-nav a:active{transform:scale(.9)}
.bottom-nav a.active{color:var(--c-primary);font-weight:600}
.bottom-nav a span{display:block;margin-top:2px}
/* 关系网画布 */
#interactNet{border-radius:var(--r-l);box-shadow:var(--sh-1);border:1px solid var(--c-border);background:#fafbfc}
/* 联合用药按钮 */
.union-btn-add{background:var(--c-primary-l);color:var(--c-primary);border:1.5px dashed var(--c-primary);border-radius:var(--r-m);font-weight:600}
.union-btn-add:active{transform:scale(.97)}
.union-btn-check{background:var(--c-danger);border-radius:var(--r-m);box-shadow:0 2px 8px rgba(250,81,81,.25);font-weight:600}
.union-btn-check:active{transform:scale(.95);background:#E03C3C}
/* Toast */
.toast-wrap{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:rgba(0,0,0,.82);role:alert;aria-live:polite;color:#fff;padding:11px 20px;border-radius:24px;font-size:14px;font-weight:500;max-width:82vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:toastIn .3s cubic-bezier(.34,1.56,.64,1) both}
.toast.success{background:rgba(7,193,96,.92)}
.toast.error{background:rgba(250,81,81,.92)}
.loading-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(255,255,255,.88);display:flex;align-items:center;justify-content:center;z-index:99999}
.loading-overlay .spinner{width:36px;height:36px;border:3px solid rgba(7,193,96,.2);border-top-color:#07C160;border-radius:50%;animation:spin .8s linear infinite}
@keyframes success{0%{transform:scale(0);opacity:0}50%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@keyframes fail{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.success-check{color:#07C160;font-size:48px;animation:success .4s cubic-bezier(.34,1.56,.64,1)}
.toast.out{animation:toastOut .25s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(20px) scale(.92)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px) scale(.95)}}
/* 骨架屏 */
.skeleton{border-radius:var(--r-s);background:linear-gradient(90deg,#e8e8e8 25%,#f5f5f5 50%,#e8e8e8 75%);background-size:200% auto;animation:shimmer 1.8s linear infinite}
/* 空状态 */
@keyframes cyFade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.empty-state{text-align:center;padding:44px 24px;color:var(--c-text-3)}
.empty-state .es-icon{width:64px;height:64px;line-height:64px;margin:0 auto 14px;font-size:28px;background:#f2f7f3;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(7,193,96,.08)}
.empty-state .es-text{font-size:13.5px;line-height:1.7;color:#9aa0a6}
/* 滚动条隐藏 */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#c1c7cd;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#a8adb3}
/* 加载点 */
.loading-dots::after{content:'';animation:dots 1.2s steps(4,end) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}100%{content:''}}
/* ripple */
@keyframes ripple{to{transform:scale(2.4);opacity:0}}
/* 深色模式 */
.dark{--c-bg:#0F1115;--c-card:#1A1D24;--c-text:#ECECEC;--c-text-2:#9CA0A8;--c-text-3:#6B6F76;--c-border:#2A2E37;--c-primary-l:#0E2A1C;--sh-1:0 1px 2px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.3);--sh-2:0 4px 16px rgba(0,0,0,.4)}
.dark header,.dark .tab-bar{display:none}
.dark .bottom-nav{background:rgba(15,17,21,.92);border-top-color:rgba(255,255,255,.08);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.dark .card{background:var(--c-card);border-color:var(--c-border)}
.dark .search-box input,.dark input[type=text],.dark input[type=search]{background:#232730;color:var(--c-text);border-color:var(--c-border)}
.dark .btn-secondary{background:var(--c-card);color:var(--c-text)}
.dark #interactNet{background:#15181F}
.dark .chat-messages{background:#15181F}
.dark .skeleton{background:linear-gradient(90deg,#232730 25%,#2A2E37 50%,#232730 75%);background-size:200% auto}
</style>

<script>
// 修复：北京时间 / 说明书滚动（原先缺失定义导致加载期每秒抛错 + 说明书导航无反应）
/* ==== cy-global-catchup begin ==== */
window.cyRemindersCache = [];
try { window.cyRemindersCache = JSON.parse(localStorage.getItem("cy_reminders")||"[]"); } catch(e) {}
window.catchupMissedReminders = function(){
  try{
    var now = new Date();
    var hh = (""+now.getHours()).padStart(2,"0"), mm = (""+now.getMinutes()).padStart(2,"0");
    var cur = hh+":"+mm;
    var today = new Date().toISOString().slice(0,10);
    var fired = {};
    try{ fired = JSON.parse(localStorage.getItem("cy_reminder_fired")||"{}"); }catch(e){}
    var ls = [];
    try{ ls = JSON.parse(localStorage.getItem("cy_reminders")||"[]"); }catch(e){}
    window.cyRemindersCache = ls;
    if(!ls.length) return;
    var due = [];
    ls.forEach(function(r){
      if(!r || !r.enabled || !r.time) return;
      var key = r.id+"_"+today+"_"+r.time;
      if(r.time === cur){
        if(!fired[key]){
          fired[key] = 1;
          try{ localStorage.setItem("cy_reminder_fired", JSON.stringify(fired)); }catch(e){}
          var msg = "💊 该服药：" + (r.drug||"");
          if(r.memberId && r.memberId!=="self"){
            var mb=[];
            try{ mb=JSON.parse(localStorage.getItem("cy_members")||"[]"); }catch(e){}
            var m=mb.find(function(x){return x.id===r.memberId;});
            if(m) msg += "（"+m.name+"）";
          }
          if(window.showToast) window.showToast(msg, 4000);
        }
      } else if(r.time < cur && !fired[key]){
        due.push(r);
      }
    });
    if(due.length > 0){
      var list = document.getElementById("reminderList");
      if(list && !document.getElementById("__cy_catchup_box")){
        var box = document.createElement("div");
        box.id = "__cy_catchup_box";
        box.style.cssText = "background:#FFF3E0;border-left:4px solid #FF9F0A;padding:12px;margin-bottom:14px;border-radius:10px;color:#5d3500";
        var html = "<div style=\"font-weight:600;margin-bottom:8px;font-size:14px\">⏰ 今日已过提醒 ("+due.length+")</div>";
        due.forEach(function(r){
          html += "<div style=\"display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px;border-top:1px dashed #f0d8b0\"><span>"+(r.drug||"")+" @ "+r.time+"</span><button onclick=\"window.snoozeReminder('"+r.id+"')\" style=\"font-size:11px;padding:4px 10px;background:#fff;border:1px solid #c25a00;color:#c25a00;border-radius:12px;cursor:pointer\">已补服</button></div>";
        });
        box.innerHTML = html;
        list.insertAdjacentElement("afterbegin", box);
      }
    } else {
      var exist = document.getElementById("__cy_catchup_box");
      if(exist) exist.remove();
    }
  }catch(e){ try{ console.log("catchup", e); }catch(_){} }
};
window.snoozeReminder = function(rid){
  try{
    var today = new Date().toISOString().slice(0,10);
    var fired = {};
    try{ fired = JSON.parse(localStorage.getItem("cy_reminder_fired")||"{}"); }catch(e){}
    var ls = [];
    try{ ls = JSON.parse(localStorage.getItem("cy_reminders")||"[]"); }catch(e){}
    ls.forEach(function(r){ if(r.id === rid){ fired[r.id+"_"+today+"_"+r.time] = 1; } });
    try{ localStorage.setItem("cy_reminder_fired", JSON.stringify(fired)); }catch(e){}
    if(window.showToast) window.showToast("已标记为补服");
    var b = document.getElementById("__cy_catchup_box");
    if(b) b.remove();
  }catch(e){}
};
window.__cyDetectTz = function(){
  try{
    var tz = "Asia/Shanghai";
    try{ tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Shanghai"; }catch(e){}
    localStorage.setItem("cy_user_timezone", tz);
    if(window.showToast) window.showToast("时区已设为：" + tz, 2500);
    window.catchupMissedReminders();
  }catch(e){}
};
window.__cyUpdateTzLabel = function(){
  try{
    var lbl = document.getElementById("cySettingsTzLabel"); if(!lbl) return;
    var tz = localStorage.getItem("cy_user_timezone");
    if(!tz){ tz = "Asia/Shanghai"; }
    lbl.textContent = tz;
  }catch(e){}
};
document.addEventListener("visibilitychange", function(){ if(!document.hidden) window.catchupMissedReminders(); });
window.addEventListener("focus", window.catchupMissedReminders);
setTimeout(window.catchupMissedReminders, 2000);
setTimeout(window.__cyUpdateTzLabel, 1000);
setInterval(window.catchupMissedReminders, 60000);
/* ==== cy-global-catchup end ==== */
function getBeijingTime(){var now=new Date();return now;}
window.getBeijingTime=getBeijingTime;
function scrollToManual(){try{if(typeof switchTab==='function')switchTab('home');}catch(e){}var el=document.getElementById('drugManualCard')||document.getElementById('manualCard');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}
window.scrollToManual=scrollToManual;
function updateHero(){
  try{
    var lang = localStorage.getItem('lang') || 'zh';
    var greetEl = document.getElementById('heroGreet');
    if(!greetEl) return;
    var h = new Date().getHours();
    try{ var bt=getBeijingTime(); h=bt.getHours(); }catch(e){}
    var g = lang==='en'
      ? (h<5?'Good night':h<12?'Good morning':h<18?'Good afternoon':'Good evening')
      : (h<5?'夜深了':h<12?'早上好':h<18?'下午好':'晚上好');
    var name='';
    try{
      var sess=JSON.parse(localStorage.getItem('cy_session')||'{}');
      var users=JSON.parse(localStorage.getItem('cy_users')||'[]');
      for(var i=0;i<users.length;i++){ if(users[i].phone===sess.phone && users[i].name){ name=users[i].name; break; } }
    }catch(e){}
    greetEl.textContent = name ? (lang==='en' ? g+', '+name : name+'，'+g) : g;
  }catch(e){}
}
window.updateHero=updateHero;
if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', updateHero); } else { setTimeout(updateHero, 0); }
<\/script>

function openProfile(){

function loadProfile(){
  const session = JSON.parse(localStorage.getItem('cy_session') || '{}');
  const users = JSON.parse(localStorage.getItem('cy_users') || '[]');
  const user = users.find(u => u.phone === session.phone);
  const nickEl = document.getElementById('profileNicknameDisplay');
  const phoneEl = document.getElementById('profilePhoneDisplay');
  if(nickEl) nickEl.textContent = user?.nickname || session?.nickname || '未登录';
  if(phoneEl) phoneEl.textContent = user?.phone || session?.phone || '-';
}
function editProfile(){
  var session=JSON.parse(localStorage.getItem('cy_session')||'{}');
  var users=JSON.parse(localStorage.getItem('cy_users')||'[]');
  var user=users.find(function(u){return u.phone===session.phone;})||session;
  var ni=document.getElementById('editNickname');if(ni)ni.value=user?.nickname||'';
  var pi=document.getElementById('editPhone');if(pi)pi.value=user?.phone||session?.phone||'';
  var ai=document.getElementById('editAge');if(ai)ai.value=user?.age||'';
  var gi=document.getElementById('editGender');if(gi)gi.value=user?.gender||'';
  var m=document.getElementById('profileEditModal');if(m)m.style.display='flex';
}

    "阿哌沙班": {"indications":"用于预防和治疗深静脉血栓形成，预防心房颤动患者脑卒中，治疗急性冠状动脉综合征，预防静脉血栓栓塞事件，预防肺栓塞复发。","ingredients":"阿哌沙班，常见剂型规格为2.5mg、5mg片剂。","dosage":"成人常用剂量为每日1次，每次2.5-5mg，餐前或餐后服用，具体根据肾功能调整。","adverse":"常见不良反应包括出血、头痛、恶心；严重不良反应有颅内出血、胃肠道出血。","contraindications":"对阿哌沙班过敏者禁用；与强效CYP3A4抑制剂联用禁用；严重肝功能不全患者禁用。","storage":"密封，避光，干燥处保存，温度不超过25℃。","note":"监测出血风险"},

    "阿普唑仑": {"indications":"用于治疗焦虑症、广泛性焦虑障碍、惊恐发作、失眠（短期使用）、肌肉痉挛及癫痫持续状态。","ingredients":"主要成分为阿普唑仑，常见剂型规格为0.4mg/片、0.8mg/片、1mg/片。","dosage":"成人常用剂量为每日0.4-0.8mg，分2-3次服用，睡前可增至1mg，需遵医嘱。","adverse":"常见不良反应包括嗜睡、头晕、乏力、恶心、口干；严重不良反应有呼吸抑制、依赖性、戒断症状。","contraindications":"禁用于对本品过敏者、重症肌无力患者、严重呼吸功能不全者，避免与酒精或其他中枢抑制剂合用。","storage":"遮光、密封，在阴凉干燥处保存。","note":"避免长期使用"},
    "乙酰半胱氨酸": {"indications":"用于治疗慢性支气管炎、肺气肿、支气管扩张症等引起的黏稠痰液，也可用于对乙酰氨基酚中毒的解毒及肝功能异常患者的辅助治疗。","ingredients":"主要成分为乙酰半胱氨酸，常见剂型规格为500mg/片、100mg/ml注射液、200mg/5ml口服溶液。","dosage":"成人常用剂量为每次200-600mg，每日3次，饭前或饭后服用；静脉注射通常为100-200mg/次，每日1-2次。","adverse":"常见不良反应包括恶心、呕吐、腹泻、皮疹；严重不良反应有呼吸困难、过敏性休克、肝功能异常。","contraindications":"对乙酰半胱氨酸过敏者禁用；与青霉素类药物合用时需谨慎，避免影响药效。","storage":"遮光，密封，在阴凉干燥处保存，避免高温和潮湿。","note":"注意过敏反应，遵医嘱使用。"},
    "克拉霉素": {"indications":"用于治疗敏感菌引起的呼吸道感染（如支气管炎、肺炎）、皮肤软组织感染、中耳炎、鼻窦炎及泌尿系统感染。","ingredients":"主要成分为克拉霉素，常见剂型规格为250mg/片、500mg/片。","dosage":"成人常用剂量为每次250mg，每12小时一次，或500mg每日一次，餐前1小时或餐后2小时服用。","adverse":"常见不良反应包括恶心、腹泻、腹痛、头痛和皮疹；严重不良反应有肝功能异常、过敏性休克和心律失常。","contraindications":"对克拉霉素过敏者禁用；与某些抗心律失常药物（如特非那定）合用时禁用。","storage":"密封，在阴凉干燥处保存，避免阳光直射。","note":"避免与特非那定合用"},
    "利伐沙班": {"indications":"用于预防深静脉血栓形成（DVT）及肺栓塞（PE），治疗深静脉血栓形成（DVT）和肺栓塞（PE），降低心房颤动患者中风和全身性栓塞风险。","ingredients":"利伐沙班，常见剂型规格为10mg、15mg、20mg薄膜衣片。","dosage":"成人常用剂量为每日1次，每次10-20mg，餐前或餐后服用，具体根据适应症调整。","adverse":"常见不良反应：出血、头痛、恶心；严重不良反应：颅内出血、严重过敏反应。","contraindications":"对利伐沙班过敏者禁用；有活动性出血或重大出血风险者禁用；与强效CYP3A4抑制剂联用时禁用。","storage":"密封，避光，于25°C以下干燥处保存。","note":"监测出血风险"},
    "单硝酸异山梨酯": {"indications":"用于治疗冠心病、心绞痛、慢性心力衰竭、高血压性心脏病及心肌梗死后稳定型心绞痛。适用于需长期服用硝酸酯类药物的患者。","ingredients":"主要成分为单硝酸异山梨酯，常见剂型规格为20mg、40mg缓释片及5mg/1ml注射液。","dosage":"成人常用剂量为每次20-40mg，每日2-3次，空腹或餐后服用，具体根据病情调整。","adverse":"常见不良反应包括头痛、眩晕、恶心、面部潮红；严重不良反应有低血压、心动过速、过敏性休克。","contraindications":"对本品过敏者禁用；严重低血压、急性心肌梗死伴低血压患者禁用；与磷酸二酯酶抑制剂（如西地那非）合用禁用。","storage":"遮光，密封，在阴凉干燥处保存，避免受热受潮。","note":"避免突然停药"},
    "卡马西平": {"indications":"用于治疗癫痫大发作、部分性发作及三叉神经痛，也用于治疗躁狂抑郁症和酒精戒断综合征。","ingredients":"主要成分为卡马西平，常见剂型规格为100mg/片、200mg/片。","dosage":"成人常用剂量为每日200-600mg，分2-3次服用，饭后或与食物同服。","adverse":"常见不良反应包括头晕、嗜睡、恶心；严重不良反应有肝功能异常、血液系统异常。","contraindications":"对卡马西平过敏者禁用，与CYP3A4强效抑制剂合用时禁用。","storage":"遮光，密封，在阴凉干燥处保存。","note":"定期监测肝功能"},
    "厄贝沙坦": {"indications":"用于治疗高血压、糖尿病肾病、慢性肾功能不全、左心室肥厚及蛋白尿。适用于伴有高血压的2型糖尿病患者，以减少肾脏并发症风险。","ingredients":"主要成分为厄贝沙坦，常见剂型规格为150mg、300mg片剂。","dosage":"成人常用剂量为每日150mg，必要时可增至300mg，每日一次，餐前或餐后服用。","adverse":"常见不良反应包括头晕、咳嗽、乏力、腹泻和肌肉痛；严重不良反应包括血管性水肿、急性肾功能衰竭和高钾血症。","contraindications":"禁用于妊娠期妇女、双侧肾动脉狭窄患者及对本品过敏者。避免与含锂药物或阿利吉仑联用。","storage":"密封，避光，干燥处保存，温度不超过25℃。","note":"监测肾功能和血钾水平"},
    "双氯芬酸": {"indications":"用于治疗类风湿性关节炎、骨关节炎、强直性脊柱炎、痛风性关节炎及术后疼痛等疾病引起的炎症和疼痛。","ingredients":"双氯芬酸钠，常见剂型规格为50mg片剂、75mg片剂、100mg缓释片及50mg/100ml注射液。","dosage":"成人常用剂量为每次50-100mg，每日2-3次，饭后服用。","adverse":"常见不良反应包括胃肠道不适、恶心、头晕；严重不良反应有消化道出血、肝功能异常、肾功能损害。","contraindications":"��双氯芬酸过敏者禁用；消化道溃疡患者、严重肝肾功能不全者禁用；与抗凝药合用时需谨慎。","storage":"遮光、密封，在阴凉干燥处保存，避免高温和潮湿。","note":"定期监测肝肾功能"},
    "口服避孕药": {"indications":"用于避孕，治疗月经不调，缓解经前期综合征，减少月经痛，预防卵巢囊肿和子宫内膜癌。","ingredients":"主要成分为雌激素（如炔雌醇）和孕激素（如地诺孕素），常见剂型规格为21片/盒，每片含炔雌醇0.035mg和地诺孕素0.125mg。","dosage":"成人每日1片，于同一时间服用，连续21天后停药7天，或按医生指导调整周期。","adverse":"常见不良反应包括恶心、乳房胀痛、情绪波动、体重增加、月经不规律；严重不良反应有血栓形成、高血压、肝功能异常。","contraindications":"禁用于妊娠或疑似妊娠者、严重心血管疾病患者、未确诊的阴道出血、乳腺癌患者及对成分过敏者。与肝酶诱导剂如利福平合用时效果降低。","storage":"遮光，密封，在25℃以下干燥处保存。","note":"定期体检，注意血栓征兆"},
    "右美沙芬": {"indications":"用于治疗感冒引起的咳嗽、支气管炎、肺炎等呼吸道感染导致的干咳，以及慢性阻塞性肺疾病（COPD）急性发作期的咳嗽症状。","ingredients":"右美沙芬，常见剂型规格为15mg/10ml口服溶液、10mg/片片剂、12mg/5ml糖浆剂。","dosage":"成人每次15-30mg，每日3次，饭后服用，连续使用不超过7天。","adverse":"常见不良反应包括恶心、嗜睡、头晕；严重不良反应有呼吸抑制、过敏性休克、肝功能异常。","contraindications":"对右美沙芬过敏者禁用；与单胺氧化酶抑制剂（MAOIs）合用禁用；妊娠期及哺乳期妇女慎用。","storage":"遮光，密封，在阴凉干燥处保存，避免儿童接触。","note":"避免长期使用"},
    "吲达帕胺": {"indications":"用于治疗高血压、心力衰竭、水肿、肾性高血压及伴有水肿的原发性高血压。适用于需要利尿降压的患者。","ingredients":"吲达帕胺，常见剂型为片剂，规格为2.5mg/片。","dosage":"成人常用剂量为每日1次，每次2.5mg，早晨服用，可单独使用或与其他降压药联用。","adverse":"常见不良反应包括低钾血症、头晕、乏力、胃肠道不适；严重不良反应有电解质紊乱、过敏反应、肝功能异常。","contraindications":"对吲达帕胺过敏者禁用；严重肾功能不全、低钾血症患者禁用；与锂盐合用时禁用。","storage":"密封，遮光，阴凉干燥处保存，避免受潮。","note":"监测电解质，避免与锂盐合用。"},
    "呋塞米": {"indications":"用于治疗高血压、心力衰竭、肝硬化腹水、肾性水肿及急性肺水肿等疾病。适用于水肿性疾病，如充血性心力衰竭、肝硬化腹水、肾病综合征等。","ingredients":"主要成分为呋塞米，常见剂型规格为20mg/片、50mg/片、100mg/片及20mg/5ml注射液。","dosage":"成人常用剂量为每日40-80mg，分1-2次服用，餐后或空腹均可，具体需根据病情调整。","adverse":"常见不良反应包括多尿、低钾血症、恶心、头晕；严重不良反应有电解质紊乱、听力损害、过敏性休克。","contraindications":"禁用于对呋塞米过敏者、无尿患者、严重脱水者及与氨基糖苷类抗生素合用时。","storage":"遮光、密封，在阴凉干燥处保存，避免受潮。","note":"监测电解质，避免长期使用"},
    "喹硫平": {"indications":"用于治疗精神分裂症、双相情感障碍的躁狂发作、抑郁症的辅助治疗、焦虑症及失眠症。适用于成人患者。","ingredients":"喹硫平，常见剂型规格为50mg、100mg、200mg、300mg片剂。","dosage":"成人起始剂量50-100mg/日，分2次服用；最大剂量不超过400mg/日，建议睡前服用。","adverse":"常见不良反应包括嗜睡、头晕、口干、便秘、体重增加；严重不良反应有心律失常、癫痫发作、过敏反应。","contraindications":"对喹硫平过敏者禁用；与CYP3A4强效抑制剂合用时禁用；妊娠期和哺乳期妇女慎用。","storage":"密封，在阴凉干燥处保存，避免受潮。","note":"监测肝功能和血象"},
    "坎地沙坦": {"indications":"用于治疗原发性高血压、左心室功能不全、冠心病、慢性肾功能不全及糖尿病肾病。","ingredients":"坎地沙坦酯，常见剂型规格为40mg/片、80mg/片。","dosage":"成人常用剂量为每日一次，每次40-80mg，空腹或餐后服用。","adverse":"常见不良反应包括头晕、乏力、咳嗽、腹泻；严重不良反应有高钾血症、肾功能恶化、血管性水肿。","contraindications":"禁用于妊娠期妇女、双侧肾动脉狭窄患者、对本品过敏者，禁与阿利吉仑合用。","storage":"遮光，密封，在25℃以下干燥处保存。","note":"监测血压和肾功能。"},
    "塞来昔布": {"indications":"用于缓解骨关节炎、类风湿性关节炎、强直性脊柱炎及急性痛风性关节炎的症状和体征。","ingredients":"主要成分为塞来昔布，常见剂型规格为200mg/片、400mg/片。","dosage":"成人常用剂量为200mg每日一次或分两次服用，餐时或空腹均可服用。","adverse":"常见不良反应包括胃肠道不适、头痛、��肿、头晕和��疹；严重不良反应包括心血管事件、肝功能异常和过敏反应。","contraindications":"对塞来昔布过敏者禁用；与抗凝药物如华法林合用时需谨慎，避免出血风险。","storage":"密封，避光，于阴凉干燥处保存，温度不超过25℃。","note":"定期监测肝肾功能"},
    "多潘立酮": {"indications":"用于治疗胃食管反流病、功能性消化不良、胃排空延迟、慢性胃炎及幽门螺杆菌感染引起的消化不良症状。","ingredients":"多潘立酮，常见剂型为片剂（10mg/片）和口服液（5mg/ml）。","dosage":"成人常用剂量为每次10mg，每日3次，餐前30分钟服用。","adverse":"常见不良反应包括腹泻、腹痛、口干；严重不良反应有心律失常、锥体外系反应、肝功能异常。","contraindications":"对本品过敏者禁用；与某些抗心律失常药（如胺碘酮）合用时禁用；妊娠期妇女慎用。","storage":"密封，避光，于阴凉干燥处保存。","note":"避免与抗胆碱药同用"},
    "头孢": {"indications":"用于治疗呼吸道感染（如肺炎、支气管炎）、泌尿系统感染（如膀胱炎、肾盂肾炎）、皮肤软组织感染（如蜂窝织炎、脓肿）及耳鼻喉科感染（如中耳炎、扁桃体炎）。","ingredients":"主要成分为头孢类抗生素，常见剂型包括片剂（0.125g、0.25g、0.5g）、胶囊（0.125g、0.25g）和注射剂（1g/瓶）。","dosage":"成人常用剂量为每次0.25-0.5g，每日3次，餐后服用。","adverse":"常见不良反应包括恶心、呕吐、腹泻、皮疹；严重不良反应有过敏性休克、肝功能异常、肾功能损害。","contraindications":"对头孢类药物过敏者禁用；与氨基糖苷类抗生素合用时需谨慎，可能增加肾毒性风险。","storage":"遮光，密封，在阴凉干燥处保存。","note":"过敏者禁用，避免与酒精同服。"},
    "头孢克肟": {"indications":"用于治疗敏感菌引起的呼吸道感染、泌尿系统感染、皮肤软组织感染及中耳炎等疾病。","ingredients":"主要成分为头孢克肟，常见剂型规格为100mg/片、200mg/片、400mg/片。","dosage":"成人常用剂量为每次100-200mg，每日2次，餐后服用。","adverse":"常见不良反应包括腹泻、恶心、皮疹；严重不良反应有肝功能异常、过敏性休克。","contraindications":"对头孢类抗生素过敏者禁用；与某些药物如抗酸药、铁剂同服时需避免相互作用。","storage":"遮光，密封，在阴凉干燥处保存。","note":"避免与酒精同服"},
    "奥氮平": {"indications":"用于治疗精神分裂症、双相情感障碍的躁狂发作、重度抑郁症的辅助治疗、焦虑障碍及老年痴呆相关精神病性症状。","ingredients":"主要成分为奥氮平，常见剂型规格为2.5mg、5mg、10mg片剂及5mg/ml注射液。","dosage":"成人常用剂量为每日5-15mg，分1-2次服用，建议餐后或空腹服用，具体遵医嘱。","adverse":"常见不良反应包括嗜睡、体重增加、头晕、口干和便秘；严重不良反应包括癫痫发作、粒细胞减少和血糖异常。","contraindications":"对奥氮平过敏者禁用，与CYP1A2抑制剂合用时需谨慎，避免与酒精同时使用。","storage":"密封，在25℃以下干燥处保存，避免阳光直射。","note":"监测体重和血糖变化"},
    "孟鲁司特": {"indications":"用于治疗支气管哮喘、过敏性鼻炎、运动诱发的支气管痉挛、慢性阻塞性肺疾病及过敏性结膜炎。","ingredients":"主要成分为孟鲁司特钠，常见剂型规格为10mg片剂和4mg颗粒剂。","dosage":"成人常用剂量为每日10mg，睡前服用，具体遵医嘱调整。","adverse":"常见不良反应包括头痛、腹痛、腹泻、恶心和疲劳；严重不良反应有肝功能异常、精神症状和过敏反应。","contraindications":"对本品过敏者禁用；与CYP3A4强效抑制剂（如酮康唑）合用时需避免使用。","storage":"密封，避光，于25℃以下干燥处保存。","note":"定期监测肝功能"},
    "尼群地平": {"indications":"用于治疗高血压、冠心病、心绞痛、慢性心力衰竭及外周血管疾病。适用于伴有高血压的稳定型心绞痛患者。","ingredients":"尼群地平，常见剂型为片剂，规格为10mg/片、20mg/片。","dosage":"成人常用剂量为每日10-20mg，分1-2次服用，建议餐后服用。","adverse":"常见不良反应包括头痛、面部潮红、水肿、乏力、恶心；严重不良反应有心动过速、低血压、肝功能异常。","contraindications":"对尼群地平过敏者禁用；严重主动脉狭窄患者禁用；与强效CYP3A4抑制剂合用时需避免使用。","storage":"遮光，密封，在阴凉干燥处保存。","note":"定期监测血压和肝功能。"},
    "左氧氟沙星": {"indications":"用于治疗敏感菌引起的呼吸道感染、泌尿系统感染、皮肤软组织感染、胃肠道感染及伤寒等疾病。","ingredients":"主要成分为左氧氟沙星，常见剂型规格为片剂（0.1g、0.2g）和注射液（50ml:0.2g）。","dosage":"成人常用剂量为每次0.2g，每日2次，空腹或餐后服用，疗程根据病情而定。","adverse":"常见不良反应包括恶心、腹泻、头晕、皮疹和失眠；严重不良反应有肌腱炎、重症肌无力加重和QT间期延长。","contraindications":"对喹诺酮类药物过敏者禁用，18岁以下儿童及孕妇禁用，与含镁/铝的抗酸药同用时需间隔2小时以上。","storage":"密封，在阴凉干燥处保存，避免阳光直射。","note":"避免日晒，定期检查肝肾功能。"},
    "左甲状腺素": {"indications":"用于治疗甲状腺功能减退症、甲状腺癌术后甲状腺激素替代治疗、甲状腺功能低下引起的黏液性水肿、先天性甲状腺功能减退症及抑制甲状腺肿瘤的复发。","ingredients":"左甲状腺素钠，常见剂型规格为50μg、100μg、150μg、200μg片剂。","dosage":"成人常用剂量为每日50-200μg，空腹服用，通常在早餐前30-60分钟服用。","adverse":"常见不良反应包括心悸、出汗、体重减轻、腹泻；严重不良反应有心律失常、骨质疏松、甲状腺功能亢进。","contraindications":"对左甲状腺素过敏者禁用；未治疗的肾上腺功能不全患者禁用；与抗凝药物、含钙或铁的补充剂合用时需谨慎。","storage":"遮光，密封，在25℃以下干燥处保存。","note":"定期监测甲状腺功能"},
    "布地奈德": {"indications":"用于治疗支气管哮喘、慢性阻塞性肺疾病、过敏性鼻炎、鼻窦炎及轻中度哮喘持续状态。","ingredients":"布地奈德，常见剂型规格为吸入用混悬液（0.5mg/2ml）和片剂（1mg）。","dosage":"成人常用剂量为每日2-4次，每次1-2mg，饭前或饭后服用，具体遵医嘱。","adverse":"常见不良反应包括咽喉刺激、声音嘶哑、口干、头痛；严重不良反应有骨质疏松、肾上腺抑制、血糖升高。","contraindications":"对布地奈德过敏者禁用；与CYP3A4强效抑制剂合用时需谨慎。","storage":"避光、密封，在25℃以下干燥处保存。","note":"长期使用需监测骨密度"},
    "异丙托溴铵": {"indications":"用于治疗慢性阻塞性肺疾病（COPD）引起的支气管痉挛、哮喘急性发作时的支气管痉挛、慢性支气管炎引起的咳嗽和喘息，以及支气管扩张症伴支气管痉挛。","ingredients":"主要成分为异丙托溴铵，常见剂型为吸入用溶液，规格通常为0.02%或0.04%浓度。","dosage":"成人常用剂量为每次1-2喷，每日3-4次，于症状发作时或按医嘱使用，不可过量。","adverse":"常见不良反应包括口干、头痛、心悸、恶心；严重不良反应有呼吸困难、过敏性休克、心律失常。","contraindications":"禁用于对本品过敏者，禁与单胺氧化酶抑制剂合用，禁用于严重心脏病患者。","storage":"遮光，密闭保存，置于阴凉干燥处，避免高温和潮湿。","note":"避免接触眼睛，定期检查肺功能。"},
    "氢氯噻嗪": {"indications":"用于治疗高血压、心力衰竭、肾性水肿、肝硬化腹水及尿崩症。适用于伴有钠潴留的水肿性疾病和高血压患者。","ingredients":"主要成分为氢氯噻嗪，常见剂型规格为25mg/片、50mg/片。","dosage":"成人常用剂量为25-100mg/日，分1-2次服用，建议早晨服用以减少夜间尿频。","adverse":"常见不良反应包括低钾血症、头晕、乏力、胃肠道不适；严重不良反应有电解质紊乱、过敏反应、肝功能异常。","contraindications":"禁用于严重肝肾功能不全、低钾血症、对磺胺类药物过敏者。与锂盐、某些抗高血压药合用时需谨慎。","storage":"遮光，密封，在阴凉干燥处保存。","note":"监测电解质，避免长期使用"},
    "氨溴索": {"indications":"用于治疗支气管炎、肺炎、慢性阻塞性肺疾病急性发作、支气管扩张症及哮喘伴黏痰不易咳出的患者。","ingredients":"主要成分为氨溴索，常见剂型规格为片剂（15mg/片）、口服液（10mg/5ml）。","dosage":"成人常用剂量为每次30mg，每日3次，饭后服用。","adverse":"常见不良反应包括恶心、胃部不适、腹泻和皮疹；严重不良反应有呼吸困难、过敏性休克和肝功能异常。","contraindications":"对本品过敏者禁用；与抗酸药或镇咳药合用时需谨慎，避免影响疗效。","storage":"遮光，密封，在阴凉干燥处保存。","note":"避免长期使用"},
    "氯苯那敏": {"indications":"用于过敏性鼻炎、荨麻疹、湿疹、接触性皮炎及药物过敏等疾病的治疗，也可缓解皮肤瘙痒和过敏性结膜炎症状。","ingredients":"主要成分为氯苯那敏，常见剂型规格为1mg/片、2mg/片、10mg/片及复方制剂。","dosage":"成人常用剂量为每次1-2mg，每日3次，饭后服用，避免空腹使用。","adverse":"常见不良反应包括嗜睡、口干、头晕、恶心；严重不良反应有呼吸困难、心律失常、过敏性休克。","contraindications":"对本品过敏者禁用；与中枢神经系统抑制剂合用时禁用，孕妇及哺乳期妇女慎用。","storage":"密封，在阴凉干燥处保存，避免阳光直射。","note":"服药期间避免驾驶或操作机械。"},
    "氯雷他定": {"indications":"用于治疗过敏性鼻炎、慢性自发性荨麻疹、特应性皮炎、过敏性结膜炎及食物过敏引起的皮肤瘙痒等症状。","ingredients":"主要成分为氯雷他定，常见剂型规格为10mg/片、5mg/片。","dosage":"成人常用剂量为每日10mg，可于早晨或晚上服用，具体遵医嘱。","adverse":"常见不良反应包括嗜睡、口干、头痛、乏力和胃肠道不适；严重不良反应有肝功能异常、过敏性休克和心律失常。","contraindications":"禁用于对氯雷他定过敏者，禁与酮康唑、伊曲康唑等CYP3A4抑制剂联用。","storage":"遮光、密封，在阴凉干燥处保存，避免儿童接触。","note":"避免驾驶或操作机械"},
    "沙丁胺醇": {"indications":"用于支气管哮喘、慢性阻塞性肺疾病、支气管炎、过敏性鼻炎及运动诱发的支气管痉挛的缓解治疗。","ingredients":"沙丁胺醇，常见剂型规格为2.5mg/1ml注射液、100μg/喷雾剂、4mg/片剂。","dosage":"成人常用剂量为每次100μg，每日3-4次，吸入或口服，饭前或饭后均可服用。","adverse":"常见不良反应包括心悸、震颤、头痛、恶心；严重不良反应有心动过速、高血压、低钾血症。","contraindications":"对沙丁胺��过敏者禁用；与β受体阻滞剂合用时禁用，严重心脏病患者慎用。","storage":"遮光，密闭，在阴凉干燥处保存，避免高温和潮湿。","note":"避免长期大量使用"},
    "泮托拉唑": {"indications":"用于治疗胃溃疡、十二指肠溃疡、反流性食管炎、幽门螺杆菌感染及预防非甾体抗炎药引起的胃部损伤。","ingredients":"主要成分为泮托拉唑钠，常见剂型规格为40mg片剂和40mg冻干粉针剂。","dosage":"成人常用剂量为每日40mg，空腹或餐前30分钟服用，疗程根据病情调整。","adverse":"常见不良反应包括腹泻、头痛、恶心；严重不良反应有肝功能异常、过敏反应及低镁血症。","contraindications":"对本品过敏者禁用；与氯吡格雷合用时禁用，因可能降低其抗血小板作用。","storage":"密封，在阴凉干燥处保存，避免阳光直射。","note":"定期监测肝功能"},
    "泼尼松": {"indications":"用于治疗类风湿性关节炎、系统性红斑狼疮、哮喘急性发作、严重过敏反应及器官移植后排斥反应。","ingredients":"泼尼松（Prednisone），常见剂型规格为5mg、10mg、20mg片剂。","dosage":"成人常用剂量为每日5-60mg，分次服用，饭后服用以减少胃部刺激。","adverse":"常见不良反应包括消化道不适、体重增加、失眠；严重不良反应有骨质疏松、高血压、血糖升高。","contraindications":"禁用于对泼尼松过敏者、活动性消化性溃疡患者及严重感染未控制者。与某些药物如利福平、苯妥英钠有相互作用。","storage":"密封，避光，置于阴凉干燥处，温度不超过25℃。","note":"长期使用需监测血糖和骨密度。"},
    "瑞舒伐他汀": {"indications":"用于治疗高胆固醇血症、混合型血脂异常、冠心病患者的降脂治疗、预防动脉粥样硬化性心血管疾病及降低低密度脂蛋白胆固醇水平。","ingredients":"瑞舒伐他汀钙，常见剂型规格为5mg、10mg、20mg片剂。","dosage":"成人常用剂量为每日5-20mg，餐前或餐后服用，具体剂量需根据血脂水平调整。","adverse":"常见不良反应包括肌肉疼痛、乏力、胃肠道不适；严重不良反应有肌病、横纹肌溶解、肝功能异常。","contraindications":"对本品过敏者禁用；严重肝功能不全患者禁用；与某些药物如胺碘酮、环孢素联用时禁用。","storage":"密封，在阴凉干燥处保存，避免阳光直射。","note":"定期监测肝功能和肌酸激酶"},
    "甲硝唑": {"indications":"用于治疗厌氧菌感染，如牙周脓肿、盆腔炎、腹腔感染、败血症及脑膜炎等。也用于预防手术后感染，以及滴虫性阴道炎和贾第虫病。","ingredients":"主要成分为甲硝唑，常见剂型规格为片剂（0.2g/片）、注射液（500mg/100ml）和栓剂（1g/粒）。","dosage":"成人常用剂量为每次0.2-0.4g，每日3次，餐后服用；严重感染可增至每次0.6g，每日3次。","adverse":"常见不良反应包括恶心、呕吐、腹泻、口腔金属味和头痛；严重不良反应有癫痫发作、过敏性休克和血液系统异常。","contraindications":"对甲硝唑过敏者禁用；妊娠早期（前三个月）禁用；与酒精同时使用可能引发双硫仑样反应。","storage":"密封，在阴凉干燥处保存，避免阳光直射。","note":"避免饮酒，注意过敏反应"},
    "硝酸甘油": {"indications":"用于治疗心绞痛、急性心肌梗死、高血压急症、慢性心力衰竭及预防心绞痛发作。","ingredients":"硝酸甘油，常见剂型规格为0.5mg/片、0.6mg/片、1mg/片。","dosage":"成人常用剂量为0.3-0.6mg，舌下含服，每5分钟可重复一次，最多不超过3次。","adverse":"常见不良反应包括头痛、头晕、恶心、面部潮红；严重不良反应有低血压、心动过速、晕厥。","contraindications":"禁用于严重贫血、颅内压增高、对硝酸酯类药物过敏者，避免与磷酸二酯酶抑制剂合用。","storage":"遮光，密封，在阴凉干燥处保存。","note":"避免突然停药"},
    "磺胺甲恶唑/甲氧苄啶": {"indications":"用于治疗尿路感染、呼吸道感染、肠道感染、皮肤软组织感染及伤寒等细菌性感染疾病。","ingredients":"磺胺甲恶唑与甲氧苄啶复方制剂，常见剂型规格为每片含磺胺甲恶唑400mg与甲氧苄啶80mg。","dosage":"成人常用剂量为每次1片，每日2次，餐后服用。","adverse":"常见不良反应包括恶心、呕吐、皮疹、腹泻；严重不良反应有溶血性贫血、粒细胞减少、严重过敏反应。","contraindications":"对磺胺类或甲氧苄啶过敏者禁用；严重肝肾功能不全者禁用；与某些药物如丙磺舒存在相互作用。","storage":"密封，避光，干燥处保存。","note":"避免长期使用"},
    "秋水仙碱": {"indications":"用于治疗痛风性关节炎急性发作、复发性痛风性关节炎、滑囊炎、腱鞘炎及由尿酸盐沉积引起的炎症性疾病。","ingredients":"主要成分为秋水仙碱，常见剂型规格为0.5mg/片、1mg/片。","dosage":"成人常用剂量为每次0.5-1mg，每日3次，症状缓解后逐渐减量。餐后服用以减少胃肠道刺激。","adverse":"常见不良反应包括恶心、呕吐、腹泻、腹痛；严重不良反应有骨髓抑制、肝功能异常、过敏性休克。","contraindications":"禁用于对秋水仙碱过敏者、严重肝肾功能不全者、血液系统疾病患者。避免与强效CYP3A4抑制剂联用。","storage":"遮光，密封，在阴凉干燥处保存，温度不超过25℃。","note":"严格按医嘱用药，避免过量"},
    "罗红霉素": {"indications":"用于治疗敏感菌引起的呼吸道感染（如肺炎、支气管炎）、皮肤软组织感染、中耳炎、鼻窦炎及泌尿系统感染。","ingredients":"主要成分为罗红霉素，常见剂型为片剂（150mg/片）和胶囊（150mg/粒）。","dosage":"成人常用剂量为每次150mg，每日2次，餐前1小时或餐后2小时服用。","adverse":"常见不良反应包括恶心、呕吐、腹泻、腹痛和皮疹；严重不良反应有肝功能异常和过敏性休克。","contraindications":"对罗红霉素过敏者禁用；与特非那定、阿司咪唑合用时禁用。","storage":"密封，避光，干燥处保存，温度不超过25℃。","note":"避免与酸性食物同服"},

    "钙片": {"indications":"用于治疗钙缺乏症、骨质疏松症、佝偻病、手足搐搦症及甲状旁腺功能低下症。适用于孕妇、哺乳期妇女及老年人的钙补充。","ingredients":"主要成分为碳酸钙，常见剂型规格为0.5克/片、1克/片，也有液体钙制剂。","dosage":"成人常用剂量为每日1-2克，分次服用，餐后或与食物同服以减少胃部刺激。","adverse":"常见不良反应包括便秘、腹胀、恶心；严重不良反应有高钙血症、肾结石、心律失常。","contraindications":"禁用于高钙血症患者、严重肾功能不全者及对成分过敏者；避免与含草酸的食物同服。","storage":"密封，避光，置于阴凉干燥处，温度不超过30℃。","note":"定期监测血钙水平"},
    "银杏叶提取物": {"indications":"用于治疗脑血管障碍、视网膜病变、糖尿病性视网膜病变及外周血管疾病，改善微循环和血液流变学指标。","ingredients":"银杏叶提取物，常见剂型为片剂（每片含银杏叶提取物40mg）和注射液（每支含银杏叶提取物20mg）。","dosage":"成人常用剂量为每日3次，每次1-2片，餐后服用；注射液每日1次，静脉滴注。","adverse":"常见不良反应包括恶心、腹泻、胃部不适、头痛和皮疹；严重不良反应有出血倾向、过敏性休克和肝功能异常。","contraindications":"对银杏叶过敏者禁用；出血性疾病患者、抗凝药物使用者慎用，避免与抗血小板药物联用。","storage":"密封，避光，置于阴凉干燥处，温度不超过25℃。","note":"避免与抗凝药同用"},
    "阿仑膦酸钠": {"indications":"用于治疗骨质疏松症（绝经后妇女和老年男性）、Paget's病、糖皮质激素诱导的骨质疏松症及预防骨折。","ingredients":"阿仑膦酸钠，常见剂型规格为70mg/片、35mg/片、10mg/片。","dosage":"成人常用剂量为每周70mg或每日10mg，空腹服用，服药后至少30分钟内保持直立姿势。","adverse":"常见不良反应包括胃肠道不适、肌肉骨骼疼痛、头痛；严重不良反应包括低钙血症、颌骨坏死、非典型股骨骨折。","contraindications":"禁用于严重肾功能不全患者、对本品过敏者，避免与钙剂或抗酸药同时服用。","storage":"密封，在阴凉干燥处保存，避免受潮。","note":"定期监测肾功能"},
    "阿卡波糖": {"indications":"用于2型糖尿病患者的血糖控制，尤其适用于餐后高血糖患者。也可用于糖耐量异常及轻度糖尿病患者。改善胰岛功能，降低血糖波动。","ingredients":"主要成分为阿卡波糖，常见剂型规格为50mg/片、100mg/片。","dosage":"成人常用剂量为每次50mg，每日3次，随第一口食物吞服，根据血糖调整剂量。","adverse":"常见不良反应包括腹胀、腹泻、恶心；偶见胃部不适和体重减轻。严重不良反应有肝功能异常和过敏性休克。","contraindications":"禁用于肠梗阻患者、严重肾功能不全者及对本品过敏者。与胰岛素或磺脲类药物合用时需谨慎。","storage":"密封，在阴凉干燥处保存，避免阳光直射。","note":"监测血糖变化"},
    "阿昔洛韦": {"indications":"用于治疗单纯疱疹病毒感染，带状疱疹，生殖器疱疹，水痘，以及免疫功能低下患者的疱疹病毒感染。","ingredients":"阿昔洛韦，常见剂型规格为200mg/片、400mg/片、5%注射液（1g/100ml）。","dosage":"成人常用剂量为每次200mg，每日5次，间隔4小时服用；或静脉注射每次5-10mg/kg，每8小时一次。","adverse":"常见不良反应包括恶心、呕吐、腹泻、头痛、皮疹；严重不良反应有肾功能损害、过敏性休克、癫痫发作。","contraindications":"对阿昔洛韦过敏者禁用；严重肾功能不全患者禁用；与肾毒性药物合用时需谨慎。","storage":"遮光，密封，在25℃以下干燥处保存。","note":"避免脱水，定期监测肾功能。"},
    "阿莫西林克拉维酸钾": {"indications":"用于治疗敏感菌引起的呼吸道感染、泌尿系统感染、皮肤软组织感染及牙源性感染。具体包括肺炎、支气管炎、扁桃体炎、膀胱炎和中耳炎。","ingredients":"阿莫西林与克拉维酸钾复合制剂，常见剂型规格为250mg/125mg片剂和625mg/125mg片剂。","dosage":"成人常用剂量为每次250mg-500mg，每12小时一次，餐后服用。","adverse":"常见不良反应包括腹泻、恶心、呕吐、皮疹和头痛；严重不良反应有肝功能异常、过敏性休克和二重感染。","contraindications":"对青霉素类或头孢菌素类药物过敏者禁用；与丙磺舒合用时需慎用；孕妇及哺乳期妇女慎用。","storage":"遮光、密封，在阴凉干燥处保存，避免受潮。","note":"过敏者禁用，定期检查肝肾功能。"},
    "雷尼替丁": {"indications":"用于治疗胃溃疡、十二指肠溃疡、反流性食管炎、卓-艾综合征引起的胃酸过多及预防应激性溃疡出血。","ingredients":"雷尼替丁，常见剂型规格为150mg/片、300mg/片。","dosage":"成人常用剂量为每次150mg，每日2次，餐后或睡前服用。","adverse":"常见不良反应包括腹泻、便秘、头痛、恶心、乏力；严重不良反应有肝功能异常、粒细胞减少、过敏性休克。","contraindications":"对雷尼替丁过敏者禁用；与某些药物如地西泮、华法林等合用时需谨慎，避免相互作用。","storage":"密封，在阴凉干燥处保存，避免受潮。","note":"定期监测肝功能"},
    "非布司他": {"indications":"用于治疗高尿酸血症及痛风患者，降低血尿酸水平；适用于慢性肾病患者伴有高尿酸血症；用于预防尿酸性肾结石复发；用于肿瘤化疗引起的高尿酸血症；用于继发性高尿酸血症。","ingredients":"非布司他，常见剂型规格为40mg和80mg片剂。","dosage":"成人常用剂量为每日40mg或80mg，空腹或餐后服用，根据血尿酸水平调整剂量。","adverse":"常见不良反应包括肝功能异常、腹泻、头痛、关节痛、皮疹；严重不良反应有肝衰竭、心肌梗死、致命性过敏反应。","contraindications":"对非布司他过敏者禁用；严重肝功能不全患者禁用；与硫唑嘌呤或mercaptopurine合用时禁用。","storage":"密封，避光，干燥处保存，温度不超过25℃。","note":"定期监测肝功能"},
    "非那雄胺": {"indications":"治疗男性雄激素性脱发；治疗良性前列腺增生症；缓解前列腺增生引起的排尿困难症状；降低前列腺癌风险；改善前列腺特异性抗原（PSA）水平。","ingredients":"非那雄胺，常见剂型规格为1mg片剂。","dosage":"成人每日一次，每次1mg，空腹或餐后服用均可。","adverse":"常见不良反应包括性欲减退、勃起功能��碍、射精量减少、乳房触痛或肿胀；严重不良反应包括抑郁、肝功能异常、过敏反应。","contraindications":"禁用于女性和儿童；禁用于对本品过敏者；禁与CYP3A4强效抑制剂联用。","storage":"密封，避光，于25℃以下干燥处保存。","note":"避免接触孕妇"},
    "丙磺舒": {"indications":"用于治疗痛风性关节炎急性发作、慢性痛风症、高尿酸血症及预防尿酸性肾结石。也用于降低其他药物（如硫嘌呤类）的肾毒性。","ingredients":"主要成分为丙磺舒，常见剂型为片剂，规格为0.25g/片。","dosage":"成人常用剂量为每次0.25g，每日2-3次，餐后服用，根据病情调整剂量。","adverse":"常见不良反应包括胃肠道不适、皮疹、头痛、眩晕；严重不良反应有肝功能异常、过敏性休克、血液系统异常。","contraindications":"对丙磺舒过敏者禁用；与青霉素类抗生素合用时禁用；严重肝肾功能不全者禁用。","storage":"遮光，密封，在阴凉干燥处保存。","note":"定期监测肝肾功能"},
    "保婴丹": {"indications":"用于治疗小儿感冒引起的发热、咳嗽、流涕、鼻塞及消化不良等症状。","ingredients":"主要成分为朱砂、雄黄、冰片、麝香、牛黄，常见剂型为丸剂，规格为每丸0.3g。","dosage":"成人常用剂量为每次1-2丸，每日2次，饭后服用。","adverse":"常见不良反应包括恶心、呕吐、腹泻、皮疹；严重不良反应有肝功能异常、肾功能损害。","contraindications":"孕妇禁用，对本品过敏者禁用；避免与含汞药物同用。","storage":"密封，置阴凉干燥处保存。","note":"孕妇禁用"},
    "克林霉素": {"indications":"用于治疗敏感菌引起的呼吸道感染（如肺炎、支气管炎）、皮肤软组织感染、中耳炎及牙周感染等。也用于预防手术后感染。","ingredients":"主要成分为克林霉素磷酸酯，常见剂型包括片剂（150mg、300mg）和注射剂（0.3g/瓶）。","dosage":"成人常用剂量为每次150-300mg，每日2-4次，餐后服用。","adverse":"常见不良反应包括恶心、呕吐、腹泻和皮疹；严重不良反应有伪膜性肠炎、过敏性休克和肝功能异常。","contraindications":"对克林霉素过敏者禁用；与红霉素等大环内酯类药物存在相互作用，避免同时使用。","storage":"遮光、密封，在阴凉干燥处保存，避免受潮。","note":"注意过敏反应"},
    "克霉唑阴道片": {"indications":"用于治疗念珠菌性阴道炎、外阴瘙痒症、阴道真菌感染、滴虫性阴道炎及细菌性阴道病。","ingredients":"克霉唑，常见剂型规格为100mg/片。","dosage":"成人每次1片，睡前阴道内给药，连续使用3-7日。","adverse":"局部刺激、瘙痒、灼热感、分泌物增多、过敏反应；严重者可能出现呼吸困难、皮疹、休克。","contraindications":"对克霉唑过敏者禁用；妊娠期前三个月慎用；与其他抗真菌药物合用时需谨慎。","storage":"遮光，密封，在阴凉干燥处保存。","note":"避免接触眼睛，过敏者停用。"},
    "六味地黄丸": {"indications":"用于肾阴亏损引起的头晕耳鸣、腰膝酸软、骨蒸潮热、盗汗遗精、口干舌燥等症状。适用于慢性肾炎、糖尿病、更年期综合征及高血压患者。","ingredients":"熟地黄、山茱萸、山药、牡丹皮、泽泻、茯苓。常见剂型规格为浓缩丸，每瓶120粒，每粒相当于原药材0.3克。","dosage":"口服，一次8-10粒，一日2次。饭后服用，疗程一般为4周以上。","adverse":"常见不良反应包括恶心、腹泻、腹胀、食欲减退、胃部不适。严重不良反应有肝功能异常、过敏性休克、急性肾损伤。","contraindications":"对本品过敏者禁用；脾胃虚寒者慎用；与利尿剂、降压药合用时需谨慎。","storage":"密封，置阴凉干燥处，避光防潮。","note":"服药期间忌食辛辣油腻"},
    "卤米松乳膏": {"indications":"用于治疗湿疹、皮炎、瘙痒性皮肤病、银屑病及过敏性皮炎等皮肤疾病。","ingredients":"主要成分为卤米松，常见剂型规格为0.05%乳膏。","dosage":"成人每日2次，每次适量涂抹于患处，避免长期大面积使用。","adverse":"常见不良反应包括局部刺激、干燥、烧灼感；严重不良反应有皮肤萎缩、毛细血管扩张和继发感染。","contraindications":"对卤米松过敏者禁用；禁与其他糖皮质激素类药物同时使用。","storage":"遮光，密闭，在阴凉干燥处保存。","note":"避免接触眼睛"},
    "司来吉兰": {"indications":"用于治疗高血压、心绞痛、心肌梗死后的长期管理、慢性心力衰竭以及预防偏头痛发作。适用于需要降低血压和改善心脏功能的患者。","ingredients":"主要成分为美托洛尔，常见剂型规格为25mg、50mg、100mg片剂。","dosage":"成人常用剂量为每天25-100mg，分1-2次服用，通常在早晨空腹或餐后服用。","adverse":"常见不良反应包括疲劳、头晕、心动过缓、四肢发冷和胃肠道不适；严重不良反应包括心力衰竭加重、支气管哮喘发作和过敏性休克。","contraindications":"禁用于严重心动过缓、心源性休克、重度低血压、支气管哮喘患者及对本品过敏者；与钙通道阻滞剂合用时需谨慎。","storage":"遮光、密封，在阴凉干燥处保存，避免高温和潮湿。","note":"监测心率和血压变化"},
    "咪康唑乳膏": {"indications":"用于治疗皮肤真菌感染，如体癣、股癣、足癣、花斑癣及念珠菌性阴道炎。亦可用于皮肤念珠菌病和马拉色菌毛囊炎。","ingredients":"主要成分为咪康唑，常见剂型为乳膏，规格为2%（20mg/g）。","dosage":"成人每日2次，涂抹于患处，疗程一般为2-4周，具体遵医嘱。","adverse":"常见不良反应包括局部刺激、瘙痒、烧灼感；严重不良反应有过敏性皮疹、接触性皮炎、呼吸困难。","contraindications":"对咪康唑过敏者禁用；避免与含酒精的制剂同时使用，可能引起刺激。","storage":"密封，避光，置于阴凉干燥处，温度不超过25℃。","note":"避免接触眼睛和黏膜。"},
    "复方醋酸地塞米松乳膏": {"indications":"用于治疗湿疹、皮炎、瘙痒性皮肤病、接触性皮炎及轻中度银屑病等皮肤疾病。","ingredients":"主要成分为醋酸地塞米松，常见剂型为乳膏，规格为0.05%（5mg/g）。","dosage":"成人每日2-4次，涂抹于患处，疗程一般不超过2周。","adverse":"常见不良反应包括局部刺激、干燥、烧灼感；严重不良反应有皮肤萎缩、毛细血管扩张和继发感染。","contraindications":"对本品过敏者禁用；禁用于皮肤结核、梅毒及病毒感染患者；避免与强效CYP3A4抑制剂联用。","storage":"遮光，密封，在阴凉干燥处保存，温度不超过25℃。","note":"避免接触眼睛和黏膜。"},
    "多西环素": {"indications":"用于治疗细菌性感染，如呼吸道感染、皮肤软组织感染、泌尿道感染、痤疮及立克次体病。","ingredients":"多西环素，常见剂型规格为100mg片剂和50mg胶囊。","dosage":"成人常用剂量为100mg，每日2次，餐后服用，疗程根据病情而定。","adverse":"常见不良反应包括恶心、呕吐、腹泻、皮疹；严重不良反应有肝功能异常、过敏反应。","contraindications":"对多西环素过敏者禁用，孕妇及8岁以下儿童禁用，与抗凝药合用需谨慎。","storage":"遮光，密封，在阴凉干燥处保存。","note":"避免日晒，定期检查肝功能。"},
    "夫西地酸乳膏": {"indications":"用于治疗由敏感细菌引起的皮肤感染，如脓疱疮、毛囊炎、疖肿、轻中度痤疮及外耳道炎。","ingredients":"主要成分为夫西地酸，常见剂型为1%乳膏，每支10g或20g。","dosage":"成人每日2-3次，涂抹于患处，疗程一般不超过2周。","adverse":"常见不良反应包括局部刺激、瘙痒、红斑；严重不良反应有过敏性休克、肝功能异常。","contraindications":"对夫西地酸过敏者禁用；与环孢素等免疫抑制剂合用时需谨慎。","storage":"遮光，密闭，在25℃以下干燥处保存。","note":"避免接触眼睛"},
    "头孢曲松": {"indications":"用于治疗敏感菌引起的呼吸道感染、泌尿系统感染、皮肤软组织感染、骨关节感染及败血症等疾病。","ingredients":"主要成分为头孢曲松钠，常见剂型规格为1g/瓶、2g/瓶。","dosage":"成人常用剂量为每日1-2g，分1-2次静脉注射或肌内注射，具体根据感染严重程度调整。","adverse":"常见不良反应包括腹泻、恶心、皮疹、头痛和注射部位疼痛；严重不良反应有过敏性休克、肝功能异常和肾功能损害。","contraindications":"对头孢曲松过敏者禁用；与含丙二醇的药物存在相互作用，禁用。","storage":"遮光、密闭，在阴凉干燥处保存，避免受潮。","note":"使用前需进行过敏试验。"},
    "孟鲁司特钠": {"indications":"用于治疗支气管哮喘、过敏性鼻炎、运动诱发的支气管痉挛、季节性和常年性过敏性鼻炎以及慢性荨麻疹。","ingredients":"主要成分为孟鲁司特钠，常见剂型规格为10mg片剂和4mg颗粒剂。","dosage":"成人常用剂量为每日1次，每次10mg，睡前服用。","adverse":"常见不良反应包括头痛、腹痛、腹泻、疲劳和嗜睡；严重不良反应有肝功能异常、精神症状和过敏反应。","contraindications":"禁用于对本品过敏者，禁与环孢素合用，禁用于严重肝功能不全患者。","storage":"密封，在25℃以下干燥处保存。","note":"避免与环孢素同用"},
    "小儿止咳糖浆": {"indications":"用于治疗小儿感冒引起的咳嗽、支气管炎、肺炎初期、哮喘性支气管炎及上呼吸道感染所致的咳嗽症状。","ingredients":"主要成分包括甘草流浸膏、桔梗流浸膏、远志流浸膏、薄荷脑，常见剂型规格为100ml/瓶。","dosage":"成人常用剂量为每次10-15ml，每日3次，饭后服用。","adverse":"常见不良反应有恶心、胃部不适、轻度头晕；严重不良反应包括过敏性休克、肝功能异常、呼吸困难。","contraindications":"对本品过敏者禁用；孕妇及哺乳期妇女慎用；与中枢镇咳药合用时需谨慎。","storage":"密封，置阴凉干燥处，避光保存。","note":"避免过量服用"},
    "小儿退热栓": {"indications":"用于治疗小儿感冒引起的发热、咽喉炎、扁桃体炎、中耳炎及病毒性肺炎等疾病导致的体温升高。","ingredients":"主要成分为对乙酰氨基酚，常见剂型规格为每粒含对乙酰氨基酚50mg或100mg。","dosage":"成人常用剂量为每次500mg，间隔4-6小时服用一次，每日不超过4g，餐后服用。","adverse":"常见不良反应包括恶心、呕吐、腹痛、皮疹；严重不良反应有肝功能异常、过敏性休克、急性肾损伤。","contraindications":"禁用于对乙酰氨基酚过敏者、严重肝肾功能不全者，避免与酒精同时使用，禁与含有对乙酰氨基酚的其他药物联用。","storage":"密封，在阴凉干燥处保存，避免阳光直射。","note":"避免长期服用"},
    "左氧氟沙星滴眼液": {"indications":"用于治疗细菌性结膜炎、角膜炎、睑缘炎及眼部感染等，适用于葡萄球菌、链球菌、大肠杆菌等敏感菌引起的感染。","ingredients":"左氧氟沙星（0.3%），滴眼液剂型，每支5ml或10ml。","dosage":"成人每次1-2滴，每日3-4次，或遵医嘱。睡前使用可提高疗效。","adverse":"常见不良反应包括眼部刺激、异物感、瘙痒；严重不良反应有视物模糊、过敏性休克、角膜溃疡。","contraindications":"对喹诺酮类药物过敏者禁用；孕妇及哺乳期妇女慎用；避免与含镁、钙的制剂同时使用。","storage":"遮光，密闭保存，置于阴凉干燥处，避免冻结。","note":"避免接触污染，停药后及时就医"},
    "布洛芬栓": {"indications":"用于缓解轻至中度疼痛，如头痛、牙痛、关节痛、肌肉痛及月经痛；也可用于退热及炎症性疾病的症状治疗。","ingredients":"主要成分为布洛芬，常见剂型规格为100mg/粒或200mg/粒栓剂。","dosage":"成人每次100-200mg，每日2-3次，睡前或饭后使用。","adverse":"常见不良反应包括胃部不适、恶心、腹泻；严重不良反应包括消化道出血、肾功能损害及过敏反应。","contraindications":"对布洛芬过敏者禁用；消化道溃疡患者、严重肝肾功能不全者禁用；与抗凝血药合用时需谨慎。","storage":"遮光，密封，在阴凉干燥处保存。","note":"避免长期使用"},
    "开塞露": {"indications":"用于治疗便秘、肛门直肠手术后排便困难、慢性功能性便秘、药物性便秘及老年性便秘。","ingredients":"主要成分：甘油。常见剂型规格：10ml/支，20ml/支。","dosage":"成人每次1支，睡前或必要时使用，直接注入肛门内。","adverse":"常见不良反应：肛门灼热感、腹痛、腹泻；严重不良反应：电解质紊乱、肛门黏膜损伤、过敏性休克。","contraindications":"对甘油过敏者禁用；严重肛门直肠疾病患者禁用；与强心苷类药物合用时需谨慎。","storage":"密封，避光，置于阴凉干燥处，温度不超过30℃。","note":"避免长期依赖"},
    "归脾丸": {"indications":"用于心脾两虚所致的失眠、健忘、食欲不振、乏力、月经不调及贫血等病症。","ingredients":"党参、白术、黄芪、茯苓、远志、酸枣仁、龙眼肉、当归、木香、炙甘草，常见剂型为浓缩丸，每瓶120粒。","dosage":"口服，一次6-9粒，一日2次，饭前服用。","adverse":"恶心、胃部不适、腹泻、便秘、头晕；严重者可能出现过敏性休克、肝功能异常。","contraindications":"对本品过敏者禁用；湿热体质者慎用；与抗凝血药合用可能增加出血风险。","storage":"密封，置阴凉干燥处。","note":"忌食生冷油腻"},
    "拉莫三嗪": {"indications":"用于治疗癫痫部分性发作，辅助治疗双相情感障碍的抑郁发作，也可用于治疗神经性疼痛及某些类型的偏头痛。","ingredients":"主要成分为拉莫三嗪，常见剂型规格包括25mg、100mg片剂及50mg/5ml口服溶液。","dosage":"成人常用剂量范围为50-200mg/日，通常分两次服用，建议与餐同服以减少胃肠道不适。","adverse":"常见不良反应包括皮疹、头晕、嗜睡、恶心和体重减轻；严重不良反应包括严重皮肤反应（如史蒂文斯-约翰逊综合征）和肝功能异常。","contraindications":"对拉莫三嗪过敏者禁用；与某些抗癫痫药物（如丙戊酸钠）合用时需谨慎，可能增加皮疹风险。","storage":"密封，避光，于25°C以下干燥处保存。","note":"监测肝功能及皮疹"},
    "曲马多": {"indications":"用于治疗中度至重度疼痛，如术后疼痛、创伤后疼痛、关节炎疼痛及慢性疼痛综合征。","ingredients":"曲马多盐酸盐，常见剂型规格为50mg/片、100mg/片、50mg/5ml口服液。","dosage":"成人常用剂量为每次50-100mg，每4-6小时一次，每日不超过400mg。","adverse":"常见不良反应包括恶心、嗜睡、头晕、便秘和头痛；严重不良反应有呼吸抑制、癫痫发作和过敏性休克。","contraindications":"对曲马多过敏者禁用；与单胺氧化酶抑制剂合用禁用；孕妇及哺乳期妇女慎用。","storage":"密封，避光，置于阴凉干燥处，温度不超过25℃。","note":"避免长期使用，防止依赖。"},
    "枯草杆菌二联活菌": {"indications":"用于治疗肠道菌群失调引起的腹泻、便秘、消化不良，以及抗生素相关性肠炎和幽门螺杆菌感染后的辅助治疗。","ingredients":"枯草杆菌、地衣芽孢杆菌，常见剂型为胶囊剂，规格为0.5g/粒。","dosage":"成人每次1-2粒，每日3次，餐后服用。","adverse":"腹胀、恶心、轻度腹泻；严重过敏反应、肝功能异常、肾功能损害。","contraindications":"对本品过敏者禁用；与抗生素同时使用时需间隔2小时以上。","storage":"密封，避光，置于阴凉干燥处保存。","note":"避免与抗生素同服"},
    "桉柠蒎肠溶软胶囊": {"indications":"用于治疗慢性支气管炎、支气管扩张症、肺炎、鼻窦炎及上呼吸道感染等呼吸系统疾病。","ingredients":"主要成分为桉柠蒎油，常见剂型规格为0.3g/粒。","dosage":"成人常用剂量为每次1-2粒，每日3次，餐前服用。","adverse":"常见不良反应包括胃肠道不适、恶心、呕吐、腹泻和头晕；严重不良反应有肝功能异常和过敏性休克。","contraindications":"对本品过敏者禁用；孕妇及哺乳期妇女禁用；与抗凝血药合用时需谨慎。","storage":"遮光，密封，在阴凉干燥处保存。","note":"避免与抗凝血药同用。"},
    "氢化可的松软膏": {"indications":"用于治疗湿疹、接触性皮炎、脂溢性皮炎、过敏性鼻炎及轻度烧伤引起的皮肤炎症。","ingredients":"氢化可的松（1%软膏），常见剂型为软膏剂，规格为10g/支。","dosage":"成人每日2-3次，涂抹于患处，避免长期大面积使用。","adverse":"常见不良反应包括局部刺激、瘙痒、皮肤干燥；严重不良反应有皮肤萎缩、毛细血管扩张、继发感染。","contraindications":"对本品过敏者禁用；严重细菌感染、病毒感染患者禁用；与其他糖皮质激素类药物联用需谨慎。","storage":"密封，避光，置于阴凉干燥处，温度不超过25℃。","note":"避免接触眼睛和黏膜。"},
    "炉甘石洗剂": {"indications":"用于治疗湿疹、接触性皮炎、蚊虫叮咬、轻度皮肤瘙痒及过敏性皮炎等皮肤疾病。","ingredients":"主要成分为炉甘石，常见剂型规格为10%的混悬液。","dosage":"成人每次涂抹患处适量，每日3-4次，根据病情调整。","adverse":"常见不良反应包括局部刺激、干燥、轻微烧灼感；严重不良反应有皮肤过敏、呼吸困难、全身性皮疹。","contraindications":"对炉甘石或制剂中任何成分过敏者禁用；避免与强酸、强碱类药物同时使用。","storage":"遮光，密闭，在阴凉干燥处保存。","note":"避免接触眼睛和黏膜。"},
    "玻璃酸钠滴眼液": {"indications":"用于治疗干眼症、角膜炎、结膜炎、眼疲劳及眼部手术后不适。适用于因泪液分泌不足或蒸发过快引起的症状。","ingredients":"主要成分为玻璃酸钠，常见剂型为0.1%浓度的滴眼液，规格为5ml/瓶。","dosage":"成人每次1-2滴，每日3-4次，根据病情调整。建议在早晚洗脸后使用。","adverse":"常见不良反应包括眼部刺激、短暂异物感、轻微灼热感；严重不良反应可能有过敏性结膜炎、角膜损伤、视力模糊。","contraindications":"对玻璃酸钠过敏者禁用。与其他眼药水同时使用时需间隔10分钟以上。","storage":"遮光、密闭，置于阴凉干燥处，避免高温和阳光直射。","note":"避免污染瓶口，停用后及时盖紧"},
    "生脉饮": {"indications":"用于气阴两虚型心悸、乏力、自汗、口干、眩晕等症，适用于冠心病、高血压、糖尿病引起的自主神经功能紊乱及术后恢复期患者。","ingredients":"人参、麦冬、五味子，常见剂型规格为口服液10ml/支、片剂50mg/片。","dosage":"口服，每次10ml，每日3次；或片剂每次2片，每日3次，餐后服用。","adverse":"恶心、胃部不适、腹泻、皮疹；严重者可能出现过敏性休克、肝功能异常。","contraindications":"对本品过敏者禁用；与强心苷类药物合用时需谨慎，避免心脏毒性。","storage":"密封，避光，置于阴凉干燥处，温度不超过25℃。","note":"过敏体质慎用"},
    "甲硝唑阴道凝胶": {"indications":"用于治疗细菌性阴道病、滴虫性阴道炎、厌氧菌感染及由敏感菌引起的轻中度感染。","ingredients":"甲硝唑，常见剂型为5g/支的阴道凝胶，含甲硝唑200mg。","dosage":"每日1次，睡前使用，每次1支，连续使用5天。","adverse":"局部刺激、瘙痒、灼热感、分泌物增多、恶心；严重者可能出现癫痫发作、过敏反应。","contraindications":"对甲硝唑过敏者禁用；妊娠早期（前三个月）禁用；与酒精同时使用可能引起双硫仑样反应。","storage":"遮光，密封，在阴凉干燥处保存，避免高温。","note":"避免饮酒，注意个人卫生。"},
    "硝呋太尔制霉素阴道软胶囊": {"indications":"用于治疗细菌性阴道病、滴虫性阴道炎、念珠菌性阴道炎、宫颈炎及尿道炎等妇科感染性疾病。","ingredients":"硝呋太尔与制霉素，常见剂型为阴道软胶囊，规格为每粒含硝呋太尔200mg与制霉素100万单位。","dosage":"成人每次1粒，睡前阴道给药，每日1次，连续使用3-7日，具体遵医嘱。","adverse":"常见不良反应包括外阴瘙痒、白带增多、局部灼热感、轻度腹痛和阴道干燥；严重不良反应有过敏性休克、肝功能异常和阴道黏膜损伤。","contraindications":"对本品成分过敏者禁用；妊娠期前三个月及哺乳期妇女慎用；避免与抗凝血药物同时使用。","storage":"密封，避光，置于阴凉干燥处，温度不超过25℃。","note":"用药期间避免性生活"},
    "红霉素眼膏": {"indications":"用于治疗细菌性结膜炎、睑缘炎、角膜炎、葡萄球菌性睑腺炎及眼部轻度感染。","ingredients":"红霉素（1%），眼膏剂，每支10g。","dosage":"成人每次适量涂于眼睑内侧，每日3-4次，疗程一般不超过7天。","adverse":"局部刺激、瘙痒、灼热感；严重者可能出现过敏性休克、视力模糊、角膜损伤。","contraindications":"对红霉素过敏者禁用；与氯霉素、多粘菌素B等药物存在相互作用，避免同时使用。","storage":"密封，避光，置于阴凉干燥处，温度不超过25℃。","note":"避免接触眼睛其他部位"},
    "维A酸乳膏": {"indications":"用于治疗寻常痤疮、扁平疣、尖锐湿疣、毛囊角化病及轻中度银屑病。","ingredients":"维A酸，常见剂型为0.025%、0.05%乳膏。","dosage":"每日1次，睡前涂抹于患处，避免日间使用。","adverse":"刺激性皮炎、红斑、脱屑、干燥、瘙痒；严重者可能出现过敏反应、皮肤溃疡。","contraindications":"孕妇禁用，对本品过敏者禁用；避免与维生素A类药物同时使用。","storage":"遮光，密闭，在阴凉干燥处保存。","note":"避免接触眼睛和黏膜。"},
    "苯妥英": {"indications":"用于治疗癫痫大发作、局限性发作及癫痫持续状态；也用于三叉神经痛、舌咽神经痛及心律失常。","ingredients":"苯妥英钠，常见剂型规格为50mg、100mg片剂及注射液。","dosage":"成人常用剂量为每天300-400mg，分2-3次服用，餐后服用。","adverse":"常见不良反应包括头晕、嗜睡、恶心、皮疹；严重不良反应有肝功能异常、血液系统异常。","contraindications":"对苯妥英过敏者禁用；与华法林等抗凝药合用时需谨慎。","storage":"遮光，密封，在阴凉干燥处保存。","note":"定期监测肝功能"},
    "茶碱": {"indications":"用于支气管哮喘、慢��阻塞性肺疾病��心源性哮喘及早产儿呼吸暂停的治疗。","ingredients":"茶碱，常见剂型规格为100mg/片、200mg/片、250mg/片及注射液50mg/ml。","dosage":"成人常用剂量为每日300-600mg，分2-3次服用，餐后服用以减少胃肠道刺激。","adverse":"常见不良反应包括恶心、呕吐、头痛、失眠；严重不良反应有心律失常、癫痫发作、低钾血症。","contraindications":"对茶碱过���者禁用；严重心律失常、急性心肌梗死患者禁用；与某些药物如红霉素、氟喹诺酮类抗生素合用时需避免。","storage":"遮光，密封，在阴凉干燥处保存。","note":"监测血药浓度，避免过量"},
    "莫匹罗星软膏": {"indications":"用于治疗由敏感菌引起的皮肤感染，如脓疱疮、毛囊炎、疖肿、轻中度痤疮及小面积的皮肤溃疡。","ingredients":"莫匹罗星，常见剂型为2%软膏，每支10克或20克。","dosage":"成人每日3次，每次涂抹患处薄层，持续7天或遵医嘱。","adverse":"局部刺激、瘙痒、红斑、灼热感、过敏反应；严重者可能出现全身性过敏、肝功能异常。","contraindications":"对莫匹罗星过敏者禁用；避免与其它外用抗生素同时使用。","storage":"密封，避光，置于阴凉干燥处，温度不超过25℃。","note":"避免接触眼睛和黏膜。"},
    "补中益气丸": {"indications":"用于治疗脾胃虚弱引起的食欲不振、腹胀、腹泻、乏力、气短等症状，以及慢性胃炎、消化性溃疡、肠易激综合征等疾病。","ingredients":"黄芪、党参、白术、陈皮、升麻、柴胡、当归、甘草。常见剂型为水丸，规格为每丸重9g。","dosage":"成人每次6-9g，每日2-3次，饭前服用。","adverse":"常见不良反应包括恶心、呕吐、腹泻、便秘、胃部不适；严重不良反应有肝功能异常、过敏性休克、药物性肝损伤。","contraindications":"对本品过敏者禁用；湿热体质者慎用；与抗酸药同用时需间隔1小时以上。","storage":"密封，置阴凉干燥处保存。","note":"忌食生冷油腻"},
    "达比加群": {"indications":"用于预防心房颤动患者脑卒中和系统性栓塞，治疗深静脉血栓形成和肺栓塞，预防急性冠脉综合征患者发生心血管事件。","ingredients":"达比加群酯，常见剂型规格为110mg和150mg片剂。","dosage":"成人常用剂量为110mg或150mg，每日两次，餐前或餐后服用，具体根据肾功能调整。","adverse":"常见不良反应包括出血、腹泻、恶心；严重不良反应包括颅内出血、严重胃肠道出血。","contraindications":"禁用于有活动性出血、严重肝功能不全、对药物过敏者；禁与CYP3A4强效抑制剂联用。","storage":"密封，在25℃以下干燥处保存。","note":"监测出血风险"},
    "逍遥丸": {"indications":"用于治疗肝郁气滞所致的胁肋胀痛、胃脘疼痛、月经不调、经前紧张综合征及焦虑状态。","ingredients":"柴胡、白芍、当归、川芎、香附、枳壳、甘草。常见剂型规格为浓缩丸，每瓶60粒，每粒重0.3g。","dosage":"口服，一次4-6粒，一日2次，饭后服用。","adverse":"恶心、腹泻、腹胀、皮疹、头晕；严重者可能出现过敏性休克、肝功能异常。","contraindications":"对本品过敏者禁用；孕妇禁用；与抗凝药物合用时需谨慎。","storage":"密封，避光，置阴凉干燥处保存。","note":"孕妇禁用"},
    "金匮肾气丸": {"indications":"用于肾阳不足引起的腰膝酸软、畏寒肢冷、小便频数、夜尿多、阳痿遗精、水肿等症状。适用于慢性肾功能不全、前列腺增生、性功能减退等疾病。","ingredients":"由熟地黄、山茱萸、山药、牡丹皮、桂枝、附子、茯苓、泽泻、牛膝、车前子等组成，常见剂型为水蜜丸，每丸重9克。","dosage":"口服，一次6-9克，一日2次，饭后服用。","adverse":"常见不良反应包括口干、便秘、腹胀、胃部不适；严重不良反应有肝功能异常、肾功能损害、过敏性休克。","contraindications":"阴虚火旺者禁用；与利尿剂、降压药合用时需谨慎，避免电解质紊乱。","storage":"密封，置阴凉干燥处保存。","note":"忌食生冷油腻"},
    "阿托品滴眼液": {"indications":"用于治疗虹膜炎、睫状体炎、角膜炎、青光眼术前散瞳及验光检查。适用于眼部炎症及需要散瞳的诊断和治疗。","ingredients":"主要成分为阿托品，常见剂型规格为0.5%滴眼液。","dosage":"成人每次1-2滴，每日1-3次，根据病情调整，通常在眼科检查或治疗前使用。","adverse":"常见不良反应包括眼胀、视力模糊、头痛、口干；严重不良反应包括心律失常、高热、尿潴留。","contraindications":"对阿托品过敏者禁用；青光眼患者禁用；严重心脏病、前列腺肥大患者慎用。","storage":"遮光，密封，在阴凉处保存，避免儿童接触。","note":"避免接触眼睛以外部位"},
    "阿胶": {"indications":"用于血虚萎黄、眩晕心悸、月经不调、崩漏、肺燥咳嗽、咳血、便血等症。适用于贫血、月经不调、慢性出血性疾病及虚弱体质者。","ingredients":"主要成分为驴皮胶，常见剂型规格为每粒0.3g，每瓶装60粒。","dosage":"成人常用剂量为每次2粒，每日2次，饭后服用。","adverse":"常见不良反应有恶心、胃部不适、腹泻；严重不良反应包括过敏性休克、肝功能异常。","contraindications":"对阿胶过敏者禁用；孕妇慎用；与抗凝药物同用时需谨慎。","storage":"密封，置阴凉干燥处，避光保存。","note":"服用期间忌食生冷油腻"},
    "丁丙诺啡": {"indications":"用于中重度疼痛的治疗，如术后疼痛、癌症相关疼痛、慢性疼痛综合征及严重创伤后疼痛。","ingredients":"主要成分为丁丙诺啡，常见剂型规格包括片剂（5mg/片）、缓释片（10mg/片）和注射液（1mg/ml）。","dosage":"成人常用剂量为每次5-10mg，每日2-3次，饭前或饭后服用，根据疼痛程度调整。","adverse":"常见不良反应包括嗜睡、恶心、便秘；严重不良反应有呼吸抑制、过敏性休克、肝功能异常。","contraindications":"禁用于对丁丙诺啡过敏者、严重呼吸功能不全患者及与单胺氧化酶抑制剂联用者。","storage":"遮光、密封，在阴凉干燥处保存，避免儿童接触。","note":"慎用于肝肾功能不全者"},
    "丁苯酞": {"indications":"用于治疗脑梗死、脑缺血性卒中、短暂性脑缺血发作及脑血管痉挛引起的症状。","ingredients":"丁苯酞，常见剂型为胶囊剂（0.1g/粒）和注射液（2ml:0.2g）。","dosage":"口服，每次0.1g，每日3次；静脉注射，每次0.2g，每日2次，疗程通常为14-28天。","adverse":"常见不良反应包括恶心、胃部不适、头晕、乏力；严重不良反应有肝功能异常、过敏性休克。","contraindications":"对本品过敏者禁用；严重肝肾功能不全患者禁用；与抗凝药物合用时需谨慎。","storage":"密封，在阴凉干燥处保存，避免阳光直射。","note":"定期监测肝功能"},
    "丁酸氢化可的松": {"indications":"用于治疗湿疹、接触性皮炎、过敏性鼻炎、轻中度银屑病及类风湿性关节炎引起的炎症反应。","ingredients":"主要成分为丁酸氢化可的松，常见剂型为乳膏（0.1%）、片剂（10mg）。","dosage":"成人每日2-4次，每次10mg，餐后服用。","adverse":"常见不良反应：局部刺激、皮肤干燥、毛囊炎；严重不良反应：库欣综合征、骨质疏松、免疫抑制。","contraindications":"对糖皮质激素过敏者禁用；严重感染患者慎用，避免与活疫苗同时使用。","storage":"遮光，密封，在阴凉干燥处保存。","note":"长期使用需监测血糖和骨密度。"},
    "丙泊酚": {"indications":"用于全身麻醉诱导和维持，重症监护患者的镇静，以及诊断性检查的镇静。适用于手术麻醉、内镜检查及ICU镇静治疗。","ingredients":"丙泊酚（Propofol），常见剂型为1%注射液，规格为20ml/支、50ml/支。","dosage":"成人诱导麻醉：1.5-2.5mg/kg静脉注射；维持麻醉：20-50μg/kg/min静脉输注，根据需要调整。","adverse":"常见不良反应：低血压、呼吸抑制、恶心呕吐、注射部位疼痛；严重不良反应：过敏反应、心律失常、癫痫发作。","contraindications":"对丙泊酚过敏者禁用；严重心血管疾病患者慎用；与某些药物如抗凝药、镇静药合用时需注意相互作用。","storage":"避光密封，2-8℃冷藏保存，避免冻结。","note":"监测生命体征，防止呼吸抑制。"},
    "乙哌立松": {"indications":"用于治疗胃痉挛、肠易激综合征、胆道痉挛、泌尿道痉挛及术后肠麻痹等疾病。","ingredients":"主要成分为乙哌立松，常见剂型为片剂（50mg/100mg）和注射剂（50mg/2ml）。","dosage":"成人常用剂量为每次50-100mg，每日3次，餐前或睡前服用。","adverse":"常见不良反应包括恶心、呕吐、腹泻、头痛；严重不良反应有肝功能异常、过敏性休克。","contraindications":"对本品过敏者禁用；严重肝肾功能不全患者禁用；与某些抗胆碱药合用时需慎用。","storage":"遮光、密封，在阴凉干燥处保存。","note":"避免长期使用"},
    "乙胺嗪": {"indications":"用于治疗丝虫病（如班氏丝虫、马来丝虫感染）、淋巴丝虫病及盘尾丝虫病。也可用于治疗旋毛虫病和某些寄生虫引起的水肿。","ingredients":"主要成分为乙胺嗪，常见剂型为片剂，规格为50mg/片。","dosage":"成人常用剂量为每日2次，每次50mg，疗程一般为1-2周，饭后服用。","adverse":"常见不良反应包括恶心、呕吐、头晕、乏力；严重不良反应有呼吸困难、过敏性休克、肝功能异常。","contraindications":"对乙胺嗪过敏者禁用；严重肝肾功能不全患者禁用；与某些抗寄生虫药物存在相互作用，应避免同时使用。","storage":"遮光，密封，在阴凉干燥处保存。","note":"用药期间注意监测肝肾功能。"},
    "乙酰胂胺": {"indications":"用于治疗由敏感菌株引起的尿路感染、皮肤软组织感染、呼吸道感染及肠道感染。适用于大肠杆菌、金黄色葡萄球菌等所致的轻中度感染。","ingredients":"主要成分为乙酰胂胺，常见剂型为片剂，规格为0.2g/片。","dosage":"成人常用剂量为每次0.2g，每日3次，餐后服用，疗程一般为7-14天。","adverse":"常见不良反应包括恶心、呕吐、腹泻、皮疹；严重不良反应有肝功能异常、过敏性休克、血液系统异常。","contraindications":"对乙酰胂胺过敏者禁用；严重肝肾功能不全患者禁用；与某些抗生素（如头孢类）合用时需避免使用。","storage":"密封，在阴凉干燥处保存，避免阳光直射。","note":"定期监测肝肾功能"},
    "亚甲蓝": {"indications":"用于治疗亚硝酸盐中毒、氰化物中毒及某些类型的细菌感染，如尿路感染和皮肤感染。也用于诊断性染色，如检测尿液中的葡萄糖。","ingredients":"主要成分为亚甲蓝，常见剂型规格为1%注射液（10ml/支）和2%片剂（50mg/片）。","dosage":"成人静脉注射常用剂量为1-2mg/kg，必要时可重复使用；口服剂量为50-100mg/次，每日3次。","adverse":"常见不良反应包括恶心、呕吐、腹泻、头痛；严重不良反应包括高铁血红蛋白血症、溶血性贫血、过敏性休克。","contraindications":"禁用于对亚甲蓝过敏者、葡萄糖-6-磷酸脱氢酶缺乏症患者；避免与氧化剂类药物同时使用。","storage":"遮光、密封，在阴凉干燥处保存，避免冻结。","note":"慎用于肝肾功能不全者"},
    "他克莫司": {"indications":"用于预防器官移植后的排斥反应，治疗类风湿性关节炎、特应性皮炎及系统性红斑狼疮等自身免疫性疾病。","ingredients":"他克莫司，常见剂型规格为40μg/片、50μg/片、100μg/片。","dosage":"成人常用剂量为0.05-0.1mg/kg/日，分两次服用，空腹或餐后服用，需根据血药浓度调整。","adverse":"常见不良反应包括高血压、腹泻、头痛和肾功能异常；严重不良反应有肝功能异常、感染风险增加和神经毒性。","contraindications":"对本品过敏者禁用；与强效CYP3A4抑制剂合用时禁用；孕妇及哺乳期妇女慎用。","storage":"遮光，密封，在25℃以下干燥处保存。","note":"监测肝肾功能"},

    "伯氨喹": {"indications":"用于疟疾的预防和治疗，特别是间日疟和恶性疟；也用于疟原虫感染的根治治疗；还可用于肺孢子虫肺炎的预防。","ingredients":"主要成分为伯氨喹，常见剂型为片剂，规格为15mg/片、30mg/片。","dosage":"成人常用剂量为每日15-30mg，分1-2次服用，疗程根据病情调整，通常在医生指导下使用。","adverse":"常见不良反应包括恶心、呕吐、腹痛、头痛；严重不良反应有溶血性贫血、高铁血红蛋白血症。","contraindications":"禁用于葡萄糖-6-磷酸脱氢酶缺乏者、孕妇（尤其是妊娠早期）及与某些药物（如奎宁）联用时禁用。","storage":"遮光、密封，在阴凉干燥处保存。","note":"避免与奎宁同用"},
    "依托咪酯": {"indications":"用于全身麻醉诱导，适用于心脏手术、腹部手术及需要快速诱导的患者。也用于诊断性检查的镇静，如支气管镜检查和内窥镜检查。","ingredients":"依托咪酯（Etomidate），常见剂型为注射用乳剂，规格为20mg/2ml或40mg/4ml。","dosage":"成人静脉注射，诱导剂量通常为0.15-0.3mg/kg，根据患者情况调整，术中可追加0.05-0.1mg/kg。","adverse":"常见不良反应包括恶心、呕吐、肌阵挛、注射部位疼痛；严重不良反应包括肾上腺皮质功能抑制、癫痫发作、呼吸抑制。","contraindications":"对依托咪酯过敏者禁用；严重肝肾功能不全患者慎用；与某些药物如丙泊酚、阿片类药物合用时需注意相互作用。","storage":"避光、密闭，在2-8℃冷藏保存，避免冻结。","note":"监测生命��征，避免过量"},
    "依托考昔": {"indications":"用于治疗骨关节炎、类风湿性关节炎、强直性脊柱炎、急性痛风性关节炎及术后疼痛。","ingredients":"依托考昔，常见剂型规格为12.5mg、25mg片剂。","dosage":"成人常用剂量为每日1次，每次12.5-25mg，餐后服用。","adverse":"常见不良反应包括胃肠道不适、头痛、水肿；严重不良反应有心血管事件、肝功能异常。","contraindications":"对依托考昔过敏者禁用；与抗凝药物合用时需谨慎。","storage":"密封，避光，贮于30℃以下干燥处。","note":"定期监测肝肾功能"},
    "依维莫司": {"indications":"用于治疗晚期肾细胞癌、不可切除的或转移性脂肪肉瘤、以及某些类型的血管平滑肌脂肪瘤。适用于接受过手术的成人患者，以及某些特定类型的乳腺癌。","ingredients":"依维莫司（Everolimus），常见剂型为片剂，规格包括2.5mg、5mg、10mg。","dosage":"成人常用剂量为每天一次，每次10mg，空腹或餐后服用，具体需根据医生指导调整。","adverse":"常见不良反应包括口腔炎、皮疹、腹泻、疲劳和水肿；严重不良反应包括间质性肺炎、感染和出血风险增加。","contraindications":"对依维莫司过敏者禁用；与强效CYP3A4抑制剂合用时禁用；孕妇禁用。","storage":"密封，避光，于25°C以下干燥处保存。","note":"定期监��肝功能"},
    "倍他司汀": {"indications":"用于治疗眩晕症、梅尼埃病、前庭功能障碍、耳鸣及头晕症状，改善内耳循环障碍。","ingredients":"主要成分为倍他司汀，常见剂型规格为片剂（10mg/片）和注射液（20mg/2ml）。","dosage":"成人常用剂量为每次10-20mg，每日3次，餐后服用。","adverse":"常见不良反应包括恶心、胃部不适、头痛、嗜睡；严重不良反应有心律失常、过敏性休克、肝功能异常。","contraindications":"对本品过敏者禁用；与抗组胺药合用时需谨慎，避免加重中枢抑制。","storage":"遮光、密封，在阴凉干燥处保存，避免高温和潮湿。","note":"避免驾驶或操作机械"},
    "倍氯米松": {"indications":"用于治疗支气管哮喘、过敏性鼻炎、慢性阻塞性肺疾病、皮肤炎症及过敏性结膜炎等疾病。","ingredients":"主要成分为倍氯米松，常见剂型规格为吸入用气雾剂（50μg/喷）、片剂（250μg/片）。","dosage":"成人常用剂量为每次1-2喷，每日2次，饭前或饭后均可服用。","adverse":"常见不良反应包括口干、喉咙刺激、咳嗽、口腔念珠菌感染；严重不良反应有骨质疏松、肾上腺功能抑制、高血压。","contraindications":"对本品过敏者禁用；与某些抗真菌药（如酮康唑）合用时需避免。","storage":"密封，避光，置于阴凉干燥处，温度不超过25℃。","note":"长期使用需监测副作用"},
    "利多卡因": {"indications":"用于治疗室性心律失常、局部麻醉、心脏手术前预防心律失常、急性心肌梗死后的心律失常、癫痫持续状态的辅助治疗。","ingredients":"主要成分为利多卡因，常见剂型规格为5%注射液（10ml/支）、1%注射液（20ml/支）。","dosage":"静脉注射：每次1-1.5mg/kg，最大不超过3mg/kg；口服：每次100-200mg，每日3次，餐后服用。","adverse":"常见不良反应：头晕、嗜睡、恶心、呕吐；严重不良反应：心律失常、惊厥、呼吸抑制。","contraindications":"对利多卡因过敏者禁用；严重心动过缓、心脏传导阻滞患者禁用；与奎尼丁合用时禁用。","storage":"遮光，密闭，在阴凉干燥处保存，避免高温和阳光直射。","note":"监测心电图和血药浓度。"},
    "利格列汀": {"indications":"用于2型糖尿病患者的血糖控制，适用于单用二甲双胍疗效不佳时的联合治疗，以及作为饮食和运动的辅助治疗。适用于需要减少血糖波动的患者，也可用于改善胰岛功能不足的情况。","ingredients":"利格列汀，常见剂型为片剂，规格为5mg/片。","dosage":"成人常用剂量为每日一次，每次5mg，餐前或餐后均可服用，无需根据进食调整剂量。","adverse":"常见不良反应包括头痛、腹泻、恶心；严重不良反应包括低血糖、肝功能异常、过敏反应。","contraindications":"对利格列汀过敏者禁用；严重肝功能不全患者禁用；与强效CYP3A4抑制剂联用时禁用。","storage":"密封，在阴凉干燥处保存，避免阳光直射。","note":"监测肝功能"},
    "加兰他敏": {"indications":"用于治疗阿尔茨海默病、帕金森病痴呆、血管性痴呆及轻度认知障碍。也可用于改善记忆功能和认知能力。","ingredients":"加兰他敏，常见剂型为片剂（5mg、10mg）和缓释胶囊（8mg、16mg）。","dosage":"成人起始剂量5mg/���，分2次服用；最大剂量不超过10mg/日，餐后服用。","adverse":"常见不良反应包括恶心、呕吐、腹泻、头痛和乏力；严重不良反应有心律失常、癫痫发作和肝功能异常。","contraindications":"对加兰他敏过敏者禁用；与胆碱酯酶抑制剂合用时需谨慎；孕妇及哺乳期妇女禁用。","storage":"密封，避光，干燥处保存，温度不超过25℃。","note":"定期监测肝功能"},
    "卡托普利": {"indications":"用于治疗高血压、心力衰竭、冠心病、糖尿病肾病及左心室功能不全。适用于伴有蛋白尿的糖尿病患者。","ingredients":"主要成分为卡托普利，常见剂型规格为12.5mg、25mg、50mg片剂。","dosage":"成人常用剂量为12.5mg每日1-2次，根据血压调整，餐前1小时服用。","adverse":"常见不良反应包括咳嗽、头晕、乏力、低血压和味觉异常；严重不良反应有高钾血症、肾功能损害和血管性水肿。","contraindications":"禁用于妊娠期妇女、双侧肾动脉狭窄患者及对本品过敏者。与含锂药物、保钾利尿剂合用需谨慎。","storage":"遮光，密封，在阴凉干燥处保存。","note":"监测血压和肾功能"},
    "卡格列净": {"indications":"用于治疗2型糖尿病患者的高血糖，改善心血管结局，降低心力衰竭住院风险，减少慢性肾病进展，控制体重。","ingredients":"主要成分为卡格列净，常见剂型规格为100mg/片、200mg/片。","dosage":"成人常用剂量为100mg或200mg，每日一次，餐前或餐后服用，根据肾功能调整剂量。","adverse":"常见不良反应包括尿路感染、生殖器真菌感染、腹泻；严重不良反应包括急性肾损伤、骨折风险增加。","contraindications":"禁用于严重肾功能不全患者（eGFR<30ml/min/1.73m²）、对药物过敏者及妊娠期女性。避免与强效CYP3A4抑制剂联用。","storage":"密封，在25℃以下干燥处保存。","note":"监测肾功能和电解质"},
    "卤米松": {"indications":"用于治疗湿疹、接触性皮炎、神经性皮炎、脂溢性皮炎及过敏性鼻炎等炎症性皮肤病。","ingredients":"主要成分为卤米松，常见剂型规格为0.05%乳膏剂（10g/支）和软膏剂（15g/支）。","dosage":"成人每日2次，每次适量涂抹于患处，避免长期大面积使用。","adverse":"常见不良反应包括皮肤刺激、瘙痒、干燥、烧灼感；严重不良反应有皮肤萎缩、毛细血管扩张、继发感染。","contraindications":"对卤米松过敏者禁用；禁用于皮肤结核、梅毒、病毒感染患者；与其他糖皮质激素类药物存在相互作用。","storage":"遮光，密闭，在25℃以下干燥处保存。","note":"避免接触眼睛和黏膜"},
    "可乐定": {"indications":"用于治疗高血压、注意缺陷多动障碍（ADHD）、嗜铬细胞瘤术前控制血压、阿片类药物戒断症状及偏头痛预防。","ingredients":"可乐定，常见剂型规格为0.075mg/片、0.1mg/片、0.2mg/片。","dosage":"成人常用剂量为每日0.1-0.4mg，分2次服用，通常在早晨和睡前服用。","adverse":"常见不良反应包括嗜睡、口干、便秘、头晕、疲劳；严重不良反应有心动过缓、低血压、肝功能异常。","contraindications":"禁用于严重心动过缓、病态窦房结综合征、重度高血压危象患者；与中枢抑制剂合用时需谨慎。","storage":"遮光，密封，在阴凉干燥处保存。","note":"监测血压和心率"},
    "右美托咪定": {"indications":"用于手术中镇静、重症监护患者的镇静、术前诱导麻醉、术后镇痛及心血管手术中的血流动力学稳定。适用于成人和儿童患者。","ingredients":"右美托咪定，常见剂型为注射液，规格包括100μg/5ml、200μg/10ml等。","dosage":"成人常用剂量为0.5-1.5μg/kg静脉注射，术中持续输注0.2-0.7μg/kg/h，术前30分钟给药。","adverse":"常见不良反应包括低血压、心动过缓、嗜睡、恶心、头痛；严重不良反应包括心律失常、呼吸抑制、过敏反应。","contraindications":"禁用于对右美托咪定过敏者，禁与CYP2A6抑制剂合用，禁用于严重心脏疾病或严重肝功能不全患者。","storage":"遮光、密闭保存，温度不超过25℃，避免冻结。","note":"监测生命体征，避免过量"},
    "司美格鲁肽": {"indications":"用于治疗2型糖尿病患者的血糖控制；用于肥胖或超重患者的体重管理；用于改善胰岛功能；用于降低心血管事件风险；用于辅助减肥治疗。","ingredients":"主要成分为司美格鲁肽，常见剂型规格为5mg/0.5ml、10mg/0.5ml、25mg/0.5ml注射液。","dosage":"成人起始剂量为0.25mg每周一次，4周后增至0.5mg每周一次，最大剂量不超过2mg每周一次，建议在每周固定时间皮下注射。","adverse":"常见不良反应包括恶心、腹泻、呕吐、便秘、食欲减退；严重不良反应包括甲状腺肿瘤风险、急性胰腺炎、严重低血糖。","contraindications":"对药物成分过敏者禁用；有甲状腺髓样癌个人或家族史者禁用；与GLP-1受体激动剂类药物联用时禁用。","storage":"未开封药品应冷藏于2-8℃，已开封药品可在室温下保存，避免阳光直射。","note":"监测血糖及甲状腺功能"},
    "吗啡": {"indications":"用于治疗中重度疼痛，如术后疼痛、癌症疼痛、严重创伤疼痛及心肌梗死胸痛。适用于其他镇痛药无效的急性疼痛和慢性疼痛患者。","ingredients":"吗啡盐酸盐，常见剂型规格为5mg/ml注射液、10mg/片口服片剂、5mg/ml缓释片。","dosage":"成人常用剂量为每次5-10mg，每4小时一次，或根据疼痛程度调整，需在医生指导下使用。","adverse":"常见不良反应包括恶心、呕吐、便秘、嗜睡；严重不良反应有呼吸抑制、过敏性休克、药物依赖性。","contraindications":"禁用于对吗啡过敏者、严重呼吸功能不全者、急性酒精中毒者及与单胺氧化酶抑制剂合用者。","storage":"遮光，密封，在阴凉干燥处保存，避免儿童接触。","note":"严格遵医嘱，防止成瘾"},
    "吗替麦考酚酯": {"indications":"用于预防器官移植后的排斥反应，治疗系统性红斑狼疮、类风湿关节炎及狼疮性肾炎等自身免疫性疾病。","ingredients":"吗替麦考酚酯，常见剂型为片剂（500mg/片）和胶囊（250mg/粒）。","dosage":"成人常用剂量为每日1-2g，分两次服用，餐后或空腹服用均可。","adverse":"常见不良反应包括腹泻、恶心、呕吐；严重不良反应有骨髓抑制、感染风险增加及肝功能异常。","contraindications":"对药物成分过敏者禁用；与活疫苗同时使用时禁用；严重肝肾功能不全患者禁用。","storage":"密封，在阴凉干燥处保存，避免阳光直射。","note":"定期监测血常规和肝肾功能。"},
    "吡喹酮": {"indications":"用于治疗血吸虫病、钩虫病、蛔虫病、蛲虫病及绦虫病，适用于肝吸虫感染和肺吸虫感染的治疗。","ingredients":"主要成分为吡喹酮，常见剂型为片剂（每片25mg、50mg）和口服液（每毫升含10mg）。","dosage":"成人常用剂量为每次25mg，每日3次，连服2天；或单次剂量50mg，根据病情调整。","adverse":"常见不良反应包括头晕、恶心、乏力、腹痛和皮疹；严重不良反应有惊厥、心律失常和过敏性休克。","contraindications":"对本品过敏者禁用；孕妇及哺乳期妇女慎用；与抗凝血药合用时需谨慎。","storage":"遮光，密封，在阴凉干燥处保存。","note":"避免与酒精同服"},
    "吡拉西坦": {"indications":"用于改善脑血管疾病引起的记忆障碍、脑外伤后遗症、阿尔茨海默病及脑卒中后认知功能障碍。亦可用于儿童注意力缺陷多动障碍的辅助治疗。","ingredients":"主要成分为吡拉西坦，常见剂型规格为0.4g/片、0.8g/片及注射液5ml:1g。","dosage":"成人常用剂量为每次0.8-1.6g，每日3次，餐后服用。","adverse":"常见不良反应包括恶心、呕吐、腹泻、头晕和皮疹；严重不良反应有肝功能异常和过敏性休克。","contraindications":"对本品过敏者禁用；严重肝肾功能不全患者禁用；与抗凝血药合用时需谨慎。","storage":"密封，在阴凉干燥处保存，避免阳光直射。","note":"定期检查肝肾功能"},
    "吡美莫司": {"indications":"用于治疗轻中度特应性皮炎（湿疹）、接触性皮炎、脂溢性皮炎及瘙痒症。适用于成人及儿童患者。","ingredients":"吡美莫司，常见剂型为乳膏剂，规格为0.1%（10mg/g）。","dosage":"成人每日2次，每次涂抹患处薄层，持续使用不超过6周。","adverse":"常见不良反应包括局部烧灼感、刺痛、瘙痒和红斑；严重不良反应包括过敏性休克、严重皮肤刺激和继发感染。","contraindications":"对吡美莫司过敏者禁用；避免与强效CYP3A4抑制剂联用。","storage":"密封，避光，置于阴凉干燥处，温度不超过25℃。","note":"避免接触眼睛和黏膜"},

    "哌甲酯": {"indications":"用于治疗注意力缺陷多动障碍（ADHD）、发作性睡病、抑郁症伴发的嗜睡症及帕金森病相关的精神抑制状态。","ingredients":"主要成分为哌甲酯，常见剂型规格为10mg/片、20mg/片。","dosage":"成人常用剂量为每日10-60mg，分次服用，通常于早晨或中午服用。","adverse":"常见不良反应包括失眠、食欲减退、心悸、头痛和恶心；严重不良反应包括高血压、心律失常和精神症状加重。","contraindications":"禁用于对哌甲酯过敏者、严重动脉硬化患者、甲状腺功能亢进患者及正在使用单胺氧化酶抑制剂的患者。","storage":"遮光、密封，在阴凉干燥处保存。","note":"避免长期使用，定期监测血压"},
    "喷托维林": {"indications":"用于缓解支气管哮喘、慢性支气管炎、肺气肿等呼吸系统疾病引起的咳嗽及痰多症状，也可用于急性咽喉炎和过敏性鼻炎的辅助治疗。","ingredients":"主要成分为喷托维林，常见剂型为片剂（25mg/片）和糖浆（100ml:1g）。","dosage":"成人常用剂量为每次25-50mg，每日3次，饭后服用。","adverse":"常见不良反应包括口干、恶心、头晕；严重不良反应有心律失常、呼吸困难、过敏性休克。","contraindications":"对本品过敏者禁用；严重心脏病患者、青光眼患者禁用；与抗胆碱药合用时需谨慎。","storage":"密封，避光，置于阴凉干燥处，温度不超过25℃。","note":"避免长期使用"},
    "地屈孕酮": {"indications":"用于治疗黄体功能不全引起的先兆流产、习惯性流产、月经不调、经前期综合征及子宫内膜异位症。","ingredients":"地屈孕酮，常见剂型规格为10mg/片、20mg/片。","dosage":"成人��用剂量为每日10-20mg，分1-2次服用，通常在月经周期第16-25天使用。","adverse":"常见不良反应包括恶心、乳房胀痛、头痛、水肿；严重不良反应有肝功能异常、血栓形成风险。","contraindications":"禁用于已知对地屈孕酮过敏者、严重肝肾功能不全患者及妊娠期妇女。与抗凝药物合用时需谨慎。","storage":"遮光、密封，在阴凉干燥处保存，避免受潮。","note":"定期监测肝功能"},
    "地氯雷他定": {"indications":"用于治疗过敏性鼻炎、慢性特发性荨麻疹、湿疹、皮肤瘙痒症及过敏性结膜炎等过敏性疾病。","ingredients":"主要成分为地氯雷他定，常见剂型规格为5mg/片、10mg/片。","dosage":"成人常用剂量为每日一次，每次5-10mg，餐前或餐后均可服用。","adverse":"常见不良反应包括嗜睡、口干、头晕、乏力和胃肠道不适；严重不良反应有肝功能异常、过敏性休克和心律失常。","contraindications":"对本品过敏者禁用；严重肝功能不全患者禁用；与某些抗心律失常药物合用时需避免使用。","storage":"遮光、密封，在阴凉干燥处保存，避免受潮。","note":"避免驾驶或操作机械"},
    "复合维生素B": {"indications":"用于治疗维生素B1、B2、B6缺乏引起的脚气病、口角炎、脂溢性皮炎、妊娠期恶心呕吐及神经炎。","ingredients":"含维生素B1（盐酸硫胺）、维生素B2（核黄素）、维生素B6（盐酸吡哆醇），常见剂型为片剂，规格为每片含B1 10mg、B2 5mg、B6 5mg。","dosage":"成人每次1-2片，每日3次，餐后服用。","adverse":"常见不良反应有恶心、胃部不适、腹泻；严重不良反应包括过敏性休克、肝功能异常。","contraindications":"对本品成分过敏者禁用；与抗酸药同服可能影响吸收，需间隔2小时以上。","storage":"密封，在阴凉干燥处保存。","note":"避免长期过量服用"},
    "复方甘草制剂": {"indications":"用于治疗支气管炎、咽喉炎、肺炎、哮喘及慢性阻塞性肺疾病引起的咳嗽和痰多症状。","ingredients":"主要成分包括甘草流浸膏、氯化铵、薄荷脑，常见剂型为片剂（10mg/片）和糖浆（100ml/瓶）。","dosage":"成人每次1-2片，每日3次，饭后服用。","adverse":"不良反应：恶心、胃部不适、口干、头晕、皮疹；严重不良反应：过敏性休克、肝功能异常、肾功能损害。","contraindications":"对本品过敏者禁用；孕妇及哺乳期妇女慎用；与降压药合用时需谨慎。","storage":"密封，避光，置阴凉干燥处保存。","note":"避免长期使用"},
    "复方谷氨酰胺": {"indications":"用于治疗肠易激综合征、炎症性肠病、胃肠道术后恢复、放射性肠炎及营养不良引起的腹泻。","ingredients":"复方谷氨酰胺，常见剂型规格为胶囊剂（每粒含L-谷氨酰胺500mg、维生素B6 10mg）。","dosage":"成人每次2粒，每日3次，餐后服用。","adverse":"常见不良反应包括恶心、腹胀、便秘；严重不良反应有肝功能异常、过敏性休克。","contraindications":"对本品成分过敏者禁用；严重肝肾功能不全患者禁用；与抗凝药物合用时需谨慎。","storage":"密封，在阴凉干燥处保存，避免阳光直射。","note":"避免与抗凝药同用"},
    "多奈哌齐": {"indications":"用于治疗阿尔茨海默病引起的轻中度认知功能障碍；改善帕金森病患者的认知症状；缓解血管性痴呆的认知退化；辅助治疗脑外伤后认知功能障碍；改善老年性痴呆患者的记忆和思维能力。","ingredients":"多奈哌齐，常见剂型规格为5mg/片、10mg/片","dosage":"成人常用剂量为每日5mg，晚间服用；根据病情可增至10mg/日，需在医生指导下调整","adverse":"常见不良反应包括恶心、腹泻、失眠、肌肉痉挛、疲劳；严重不良反应有癫痫发作、肝功能异常、心动过缓","contraindications":"对本品过敏者禁用；严重肝功能不全患者禁用；与CYP3A4强抑制剂合用时禁用","storage":"密封，避光，干燥处保存，温度不超过25℃","note":"定期监测肝功能"},
    "夫西地酸": {"indications":"用于治疗敏感菌引起的皮肤和软组织感染，如毛囊炎、疖肿、脓疱病、轻中度痤疮及外耳道炎。","ingredients":"主要成分为夫西地酸，常见剂型包括软膏（1%）、乳膏（1%）及滴耳液（0.5%）。","dosage":"成人每日2-3次，每次涂抹患处，疗程一般不超过2周。","adverse":"常见不良反应包括局部刺激、瘙痒、红斑；严重不良反应有接触性皮炎、过敏性休克。","contraindications":"对夫西地酸过敏者禁用；与某些抗生素联用可能增加不良反应风险。","storage":"密封，避光，置阴凉干燥处，温度不超过25℃。","note":"避免接触眼睛和黏膜。"},

    "屈螺酮": {"indications":"用于治疗经前期综合征、功能性子宫出血、痛经及子宫内膜异位症引起的疼痛。适用于月经不调和更年期症状的缓解。","ingredients":"主要成分为屈螺酮，常见剂型为片剂，规格为0.125mg/片。","dosage":"成人常用剂量为每日0.125mg，于月经周期第5天开始服用，连续服用21天。","adverse":"常见不良反应包括乳房胀痛、恶心、头痛、体重增加和情绪波动；严重不良反应可能有血栓形成、肝功能异常。","contraindications":"禁用于妊娠期妇女、已知或疑似乳腺癌患者、严重肝病患者及对药物成分过敏者。避免与CYP3A4强效抑制剂联用。","storage":"密封，避光，置于阴凉干燥处，温度不超过25℃。","note":"定期检查肝功能"},

    "干扰素α": {"indications":"用于治疗慢性乙型肝炎、慢性丙型肝炎、毛细胞白血病、多发性硬化症及某些类型的皮肤T细胞淋巴瘤。","ingredients":"干扰素α（如α-2a或α-2b），常见剂型为注射用冻干粉，规格为300万IU/支。","dosage":"成人常用剂量为每周3次，每次300万IU，于早晨皮下注射。","adverse":"常见不良反应包括发热、乏力、肌肉疼痛、头痛和食欲减退；严重不良反应有骨髓抑制、自身免疫性溶血性贫血和精神症状。","contraindications":"对干扰素过敏者禁用；与活疫苗同时使用时禁用；严重心脏病或癫痫患者慎用。","storage":"避光、密闭，在2-8℃冷藏条件下保存。","note":"监测血常规和肝功能。"},

    "托卡朋": {"indications":"用于治疗高血压、冠心病、心绞痛、慢性心力衰竭及心律失常。适用于需长期控制血压和改善心脏功能的患者。","ingredients":"主要成分为托卡朋，常见剂型为片剂，规格为50mg/片。","dosage":"成人常用剂量为每日2次，每次50mg，餐后服用，具体剂量需根据病情调整。","adverse":"常见不良反应包括头晕、恶心、乏力、腹泻和水肿；严重不良反应有肝功能异常、过敏性休克和心律失常。","contraindications":"对托卡朋过敏者禁用；与某些抗凝药物合用时禁用；严重肝肾功能不全患者禁用。","storage":"密封，避光，干燥处保存，温度不超过25℃。","note":"定期监测肝功能"},
    "托烷司琼": {"indications":"用于治疗化疗引起的恶心呕吐、手术后恶心呕吐、放射治疗引起的恶心呕吐及胃食管反流病引起的恶心呕吐。","ingredients":"主要成分为托烷司琼，常见剂型规格为5mg/1ml注射液和50mg/片口服片剂。","dosage":"成人常用剂量为5mg，静脉注射或口服，术前30分钟给药，必要时可重复使用。","adverse":"常见不良反应包括便秘、头痛、疲劳、头晕、腹痛；严重不良反应有心律失常、过敏性休克、肝功能异常。","contraindications":"对托烷司琼过敏者禁用，与某些抗心律失常药物合用时需谨慎。","storage":"遮光、密封，在25℃以下干燥处保存。","note":"避免与特定药物合用"},
    "托特罗定": {"indications":"用于治疗膀胱过度活动症引起的尿频、尿急、急迫性尿失禁，以及神经源性膀胱功能障碍导致的尿潴留和排尿困难。","ingredients":"托特罗定盐酸盐，常见剂型为片剂（2mg/片）和缓释片（4mg/片）。","dosage":"成人常用剂量为每次2mg，每日2次，饭前或饭后服用，具体遵医嘱。","adverse":"常见不良反应包括口干、便秘、头晕、视物模糊；严重不良反应有尿潴留、心律失常、过敏性休克。","contraindications":"禁用于对托特罗定过敏者、重症肌无力患者、幽门十二指肠梗阻患者，禁与强效CYP3A4抑制剂合用。","storage":"密封，在阴凉干燥处保存，避免阳光直射。","note":"用药期间避免驾驶或操作机械。"},
    "普拉克索": {"indications":"用于治疗帕金森病、特发性震颤、多系统萎缩引起的运动障碍、药物性帕金森综合征及睡眠呼吸暂停综合征相关运动障碍。","ingredients":"普拉克索，常见剂型规格为0.125mg、0.25mg、0.5mg片剂及0.125mg/ml口服液。","dosage":"成人起始剂量为0.125mg每日两次，逐渐增加至0.5mg每日三次，餐前或餐后服用。","adverse":"常见不良反应包括恶心、头晕、嗜睡、便秘和幻觉；严重不良反应有低血压、心律失常和精神症状加重。","contraindications":"对普拉克索过敏者禁用；与单胺氧化酶抑制剂合用时禁用；妊娠期及哺乳期妇女慎用。","storage":"遮光、密封，在25℃以下干燥处保存。","note":"��期监测肝功能"},
    "曲安奈德": {"indications":"用于治疗过敏性鼻炎、哮喘、湿疹、银屑病及类风湿性关节炎等炎症性疾病。适用于局部或全身性炎症反应的控制。","ingredients":"曲安奈德（Triamcinolone Acetonide），常见剂型包括片剂（4mg）、注射剂（20mg/ml）和外用乳膏（0.1%）。","dosage":"成人常用剂量为每日4-8mg，分1-2次服用，饭后服用以减少胃部刺激。","adverse":"常见不良反应包括胃部不适、头痛、水肿、皮肤瘙痒；严重不良反应有肝功能异常、高血糖、骨质疏松。","contraindications":"对曲安奈德过敏者禁用；严重感染患者禁用；与某些抗凝药物合用时需谨慎。","storage":"遮光，密封，在阴凉干燥处保存，避免儿童接触。","note":"定期监测肝肾功能"},
    "替格瑞洛": {"indications":"用于急性冠脉综合征患者，包括不稳定型心绞痛、非ST段抬高型心肌梗死和接受经皮冠状动脉介入治疗的患者，以降低血栓事件风险。","ingredients":"替格瑞洛，常见剂型为片剂，规格为60mg和120mg。","dosage":"成人常用剂量为120mg，每日两次，首剂可给予180mg。餐前或餐后服用，需与氯吡格雷联合使用时应遵医嘱。","adverse":"常见不良反应包括出血、头痛、腹泻；严重不良反应包括严重出血、过敏反应和肝功能异常。","contraindications":"对替格瑞洛过敏者禁用；与强效CYP3A抑制剂合用时禁用；严重肝功能不全患者禁用。","storage":"密封，在阴凉干燥处保存，避免潮湿和高温。","note":"注意出血风险"},
    "替硝唑": {"indications":"用于治疗牙周感染、盆腔炎、阑尾炎、腹腔感染及厌氧菌引起的败血症等疾病。","ingredients":"主要成分为替硝唑，常见剂型规格为0.5g片剂、1g片剂。","dosage":"成人常用剂量为每次0.5g，每日2次，餐后服用。","adverse":"常见不良反应包括恶心、呕吐、腹泻、头痛和味觉异常；严重不良反应有癫痫发作、过敏性休克和血液系统异常。","contraindications":"对本品过敏者禁用；与酒精同时使用可能引起双硫仑样反应；与华法林合用可能增强抗凝作用。","storage":"密封，在阴凉干燥处保存，避免阳光直射。","note":"避免饮酒"},
    "替诺福韦": {"indications":"用于治疗慢性乙型肝炎病毒感染，抑制病毒复制；用于艾滋病病毒（HIV-1）感染的联合抗逆转录病毒治疗；用于预防HIV-1母婴传播；用于治疗乙型肝炎病毒和HIV-1共同感染患者。","ingredients":"替诺福韦二吡呋酯，常见剂型规格为300mg片剂和1%乳液。","dosage":"成人每日一次，每次300mg，空腹或餐后服用，需与其它抗病毒药物联用。","adverse":"常见腹泻、恶心、头痛、疲劳、皮疹；严重肾功能损害、骨质疏松、乳酸酸中毒、肝脂肪变性。","contraindications":"对替诺福韦过敏者禁用；与阿德福韦酯合用禁用；严重肾功能不全患者禁用。","storage":"遮光，密封，在25°C以下干燥处保存。","note":"监测肾功能"},
    "来氟米特": {"indications":"用于类风湿关节炎、系统性红斑狼疮、银屑病关节炎、进行性系统性硬化症及某些自身免疫性皮肤病的治疗。","ingredients":"主要成分为来氟米特，常见剂型规格为10mg/片、20mg/片。","dosage":"成人常用剂量为10-20mg/日，通常在早晨服用，需根据病情调整剂量。","adverse":"常见不良反应包括腹泻、恶心、肝功能异常、皮疹和脱发；严重不良反应有肝毒性、骨髓抑制和间质性肺炎。","contraindications":"对本品过敏者禁用；孕妇、哺乳期妇女及严重肝肾功能不全者禁用；与某些药物如华法林存在相互作用。","storage":"密封，在阴凉干燥处保存，避免阳光直射。","note":"定期监测肝功能"},
    "来那度胺": {"indications":"多发性骨髓瘤、骨髓增生异常综合征、套细胞淋巴瘤、滤泡性淋巴瘤、慢性淋巴细胞白血病。","ingredients":"来那度胺，常见剂型规格为25mg、10mg、5mg胶囊。","dosage":"成人常用剂量为25mg每日一次，空腹或餐后服用，具体根据病情调整。","adverse":"常见不良反应包括贫血、腹泻、疲劳、便秘、皮疹；严重不良反应包括深静脉血栓、肺栓塞、感染。","contraindications":"对来那度胺过敏者禁用，孕妇及可能怀孕的女性禁用，与强效CYP3A4抑制剂合用时禁用。","storage":"密封，避光，贮存于25℃以下干燥处。","note":"避免怀孕，定期监测血象"},
    "柳氮磺吡啶": {"indications":"用于治疗类风湿性关节炎、强直性脊柱炎、溃疡性结肠炎及克罗恩病等炎症性肠道疾病。","ingredients":"柳氮磺吡啶，常见剂型为片剂（500mg/片）和缓释片（1g/片）。","dosage":"成人常用剂量为每日2-3g，分2-3次服用，餐后服用以减少胃肠道刺激。","adverse":"常见不良反应包括恶心、呕吐、皮疹、腹泻；严重不良反应有溶血性贫血、粒细胞减少、肝功能异常。","contraindications":"对磺胺类药物过敏者禁用，严重肝肾功能不全者禁用，与甲氨蝶呤合用时需避免。","storage":"遮光，密封，在阴凉干燥处保存。","note":"定期检查血常规和肝功能。"},
    "格列喹酮": {"indications":"用于治疗2型糖尿病患者的高血糖，适用于胰岛β细胞功能尚存的患者。也可用于妊娠期糖尿病及糖尿病合并轻中度肾功能不全者。","ingredients":"主要成分为格列喹酮，常见剂型规格为50mg片剂。","dosage":"成人常用剂量为每次50mg，每日3次，餐前服用，根据血糖调整剂量。","adverse":"常见不良反应包括低血糖、胃肠道不适、皮疹；严重不良反应有肝功能异常、血液系统异常。","contraindications":"禁用于1型糖尿病患者、严重肝肾功能不全者、对本品过敏者。与酒精或其他降糖药合用时需谨慎。","storage":"密封，在阴凉干燥处保存，避免受潮。","note":"监测血糖，避免低血糖"},
    "格列本脲": {"indications":"用于2型糖尿病患者的血糖控制，适用于饮食和运动治疗无效的成年患者，以及需要胰岛素治疗但不愿或不能使用胰岛素的患者。也用于妊娠期糖尿病及某些特殊类型的糖尿病。","ingredients":"主要成分为格列本脲，常见剂型规格为1.25mg、2.5mg、5mg片剂。","dosage":"成人常用剂量为每日1.25-5mg，分1-2次服用，通常在餐前30分钟服用。","adverse":"常见不良反应包括低血糖、恶心、腹泻、体重增加；严重不良反应有肝功能异常、血液系统异常、过敏反应。","contraindications":"禁用于1型糖尿病患者、糖尿病酮症酸中毒患者���严重肝肾功能不全者，以及对磺胺类药物过敏者。与酒精或其他降糖药合用时需谨慎。","storage":"遮光，密封，在阴凉干燥处保存，避免受潮。","note":"监测血糖，避免低血糖"},
    "氢化可的松": {"indications":"用于治疗系统性红斑狼疮、严重过敏反应、类风湿性关节炎、哮喘急性发作及肾上腺皮质功能不全。","ingredients":"氢化可的松，常见剂型规格为10mg/ml注射液、20mg/片口服片剂。","dosage":"成人常用剂量为每日40-80mg，分次服用，餐后或遵医嘱服用。","adverse":"常见不良反应包括胃部不适、失眠、情绪波动；严重不良反应包括高血糖、骨质疏松、感染风险增加。","contraindications":"对氢化可的松过敏者禁用，活动性结核病患者慎用，与疫苗同时使用需避免。","storage":"遮光，密封，在阴凉干燥处保存。","note":"长期使用需监测血糖和骨密度。"},
    "氨基己酸": {"indications":"用于治疗纤维蛋白溶解亢进引起的出血，如肺结核咯血、支气管扩张咯血、子宫出血、前列腺手术后出血等。也用于预防和治疗因纤维蛋白溶解亢进导致的术后出血。","ingredients":"主要成分为氨基己酸，常见剂型规格为500mg/片、1g/片、5%注射液。","dosage":"成人常用剂量为每次1-2g，每日3-4次，口服或静脉注射，应在出血发生后尽快使用。","adverse":"常见不良反应包括恶心、呕吐、腹泻、皮疹；严重不良反应有肾功能损害、过敏性休克、血栓形成。","contraindications":"禁用于有血栓病史或血栓风险者，禁与抗凝药物如华法林联用，禁用于对本品过敏者。","storage":"遮光，密封，在阴凉干燥处保存。","note":"注意肾功能监测"},
    "氨基葡萄糖": {"indications":"用于治疗骨关节炎、类风湿性关节炎、骨质疏松症、关节疼痛及软骨损伤。","ingredients":"主要成分为氨基葡萄糖盐酸盐，常见剂型规格为500mg/片、1.5g/袋。","dosage":"成人常用剂量为每日1.5g，分2次服用，餐后服用以减少胃部刺激。","adverse":"常见不良反应包括恶心、腹泻、胃部不适、便秘；严重不良反应有肝功能异常、过敏性休克。","contraindications":"对氨基葡萄糖过敏者禁用，孕妇及哺乳期妇女慎用，与抗凝药物合用需谨慎。","storage":"密封，避光，干燥处保存，温度不超过25℃。","note":"避免长期大剂量使用"},
    "氨甲环酸": {"indications":"用于治疗因凝血功能障碍导致的出血，如手术中出血、月经过多、牙龈出血及外伤性出血。适用于血友病患者术前术后止血及产后出血。","ingredients":"主要成分为氨甲环酸，常见剂型规格为500mg/片、1g/瓶、5ml:500mg注射液。","dosage":"成人常用剂量为每次500-1000mg，每日2-3次，静脉注射或口服，需在医生指导下使用。","adverse":"常见不良反应包括恶心、呕吐、腹泻、头痛；严重不良反应有血栓形成、过敏性休克、肾功能损害。","contraindications":"禁用于对本品过敏者、有血栓病史或正在使用抗凝药物者。","storage":"遮光、密封，在阴凉干燥处保存，避免高温和潮湿。","note":"避免与抗凝药同用"},
    "氯化钠": {"indications":"用于治疗低钠血症、脱水、电解质失衡及作为输液溶媒。适用于心力衰竭患者纠正钠平衡，以及手术前后维持体液平衡。","ingredients":"主要成分为氯化钠，常见剂型规格为0.9%注射液（500ml/瓶）和5%注射液（250ml/瓶）。","dosage":"成人静脉滴注每日2-3升，根据病情调整，通常在空腹或餐后服用。","adverse":"常见不良反应包括水肿、高血压、恶心、头痛；严重不良反应有高钠血症、肺水肿、心力衰竭加重。","contraindications":"禁用于严重心力衰竭、肾功能不全患者；与利尿剂合用时需谨慎，避免钠潴留。","storage":"遮光，密闭保存，温度不超过25℃，避免冻结。","note":"监测电解质水平"},
    "氯化钾": {"indications":"用于治疗低钾血症、心律失常、高血压、慢性肾功能不全及洋地黄中毒引起的低钾血症。","ingredients":"主要成分为氯化钾，常见剂型规格为0.5g/片、1g/片、10%注射液。","dosage":"成人常用剂量为每日1-3g，分次服用，餐后或与食物同服。","adverse":"常见不良反应包括恶心、呕吐、腹泻、腹痛；严重不良反应有高钾血症、心律不齐、呼吸困难。","contraindications":"禁用于严重肾功能不全、高钾血症患者及对本品过敏者；禁与血管紧张素转换酶抑制剂合用。","storage":"遮光，密封，在阴凉干燥处保存。","note":"监测血钾水平"},
    "氯唑沙宗": {"indications":"用于治疗肌肉痉挛、腰肌劳损、颈椎病、肩周炎及外伤后肌肉疼痛等症状。","ingredients":"主要成分为氯唑沙宗，常见剂型为片剂（50mg/片、100mg/片）。","dosage":"成人每次50-100mg，每日3次，餐后服用。","adverse":"常见不良反应包括恶心、头晕、嗜睡；严重不良反应有肝功能异常、过敏性休克。","contraindications":"对本品过敏者禁用；妊娠期妇女及严重肝肾功能不全者禁用；与中枢抑制药合用时需慎用。","storage":"密封，避光，干燥处保存。","note":"避免驾驶或操作机械。"},
    "氯喹": {"indications":"用于治疗疟疾、类风湿性关节炎、系统性红斑狼疮及盘状红斑狼疮。也用于某些寄生虫感染和自身免疫性疾病的辅助治疗。","ingredients":"主要成分为氯喹，常见剂型为片剂（每片0.25g）和注射液（每支0.2g）。","dosage":"成人常用剂量为每日250mg至500mg，分1-2次服用；用于疟疾预防时，每周一次，于睡前服用。","adverse":"常见不良反应包括恶心、呕吐、腹泻、头痛和皮疹；严重不良反应包括心律失常、视网膜病变和血液系统异常。","contraindications":"对氯喹过敏者禁用；与奎宁、胺碘酮等药物合用时禁用；孕妇及哺乳期妇女慎用。","storage":"遮光，密封，在阴凉干燥处保存，避免受潮。","note":"定期检查视力和血常规"},
    "氯霉素滴眼液": {"indications":"用于治疗细菌性结膜炎、角膜炎、睑缘炎及由敏感菌引起的其他眼部感染。适用于成人及儿童。","ingredients":"氯霉素，常见剂型规格为0.5%滴眼液，每瓶10ml。","dosage":"成人每次1-2滴，每日4次，间隔4-6小时，疗程一般为7天。","adverse":"常见不良反应包括眼部刺激、瘙痒、灼热感；严重不良反应有视物模糊、过敏性休克、血液系统异常。","contraindications":"对氯霉素过敏者禁用；与某些抗生素（如红霉素）合用时可能增加毒性风险。","storage":"遮光、密闭，在阴凉干燥处保存，避免冻结。","note":"使用前检查药液是否变质"},

    "泼尼松龙": {"indications":"用于类风湿性关节炎、系统性红斑狼疮、哮喘急性发作、严重过敏反应及器官移植后排斥反应。","ingredients":"主要成分为泼尼松龙，常见剂型规格为5mg、10mg、20mg片剂。","dosage":"成人常用剂量为每日5-60mg，分次服用，建议饭后服用以减少胃部刺激。","adverse":"常见不良反应包括消化道不适、失眠、情绪波动；严重不良反应有骨质疏松、高血糖、免疫抑制。","contraindications":"对泼尼松龙过敏者禁用；与某些抗凝药、疫苗等药物存在相互作用，需避免同时使用。","storage":"遮光，密封，在阴凉干燥处保存。","note":"定期监测血糖和骨密度。"},

    "溴隐亭": {"indications":"用于治疗高泌乳素血症、闭经-溢乳综合征、催乳素瘤、帕金森病及肢端肥大症。","ingredients":"主要成分为溴隐亭，常见剂型规格为2.5mg/片、5mg/片。","dosage":"成人常用剂量为每日2.5-10mg，分2-3次服用，餐后或遵医嘱。","adverse":"常见不良反应包括恶心、头晕、便秘、乏力；严重不良反应有低血压、精神症状、心律失常。","contraindications":"禁用于对溴隐亭过敏者、严重心脏病患者及妊娠期妇女；与降压药合用可能增强降压效果。","storage":"遮光，密封，在阴凉干燥处保存。","note":"定期监测肝功能"},
    "炉甘石": {"indications":"用于治疗湿疹、接触性皮炎、痱子、轻度烧伤及皮肤瘙痒等皮肤疾病，也可用于缓解蚊虫叮咬引起的局部红肿瘙痒。","ingredients":"主要成分为炉甘石，常见剂型为炉甘石洗剂（10%浓度）和炉甘石粉剂（5%浓度）。","dosage":"外用，每日2-3次，涂抹于患处，避免接触眼睛和黏膜。","adverse":"常见不良反应包括皮肤刺激、干燥、轻微灼热感；严重不良反应可能有过敏性皮疹、呼吸困难、全身性过敏反应。","contraindications":"对炉甘石或制剂中任何成分过敏者禁用；避免与含氧化锌或其他止痒药物同时使用。","storage":"密封，避光，置于阴凉干燥处，温度不超过25℃。","note":"避免接触眼睛"},
    "熊去氧胆酸": {"indications":"用于治疗胆固醇性胆结石、胆汁淤积性肝病、胆囊胆固醇沉积症、原发性胆汁性胆管炎及慢性胆囊炎引起的右上腹痛。","ingredients":"主要成分为熊去氧胆酸，常见剂型规格为250mg/片、500mg/片。","dosage":"成人常用剂量为每日1000-1500mg，分2-3次服用，餐后服用。","adverse":"常见不良反应包括腹泻、恶心、腹痛、头痛和乏力；严重不良反应有肝功能异常和过敏反应。","contraindications":"禁用于急性胆道感染、胆道完全阻塞患者，禁与含钙制剂同时使用。","storage":"密封，在阴凉干燥处保存，避免受潮。","note":"定期监测肝功能"},
    "特非那定": {"indications":"用于治疗过敏性鼻炎、荨麻疹、湿疹、过敏性结膜炎及药物性皮疹等过敏性疾病。","ingredients":"主要成分为特非那定，常见剂型规格为120mg片剂。","dosage":"成人常用剂量为每日2次，每次120mg，餐前或餐后服用。","adverse":"常见不良反应包括嗜睡、口干、头痛、乏力；严重不良反应包括心律失常、肝功能异常。","contraindications":"禁用于严重肝功能���全者、对本品过敏者及与酮康唑等CYP3A4抑制剂联用者。","storage":"遮光，密封，在阴凉干燥处保存。","note":"避免驾驶或操作机械。"},
    "环孢素软胶囊": {"indications":"用于器官移植后预防排斥反应，治疗严重类风湿性关节炎，银屑病关节炎，系统性红斑狼疮及重症肌无力。","ingredients":"环孢素，常见剂型规格为10mg、25mg、50mg软胶囊。","dosage":"成人起始剂量为每日3-5mg/kg，分两次服用，空腹或餐后服用。","adverse":"常见不良反应包括高血压、震颤、胃肠道不适、肝功能异常；严重不良反应有肾功能损害、感染风险增加、高钾血症。","contraindications":"对环孢素过敏者禁用，与利托那韦等药物合用时禁用，严重肝肾功能不全患者禁用。","storage":"遮光，密封，在25℃以下干燥处保存。","note":"监测肝肾功能"},
    "环磷酰胺": {"indications":"用于治疗恶性淋巴瘤、多发性骨髓瘤、乳腺癌、卵巢癌及急性白血病等恶性肿瘤。也用于自身免疫性疾病如系统性红斑狼疮和类风湿关节炎的治疗。","ingredients":"环磷酰胺，常见剂型规格为50mg/片、100mg/片、200mg/片及注射剂50mg/ml、200mg/ml。","dosage":"成人常用剂量为每日1-3mg/kg，分1-2次口服；静脉注射时单次剂量一般为500-1000mg/m²，每3-4周一次。","adverse":"常见不良反应包括恶心、呕吐、脱发、骨髓抑制；严重不良反应有出血性膀胱炎、肝功能异常、继发性肿瘤。","contraindications":"对环磷酰胺过敏者禁用；严重感染或骨髓功能低下者禁用；与活疫苗同时使用禁用。","storage":"避光、密封，在阴凉干燥处保存，温度不超过25℃。","note":"定期监测血象和肝肾功能"},
    "瑞芬太尼": {"indications":"用于手术麻醉诱导及维持，术后镇痛，分娩镇痛，以及重症监护患者的镇静。适用于心脏手术、腹部手术及产科手术等需要快速起效和短时作用的麻醉场景。","ingredients":"瑞芬太尼，常见剂型规格为100μg/5ml注射液，200μg/5ml注射液。","dosage":"成人静脉注射，诱导剂量1-2μg/kg，维持剂量0.1-0.2μg/kg/min，根据手术需要调整。","adverse":"常见不良反应包括呼吸抑制、恶心呕吐、心动过缓、寒战和低血压；严重不良反应有心律失常、过敏性休克和呼吸暂停。","contraindications":"对瑞芬太尼过敏者禁用；与单胺氧化酶抑制剂合用禁用；严重肝肾功能不全患者慎用。","storage":"遮光，密闭，在2-8℃冷藏保存，避免冻结。","note":"监测呼吸循环功能"},
    "甘油果糖": {"indications":"用于治疗脑水肿、颅内压增高、急性青光眼、视神经水肿及术后脑水肿等疾病，也可用于预防和治疗因脱水引起的肾功能不全。","ingredients":"主要成分为甘油和果糖，常见剂型为注射液，规格为10%甘油果糖注射液（500ml/瓶）。","dosage":"成人常用剂量为每日500-1000ml，静脉滴注，通常在空腹或餐后1小时服用。","adverse":"常见不良反应包括恶心、呕吐、腹泻、头痛和心悸；严重不良反应有电解质紊乱、急性肾功能衰竭和过敏性休克。","contraindications":"禁用于严重肾功能不全患者、高钠血症患者及对本品成分过敏者；禁与含钙溶液同时使用。","storage":"遮光，密闭保存，置于阴凉干燥处，避免冻结。","note":"监测电解质和肾功能"},

    "甲氧氯普胺": {"indications":"用于治疗胃食管反流病、功能性消化不良、化疗后恶心呕吐、糖尿病性胃轻瘫及术后恶心呕吐。","ingredients":"主要成分为甲氧氯普胺，常见剂型规格为10mg/片、5mg/5ml注射液。","dosage":"成人常用剂量为每次10-20mg，每日3-4次，餐前30分钟服用或遵医嘱。","adverse":"常见不良反应包括嗜睡、口干、便秘；严重不良反应包括锥体外系反应、心律失常。","contraindications":"禁用于有胃肠出血、机械性肠梗阻患者，禁与吩噻嗪类药物合用。","storage":"遮光，密封，在阴凉干燥处保存。","note":"避免长期使用"},

    "金诺芬": {"indications":"用于治疗类风湿性关节炎、幼年特发性关节炎、银屑病关节炎、强直性脊柱炎及系统性红斑狼疮引起的关节炎症。","ingredients":"主要成分为甲氨蝶呤，常见剂型规格为片剂（2.5mg、5mg）和注射剂（10mg/ml）。","dosage":"成人常用剂量为每周7.5-25mg，分次服用或单次服用，建议在餐后服用。","adverse":"常见不良反应包括恶心、呕吐、口腔溃疡、肝功能异常；严重不良反应有骨髓抑制、肺纤维化、严重肝损伤。","contraindications":"对甲氨蝶呤过敏者禁用；孕妇及哺乳期妇女禁用；与某些药物如乙醇、非甾体抗炎药合用时需谨慎。","storage":"遮光，密封，在阴凉干燥处保存，避免儿童接触。","note":"定期监测肝功能和血常规。"},

    "顺铂": {"indications":"用于治疗睾丸癌、卵巢癌、膀胱癌、头颈部鳞状细胞癌及小细胞肺癌等恶性肿瘤。","ingredients":"主要成分为顺铂，常见剂型规格为5mg/mL注射液和10mg/mL注射液。","dosage":"成人常用剂量为每次20-100mg/m²，每3周一次，静脉滴注，需在化疗周期内使用。","adverse":"常见不良反应包括恶心、呕吐、脱发、肾功能损害；严重不良反应有骨髓抑制、耳毒性、神经毒性和过敏反应。","contraindications":"对顺铂过敏者禁用；严重肾功能不全患者禁用；与某些药物如氨基糖苷类抗生素合用时需避免。","storage":"避光、密闭，在2-8℃条件下保存。","note":"监测肾功能和血常规"},

// 智能匹配函数
function matchQuestion(question, lang){
  lang = lang || currentLang || 'zh';
  var q = question.trim();
  if(!q) return null;

  // 1. 先尝试精确关键词匹配(按类型优先级)
  var typePriority = ['相互作用', '用药指南', '饮食禁忌', '孕妇用药', '儿童用药', '老年人用药', '一般建议'];
  var matchedRules = [];

  for(var i=0; i<DRUG_QA_RULES.length; i++){
    var rule = DRUG_QA_RULES[i];
    var pattern = rule.pattern;
    if(pattern && pattern.test && pattern.test(q)){
      matchedRules.push(rule);
    }
  }

  if(matchedRules.length > 0){
    // 按类型优先级排序
    matchedRules.sort(function(a, b){
      var pa = typePriority.indexOf(a.type) || 99;
      var pb = typePriority.indexOf(b.type) || 99;
      return pa - pb;
    });
    var bestMatch = matchedRules[0];
    var response = typeof bestMatch.response === 'function' ? bestMatch.response(lang, q) : bestMatch.response;
    return { type: bestMatch.type, response: response };
  }

  // 2. 如果匹配到药物相互作用模式,调用现有searchInteractions
  // (已在规则11中处理)

  // 3. 如果匹配到用药指南查询,从DRUG_GUIDE读取
  // (已在规则12中处理)

  // 4. 都没匹配到
  return null;
}

// 从规则库随机选一条相关回答(增加多样性)
function getRandomRelatedResponse(question, lang){
  lang = lang || currentLang || 'zh';
  var matchedRules = [];
  for(var i=0; i<DRUG_QA_RULES.length; i++){
    if(DRUG_QA_RULES[i].pattern.test(question)){
      matchedRules.push(DRUG_QA_RULES[i]);
    }
  }
  if(matchedRules.length > 0){
    var randomRule = matchedRules[Math.floor(Math.random() * matchedRules.length)];
    var response = typeof randomRule.response === 'function' ? randomRule.response(lang, question) : randomRule.response;
    return { type: randomRule.type, response: response };
  }
  return null;
}

  }

  searchResult.innerHTML = '<div class="loading-dots">'+T[currentLang].searching+'</div>';
