    b.addEventListener('click', function() { switchMode(this.dataset.mode); });
  });
  document.getElementById('sendBtn').addEventListener('click', sendMessage);
  document.getElementById('userInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  updateApiStatus();
  switchMode('ai');
}

function updateApiStatus() {
  var el = document.getElementById('apiStatus');
  if (API_BASE && API_BASE.indexOf('vercel.app') >= 0) {
    el.textContent = '鈿?AI鍦ㄧ嚎';
    el.className = 'api-status';
  } else {
    el.textContent = '馃摉 鏈湴妯″紡';
    el.className = 'api-status offline';
  }
}

function switchMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  document.getElementById('chatArea').innerHTML = '';
  var bar = document.getElementById('chipsBar');
  bar.innerHTML = '';
  var chips = CHIPS_DATA[mode] || [];
  chips.forEach(function(k) {
    var btn = document.createElement('button');
    btn.className = 'chip';
    btn.textContent = k;
    btn.addEventListener('click', function() { sendQuick(k); });
    bar.appendChild(btn);
  });
  addAIMessage(getWelcome(mode));
}

function getWelcome(mode) {
  var m = {
    ai: '馃憢 鎴戞槸AI涓タ鍖诲姪鎵嬶紒<br><br>鎮ㄥ彲浠ラ棶鎴戜换浣曞仴搴烽棶棰橈細<br>鈥?"鎰熷啋浜嗘€庝箞鍔?<br>鈥?"琛€鍘嬮珮鍚冧粈涔堝ソ"<br>鈥?"闃磋櫄浣撹川鎬庝箞璋冪悊"<br>鈥?"绯栧翱鐥呰兘鍚冩按鏋滃悧"<br><br>鎴戜細浠庝腑瑗垮尰涓や釜瑙掑害缁欐偍寤鸿銆?,
    consult: '馃摉 鐤剧梾鐭ヨ瘑搴撴ā寮?br><br>璇疯緭鍏ョ柧鐥呭悕绉帮紙鏀寔72绉嶅父瑙佺柧鐥咃級',
    tcm: '馃尶 涓尰浣撹川杈ㄨ瘑<br><br>璇锋弿杩版偍鐨勭棁鐘讹紝鎴戞潵甯偍鍒嗘瀽浣撹川'
  };
  return m[mode] || m.ai;
}

function sendMessage() {
  var input = document.getElementById('userInput');
  var text = (input.value || '').trim();
  if (!text || isTyping) return;
  input.value = '';
  addUserMsg(text);
  chatHistory.push({ role: 'user', content: text });
  processQuery(text);
}

function sendQuick(kw) {
  if (isTyping) return;
  addUserMsg(kw);
  chatHistory.push({ role: 'user', content: kw });
  processQuery(kw);
}

function addUserMsg(text) {
  var chat = document.getElementById('chatArea');
  var div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = '<div class="msg-avatar">馃懁</div><div class="msg-bubble">' + esc(text) + '</div>';
  chat.appendChild(div);
  scroll();
}

function addAIMessage(html) {
  var chat = document.getElementById('chatArea');
  var div = document.createElement('div');
  div.className = 'msg ai';
  div.innerHTML = '<div class="msg-avatar">馃尶</div><div class="msg-bubble">' + html + '</div>';
  chat.appendChild(div);
  scroll();
}

function showTyping() {
  isTyping = true;
  var btn = document.getElementById('sendBtn');
  btn.disabled = true;
  var chat = document.getElementById('chatArea');
  var div = document.createElement('div');
  div.className = 'msg ai';
  div.id = 'typing';
  div.innerHTML = '<div class="msg-avatar">馃尶</div><div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
  chat.appendChild(div);
  scroll();
}

function hideTyping() {
  isTyping = false;
  document.getElementById('sendBtn').disabled = false;
  var el = document.getElementById('typing');
  if (el) el.remove();
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function scroll() { var c = document.getElementById('chatArea'); if(c) c.scrollTop = c.scrollHeight; }

function processQuery(query) {
  if (currentMode === 'ai') {
    askAI(query);
  } else {
    searchKB(query);
  }
}

// ============ AI 妯″紡 ============
function askAI(query) {
  if (!API_BASE || API_BASE === '') {
    // 娌℃湁API鏃讹紝鐢ㄦ湰鍦癒B + 閫氱敤鍥炲鍏滃簳
    var kbResult = searchKBOnly(query);
    if (kbResult.found) {
      showTyping();
      setTimeout(function() {
        hideTyping();
        addAIMessage('馃摉 鏍规嵁鎴戠殑鐭ヨ瘑搴撲负鎮ㄦ壘鍒帮細<br><br>' + kbResult.html);
      }, 600);
    } else {
      showTyping();
      setTimeout(function() {
        hideTyping();
        addAIMessage('馃摉 鎶辨瓑锛岀煡璇嗗簱涓湭鎵惧埌"' + esc(query) + '"鐨勭浉鍏充俊鎭€?br><br>璇烽儴缃?Vercel API 鏉ュ惎鐢ˋI鍥炵瓟浠绘剰闂銆?br><br>鉁?鍙敤蹇嵎闂锛? + Object.keys(KB_DATA.KB || {}).slice(0,6).join('銆?));
      }, 600);
    }
    return;
  }

  showTyping();
  fetch(API_BASE + '/api/ask', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      question: query,
      history: chatHistory.slice(-8)
    })
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    hideTyping();
    if (data.error) {
      // 闄嶇骇鍒版湰鍦癒B
      var kb = searchKBOnly(query);
      addAIMessage('鈿狅笍 AI鏈嶅姟鏆傛椂涓嶅彲鐢紙' + data.error + '锛?br><br>馃摉 鏈湴鐭ヨ瘑搴撴悳绱細<br>' + (kb.found ? kb.html : '鏈壘鍒扮浉鍏崇粨鏋?));
    } else {
      addAIMessage(data.answer || data.response || JSON.stringify(data));
      chatHistory.push({ role: 'assistant', content: data.answer || data.response || '' });
    }
  })
  .catch(function(err) {
    hideTyping();
    addAIMessage('鈿狅笍 缃戠粶閿欒锛岃妫€鏌ョ綉缁滃悗閲嶈瘯銆?br>閿欒锛? + err.message);
  });
}

// ============ 鏈湴 KB 妯″紡 ============
function searchKB(query) {
  showTyping();
  setTimeout(function() {
    hideTyping();
    var result = searchKBOnly(query);
    addAIMessage(result.found ? result.html : '馃摉 鏈壘鍒?' + esc(query) + '"鐨勭浉鍏充俊鎭€傛偍鍙互璇曡瘯锛? + Object.keys(KB_DATA.KB || {}).slice(0,4).join('銆?));
  }, 600);
}

function searchKBOnly(q) {
  var kb = KB_DATA.KB || {};
  q = q.toLowerCase().trim();

  if (kb[q]) return { found: true, html: buildCard(q, kb[q]) };
  var keys = Object.keys(kb);
  for (var i = 0; i < keys.length; i++) {
    var name = keys[i];
    if (name.indexOf(q) >= 0 || q.indexOf(name) >= 0)
      return { found: true, html: buildCard(name, kb[name]) };
  }

  var sk = Object.keys(SYMPTOM_KEYWORDS || {});
  for (var j = 0; j < sk.length; j++) {
    if (sk[j].indexOf(q) >= 0 || q.indexOf(sk[j]) >= 0) {
      var matched = SYMPTOM_KEYWORDS[sk[j]];
      if (kb[matched]) return { found: true, html: buildCard(matched, kb[matched]) };
    }
  }

  var tcm = TCM_TYPES || {};
  for (var t in tcm) { if (t.indexOf(q) >= 0 || q.indexOf(t) >= 0) return { found: true, html: '<div class="kb-card"><div class="kb-card-header">馃尶 ' + t + '</div><div class="kb-card-body">' + tcm[t] + '</div></div>' }; }

  var diet = DIET_PLAN || {};
  for (var d in diet) { if (d.indexOf(q) >= 0 || q.indexOf(d) >= 0) return { found: true, html: '<div class="kb-card"><div class="kb-card-header">馃 ' + d + '</div><div class="kb-card-body">' + diet[d] + '</div></div>' }; }

  return { found: false, html: '' };
}

var SYMPTOM_KEYWORDS = {};
(function() {
  var kb = KB_DATA.KB || {};
  var keys = Object.keys(kb);
  for (var i = 0; i < keys.length; i++) {
    var data = kb[keys[i]];
    var text = (data.symptoms || '') + ',' + (data.content || '');
    var parts = text.replace(/銆亅銆倈,/g, ',').split(',');
    for (var j = 0; j < Math.min(parts.length, 5); j++) {
      var s = parts[j].trim();
      if (s && s.length > 1) SYMPTOM_KEYWORDS[s] = keys[i];
    }
  }
})();

function buildCard(name, data) {
  var html = '<div class="kb-card"><div class="kb-card-header">馃搵 ' + (data.title || name) + '</div><div class="kb-card-body">';
  if (data.content) html += '<div class="kb-section"><div class="kb-section-title">馃摉 鐤剧梾璇存槑</div><div class="kb-section-content">' + data.content + '</div></div>';
  if (data.symptoms) html += '<div class="kb-section"><div class="kb-section-title">馃攳 甯歌鐥囩姸</div><div class="kb-section-content">' + data.symptoms + '</div></div>';
  if (data.drugs) html += '<div class="kb-section"><div class="kb-section-title">馃拪 甯哥敤鑽墿</div><div class="kb-section-content">' + data.drugs + '</div></div>';
  if (data.diet) html += '<div class="kb-section"><div class="kb-section-title">馃 楗寤鸿</div><div class="kb-section-content">' + data.diet + '</div></div>';
  if (data.herbs) html += '<div class="kb-section"><div class="kb-section-title">馃尶 涓尰璋冪悊</div><div class="kb-section-content">' + data.herbs + '</div></div>';
  if (data.emergency) html += '<div class="kb-section"><div class="kb-section-title">馃毃 绱ф€ユ儏鍐?/div><div class="kb-section-content" style="color:#dc2626;">' + data.emergency + '</div></div>';
  html += '</div></div>';
  return html;
}
