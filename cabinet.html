<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2e7d32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>家庭药箱 - 家庭药师</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22></text></svg>">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f6f7;color:#222;min-height:100vh}
header{background:linear-gradient(135deg,#1a5c3a,#2e7d32);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:18px;font-weight:700}
header a{color:#fff;text-decoration:none;font-size:13px;opacity:.9}
.main{padding:14px;max-width:720px;margin:0 auto}
.stat-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat-card{background:#fff;border-radius:12px;padding:14px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.stat-card .num{font-size:28px;font-weight:700;color:#2e7d32}
.stat-card .label{font-size:12px;color:#888;margin-top:2px}
.stat-card .num.warn{color:#ff9800}
.stat-card .num.danger{color:#e53935}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.card-title{font-size:15px;font-weight:600;color:#333}
.badge{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge-ok{background:#e8f5e9;color:#2e7d32}
.badge-warn{background:#fff3e0;color:#e65100}
.badge-danger{background:#ffebee;color:#c62828}
.drug-item{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid #f0f0f0;gap:10px}
.drug-item:last-child{border-bottom:none}
.drug-icon{width:40px;height:40px;border-radius:10px;background:#e8f5e9;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.drug-info{flex:1;min-width:0}
.drug-name{font-size:14px;font-weight:600;color:#333}
.drug-meta{font-size:12px;color:#888;margin-top:2px}
.expiry-bar{flex-shrink:0;text-align:right}
.drug-actions{flex-shrink:0;display:flex;gap:6px}
.btn-xs{background:#f5f5f5;border:none;padding:5px 10px;border-radius:6px;font-size:12px;cursor:pointer;color:#666}
.btn-xs:hover{background:#e0e0e0}
.btn-xs.del{color:#e53935}
.btn-add{background:#2e7d32;color:#fff;border:none;padding:10px 16px;border-radius:10px;font-size:14px;cursor:pointer;font-weight:600;width:100%}
.btn-add:hover{background:#1b5e20}
/* Add/Edit Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto}
.modal h2{font-size:17px;margin-bottom:16px;color:#333}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:13px;color:#666;margin-bottom:4px;font-weight:600}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 12px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;outline:none}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#2e7d32}
.form-group textarea{resize:vertical;min-height:60px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-btns{display:flex;gap:10px;margin-top:16px}
.modal-btns button{flex:1;padding:10px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none}
.modal-btns .btn-cancel{background:#f5f5f5;color:#666}
.modal-btns .btn-save{background:#2e7d32;color:#fff}
/* Member section */
.member-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.member-chip{background:#e3f2fd;border:2px solid #bbdefb;border-radius:20px;padding:6px 14px;font-size:13px;color:#1565c0;cursor:pointer;user-select:none}
.member-chip.active{background:#1565c0;color:#fff;border-color:#1565c0}
/* Empty state */
.empty{text-align:center;padding:40px 20px;color:#aaa}
.empty-icon{font-size:48px;margin-bottom:10px}
.empty p{font-size:14px}
/* Alert banner */
.alert-banner{display:none;background:#fff3e0;border:1px solid #ffcc80;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px;color:#e65100}
.alert-banner.show{display:block}
.alert-banner.danger{background:#ffebee;border-color:#ef9a9a;color:#c62828}
/* Expiry colors */
.expiry-ok{color:#2e7d32}
.expiry-soon{color:#ff9800}
.expiry-expired{color:#e53935}
</style>
</head>
<body>
<header>
  <h1>家庭药箱</h1>
  <div style="display:flex;align-items:center;gap:10px">
    <button id="cabSyncBtn" onclick="cabSyncNow()" style="background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);color:#fff;padding:4px 10px;border-radius:16px;cursor:pointer;font-size:12px">同步</button>
    <a href="index.html">← 返回</a>
  </div>
</header>

<div class="main">
  <!-- Stats -->
  <div class="stat-bar">
    <div class="stat-card">
      <div class="num" id="statTotal">0</div>
      <div class="label" id="statTotalLabel">药品总数</div>
    </div>
    <div class="stat-card">
      <div class="num warn" id="statSoon">0</div>
      <div class="label" id="statSoonLabel">近期过期</div>
    </div>
    <div class="stat-card">
      <div class="num danger" id="statExpired">0</div>
      <div class="label" id="statExpiredLabel">已过期</div>
    </div>
  </div>

  <!-- v5.5 云端同步状态 -->
  <div id="cabSyncStatus" style="display:none;background:#fff;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:12px;color:#666;line-height:1.6;box-shadow:0 1px 3px rgba(0,0,0,.08)"></div>

  <!-- Alert -->
  <div class="alert-banner" id="alertBanner"></div>

  <!-- Members -->
  <div class="card" id="memberCard">
    <div class="card-head">
      <div class="card-title">家庭成员</div>
    </div>
    <div class="member-list" id="memberList"></div>
    <button class="btn-add" onclick="openMemberModal()" style="margin-top:8px;font-size:13px;padding:8px">+ 添加成员</button>
  </div>

  <!-- Drug List -->
  <div class="card">
    <div class="card-head">
      <div class="card-title" id="drugListTitle">我的药箱</div>
      <span class="badge badge-ok" id="filterBadge" style="display:none"></span>
    </div>
    <div id="drugList"></div>
    <button class="btn-add" onclick="openAddModal()">+ 添加药品</button>
  </div>

  <!-- Low Stock -->
  <div class="card" id="lowStockCard" style="display:none">
    <div class="card-head">
      <div class="card-title">库存不足提醒</div>
    </div>
    <div id="lowStockList"></div>
  </div>
</div>

<!-- Add/Edit Drug Modal -->
<div class="modal-overlay" id="drugModal">
  <div class="modal">
    <h2 id="drugModalTitle">添加药品</h2>
    <div class="form-group">
      <label>药品名称 *</label>
      <input id="drugName" placeholder="如：布洛芬、阿莫西林">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>规格/剂型</label>
        <input id="drugSpec" placeholder="如：0.2g片剂">
      </div>
      <div class="form-group">
        <label>数量</label>
        <input id="drugQty" type="number" min="0" placeholder="如：30">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>有效期</label>
        <input id="drugExpiry" type="date" placeholder="YYYY-MM-DD">
      </div>
      <div class="form-group">
        <label>服用剂量</label>
        <input id="drugDose" placeholder="如：每次1片">
      </div>
    </div>
    <div class="form-group">
      <label>所属成员</label>
      <select id="drugMember"><option value="">通用/共享</option></select>
    </div>
    <div class="form-group">
      <label>分类</label>
      <select id="drugCat">
        <option value="解热镇痛">解热镇痛</option>
        <option value="抗生素">抗生素</option>
        <option value="感冒药">感冒药</option>
        <option value="胃肠道">胃肠道</option>
        <option value="心血管">心血管</option>
        <option value="降糖药">降糖药</option>
        <option value="外用药">外用药</option>
        <option value="维生素/补剂">维生素/补剂</option>
        <option value="中药/中成药">中药/中成药</option>
        <option value="其他">其他</option>
      </select>
    </div>
    <div class="form-group">
      <label>备注</label>
      <textarea id="drugNote" placeholder="服用时间、医嘱等..."></textarea>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeDrugModal()">取消</button>
      <button class="btn-save" id="drugSaveBtn" onclick="saveDrug()">保存</button>
    </div>
  </div>
</div>

<!-- Add Member Modal -->
<div class="modal-overlay" id="memberModal">
  <div class="modal">
    <h2>添加家庭成员</h2>
    <div class="form-group">
      <label>姓名/昵称 *</label>
      <input id="memberName" placeholder="如：爸爸、妈妈、宝宝">
    </div>
    <div class="form-group">
      <label>性别</label>
      <select id="memberGender">
        <option value="">未知</option>
        <option value="男">男</option>
        <option value="女">女</option>
      </select>
    </div>
    <div class="form-group">
      <label>年龄/出生年月</label>
      <input id="memberAge" placeholder="如：45岁 或 1980-05">
    </div>
    <div class="form-group">
      <label>慢性病史（可选）</label>
      <input id="memberCondition" placeholder="如：高血压、糖尿病">
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeMemberModal()">取消</button>
      <button class="btn-save" onclick="saveMember()">保存</button>
    </div>
  </div>
</div>

<script src="syncengine.js"></script>
<script>
// ===== Data =====
var CABINET_KEY = 'family_pharmacist_cabinet';
var MEMBERS_KEY = 'family_pharmacist_members';
var CURRENT_MEMBER = '';
var EDIT_ID = null;

function getCabinet(){ return JSON.parse(localStorage.getItem(CABINET_KEY)||'[]'); }
function saveCabinet(arr){ localStorage.setItem(CABINET_KEY, JSON.stringify(arr)); syncNote('cabinet', arr); }
function getMembers(){ return JSON.parse(localStorage.getItem(MEMBERS_KEY)||'[]'); }
function saveMembers(arr){ localStorage.setItem(MEMBERS_KEY, JSON.stringify(arr)); syncNote('members', arr); }

// ===== v5.5 云端同步 =====
function syncNote(type, arr){
  try { if (window.PharmacySync) window.PharmacySync.noteLocalChange(type, JSON.stringify(arr)); } catch(e) {}
}
function cabSyncStatus(msg){
  var el = document.getElementById('cabSyncStatus');
  if(el){ el.style.display = msg ? 'block' : 'none'; el.textContent = msg; }
}
function cabSyncNow(){
  var sync = window.PharmacySync;
  if(!sync){ cabSyncStatus('同步引擎未加载'); return; }
  var fid = sync.getFamilyId();
  if(!fid){ cabSyncStatus('尚未创建/加入家庭。请到首页 → 「家庭」页 → 多设备云端同步 中创建或加入。'); return; }
  if(!sync.getWorkerUrl()){ cabSyncStatus('未配置服务端代理地址。请到首页右上角「设置」中填写后同步。'); return; }
  cabSyncStatus('同步中...');
  sync.syncAll().then(function(st){
    if(st && st.status === 'ok'){
      cabSyncStatus('同步完成（下载 ' + st.pulled + ' 项 / 上传 ' + st.pushed + ' 项）');
    } else {
      cabSyncStatus('' + (st && st.status === 'unconfigured' ? '未配置家庭 ID' : '未配置代理地址'));
    }
    renderStats(); renderMembers(); renderDrugs();
  }).catch(function(e){
    cabSyncStatus('同步失败：' + (e && e.message || '网络错误'));
  });
}

// ===== Expiry logic =====
function daysToExpiry(expiry){
  if(!expiry) return 999;
  var parts = expiry.split('-');
  if(parts.length !== 3) return 999;
  // v7.1.2 修复:非法/溢出效期(2026-13-45、2026-02-31)此前被 Date 静默滚动成另一个日期,排序与徽标随即失真
  var y = parseInt(parts[0], 10), mo = parseInt(parts[1], 10), dy = parseInt(parts[2], 10);
  if(isNaN(y) || isNaN(mo) || isNaN(dy) || mo < 1 || mo > 12 || dy < 1 || dy > 31) return 999;
  var exp = new Date(y, mo-1, dy);
  if(exp.getFullYear() !== y || exp.getMonth() !== mo-1 || exp.getDate() !== dy) return 999;
  var now = new Date();
  now.setHours(0,0,0,0);
  exp.setHours(0,0,0,0);
  return Math.ceil((exp - now) / 86400000);
}
function expiryLabel(expiry){
  var d = daysToExpiry(expiry);
  if(d < 0) return '<span class="expiry-expired">已过期 '+Math.abs(d)+' 天</span>';
  if(d === 0) return '<span class="expiry-soon">今日到期!</span>';
  if(d <= 30) return '<span class="expiry-soon">'+d+'天后到期</span>';
  return '<span class="expiry-ok">'+expiry+'</span>';
}
function expiryClass(expiry){
  var d = daysToExpiry(expiry);
  if(d < 0) return 'badge-danger';
  if(d <= 30) return 'badge-warn';
  return 'badge-ok';
}

// ===== Render Stats =====
function renderStats(){
  var drugs = getCabinet();
  var total = drugs.length;
  var soon = 0, expired = 0;
  drugs.forEach(function(d){
    var d2e = daysToExpiry(d.expiry);
    if(d2e < 0) expired++;
    else if(d2e <= 30) soon++;
  });
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statSoon').textContent = soon;
  document.getElementById('statExpired').textContent = expired;
  var banner = document.getElementById('alertBanner');
  if(expired > 0){
    banner.className = 'alert-banner danger show';
    banner.innerHTML = '有 <b>'+expired+'</b> 种药品已过期，请及时处理！';
  } else if(soon > 0){
    banner.className = 'alert-banner show';
    banner.innerHTML = '有 <b>'+soon+'</b> 种药品即将到期（30天内），请注意使用。';
  } else {
    banner.className = 'alert-banner';
  }
}

// ===== Render Members =====
function renderMembers(){
  var members = getMembers();
  var el = document.getElementById('memberList');
  if(members.length === 0){
    el.innerHTML = '<span style="font-size:13px;color:#aaa">暂无成员，点击添加</span>';
    return;
  }
  var html = '<div class="member-chip'+(CURRENT_MEMBER===''?' active':'')+'" onclick="filterMember(\'\')">全部</div>';
  members.forEach(function(m){
    html += '<div class="member-chip'+(CURRENT_MEMBER===m.id?' active':'')+'" onclick="filterMember(\''+m.id+'\')">'+escHtml(m.name)+'</div>';
  });
  el.innerHTML = html;
}

function filterMember(id){
  CURRENT_MEMBER = id;
  renderMembers();
  renderDrugs();
  var badge = document.getElementById('filterBadge');
  if(id){
    var members = getMembers();
    var m = members.find(function(x){ return x.id === id; });
    badge.style.display = 'inline-block';
    badge.textContent = m ? m.name : id;
  } else {
    badge.style.display = 'none';
  }
}

// ===== Render Drugs =====
function renderDrugs(){
  var all = getCabinet();
  var drugs = CURRENT_MEMBER ? all.filter(function(d){ return d.member === CURRENT_MEMBER; }) : all;
  var el = document.getElementById('drugList');
  var titleEl = document.getElementById('drugListTitle');
  if(CURRENT_MEMBER){
    var members = getMembers();
    var m = members.find(function(x){ return x.id === CURRENT_MEMBER; });
    titleEl.textContent = ''+(m?m.name+'的药箱':'药箱');
  } else {
    titleEl.textContent = '我的药箱';
  }
  if(drugs.length === 0){
    el.innerHTML = '<div class="empty"><div class="empty-icon"></div><p>药箱空空如也<br><small style="color:#bbb">点击下方按钮添加第一盒药</small></p></div>';
    return;
  }
  // Sort: expired first, then by expiry
  drugs.sort(function(a,b){
    return daysToExpiry(a.expiry) - daysToExpiry(b.expiry);
  });
  var html = '';
  drugs.forEach(function(d){
    var icon = drugCatIcon(d.category);
    var expClass = expiryClass(d.expiry);
    var expLabel = expiryLabel(d.expiry);
    var memberLabel = d.member ? '<span style="font-size:11px;color:#888">· '+d.memberName+'</span>' : '';
    html += '<div class="drug-item">'+
      '<div class="drug-icon">'+icon+'</div>'+
      '<div class="drug-info">'+
        '<div class="drug-name">'+escHtml(d.name)+'</div>'+
        '<div class="drug-meta">'+(d.spec?'规格: '+escHtml(d.spec)+' · ':'')+'数量: '+(parseInt(d.qty,10)||0)+(d.dose?' · '+escHtml(d.dose):'')+memberLabel+'</div>'+
        '<div class="drug-meta" style="margin-top:2px">分类: '+escHtml(d.category||'其他')+' · 到期: '+expLabel+'</div>'+
      '</div>'+
      '<div class="drug-actions">'+
        '<button class="btn-xs" onclick="editDrug(\''+d.id+'\')">编辑</button>'+
        '<button class="btn-xs del" onclick="deleteDrug(\''+d.id+'\')">删除</button>'+
      '</div>'+
    '</div>';
  });
  el.innerHTML = html;

  // Low stock(v7.1.2 修复:原硬编码 <=3,与 v6.9 可配置阈值(默认5)口径冲突,同页出现两套"余量不足"结论)
  var lowStock = drugs.filter(function(d){
    var thr = 3;
    try { if(typeof v69itemConf === 'function') thr = v69itemConf(d.id).qtyMin; } catch(e){}
    if(!(thr > 0)) return false;
    return (parseInt(d.qty,10)||0) <= thr && daysToExpiry(d.expiry) > 0;
  });
  var lsCard = document.getElementById('lowStockCard');
  var lsEl = document.getElementById('lowStockList');
  if(lowStock.length > 0){
    lsCard.style.display = 'block';
    var lsHtml = '';
    lowStock.forEach(function(d){
      lsHtml += '<div class="drug-item">'+
        '<div class="drug-icon">'+drugCatIcon(d.category)+'</div>'+
        '<div class="drug-info"><div class="drug-name">'+escHtml(d.name)+'</div><div class="drug-meta">剩余 '+(parseInt(d.qty,10)||0)+' 单位</div></div>'+
        '<button class="btn-xs" onclick="editDrug(\''+d.id+'\')" style="background:#fff3e0;color:#e65100;border:1px solid #ffcc80">补充</button>'+
      '</div>';
    });
    lsEl.innerHTML = lsHtml;
  } else {
    lsCard.style.display = 'none';
  }
}

function drugCatIcon(cat){
  var icons = {
    '解热镇痛':'','抗生素':'','感冒药':'','胃肠道':'','心血管':'',
    '降糖药':'','外用药':'','维生素/补剂':'','中药/中成药':'','其他':''
  };
  return icons[cat] || '';
}

// ===== Drug CRUD =====
function openAddModal(memberId){
  EDIT_ID = null;
  document.getElementById('drugModalTitle').textContent = '添加药品';
  document.getElementById('drugSaveBtn').textContent = '保存';
  document.getElementById('drugName').value = '';
  document.getElementById('drugSpec').value = '';
  document.getElementById('drugQty').value = '';
  document.getElementById('drugExpiry').value = '';
  document.getElementById('drugDose').value = '';
  document.getElementById('drugCat').value = '解热镇痛';
  document.getElementById('drugNote').value = '';
  // Populate member dropdown
  var sel = document.getElementById('drugMember');
  sel.innerHTML = '<option value="">通用/共享</option>';
  var members = getMembers();
  members.forEach(function(m){
    var opt = document.createElement('option');
    opt.value = m.id;
    opt.textContent = m.name;
    sel.appendChild(opt);
  });
  if(memberId) sel.value = memberId;
  document.getElementById('drugModal').classList.add('show');
}

function editDrug(id){
  var drugs = getCabinet();
  var d = drugs.find(function(x){ return x.id === id; });
  if(!d) return;
  EDIT_ID = id;
  document.getElementById('drugModalTitle').textContent = '编辑药品';
  document.getElementById('drugSaveBtn').textContent = '更新';
  document.getElementById('drugName').value = d.name;
  document.getElementById('drugSpec').value = d.spec || '';
  document.getElementById('drugQty').value = d.qty;
  document.getElementById('drugExpiry').value = d.expiry || '';
  document.getElementById('drugDose').value = d.dose || '';
  document.getElementById('drugCat').value = d.category || '其他';
  document.getElementById('drugNote').value = d.note || '';
  var sel = document.getElementById('drugMember');
  sel.innerHTML = '<option value="">通用/共享</option>';
  var members = getMembers();
  members.forEach(function(m){
    var opt = document.createElement('option');
    opt.value = m.id;
    opt.textContent = m.name;
    sel.appendChild(opt);
  });
  sel.value = d.member || '';
  document.getElementById('drugModal').classList.add('show');
}

function saveDrug(){
  var name = document.getElementById('drugName').value.trim();
  if(!name){ alert('请输入药品名称'); return; }
  // v7.1.2 修复:原 parseInt(...)||1 会把录入的 0 悄悄改成 1,余量无法归零
  var qtyRaw = document.getElementById('drugQty').value.trim();
  var qtyParsed = parseInt(qtyRaw, 10);
  var qty = (qtyRaw === '' || isNaN(qtyParsed)) ? 1 : Math.max(0, qtyParsed);
  var expiry = document.getElementById('drugExpiry').value;
  var member = document.getElementById('drugMember').value;
  var members = getMembers();
  var memberName = member ? (members.find(function(m){ return m.id === member; })||{}).name || '' : '';
  var drugs = getCabinet();
  if(EDIT_ID){
    drugs = drugs.map(function(d){
      if(d.id === EDIT_ID){
        return Object.assign({}, d, {
          name: name, spec: document.getElementById('drugSpec').value.trim(),
          qty: qty, expiry: expiry, dose: document.getElementById('drugDose').value.trim(),
          category: document.getElementById('drugCat').value, note: document.getElementById('drugNote').value.trim(),
          member: member, memberName: memberName, updated: new Date().toISOString()
        });
      }
      return d;
    });
  } else {
    drugs.push({
      id: Date.now()+'',
      name: name, spec: document.getElementById('drugSpec').value.trim(),
      qty: qty, expiry: expiry, dose: document.getElementById('drugDose').value.trim(),
      category: document.getElementById('drugCat').value, note: document.getElementById('drugNote').value.trim(),
      member: member, memberName: memberName,
      created: new Date().toISOString()
    });
  }
  saveCabinet(drugs);
  closeDrugModal();
  renderStats();
  renderDrugs();
}

function deleteDrug(id){
  if(!confirm('确认删除该药品？')) return;
  var drugs = getCabinet().filter(function(d){ return d.id !== id; });
  saveCabinet(drugs);
  renderStats();
  renderDrugs();
}

function closeDrugModal(){
  document.getElementById('drugModal').classList.remove('show');
  EDIT_ID = null;
}

// ===== Member CRUD =====
function openMemberModal(){
  document.getElementById('memberName').value = '';
  document.getElementById('memberGender').value = '';
  document.getElementById('memberAge').value = '';
  document.getElementById('memberCondition').value = '';
  document.getElementById('memberModal').classList.add('show');
}

function saveMember(){
  var name = document.getElementById('memberName').value.trim();
  if(!name){ alert('请输入成员姓名'); return; }
  var members = getMembers();
  members.push({
    id: Date.now()+'',
    name: name,
    gender: document.getElementById('memberGender').value,
    age: document.getElementById('memberAge').value.trim(),
    condition: document.getElementById('memberCondition').value.trim()
  });
  saveMembers(members);
  closeMemberModal();
  renderMembers();
}

function closeMemberModal(){
  document.getElementById('memberModal').classList.remove('show');
}

// ===== Utils =====
function escHtml(s){
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ===== Init =====
function init(){
  renderStats();
  renderMembers();
  renderDrugs();
  // v5.5 自动同步（已配对时静默同步并刷新视图）
  try {
    var s = window.PharmacySync;
    if (s && s.hasConfig()) {
      s.syncAll().then(function(st){
        if (st && st.status === 'ok' && (st.pulled > 0 || st.pushed > 0)) {
          renderStats(); renderMembers(); renderDrugs();
        }
      });
    }
  } catch(e) {}
}
init();
</script>
<script>
// ===== v6.9 药箱智能提醒(纯新增:效期倒计时/使用人/数量与自定义提醒要求,不动任何旧代码) =====
var V69_KEY = 'family_pharmacist_cabinet_alert';
function v69getAlert(){ try { return JSON.parse(localStorage.getItem(V69_KEY) || '{}'); } catch(e){ return {}; } }
function v69setAlert(a){ try { localStorage.setItem(V69_KEY, JSON.stringify(a)); } catch(e){} }
function v69conf(){
  var a = v69getAlert();
  if(!a.global) a.global = { expDays: 60, qtyMin: 5 };
  if(!a.items) a.items = {};
  return a;
}
function v69itemConf(id){
  var a = v69conf();
  var g = a.global, it = a.items[id] || {};
  return {
    expDays: (it.expDays === null || it.expDays === undefined) ? g.expDays : it.expDays,
    qtyMin: (it.qtyMin === null || it.qtyMin === undefined) ? g.qtyMin : it.qtyMin
  };
}
function v69getCabinet(){ try { if(typeof getCabinet === 'function') return getCabinet(); } catch(e){} return []; }
function v69daysTo(expiry){ try { if(typeof daysToExpiry === 'function') return daysToExpiry(expiry); } catch(e){} return 999; }
function v69esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function v69check(){
  var drugs = v69getCabinet();
  var out = { expiring: [], expired: [], low: [] };
  drugs.forEach(function(d){
    var conf = v69itemConf(d.id);
    var days = v69daysTo(d.expiry);
    if(days < 0){ out.expired.push(d); }
    else if(conf.expDays > 0 && days <= conf.expDays){ out.expiring.push(d); }
    if(conf.qtyMin > 0 && (parseInt(d.qty) || 0) <= conf.qtyMin && days > 0){ out.low.push(d); }
  });
  return out;
}
function v69render(){
  var host = document.querySelector('.main');
  if(!host) return;
  var card = document.getElementById('v69Card');
  if(!card){
    card = document.createElement('div');
    card.id = 'v69Card';
    card.className = 'card';

  var a = v69conf();
  var g = a.global;
  var drugs = v69getCabinet();
  var chk = v69check();

    '<label style="font-size:12px;color:#666">余量不足阈值 <input id="v69GQty" type="number" min="0" max="999" value="' + g.qtyMin + '" style="width:60px;padding:4px 6px;border:1px solid #ddd;border-radius:6px"> 单位</label>' +
    '<button onclick="v69SaveGlobal()" style="padding:6px 14px;border:none;border-radius:8px;background:#2e7d32;color:#fff;font-size:13px;cursor:pointer">保存全局设置</button></div>';
  if(drugs.length){
    drugs.forEach(function(d){
      var conf = v69itemConf(d.id);
      var days = v69daysTo(d.expiry);
      var expHtml;
      if(!d.expiry) expHtml = '<span style="color:#999">未填效期</span>';

      else if(days === 0) expHtml = '<span style="color:#e65100;font-weight:600">今日到期</span>';

    });
  }
  card.innerHTML = html;

function v69SaveGlobal(){
  var a = v69conf();
  var e = parseInt(document.getElementById('v69GExp').value);
  var q = parseInt(document.getElementById('v69GQty').value);

  a.items[id].qtyMin = (q === '' || q === null) ? null : Math.max(0, Math.min(999, parseInt(q) || 0));

function v712legacyCopy(text){
  try{
    var ta=document.createElement('textarea');
    ta.value=text; ta.style.position='fixed'; ta.style.top='-1000px'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ ta.setSelectionRange(0, ta.value.length); }catch(e){}
    var ok=document.execCommand('copy'); ta.remove(); return ok;
  }catch(e){ return false; }
}
function v712copy(text, btn){

    if(!btn) return;

    setTimeout(function(){ try{ btn.textContent=old; }catch(e){} }, 1600);
  }
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ done(v712legacyCopy(text)); });

function v712visibleDrugs(){

function v712Observe(){
  try{
    if(v712Obs) v712Obs.disconnect();
    var host=document.getElementById('drugList');
    if(!host || !window.MutationObserver) return;
    v712Obs=new MutationObserver(function(){ v712ApplyFilter(); });
    v712Obs.observe(host,{childList:true});
  }catch(e){}
}
function v712syncCats(){
  var sel=document.getElementById('v712Cat');
  if(!sel) return;
  var cats={}, order=[];
  v712cab().forEach(function(d){ var c=d.category||'其他'; if(!cats[c]){ cats[c]=1; order.push(c); } });
  order.sort();
  var want=[''].concat(order).join('\u0001');
  if(sel.getAttribute('data-v712cats')===want) return;
  var keep=sel.value;
  sel.innerHTML='<option value="">全部分类</option>'+order.map(function(c){ return '<option value="'+v712esc(c)+'">'+v712esc(c)+'</option>'; }).join('');
  sel.setAttribute('data-v712cats', want);

function v712ApplyFilter(){
  try{ if(v712Obs) v712Obs.disconnect(); }catch(e){}
  v712syncCats();
  var host=document.getElementById('drugList');
  if(!host){ v712Observe(); return; }
  Array.prototype.forEach.call(host.querySelectorAll('[data-v712grp]'),function(n){ try{ n.remove(); }catch(e){} });
  var qEl=document.getElementById('v712Search'), cEl=document.getElementById('v712Cat'), gEl=document.getElementById('v712Group');
  var q=(qEl&&qEl.value||'').trim().toLowerCase();
  var cat=(cEl&&cEl.value)||'';
  var grp=!!(gEl&&gEl.checked);
  var items=host.querySelectorAll('.drug-item');
  var drugs=v712visibleDrugs();
  var matched=0, lastCat=null;
  Array.prototype.forEach.call(items,function(it,i){
    var d=drugs[i]||{};
    var hay=((d.name||'')+' '+(d.spec||'')+' '+(d.dose||'')+' '+(d.note||'')+' '+(d.memberName||'')+' '+(d.category||'')).toLowerCase();
    var ok=(!q || hay.indexOf(q)>=0) && (!cat || (d.category||'其他')===cat);
    if(ok){
      it.style.display='';
      matched++;
      if(grp){
        var c=d.category||'其他';
        if(c!==lastCat){
          var h=document.createElement('div');
          h.setAttribute('data-v712grp','1');
          h.textContent=c;
          h.style.cssText='font-size:12px;font-weight:600;color:#6f6657;margin:10px 0 4px;padding-left:8px;border-left:3px solid #ad402d;letter-spacing:1px';
          host.insertBefore(h,it);
          lastCat=c;
        }
      }
    } else { it.style.display='none'; }
  });
  if(items.length && matched===0){
    var e=document.createElement('div');
    e.setAttribute('data-v712grp','1');
    e.textContent='没有符合条件的药品（换个关键词，或清空筛选）';
    e.style.cssText='font-size:13px;color:#999;text-align:center;padding:16px 8px';

    else info.textContent='已筛选：' + matched + ' / ' + total + ' 种' + (q?(' · 关键词「'+v712esc(q)+'」'):'') + (cat?(' · 分类「'+v712esc(cat)+'」'):'');
  }
  v712Observe();
}

function v712listText(){
  var drugs=v712visibleDrugs();
  var cur=(typeof CURRENT_MEMBER!=='undefined')?CURRENT_MEMBER:'';
  var mname='';
  if(cur){ var m=v712members().find(function(x){ return x.id===cur; }); mname=m?m.name:'成员'; }
  var lines=[];
  lines.push('云晓药 · 家庭药箱清单（' + v712today() + '）');
  lines.push(mname ? ('使用人：' + mname) : '范围：全部成员');
  lines.push('共 ' + drugs.length + ' 种药品');
  lines.push('');
  var byCat={}, order=[];
  drugs.forEach(function(d){
    var c=d.category||'其他';
    if(!byCat[c]){ byCat[c]=[]; order.push(c); }
    byCat[c].push(d);
  });
  order.sort();
  order.forEach(function(c){
    lines.push('【' + c + '】');
    byCat[c].forEach(function(d){
      var exp='';
      if(!d.expiry) exp='效期未填';
      else { var dd=v712days(d.expiry); exp = dd<0 ? ('已过期'+(-dd)+'天') : (d.expiry + (dd<=30?('（'+dd+'天后到期）'):'')); }
      lines.push('  · ' + d.name + (d.spec?(' / '+d.spec):'') + ' | 余 ' + (parseInt(d.qty,10)||0) + ' | ' + exp + (d.memberName?(' | 使用人:'+d.memberName):'') + (d.dose?(' | '+d.dose):''));
    });
    lines.push('');
  });
  var expired=drugs.filter(function(d){ return v712days(d.expiry)<0; });
  var noexp=drugs.filter(function(d){ return !d.expiry; });
  var soon=drugs.filter(function(d){ var x=v712days(d.expiry); return x>=0 && x<=30; });
  var low=drugs.filter(function(d){ return (parseInt(d.qty,10)||0)<=3 && v712days(d.expiry)>0; });
  if(expired.length||soon.length||low.length||noexp.length){
    lines.push('—— 提示 ——');
    if(expired.length) lines.push('已过期：' + expired.map(function(d){ return d.name; }).join('、') + '（请勿服用，按安全处置指引处理）');
    if(soon.length) lines.push('30 天内到期：' + soon.map(function(d){ return d.name; }).join('、'));
    if(low.length) lines.push('余量不足：' + low.map(function(d){ return d.name; }).join('、') + '（建议补货）');
    if(noexp.length) lines.push('未填效期：' + noexp.map(function(d){ return d.name; }).join('、'));
  }
  lines.push('');
  lines.push('（本清单由云晓药生成，仅供家庭备药与就诊参考，不构成用药建议）');
  return lines.join('\n');
}

// ---------- 服药打卡 → 自动扣减库存(串联「提醒」模块与 v7.0 每次用量) ----------
function v712getDose(name){
  try{
    var d=JSON.parse(localStorage.getItem('family_pharmacist_v70_dose')||'{}');
    var n=parseFloat(d[name]);
    return (isNaN(n)||n<=0)?1:n;
  }catch(e){ return 1; }
}
function v712adherenceTaken(){
  try{
    var a=JSON.parse(localStorage.getItem('family_pharmacist_adherence')||'{}');
    if(a.date!==v712today()) return [];
    return a.taken||[];
  }catch(e){ return []; }
}
function v712findDrug(name){
  var arr=v712cab(), n=v712norm(name);
  if(!n) return null;
  var hit=null;
  arr.forEach(function(d){ if(!hit && v712norm(d.name)===n) hit=d; });
  if(hit) return hit;
  arr.forEach(function(d){ if(!hit){ var dn=v712norm(d.name); if(dn && (dn.indexOf(n)>=0 || n.indexOf(dn)>=0)) hit=d; } });
  return hit;
}
function v712autoDeduct(){
  var tk=v712today();
  var st=v712ls(V712_DEDUCT)||{};
  if(st.date!==tk) st={date:tk, processed:[], log:[], undo:[]};
  if(!st.processed) st.processed=[];
  if(!st.log) st.log=[];
  if(!st.undo) st.undo=[];
  var taken=v712adherenceTaken(), rems=v712reminders(), arr=v712cab();
  var changed=0, names=[];
  taken.forEach(function(rid){
    if(st.processed.indexOf(rid)>=0) return;
    st.processed.push(rid);
    var rem=null;
    rems.forEach(function(r){ if(String(r.id)===String(rid)) rem=r; });
    if(!rem) return;
    var d=v712findDrug(rem.drugName);
    if(!d) return;
    var per=v712getDose(d.name);
    var before=parseInt(d.qty,10)||0;
    var after=Math.max(0, before-per);
    arr=arr.map(function(x){ return x.id===d.id ? Object.assign({},x,{qty:after, updated:new Date().toISOString()}) : x; });
    st.log.unshift({ t:new Date().toISOString(), drug:d.name, qty:per, before:before, after:after });
    st.undo.unshift({ id:d.id, drug:d.name, qty:per });
    changed++;
    names.push(d.name + ' -' + per);
  });
  st.log=st.log.slice(0,20);
  st.undo=st.undo.slice(0,10);
  v712ls(V712_DEDUCT, st);
  if(changed){ v712saveCab(arr); v712refreshOld(); }
  return { changed:changed, names:names };
}
function v712undoDeduct(){
  var st=v712ls(V712_DEDUCT)||{};
  if(!st.undo || !st.undo.length){ v712toast('暂无可撤销的扣减记录'); return; }
  var u=st.undo.shift();
  var arr=v712cab().map(function(d){
    if(d.id===u.id) return Object.assign({},d,{qty:(parseInt(d.qty,10)||0)+u.qty, updated:new Date().toISOString()});
    return d;
  });
  v712saveCab(arr);
  v712ls(V712_DEDUCT, st);
  v712refreshOld(); v712renderAuto();
  v712toast('已撤销扣减：' + u.drug + ' +' + u.qty);
}

  var r=v712autoDeduct();

}

// ---------- 过期药安全处置指引 ----------
function v712disposeAdvice(d){
  var n=String(d.name||''), cat=String(d.category||'');
  var special=/抗生素|抗菌|抗肿瘤|激素|免疫|生物|疫苗|麻醉|精神|镇静|抗病毒|抗真菌|降糖|胰岛素|心血管|降压|抗凝/;
  var liquid=/口服液|糖浆|滴剂|喷雾|吸入|气雾|注射/;
  if(special.test(n)||special.test(cat)) return '属特殊管理药品：请勿自行丢弃、冲入下水道或混入生活垃圾，交连锁药店/医院药房过期药回收点处理。';
  if(liquid.test(n)||liquid.test(cat)) return '液体制剂/喷雾类：不要倒入下水道；将药液吸附在纸巾或密封袋内，连同包装交回收点。';
  if(/中药|中成药|饮片|颗粒/.test(cat)||/丸|散|膏|饮片/.test(n)) return '中药类：密封原包装后投入有害垃圾，或交药店回收点，避免散落被儿童/宠物误食。';
  return '普通固体制剂：取出药片并破坏包装（防止被误用），密封后投入有害垃圾，或交药店过期药回收点。';
}

      if(v712EditMemberId===m.id){
        html += '<div style="border:1px solid #d3c5a6;border-radius:10px;padding:10px;margin-bottom:8px;background:rgba(255,253,247,.95)">'+
          '<div style="font-size:12px;color:#6f6657;margin-bottom:6px">编辑成员信息（保存后名下药品的使用人同步更新）</div>'+
          '<input id="v712MemName" value="'+v712esc(m.name)+'" placeholder="姓名/昵称" style="'+V712_INP+'">'+
          '<div style="display:flex;gap:8px;margin:8px 0">'+
          '<select id="v712MemGender" style="'+V712_INP+'">'+
            ['','男','女'].map(function(g){ return '<option value="'+g+'"'+(String(m.gender||'')===g?' selected':'')+'>'+(g||'未知')+'</option>'; }).join('')+
          '</select>'+
          '<input id="v712MemAge" value="'+v712esc(m.age||'')+'" placeholder="年龄/出生年月" style="'+V712_INP+'"></div>'+
          '<input id="v712MemCond" value="'+v712esc(m.condition||'')+'" placeholder="慢性病史（可选）" style="'+V712_INP+'">'+
          '<div style="display:flex;gap:8px;margin-top:8px"><button onclick="v712saveMember(\''+m.id+'\')" style="'+V712_BTN1+'">保存</button>'+
          '<button onclick="v712cancelMember()" style="'+V712_BTN2+'">取消</button></div></div>';
      } else if(v712DelMemberId===m.id){
        html += '<div style="border:1px solid #e8c3ba;border-radius:10px;padding:10px;margin-bottom:8px;background:#fdf1ee">'+
          '<div style="font-size:13px;color:#ad402d;font-weight:600;margin-bottom:4px">删除「'+v712esc(m.name)+'」？</div>'+
          '<div style="font-size:12px;color:#7a4a3e;line-height:1.7;margin-bottom:8px">该成员名下有 <b>'+mine.length+'</b> 盒药。请选择处理方式：</div>'+
          '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
          '<button onclick="v712deleteMember(\''+m.id+'\',\'move\')" style="'+V712_BTN1+'">药品转为通用/共享</button>'+
          '<button onclick="v712deleteMember(\''+m.id+'\',\'delete\')" style="'+V712_BTN3+'">连同药品一起删除</button>'+
          '<button onclick="v712cancelMember()" style="'+V712_BTN2+'">取消</button></div></div>';
      } else {
        html += '<div style="display:flex;align-items:center;gap:8px;border-bottom:1px solid #f0e8d8;padding:8px 0">'+
          '<div style="flex:1;min-width:0">'+
          '<div style="font-size:14px;font-weight:600;color:#37322a">'+v712esc(m.name)+'</div>'+
          '<div style="font-size:11px;color:#6f6657">'+(m.gender?v712esc(m.gender)+' · ':'')+(m.age?v712esc(m.age)+' · ':'')+'名下 '+mine.length+' 盒药'+(m.condition?(' · '+v712esc(m.condition)):'')+'</div></div>'+
          '<button onclick="v712editMember(\''+m.id+'\')" style="'+V712_BTN2+'">编辑</button>'+
          '<button onclick="v712askDeleteMember(\''+m.id+'\')" style="'+V712_BTN3+'">删除</button></div>';
      }
    });
  }
  card.innerHTML=html;
}
function v712editMember(id){ v712EditMemberId=id; v712DelMemberId=null; v712renderMemberAdmin(); }
function v712askDeleteMember(id){ v712DelMemberId=id; v712EditMemberId=null; v712renderMemberAdmin(); }
function v712cancelMember(){ v712EditMemberId=null; v712DelMemberId=null; v712renderMemberAdmin(); }
function v712saveMember(id){
  var name=(document.getElementById('v712MemName').value||'').trim();
  if(!name){ v712toast('请输入成员姓名'); return; }
  var gender=document.getElementById('v712MemGender').value;
  var age=(document.getElementById('v712MemAge').value||'').trim();
  var cond=(document.getElementById('v712MemCond').value||'').trim();
  var members=v712members().map(function(m){
    if(m.id===id) return Object.assign({},m,{name:name,gender:gender,age:age,condition:cond});
    return m;
  });
  v712saveMem(members);
  var cab=v712cab().map(function(d){
    if(d.member===id) return Object.assign({},d,{memberName:name,updated:new Date().toISOString()});
    return d;
  });
  v712saveCab(cab);
  v712EditMemberId=null;
  v712refreshOld(); v712renderMemberAdmin(); v712renderToolbar(); v712ApplyFilter(); v712renderDispose();
  v712toast('已保存成员信息');
}
function v712deleteMember(id, mode){
  var members=v712members().filter(function(m){ return m.id!==id; });
  var cab=v712cab();
  if(mode==='delete') cab=cab.filter(function(d){ return d.member!==id; });
  else cab=cab.map(function(d){ return d.member===id ? Object.assign({},d,{member:'',memberName:'',updated:new Date().toISOString()}) : d; });
  v712saveMem(members); v712saveCab(cab);
  if(typeof CURRENT_MEMBER!=='undefined' && CURRENT_MEMBER===id) CURRENT_MEMBER='';
  v712DelMemberId=null;
  v712refreshOld(); v712renderMemberAdmin(); v712renderToolbar(); v712ApplyFilter(); v712renderDispose();
  v712toast(mode==='delete' ? '已删除成员及其名下药品' : '已删除成员，药品转为通用/共享');
}

// ---------- 初始化 ----------
function v712boot(){
  try{ v712renderToolbar(); }catch(e){}
  try{ v712renderMemberAdmin(); }catch(e){}
  try{
    var r=v712autoDeduct();
    if(r.changed) v712toast('已自动扣减库存：' + r.names.join('、'));
  }catch(e){}
  try{ v712renderAuto(); }catch(e){}
  try{ v712renderDispose(); }catch(e){}
  try{ v712ApplyFilter(); }catch(e){}
}
document.addEventListener('DOMContentLoaded', function(){
  setTimeout(function(){ v712boot(); }, 300);
});
document.addEventListener('visibilitychange', function(){
  if(!document.hidden){ try{ var r=v712autoDeduct(); v712renderAuto(); if(r.changed) v712renderDispose(); }catch(e){} }
});
// 只读轮询:提醒页打卡后(同源跨页)自动扣减,不影响旧渲染
setInterval(function(){
  try{
    var r=v712autoDeduct();
    if(r.changed){ v712renderAuto(); v712renderDispose(); v712toast('已按服药打卡扣减库存：' + r.names.join('、')); }
  }catch(e){}
}, 15000);
</script>
