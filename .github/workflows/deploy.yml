name: Deploy to Server (132.232.141.186:9033)

on:
  push:
    branches: [v2]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v2
        uses: actions/checkout@v4
        with:
          ref: v2

      - name: Upload index.html to server via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASS }}
          port: 22
          source: "index.html"
          target: "/home/xf/caiyun-app/public/"
          timeout: 30s

      - name: Verify deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASS }}
          port: 22
          script: |
            echo "=== 服务器文件验证 ==="
            wc -c /home/xf/caiyun-app/public/index.html
            grep -c 'fadeSlideUp' /home/xf/caiyun-app/public/index.html
            echo "=== nginx 无需重启（静态文件直读磁盘）==="
